<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Np1.15</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Roboto:wght@700&display=swap');

    :root {
      --color-bg-page: #0f1115;
      --color-border-default: #2c313a;
      --color-button-bg: #2b313b;
      --color-button-border: #48515f;
      --color-green-bg: #1f5b35;
      --color-green-border: #2e7d49;
      --text-primary: #f1f3f4;
      --text-muted: #9aa0a6;
      --font-title: 20px;
      --font-body: 14px;
      --font-meta: 12px;
      --grid-cell: 26px;
      --button-height-standard: 24px;
      --button-grid-gap: 2px;
      --button-radius-standard: 6px;
      --button-height: 40px;
      --button-radius: 8px;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      background: var(--color-bg-page);
      color: var(--text-primary);
      font-family: Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
      overflow-x: hidden;
    }

    .draft-grid {
      display: grid;
      grid-template-columns: repeat(16, var(--grid-cell));
      grid-auto-rows: var(--grid-cell);
      width: max-content;
      margin: 0 auto;
      border-top: 1px solid var(--color-border-default);
      border-left: 1px solid var(--color-border-default);
      background: var(--color-bg-page);
    }

    .grid-cell {
      position: relative;
      width: var(--grid-cell);
      height: var(--grid-cell);
      border-right: 1px solid var(--color-border-default);
      border-bottom: 1px solid var(--color-border-default);
    }

    .grid-cell.standard-button-color { background: var(--color-button-bg); }
    .grid-cell.standard-green-color { background: var(--color-green-bg); }

    .col-coordinate, .row-coordinate {
      position: absolute;
      color: var(--text-muted);
      font-size: var(--font-meta);
      font-weight: 700;
      line-height: 1;
      user-select: none;
      pointer-events: none;
    }

    .col-coordinate {
      top: 4px;
      left: 50%;
      transform: translateX(-50%);
    }

    .row-coordinate {
      left: 4px;
      bottom: 4px;
    }

    .page-title {
      grid-column: 1 / span 16;
      grid-row: 3 / span 2;
      z-index: 2;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 5px;
      color: var(--text-primary);
      font-size: var(--font-title);
      font-weight: 900;
      line-height: 1;
      background: transparent;
      pointer-events: none;
    }

    .button-standard {
      width: calc(100% - var(--button-grid-gap));
      height: var(--button-height-standard);
      padding: 0 10px;
      border: 1px solid var(--color-button-border);
      border-radius: var(--button-radius-standard);
      background: var(--color-button-bg);
      color: var(--text-primary);
      font-family: Roboto, Arial, sans-serif;
      font-size: 12px;
      font-weight: 700;
      line-height: 1;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      white-space: nowrap;
    }

    .view-mode-buttons-caps {
      grid-column: 2 / span 9;
      grid-row: 20;
      z-index: 3;
      display: grid;
      grid-template-columns: repeat(3, calc(var(--grid-cell) * 3));
      align-items: center;
      justify-items: center;
    }

    .main-button-caps {
      grid-column: 2 / span 3;
      grid-row: 21;
      z-index: 3;
      align-self: center;
      justify-self: center;
    }

    .color-standard-label {
      grid-column: 5 / span 5;
      z-index: 3;
      display: flex;
      align-items: center;
      padding-left: 8px;
      color: var(--text-primary);
      font-family: Roboto, Arial, sans-serif;
      font-size: 12px;
      font-weight: 700;
      pointer-events: none;
    }

    .color-standard-label-button { grid-row: 24; }
    .color-standard-label-green { grid-row: 25; }

    .version-bar {
      width: min(416px, 100%);
      margin: 8px auto 0;
      padding: 8px;
      display: grid;
      grid-template-columns: 1fr auto auto;
      gap: 6px;
      align-items: center;
      border: 1px solid var(--color-border-default);
      background: #171a21;
    }

    .version-label {
      min-width: 0;
      font-size: var(--font-body);
      font-weight: 900;
    }

    .version-button {
      min-width: 72px;
      height: var(--button-height);
      padding: 0 10px;
      border: 1px solid var(--color-button-border);
      border-radius: var(--button-radius);
      background: var(--color-button-bg);
      color: var(--text-primary);
      font: inherit;
      font-size: 13px;
      font-weight: 900;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .version-button:disabled { opacity: .5; }
  </style>
</head>
<body>
  <main id="grid" class="draft-grid" aria-label="Main page layout grid"></main>

  <div class="version-bar" aria-label="Version controls">
    <div class="version-label">Np1.15</div>
    <button id="updateButton" class="version-button" type="button">Update</button>
    <button id="downloadButton" class="version-button" type="button">Download</button>
  </div>

  <script>
    const NP_VERSION = '1.15';
    const RAW_ROOT = 'https://raw.githubusercontent.com/rxguzma/wh40k-11th/main/';
    const INDEX_PATH = 'np/index.json';

    const grid = document.getElementById('grid');
    const letters = 'ABCDEFGHIJKLMNOP';

    function addGridCells(fragment, page) {
      for (let row = 1; row <= 60; row += 1) {
        for (let col = 1; col <= 16; col += 1) {
          const cell = document.createElement('div');
          cell.className = 'grid-cell';
          cell.style.gridColumn = String(col);
          cell.style.gridRow = String(row);

          if (page === 'main' && row === 24 && col >= 2 && col <= 4) {
            cell.classList.add('standard-button-color');
          }
          if (page === 'main' && row === 25 && col >= 2 && col <= 4) {
            cell.classList.add('standard-green-color');
          }

          if (row === 1) {
            const letter = document.createElement('span');
            letter.className = 'col-coordinate';
            letter.textContent = letters[col - 1];
            cell.appendChild(letter);
          }

          if (col === 1) {
            const number = document.createElement('span');
            number.className = 'row-coordinate';
            number.textContent = String(row);
            cell.appendChild(number);
          }

          fragment.appendChild(cell);
        }
      }
    }

    function renderPage(page) {
      grid.replaceChildren();
      grid.setAttribute('aria-label', page === 'view' ? 'View page layout grid' : 'Main page layout grid');

      const fragment = document.createDocumentFragment();
      addGridCells(fragment, page);

      if (page === 'view') {
        const title = document.createElement('div');
        title.className = 'page-title';
        title.textContent = 'View';
        fragment.appendChild(title);
      }

      const modeButtons = document.createElement('div');
      modeButtons.className = 'view-mode-buttons-caps';

      ['VIEW', 'EDIT', 'CARD'].forEach((label) => {
        const button = document.createElement('button');
        button.type = 'button';
        button.className = 'button-standard';
        button.textContent = label;
        if (label === 'VIEW') button.addEventListener('click', () => renderPage('view'));
        modeButtons.appendChild(button);
      });

      fragment.appendChild(modeButtons);

      const mainButton = document.createElement('button');
      mainButton.type = 'button';
      mainButton.className = 'button-standard main-button-caps';
      mainButton.textContent = 'MAIN';
      mainButton.addEventListener('click', () => renderPage('main'));
      fragment.appendChild(mainButton);

      if (page === 'main') {
        const buttonLabel = document.createElement('div');
        buttonLabel.className = 'color-standard-label color-standard-label-button';
        buttonLabel.textContent = 'BUTTON';
        fragment.appendChild(buttonLabel);

        const greenLabel = document.createElement('div');
        greenLabel.className = 'color-standard-label color-standard-label-green';
        greenLabel.textContent = 'GREEN';
        fragment.appendChild(greenLabel);
      }

      grid.appendChild(fragment);
    }

    renderPage('main');

    function versionFile(version) { return `Np${version}.html`; }

    async function fetchText(path) {
      const controller = new AbortController();
      const timer = setTimeout(() => controller.abort(), 15000);
      try {
        const response = await fetch(`${RAW_ROOT}${path}?t=${Date.now()}`, {
          cache: 'no-store',
          credentials: 'omit',
          signal: controller.signal
        });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        return await response.text();
      } finally {
        clearTimeout(timer);
      }
    }

    async function updateToLatest() {
      const button = document.getElementById('updateButton');
      button.disabled = true;
      const originalText = button.textContent;
      button.textContent = 'Checking';
      try {
        const index = JSON.parse(await fetchText(INDEX_PATH));
        const latest = String(index.latest || '').trim();
        if (!latest) throw new Error('Missing latest version');
        if (latest === NP_VERSION) {
          button.textContent = 'Current';
          setTimeout(() => { button.textContent = originalText; button.disabled = false; }, 900);
          return;
        }
        const html = await fetchText(versionFile(latest));
        if (!html.includes(`const NP_VERSION = '${latest}'`)) throw new Error('Version mismatch');
        const url = URL.createObjectURL(new Blob([html], { type: 'text/html' }));
        window.location.href = url;
      } catch (_) {
        button.textContent = 'Retry';
        button.disabled = false;
      }
    }

    async function downloadRunningVersion() {
      const button = document.getElementById('downloadButton');
      button.disabled = true;
      const originalText = button.textContent;
      button.textContent = 'Preparing';
      try {
        const html = await fetchText(versionFile(NP_VERSION));
        const url = URL.createObjectURL(new Blob([html], { type: 'text/html' }));
        const anchor = document.createElement('a');
        anchor.href = url;
        anchor.download = versionFile(NP_VERSION);
        document.body.appendChild(anchor);
        anchor.click();
        anchor.remove();
        setTimeout(() => URL.revokeObjectURL(url), 30000);
        button.textContent = 'Downloaded';
        setTimeout(() => { button.textContent = originalText; button.disabled = false; }, 900);
      } catch (_) {
        button.textContent = 'Retry';
        button.disabled = false;
      }
    }

    document.getElementById('updateButton').addEventListener('click', updateToLatest);
    document.getElementById('downloadButton').addEventListener('click', downloadRunningVersion);
  </script>
</body>
</html>
