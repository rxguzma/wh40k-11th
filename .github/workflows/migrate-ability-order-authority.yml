name: Migrate Ability Order Authority

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/migrate-ability-order-authority.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Install schema validator
        run: python3 -m pip install --disable-pip-version-check --quiet 'jsonschema==4.25.1'

      - name: Make Ability Order authoritative
        run: |
          python3 - <<'PY'
          import csv
          import json
          import re
          from pathlib import Path

          root = Path('.')
          late_pattern = re.compile(r'^(UNIT COMPOSITION|LEADER|SUPPORT|TRANSPORT|LED BY)\b', re.I)
          ability_files = [
              root / 'data' / 'marines' / 'Abilities.csv',
              root / 'data' / 'orks' / 'Abilities.csv',
              root / 'data' / 'nids' / 'Abilities.csv',
              root / 'data' / 'universal' / 'Universal_Abilities.csv',
          ]

          for path in ability_files:
              with path.open(encoding='utf-8-sig', newline='') as handle:
                  reader = csv.DictReader(handle)
                  header = list(reader.fieldnames or [])
                  rows = list(reader)
              if 'Order' not in header:
                  raise SystemExit(f'{path}: missing Order column')
              migrated = {0: 0, 8: 0, 9: 0}
              for row in rows:
                  raw = str(row.get('Order') or '').strip()
                  if raw:
                      if not re.fullmatch(r'[0-9]', raw):
                          raise SystemExit(f'{path}: invalid existing Order {raw!r} for {row.get("Ability_ID")!r}')
                      continue
                  name = str(row.get('Ability Name') or row.get('Ability_Name') or row.get('Ability_ID') or '').strip()
                  tags = str(row.get('Tags') or '').strip()
                  if late_pattern.match(re.sub(r'\s+', ' ', name.upper())):
                      order = 9
                  elif tags:
                      order = 8
                  else:
                      order = 0
                  row['Order'] = str(order)
                  migrated[order] += 1
              with path.open('w', encoding='utf-8', newline='') as handle:
                  writer = csv.DictWriter(handle, fieldnames=header, lineterminator='\n')
                  writer.writeheader()
                  writer.writerows(rows)
              print(f'{path}: filled {sum(migrated.values())} blank Orders -> 0:{migrated[0]} 8:{migrated[8]} 9:{migrated[9]}')

          # CSV ownership contract: Order is now required, not an application fallback.
          schema_path = root / 'data' / 'CSV_SCHEMA.csv'
          with schema_path.open(encoding='utf-8-sig', newline='') as handle:
              reader = csv.DictReader(handle)
              schema_header = list(reader.fieldnames or [])
              schema_rows = list(reader)
          touched = []
          for row in schema_rows:
              file_name = str(row.get('File') or '').strip()
              column_name = str(row.get('Column_Name') or '').strip()
              if column_name != 'Order' or file_name not in {'Abilities.csv', 'Universal_Abilities.csv'}:
                  continue
              row['Required'] = 'YES'
              row['Ownership'] = 'AUTHORITATIVE'
              row['Notes'] = 'Required canonical Ability sort order 0-9. The application does not infer order from Ability name, type, Tags, or Effects.'
              touched.append(file_name)
          if 'Abilities.csv' not in touched:
              raise SystemExit('CSV_SCHEMA.csv: Abilities.csv Order schema row not found')
          if 'Universal_Abilities.csv' not in touched:
              raise SystemExit('CSV_SCHEMA.csv: Universal_Abilities.csv Order schema row not found')
          with schema_path.open('w', encoding='utf-8', newline='') as handle:
              writer = csv.DictWriter(handle, fieldnames=schema_header, lineterminator='\n')
              writer.writeheader()
              writer.writerows(schema_rows)

          # Permanent validator for all canonical Ability tables.
          validator_path = root / 'scripts' / 'validate_ability_orders.py'
          validator_path.write_text('''#!/usr/bin/env python3\nimport csv\nimport re\nfrom pathlib import Path\n\nROOT = Path(__file__).resolve().parents[1]\nFILES = [\n    ROOT / "data" / "marines" / "Abilities.csv",\n    ROOT / "data" / "orks" / "Abilities.csv",\n    ROOT / "data" / "nids" / "Abilities.csv",\n    ROOT / "data" / "universal" / "Universal_Abilities.csv",\n]\n\ndef fail(message):\n    raise SystemExit(message)\n\nfor path in FILES:\n    with path.open(encoding="utf-8-sig", newline="") as handle:\n        reader = csv.DictReader(handle)\n        header = list(reader.fieldnames or [])\n        if "Ability_ID" not in header or "Order" not in header:\n            fail(f"{path.relative_to(ROOT)} must contain Ability_ID and Order")\n        rows = list(reader)\n    seen = set()\n    for line_no, row in enumerate(rows, start=2):\n        ability_id = (row.get("Ability_ID") or "").strip()\n        order = (row.get("Order") or "").strip()\n        if not ability_id:\n            fail(f"{path.relative_to(ROOT)} line {line_no}: blank Ability_ID")\n        if ability_id in seen:\n            fail(f"{path.relative_to(ROOT)} line {line_no}: duplicate Ability_ID {ability_id!r}")\n        seen.add(ability_id)\n        if not re.fullmatch(r"[0-9]", order):\n            fail(f"{path.relative_to(ROOT)} line {line_no}: Ability {ability_id!r} requires Order 0-9, found {order!r}")\n    print(f"{path.relative_to(ROOT)}: {len(rows)} Ability Orders valid")\n''', encoding='utf-8')

          # Data Schema workflow permanently runs the Ability-order validator.
          workflow_path = root / '.github' / 'workflows' / 'data-schema.yml'
          text = workflow_path.read_text(encoding='utf-8')
          if "      - 'scripts/validate_ability_orders.py'\n" not in text:
              text = text.replace(
                  "      - 'scripts/validate_effects.py'\n",
                  "      - 'scripts/validate_effects.py'\n      - 'scripts/validate_ability_orders.py'\n"
              )
          step = """      - name: Validate canonical Ability orders\n        run: python3 scripts/validate_ability_orders.py\n\n"""
          if step not in text:
              anchor = """      - name: Reject New naming in canonical data\n"""
              if anchor not in text:
                  raise SystemExit('data-schema.yml validation anchor not found')
              text = text.replace(anchor, step + anchor, 1)
          workflow_path.write_text(text, encoding='utf-8')

          # Entity Ops ADD requires an explicit canonical Order; CHANGE validates it when supplied.
          entity_schema_path = root / 'schemas' / 'entity-ops.schema.json'
          entity_schema = json.loads(entity_schema_path.read_text(encoding='utf-8'))
          order_schema = {
              'oneOf': [
                  {'type': 'integer', 'minimum': 0, 'maximum': 9},
                  {'type': 'string', 'pattern': '^[0-9]$'},
              ]
          }
          for key in ('abilityAdd', 'abilityChange', 'universalAbilityAdd', 'universalAbilityChange'):
              entity_schema['$defs'][key]['properties']['Order'] = order_schema
          for key in ('abilityAdd', 'universalAbilityAdd'):
              required = entity_schema['$defs'][key].setdefault('required', [])
              if 'Order' not in required:
                  required.append('Order')
          entity_schema_path.write_text(json.dumps(entity_schema, separators=(',', ':')) + '\n', encoding='utf-8')
          PY

      - name: Generate compatibility outputs
        run: |
          python3 scripts/split_detachments_v2.py
          python3 scripts/split_units_v1.py
          python3 scripts/split_weapon_abilities_v1.py
          python3 scripts/split_loadouts_v1.py
          python3 scripts/split_effects_v1.py

      - name: Validate repository data
        run: |
          python3 scripts/data_schema.py normalize
          python3 scripts/audit_references.py
          python3 scripts/data_schema.py validate
          python3 scripts/validate_unit_relations.py
          python3 scripts/validate_weapon_abilities.py
          python3 scripts/validate_loadouts.py
          python3 scripts/validate_effects.py
          python3 scripts/validate_ability_orders.py
          python3 scripts/validate_no_new_names.py
          python3 scripts/data_schema.py manifest

      - name: Validate Entity Ops
        env:
          ENTITY_OPS_JSON: '{"version":1,"operations":[]}'
        run: python3 scripts/entity_ops.py

      - name: Commit migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- data scripts/validate_ability_orders.py .github/workflows/data-schema.yml schemas/entity-ops.schema.json
          if git diff --cached --quiet; then
            echo "Ability Order authority migration already current"
            exit 0
          fi
          git commit -m "Make Ability Order authoritative"
          git pull --rebase origin main
          git push
