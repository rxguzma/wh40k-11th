name: Patch HTML V31.5

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-html-v31-5.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Patch and validate V31.5
        run: python3 scripts/patch_html_v31_5.py

      - name: Publish version snapshot
        run: python3 scripts/publish_html.py

      - name: Commit V31.5 canonical HTML and release history
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add WH40k_11th.html versions
          git commit -m "Add View Stratagems to Abilities in V31.5"
          git push origin HEAD:main
