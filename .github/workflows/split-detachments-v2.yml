name: Split Detachments V2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/split-detachments-v2.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Split mixed detachment data
        run: python3 scripts/split_detachments_v2.py

      - name: Commit normalized detachment CSVs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- data/marines/Detachment_Definitions.csv data/marines/Enhancements.csv data/marines/Stratagems.csv data/marines/Army_Rules.csv
          git add -- data/orks/Detachment_Definitions.csv data/orks/Enhancements.csv data/orks/Stratagems.csv data/orks/Army_Rules.csv
          git add -- data/nids/Detachment_Definitions.csv data/nids/Enhancements.csv data/nids/Stratagems.csv data/nids/Army_Rules.csv
          git commit -m "Split detachment data into normalized CSVs"
          git push

# diagnostic rerun
