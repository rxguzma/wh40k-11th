name: Patch CSV

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-csv.yml'
  workflow_dispatch:
    inputs:
      patches:
        description: JSON list of operations. One run, one commit.
        required: true
        type: string

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply patches
        env:
          PATCHES: ${{ inputs.patches }}
        run: |
          python3 <<'PY'
          import csv, json, os, sys
          from pathlib import Path

          raw = r'[{"file":"data/orks/Abilities.csv","id_column":"Ability_ID","row_id":"HARDY_BILIOUS","sets":{"Tags":"[INCOMING -1 TO WOUND]","Tag Categories":"[Informational - Incoming]"}},{"file":"data/orks/Abilities.csv","id_column":"Ability_ID","row_id":"MOBILE_FORTRESS","sets":{"Tags":"[INCOMING RANGE -1 D]","Tag Categories":"[Informational - Incoming]"}},{"file":"data/orks/Abilities.csv","id_column":"Ability_ID","row_id":"DREAD_ARD","sets":{"Tags":"[INCOMING -1 D]","Tag Categories":"[Informational - Incoming]"}},{"file":"data/orks/Abilities.csv","id_column":"Ability_ID","row_id":"ARROGANT_INVULNERABILITY","sets":{"Tags":"[INCOMING -1 AP]","Tag Categories":"[Informational - Incoming]"}},{"file":"data/orks/Abilities.csv","id_column":"Ability_ID","row_id":"SQUIG_BARRAGE","sets":{"Tags":"[ENEMY -1 TO HIT]","Tag Categories":"[Informational - Enemy]"}},{"file":"data/orks/Abilities.csv","id_column":"Ability_ID","row_id":"FORTIFICATION","sets":{"Tags":"[OUTGOING RANGE -1 TO HIT] [ENEMY AUTO-PASS HAZARD]","Tag Categories":"[Informational - Outgoing] [Informational - Enemy]"}},{"file":"data/orks/Abilities.csv","id_column":"Ability_ID","row_id":"RAMSHACKLE_COVER","sets":{"Tags":"[TARGET GETS COVER]","Tag Categories":"[Informational - Enemy]"}},{"file":"data/orks/Abilities.csv","id_column":"Ability_ID","row_id":"MOBBED","sets":{"Tags":"[ENEMY -1 BATTLE-SHOCK] [ENEMY -2 BATTLE-SHOCK]","Tag Categories":"[Informational - Enemy] [Informational - Enemy]"}},{"file":"data/orks/Abilities.csv","id_column":"Ability_ID","row_id":"ROKKIT_BARRAGE","sets":{"Tags":"[ENEMY -1 BATTLE-SHOCK]","Tag Categories":"[Informational - Enemy]"}},{"file":"data/orks/Abilities.csv","id_column":"Ability_ID","row_id":"MADCAP_ARTILLERY","sets":{"Tags":"[TARGET GETS COVER] [ENEMY -1 LD] [ENEMY -2 M”] [ENEMY GROUNDED]","Tag Categories":"[Informational - Enemy] [Informational - Enemy] [Informational - Enemy] [Informational - Enemy]"}},{"file":"data/orks/Stratagems.csv","id_column":"Stratagem_ID","row_id":"orks_bully_boyz_stratagem_hulking_brutes_1cp","sets":{"Tags":"[INCOMING RANGE -1 TO WOUND]","Tag Categories":"[Informational - Incoming]"}},{"file":"data/orks/Stratagems.csv","id_column":"Stratagem_ID","row_id":"orks_kult_of_speed_stratagem_speediest_freeks_1cp","sets":{"Tags":"[INCOMING RANGE HIT 1-3 FAILS]","Tag Categories":"[Informational - Incoming]"}},{"file":"data/universal/Tag_Definitions.csv","id_column":"Tag_ID","row_id":"INFO_INCOMING_MINUS_1_WOUND","mode":"insert","sets":{"Display_Tag":"INCOMING -1 TO WOUND","Title":"Incoming -1 To Wound","Category":"Informational - Incoming","Affects":"Display only","Description":"Incoming attacks can suffer -1 to wound as described by the source rule. Informational only; no runtime effect.","Editable":"TRUE","Sort_Order":"900"}},{"file":"data/universal/Tag_Definitions.csv","id_column":"Tag_ID","row_id":"INFO_INCOMING_RANGE_MINUS_1_WOUND","mode":"insert","sets":{"Display_Tag":"INCOMING RANGE -1 TO WOUND","Title":"Incoming Ranged -1 To Wound","Category":"Informational - Incoming","Affects":"Display only","Description":"Incoming ranged attacks can suffer -1 to wound as described by the source rule. Informational only; no runtime effect.","Editable":"TRUE","Sort_Order":"901"}},{"file":"data/universal/Tag_Definitions.csv","id_column":"Tag_ID","row_id":"INFO_INCOMING_RANGE_MINUS_1_D","mode":"insert","sets":{"Display_Tag":"INCOMING RANGE -1 D","Title":"Incoming Ranged -1 Damage","Category":"Informational - Incoming","Affects":"Display only","Description":"Incoming ranged attacks have a damage reduction as described by the source rule. Informational only; no runtime effect.","Editable":"TRUE","Sort_Order":"902"}},{"file":"data/universal/Tag_Definitions.csv","id_column":"Tag_ID","row_id":"INFO_INCOMING_MINUS_1_D","mode":"insert","sets":{"Display_Tag":"INCOMING -1 D","Title":"Incoming -1 Damage","Category":"Informational - Incoming","Affects":"Display only","Description":"Incoming attacks have a damage reduction as described by the source rule. Informational only; no runtime effect.","Editable":"TRUE","Sort_Order":"903"}},{"file":"data/universal/Tag_Definitions.csv","id_column":"Tag_ID","row_id":"INFO_INCOMING_MINUS_1_AP","mode":"insert","sets":{"Display_Tag":"INCOMING -1 AP","Title":"Incoming AP Worsened","Category":"Informational - Incoming","Affects":"Display only","Description":"Incoming attacks have their AP worsened as described by the source rule. Informational only; no runtime effect.","Editable":"TRUE","Sort_Order":"904"}},{"file":"data/universal/Tag_Definitions.csv","id_column":"Tag_ID","row_id":"INFO_ENEMY_MINUS_1_TO_HIT","mode":"insert","sets":{"Display_Tag":"ENEMY -1 TO HIT","Title":"Enemy -1 To Hit","Category":"Informational - Enemy","Affects":"Display only","Description":"An affected enemy suffers -1 to hit as described by the source rule. Informational only; no runtime effect.","Editable":"TRUE","Sort_Order":"905"}},{"file":"data/universal/Tag_Definitions.csv","id_column":"Tag_ID","row_id":"INFO_OUTGOING_RANGE_MINUS_1_TO_HIT","mode":"insert","sets":{"Display_Tag":"OUTGOING RANGE -1 TO HIT","Title":"Outgoing Ranged -1 To Hit","Category":"Informational - Outgoing","Affects":"Display only","Description":"Outgoing ranged attacks suffer -1 to hit in the condition described by the source rule. Informational only; no runtime effect.","Editable":"TRUE","Sort_Order":"906"}},{"file":"data/universal/Tag_Definitions.csv","id_column":"Tag_ID","row_id":"INFO_ENEMY_AUTOPASS_HAZARD","mode":"insert","sets":{"Display_Tag":"ENEMY AUTO-PASS HAZARD","Title":"Enemy Auto-pass Hazard","Category":"Informational - Enemy","Affects":"Display only","Description":"An affected enemy automatically passes hazard rolls in the condition described by the source rule. Informational only; no runtime effect.","Editable":"TRUE","Sort_Order":"907"}},{"file":"data/universal/Tag_Definitions.csv","id_column":"Tag_ID","row_id":"INFO_TARGET_GETS_COVER","mode":"insert","sets":{"Display_Tag":"TARGET GETS COVER","Title":"Target Gets Cover","Category":"Informational - Enemy","Affects":"Display only","Description":"The affected target receives the Benefit of Cover as described by the source rule. Informational only; no runtime effect.","Editable":"TRUE","Sort_Order":"908"}},{"file":"data/universal/Tag_Definitions.csv","id_column":"Tag_ID","row_id":"INFO_ENEMY_MINUS_1_BATTLESHOCK","mode":"insert","sets":{"Display_Tag":"ENEMY -1 BATTLE-SHOCK","Title":"Enemy -1 Battle-shock","Category":"Informational - Enemy","Affects":"Display only","Description":"An affected enemy suffers -1 to its Battle-shock roll as described by the source rule. Informational only; no runtime effect.","Editable":"TRUE","Sort_Order":"909"}},{"file":"data/universal/Tag_Definitions.csv","id_column":"Tag_ID","row_id":"INFO_ENEMY_MINUS_2_BATTLESHOCK","mode":"insert","sets":{"Display_Tag":"ENEMY -2 BATTLE-SHOCK","Title":"Enemy -2 Battle-shock","Category":"Informational - Enemy","Affects":"Display only","Description":"An affected enemy suffers -2 to its Battle-shock roll as described by the source rule. Informational only; no runtime effect.","Editable":"TRUE","Sort_Order":"910"}},{"file":"data/universal/Tag_Definitions.csv","id_column":"Tag_ID","row_id":"INFO_ENEMY_MINUS_1_LD","mode":"insert","sets":{"Display_Tag":"ENEMY -1 LD","Title":"Enemy -1 Leadership","Category":"Informational - Enemy","Affects":"Display only","Description":"An affected enemy suffers -1 Leadership as described by the source rule. Informational only; no runtime effect.","Editable":"TRUE","Sort_Order":"911"}},{"file":"data/universal/Tag_Definitions.csv","id_column":"Tag_ID","row_id":"INFO_ENEMY_MINUS_2_M","mode":"insert","sets":{"Display_Tag":"ENEMY -2 M”","Title":"Enemy -2 Movement","Category":"Informational - Enemy","Affects":"Display only","Description":"An affected enemy suffers -2 Movement as described by the source rule. Informational only; no runtime effect.","Editable":"TRUE","Sort_Order":"912"}},{"file":"data/universal/Tag_Definitions.csv","id_column":"Tag_ID","row_id":"INFO_ENEMY_GROUNDED","mode":"insert","sets":{"Display_Tag":"ENEMY GROUNDED","Title":"Enemy Grounded","Category":"Informational - Enemy","Affects":"Display only","Description":"An affected enemy is grounded as described by the source rule. Informational only; no runtime effect.","Editable":"TRUE","Sort_Order":"913"}},{"file":"data/universal/Tag_Definitions.csv","id_column":"Tag_ID","row_id":"INFO_INCOMING_RANGE_HIT_1_3_FAILS","mode":"insert","sets":{"Display_Tag":"INCOMING RANGE HIT 1-3 FAILS","Title":"Incoming Ranged Hits 1-3 Fail","Category":"Informational - Incoming","Affects":"Display only","Description":"Incoming ranged attacks fail on unmodified hit rolls of 1-3 as described by the source rule. Informational only; no runtime effect.","Editable":"TRUE","Sort_Order":"914"}}]'
          try:
              ops = json.loads(raw)
          except json.JSONDecodeError as e:
              sys.exit(f'patches is not JSON: {e}')
          if not isinstance(ops, list) or not ops:
              sys.exit('patches must be a non-empty JSON list')

          def decode(val):
              if val is None:
                  return ''
              s = str(val)
              return s.replace('\\n', '\n')

          def load_csv(path):
              if path.is_absolute() or '..' in path.parts:
                  sys.exit(f'bad path {path}')
              if not str(path).startswith('data/') or path.suffix.lower() != '.csv':
                  sys.exit(f'file must be a .csv under data/: {path}')
              if not path.is_file():
                  sys.exit(f'missing {path}')
              with path.open(encoding='utf-8', newline='') as f:
                  rows = list(csv.reader(f))
              if not rows:
                  sys.exit(f'empty csv {path}')
              return rows

          files = {}
          changed = set()

          for i, op in enumerate(ops):
              if not isinstance(op, dict):
                  sys.exit(f'op {i} is not an object')
              path = Path(str(op.get('file', '')).strip())
              if path not in files:
                  files[path] = load_csv(path)
              rows = files[path]
              header = rows[0]
              id_col = str(op.get('id_column') or '').strip() or header[0]
              if id_col not in header:
                  sys.exit(f'op {i}: id column not in header: {id_col}')
              i_id = header.index(id_col)
              row_id = str(op.get('row_id') or '').strip()
              if not row_id:
                  sys.exit(f'op {i}: row_id required')
              mode = str(op.get('mode') or 'update').strip()

              if mode == 'add_column':
                  col = str(op.get('column') or '').strip()
                  if not col:
                      sys.exit(f'op {i}: add_column needs column')
                  if col in header:
                      print(f'column already exists {path} {col}')
                      continue
                  after_col = str(op.get('after_column') or '').strip()
                  if after_col and after_col not in header:
                      sys.exit(f'op {i}: after column not in header: {after_col}')
                  insert_at = header.index(after_col) + 1 if after_col else len(header)
                  old_width = len(header)
                  header.insert(insert_at, col)
                  for row in rows[1:]:
                      while len(row) < old_width:
                          row.append('')
                      row.insert(insert_at, '')
                  changed.add(path)
                  print(f'added column {path} {col}')
                  continue

              if mode == 'dedupe_by_key':
                  key_col = str(op.get('key_column') or '').strip()
                  if key_col not in header:
                      sys.exit(f'op {i}: key column not in header: {key_col}')
                  i_key = header.index(key_col)
                  kept = [header]
                  seen = set()
                  matched = 0
                  removed = 0
                  for row in rows[1:]:
                      if not row:
                          continue
                      while len(row) < len(header):
                          row.append('')
                      if row[i_id] != row_id:
                          kept.append(row)
                          continue
                      matched += 1
                      key = row[i_key].strip()
                      if not key:
                          sys.exit(f'op {i}: blank {key_col} while deduping {row_id!r}')
                      if key in seen:
                          removed += 1
                          continue
                      seen.add(key)
                      kept.append(row)
                  if matched < 1:
                      sys.exit(f'op {i}: found no rows for {row_id!r}')
                  if removed < 1:
                      sys.exit(f'op {i}: found no duplicate rows for {row_id!r}')
                  files[path] = kept
                  changed.add(path)
                  print(f'deduped {path} {row_id}: kept {len(seen)} unique {key_col} values, removed {removed} duplicates')
                  continue

              if mode == 'fill_blank_where':
                  match_col = str(op.get('match_column') or '').strip()
                  col = str(op.get('column') or '').strip()
                  if match_col not in header:
                      sys.exit(f'op {i}: match column not in header: {match_col}')
                  if col not in header:
                      sys.exit(f'op {i}: column not in header: {col}')
                  match_value = decode(op.get('match_value')).strip()
                  new = decode(op.get('value'))
                  if not match_value:
                      sys.exit(f'op {i}: match_value required')
                  if new == '':
                      sys.exit(f'op {i}: value required')
                  i_match = header.index(match_col)
                  i_col = header.index(col)
                  hits = 0
                  for row in rows[1:]:
                      if not row:
                          continue
                      while len(row) < len(header):
                          row.append('')
                      if row[i_match].strip() == match_value and not row[i_col].strip():
                          row[i_col] = new
                          hits += 1
                  if hits < 1:
                      sys.exit(f'op {i}: found no blank {col} values where {match_col}={match_value!r}')
                  changed.add(path)
                  print(f'filled {hits} blank {col} values in {path} where {match_col}={match_value!r}')
                  continue

              if mode == 'replace_text':
                  col = str(op.get('column') or '').strip()
                  if col not in header:
                      sys.exit(f'op {i}: column not in header: {col}')
                  old = decode(op.get('from'))
                  new = decode(op.get('to'))
                  if not old:
                      sys.exit(f'op {i}: replace_text needs non-empty from')
                  i_col = header.index(col)
                  hits = 0
                  for row in rows[1:]:
                      if not row:
                          continue
                      while len(row) < len(header):
                          row.append('')
                      if old in row[i_col]:
                          row[i_col] = row[i_col].replace(old, new)
                          hits += 1
                  if hits < 1:
                      sys.exit(f'op {i}: replace_text found no matches for {old!r}')
                  changed.add(path)
                  print(f'replaced {old!r} in {hits} rows of {path} column {col}')
                  continue

              if mode == 'delete':
                  kept = [header]
                  hits = 0
                  for row in rows[1:]:
                      if not row:
                          continue
                      if len(row) > i_id and row[i_id] == row_id:
                          hits += 1
                          continue
                      kept.append(row)
                  if hits != 1:
                      sys.exit(f'op {i}: expected 1 row for {row_id!r}, found {hits}')
                  files[path] = kept
                  changed.add(path)
                  print(f'deleted {path} {row_id}')
                  continue

              if mode == 'insert':
                  existing = 0
                  for row in rows[1:]:
                      if row and len(row) > i_id and row[i_id] == row_id:
                          existing += 1
                  if existing:
                      sys.exit(f'op {i}: row already exists: {row_id}')
                  sets = op.get('sets')
                  if not isinstance(sets, dict) or not sets:
                      sys.exit(f'op {i}: insert needs sets')
                  new_row = [''] * len(header)
                  new_row[i_id] = row_id
                  for col, val in sets.items():
                      if col not in header:
                          sys.exit(f'op {i}: column not in header: {col}')
                      new_row[header.index(col)] = decode(val)
                  after = str(op.get('after_row_id') or '').strip()
                  if after:
                      placed = False
                      kept = [header]
                      for row in rows[1:]:
                          kept.append(row)
                          if row and len(row) > i_id and row[i_id] == after:
                              kept.append(new_row)
                              placed = True
                      if not placed:
                          sys.exit(f'op {i}: after_row_id not found: {after}')
                      files[path] = kept
                  else:
                      rows.append(new_row)
                      files[path] = rows
                  changed.add(path)
                  print(f'inserted {path} {row_id}')
                  continue

              if mode != 'update':
                  sys.exit(f'op {i}: unknown mode {mode}')

              sets = op.get('sets')
              if not isinstance(sets, dict) or not sets:
                  sets = {}
                  if op.get('column'):
                      sets[str(op['column'])] = op.get('value', '')
                  if op.get('column_2'):
                      sets[str(op['column_2'])] = op.get('value_2', '')
              if not sets:
                  sys.exit(f'op {i}: update needs sets or column/value')

              hits = 0
              for row in rows[1:]:
                  if not row:
                      continue
                  while len(row) < len(header):
                      row.append('')
                  if row[i_id] != row_id:
                      continue
                  for col, val in sets.items():
                      if col not in header:
                          sys.exit(f'op {i}: column not in header: {col}')
                      row[header.index(col)] = decode(val)
                  hits += 1
              if hits != 1:
                  sys.exit(f'op {i}: expected 1 row for {row_id!r}, found {hits}')
              changed.add(path)
              print(f'updated {path} {row_id} {list(sets)}')

          for path, rows in files.items():
              if path not in changed:
                  continue
              with path.open('w', newline='', encoding='utf-8') as f:
                  csv.writer(f, lineterminator='\n').writerows(rows)
          print('changed', ' '.join(str(p) for p in sorted(changed)))
          PY

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- data
          if git diff --cached --quiet; then
            echo "No change"
            exit 0
          fi
          git commit -m "Patch CSV line items"
          git push
