acks gain LETHAL HITS and PSYCHIC\\nTest on D6, battle-shock on a 1 [LETHAL HITS]"},{"file":"data/orks/Abilities.csv","id_column":"Ability_ID","row_id":"TIDE_OF_MUSCLE","column":"Short_Description","value":"CHARGE this turn — MELEE [LETHAL HITS]"},{"file":"data/orks/Abilities.csv","id_column":"Ability_ID","row_id":"ARROGANT_INVULNERABILITY","column":"Short_Description","value":"Incoming attacks\u003A -1 AP [INCOMING -1 AP]"},{"file":"data/orks/Abilities.csv","id_column":"Ability_ID","row_id":"BIG_AN_SHOOTY","column":"Short_Description","value":"ANYTIME — RANGE [RE-ROLL 1S TO HIT]"},{"file":"data/orks/Abilities.csv","id_column":"Ability_ID","row_id":"BIG_AN_STOMPY","column":"Short_Description","value":"ANYTIME — MELEE [RE-ROLL 1S TO HIT]"},{"file":"data/orks/Abilities.csv","id_column":"Ability_ID","row_id":"DAMAGED_7","column":"Short_Description","value":"While 1–7 wounds remaining [-1 TO HIT] [-1 TO HIT]"},{"file":"data/orks/Abilities.csv","id_column":"Ability_ID","row_id":"DREAD_ARD","column":"Short_Description","value":"ANYTIME — incoming attacks [INCOMING -1 D]"},{"file":"data/orks/Abilities.csv","id_column":"Ability_ID","row_id":"INTIMIDATING_MOTIVATION","column":"Short_Description","value":"Once per Battle Round\\nStart or End of Movement\\nOrks 6\" un-shock and RILED UP. [INTIMIDATING MOTIVATION]"},{"file":"data/orks/Abilities.csv","id_column":"Ability_ID","row_id":"MOBILE_ARSENAL","column":"Short_Description","value":"SHOOTING\u003A Re-roll 1s To Hit [RE-ROLL 1S TO HIT]"},{"file":"data/orks/Abilities.csv","id_column":"Ability_ID","row_id":"NAZDREGS_KNOW_WOTZ","column":"Short_Description","value":"Ranged\u003A IGNORES COVER [DEEP STRIKE] [IGNORES COVER]"},{"file":"data/orks/Abilities.csv","id_column":"Ability_ID","row_id":"SPITEFUL_POWER_TRIP","column":"Short_Description","value":"vs units with no T7+ models [+1 TO HIT] [+1 TO HIT]"},{"file":"data/orks/Abilities.csv","id_column":"Ability_ID","row_id":"DA_JUMP","column":"Short_Description","value":"Psychic\u003