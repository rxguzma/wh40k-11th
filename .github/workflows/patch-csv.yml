name: Patch CSV

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-csv.yml'
  workflow_dispatch:
    inputs:
      patches:
        description: JSON list of operations. One run, one commit.
        required: true
        type: string

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply patches
        env:
          PATCHES: ${{ inputs.patches }}
        run: |
          python3 <<'PY'
          import csv, json, os, sys
          from pathlib import Path

          raw = os.environ.get('PATCHES', '').strip()
          if not raw:
              raw = '[{"file":"data/nids/Units.csv","id_column":"Unit_ID","row_id":"BIOVORE","column":"Hyperlink","value":"https://wahapedia.ru/wh40k11ed/factions/tyranids/Biovores"},{"file":"data/nids/Units.csv","id_column":"Unit_ID","row_id":"BROODLORD","column":"Hyperlink","value":"https://wahapedia.ru/wh40k11ed/factions/tyranids/Broodlord"},{"file":"data/nids/Units.csv","id_column":"Unit_ID","row_id":"CARNIFEX_VENOM_CANNON_CRUSHING_CLAWS","column":"Hyperlink","value":"https://wahapedia.ru/wh40k11ed/factions/tyranids/Carnifexes"},{"file":"data/nids/Units.csv","id_column":"Unit_ID","row_id":"CARNIFEXES","column":"Hyperlink","value":"https://wahapedia.ru/wh40k11ed/factions/tyranids/Carnifexes"},{"file":"data/nids/Units.csv","id_column":"Unit_ID","row_id":"DEATHLEAPER","column":"Hyperlink","value":"https://wahapedia.ru/wh40k11ed/factions/tyranids/Deathleaper"},{"file":"data/nids/Units.csv","id_column":"Unit_ID","row_id":"EXOCRINE","column":"Hyperlink","value":"https://wahapedia.ru/wh40k11ed/factions/tyranids/Exocrine"},{"file":"data/nids/Units.csv","id_column":"Unit_ID","row_id":"GARGOYLES","column":"Hyperlink","value":"https://wahapedia.ru/wh40k11ed/factions/tyranids/Gargoyles"},{"file":"data/nids/Units.csv","id_column":"Unit_ID","row_id":"GENESTEALERS","column":"Hyperlink","value":"https://wahapedia.ru/wh40k11ed/factions/tyranids/Genestealers"},{"file":"data/nids/Units.csv","id_column":"Unit_ID","row_id":"HARUSPEX","column":"Hyperlink","value":"https://wahapedia.ru/wh40k11ed/factions/tyranids/Haruspex"},{"file":"data/nids/Units.csv","id_column":"Unit_ID","row_id":"HIVE_GUARD","column":"Hyperlink","value":"https://wahapedia.ru/wh40k11ed/factions/tyranids/Hive-Guard"},{"file":"data/nids/Units.csv","id_column":"Unit_ID","row_id":"HIVE_TYRANT","column":"Hyperlink","value":"https://wahapedia.ru/wh40k11ed/factions/tyranids/Hive-Tyrant"},{"file":"data/nids/Units.csv","id_column":"Unit_ID","row_id":"HORMAGAUNTS","column":"Hyperlink","value":"https://wahapedia.ru/wh40k11ed/factions/tyranids/Hormagaunts"},{"file":"data/nids/Units.csv","id_column":"Unit_ID","row_id":"HYPERADAPTED_RAVENERS","column":"Hyperlink","value":"https://wahapedia.ru/wh40k11ed/factions/tyranids/Hyperadapted-Raveners"},{"file":"data/nids/Units.csv","id_column":"Unit_ID","row_id":"LICTOR","column":"Hyperlink","value":"https://wahapedia.ru/wh40k11ed/factions/tyranids/Lictor"},{"file":"data/nids/Units.csv","id_column":"Unit_ID","row_id":"MALECEPTOR","column":"Hyperlink","value":"https://wahapedia.ru/wh40k11ed/factions/tyranids/Maleceptor"},{"file":"data/nids/Units.csv","id_column":"Unit_ID","row_id":"MAWLOC","column":"Hyperlink","value":"https://wahapedia.ru/wh40k11ed/factions/tyranids/Mawloc"},{"file":"data/nids/Units.csv","id_column":"Unit_ID","row_id":"NEUROGAUNTS","column":"Hyperlink","value":"https://wahapedia.ru/wh40k11ed/factions/tyranids/Neurogaunts"},{"file":"data/nids/Units.csv","id_column":"Unit_ID","row_id":"NEUROLICTOR","column":"Hyperlink","value":"https://wahapedia.ru/wh40k11ed/factions/tyranids/Neurolictor"},{"file":"data/nids/Units.csv","id_column":"Unit_ID","row_id":"NEUROTYRANT","column":"Hyperlink","value":"https://wahapedia.ru/wh40k11ed/factions/tyranids/Neurotyrant"},{"file":"data/nids/Units.csv","id_column":"Unit_ID","row_id":"NORN_ASSIMILATOR","column":"Hyperlink","value":"https://wahapedia.ru/wh40k11ed/factions/tyranids/Norn-Assimilator"},{"file":"data/nids/Units.csv","id_column":"Unit_ID","row_id":"NORN_EMISSARY","column":"Hyperlink","value":"https://wahapedia.ru/wh40k11ed/factions/tyranids/Norn-Emissary"},{"file":"data/nids/Units.csv","id_column":"Unit_ID","row_id":"OLD_ONE_EYE","column":"Hyperlink","value":"https://wahapedia.ru/wh40k11ed/factions/tyranids/Old-One-Eye"},{"file":"data/nids/Units.csv","id_column":"Unit_ID","row_id":"PSYCHOPHAGE","column":"Hyperlink","value":"https://wahapedia.ru/wh40k11ed/factions/tyranids/Psychophage"},{"file":"data/nids/Units.csv","id_column":"Unit_ID","row_id":"PYROVORE","column":"Hyperlink","value":"https://wahapedia.ru/wh40k11ed/factions/tyranids/Pyrovores"},{"file":"data/nids/Units.csv","id_column":"Unit_ID","row_id":"RAVENERS","column":"Hyperlink","value":"https://wahapedia.ru/wh40k11ed/factions/tyranids/Raveners"},{"file":"data/nids/Units.csv","id_column":"Unit_ID","row_id":"SCREAMER_KILLER","column":"Hyperlink","value":"https://wahapedia.ru/wh40k11ed/factions/tyranids/Screamer-killer"},{"file":"data/nids/Units.csv","id_column":"Unit_ID","row_id":"TERMAGANTS","column":"Hyperlink","value":"https://wahapedia.ru/wh40k11ed/factions/tyranids/Termagants"},{"file":"data/nids/Units.csv","id_column":"Unit_ID","row_id":"TERVIGON","column":"Hyperlink","value":"https://wahapedia.ru/wh40k11ed/factions/tyranids/Tervigon"},{"file":"data/nids/Units.csv","id_column":"Unit_ID","row_id":"THE_RED_TERROR","column":"Hyperlink","value":"https://wahapedia.ru/wh40k11ed/factions/tyranids/The-Red-Terror"},{"file":"data/nids/Units.csv","id_column":"Unit_ID","row_id":"THE_SWARMLORD","column":"Hyperlink","value":"https://wahapedia.ru/wh40k11ed/factions/tyranids/The-Swarmlord"},{"file":"data/nids/Units.csv","id_column":"Unit_ID","row_id":"TOXICRENE","column":"Hyperlink","value":"https://wahapedia.ru/wh40k11ed/factions/tyranids/Toxicrene"},{"file":"data/nids/Units.csv","id_column":"Unit_ID","row_id":"TRYGON","column":"Hyperlink","value":"https://wahapedia.ru/wh40k11ed/factions/tyranids/Trygon"},{"file":"data/nids/Units.csv","id_column":"Unit_ID","row_id":"TRYGON_HQ","column":"Hyperlink","value":"https://wahapedia.ru/wh40k11ed/factions/tyranids/Trygon"},{"file":"data/nids/Units.csv","id_column":"Unit_ID","row_id":"TRYGON_PRIME","column":"Hyperlink","value":"https://wahapedia.ru/wh40k11ed/factions/tyranids/Trygon"},{"file":"data/nids/Units.csv","id_column":"Unit_ID","row_id":"TYRANID_WARRIORS_WITH_MELEE_BIO_WEAPONS","column":"Hyperlink","value":"https://wahapedia.ru/wh40k11ed/factions/tyranids/Tyranid-Warriors-With-Melee-Bio-weapons"},{"file":"data/nids/Units.csv","id_column":"Unit_ID","row_id":"TYRANID_WARRIORS_WITH_RANGED_BIO_WEAPONS","column":"Hyperlink","value":"https://wahapedia.ru/wh40k11ed/factions/tyranids/Tyranid-Warriors-With-Ranged-Bio-weapons"},{"file":"data/nids/Units.csv","id_column":"Unit_ID","row_id":"TYRANNOFEX_ACID_SPRAY","column":"Hyperlink","value":"https://wahapedia.ru/wh40k11ed/factions/tyranids/Tyrannofex"},{"file":"data/nids/Units.csv","id_column":"Unit_ID","row_id":"TYRANNOFEX_RUPTURE_CANNON","column":"Hyperlink","value":"https://wahapedia.ru/wh40k11ed/factions/tyranids/Tyrannofex"},{"file":"data/nids/Units.csv","id_column":"Unit_ID","row_id":"TYRANT_GUARD_BONE_CLEAVER","column":"Hyperlink","value":"https://wahapedia.ru/wh40k11ed/factions/tyranids/Tyrant-Guard"},{"file":"data/nids/Units.csv","id_column":"Unit_ID","row_id":"TYRANT_GUARD_CLAWS","column":"Hyperlink","value":"https://wahapedia.ru/wh40k11ed/factions/tyranids/Tyrant-Guard"},{"file":"data/nids/Units.csv","id_column":"Unit_ID","row_id":"VENOMTHROPES","column":"Hyperlink","value":"https://wahapedia.ru/wh40k11ed/factions/tyranids/Venomthropes"},{"file":"data/nids/Units.csv","id_column":"Unit_ID","row_id":"VON_RYANS_LEAPERS","column":"Hyperlink","value":"https://wahapedia.ru/wh40k11ed/factions/tyranids/Von-Ryan-s-Leapers"},{"file":"data/nids/Units.csv","id_column":"Unit_ID","row_id":"WINGED_HIVE_TYRANT","column":"Hyperlink","value":"https://wahapedia.ru/wh40k11ed/factions/tyranids/Winged-Hive-Tyrant"},{"file":"data/nids/Units.csv","id_column":"Unit_ID","row_id":"WINGED_TYRANID_PRIME","column":"Hyperlink","value":"https://wahapedia.ru/wh40k11ed/factions/tyranids/Winged-Tyranid-Prime"},{"file":"data/nids/Units.csv","id_column":"Unit_ID","row_id":"ZOANTHROPES","column":"Hyperlink","value":"https://wahapedia.ru/wh40k11ed/factions/tyranids/Zoanthropes"}]'
          try:
              ops = json.loads(raw)
          except json.JSONDecodeError as e:
              sys.exit(f'patches is not JSON: {e}')
          if not isinstance(ops, list) or not ops:
              sys.exit('patches must be a non-empty JSON list')

          def decode(val):
              if val is None:
                  return ''
              s = str(val)
              return s.replace('\\n', '\n')

          def load_csv(path):
              if path.is_absolute() or '..' in path.parts:
                  sys.exit(f'bad path {path}')
              if not str(path).startswith('data/') or path.suffix.lower() != '.csv':
                  sys.exit(f'file must be a .csv under data/: {path}')
              if not path.is_file():
                  sys.exit(f'missing {path}')
              with path.open(encoding='utf-8', newline='') as f:
                  rows = list(csv.reader(f))
              if not rows:
                  sys.exit(f'empty csv {path}')
              return rows

          files = {}
          changed = set()

          for i, op in enumerate(ops):
              if not isinstance(op, dict):
                  sys.exit(f'op {i} is not an object')
              path = Path(str(op.get('file', '')).strip())
              if path not in files:
                  files[path] = load_csv(path)
              rows = files[path]
              header = rows[0]
              id_col = str(op.get('id_column') or '').strip() or header[0]
              if id_col not in header:
                  sys.exit(f'op {i}: id column not in header: {id_col}')
              i_id = header.index(id_col)
              row_id = str(op.get('row_id') or '').strip()
              if not row_id:
                  sys.exit(f'op {i}: row_id required')
              mode = str(op.get('mode') or 'update').strip()

              if mode == 'delete':
                  kept = [header]
                  hits = 0
                  for row in rows[1:]:
                      if not row:
                          continue
                      if len(row) > i_id and row[i_id] == row_id:
                          hits += 1
                          continue
                      kept.append(row)
                  if hits != 1:
                      sys.exit(f'op {i}: expected 1 row for {row_id!r}, found {hits}')
                  files[path] = kept
                  changed.add(path)
                  print(f'deleted {path} {row_id}')
                  continue

              if mode == 'insert':
                  existing = 0
                  for row in rows[1:]:
                      if row and len(row) > i_id and row[i_id] == row_id:
                          existing += 1
                  if existing:
                      sys.exit(f'op {i}: row already exists: {row_id}')
                  sets = op.get('sets')
                  if not isinstance(sets, dict) or not sets:
                      sys.exit(f'op {i}: insert needs sets')
                  new_row = [''] * len(header)
                  new_row[i_id] = row_id
                  for col, val in sets.items():
                      if col not in header:
                          sys.exit(f'op {i}: column not in header: {col}')
                      new_row[header.index(col)] = decode(val)
                  after = str(op.get('after_row_id') or '').strip()
                  if after:
                      placed = False
                      kept = [header]
                      for row in rows[1:]:
                          kept.append(row)
                          if row and len(row) > i_id and row[i_id] == after:
                              kept.append(new_row)
                              placed = True
                      if not placed:
                          sys.exit(f'op {i}: after_row_id not found: {after}')
                      files[path] = kept
                  else:
                      rows.append(new_row)
                      files[path] = rows
                  changed.add(path)
                  print(f'inserted {path} {row_id}')
                  continue

              if mode != 'update':
                  sys.exit(f'op {i}: unknown mode {mode}')

              sets = op.get('sets')
              if not isinstance(sets, dict) or not sets:
                  sets = {}
                  if op.get('column'):
                      sets[str(op['column'])] = op.get('value', '')
                  if op.get('column_2'):
                      sets[str(op['column_2'])] = op.get('value_2', '')
              if not sets:
                  sys.exit(f'op {i}: update needs sets or column/value')

              hits = 0
              for row in rows[1:]:
                  if not row:
                      continue
                  while len(row) < len(header):
                      row.append('')
                  if row[i_id] != row_id:
                      continue
                  for col, val in sets.items():
                      if col not in header:
                          sys.exit(f'op {i}: column not in header: {col}')
                      row[header.index(col)] = decode(val)
                  hits += 1
              if hits != 1:
                  sys.exit(f'op {i}: expected 1 row for {row_id!r}, found {hits}')
              changed.add(path)
              print(f'updated {path} {row_id} {list(sets)}')

          for path, rows in files.items():
              if path not in changed:
                  continue
              with path.open('w', newline='', encoding='utf-8') as f:
                  csv.writer(f, lineterminator='\n').writerows(rows)
          print('changed', ' '.join(str(p) for p in sorted(changed)))
          PY

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- data
          if git diff --cached --quiet; then
            echo "No change"
            exit 0
          fi
          git commit -m "Patch CSV line items"
          git push