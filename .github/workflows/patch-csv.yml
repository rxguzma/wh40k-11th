name: Patch CSV

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-csv.yml'
  workflow_dispatch:
    inputs:
      patches:
        description: JSON list of operations. One run, one commit.
        required: true
        type: string

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply patches
        env:
          PATCHES: ${{ inputs.patches || '[{"file":"data/universal/Tag_Definitions.csv","id_column":"Tag_ID","row_id":"*","mode":"delete_where","where":{"Display_Tag":"+1 TO HIT"}},{"file":"data/universal/Tag_Definitions.csv","id_column":"Tag_ID","row_id":"MECHANIC_PLUS_1_TO_HIT","mode":"insert","sets":{"Display_Tag":"+1 TO HIT","Title":"+1 To Hit","Category":"Combat Modifiers","Affects":"Attacks","Description":"Improves Hit rolls by 1 when routed by the owning Ability controls.","Editable":"TRUE","Effect_Type":"ROLL_MODIFIER","Target":"","Stat":"HIT","Operation":"IMPROVE","Value":"1","Sort_Order":"201"}},{"file":"data/universal/Tag_Definitions.csv","id_column":"Tag_ID","row_id":"*","mode":"delete_where","where":{"Display_Tag":"+1 TO WOUND"}},{"file":"data/universal/Tag_Definitions.csv","id_column":"Tag_ID","row_id":"MECHANIC_PLUS_1_TO_WOUND","mode":"insert","sets":{"Display_Tag":"+1 TO WOUND","Title":"+1 To Wound","Category":"Combat Modifiers","Affects":"Attacks","Description":"Improves Wound rolls by 1 when routed by the owning Ability controls.","Editable":"TRUE","Effect_Type":"ROLL_MODIFIER","Target":"","Stat":"WOUND","Operation":"IMPROVE","Value":"1","Sort_Order":"202"}},{"file":"data/universal/Tag_Definitions.csv","id_column":"Tag_ID","row_id":"*","mode":"delete_where","where":{"Display_Tag":"RE-ROLL 1S TO HIT"}},{"file":"data/universal/Tag_Definitions.csv","id_column":"Tag_ID","row_id":"MECHANIC_REROLL_1S_TO_HIT","mode":"insert","sets":{"Display_Tag":"RE-ROLL 1S TO HIT","Title":"Re-roll 1s To Hit","Category":"Combat Modifiers","Affects":"Attacks","Description":"Re-rolls Hit rolls of 1 when routed by the owning Ability controls.","Editable":"TRUE","Effect_Type":"REROLL","Target":"","Stat":"HIT","Operation":"ONES","Value":"1","Sort_Order":"203"}},{"file":"data/universal/Tag_Definitions.csv","id_column":"Tag_ID","row_id":"*","mode":"delete_where","where":{"Display_Tag":"RE-ROLL ALL HITS"}},{"file":"data/universal/Tag_Definitions.csv","id_column":"Tag_ID","row_id":"MECHANIC_REROLL_ALL_HITS","mode":"insert","sets":{"Display_Tag":"RE-ROLL ALL HITS","Title":"Re-roll All Hits","Category":"Combat Modifiers","Affects":"Attacks","Description":"Re-rolls all Hit rolls when routed by the owning Ability controls.","Editable":"TRUE","Effect_Type":"REROLL","Target":"","Stat":"HIT","Operation":"ALL","Value":"1","Sort_Order":"204"}},{"file":"data/universal/Tag_Definitions.csv","id_column":"Tag_ID","row_id":"*","mode":"delete_where","where":{"Display_Tag":"RE-ROLL 1S TO WOUND"}},{"file":"data/universal/Tag_Definitions.csv","id_column":"Tag_ID","row_id":"MECHANIC_REROLL_1S_TO_WOUND","mode":"insert","sets":{"Display_Tag":"RE-ROLL 1S TO WOUND","Title":"Re-roll 1s To Wound","Category":"Combat Modifiers","Affects":"Attacks","Description":"Re-rolls Wound rolls of 1 when routed by the owning Ability controls.","Editable":"TRUE","Effect_Type":"REROLL","Target":"","Stat":"WOUND","Operation":"ONES","Value":"1","Sort_Order":"205"}},{"file":"data/universal/Tag_Definitions.csv","id_column":"Tag_ID","row_id":"*","mode":"delete_where","where":{"Display_Tag":"RE-ROLL ALL WOUNDS"}},{"file":"data/universal/Tag_Definitions.csv","id_column":"Tag_ID","row_id":"MECHANIC_REROLL_ALL_WOUNDS","mode":"insert","sets":{"Display_Tag":"RE-ROLL ALL WOUNDS","Title":"Re-roll All Wounds","Category":"Combat Modifiers","Affects":"Attacks","Description":"Re-rolls all Wound rolls when routed by the owning Ability controls.","Editable":"TRUE","Effect_Type":"REROLL","Target":"","Stat":"WOUND","Operation":"ALL","Value":"1","Sort_Order":"206"}},{"file":"data/universal/Tag_Definitions.csv","id_column":"Tag_ID","row_id":"*","mode":"delete_where","where":{"Display_Tag":"-1 TO HIT"}},{"file":"data/universal/Tag_Definitions.csv","id_column":"Tag_ID","row_id":"MECHANIC_MINUS_1_TO_HIT","mode":"insert","sets":{"Display_Tag":"-1 TO HIT","Title":"-1 To Hit","Category":"Combat Modifiers","Affects":"Attacks","Description":"Worsens Hit rolls by 1 when routed by the owning Ability controls.","Editable":"TRUE","Effect_Type":"ROLL_MODIFIER","Target":"","Stat":"HIT","Operation":"WORSEN","Value":"1","Sort_Order":"207"}},{"file":"data/universal/Tag_Definitions.csv","id_column":"Tag_ID","row_id":"*","mode":"delete_where","where":{"Display_Tag":"-1 TO WOUND"}},{"file":"data/universal/Tag_Definitions.csv","id_column":"Tag_ID","row_id":"MECHANIC_MINUS_1_TO_WOUND","mode":"insert","sets":{"Display_Tag":"-1 TO WOUND","Title":"-1 To Wound","Category":"Combat Modifiers","Affects":"Attacks","Description":"Worsens Wound rolls by 1 when routed by the owning Ability controls.","Editable":"TRUE","Effect_Type":"ROLL_MODIFIER","Target":"","Stat":"WOUND","Operation":"WORSEN","Value":"1","Sort_Order":"208"}},{"file":"data/universal/Tag_Definitions.csv","id_column":"Tag_ID","row_id":"*","mode":"delete_where","where":{"Display_Tag":"LETHAL HITS"}},{"file":"data/universal/Tag_Definitions.csv","id_column":"Tag_ID","row_id":"MECHANIC_LETHAL_HITS","mode":"insert","sets":{"Display_Tag":"LETHAL HITS","Title":"Lethal Hits","Category":"Weapon Rules","Affects":"Weapons","Description":"Adds Lethal Hits when routed by the owning Ability controls.","Editable":"TRUE","Effect_Type":"WEAPON_RULE","Target":"","Stat":"LETHAL_HITS","Operation":"SET","Value":"1","Sort_Order":"301"}},{"file":"data/universal/Tag_Definitions.csv","id_column":"Tag_ID","row_id":"*","mode":"delete_where","where":{"Display_Tag":"DEVASTATING WOUNDS"}},{"file":"data/universal/Tag_Definitions.csv","id_column":"Tag_ID","row_id":"MECHANIC_DEVASTATING_WOUNDS","mode":"insert","sets":{"Display_Tag":"DEVASTATING WOUNDS","Title":"Devastating Wounds","Category":"Weapon Rules","Affects":"Weapons","Description":"Adds Devastating Wounds when routed by the owning Ability controls.","Editable":"TRUE","Effect_Type":"WEAPON_RULE","Target":"","Stat":"DEVASTATING_WOUNDS","Operation":"SET","Value":"1","Sort_Order":"302"}},{"file":"data/universal/Tag_Definitions.csv","id_column":"Tag_ID","row_id":"*","mode":"delete_where","where":{"Display_Tag":"TWIN-LINKED"}},{"file":"data/universal/Tag_Definitions.csv","id_column":"Tag_ID","row_id":"MECHANIC_TWIN_LINKED","mode":"insert","sets":{"Display_Tag":"TWIN-LINKED","Title":"Twin-linked","Category":"Weapon Rules","Affects":"Weapons","Description":"Adds Twin-linked when routed by the owning Ability controls.","Editable":"TRUE","Effect_Type":"WEAPON_RULE","Target":"","Stat":"TWIN_LINKED","Operation":"SET","Value":"1","Sort_Order":"303"}},{"file":"data/universal/Tag_Definitions.csv","id_column":"Tag_ID","row_id":"*","mode":"delete_where","where":{"Display_Tag":"SUSTAINED HITS 1"}},{"file":"data/universal/Tag_Definitions.csv","id_column":"Tag_ID","row_id":"MECHANIC_SUSTAINED_HITS_1","mode":"insert","sets":{"Display_Tag":"SUSTAINED HITS 1","Title":"Sustained Hits 1","Category":"Weapon Rules","Affects":"Weapons","Description":"Adds Sustained Hits 1 when routed by the owning Ability controls.","Editable":"TRUE","Effect_Type":"WEAPON_RULE","Target":"","Stat":"SUSTAINED_HITS","Operation":"SET","Value":"1","Sort_Order":"304"}},{"file":"data/universal/Tag_Definitions.csv","id_column":"Tag_ID","row_id":"*","mode":"delete_where","where":{"Display_Tag":"SUSTAINED HITS 2"}},{"file":"data/universal/Tag_Definitions.csv","id_column":"Tag_ID","row_id":"MECHANIC_SUSTAINED_HITS_2","mode":"insert","sets":{"Display_Tag":"SUSTAINED HITS 2","Title":"Sustained Hits 2","Category":"Weapon Rules","Affects":"Weapons","Description":"Adds Sustained Hits 2 when routed by the owning Ability controls.","Editable":"TRUE","Effect_Type":"WEAPON_RULE","Target":"","Stat":"SUSTAINED_HITS","Operation":"SET","Value":"2","Sort_Order":"305"}},{"file":"data/universal/Tag_Definitions.csv","id_column":"Tag_ID","row_id":"*","mode":"delete_where","where":{"Display_Tag":"ANTI-VEHICLE 3+"}},{"file":"data/universal/Tag_Definitions.csv","id_column":"Tag_ID","row_id":"MECHANIC_ANTI_VEHICLE_3","mode":"insert","sets":{"Display_Tag":"ANTI-VEHICLE 3+","Title":"Anti-Vehicle 3+","Category":"Weapon Rules","Affects":"Weapons","Description":"Adds Anti-Vehicle 3+ when routed by the owning Ability controls.","Editable":"TRUE","Effect_Type":"WEAPON_RULE","Target":"","Stat":"ANTI_VEHICLE","Operation":"SET","Value":"3","Sort_Order":"308"}},{"file":"data/universal/Tag_Definitions.csv","id_column":"Tag_ID","row_id":"*","mode":"delete_where","where":{"Display_Tag":"ANTI-INFANTRY 4+"}},{"file":"data/universal/Tag_Definitions.csv","id_column":"Tag_ID","row_id":"MECHANIC_ANTI_INFANTRY_4","mode":"insert","sets":{"Display_Tag":"ANTI-INFANTRY 4+","Title":"Anti-Infantry 4+","Category":"Weapon Rules","Affects":"Weapons","Description":"Adds Anti-Infantry 4+ when routed by the owning Ability controls.","Editable":"TRUE","Effect_Type":"WEAPON_RULE","Target":"","Stat":"ANTI_INFANTRY","Operation":"SET","Value":"4","Sort_Order":"309"}},{"file":"data/universal/Tag_Definitions.csv","id_column":"Tag_ID","row_id":"*","mode":"delete_where","where":{"Display_Tag":"CRITS 5+"}},{"file":"data/universal/Tag_Definitions.csv","id_column":"Tag_ID","row_id":"MECHANIC_CRITS_5_PLUS","mode":"insert","sets":{"Display_Tag":"CRITS 5+","Title":"Crits 5+","Category":"Weapon Rules","Affects":"Weapons","Description":"Critical hits occur on unmodified 5+ when routed by the owning Ability controls.","Editable":"TRUE","Effect_Type":"WEAPON_RULE","Target":"","Stat":"CRITS","Operation":"SET","Value":"5","Sort_Order":"310"}},{"file":"data/universal/Tag_Definitions.csv","id_column":"Tag_ID","row_id":"*","mode":"delete_where","where":{"Display_Tag":"PRECISION"}},{"file":"data/universal/Tag_Definitions.csv","id_column":"Tag_ID","row_id":"MECHANIC_PRECISION","mode":"insert","sets":{"Display_Tag":"PRECISION","Title":"Precision","Category":"Weapon Rules","Affects":"Weapons","Description":"Adds Precision when routed by the owning Ability controls.","Editable":"TRUE","Effect_Type":"WEAPON_RULE","Target":"","Stat":"PRECISION","Operation":"SET","Value":"1","Sort_Order":"311"}},{"file":"data/universal/Tag_Definitions.csv","id_column":"Tag_ID","row_id":"*","mode":"delete_where","where":{"Display_Tag":"HAZARDOUS"}},{"file":"data/universal/Tag_Definitions.csv","id_column":"Tag_ID","row_id":"MECHANIC_HAZARDOUS","mode":"insert","sets":{"Display_Tag":"HAZARDOUS","Title":"Hazardous","Category":"Weapon Rules","Affects":"Weapons","Description":"Adds Hazardous when routed by the owning Ability controls.","Editable":"TRUE","Effect_Type":"WEAPON_RULE","Target":"","Stat":"HAZARDOUS","Operation":"SET","Value":"1","Sort_Order":"312"}},{"file":"data/universal/Tag_Definitions.csv","id_column":"Tag_ID","row_id":"*","mode":"delete_where","where":{"Display_Tag":"+1 A"}},{"file":"data/universal/Tag_Definitions.csv","id_column":"Tag_ID","row_id":"MECHANIC_PLUS_1_A","mode":"insert","sets":{"Display_Tag":"+1 A","Title":"+1 Attack","Category":"Weapon Stats","Affects":"Weapons","Description":"Adds 1 Attack when routed by the owning Ability controls.","Editable":"TRUE","Effect_Type":"WEAPON_STAT","Target":"","Stat":"A","Operation":"ADD","Value":"1","Sort_Order":"401"}},{"file":"data/universal/Tag_Definitions.csv","id_column":"Tag_ID","row_id":"*","mode":"delete_where","where":{"Display_Tag":"+1 S"}},{"file":"data/universal/Tag_Definitions.csv","id_column":"Tag_ID","row_id":"MECHANIC_PLUS_1_S","mode":"insert","sets":{"Display_Tag":"+1 S","Title":"+1 Strength","Category":"Weapon Stats","Affects":"Weapons","Description":"Adds 1 Strength when routed by the owning Ability controls.","Editable":"TRUE","Effect_Type":"WEAPON_STAT","Target":"","Stat":"S","Operation":"ADD","Value":"1","Sort_Order":"402"}},{"file":"data/universal/Tag_Definitions.csv","id_column":"Tag_ID","row_id":"*","mode":"delete_where","where":{"Display_Tag":"+2 S"}},{"file":"data/universal/Tag_Definitions.csv","id_column":"Tag_ID","row_id":"MECHANIC_PLUS_2_S","mode":"insert","sets":{"Display_Tag":"+2 S","Title":"+2 Strength","Category":"Weapon Stats","Affects":"Weapons","Description":"Adds 2 Strength when routed by the owning Ability controls.","Editable":"TRUE","Effect_Type":"WEAPON_STAT","Target":"","Stat":"S","Operation":"ADD","Value":"2","Sort_Order":"403"}},{"file":"data/universal/Tag_Definitions.csv","id_column":"Tag_ID","row_id":"*","mode":"delete_where","where":{"Display_Tag":"+1 AP"}},{"file":"data/universal/Tag_Definitions.csv","id_column":"Tag_ID","row_id":"MECHANIC_PLUS_1_AP","mode":"insert","sets":{"Display_Tag":"+1 AP","Title":"+1 AP","Category":"Weapon Stats","Affects":"Weapons","Description":"Improves AP by 1 when routed by the owning Ability controls.","Editable":"TRUE","Effect_Type":"WEAPON_STAT","Target":"","Stat":"AP","Operation":"IMPROVE","Value":"1","Sort_Order":"404"}},{"file":"data/universal/Tag_Definitions.csv","id_column":"Tag_ID","row_id":"*","mode":"delete_where","where":{"Display_Tag":"+1 D"}},{"file":"data/universal/Tag_Definitions.csv","id_column":"Tag_ID","row_id":"MECHANIC_PLUS_1_D","mode":"insert","sets":{"Display_Tag":"+1 D","Title":"+1 Damage","Category":"Weapon Stats","Affects":"Weapons","Description":"Adds 1 Damage when routed by the owning Ability controls.","Editable":"TRUE","Effect_Type":"WEAPON_STAT","Target":"","Stat":"D","Operation":"ADD","Value":"1","Sort_Order":"405"}}]' }}
        run: |
          python3 <<'PY'
          import csv, json, os, sys
          from pathlib import Path

          raw = os.environ.get('PATCHES') or ''
          if not raw.strip():
              print('no PATCHES input; skip apply')
              raise SystemExit(0)
          try:
              ops = json.loads(raw)
          except json.JSONDecodeError as e:
              sys.exit(f'patches is not JSON: {e}')
          if not isinstance(ops, list) or not ops:
              sys.exit('patches must be a non-empty JSON list')

          def decode(val):
              if val is None:
                  return ''
              s = str(val)
              return s.replace('\\n', '\n')

          def load_csv(path):
              if path.is_absolute() or '..' in path.parts:
                  sys.exit(f'bad path {path}')
              if not str(path).startswith('data/') or path.suffix.lower() != '.csv':
                  sys.exit(f'file must be a .csv under data/: {path}')
              if not path.is_file():
                  sys.exit(f'missing {path}')
              with path.open(encoding='utf-8', newline='') as f:
                  rows = list(csv.reader(f))
              if not rows:
                  sys.exit(f'empty csv {path}')
              return rows

          files = {}
          changed = set()

          for i, op in enumerate(ops):
              if not isinstance(op, dict):
                  sys.exit(f'op {i} is not an object')
              path = Path(str(op.get('file', '')).strip())
              if path not in files:
                  files[path] = load_csv(path)
              rows = files[path]
              header = rows[0]
              id_col = str(op.get('id_column') or '').strip() or header[0]
              if id_col not in header:
                  sys.exit(f'op {i}: id column not in header: {id_col}')
              i_id = header.index(id_col)
              row_id = str(op.get('row_id') or '').strip()
              if not row_id:
                  sys.exit(f'op {i}: row_id required')
              mode = str(op.get('mode') or 'update').strip()

              if mode == 'add_column':
                  col = str(op.get('column') or '').strip()
                  if not col:
                      sys.exit(f'op {i}: add_column needs column')
                  if col in header:
                      print(f'column already exists {path} {col}')
                      continue
                  after_col = str(op.get('after_column') or '').strip()
                  if after_col and after_col not in header:
                      sys.exit(f'op {i}: after column not in header: {after_col}')
                  insert_at = header.index(after_col) + 1 if after_col else len(header)
                  old_width = len(header)
                  header.insert(insert_at, col)
                  for row in rows[1:]:
                      while len(row) < old_width:
                          row.append('')
                      row.insert(insert_at, '')
                  changed.add(path)
                  print(f'added column {path} {col}')
                  continue

              if mode == 'remove_column':
                  col = str(op.get('column') or '').strip()
                  if not col:
                      sys.exit(f'op {i}: remove_column needs column')
                  if col not in header:
                      sys.exit(f'op {i}: column not in header: {col}')
                  remove_at = header.index(col)
                  header.pop(remove_at)
                  for row in rows[1:]:
                      if len(row) > remove_at:
                          row.pop(remove_at)
                  changed.add(path)
                  print(f'removed column {path} {col}')
                  continue

              if mode == 'dedupe_by_key':
                  key_col = str(op.get('key_column') or '').strip()
                  if key_col not in header:
                      sys.exit(f'op {i}: key column not in header: {key_col}')
                  i_key = header.index(key_col)
                  kept = [header]
                  seen = set()
                  matched = 0
                  removed = 0
                  for row in rows[1:]:
                      if not row:
                          continue
                      while len(row) < len(header):
                          row.append('')
                      if row[i_id] != row_id:
                          kept.append(row)
                          continue
                      matched += 1
                      key = row[i_key].strip()
                      if not key:
                          sys.exit(f'op {i}: blank {key_col} while deduping {row_id!r}')
                      if key in seen:
                          removed += 1
                          continue
                      seen.add(key)
                      kept.append(row)
                  if matched < 1:
                      sys.exit(f'op {i}: found no rows for {row_id!r}')
                  if removed < 1:
                      sys.exit(f'op {i}: found no duplicate rows for {row_id!r}')
                  files[path] = kept
                  changed.add(path)
                  print(f'deduped {path} {row_id}: kept {len(seen)} unique {key_col} values, removed {removed} duplicates')
                  continue

              if mode == 'fill_blank_where':
                  match_col = str(op.get('match_column') or '').strip()
                  col = str(op.get('column') or '').strip()
                  if match_col not in header:
                      sys.exit(f'op {i}: match column not in header: {match_col}')
                  if col not in header:
                      sys.exit(f'op {i}: column not in header: {col}')
                  match_value = decode(op.get('match_value')).strip()
                  new = decode(op.get('value'))
                  if not match_value:
                      sys.exit(f'op {i}: match_value required')
                  if new == '':
                      sys.exit(f'op {i}: value required')
                  i_match = header.index(match_col)
                  i_col = header.index(col)
                  hits = 0
                  for row in rows[1:]:
                      if not row:
                          continue
                      while len(row) < len(header):
                          row.append('')
                      if row[i_match].strip() == match_value and not row[i_col].strip():
                          row[i_col] = new
                          hits += 1
                  if hits < 1:
                      sys.exit(f'op {i}: found no blank {col} values where {match_col}={match_value!r}')
                  changed.add(path)
                  print(f'filled {hits} blank {col} values in {path} where {match_col}={match_value!r}')
                  continue

              if mode == 'replace_text':
                  col = str(op.get('column') or '').strip()
                  if col not in header:
                      sys.exit(f'op {i}: column not in header: {col}')
                  old = decode(op.get('from'))
                  new = decode(op.get('to'))
                  if not old:
                      sys.exit(f'op {i}: replace_text needs non-empty from')
                  i_col = header.index(col)
                  hits = 0
                  for row in rows[1:]:
                      if not row:
                          continue
                      while len(row) < len(header):
                          row.append('')
                      if old in row[i_col]:
                          row[i_col] = row[i_col].replace(old, new)
                          hits += 1
                  if hits < 1:
                      sys.exit(f'op {i}: replace_text found no matches for {old!r}')
                  changed.add(path)
                  print(f'replaced {old!r} in {hits} rows of {path} column {col}')
                  continue

              if mode == 'delete_where':
                  where = op.get('where')
                  if not isinstance(where, dict) or not where:
                      sys.exit(f'op {i}: delete_where needs where')
                  for col in where:
                      if col not in header:
                          sys.exit(f'op {i}: column not in header: {col}')
                  kept = [header]
                  hits = 0
                  for row in rows[1:]:
                      if not row:
                          continue
                      while len(row) < len(header):
                          row.append('')
                      matched = True
                      for col, val in where.items():
                          if row[header.index(col)] != decode(val):
                              matched = False
                              break
                      if matched:
                          hits += 1
                          continue
                      kept.append(row)
                  if hits < 1:
                      sys.exit(f'op {i}: delete_where found no rows for {where!r}')
                  files[path] = kept
                  changed.add(path)
                  print(f'deleted {hits} rows from {path} where {where}')
                  continue

              if mode == 'delete':
                  kept = [header]
                  hits = 0
                  for row in rows[1:]:
                      if not row:
                          continue
                      if len(row) > i_id and row[i_id] == row_id:
                          hits += 1
                          continue
                      kept.append(row)
                  if hits != 1:
                      sys.exit(f'op {i}: expected 1 row for {row_id!r}, found {hits}')
                  files[path] = kept
                  changed.add(path)
                  print(f'deleted {path} {row_id}')
                  continue

              if mode == 'insert':
                  existing = 0
                  for row in rows[1:]:
                      if row and len(row) > i_id and row[i_id] == row_id:
                          existing += 1
                  allow_duplicate_id = bool(op.get('allow_duplicate_id'))
                  if existing and not allow_duplicate_id:
                      sys.exit(f'op {i}: row already exists: {row_id}')
                  sets = op.get('sets')
                  if not isinstance(sets, dict) or not sets:
                      sys.exit(f'op {i}: insert needs sets')
                  new_row = [''] * len(header)
                  new_row[i_id] = row_id
                  for col, val in sets.items():
                      if col not in header:
                          sys.exit(f'op {i}: column not in header: {col}')
                      new_row[header.index(col)] = decode(val)
                  after = str(op.get('after_row_id') or '').strip()
                  if after:
                      placed = False
                      kept = [header]
                      for row in rows[1:]:
                          kept.append(row)
                          if row and len(row) > i_id and row[i_id] == after:
                              kept.append(new_row)
                              placed = True
                      if not placed:
                          sys.exit(f'op {i}: after_row_id not found: {after}')
                      files[path] = kept
                  else:
                      rows.append(new_row)
                      files[path] = rows
                  changed.add(path)
                  print(f'inserted {path} {row_id}')
                  continue

              if mode != 'update':
                  sys.exit(f'op {i}: unknown mode {mode}')

              sets = op.get('sets')
              if not isinstance(sets, dict) or not sets:
                  sets = {}
                  if op.get('column'):
                      sets[str(op['column'])] = op.get('value', '')
                  if op.get('column_2'):
                      sets[str(op['column_2'])] = op.get('value_2', '')
              if not sets:
                  sys.exit(f'op {i}: update needs sets or column/value')

              hits = 0
              for row in rows[1:]:
                  if not row:
                      continue
                  while len(row) < len(header):
                      row.append('')
                  if row[i_id] != row_id:
                      continue
                  for col, val in sets.items():
                      if col not in header:
                          sys.exit(f'op {i}: column not in header: {col}')
                      row[header.index(col)] = decode(val)
                  hits += 1
              if hits != 1:
                  sys.exit(f'op {i}: expected 1 row for {row_id!r}, found {hits}')
              changed.add(path)
              print(f'updated {path} {row_id} {list(sets)}')

          for path, rows in files.items():
              if path not in changed:
                  continue
              with path.open('w', newline='', encoding='utf-8') as f:
                  csv.writer(f, lineterminator='\n').writerows(rows)
          print('changed', ' '.join(str(p) for p in sorted(changed)))
          PY

      - name: Refresh manifests
        run: python3 scripts/data_schema.py manifest

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- data
          if git diff --cached --quiet; then
            echo "No change"
            exit 0
          fi
          git commit -m "Patch CSV line items"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
