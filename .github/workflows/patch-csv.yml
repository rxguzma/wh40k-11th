name: Patch CSV

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-csv.yml'
  workflow_dispatch:
    inputs:
      patches:
        description: JSON list of operations. One run, one commit.
        required: true
        type: string

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply patches
        env:
          PATCHES: ${{ inputs.patches }}
        run: |
          python3 <<'PY'
          import csv, json, os, sys
          from pathlib import Path

          raw = os.environ.get('PATCHES', '').strip()
          if not raw:
              raw = r'[{"file":"data/marines/Units.csv","id_column":"Unit_ID","row_id":"CAPTAIN_IN_TERMINATOR_ARMOUR","mode":"update","sets":{"Unit Name":"Captain in Terminator Armour","Weapon_IDs":"CAPTAIN_TERM_STORM_BOLTER, CAPTAIN_TERM_RELIC_WEAPON","M\"":"5\"","T":"5","SV":"2+ / 4++","W":"6","LD":"6+","OC":"1","Hyperlink":"https://wahapedia.ru/wh40k11ed/factions/space-marines/Captain-In-Terminator-Armour","Points_Cost_1":"85"}},{"file":"data/marines/Weapon_Stats.csv","id_column":"Weapon_ID","row_id":"CAPTAIN_TERM_STORM_BOLTER","mode":"insert","sets":{"Weapon Name":"Storm bolter","R\"":"24\"","A":"2","WS":"2","St":"4","AP":"0","D":"1","Weapon Abilities":"RAPID FIRE 2"}},{"file":"data/marines/Weapon_Stats.csv","id_column":"Weapon_ID","row_id":"CAPTAIN_TERM_COMBI_WEAPON","mode":"insert","sets":{"Weapon Name":"Combi-weapon","R\"":"24\"","A":"1","WS":"3","St":"4","AP":"0","D":"1","Weapon Abilities":"ANTI-INFANTRY 4+, DEVASTATING WOUNDS, RAPID FIRE 1"}},{"file":"data/marines/Weapon_Stats.csv","id_column":"Weapon_ID","row_id":"CAPTAIN_TERM_RELIC_WEAPON","mode":"insert","sets":{"Weapon Name":"Relic weapon","R\"":"-","A":"6","WS":"2","St":"5","AP":"-2","D":"2","Weapon Abilities":""}},{"file":"data/marines/Weapon_Stats.csv","id_column":"Weapon_ID","row_id":"CAPTAIN_TERM_RELIC_FIST","mode":"insert","sets":{"Weapon Name":"Relic fist","R\"":"-","A":"5","WS":"2","St":"8","AP":"-2","D":"2","Weapon Abilities":""}},{"file":"data/marines/Unit_Weapon_Options.csv","id_column":"Option_ID","row_id":"CAPTAIN_TERM_STORM","mode":"insert","sets":{"Unit_ID":"CAPTAIN_IN_TERMINATOR_ARMOUR","Option_Group_ID":"CAPTAIN_TERM_RANGED","Group_Label":"Ranged Weapon","Option_Name":"Storm Bolter","Weapon_IDs":"CAPTAIN_TERM_STORM_BOLTER","Default":"TRUE","Sort_Order":"1"}},{"file":"data/marines/Unit_Weapon_Options.csv","id_column":"Option_ID","row_id":"CAPTAIN_TERM_COMBI","mode":"insert","sets":{"Unit_ID":"CAPTAIN_IN_TERMINATOR_ARMOUR","Option_Group_ID":"CAPTAIN_TERM_RANGED","Group_Label":"Ranged Weapon","Option_Name":"Combi-weapon","Weapon_IDs":"CAPTAIN_TERM_COMBI_WEAPON","Default":"FALSE","Sort_Order":"2"}},{"file":"data/marines/Unit_Weapon_Options.csv","id_column":"Option_ID","row_id":"CAPTAIN_TERM_RELIC","mode":"insert","sets":{"Unit_ID":"CAPTAIN_IN_TERMINATOR_ARMOUR","Option_Group_ID":"CAPTAIN_TERM_MELEE","Group_Label":"Melee Weapon","Option_Name":"Relic Weapon","Weapon_IDs":"CAPTAIN_TERM_RELIC_WEAPON","Default":"TRUE","Sort_Order":"1"}},{"file":"data/marines/Unit_Weapon_Options.csv","id_column":"Option_ID","row_id":"CAPTAIN_TERM_FIST","mode":"insert","sets":{"Unit_ID":"CAPTAIN_IN_TERMINATOR_ARMOUR","Option_Group_ID":"CAPTAIN_TERM_MELEE","Group_Label":"Melee Weapon","Option_Name":"Relic Fist","Weapon_IDs":"CAPTAIN_TERM_RELIC_FIST","Default":"FALSE","Sort_Order":"2"}}]'
          try:
              ops = json.loads(raw)
          except json.JSONDecodeError as e:
              sys.exit(f'patches is not JSON: {e}')
          if not isinstance(ops, list) or not ops:
              sys.exit('patches must be a non-empty JSON list')

          def decode(val):
              if val is None:
                  return ''
              s = str(val)
              return s.replace('\\n', '\n')

          def load_csv(path):
              if path.is_absolute() or '..' in path.parts:
                  sys.exit(f'bad path {path}')
              if not str(path).startswith('data/') or path.suffix.lower() != '.csv':
                  sys.exit(f'file must be a .csv under data/: {path}')
              if not path.is_file():
                  sys.exit(f'missing {path}')
              with path.open(encoding='utf-8', newline='') as f:
                  rows = list(csv.reader(f))
              if not rows:
                  sys.exit(f'empty csv {path}')
              return rows

          files = {}
          changed = set()

          for i, op in enumerate(ops):
              if not isinstance(op, dict):
                  sys.exit(f'op {i} is not an object')
              path = Path(str(op.get('file', '')).strip())
              if path not in files:
                  files[path] = load_csv(path)
              rows = files[path]
              header = rows[0]
              id_col = str(op.get('id_column') or '').strip() or header[0]
              if id_col not in header:
                  sys.exit(f'op {i}: id column not in header: {id_col}')
              i_id = header.index(id_col)
              row_id = str(op.get('row_id') or '').strip()
              if not row_id:
                  sys.exit(f'op {i}: row_id required')
              mode = str(op.get('mode') or 'update').strip()

              if mode == 'fill_blank_where':
                  match_col = str(op.get('match_column') or '').strip()
                  col = str(op.get('column') or '').strip()
                  if match_col not in header:
                      sys.exit(f'op {i}: match column not in header: {match_col}')
                  if col not in header:
                      sys.exit(f'op {i}: column not in header: {col}')
                  match_value = decode(op.get('match_value')).strip()
                  new = decode(op.get('value'))
                  if not match_value:
                      sys.exit(f'op {i}: match_value required')
                  if new == '':
                      sys.exit(f'op {i}: value required')
                  i_match = header.index(match_col)
                  i_col = header.index(col)
                  hits = 0
                  for row in rows[1:]:
                      if not row:
                          continue
                      while len(row) < len(header):
                          row.append('')
                      if row[i_match].strip() == match_value and not row[i_col].strip():
                          row[i_col] = new
                          hits += 1
                  if hits < 1:
                      sys.exit(f'op {i}: found no blank {col} values where {match_col}={match_value!r}')
                  changed.add(path)
                  print(f'filled {hits} blank {col} values in {path} where {match_col}={match_value!r}')
                  continue

              if mode == 'replace_text':
                  col = str(op.get('column') or '').strip()
                  if col not in header:
                      sys.exit(f'op {i}: column not in header: {col}')
                  old = decode(op.get('from'))
                  new = decode(op.get('to'))
                  if not old:
                      sys.exit(f'op {i}: replace_text needs non-empty from')
                  i_col = header.index(col)
                  hits = 0
                  for row in rows[1:]:
                      if not row:
                          continue
                      while len(row) < len(header):
                          row.append('')
                      if old in row[i_col]:
                          row[i_col] = row[i_col].replace(old, new)
                          hits += 1
                  if hits < 1:
                      sys.exit(f'op {i}: replace_text found no matches for {old!r}')
                  changed.add(path)
                  print(f'replaced {old!r} in {hits} rows of {path} column {col}')
                  continue

              if mode == 'delete':
                  kept = [header]
                  hits = 0
                  for row in rows[1:]:
                      if not row:
                          continue
                      if len(row) > i_id and row[i_id] == row_id:
                          hits += 1
                          continue
                      kept.append(row)
                  if hits != 1:
                      sys.exit(f'op {i}: expected 1 row for {row_id!r}, found {hits}')
                  files[path] = kept
                  changed.add(path)
                  print(f'deleted {path} {row_id}')
                  continue

              if mode == 'insert':
                  existing = 0
                  for row in rows[1:]:
                      if row and len(row) > i_id and row[i_id] == row_id:
                          existing += 1
                  if existing:
                      sys.exit(f'op {i}: row already exists: {row_id}')
                  sets = op.get('sets')
                  if not isinstance(sets, dict) or not sets:
                      sys.exit(f'op {i}: insert needs sets')
                  new_row = [''] * len(header)
                  new_row[i_id] = row_id
                  for col, val in sets.items():
                      if col not in header:
                          sys.exit(f'op {i}: column not in header: {col}')
                      new_row[header.index(col)] = decode(val)
                  after = str(op.get('after_row_id') or '').strip()
                  if after:
                      placed = False
                      kept = [header]
                      for row in rows[1:]:
                          kept.append(row)
                          if row and len(row) > i_id and row[i_id] == after:
                              kept.append(new_row)
                              placed = True
                      if not placed:
                          sys.exit(f'op {i}: after_row_id not found: {after}')
                      files[path] = kept
                  else:
                      rows.append(new_row)
                      files[path] = rows
                  changed.add(path)
                  print(f'inserted {path} {row_id}')
                  continue

              if mode != 'update':
                  sys.exit(f'op {i}: unknown mode {mode}')

              sets = op.get('sets')
              if not isinstance(sets, dict) or not sets:
                  sets = {}
                  if op.get('column'):
                      sets[str(op['column'])] = op.get('value', '')
                  if op.get('column_2'):
                      sets[str(op['column_2'])] = op.get('value_2', '')
              if not sets:
                  sys.exit(f'op {i}: update needs sets or column/value')

              hits = 0
              for row in rows[1:]:
                  if not row:
                      continue
                  while len(row) < len(header):
                      row.append('')
                  if row[i_id] != row_id:
                      continue
                  for col, val in sets.items():
                      if col not in header:
                          sys.exit(f'op {i}: column not in header: {col}')
                      row[header.index(col)] = decode(val)
                  hits += 1
              if hits != 1:
                  sys.exit(f'op {i}: expected 1 row for {row_id!r}, found {hits}')
              changed.add(path)
              print(f'updated {path} {row_id} {list(sets)}')

          for path, rows in files.items():
              if path not in changed:
                  continue
              with path.open('w', newline='', encoding='utf-8') as f:
                  csv.writer(f, lineterminator='\n').writerows(rows)
          print('changed', ' '.join(str(p) for p in sorted(changed)))
          PY

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- data
          if git diff --cached --quiet; then
            echo "No change"
            exit 0
          fi
          git commit -m "Patch CSV line items"
          git push
