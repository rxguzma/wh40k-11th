name: Patch CSV

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-csv.yml'
  workflow_dispatch:
    inputs:
      patches:
        description: JSON list of operations. One run, one commit.
        required: true
        type: string

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply patches
        env:
          PATCHES: ${{ inputs.patches || '[{"file":"data/marines/Unit_Profiles.csv","id_column":"Unit_ID","row_id":"CAPTAIN_FIST_PLASMA","mode":"update","sets":{"Unit Name":"Captain","M\"":"6\"","T":"5","SV":"3+/4++","W":"5","LD":"6+","OC":"1","Keywords":"INFANTRY, CHARACTER, EXPLOSIVES, IMPERIUM, TACTICUS, ADEPTUS ASTARTES","Hyperlink":""}},{"file":"data/marines/Unit_Points.csv","id_column":"Unit_ID","row_id":"CAPTAIN_FIST_PLASMA","mode":"delete"},{"file":"data/marines/Unit_Profiles.csv","id_column":"Unit_ID","row_id":"CAPTAIN_SWORD_SHIELD","mode":"update","sets":{"Unit Name":"\u200b","M\"":"","T":"","SV":"","W":"","LD":"","OC":"","Keywords":"INTERNAL","Hyperlink":""}},{"file":"data/marines/Unit_Points.csv","id_column":"Unit_ID","row_id":"CAPTAIN_SWORD_SHIELD","mode":"delete"},{"file":"data/marines/Unit_Abilities.csv","id_column":"Unit_ID","row_id":"_","mode":"replace_text","column":"Unit_ID","from":"CAPTAIN_FIST_PLASMA","to":"CAPTAIN_SWORD_SHIELD"},{"file":"data/marines/Unit_Abilities.csv","id_column":"Unit_ID","row_id":"CAPTAIN_SWORD_SHIELD","mode":"dedupe_by_key","key_column":"Ability_ID"},{"file":"data/marines/Unit_Weapons.csv","id_column":"Unit_ID","row_id":"_","mode":"replace_text","column":"Unit_ID","from":"CAPTAIN_FIST_PLASMA","to":"CAPTAIN_SWORD_SHIELD"},{"file":"data/marines/Loadout_Options.csv","id_column":"Unit_ID","row_id":"_","mode":"replace_text","column":"Unit_ID","from":"CAPTAIN_FIST_PLASMA","to":"CAPTAIN_SWORD_SHIELD"},{"file":"data/marines/Weapon_Stats.csv","id_column":"Weapon_ID","row_id":"CAPTAIN_HEAVY_BOLT_PISTOL","mode":"update","sets":{"Weapon Name":"Heavy Bolt Pistol","R\"":"18\"","A":"1","WS":"2+","St":"5","AP":"-1","D":"1"}},{"file":"data/marines/Weapon_Stats.csv","id_column":"Weapon_ID","row_id":"CAPTAIN_MASTER_CRAFTED_BOLTER","mode":"update","sets":{"Weapon Name":"Master-crafted Bolter","R\"":"24\"","A":"2","WS":"2+","St":"5","AP":"-1","D":"2"}},{"file":"data/marines/Weapon_Stats.csv","id_column":"Weapon_ID","row_id":"CAPTAIN_NEO_VOLKIT