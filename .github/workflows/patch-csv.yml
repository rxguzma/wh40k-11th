name: Patch CSV

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-csv.yml'
  workflow_dispatch:
    inputs:
      patches:
        description: JSON list of operations. One run, one commit.
        required: true
        type: string

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply patches
        env:
          PATCHES: ${{ inputs.patches }}
        run: |
          python3 <<'PY'
          import csv, json, os, sys
          from pathlib import Path

          raw = os.environ.get('PATCHES', '').strip()
          if not raw:
              raw = r'[{"file":"data/marines/Abilities.csv","id_column":"Ability_ID","row_id":"NEW_LEADER_CAPTAIN_WITH_RELIC_SHIELD","column":"Short Description","value":"Can Lead: Most INFANTRY like\\nIntercessors, Hellblasters\\nInfernus, Sternguard Vets"},{"file":"data/marines/Abilities.csv","id_column":"Ability_ID","row_id":"NEW_LEADER_CHAPLAIN_WITH_JUMP_PACK","column":"Short Description","value":"Can Lead: JUMP PACK\\nJump Intercessors, Vanguard Vets"},{"file":"data/marines/Abilities.csv","id_column":"Ability_ID","row_id":"NEW_LEADER_LIBRARIAN","column":"Short Description","value":"Can Lead: Most INFANTRY like\\nIntercessors, Hellblasters\\nInfernus, Sternguard Vets"},{"file":"data/marines/Abilities.csv","id_column":"Ability_ID","row_id":"LEADER_SUBODEN_KHAN","column":"Short Description","value":"Can Lead: MOUNTED\\nOutriders"},{"file":"data/marines/Abilities.csv","id_column":"Ability_ID","row_id":"LEADER_ASMODAI","column":"Short Description","value":"Can Lead: Most INFANTRY like\\nIntercessors, Hellblasters\\nInfernus, Sternguard Vets"},{"file":"data/marines/Abilities.csv","id_column":"Ability_ID","row_id":"LEADER_AZRAEL","column":"Short Description","value":"Can Lead: Most INFANTRY like\\nIntercessors, Hellblasters\\nInfernus, Sternguard Vets"},{"file":"data/marines/Abilities.csv","id_column":"Ability_ID","row_id":"LEADER_EZEKIEL","column":"Short Description","value":"Can Lead: Most INFANTRY like\\nIntercessors, Hellblasters\\nInfernus, Sternguard Vets"},{"file":"data/marines/Abilities.csv","id_column":"Ability_ID","row_id":"LEADER_BELIAL","column":"Short Description","value":"Can Lead: TERMINATORS\\nTerminators, Assault Terminators\\nDeathwing Knights"},{"file":"data/marines/Abilities.csv","id_column":"Ability_ID","row_id":"LEADER_LAZARUS","column":"Short Description","value":"Can Lead: Most INFANTRY like\\nIntercessors, Bladeguard Vets\\nInfernus, Sternguard Vets"},{"file":"data/marines/Abilities.csv","id_column":"Ability_ID","row_id":"LEADER_RAVENWING_COMMAND_SQUAD","column":"Short Description","value":"Can Lead: MOUNTED\\nOutriders, Black Knights"},{"file":"data/marines/Abilities.csv","id_column":"Ability_ID","row_id":"LEADER_SAMMAEL","column":"Short Description","value":"Can Lead: MOUNTED\\nOutriders, Black Knights"},{"file":"data/marines/Abilities.csv","id_column":"Ability_ID","row_id":"SUPPORT_ANCIENT","column":"Short Description","value":"Can Support: Most INFANTRY like\\nIntercessors, Hellblasters\\nInfernus, Sternguard Vets"},{"file":"data/marines/Abilities.csv","id_column":"Ability_ID","row_id":"LEADER_ADRAX_AGATONE","column":"Short Description","value":"Can Lead: Most INFANTRY like\\nIntercessors, Bladeguard Vets\\nInfernus, Sternguard Vets"},{"file":"data/marines/Abilities.csv","id_column":"Ability_ID","row_id":"LEADER_CAANOK_VAR","column":"Short Description","value":"Can Lead: TERMINATORS\\nTerminators, Assault Terminators"},{"file":"data/marines/Abilities.csv","id_column":"Ability_ID","row_id":"LEADER_DARNATH_LYSANDER","column":"Short Description","value":"Can Lead: TERMINATORS\\nTerminators, Assault Terminators"},{"file":"data/marines/Abilities.csv","id_column":"Ability_ID","row_id":"LEADER_IRON_FATHER_FEIRROS","column":"Short Description","value":"Can Lead: GRAVIS\\nAggressors, Eradicators\\nHeavy Intercessors"},{"file":"data/marines/Abilities.csv","id_column":"Ability_ID","row_id":"LEADER_KAYVAAN_SHRIKE","column":"Short Description","value":"Can Lead: JUMP PACK\\nJump Intercessors, Vanguard Vets"},{"file":"data/marines/Abilities.csv","id_column":"Ability_ID","row_id":"LEADER_URIEL_VENTRIS","column":"Short Description","value":"Can Lead: Most INFANTRY like\\nIntercessors, Bladeguard Vets\\nSternguard Vets, Company Heroes"},{"file":"data/marines/Abilities.csv","id_column":"Ability_ID","row_id":"LEADER_VULKAN_HESTAN","column":"Short Description","value":"Can Lead: INFANTRY like\\nAssault Intercessors, Infernus\\nCompany Heroes, Tactical"},{"file":"data/marines/Abilities.csv","id_column":"Ability_ID","row_id":"SUPPORT_ANCIENT_IN_TERMINATOR_ARMOUR","column":"Short Description","value":"Can Support: TERMINATORS\\nTerminators, Assault Terminators\\nDeathwing Knights"},{"file":"data/marines/Abilities.csv","id_column":"Ability_ID","row_id":"SUPPORT_APOTHECARY","column":"Short Description","value":"Can Support: Most INFANTRY like\\nIntercessors, Hellblasters\\nInfernus, Sternguard Vets"},{"file":"data/marines/Abilities.csv","id_column":"Ability_ID","row_id":"SUPPORT_APOTHECARY_BIOLOGIS","column":"Short Description","value":"Can Support: GRAVIS\\nAggressors, Eradicators\\nHeavy Intercessors"},{"file":"data/marines/Abilities.csv","id_column":"Ability_ID","row_id":"SUPPORT_BLADEGUARD_ANCIENT","column":"Short Description","value":"Can Support: Bladeguard Vets"},{"file":"data/marines/Abilities.csv","id_column":"Ability_ID","row_id":"LEADER_CAPTAIN_IN_GRAVIS_ARMOUR","column":"Short Description","value":"Can Lead: GRAVIS\\nAggressors, Eradicators\\nHeavy Intercessors"},{"file":"data/marines/Abilities.csv","id_column":"Ability_ID","row_id":"LEADER_CAPTAIN_IN_PHOBOS_ARMOUR","column":"Short Description","value":"Can Lead: PHOBOS\\nInfiltrators, Incursors, Reivers\\nEliminators, Scouts"},{"file":"data/marines/Abilities.csv","id_column":"Ability_ID","row_id":"LEADER_CAPTAIN_IN_TERMINATOR_ARMOUR","column":"Short Description","value":"Can Lead: TERMINATORS\\nTerminators, Assault Terminators\\nDeathwing Knights"},{"file":"data/marines/Abilities.csv","id_column":"Ability_ID","row_id":"LEADER_CAPTAIN_WITH_JUMP_PACK","column":"Short Description","value":"Can Lead: JUMP PACK\\nJump Intercessors, Vanguard Vets\\nSanguinary Guard"},{"file":"data/marines/Abilities.csv","id_column":"Ability_ID","row_id":"LEADER_CHAPLAIN","column":"Short Description","value":"Can Lead: Most INFANTRY like\\nIntercessors, Hellblasters\\nInfernus, Sternguard Vets"},{"file":"data/marines/Abilities.csv","id_column":"Ability_ID","row_id":"LEADER_CHAPLAIN_IN_TERMINATOR_ARMOUR","column":"Short Description","value":"Can Lead: TERMINATORS\\nTerminators, Assault Terminators\\nDeathwing Knights"},{"file":"data/marines/Abilities.csv","id_column":"Ability_ID","row_id":"LEADER_CHAPLAIN_ON_BIKE","column":"Short Description","value":"Can Lead: MOUNTED\\nOutriders, Black Knights"},{"file":"data/marines/Abilities.csv","id_column":"Ability_ID","row_id":"LEADER_CHAPLAIN_WITH_JUMP_PACK","column":"Short Description","value":"Can Lead: JUMP PACK\\nJump Intercessors, Vanguard Vets\\nDeath Company"},{"file":"data/marines/Abilities.csv","id_column":"Ability_ID","row_id":"LEADER_JUDICIAR","column":"Short Description","value":"Can Lead: Most INFANTRY like\\nIntercessors, Bladeguard Vets\\nInfernus, Sternguard Vets"},{"file":"data/marines/Abilities.csv","id_column":"Ability_ID","row_id":"LEADER_LIBRARIAN","column":"Short Description","value":"Can Lead: Most INFANTRY like\\nIntercessors, Hellblasters\\nInfernus, Sternguard Vets"},{"file":"data/marines/Abilities.csv","id_column":"Ability_ID","row_id":"LEADER_LIBRARIAN_IN_PHOBOS_ARMOUR","column":"Short Description","value":"Can Lead: PHOBOS\\nInfiltrators, Incursors, Reivers\\nEliminators, Scouts"},{"file":"data/marines/Abilities.csv","id_column":"Ability_ID","row_id":"LEADER_LIBRARIAN_IN_TERMINATOR_ARMOUR","column":"Short Description","value":"Can Lead: TERMINATORS\\nTerminators, Assault Terminators\\nDeathwing Knights"},{"file":"data/marines/Abilities.csv","id_column":"Ability_ID","row_id":"SUPPORT_LIEUTENANT","column":"Short Description","value":"Can Support: Most INFANTRY like\\nIntercessors, Hellblasters\\nInfernus, Sternguard Vets"},{"file":"data/marines/Abilities.csv","id_column":"Ability_ID","row_id":"LEADER_LIEUTENANT_IN_PHOBOS_ARMOUR","column":"Short Description","value":"Can Lead: PHOBOS\\nIncursors, Infiltrators, Reivers"},{"file":"data/marines/Abilities.csv","id_column":"Ability_ID","row_id":"SUPPORT_LIEUTENANT_IN_PHOBOS_ARMOUR","column":"Short Description","value":"Can Support: PHOBOS\\nIncursors, Infiltrators, Reivers\\nHounds of Morkai"},{"file":"data/marines/Abilities.csv","id_column":"Ability_ID","row_id":"SUPPORT_LIEUTENANT_IN_REIVER_ARMOUR","column":"Short Description","value":"Can Support: PHOBOS\\nReivers, Hounds of Morkai"},{"file":"data/marines/Abilities.csv","id_column":"Ability_ID","row_id":"LEADER_TECHMARINE","column":"Short Description","value":"Can Lead: INFANTRY like\\nIntercessors, Devastators\\nAssault Intercessors, Tactical"},{"file":"data/marines/Abilities.csv","id_column":"Ability_ID","row_id":"NEW_SUPPORT_ANCIENT","column":"Short Description","value":"Can Support: Most INFANTRY like\\nIntercessors, Hellblasters\\nInfernus, Sternguard Vets"}]'
          try:
              ops = json.loads(raw)
          except json.JSONDecodeError as e:
              sys.exit(f'patches is not JSON: {e}')
          if not isinstance(ops, list) or not ops:
              sys.exit('patches must be a non-empty JSON list')

          def decode(val):
              if val is None:
                  return ''
              s = str(val)
              return s.replace('\\n', '\n')

          def load_csv(path):
              if path.is_absolute() or '..' in path.parts:
                  sys.exit(f'bad path {path}')
              if not str(path).startswith('data/') or path.suffix.lower() != '.csv':
                  sys.exit(f'file must be a .csv under data/: {path}')
              if not path.is_file():
                  sys.exit(f'missing {path}')
              with path.open(encoding='utf-8', newline='') as f:
                  rows = list(csv.reader(f))
              if not rows:
                  sys.exit(f'empty csv {path}')
              return rows

          files = {}
          changed = set()

          for i, op in enumerate(ops):
              if not isinstance(op, dict):
                  sys.exit(f'op {i} is not an object')
              path = Path(str(op.get('file', '')).strip())
              if path not in files:
                  files[path] = load_csv(path)
              rows = files[path]
              header = rows[0]
              id_col = str(op.get('id_column') or '').strip() or header[0]
              if id_col not in header:
                  sys.exit(f'op {i}: id column not in header: {id_col}')
              i_id = header.index(id_col)
              row_id = str(op.get('row_id') or '').strip()
              if not row_id:
                  sys.exit(f'op {i}: row_id required')
              mode = str(op.get('mode') or 'update').strip()

              if mode == 'fill_blank_where':
                  match_col = str(op.get('match_column') or '').strip()
                  col = str(op.get('column') or '').strip()
                  if match_col not in header:
                      sys.exit(f'op {i}: match column not in header: {match_col}')
                  if col not in header:
                      sys.exit(f'op {i}: column not in header: {col}')
                  match_value = decode(op.get('match_value')).strip()
                  new = decode(op.get('value'))
                  if not match_value:
                      sys.exit(f'op {i}: match_value required')
                  if new == '':
                      sys.exit(f'op {i}: value required')
                  i_match = header.index(match_col)
                  i_col = header.index(col)
                  hits = 0
                  for row in rows[1:]:
                      if not row:
                          continue
                      while len(row) < len(header):
                          row.append('')
                      if row[i_match].strip() == match_value and not row[i_col].strip():
                          row[i_col] = new
                          hits += 1
                  if hits < 1:
                      sys.exit(f'op {i}: found no blank {col} values where {match_col}={match_value!r}')
                  changed.add(path)
                  print(f'filled {hits} blank {col} values in {path} where {match_col}={match_value!r}')
                  continue

              if mode == 'replace_text':
                  col = str(op.get('column') or '').strip()
                  if col not in header:
                      sys.exit(f'op {i}: column not in header: {col}')
                  old = decode(op.get('from'))
                  new = decode(op.get('to'))
                  if not old:
                      sys.exit(f'op {i}: replace_text needs non-empty from')
                  i_col = header.index(col)
                  hits = 0
                  for row in rows[1:]:
                      if not row:
                          continue
                      while len(row) < len(header):
                          row.append('')
                      if old in row[i_col]:
                          row[i_col] = row[i_col].replace(old, new)
                          hits += 1
                  if hits < 1:
                      sys.exit(f'op {i}: replace_text found no matches for {old!r}')
                  changed.add(path)
                  print(f'replaced {old!r} in {hits} rows of {path} column {col}')
                  continue

              if mode == 'delete':
                  kept = [header]
                  hits = 0
                  for row in rows[1:]:
                      if not row:
                          continue
                      if len(row) > i_id and row[i_id] == row_id:
                          hits += 1
                          continue
                      kept.append(row)
                  if hits != 1:
                      sys.exit(f'op {i}: expected 1 row for {row_id!r}, found {hits}')
                  files[path] = kept
                  changed.add(path)
                  print(f'deleted {path} {row_id}')
                  continue

              if mode == 'insert':
                  existing = 0
                  for row in rows[1:]:
                      if row and len(row) > i_id and row[i_id] == row_id:
                          existing += 1
                  if existing:
                      sys.exit(f'op {i}: row already exists: {row_id}')
                  sets = op.get('sets')
                  if not isinstance(sets, dict) or not sets:
                      sys.exit(f'op {i}: insert needs sets')
                  new_row = [''] * len(header)
                  new_row[i_id] = row_id
                  for col, val in sets.items():
                      if col not in header:
                          sys.exit(f'op {i}: column not in header: {col}')
                      new_row[header.index(col)] = decode(val)
                  after = str(op.get('after_row_id') or '').strip()
                  if after:
                      placed = False
                      kept = [header]
                      for row in rows[1:]:
                          kept.append(row)
                          if row and len(row) > i_id and row[i_id] == after:
                              kept.append(new_row)
                              placed = True
                      if not placed:
                          sys.exit(f'op {i}: after_row_id not found: {after}')
                      files[path] = kept
                  else:
                      rows.append(new_row)
                      files[path] = rows
                  changed.add(path)
                  print(f'inserted {path} {row_id}')
                  continue

              if mode != 'update':
                  sys.exit(f'op {i}: unknown mode {mode}')

              sets = op.get('sets')
              if not isinstance(sets, dict) or not sets:
                  sets = {}
                  if op.get('column'):
                      sets[str(op['column'])] = op.get('value', '')
                  if op.get('column_2'):
                      sets[str(op['column_2'])] = op.get('value_2', '')
              if not sets:
                  sys.exit(f'op {i}: update needs sets or column/value')

              hits = 0
              for row in rows[1:]:
                  if not row:
                      continue
                  while len(row) < len(header):
                      row.append('')
                  if row[i_id] != row_id:
                      continue
                  for col, val in sets.items():
                      if col not in header:
                          sys.exit(f'op {i}: column not in header: {col}')
                      row[header.index(col)] = decode(val)
                  hits += 1
              if hits != 1:
                  sys.exit(f'op {i}: expected 1 row for {row_id!r}, found {hits}')
              changed.add(path)
              print(f'updated {path} {row_id} {list(sets)}')

          for path, rows in files.items():
              if path not in changed:
                  continue
              with path.open('w', newline='', encoding='utf-8') as f:
                  csv.writer(f, lineterminator='\n').writerows(rows)
          print('changed', ' '.join(str(p) for p in sorted(changed)))
          PY

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- data
          if git diff --cached --quiet; then
            echo "No change"
            exit 0
          fi
          git commit -m "Patch CSV line items"
          git push
