name: Patch CSV

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-csv.yml'
  workflow_dispatch:
    inputs:
      patches:
        description: JSON list of operations. One run, one commit.
        required: true
        type: string

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply patches
        env:
          PATCHES: ${{ inputs.patches || '[{"file":"data/marines/Unit_Profiles.csv","id_column":"Unit_ID","row_id":"KORSARRO_KHAN","sets":{"Abilities":"KORSARRO_KHAN_TROPHY_TAKER, KORSARRO_KHAN_FOR_THE_KHAN, KORSARRO_KHAN_UNIT_COMPOSITION","Other_Abilities":"LEADER"}},{"file":"data/marines/Unit_Profiles.csv","id_column":"Unit_ID","row_id":"CAPTAIN_ON_BIKE","sets":{"Abilities":"CAPTAIN_ON_BIKE_INTO_THE_FRAY, CAPTAIN_ON_BIKE_UNIT_COMPOSITION","Other_Abilities":"LEADER_CAPTAIN_ON_BIKE, CAPTAIN_STRATEGIC_ACUMEN"}},{"file":"data/marines/Unit_Profiles.csv","id_column":"Unit_ID","row_id":"CHAPLAIN","sets":{"Abilities":"SPIRITUAL_LEADER","Other_Abilities":"LEADER, LITANY_OF_HATE"}},{"file":"data/marines/Unit_Profiles.csv","id_column":"Unit_ID","row_id":"CHAPLAIN_IN_TERMINATOR_ARMOUR","sets":{"Abilities":"ZEALOUS_FORTITUDE","Other_Abilities":"DEEP_STRIKE, LEADER, LITANY_OF_HATE"}},{"file":"data/marines/Unit_Profiles.csv","id_column":"Unit_ID","row_id":"CHAPLAIN_ON_BIKE","sets":{"Abilities":"CATECHISM_OF_FIRE","Other_Abilities":"LEADER, LITANY_OF_HATE"}},{"file":"data/marines/Unit_Profiles.csv","id_column":"Unit_ID","row_id":"BLADEGUARD_ANCIENT","sets":{"Abilities":"DEEDS_OF_LEGEND","Other_Abilities":"SUPPORT, RAISE_THE_BANNER"}},{"file":"data/marines/Unit_Profiles.csv","id_column":"Unit_ID","row_id":"ANCIENT_IN_TERMINATOR_ARMOUR","sets":{"Abilities":"NEVER_SHALL_THE_STANDARD_FALL","Other_Abilities":"DEEP_STRIKE, SUPPORT, RAISE_THE_BANNER"}},{"file":"data/marines/Unit_Profiles.csv","id_column":"Unit_ID","row_id":"FIRESTRIKE_SERVO_TURRETS","sets":{"Abilities":"SENTINEL_PROTOCOLS","Other_Abilities":""}},{"file":"data/marines/Unit_Profiles.csv","id_column":"Unit_ID","row_id":"LAND_RAIDER","sets":{"Abilities":"LAND_RAIDER_POWER_OF_MACHINE_SPIRIT","Other_Abilities":"DEADLY_DEMISE_D6, DAMAGED_1_6, ASSAULT_RAMP, TRANSPORT_LAND_RAIDER"}},{"file":"data/marines/Unit_Profiles.csv","id_column":"Unit_ID","row_id":"LAND_RAIDER_CRUSADER","sets":{"Abilities":"LAND_RAIDER_CRUSADER_FURY_MACHINE_SPIRIT","Other_Abilities":"DEADLY_DEMISE_D6, DAMAGED_1_6, ASSAULT_RAMP, TRANSPORT_LAND_RAIDER_CRUSADER"}},{"file":"data/marines/Abilities.csv","id_column":"Ability_ID","row_id":"TRANSPORT_DROP_POD","column":"Ability Name","value":"Transport 12"},{"file":"data/marines/Abilities.csv","id_column":"Ability_ID","row_id":"TRANSPORT_IMPULSOR","column":"Ability Name","value":"Transport 7"},{"file":"data/marines/Abilities.csv","id_column":"Ability_ID","row_id":"TRANSPORT_LAND_RAIDER_REDEEMER","column":"Ability Name","value":"Transport 14"},{"file":"data/marines/Abilities.csv","id_column":"Ability_ID","row_id":"TRANSPORT_REPULSOR_EXECUTIONER","column":"Ability Name","value":"Transport 7"},{"file":"data/marines/Abilities.csv","id_column":"Ability_ID","row_id":"TRANSPORT_REPULSOR","column":"Ability Name","value":"Transport 14"},{"file":"data/marines/Abilities.csv","id_column":"Ability_ID","row_id":"TRANSPORT_RHINO","column":"Ability Name","value":"Transport 12"},{"file":"data/marines/Abilities.csv","id_column":"Ability_ID","row_id":"TRANSPORT_LAND_RAIDER","column":"Ability Name","value":"Transport 14"},{"file":"data/marines/Abilities.csv","id_column":"Ability_ID","row_id":"TRANSPORT_LAND_RAIDER_CRUSADER","column":"Ability Name","value":"Transport 16"},{"file":"data/nids/Unit_Profiles.csv","id_column":"Unit_ID","row_id":"TYRANID_PRIME_WITH_LASH_WHIP","sets":{"Abilities":"ALPHA_WARRIOR_TYRANID_PRIME_WITH_LASH_WHIP, AGGRESSIVE_LEADER_BEAST","Other_Abilities":"LEADER_TYRANID_PRIME_WITH_LASH_WHIP"}},{"file":"data/nids/Unit_Profiles.csv","id_column":"Unit_ID","row_id":"BIOVORE","sets":{"Abilities":"SEED_SPORE_MINES, SPORE_MINES","Other_Abilities":"DEADLY_DEMISE_1"}},{"file":"data/nids/Unit_Profiles.csv","id_column":"Unit_ID","row_id":"BROODLORD","sets":{"Abilities":"VICIOUS_INSIGHT, HYPNOTIC_GAZE_PSYCHIC","Other_Abilities":"SCOUTS_8, LEADER_BROODLORD"}},{"file":"data/nids/Unit_Profiles.csv","id_column":"Unit_ID","row_id":"CARNIFEXES","sets":{"Abilities":"BLISTERING_ASSAULT","Other_Abilities":"DEADLY_DEMISE_1"}},{"file":"data/nids/Unit_Profiles.csv","id_column":"Unit_ID","row_id":"DEATHLEAPER","sets":{"Abilities":"FEAR_OF_THE_UNSEEN_AURA","Other_Abilities":"FIGHTS_FIRST, INFILTRATORS, LONE_OPERATIVE, STEALTH, FEEDER_TENDRILS"}},{"file":"data/nids/Unit_Profiles.csv","id_column":"Unit_ID","row_id":"EXOCRINE","sets":{"Abilities":"SYMBIOTIC_TARGETING","Other_Abilities":"DEADLY_DEMISE_D3, DAMAGED_1_5"}},{"file":"data/nids/Unit_Profiles.csv","id_column":"Unit_ID","row_id":"GARGOYLES","sets":{"Abilities":"WINGED_SWARM","Other_Abilities":"DEEP_STRIKE"}},{"file":"data/nids/Unit_Profiles.csv","id_column":"Unit_ID","row_id":"GENESTEALERS","sets":{"Abilities":"VANGUARD_PREDATOR","Other_Abilities":"SCOUTS_8"}},{"file":"data/nids/Unit_Profiles.csv","id_column":"Unit_ID","row_id":"HARUSPEX","sets":{"Abilities":"GRISLY_SPECTACLE","Other_Abilities":"DEADLY_DEMISE_D3, DAMAGED_1_5"}},{"file":"data/nids/Unit_Profiles.csv","id_column":"Unit_ID","row_id":"HIVE_GUARD","sets":{"Abilities":"DEFENSIVE_STANCE","Other_Abilities":""}},{"file":"data/nids/Unit_Profiles.csv","id_column":"Unit_ID","row_id":"HIVE_TYRANT","sets":{"Abilities":"ONSLAUGHT_AURA_PSYCHIC","Other_Abilities":"DEADLY_DEMISE_D3, WILL_OF_THE_HIVE_MIND, LEADER_HIVE_TYRANT"}},{"file":"data/nids/Unit_Profiles.csv","id_column":"Unit_ID","row_id":"HORMAGAUNTS","sets":{"Abilities":"BOUNDING_LEAP","Other_Abilities":""}},{"file":"data/nids/Unit_Profiles.csv","id_column":"Unit_ID","row_id":"HYPERADAPTED_RAVENERS","sets":{"Abilities":"ALPHA_INVADER, HYPERSENSORY_ARRAY, RAVENER_PRIME","Other_Abilities":"DEEP_STRIKE, LEADER_HYPERADAPTED_RAVENERS"}},{"file":"data/nids/Unit_Profiles.csv","id_column":"Unit_ID","row_id":"LICTOR","sets":{"Abilities":"PHEROMONE_TRAIL","Other_Abilities":"FIGHTS_FIRST, INFILTRATORS, LONE_OPERATIVE, STEALTH, FEEDER_TENDRILS"}},{"file":"data/nids/Unit_Profiles.csv","id_column":"Unit_ID","row_id":"MALECEPTOR","sets":{"Abilities":"ENCEPHALIC_DIFFUSION_AURA_AND_PSYCHIC","Other_Abilities":"DEADLY_DEMISE_D3, DAMAGED_1_5"}},{"file":"data/nids/Unit_Profiles.csv","id_column":"Unit_ID","row_id":"MAWLOC","sets":{"Abilities":"TERROR_FROM_THE_DEEP","Other_Abilities":"DEEP_STRIKE, DAMAGED_1_5"}},{"file":"data/nids/Unit_Profiles.csv","id_column":"Unit_ID","row_id":"NEUROGAUNTS","sets":{"Abilities":"NEUROCYTES","Other_Abilities":""}},{"file":"data/nids/Unit_Profiles.csv","id_column":"Unit_ID","row_id":"NEUROLICTOR","sets":{"Abilities":"NEURAL_DISRUPTION, PSYCHOLOGICAL_SABOTEUR_AURA","Other_Abilities":"INFILTRATORS, LONE_OPERATIVE, STEALTH, FEEDER_TENDRILS"}},{"file":"data/nids/Unit_Profiles.csv","id_column":"Unit_ID","row_id":"NEUROTYRANT","sets":{"Abilities":"NODE_LASH_PSYCHIC, PSYCHIC_TERROR_PSYCHIC, NEUROLOIDS","Other_Abilities":"LEADER_NEUROTYRANT"}},{"file":"data/nids/Unit_Profiles.csv","id_column":"Unit_ID","row_id":"NORN_ASSIMILATOR","sets":{"Abilities":"HARPOON_BARBS","Other_Abilities":"DEADLY_DEMISE_D6, DAMAGED_1_5, SINGULAR_PURPOSE"}},{"file":"data/nids/Unit_Profiles.csv","id_column":"Unit_ID","row_id":"NORN_EMISSARY","sets":{"Abilities":"UNNATURAL_RESILIENCE","Other_Abilities":"DEADLY_DEMISE_D6, DAMAGED_1_5, SINGULAR_PURPOSE"}},{"file":"data/nids/Unit_Profiles.csv","id_column":"Unit_ID","row_id":"OLD_ONE_EYE","sets":{"Abilities":"ALPHA_LEADER, UNSTOPPABLE_MONSTER","Other_Abilities":"FNP_5, LEADER_OLD_ONE_EYE"}},{"file":"data/nids/Unit_Profiles.csv","id_column":"Unit_ID","row_id":"PSYCHOPHAGE","sets":{"Abilities":"BIO_STIMULUS, FEEDING_FRENZY","Other_Abilities":"DEADLY_DEMISE_1, FNP_5"}},{"file":"data/nids/Unit_Profiles.csv","id_column":"Unit_ID","row_id":"PYROVORE","sets":{"Abilities":"BURNING_SPRAY","Other_Abilities":"DEADLY_DEMISE_1"}},{"file":"data/nids/Unit_Profiles.csv","id_column":"Unit_ID","row_id":"RAVENERS","sets":{"Abilities":"DEATH_FROM_BELOW","Other_Abilities":"DEEP_STRIKE"}},{"file":"data/nids/Unit_Profiles.csv","id_column":"Unit_ID","row_id":"SCREAMER_KILLER","sets":{"Abilities":"DEATH_SCREAM","Other_Abilities":"DEADLY_DEMISE_1"}},{"file":"data/nids/Unit_Profiles.csv","id_column":"Unit_ID","row_id":"TERMAGANTS","sets":{"Abilities":"SKULKING_HORRORS","Other_Abilities":""}},{"file":"data/nids/Unit_Profiles.csv","id_column":"Unit_ID","row_id":"TERVIGON","sets":{"Abilities":"SPAWN_TERMAGANTS, BROOD_PROGENITOR_AURA_AND_PSYCHIC","Other_Abilities":"DEADLY_DEMISE_D6, DAMAGED_1_5"}},{"file":"data/nids/Unit_Profiles.csv","id_column":"Unit_ID","row_id":"THE_RED_TERROR","sets":{"Abilities":"SWALLOW_WHOLE, SUBTERRANEAN_HUNTER, SERPENTINE_FIEND","Other_Abilities":"DEEP_STRIKE"}},{"file":"data/nids/Unit_Profiles.csv","id_column":"Unit_ID","row_id":"THE_SWARMLORD","sets":{"Abilities":"MALIGN_PRESENCE_AURA, DOMINATION_OF_THE_HIVE_MIND_AURA","Other_Abilities":"DEADLY_DEMISE_D3, HIVE_COMMANDER, LEADER_THE_SWARMLORD"}},{"file":"data/nids/Unit_Profiles.csv","id_column":"Unit_ID","row_id":"TOXICRENE","sets":{"Abilities":"GRASPING_TENDRILS, HYPERTOXIC_MIASMA_AURA","Other_Abilities":"DEADLY_DEMISE_D3"}},{"file":"data/nids/Unit_Profiles.csv","id_column":"Unit_ID","row_id":"TRYGON","sets":{"Abilities":"","Other_Abilities":"DEEP_STRIKE, DAMAGED_1_5, SUBTERRANEAN_TUNNELS"}}]' }}
        run: |
          python3 <<'PY'
          import csv, json, os, sys
          from pathlib import Path

          raw = os.environ.get('PATCHES') or ''
          if not raw.strip():
              print('no PATCHES input; skip apply')
              raise SystemExit(0)
          try:
              ops = json.loads(raw)
          except json.JSONDecodeError as e:
              sys.exit(f'patches is not JSON: {e}')
          if not isinstance(ops, list) or not ops:
              sys.exit('patches must be a non-empty JSON list')

          def decode(val):
              if val is None:
                  return ''
              s = str(val)
              return s.replace('\\n', '\n')

          def load_csv(path):
              if path.is_absolute() or '..' in path.parts:
                  sys.exit(f'bad path {path}')
              if not str(path).startswith('data/') or path.suffix.lower() != '.csv':
                  sys.exit(f'file must be a .csv under data/: {path}')
              if not path.is_file():
                  sys.exit(f'missing {path}')
              with path.open(encoding='utf-8', newline='') as f:
                  rows = list(csv.reader(f))
              if not rows:
                  sys.exit(f'empty csv {path}')
              return rows

          files = {}
          changed = set()

          for i, op in enumerate(ops):
              if not isinstance(op, dict):
                  sys.exit(f'op {i} is not an object')
              path = Path(str(op.get('file', '')).strip())
              if path not in files:
                  files[path] = load_csv(path)
              rows = files[path]
              header = rows[0]
              id_col = str(op.get('id_column') or '').strip() or header[0]
              if id_col not in header:
                  sys.exit(f'op {i}: id column not in header: {id_col}')
              i_id = header.index(id_col)
              row_id = str(op.get('row_id') or '').strip()
              if not row_id:
                  sys.exit(f'op {i}: row_id required')
              mode = str(op.get('mode') or 'update').strip()

              if mode == 'add_column':
                  col = str(op.get('column') or '').strip()
                  if not col:
                      sys.exit(f'op {i}: add_column needs column')
                  if col in header:
                      print(f'column already exists {path} {col}')
                      continue
                  after_col = str(op.get('after_column') or '').strip()
                  if after_col and after_col not in header:
                      sys.exit(f'op {i}: after column not in header: {after_col}')
                  insert_at = header.index(after_col) + 1 if after_col else len(header)
                  old_width = len(header)
                  header.insert(insert_at, col)
                  for row in rows[1:]:
                      while len(row) < old_width:
                          row.append('')
                      row.insert(insert_at, '')
                  changed.add(path)
                  print(f'added column {path} {col}')
                  continue

              if mode == 'remove_column':
                  col = str(op.get('column') or '').strip()
                  if not col:
                      sys.exit(f'op {i}: remove_column needs column')
                  if col not in header:
                      sys.exit(f'op {i}: column not in header: {col}')
                  remove_at = header.index(col)
                  header.pop(remove_at)
                  for row in rows[1:]:
                      if len(row) > remove_at:
                          row.pop(remove_at)
                  changed.add(path)
                  print(f'removed column {path} {col}')
                  continue

              if mode == 'dedupe_by_key':
                  key_col = str(op.get('key_column') or '').strip()
                  if key_col not in header:
                      sys.exit(f'op {i}: key column not in header: {key_col}')
                  i_key = header.index(key_col)
                  kept = [header]
                  seen = set()
                  matched = 0
                  removed = 0
                  for row in rows[1:]:
                      if not row:
                          continue
                      while len(row) < len(header):
                          row.append('')
                      if row[i_id] != row_id:
                          kept.append(row)
                          continue
                      matched += 1
                      key = row[i_key].strip()
                      if not key:
                          sys.exit(f'op {i}: blank {key_col} while deduping {row_id!r}')
                      if key in seen:
                          removed += 1
                          continue
                      seen.add(key)
                      kept.append(row)
                  if matched < 1:
                      sys.exit(f'op {i}: found no rows for {row_id!r}')
                  if removed < 1:
                      sys.exit(f'op {i}: found no duplicate rows for {row_id!r}')
                  files[path] = kept
                  changed.add(path)
                  print(f'deduped {path} {row_id}: kept {len(seen)} unique {key_col} values, removed {removed} duplicates')
                  continue

              if mode == 'fill_blank_where':
                  match_col = str(op.get('match_column') or '').strip()
                  col = str(op.get('column') or '').strip()
                  if match_col not in header:
                      sys.exit(f'op {i}: match column not in header: {match_col}')
                  if col not in header:
                      sys.exit(f'op {i}: column not in header: {col}')
                  match_value = decode(op.get('match_value')).strip()
                  new = decode(op.get('value'))
                  if not match_value:
                      sys.exit(f'op {i}: match_value required')
                  if new == '':
                      sys.exit(f'op {i}: value required')
                  i_match = header.index(match_col)
                  i_col = header.index(col)
                  hits = 0
                  for row in rows[1:]:
                      if not row:
                          continue
                      while len(row) < len(header):
                          row.append('')
                      if row[i_match].strip() == match_value and not row[i_col].strip():
                          row[i_col] = new
                          hits += 1
                  if hits < 1:
                      sys.exit(f'op {i}: found no blank {col} values where {match_col}={match_value!r}')
                  changed.add(path)
                  print(f'filled {hits} blank {col} values in {path} where {match_col}={match_value!r}')
                  continue

              if mode == 'replace_text':
                  col = str(op.get('column') or '').strip()
                  if col not in header:
                      sys.exit(f'op {i}: column not in header: {col}')
                  old = decode(op.get('from'))
                  new = decode(op.get('to'))
                  if not old:
                      sys.exit(f'op {i}: replace_text needs non-empty from')
                  i_col = header.index(col)
                  hits = 0
                  for row in rows[1:]:
                      if not row:
                          continue
                      while len(row) < len(header):
                          row.append('')
                      if old in row[i_col]:
                          row[i_col] = row[i_col].replace(old, new)
                          hits += 1
                  if hits < 1:
                      sys.exit(f'op {i}: replace_text found no matches for {old!r}')
                  changed.add(path)
                  print(f'replaced {old!r} in {hits} rows of {path} column {col}')
                  continue

              if mode == 'delete_where':
                  where = op.get('where')
                  if not isinstance(where, dict) or not where:
                      sys.exit(f'op {i}: delete_where needs where')
                  for col in where:
                      if col not in header:
                          sys.exit(f'op {i}: column not in header: {col}')
                  kept = [header]
                  hits = 0
                  for row in rows[1:]:
                      if not row:
                          continue
                      while len(row) < len(header):
                          row.append('')
                      matched = True
                      for col, val in where.items():
                          if row[header.index(col)] != decode(val):
                              matched = False
                              break
                      if matched:
                          hits += 1
                          continue
                      kept.append(row)
                  if hits < 1:
                      sys.exit(f'op {i}: delete_where found no rows for {where!r}')
                  files[path] = kept
                  changed.add(path)
                  print(f'deleted {hits} rows from {path} where {where}')
                  continue

              if mode == 'delete':
                  kept = [header]
                  hits = 0
                  for row in rows[1:]:
                      if not row:
                          continue
                      if len(row) > i_id and row[i_id] == row_id:
                          hits += 1
                          continue
                      kept.append(row)
                  if hits != 1:
                      sys.exit(f'op {i}: expected 1 row for {row_id!r}, found {hits}')
                  files[path] = kept
                  changed.add(path)
                  print(f'deleted {path} {row_id}')
                  continue

              if mode == 'insert':
                  existing = 0
                  for row in rows[1:]:
                      if row and len(row) > i_id and row[i_id] == row_id:
                          existing += 1
                  allow_duplicate_id = bool(op.get('allow_duplicate_id'))
                  if existing and not allow_duplicate_id:
                      sys.exit(f'op {i}: row already exists: {row_id}')
                  sets = op.get('sets')
                  if not isinstance(sets, dict) or not sets:
                      sys.exit(f'op {i}: insert needs sets')
                  new_row = [''] * len(header)
                  new_row[i_id] = row_id
                  for col, val in sets.items():
                      if col not in header:
                          sys.exit(f'op {i}: column not in header: {col}')
                      new_row[header.index(col)] = decode(val)
                  after = str(op.get('after_row_id') or '').strip()
                  if after:
                      placed = False
                      kept = [header]
                      for row in rows[1:]:
                          kept.append(row)
                          if row and len(row) > i_id and row[i_id] == after:
                              kept.append(new_row)
                              placed = True
                      if not placed:
                          sys.exit(f'op {i}: after_row_id not found: {after}')
                      files[path] = kept
                  else:
                      rows.append(new_row)
                      files[path] = rows
                  changed.add(path)
                  print(f'inserted {path} {row_id}')
                  continue

              if mode != 'update':
                  sys.exit(f'op {i}: unknown mode {mode}')

              sets = op.get('sets')
              if not isinstance(sets, dict) or not sets:
                  sets = {}
                  if op.get('column'):
                      sets[str(op['column'])] = op.get('value', '')
                  if op.get('column_2'):
                      sets[str(op['column_2'])] = op.get('value_2', '')
              if not sets:
                  sys.exit(f'op {i}: update needs sets or column/value')

              hits = 0
              for row in rows[1:]:
                  if not row:
                      continue
                  while len(row) < len(header):
                      row.append('')
                  if row[i_id] != row_id:
                      continue
                  for col, val in sets.items():
                      if col not in header:
                          sys.exit(f'op {i}: column not in header: {col}')
                      row[header.index(col)] = decode(val)
                  hits += 1
              if hits != 1:
                  sys.exit(f'op {i}: expected 1 row for {row_id!r}, found {hits}')
              changed.add(path)
              print(f'updated {path} {row_id} {list(sets)}')

          for path, rows in files.items():
              if path not in changed:
                  continue
              with path.open('w', newline='', encoding='utf-8') as f:
                  csv.writer(f, lineterminator='\n').writerows(rows)
          print('changed', ' '.join(str(p) for p in sorted(changed)))
          PY

      - name: Refresh manifests
        run: python3 scripts/data_schema.py manifest

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- data
          if git diff --cached --quiet; then
            echo "No change"
            exit 0
          fi
          git commit -m "Patch CSV line items"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
