name: Patch CSV

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-csv.yml'
  workflow_dispatch:
    inputs:
      patches:
        description: JSON list of operations. One run, one commit.
        required: true
        type: string

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply patches
        env:
          PATCHES: ${{ inputs.patches || '[{"file":"data/orks/Unit_Profiles.csv","id_column":"Unit_ID","row_id":"BIGED_BOSSBUNKA","sets":{"Abilities":"RAUCOUS_OCCUPANTS, RAMSHACKLE_COVER","Other_Abilities":"DEADLY_DEMISE_D3, FORTIFICATION, TRANSPORT_BOSSBUNKA, COMPOSITION_BOSSBUNKA, FIRING_DECK_11"}},{"file":"data/orks/Unit_Profiles.csv","id_column":"Unit_ID","row_id":"BLITZA_BOMMER","sets":{"Abilities":"BOOM_BOMB","Other_Abilities":"DAMAGED_4, DEADLY_DEMISE_D3"}},{"file":"data/orks/Unit_Profiles.csv","id_column":"Unit_ID","row_id":"DAKKAJET","sets":{"Abilities":"STRAFING_RUN","Other_Abilities":"DAMAGED_4, DEADLY_DEMISE_D3, COMPOSITION_DAKKAJET"}},{"file":"data/orks/Unit_Profiles.csv","id_column":"Unit_ID","row_id":"BURNA_BOMMER","sets":{"Abilities":"BURNA_BOMB","Other_Abilities":"DAMAGED_4, DEADLY_DEMISE_D3, COMPOSITION_BURNA_BOMMER"}},{"file":"data/orks/Unit_Profiles.csv","id_column":"Unit_ID","row_id":"WAZBOM_BLASTAJET","sets":{"Abilities":"GO_FER_DA_WEAK_SPOT, WAZBOM_FORCE_FIELD","Other_Abilities":"DAMAGED_4, DEADLY_DEMISE_D3"}},{"file":"data/orks/Abilities.csv","id_column":"Ability_ID","row_id":"TRANSPORT_GUNWAGON","column":"Ability Name","value":"Transport 12"},{"file":"data/orks/Abilities.csv","id_column":"Ability_ID","row_id":"TRANSPORT_KILL_RIG","column":"Ability Name","value":"Transport 12"},{"file":"data/orks/Abilities.csv","id_column":"Ability_ID","row_id":"TRANSPORT_STOMPA","column":"Ability Name","value":"Transport 22"},{"file":"data/orks/Abilities.csv","id_column":"Ability_ID","row_id":"TRANSPORT_TRUKK","column":"Ability Name","value":"Transport 12"},{"file":"data/orks/Abilities.csv","id_column":"Ability_ID","row_id":"TRANSPORT_GORK_MORK","column":"Ability Name","value":"Transport 12"},{"file":"data/orks/Abilities.csv","id_column":"Ability_ID","row_id":"TRANSPORT_HUNTA_RIG","column":"Ability Name","value":"Transport 22"},{"file":"data/orks/Abilities.csv","id_column":"Ability_ID","row_id":"TRANSPORT_BOSSBUNKA","column":"Ability Name","value":"Transport 11"},{"file":"data/marines/Unit_Profiles.csv","id_column":"Unit_ID","row_id":"ADRAX_AGATONE","sets":{"Abilities":"UNTO_THE_ANVIL, LORD_OF_THE_PYROCLASTS, ADRAX_AGATONE_UNIT_COMPOSITION","Other_Abilities":"LEADER"}},{"file":"data/marines/Unit_Profiles.csv","id_column":"Unit_ID","row_id":"AETHON_SHAAN","sets":{"Abilities":"MASTER_OF_SHADOWS, BLACKWING_MANTLE, AETHON_SHAAN_UNIT_COMPOSITION","Other_Abilities":"DEEP_STRIKE, LONE_OPERATIVE, STEALTH"}},{"file":"data/marines/Unit_Profiles.csv","id_column":"Unit_ID","row_id":"AGGRESSORS","sets":{"Abilities":"CLOSE_QUARTERS_FIREPOWER","Other_Abilities":""}},{"file":"data/marines/Unit_Profiles.csv","id_column":"Unit_ID","row_id":"ANCIENT","sets":{"Abilities":"HONOUR_OF_THE_COMPANY","Other_Abilities":"SUPPORT, RAISE_THE_BANNER"}},{"file":"data/marines/Unit_Profiles.csv","id_column":"Unit_ID","row_id":"ASSAULT_INTERCESSORS","sets":{"Abilities":"TARGETED_INTERCESSION","Other_Abilities":""}},{"file":"data/marines/Unit_Profiles.csv","id_column":"Unit_ID","row_id":"ASSAULT_INTERCESSORS_WITH_JUMP_PACKS","sets":{"Abilities":"HAMMER_OF_WRATH","Other_Abilities":"DEEP_STRIKE"}},{"file":"data/marines/Unit_Profiles.csv","id_column":"Unit_ID","row_id":"AZRAEL","sets":{"Abilities":"SUPREME_GRAND_MASTER, THE_LION_HELM","Other_Abilities":"LEADER_AZRAEL, MASTERFUL_TACTICIAN"}},{"file":"data/marines/Unit_Profiles.csv","id_column":"Unit_ID","row_id":"BALLISTUS","sets":{"Abilities":"BALLISTUS_STRIKE","Other_Abilities":"DAMAGED_1_4, DEADLY_DEMISE_D3"}},{"file":"data/marines/Unit_Profiles.csv","id_column":"Unit_ID","row_id":"BELIAL","sets":{"Abilities":"GRAND_MASTER_OF_THE_DEATHWING, STRIKES_OF_RETRIBUTION","Other_Abilities":"DEEP_STRIKE, LEADER_BELIAL"}},{"file":"data/marines/Unit_Profiles.csv","id_column":"Unit_ID","row_id":"BLADEGUARD_VETS","sets":{"Abilities":"BLADEGUARD","Other_Abilities":""}},{"file":"data/marines/Unit_Profiles.csv","id_column":"Unit_ID","row_id":"BRUTALIS","sets":{"Abilities":"BRUTALIS_CHARGE","Other_Abilities":"DEADLY_DEMISE_D3, DAMAGED_1_4"}},{"file":"data/marines/Unit_Profiles.csv","id_column":"Unit_ID","row_id":"CAANOK_VAR","sets":{"Abilities":"COLD_AND_CALCULATING, CEREBREX_LOGIC_ENGINE, CAANOK_VAR_UNIT_COMPOSITION","Other_Abilities":"FNP_5, DEEP_STRIKE, LEADER"}},{"file":"data/marines/Unit_Profiles.csv","id_column":"Unit_ID","row_id":"CALLIDUS_ASSASSIN","sets":{"Abilities":"ACROBATIC_ESCAPE, REIGN_OF_CONFUSION","Other_Abilities":"LONE_OPERATIVE, FIGHTS_FIRST, DEEP_STRIKE, INFILTRATORS"}},{"file":"data/marines/Unit_Profiles.csv","id_column":"Unit_ID","row_id":"CAPTAIN_FIST_PLASMA","sets":{"Abilities":"FINEST_HOUR, CAPTAIN_UNIT_COMPOSITION","Other_Abilities":"LEADER, CAPTAIN_STRATEGIC_ACUMEN"}},{"file":"data/marines/Unit_Profiles.csv","id_column":"Unit_ID","row_id":"CAPTAIN_IN_GRAVIS_ARMOUR","sets":{"Abilities":"REFUSE_TO_YIELD","Other_Abilities":"LEADER, CAPTAIN_STRATEGIC_ACUMEN"}},{"file":"data/marines/Unit_Profiles.csv","id_column":"Unit_ID","row_id":"CAPTAIN_IN_PHOBOS_ARMOUR","sets":{"Abilities":"TACTICAL_FLUIDITY_CAPTAIN_PHOBOS","Other_Abilities":"INFILTRATORS, STEALTH, DEEP_STRIKE, SCOUTS_6, LEADER, CAPTAIN_STRATEGIC_ACUMEN"}},{"file":"data/marines/Unit_Profiles.csv","id_column":"Unit_ID","row_id":"CAPTAIN_IN_TERMINATOR_ARMOUR","sets":{"Abilities":"UNSTOPPABLE_VALOUR","Other_Abilities":"DEEP_STRIKE, LEADER, CAPTAIN_STRATEGIC_ACUMEN"}},{"file":"data/marines/Unit_Profiles.csv","id_column":"Unit_ID","row_id":"CAPTAIN_WITH_JUMP_PACK","sets":{"Abilities":"ANGELS_WRATH, RITES_OF_BATTLE","Other_Abilities":"DEEP_STRIKE, LEADER_CAPTAIN_WITH_JUMP_PACK"}},{"file":"data/marines/Unit_Profiles.csv","id_column":"Unit_ID","row_id":"CENTURION_DEVASTATOR_SQUAD","sets":{"Abilities":"DECIMATOR_PROTOCOLS","Other_Abilities":""}},{"file":"data/marines/Unit_Profiles.csv","id_column":"Unit_ID","row_id":"CHAPLAIN_WITH_JUMP_PACK","sets":{"Abilities":"EXHORTATION_OF_RAGE","Other_Abilities":"DEEP_STRIKE, LEADER, LITANY_OF_HATE"}},{"file":"data/marines/Unit_Profiles.csv","id_column":"Unit_ID","row_id":"COMPANY_HEROES","sets":{"Abilities":"COMMAND_SQUAD","Other_Abilities":"RAISE_THE_BANNER"}},{"file":"data/marines/Unit_Profiles.csv","id_column":"Unit_ID","row_id":"DEATHWING_KNIGHTS","sets":{"Abilities":"INNER_CIRCLE","Other_Abilities":"DEEP_STRIKE, Teleport_Homer, WATCHER_IN_THE_DARK"}},{"file":"data/marines/Unit_Profiles.csv","id_column":"Unit_ID","row_id":"DEATHWING_TERMINATORS","sets":{"Abilities":"DEATHWING","Other_Abilities":"DEEP_STRIKE, Teleport_Homer, WATCHER_IN_THE_DARK"}},{"file":"data/marines/Unit_Profiles.csv","id_column":"Unit_ID","row_id":"DESOLATION_SQUAD","sets":{"Abilities":"TARGETER_OPTICS","Other_Abilities":""}},{"file":"data/marines/Unit_Profiles.csv","id_column":"Unit_ID","row_id":"ELIMINATOR_SQUAD","sets":{"Abilities":"CHAMELEOLINE_CLOAKS, SPECIAL_ISSUE_OPTICS_AND_AMMUNITION","Other_Abilities":"INFILTRATORS, STEALTH"}},{"file":"data/marines/Unit_Profiles.csv","id_column":"Unit_ID","row_id":"ERADICATOR_SQUAD_HEAVY_BOLTERS","sets":{"Abilities":"OVERLAPPING_DESTRUCTION","Other_Abilities":""}},{"file":"data/marines/Unit_Profiles.csv","id_column":"Unit_ID","row_id":"ERADICATOR_SQUAD_MELTA","sets":{"Abilities":"TOTAL_OBLITERATION","Other_Abilities":""}},{"file":"data/marines/Unit_Profiles.csv","id_column":"Unit_ID","row_id":"GLADIATOR_LANCER","sets":{"Abilities":"AQUILON_OPTICS","Other_Abilities":"DEADLY_DEMISE_D3, DAMAGED_1_4"}},{"file":"data/marines/Unit_Profiles.csv","id_column":"Unit_ID","row_id":"GLADIATOR_REAPER","sets":{"Abilities":"REAPING_TALLY","Other_Abilities":"DEADLY_DEMISE_D3, DAMAGED_1_4"}},{"file":"data/marines/Unit_Profiles.csv","id_column":"Unit_ID","row_id":"GLADIATOR_VALIANT","sets":{"Abilities":"PRIORITY_TARGET_ACQUISITION","Other_Abilities":"DEADLY_DEMISE_D3, DAMAGED_1_4"}},{"file":"data/marines/Unit_Profiles.csv","id_column":"Unit_ID","row_id":"HEAVY_INTERCESSORS","sets":{"Abilities":"UNYIELDING_IN_THE_FACE_OF_THE_FOE","Other_Abilities":""}},{"file":"data/marines/Unit_Profiles.csv","id_column":"Unit_ID","row_id":"HELLBLASTER_SQUAD","sets":{"Abilities":"RITES_OF_THERMAL_APPEASEMENT","Other_Abilities":""}},{"file":"data/marines/Unit_Profiles.csv","id_column":"Unit_ID","row_id":"IMPULSOR_Orbital","sets":{"Abilities":"RAPID_DISEMBARKATION","Other_Abilities":"DEADLY_DEMISE_D3, FIRING_DECK_7, TRANSPORT_IMPULSOR"}},{"file":"data/marines/Unit_Profiles.csv","id_column":"Unit_ID","row_id":"INCEPTORS_PLASMA","sets":{"Abilities":"METEORIC_DESCENT, PARABOLIC_JETLEAP","Other_Abilities":"DEEP_STRIKE"}},{"file":"data/marines/Unit_Profiles.csv","id_column":"Unit_ID","row_id":"INCURSORS","sets":{"Abilities":"HAYWIRE_MINE, DIVINATOR_CLASS_AUSPEXES","Other_Abilities":"SCOUTS_6"}},{"file":"data/marines/Unit_Profiles.csv","id_column":"Unit_ID","row_id":"INFERNUS_SQUAD","sets":{"Abilities":"DRIVEN_FROM_COVER","Other_Abilities":""}},{"file":"data/marines/Unit_Profiles.csv","id_column":"Unit_ID","row_id":"INFILTRATORS","sets":{"Abilities":"OMNI_SCRAMBLERS","Other_Abilities":"INFILTRATORS"}},{"file":"data/marines/Unit_Profiles.csv","id_column":"Unit_ID","row_id":"INNER_CIRCLE_COMPANIONS","sets":{"Abilities":"BRAZIERS_OF_JUDGEMENT, ENMITY_FOR_THE_UNWORTHY","Other_Abilities":""}}]' }}
        run: |
          python3 <<'PY'
          import csv, json, os, sys
          from pathlib import Path

          raw = os.environ.get('PATCHES') or ''
          if not raw.strip():
              print('no PATCHES input; skip apply')
              raise SystemExit(0)
          try:
              ops = json.loads(raw)
          except json.JSONDecodeError as e:
              sys.exit(f'patches is not JSON: {e}')
          if not isinstance(ops, list) or not ops:
              sys.exit('patches must be a non-empty JSON list')

          def decode(val):
              if val is None:
                  return ''
              s = str(val)
              return s.replace('\\n', '\n')

          def load_csv(path):
              if path.is_absolute() or '..' in path.parts:
                  sys.exit(f'bad path {path}')
              if not str(path).startswith('data/') or path.suffix.lower() != '.csv':
                  sys.exit(f'file must be a .csv under data/: {path}')
              if not path.is_file():
                  sys.exit(f'missing {path}')
              with path.open(encoding='utf-8', newline='') as f:
                  rows = list(csv.reader(f))
              if not rows:
                  sys.exit(f'empty csv {path}')
              return rows

          files = {}
          changed = set()

          for i, op in enumerate(ops):
              if not isinstance(op, dict):
                  sys.exit(f'op {i} is not an object')
              path = Path(str(op.get('file', '')).strip())
              if path not in files:
                  files[path] = load_csv(path)
              rows = files[path]
              header = rows[0]
              id_col = str(op.get('id_column') or '').strip() or header[0]
              if id_col not in header:
                  sys.exit(f'op {i}: id column not in header: {id_col}')
              i_id = header.index(id_col)
              row_id = str(op.get('row_id') or '').strip()
              if not row_id:
                  sys.exit(f'op {i}: row_id required')
              mode = str(op.get('mode') or 'update').strip()

              if mode == 'add_column':
                  col = str(op.get('column') or '').strip()
                  if not col:
                      sys.exit(f'op {i}: add_column needs column')
                  if col in header:
                      print(f'column already exists {path} {col}')
                      continue
                  after_col = str(op.get('after_column') or '').strip()
                  if after_col and after_col not in header:
                      sys.exit(f'op {i}: after column not in header: {after_col}')
                  insert_at = header.index(after_col) + 1 if after_col else len(header)
                  old_width = len(header)
                  header.insert(insert_at, col)
                  for row in rows[1:]:
                      while len(row) < old_width:
                          row.append('')
                      row.insert(insert_at, '')
                  changed.add(path)
                  print(f'added column {path} {col}')
                  continue

              if mode == 'remove_column':
                  col = str(op.get('column') or '').strip()
                  if not col:
                      sys.exit(f'op {i}: remove_column needs column')
                  if col not in header:
                      sys.exit(f'op {i}: column not in header: {col}')
                  remove_at = header.index(col)
                  header.pop(remove_at)
                  for row in rows[1:]:
                      if len(row) > remove_at:
                          row.pop(remove_at)
                  changed.add(path)
                  print(f'removed column {path} {col}')
                  continue

              if mode == 'dedupe_by_key':
                  key_col = str(op.get('key_column') or '').strip()
                  if key_col not in header:
                      sys.exit(f'op {i}: key column not in header: {key_col}')
                  i_key = header.index(key_col)
                  kept = [header]
                  seen = set()
                  matched = 0
                  removed = 0
                  for row in rows[1:]:
                      if not row:
                          continue
                      while len(row) < len(header):
                          row.append('')
                      if row[i_id] != row_id:
                          kept.append(row)
                          continue
                      matched += 1
                      key = row[i_key].strip()
                      if not key:
                          sys.exit(f'op {i}: blank {key_col} while deduping {row_id!r}')
                      if key in seen:
                          removed += 1
                          continue
                      seen.add(key)
                      kept.append(row)
                  if matched < 1:
                      sys.exit(f'op {i}: found no rows for {row_id!r}')
                  if removed < 1:
                      sys.exit(f'op {i}: found no duplicate rows for {row_id!r}')
                  files[path] = kept
                  changed.add(path)
                  print(f'deduped {path} {row_id}: kept {len(seen)} unique {key_col} values, removed {removed} duplicates')
                  continue

              if mode == 'fill_blank_where':
                  match_col = str(op.get('match_column') or '').strip()
                  col = str(op.get('column') or '').strip()
                  if match_col not in header:
                      sys.exit(f'op {i}: match column not in header: {match_col}')
                  if col not in header:
                      sys.exit(f'op {i}: column not in header: {col}')
                  match_value = decode(op.get('match_value')).strip()
                  new = decode(op.get('value'))
                  if not match_value:
                      sys.exit(f'op {i}: match_value required')
                  if new == '':
                      sys.exit(f'op {i}: value required')
                  i_match = header.index(match_col)
                  i_col = header.index(col)
                  hits = 0
                  for row in rows[1:]:
                      if not row:
                          continue
                      while len(row) < len(header):
                          row.append('')
                      if row[i_match].strip() == match_value and not row[i_col].strip():
                          row[i_col] = new
                          hits += 1
                  if hits < 1:
                      sys.exit(f'op {i}: found no blank {col} values where {match_col}={match_value!r}')
                  changed.add(path)
                  print(f'filled {hits} blank {col} values in {path} where {match_col}={match_value!r}')
                  continue

              if mode == 'replace_text':
                  col = str(op.get('column') or '').strip()
                  if col not in header:
                      sys.exit(f'op {i}: column not in header: {col}')
                  old = decode(op.get('from'))
                  new = decode(op.get('to'))
                  if not old:
                      sys.exit(f'op {i}: replace_text needs non-empty from')
                  i_col = header.index(col)
                  hits = 0
                  for row in rows[1:]:
                      if not row:
                          continue
                      while len(row) < len(header):
                          row.append('')
                      if old in row[i_col]:
                          row[i_col] = row[i_col].replace(old, new)
                          hits += 1
                  if hits < 1:
                      sys.exit(f'op {i}: replace_text found no matches for {old!r}')
                  changed.add(path)
                  print(f'replaced {old!r} in {hits} rows of {path} column {col}')
                  continue

              if mode == 'delete_where':
                  where = op.get('where')
                  if not isinstance(where, dict) or not where:
                      sys.exit(f'op {i}: delete_where needs where')
                  for col in where:
                      if col not in header:
                          sys.exit(f'op {i}: column not in header: {col}')
                  kept = [header]
                  hits = 0
                  for row in rows[1:]:
                      if not row:
                          continue
                      while len(row) < len(header):
                          row.append('')
                      matched = True
                      for col, val in where.items():
                          if row[header.index(col)] != decode(val):
                              matched = False
                              break
                      if matched:
                          hits += 1
                          continue
                      kept.append(row)
                  if hits < 1:
                      sys.exit(f'op {i}: delete_where found no rows for {where!r}')
                  files[path] = kept
                  changed.add(path)
                  print(f'deleted {hits} rows from {path} where {where}')
                  continue

              if mode == 'delete':
                  kept = [header]
                  hits = 0
                  for row in rows[1:]:
                      if not row:
                          continue
                      if len(row) > i_id and row[i_id] == row_id:
                          hits += 1
                          continue
                      kept.append(row)
                  if hits != 1:
                      sys.exit(f'op {i}: expected 1 row for {row_id!r}, found {hits}')
                  files[path] = kept
                  changed.add(path)
                  print(f'deleted {path} {row_id}')
                  continue

              if mode == 'insert':
                  existing = 0
                  for row in rows[1:]:
                      if row and len(row) > i_id and row[i_id] == row_id:
                          existing += 1
                  allow_duplicate_id = bool(op.get('allow_duplicate_id'))
                  if existing and not allow_duplicate_id:
                      sys.exit(f'op {i}: row already exists: {row_id}')
                  sets = op.get('sets')
                  if not isinstance(sets, dict) or not sets:
                      sys.exit(f'op {i}: insert needs sets')
                  new_row = [''] * len(header)
                  new_row[i_id] = row_id
                  for col, val in sets.items():
                      if col not in header:
                          sys.exit(f'op {i}: column not in header: {col}')
                      new_row[header.index(col)] = decode(val)
                  after = str(op.get('after_row_id') or '').strip()
                  if after:
                      placed = False
                      kept = [header]
                      for row in rows[1:]:
                          kept.append(row)
                          if row and len(row) > i_id and row[i_id] == after:
                              kept.append(new_row)
                              placed = True
                      if not placed:
                          sys.exit(f'op {i}: after_row_id not found: {after}')
                      files[path] = kept
                  else:
                      rows.append(new_row)
                      files[path] = rows
                  changed.add(path)
                  print(f'inserted {path} {row_id}')
                  continue

              if mode != 'update':
                  sys.exit(f'op {i}: unknown mode {mode}')

              sets = op.get('sets')
              if not isinstance(sets, dict) or not sets:
                  sets = {}
                  if op.get('column'):
                      sets[str(op['column'])] = op.get('value', '')
                  if op.get('column_2'):
                      sets[str(op['column_2'])] = op.get('value_2', '')
              if not sets:
                  sys.exit(f'op {i}: update needs sets or column/value')

              hits = 0
              for row in rows[1:]:
                  if not row:
                      continue
                  while len(row) < len(header):
                      row.append('')
                  if row[i_id] != row_id:
                      continue
                  for col, val in sets.items():
                      if col not in header:
                          sys.exit(f'op {i}: column not in header: {col}')
                      row[header.index(col)] = decode(val)
                  hits += 1
              if hits != 1:
                  sys.exit(f'op {i}: expected 1 row for {row_id!r}, found {hits}')
              changed.add(path)
              print(f'updated {path} {row_id} {list(sets)}')

          for path, rows in files.items():
              if path not in changed:
                  continue
              with path.open('w', newline='', encoding='utf-8') as f:
                  csv.writer(f, lineterminator='\n').writerows(rows)
          print('changed', ' '.join(str(p) for p in sorted(changed)))
          PY

      - name: Refresh manifests
        run: python3 scripts/data_schema.py manifest

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- data
          if git diff --cached --quiet; then
            echo "No change"
            exit 0
          fi
          git commit -m "Patch CSV line items"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
