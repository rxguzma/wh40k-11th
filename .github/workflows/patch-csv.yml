name: Patch CSV

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-csv.yml'
  workflow_dispatch:
    inputs:
      patches:
        description: JSON list of operations. One run, one commit.
        required: true
        type: string

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply patches
        env:
          PATCHES: ${{ inputs.patches || '[{"file":"data/orks/Enhancements.csv","id_column":"Enhancement_ID","row_id":"orks_bully_boyz_enhancement_tellyporta_boss","column":"Short_Description","value":"MEGA ARMOUR model only. This unit (excluding VEHICLE) has Deep Strike. [DEEP STRIKE]"},{"file":"data/orks/Enhancements.csv","id_column":"Enhancement_ID","row_id":"orks_taktikal_brigade_enhancement_kill_kommanda","column":"Short_Description","value":"BIG MEK / WARBOSS INFANTRY model only. While part of an attached unit, this model has Infiltrators and Stealth. [INFILTRATORS] [STEALTH]"},{"file":"data/orks/Enhancements.csv","id_column":"Enhancement_ID","row_id":"orks_taktikal_brigade_enhancement_throat_slittas","column":"Short_Description","value":"KOMMANDOS / STORMBOYZ unit only. Melee has [LETHAL HITS\u003A non-MONSTER / VEHICLE]. [LETHAL HITS]"},{"file":"data/orks/Enhancements.csv","id_column":"Enhancement_ID","row_id":"orks_wreckas_enhancement_kaptins_hat","column":"Short_Description","value":"BIG MEK / WARBOSS INFANTRY only.\\nAfter deployment, redeploy 3 INFANTRY; can go into Strategic Reserves ignoring limits. [REDEPLOY 3]"},{"file":"data/orks/Enhancements.csv","id_column":"Enhancement_ID","row_id":"orks_da_big_hunt_enhancement_glory_hog","column":"Short_Description","value":"BEAST SNAGGA model only. Fall Back does not prevent this unit from charging. [FALL BACK AND CHARGE]"},{"file":"data/orks/Enhancements.csv","id_column":"Enhancement_ID","row_id":"orks_da_big_hunt_enhancement_it_came_from_da_drops","column":"Short_Description","value":"BEASTBOSS ON SQUIGOSAUR model only. This model has +1 T. [+1 T]"},{"file":"data/orks/Enhancements.csv","id_column":"Enhancement_ID","row_id":"orks_madcap_meks_enhancement_mekwaaagh_mastermind","column":"Short_Description","value":"BIG MEK model only. This unit is RILED UP. [RILED UP] [5++ Invul]"},{"file":"data/orks/Enhancements.csv","id_column":"Enhancement_ID","row_id":"orks_madcap_meks_enhancement_temperamental_shokka","column":"Short_Description","value":"BIG MEK WITH SHOKK ATTACK GUN\u003A on shoot, D6 — 1 Torrent then destroyed; 2-5 +1 A; 6 Sustained Hits 2. [TORRENT] [+1 A] [SUSTAINED HITS 2]"},{"file":"data/orks/Enhancements.csv","id_column":"Enhancement_ID","row_id":"orks_madcap_meks_enhancement_enhanced_runt_maw","column":"Short_Description","value":"BIG MEK WITH SHOKK ATTACK GUN\u003A after shooting, one hit enemy is infested with Snotlings (−1 Leadership). [ENEMY -1 LD]"},{"file":"data/orks/Enhancements.csv","id_column":"Enhancement_ID","row_id":"orks_dread_mob_enhancement_cybork_boosta","column":"Short_Description","value":"BIG MEK / MEK model\u003A +2\" M. [+2 M”]"},{"file":"data/orks/Enhancements.csv","id_column":"Enhancement_ID","row_id":"orks_dread_mob_enhancement_dreadherder","column":"Short_Description","value":"BIG MEK\u003A within 3\" of WALKER\\nMEK gets Lone Op.\\nAlso, WALKER within 3\" re-rolls hit 1s. [RE-ROLL 1S TO HIT]"},{"file":"data/orks/Enhancements.csv","id_column":"Enhancement_ID","row_id":"orks_kult_of_speed_enhancement_smoky_gubbinz","column":"Short_Description","value":"SPEED FREEKS (not AIRCRAFT)\u003A if an attack loses full visibility because of a model in this unit, the target has cover vs that attack. [TARGET GETS COVER]"},{"file":"data/orks/Enhancements.csv","id_column":"Enhancement_ID","row_id":"orks_kult_of_speed_enhancement_competitive_streak","column":"Short_Description","value":"DEFFKILLA WARTRIKE model only. This unit can re-roll charge rolls. [RE-ROLL CHARGE]"},{"file":"data/orks/Enhancements.csv","id_column":"Enhancement_ID","row_id":"orks_flyboyz_enhancement_flyboss","column":"Short_Description","value":"ORKS AIRCRAFT\u003A unit is CHARACTER. After an ingress move, friendly ORKS AIRCRAFT / DEFFKOPTAS within 6\" are RILED UP until start of your next turn. [RILED UP] [5++ Invul]"},{"file":"data/orks/Enhancements.csv","id_column":"Enhancement_ID","row_id":"orks_flyboyz_enhancement_impulsive_recon","column":"Short_Description","value":"ORKS AIRCRAFT unit only. In the first Movement phase, this unit can make an ingress move. [INGRESS MOVE]"},{"file":"data/orks/Enhancements.csv","id_column":"Enhancement_ID","row_id":"orks_brute_bosses_enhancement_brutal_but_kunnin","column":"Short_Description","value":"WARBOSS model only.\\nModel melee have +1 D. [+1 D]"},{"file":"data/orks/Enhancements.csv","id_column":"Enhancement_ID","row_id":"orks_brute_bosses_enhancement_blitzboss","column":"Short_Description","value":"WARBOSS. TRANSPORT its embarked in has +2\" M and 5+ InSv.\\n\\nExcludes WALKER [+2 M”] [INVULNERABLE SAVE 5+]"},{"file":"data/orks/Enhancements.csv","id_column":"Enhancement_ID","row_id":"orks_brute_bosses_enhancement_proper_killy","column":"Short_Description","value":"WARBOSS model.\\nRe-roll hit rolls of 1. [RE-ROLL 1S TO HIT] [RE-ROLL 1S TO HIT]"},{"file":"data/orks/Stratagems.csv","id_column":"Stratagem_ID","row_id":"orks_war_horde_stratagem_fungus_fuel_injection_1cp","column":"Short_Description","value":"Movement\u003A MOUNTED / VEHICLE +2\" M. [+2 M”]"},{"file":"data/orks/Stratagems.csv","id_column":"Stratagem_ID","row_id":"orks_freebooter_krew_stratagem_bash_and_grab_1cp","column":"Short_Description","value":"FIGHT\u003A ORKS can re‑roll To Wound within loot objective. [RE-ROLL ALL WOUNDS]"},{"file":"data/orks/Stratagems.csv","id_column":"Stratagem_ID","row_id":"orks_freebooter_krew_stratagem_boardin_rush_1cp","column":"Short_Description","value":"MOVEMENT\u003A ORKS Advance flat 6″ instead of rolling. [+6 M”]"},{"file":"data/orks/Stratagems.csv","id_column":"Stratagem_ID","row_id":"orks_rollin_deff_stratagem_devastating_drift_1cp","column":"Short_Description","value":"FIGHT\u003A A WAGON unit that charged this turn has melee attacks with [CLEAVE 1]. [CLEAVE 1]"},{"file":"data/orks/Stratagems.csv","id_column":"Stratagem_ID","row_id":"orks_freebooter_krew_stratagem_rolling_loot_heap_1cp","column":"Short_Description","value":"SHOOTING\u003A Flash Gitz ranged gain [ANTI‑VEHICLE 4+] for the phase. [ANTI-VEHICLE 4+]"},{"file":"data/orks/Stratagems.csv","id_column":"Stratagem_ID","row_id":"orks_more_dakka_stratagem_speshul_shells_1cp","column":"Short_Description","value":"SHOOTING\u003A ORKS INFANTRY ranged target within 9″ have AP -1. [+1 AP]"},{"file":"data/orks/Stratagems.csv","id_column":"Stratagem_ID","row_id":"orks_green_tide_stratagem_unbridled_carnage_1cp","column":"Short_Description","value":"Fight\u003A charging BOYZ melee +1 A. [+1 A]"},{"file":"data/orks/Stratagems.csv","id_column":"Stratagem_ID","row_id":"orks_bully_boyz_stratagem_armed_to_da_teef_1cp","column":"Short_Description","value":"MEGANOBZ / NOBZ\\nSHOOT or MELE\u003A re-roll hit 1s\\nRILED UP re-roll ALL hits. [RE-ROLL 1S TO HIT] [RE-ROLL ALL HITS] [RE-ROLL 1S TO HIT] [RE-ROLL ALL HITS]"},{"file":"data/orks/Stratagems.csv","id_column":"Stratagem_ID","row_id":"orks_bully_boyz_stratagem_hulking_brutes_1cp","column":"Short_Description","value":"Enemy SHOOTING\\nMEGANOBZ / NOBZ\\n1 CP\u003A -1 To Wound for higher Strength\\n2 CP\u003A -1 To Wound for any weapons [INCOMING RANGE -1 TO WOUND]"},{"file":"data/orks/Stratagems.csv","id_column":"Stratagem_ID","row_id":"orks_wreckas_stratagem_drive_by_bustin_1cp","column":"Short_Description","value":"Shooting\u003A TRANSPORT \\nFiring Deck [+1 to hit]. [+1 TO HIT]"},{"file":"data/orks/Stratagems.csv","id_column":"Stratagem_ID","row_id":"orks_madcap_meks_stratagem_vindictive_artillerists_1cp","column":"Short_Description","value":"Shooting\u003A MEK GUNZ choose Lethal Hits, or Sustained Hits 1, or Hazardous+Lethal+Sustained 1. [LETHAL HITS] [SUSTAINED HITS 1] [HAZARDOUS]"},{"file":"data/orks/Stratagems.csv","id_column":"Stratagem_ID","row_id":"orks_kult_of_speed_stratagem_speediest_freeks_1cp","column":"Short_Description","value":"Opp Shooting\u003A ranged attacks vs SPEED FREEKS fail on an unmodified hit roll of 1-3. [INCOMING RANGE HIT 1-3 FAILS]"},{"file":"data/orks/Stratagems.csv","id_column":"Stratagem_ID","row_id":"orks_flyboyz_stratagem_long_uncontrolled_bursts_1cp","column":"Short_Description","value":"Shooting\u003A ORKS AIRCRAFT / DEFFKOPTAS re-roll hits vs FLY. [RE-ROLL ALL HITS]"},{"file":"data/orks/Stratagems.csv","id_column":"Stratagem_ID","row_id":"orks_shoota_boyz_stratagem_kustom_dakka_1cp","column":"Short_Description","value":"Shooting\u003A INFANTRY ranged [+1 To Wound] against non-MONSTER / VEHICLE units. [+1 TO WOUND]"}]' }}
        run: |
          python3 <<'PY'
          import csv, json, os, sys
          from pathlib import Path

          raw = os.environ.get('PATCHES') or ''
          if not raw.strip():
              print('no PATCHES input; skip apply')
              raise SystemExit(0)
          try:
              ops = json.loads(raw)
          except json.JSONDecodeError as e:
              sys.exit(f'patches is not JSON: {e}')
          if not isinstance(ops, list) or not ops:
              sys.exit('patches must be a non-empty JSON list')

          def decode(val):
              if val is None:
                  return ''
              s = str(val)
              return s.replace('\\n', '\n')

          def load_csv(path):
              if path.is_absolute() or '..' in path.parts:
                  sys.exit(f'bad path {path}')
              if not str(path).startswith('data/') or path.suffix.lower() != '.csv':
                  sys.exit(f'file must be a .csv under data/: {path}')
              if not path.is_file():
                  sys.exit(f'missing {path}')
              with path.open(encoding='utf-8', newline='') as f:
                  rows = list(csv.reader(f))
              if not rows:
                  sys.exit(f'empty csv {path}')
              return rows

          files = {}
          changed = set()

          for i, op in enumerate(ops):
              if not isinstance(op, dict):
                  sys.exit(f'op {i} is not an object')
              path = Path(str(op.get('file', '')).strip())
              if path not in files:
                  files[path] = load_csv(path)
              rows = files[path]
              header = rows[0]
              id_col = str(op.get('id_column') or '').strip() or header[0]
              if id_col not in header:
                  sys.exit(f'op {i}: id column not in header: {id_col}')
              i_id = header.index(id_col)
              row_id = str(op.get('row_id') or '').strip()
              if not row_id:
                  sys.exit(f'op {i}: row_id required')
              mode = str(op.get('mode') or 'update').strip()

              if mode == 'add_column':
                  col = str(op.get('column') or '').strip()
                  if not col:
                      sys.exit(f'op {i}: add_column needs column')
                  if col in header:
                      print(f'column already exists {path} {col}')
                      continue
                  after_col = str(op.get('after_column') or '').strip()
                  if after_col and after_col not in header:
                      sys.exit(f'op {i}: after column not in header: {after_col}')
                  insert_at = header.index(after_col) + 1 if after_col else len(header)
                  old_width = len(header)
                  header.insert(insert_at, col)
                  for row in rows[1:]:
                      while len(row) < old_width:
                          row.append('')
                      row.insert(insert_at, '')
                  changed.add(path)
                  print(f'added column {path} {col}')
                  continue

              if mode == 'remove_column':
                  col = str(op.get('column') or '').strip()
                  if not col:
                      sys.exit(f'op {i}: remove_column needs column')
                  if col not in header:
                      sys.exit(f'op {i}: column not in header: {col}')
                  remove_at = header.index(col)
                  header.pop(remove_at)
                  for row in rows[1:]:
                      if len(row) > remove_at:
                          row.pop(remove_at)
                  changed.add(path)
                  print(f'removed column {path} {col}')
                  continue

              if mode == 'dedupe_by_key':
                  key_col = str(op.get('key_column') or '').strip()
                  if key_col not in header:
                      sys.exit(f'op {i}: key column not in header: {key_col}')
                  i_key = header.index(key_col)
                  kept = [header]
                  seen = set()
                  matched = 0
                  removed = 0
                  for row in rows[1:]:
                      if not row:
                          continue
                      while len(row) < len(header):
                          row.append('')
                      if row[i_id] != row_id:
                          kept.append(row)
                          continue
                      matched += 1
                      key = row[i_key].strip()
                      if not key:
                          sys.exit(f'op {i}: blank {key_col} while deduping {row_id!r}')
                      if key in seen:
                          removed += 1
                          continue
                      seen.add(key)
                      kept.append(row)
                  if matched < 1:
                      sys.exit(f'op {i}: found no rows for {row_id!r}')
                  if removed < 1:
                      sys.exit(f'op {i}: found no duplicate rows for {row_id!r}')
                  files[path] = kept
                  changed.add(path)
                  print(f'deduped {path} {row_id}: kept {len(seen)} unique {key_col} values, removed {removed} duplicates')
                  continue

              if mode == 'fill_blank_where':
                  match_col = str(op.get('match_column') or '').strip()
                  col = str(op.get('column') or '').strip()
                  if match_col not in header:
                      sys.exit(f'op {i}: match column not in header: {match_col}')
                  if col not in header:
                      sys.exit(f'op {i}: column not in header: {col}')
                  match_value = decode(op.get('match_value')).strip()
                  new = decode(op.get('value'))
                  if not match_value:
                      sys.exit(f'op {i}: match_value required')
                  if new == '':
                      sys.exit(f'op {i}: value required')
                  i_match = header.index(match_col)
                  i_col = header.index(col)
                  hits = 0
                  for row in rows[1:]:
                      if not row:
                          continue
                      while len(row) < len(header):
                          row.append('')
                      if row[i_match].strip() == match_value and not row[i_col].strip():
                          row[i_col] = new
                          hits += 1
                  if hits < 1:
                      sys.exit(f'op {i}: found no blank {col} values where {match_col}={match_value!r}')
                  changed.add(path)
                  print(f'filled {hits} blank {col} values in {path} where {match_col}={match_value!r}')
                  continue

              if mode == 'replace_text':
                  col = str(op.get('column') or '').strip()
                  if col not in header:
                      sys.exit(f'op {i}: column not in header: {col}')
                  old = decode(op.get('from'))
                  new = decode(op.get('to'))
                  if not old:
                      sys.exit(f'op {i}: replace_text needs non-empty from')
                  i_col = header.index(col)
                  hits = 0
                  for row in rows[1:]:
                      if not row:
                          continue
                      while len(row) < len(header):
                          row.append('')
                      if old in row[i_col]:
                          row[i_col] = row[i_col].replace(old, new)
                          hits += 1
                  if hits < 1:
                      sys.exit(f'op {i}: replace_text found no matches for {old!r}')
                  changed.add(path)
                  print(f'replaced {old!r} in {hits} rows of {path} column {col}')
                  continue

              if mode == 'delete':
                  kept = [header]
                  hits = 0
                  for row in rows[1:]:
                      if not row:
                          continue
                      if len(row) > i_id and row[i_id] == row_id:
                          hits += 1
                          continue
                      kept.append(row)
                  if hits != 1:
                      sys.exit(f'op {i}: expected 1 row for {row_id!r}, found {hits}')
                  files[path] = kept
                  changed.add(path)
                  print(f'deleted {path} {row_id}')
                  continue

              if mode == 'insert':
                  existing = 0
                  for row in rows[1:]:
                      if row and len(row) > i_id and row[i_id] == row_id:
                          existing += 1
                  if existing:
                      sys.exit(f'op {i}: row already exists: {row_id}')
                  sets = op.get('sets')
                  if not isinstance(sets, dict) or not sets:
                      sys.exit(f'op {i}: insert needs sets')
                  new_row = [''] * len(header)
                  new_row[i_id] = row_id
                  for col, val in sets.items():
                      if col not in header:
                          sys.exit(f'op {i}: column not in header: {col}')
                      new_row[header.index(col)] = decode(val)
                  after = str(op.get('after_row_id') or '').strip()
                  if after:
                      placed = False
                      kept = [header]
                      for row in rows[1:]:
                          kept.append(row)
                          if row and len(row) > i_id and row[i_id] == after:
                              kept.append(new_row)
                              placed = True
                      if not placed:
                          sys.exit(f'op {i}: after_row_id not found: {after}')
                      files[path] = kept
                  else:
                      rows.append(new_row)
                      files[path] = rows
                  changed.add(path)
                  print(f'inserted {path} {row_id}')
                  continue

              if mode != 'update':
                  sys.exit(f'op {i}: unknown mode {mode}')

              sets = op.get('sets')
              if not isinstance(sets, dict) or not sets:
                  sets = {}
                  if op.get('column'):
                      sets[str(op['column'])] = op.get('value', '')
                  if op.get('column_2'):
                      sets[str(op['column_2'])] = op.get('value_2', '')
              if not sets:
                  sys.exit(f'op {i}: update needs sets or column/value')

              hits = 0
              for row in rows[1:]:
                  if not row:
                      continue
                  while len(row) < len(header):
                      row.append('')
                  if row[i_id] != row_id:
                      continue
                  for col, val in sets.items():
                      if col not in header:
                          sys.exit(f'op {i}: column not in header: {col}')
                      row[header.index(col)] = decode(val)
                  hits += 1
              if hits != 1:
                  sys.exit(f'op {i}: expected 1 row for {row_id!r}, found {hits}')
              changed.add(path)
              print(f'updated {path} {row_id} {list(sets)}')

          for path, rows in files.items():
              if path not in changed:
                  continue
              with path.open('w', newline='', encoding='utf-8') as f:
                  csv.writer(f, lineterminator='\n').writerows(rows)
          print('changed', ' '.join(str(p) for p in sorted(changed)))
          PY

      - name: Refresh manifests
        run: python3 scripts/data_schema.py manifest

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- data
          if git diff --cached --quiet; then
            echo "No change"
            exit 0
          fi
          git commit -m "Patch CSV line items"
          git push
