name: Patch CSV

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-csv.yml'
  workflow_dispatch:
    inputs:
      patches:
        description: JSON list of operations. One run, one commit.
        required: true
        type: string

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply patches
        env:
          PATCHES: ${{ inputs.patches || '[{"file":"data/marines/Abilities.csv","id_column":"Ability_ID","row_id":"ACROBATIC_ESCAPE","column":"Short_Description","value":"If engaged, Fall Back D6\" at end of Fight. Can go to Reserves, then Ingress. [INGRESS]"},{"file":"data/marines/Abilities.csv","id_column":"Ability_ID","row_id":"ASTARTES_BANNER","column":"Short_Description","value":"+1 OC [+1 OC]"},{"file":"data/marines/Abilities.csv","id_column":"Ability_ID","row_id":"ASTARTES_BANNER_ANCIENT","column":"Short_Description","value":"+1 OC [+1 OC]"},{"file":"data/marines/Abilities.csv","id_column":"Ability_ID","row_id":"ASTARTES_BANNER_CH","column":"Short_Description","value":"+1 OC [+1 OC]"},{"file":"data/marines/Abilities.csv","id_column":"Ability_ID","row_id":"ASTARTES_SHIELD","column":"Short_Description","value":"Invul Save\u003A 4++ [INVULNERABLE SAVE 4+]"},{"file":"data/marines/Abilities.csv","id_column":"Ability_ID","row_id":"BALLISTUS_STRIKE","column":"Short_Description","value":"Each ranged attack that targets a unit that is NOT Below Half-strength, RE-ROLL ALL HITS. [RE-ROLL ALL HITS]"},{"file":"data/marines/Abilities.csv","id_column":"Ability_ID","row_id":"BLADEGUARD","column":"Short_Description","value":"Once per turn\u003A +1 TO HIT in melee, or -1 to hit when targeted. [+1 TO HIT] [ENEMY -1 TO HIT]"},{"file":"data/marines/Abilities.csv","id_column":"Ability_ID","row_id":"BLESSING_OF_THE_OMNISSIAH","column":"Short_Description","value":"In Command phase, select Vehicle within 3\". Regain D3 wounds and, +1 TO HIT. [+1 TO HIT] [+1 TO HIT]"},{"file":"data/marines/Abilities.csv","id_column":"Ability_ID","row_id":"BRAZIERS_OF_JUDGEMENT","column":"Short_Description","value":"If being LEAD, -1 To be Hit [ENEMY -1 TO HIT]"},{"file":"data/marines/Abilities.csv","id_column":"Ability_ID","row_id":"CATECHISM_OF_FIRE","column":"Short_Description","value":"When Shooting within 12\", Unit gets DEVASTATING WOUNDS (No Save). [DEVASTATING WOUNDS]"},{"file":"data/marines/Abilities.csv","id_column":"Ability_ID","row_id":"CLOSE_QUARTERS_FIREPOWER","column":"Short_Description","value":"Ranged attack by MODEL vs. closest eligible target, +1 AP. [+1 AP]"},{"file":"data/marines/Abilities.csv","id_column":"Ability_ID","row_id":"COMMAND_SQUAD","column":"Short_Description","value":"Led = -1 To Wound [INCOMING -1 TO WOUND]"},{"file":"data/marines/Abilities.csv","id_column":"Ability_ID","row_id":"DARK_ANGELS_BODYGUARD","column":"Short_Description","value":"If within 3\" of INFANTRY then = Lone Operative (Cannot be targetted outside of 12\"). [LONE OPERATIVE]"},{"file":"data/marines/Abilities.csv","id_column":"Ability_ID","row_id":"DEATH_TO_THE_ALIEN","column":"Short_Description","value":"RE-ROLL 1S TO HIT or RE-ROLL ALL HITS if not IMPERIUM or CHAOS [RE-ROLL 1S TO HIT] [RE-ROLL ALL HITS] [RE-ROLL 1S TO HIT] [RE-ROLL ALL HITS]"},{"file":"data/marines/Abilities.csv","id_column":"Ability_ID","row_id":"DEATHWING","column":"Short_Description","value":"Ignore BS/WS modifiers.\\nOath Target\u003A +1 TO HIT [+1 TO HIT] [+1 TO HIT]"},{"file":"data/marines/Abilities.csv","id_column":"Ability_ID","row_id":"DECIMATOR_PROTOCOLS","column":"Short_Description","value":"Range\u003A RE-ROLL 1S TO HIT, if on an objective, RE-ROLL ALL HITS. [RE-ROLL 1S TO HIT] [RE-ROLL ALL HITS]"},{"file":"data/marines/Abilities.csv","id_column":"Ability_ID","row_id":"DESTRUCTOR","column":"Short_Description","value":"+1 AP vs INFANTRY [+1 AP]"},{"file":"data/marines/Abilities.csv","id_column":"Ability_ID","row_id":"DUTY_ETERNAL","column":"Short_Description","value":"-1 Damage [INCOMING -1 D]"},{"file":"data/marines/Abilities.csv","id_column":"Ability_ID","row_id":"ENMITY_FOR_THE_UNWORTHY","column":"Short_Description","value":"IF being LEAD, +1 TO HIT vs CHARACTERS [+1 TO HIT] [+1 TO HIT]"},{"file":"data/marines/Abilities.csv","id_column":"Ability_ID","row_id":"EXECUTIONER","column":"Short_Description","value":"If Target below half strength +1 TO HIT. [+1 TO HIT] [+1 TO HIT]"},{"file":"data/marines/Abilities.csv","id_column":"Ability_ID","row_id":"FEROCIOUS_ASSAULT","column":"Short_Description","value":"+1 TO HIT with Las Talon vs MONSTER/VEHICLE [+1 TO HIT]"},{"file":"data/marines/Abilities.csv","id_column":"Ability_ID","row_id":"FIGHTS_FIRST","column":"Short_Description","value":"Enabled only if all models have Fight First. [FIGHTS FIRST]"},{"file":"data/marines/Abilities.csv","id_column":"Ability_ID","row_id":"FINEST_HOUR","column":"Short_Description","value":"FIGHT\u003A melee +3 A / DEVASTATING WOUNDS [+3 A] [DEVASTATING WOUNDS]"},{"file":"data/marines/Abilities.csv","id_column":"Ability_ID","row_id":"FURY_OF_THE_FIRST","column":"Short_Description","value":"+1 TO HIT vs Oath of Moment target [+1 TO HIT] [+1 TO HIT]"},{"file":"data/marines/Abilities.csv","id_column":"Ability_ID","row_id":"GRAND_MASTER_OF_THE_DEATHWING","column":"Short_Description","value":"Leading = Unit Crits are PRECISION [PRECISION] [PRECISION]"},{"file":"data/marines/Abilities.csv","id_column":"Ability_ID","row_id":"GUERRILLA_TACTICS","column":"Short_Description","value":"Go to Strategic Reserves [STRATEGIC RESERVES]"},{"file":"data/marines/Abilities.csv","id_column":"Ability_ID","row_id":"HAILSTRIKE","column":"Short_Description","value":"+1 AP, excluding MONSTERS and VEHICLES [+1 AP]"},{"file":"data/marines/Abilities.csv","id_column":"Ability_ID","row_id":"HAMMERSTRIKE","column":"Short_Description","value":"Remove Cover IGNORES COVER [IGNORES COVER]"},{"file":"data/marines/Abilities.csv","id_column":"Ability_ID","row_id":"HAZARDOUS","column":"Short_Description","value":"After use, failed Hazardous test causes 3 mortal wounds [HAZARDOUS]"},{"file":"data/marines/Abilities.csv","id_column":"Ability_ID","row_id":"HELIX_GAUNTLET","column":"Short_Description","value":"Models in the bearer’s unit have the FNP 6+ ability. [FNP 6+]"},{"file":"data/marines/Abilities.csv","id_column":"Ability_ID","row_id":"HONOUR_OR_DEATH_CHAMPION","column":"Short_Description","value":"+1\" Adv & +1\" Charge\\n0 CP for Heroinc Intervention [+1 CHARGE] [HEROIC INTERVENTION 0CP]"},{"file":"data/marines/Abilities.csv","id_column":"Ability_ID","row_id":"IGNORES COVER","column":"Short_Description","value":"Target cannot use Benefit of Cover [IGNORES COVER]"},{"file":"data/marines/Abilities.csv","id_column":"Ability_ID","row_id":"INDOMITOR_DOCTRINES","column":"Short_Description","value":"Target Closest Target at Range then Charge and get +2 Strenght in Melee.\\n(Can split fire to closest target) [+2 S]"},{"file":"data/marines/Abilities.csv","id_column":"Ability_ID","row_id":"INFILTRATOR_COMMS_ARRAY","column":"Short_Description","value":"Each time you target the bearer’s unit with a Stratagem, roll one D6\u003A on a 5+, you gain 1CP. [GAIN 1 CP]"},{"file":"data/marines/Abilities.csv","id_column":"Ability_ID","row_id":"INFILTRATORS","column":"Short_Description","value":"During Deployment, setup anywhere 9\" away. [INFILTRATORS]"},{"file":"data/marines/Abilities.csv","id_column":"Ability_ID","row_id":"INNER_CIRCLE","column":"Short_Description","value":"-1 Damage to Unit [INCOMING -1 D]"},{"file":"data/marines/Abilities.csv","id_column":"Ability_ID","row_id":"IRON_FATHER","column":"Short_Description","value":"Within 3\" of friendly ADEPTUS ASTARTES VEHICLE = LONE OPERATIVE. [LONE OPERATIVE]"},{"file":"data/marines/Abilities.csv","id_column":"Ability_ID","row_id":"KEEP_THE_BANNER_HIGH","column":"Short_Description","value":"UNIT\\n+1 TO HIT if below Strength\\n+1 TO WOUND if HALF Strength [+1 TO HIT] [+1 TO HIT] [+1 TO WOUND] [+1 TO WOUND]"},{"file":"data/marines/Abilities.csv","id_column":"Ability_ID","row_id":"LANCE","column":"Short_Description","value":"Add +1 TO WOUND if the bearer charged this turn. [+1 TO WOUND]"},{"file":"data/marines/Abilities.csv","id_column":"Ability_ID","row_id":"LITANY_OF_HATE","column":"Short_Description","value":"Add +1 to Wound for this unit’s melee weapons [+1 TO WOUND]"}]' }}
        run: |
          python3 <<'PY'
          import csv, json, os, sys
          from pathlib import Path

          raw = os.environ.get('PATCHES') or ''
          if not raw.strip():
              print('no PATCHES input; skip apply')
              raise SystemExit(0)
          try:
              ops = json.loads(raw)
          except json.JSONDecodeError as e:
              sys.exit(f'patches is not JSON: {e}')
          if not isinstance(ops, list) or not ops:
              sys.exit('patches must be a non-empty JSON list')

          def decode(val):
              if val is None:
                  return ''
              s = str(val)
              return s.replace('\\n', '\n')

          def load_csv(path):
              if path.is_absolute() or '..' in path.parts:
                  sys.exit(f'bad path {path}')
              if not str(path).startswith('data/') or path.suffix.lower() != '.csv':
                  sys.exit(f'file must be a .csv under data/: {path}')
              if not path.is_file():
                  sys.exit(f'missing {path}')
              with path.open(encoding='utf-8', newline='') as f:
                  rows = list(csv.reader(f))
              if not rows:
                  sys.exit(f'empty csv {path}')
              return rows

          files = {}
          changed = set()

          for i, op in enumerate(ops):
              if not isinstance(op, dict):
                  sys.exit(f'op {i} is not an object')
              path = Path(str(op.get('file', '')).strip())
              if path not in files:
                  files[path] = load_csv(path)
              rows = files[path]
              header = rows[0]
              id_col = str(op.get('id_column') or '').strip() or header[0]
              if id_col not in header:
                  sys.exit(f'op {i}: id column not in header: {id_col}')
              i_id = header.index(id_col)
              row_id = str(op.get('row_id') or '').strip()
              if not row_id:
                  sys.exit(f'op {i}: row_id required')
              mode = str(op.get('mode') or 'update').strip()

              if mode == 'add_column':
                  col = str(op.get('column') or '').strip()
                  if not col:
                      sys.exit(f'op {i}: add_column needs column')
                  if col in header:
                      print(f'column already exists {path} {col}')
                      continue
                  after_col = str(op.get('after_column') or '').strip()
                  if after_col and after_col not in header:
                      sys.exit(f'op {i}: after column not in header: {after_col}')
                  insert_at = header.index(after_col) + 1 if after_col else len(header)
                  old_width = len(header)
                  header.insert(insert_at, col)
                  for row in rows[1:]:
                      while len(row) < old_width:
                          row.append('')
                      row.insert(insert_at, '')
                  changed.add(path)
                  print(f'added column {path} {col}')
                  continue

              if mode == 'remove_column':
                  col = str(op.get('column') or '').strip()
                  if not col:
                      sys.exit(f'op {i}: remove_column needs column')
                  if col not in header:
                      sys.exit(f'op {i}: column not in header: {col}')
                  remove_at = header.index(col)
                  header.pop(remove_at)
                  for row in rows[1:]:
                      if len(row) > remove_at:
                          row.pop(remove_at)
                  changed.add(path)
                  print(f'removed column {path} {col}')
                  continue

              if mode == 'dedupe_by_key':
                  key_col = str(op.get('key_column') or '').strip()
                  if key_col not in header:
                      sys.exit(f'op {i}: key column not in header: {key_col}')
                  i_key = header.index(key_col)
                  kept = [header]
                  seen = set()
                  matched = 0
                  removed = 0
                  for row in rows[1:]:
                      if not row:
                          continue
                      while len(row) < len(header):
                          row.append('')
                      if row[i_id] != row_id:
                          kept.append(row)
                          continue
                      matched += 1
                      key = row[i_key].strip()
                      if not key:
                          sys.exit(f'op {i}: blank {key_col} while deduping {row_id!r}')
                      if key in seen:
                          removed += 1
                          continue
                      seen.add(key)
                      kept.append(row)
                  if matched < 1:
                      sys.exit(f'op {i}: found no rows for {row_id!r}')
                  if removed < 1:
                      sys.exit(f'op {i}: found no duplicate rows for {row_id!r}')
                  files[path] = kept
                  changed.add(path)
                  print(f'deduped {path} {row_id}: kept {len(seen)} unique {key_col} values, removed {removed} duplicates')
                  continue

              if mode == 'fill_blank_where':
                  match_col = str(op.get('match_column') or '').strip()
                  col = str(op.get('column') or '').strip()
                  if match_col not in header:
                      sys.exit(f'op {i}: match column not in header: {match_col}')
                  if col not in header:
                      sys.exit(f'op {i}: column not in header: {col}')
                  match_value = decode(op.get('match_value')).strip()
                  new = decode(op.get('value'))
                  if not match_value:
                      sys.exit(f'op {i}: match_value required')
                  if new == '':
                      sys.exit(f'op {i}: value required')
                  i_match = header.index(match_col)
                  i_col = header.index(col)
                  hits = 0
                  for row in rows[1:]:
                      if not row:
                          continue
                      while len(row) < len(header):
                          row.append('')
                      if row[i_match].strip() == match_value and not row[i_col].strip():
                          row[i_col] = new
                          hits += 1
                  if hits < 1:
                      sys.exit(f'op {i}: found no blank {col} values where {match_col}={match_value!r}')
                  changed.add(path)
                  print(f'filled {hits} blank {col} values in {path} where {match_col}={match_value!r}')
                  continue

              if mode == 'replace_text':
                  col = str(op.get('column') or '').strip()
                  if col not in header:
                      sys.exit(f'op {i}: column not in header: {col}')
                  old = decode(op.get('from'))
                  new = decode(op.get('to'))
                  if not old:
                      sys.exit(f'op {i}: replace_text needs non-empty from')
                  i_col = header.index(col)
                  hits = 0
                  for row in rows[1:]:
                      if not row:
                          continue
                      while len(row) < len(header):
                          row.append('')
                      if old in row[i_col]:
                          row[i_col] = row[i_col].replace(old, new)
                          hits += 1
                  if hits < 1:
                      sys.exit(f'op {i}: replace_text found no matches for {old!r}')
                  changed.add(path)
                  print(f'replaced {old!r} in {hits} rows of {path} column {col}')
                  continue

              if mode == 'delete':
                  kept = [header]
                  hits = 0
                  for row in rows[1:]:
                      if not row:
                          continue
                      if len(row) > i_id and row[i_id] == row_id:
                          hits += 1
                          continue
                      kept.append(row)
                  if hits != 1:
                      sys.exit(f'op {i}: expected 1 row for {row_id!r}, found {hits}')
                  files[path] = kept
                  changed.add(path)
                  print(f'deleted {path} {row_id}')
                  continue

              if mode == 'insert':
                  existing = 0
                  for row in rows[1:]:
                      if row and len(row) > i_id and row[i_id] == row_id:
                          existing += 1
                  if existing:
                      sys.exit(f'op {i}: row already exists: {row_id}')
                  sets = op.get('sets')
                  if not isinstance(sets, dict) or not sets:
                      sys.exit(f'op {i}: insert needs sets')
                  new_row = [''] * len(header)
                  new_row[i_id] = row_id
                  for col, val in sets.items():
                      if col not in header:
                          sys.exit(f'op {i}: column not in header: {col}')
                      new_row[header.index(col)] = decode(val)
                  after = str(op.get('after_row_id') or '').strip()
                  if after:
                      placed = False
                      kept = [header]
                      for row in rows[1:]:
                          kept.append(row)
                          if row and len(row) > i_id and row[i_id] == after:
                              kept.append(new_row)
                              placed = True
                      if not placed:
                          sys.exit(f'op {i}: after_row_id not found: {after}')
                      files[path] = kept
                  else:
                      rows.append(new_row)
                      files[path] = rows
                  changed.add(path)
                  print(f'inserted {path} {row_id}')
                  continue

              if mode != 'update':
                  sys.exit(f'op {i}: unknown mode {mode}')

              sets = op.get('sets')
              if not isinstance(sets, dict) or not sets:
                  sets = {}
                  if op.get('column'):
                      sets[str(op['column'])] = op.get('value', '')
                  if op.get('column_2'):
                      sets[str(op['column_2'])] = op.get('value_2', '')
              if not sets:
                  sys.exit(f'op {i}: update needs sets or column/value')

              hits = 0
              for row in rows[1:]:
                  if not row:
                      continue
                  while len(row) < len(header):
                      row.append('')
                  if row[i_id] != row_id:
                      continue
                  for col, val in sets.items():
                      if col not in header:
                          sys.exit(f'op {i}: column not in header: {col}')
                      row[header.index(col)] = decode(val)
                  hits += 1
              if hits != 1:
                  sys.exit(f'op {i}: expected 1 row for {row_id!r}, found {hits}')
              changed.add(path)
              print(f'updated {path} {row_id} {list(sets)}')

          for path, rows in files.items():
              if path not in changed:
                  continue
              with path.open('w', newline='', encoding='utf-8') as f:
                  csv.writer(f, lineterminator='\n').writerows(rows)
          print('changed', ' '.join(str(p) for p in sorted(changed)))
          PY

      - name: Refresh manifests
        run: python3 scripts/data_schema.py manifest

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- data
          if git diff --cached --quiet; then
            echo "No change"
            exit 0
          fi
          git commit -m "Patch CSV line items"
          git push
