name: Patch CSV

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-csv.yml'
  workflow_dispatch:
    inputs:
      patches:
        description: JSON list of operations. One run, one commit.
        required: true
        type: string

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply patches
        env:
          PATCHES: ${{ inputs.patches || '[{"file":"data/orks/Abilities.csv","id_column":"Ability_ID","row_id":"CLEAVE 1","column":"Short_Description","value":"Add +1 melee attack per 5 target models [CLEAVE 1]"},{"file":"data/orks/Abilities.csv","id_column":"Ability_ID","row_id":"CLEAVE 2","column":"Short_Description","value":"Add +2 attack dice per 5 target models if targeting one unit [CLEAVE 2]"},{"file":"data/orks/Abilities.csv","id_column":"Ability_ID","row_id":"KOMBI","column":"Short_Description","value":"Choose one profile [KOMBI]"},{"file":"data/orks/Abilities.csv","id_column":"Ability_ID","row_id":"CLOSE-QUARTERS","column":"Short_Description","value":"Can shoot while engaged; must target engaged enemy [CLOSE-QUARTERS]"},{"file":"data/orks/Abilities.csv","id_column":"Ability_ID","row_id":"DA_BIGGER_DEY_IZ","column":"Short_Description","value":"MELEE vs MONSTER / VEHICLE [RE-ROLL ALL WOUNDS]"},{"file":"data/orks/Abilities.csv","id_column":"Ability_ID","row_id":"DATS_OUR_LOOT","column":"Short_Description","value":"Re-roll 1s Re-roll ALL if on Objective [RE-ROLL 1S TO HIT] [RE-ROLL ALL HITS]"},{"file":"data/orks/Abilities.csv","id_column":"Ability_ID","row_id":"DEFF_FROM_ABOVE","column":"Short_Description","value":"After Ingress — RANGE [+1 TO HIT]"},{"file":"data/orks/Abilities.csv","id_column":"Ability_ID","row_id":"DEVASTATING WOUNDS","column":"Short_Description","value":"Critical Wounds inflict mortal wounds; no saves [DEVASTATING WOUNDS] [DEVASTATING WOUNDS]"},{"file":"data/orks/Abilities.csv","id_column":"Ability_ID","row_id":"DOKS_TOOLZ","column":"Short_Description","value":"ANYTIME [FNP 5+]"},{"file":"data/orks/Abilities.csv","id_column":"Ability_ID","row_id":"KRUMPIN_TIME","column":"Short_Description","value":"MELEE RILED UP\u003A +1 To Hit [+1 TO HIT]"},{"file":"data/orks/Abilities.csv","id_column":"Ability_ID","row_id":"KUNNIN_INFILTRATOR","column":"Short_Description","value":"Hidden and unengaged at end of opponent Fight phase = go reserves [STRATEGIC RESERVES]"},{"file":"data/orks/Abilities.csv","id_column":"Ability_ID","row_id":"KUSTOM_FORCE_FIELD","column":"Short_Description","value":"RANGE attacks only [INVULNERABLE SAVE 4+]"},{"file":"data/orks/Abilities.csv","id_column":"Ability_ID","row_id":"MIGHT_IS_RIGHT","column":"Short_Description","value":"CHARGE this turn.\\nMELEE\u003A +3 A and +2 S [+3 A] [+2 S]"},{"file":"data/orks/Abilities.csv","id_column":"Ability_ID","row_id":"MORE_DAKKA","column":"Short_Description","value":"Ranged attacks IGNORES COVER\\nIf RILED UP\u003A SUSTAINED HITS 1. [IGNORES COVER] [SUSTAINED HITS 1]"},{"file":"data/orks/Abilities.csv","id_column":"Ability_ID","row_id":"ONE_LAST_KILL","column":"Short_Description","value":"Fight on death on 2+. [FIGHT ON DEATH 2+]"},{"file":"data/orks/Abilities.csv","id_column":"Ability_ID","row_id":"PROPHET_OF_DA_GREAT_WAAAGH","column":"Short_Description","value":"AURA\u003A Friendly ORKS within 6\" — MELEE [+1 TO HIT] [+1 TO WOUND]"},{"file":"data/orks/Abilities.csv","id_column":"Ability_ID","row_id":"PULSA_ROKKIT","column":"Short_Description","value":"Once per battle\u003A MONSTER / VEHICLE within 24\" — RANGE [+1 AP] [LETHAL HITS]"},{"file":"data/orks/Abilities.csv","id_column":"Ability_ID","row_id":"PYROMANIAKS","column":"Short_Description","value":"Re-roll To Wound of 1 if within 6\" Re-roll ALL To Wound if on Objective. [RE-ROLL 1S TO WOUND] [RE-ROLL ALL WOUNDS]"},{"file":"data/orks/Abilities.csv","id_column":"Ability_ID","row_id":"SHOKK_BOOSTA","column":"Short_Description","value":"Advance can be 6\", move through models, then hazard per model. [ADVANCE 6]"},{"file":"data/orks/Abilities.csv","id_column":"Ability_ID","row_id":"SOMETHIN_TO_PROVE","column":"Short_Description","value":"ANYTIME — MELEE [+1 TO HIT]"},{"file":"data/orks/Abilities.csv","id_column":"Ability_ID","row_id":"SUPER_RUNTS","column":"Short_Description","value":"This unit is RILED UP. Scavenged Shivs +1 A, WS and S. [RILED UP] [5++ Invul] [+1 A] [+1 WS] [+1 S]"},{"file":"data/orks/Abilities.csv","id_column":"Ability_ID","row_id":"THROTTLEROCKKIT_SHOKKA_ENGINE","column":"Short_Description","value":"Command\u003A\\n- Turbo Engine\u003A Adv or Fallback and Charge\\n- Shokk Attack\u003A Back to Reserves\\n- Pulse Jet\u003A Auto 6\" Adv + Move thru models and Terrain [+6 M”]"},{"file":"data/orks/Abilities.csv","id_column":"Ability_ID","row_id":"WAAAGH_WAZDAKKA","column":"Short_Description","value":"IF WARLORD\u003A WARBIKERS [BATTLELINE]"},{"file":"data/orks/Abilities.csv","id_column":"Ability_ID","row_id":"AERIAL_MANOEUVRE","column":"Short_Description","value":"End opponent turn\u003A if unengaged [STRATEGIC RESERVES]"},{"file":"data/orks/Abilities.csv","id_column":"Ability_ID","row_id":"AMMO_RUNTS","column":"Short_Description","value":"Once per battle — RANGE [+1 TO HIT]"}]' }}
        run: |
          python3 <<'PY'
          import csv, json, os, sys
          from pathlib import Path

          raw = os.environ.get('PATCHES') or ''
          if not raw.strip():
              print('no PATCHES input; skip apply')
              raise SystemExit(0)
          try:
              ops = json.loads(raw)
          except json.JSONDecodeError as e:
              sys.exit(f'patches is not JSON: {e}')
          if not isinstance(ops, list) or not ops:
              sys.exit('patches must be a non-empty JSON list')

          def decode(val):
              if val is None:
                  return ''
              s = str(val)
              return s.replace('\\n', '\n')

          def load_csv(path):
              if path.is_absolute() or '..' in path.parts:
                  sys.exit(f'bad path {path}')
              if not str(path).startswith('data/') or path.suffix.lower() != '.csv':
                  sys.exit(f'file must be a .csv under data/: {path}')
              if not path.is_file():
                  sys.exit(f'missing {path}')
              with path.open(encoding='utf-8', newline='') as f:
                  rows = list(csv.reader(f))
              if not rows:
                  sys.exit(f'empty csv {path}')
              return rows

          files = {}
          changed = set()

          for i, op in enumerate(ops):
              if not isinstance(op, dict):
                  sys.exit(f'op {i} is not an object')
              path = Path(str(op.get('file', '')).strip())
              if path not in files:
                  files[path] = load_csv(path)
              rows = files[path]
              header = rows[0]
              id_col = str(op.get('id_column') or '').strip() or header[0]
              if id_col not in header:
                  sys.exit(f'op {i}: id column not in header: {id_col}')
              i_id = header.index(id_col)
              row_id = str(op.get('row_id') or '').strip()
              if not row_id:
                  sys.exit(f'op {i}: row_id required')
              mode = str(op.get('mode') or 'update').strip()

              if mode == 'add_column':
                  col = str(op.get('column') or '').strip()
                  if not col:
                      sys.exit(f'op {i}: add_column needs column')
                  if col in header:
                      print(f'column already exists {path} {col}')
                      continue
                  after_col = str(op.get('after_column') or '').strip()
                  if after_col and after_col not in header:
                      sys.exit(f'op {i}: after column not in header: {after_col}')
                  insert_at = header.index(after_col) + 1 if after_col else len(header)
                  old_width = len(header)
                  header.insert(insert_at, col)
                  for row in rows[1:]:
                      while len(row) < old_width:
                          row.append('')
                      row.insert(insert_at, '')
                  changed.add(path)
                  print(f'added column {path} {col}')
                  continue

              if mode == 'remove_column':
                  col = str(op.get('column') or '').strip()
                  if not col:
                      sys.exit(f'op {i}: remove_column needs column')
                  if col not in header:
                      sys.exit(f'op {i}: column not in header: {col}')
                  remove_at = header.index(col)
                  header.pop(remove_at)
                  for row in rows[1:]:
                      if len(row) > remove_at:
                          row.pop(remove_at)
                  changed.add(path)
                  print(f'removed column {path} {col}')
                  continue

              if mode == 'dedupe_by_key':
                  key_col = str(op.get('key_column') or '').strip()
                  if key_col not in header:
                      sys.exit(f'op {i}: key column not in header: {key_col}')
                  i_key = header.index(key_col)
                  kept = [header]
                  seen = set()
                  matched = 0
                  removed = 0
                  for row in rows[1:]:
                      if not row:
                          continue
                      while len(row) < len(header):
                          row.append('')
                      if row[i_id] != row_id:
                          kept.append(row)
                          continue
                      matched += 1
                      key = row[i_key].strip()
                      if not key:
                          sys.exit(f'op {i}: blank {key_col} while deduping {row_id!r}')
                      if key in seen:
                          removed += 1
                          continue
                      seen.add(key)
                      kept.append(row)
                  if matched < 1:
                      sys.exit(f'op {i}: found no rows for {row_id!r}')
                  if removed < 1:
                      sys.exit(f'op {i}: found no duplicate rows for {row_id!r}')
                  files[path] = kept
                  changed.add(path)
                  print(f'deduped {path} {row_id}: kept {len(seen)} unique {key_col} values, removed {removed} duplicates')
                  continue

              if mode == 'fill_blank_where':
                  match_col = str(op.get('match_column') or '').strip()
                  col = str(op.get('column') or '').strip()
                  if match_col not in header:
                      sys.exit(f'op {i}: match column not in header: {match_col}')
                  if col not in header:
                      sys.exit(f'op {i}: column not in header: {col}')
                  match_value = decode(op.get('match_value')).strip()
                  new = decode(op.get('value'))
                  if not match_value:
                      sys.exit(f'op {i}: match_value required')
                  if new == '':
                      sys.exit(f'op {i}: value required')
                  i_match = header.index(match_col)
                  i_col = header.index(col)
                  hits = 0
                  for row in rows[1:]:
                      if not row:
                          continue
                      while len(row) < len(header):
                          row.append('')
                      if row[i_match].strip() == match_value and not row[i_col].strip():
                          row[i_col] = new
                          hits += 1
                  if hits < 1:
                      sys.exit(f'op {i}: found no blank {col} values where {match_col}={match_value!r}')
                  changed.add(path)
                  print(f'filled {hits} blank {col} values in {path} where {match_col}={match_value!r}')
                  continue

              if mode == 'replace_text':
                  col = str(op.get('column') or '').strip()
                  if col not in header:
                      sys.exit(f'op {i}: column not in header: {col}')
                  old = decode(op.get('from'))
                  new = decode(op.get('to'))
                  if not old:
                      sys.exit(f'op {i}: replace_text needs non-empty from')
                  i_col = header.index(col)
                  hits = 0
                  for row in rows[1:]:
                      if not row:
                          continue
                      while len(row) < len(header):
                          row.append('')
                      if old in row[i_col]:
                          row[i_col] = row[i_col].replace(old, new)
                          hits += 1
                  if hits < 1:
                      sys.exit(f'op {i}: replace_text found no matches for {old!r}')
                  changed.add(path)
                  print(f'replaced {old!r} in {hits} rows of {path} column {col}')
                  continue

              if mode == 'delete':
                  kept = [header]
                  hits = 0
                  for row in rows[1:]:
                      if not row:
                          continue
                      if len(row) > i_id and row[i_id] == row_id:
                          hits += 1
                          continue
                      kept.append(row)
                  if hits != 1:
                      sys.exit(f'op {i}: expected 1 row for {row_id!r}, found {hits}')
                  files[path] = kept
                  changed.add(path)
                  print(f'deleted {path} {row_id}')
                  continue

              if mode == 'insert':
                  existing = 0
                  for row in rows[1:]:
                      if row and len(row) > i_id and row[i_id] == row_id:
                          existing += 1
                  if existing:
                      sys.exit(f'op {i}: row already exists: {row_id}')
                  sets = op.get('sets')
                  if not isinstance(sets, dict) or not sets:
                      sys.exit(f'op {i}: insert needs sets')
                  new_row = [''] * len(header)
                  new_row[i_id] = row_id
                  for col, val in sets.items():
                      if col not in header:
                          sys.exit(f'op {i}: column not in header: {col}')
                      new_row[header.index(col)] = decode(val)
                  after = str(op.get('after_row_id') or '').strip()
                  if after:
                      placed = False
                      kept = [header]
                      for row in rows[1:]:
                          kept.append(row)
                          if row and len(row) > i_id and row[i_id] == after:
                              kept.append(new_row)
                              placed = True
                      if not placed:
                          sys.exit(f'op {i}: after_row_id not found: {after}')
                      files[path] = kept
                  else:
                      rows.append(new_row)
                      files[path] = rows
                  changed.add(path)
                  print(f'inserted {path} {row_id}')
                  continue

              if mode != 'update':
                  sys.exit(f'op {i}: unknown mode {mode}')

              sets = op.get('sets')
              if not isinstance(sets, dict) or not sets:
                  sets = {}
                  if op.get('column'):
                      sets[str(op['column'])] = op.get('value', '')
                  if op.get('column_2'):
                      sets[str(op['column_2'])] = op.get('value_2', '')
              if not sets:
                  sys.exit(f'op {i}: update needs sets or column/value')

              hits = 0
              for row in rows[1:]:
                  if not row:
                      continue
                  while len(row) < len(header):
                      row.append('')
                  if row[i_id] != row_id:
                      continue
                  for col, val in sets.items():
                      if col not in header:
                          sys.exit(f'op {i}: column not in header: {col}')
                      row[header.index(col)] = decode(val)
                  hits += 1
              if hits != 1:
                  sys.exit(f'op {i}: expected 1 row for {row_id!r}, found {hits}')
              changed.add(path)
              print(f'updated {path} {row_id} {list(sets)}')

          for path, rows in files.items():
              if path not in changed:
                  continue
              with path.open('w', newline='', encoding='utf-8') as f:
                  csv.writer(f, lineterminator='\n').writerows(rows)
          print('changed', ' '.join(str(p) for p in sorted(changed)))
          PY

      - name: Refresh manifests
        run: python3 scripts/data_schema.py manifest

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- data
          if git diff --cached --quiet; then
            echo "No change"
            exit 0
          fi
          git commit -m "Patch CSV line items"
          git push
