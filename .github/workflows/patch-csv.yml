name: Patch CSV

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-csv.yml'
  workflow_dispatch:
    inputs:
      patches:
        description: JSON list of operations. One run, one commit.
        required: true
        type: string

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply patches
        env:
          PATCHES: ${{ inputs.patches }}
        run: |
          python3 <<'PY'
          import csv, json, os, sys
          from pathlib import Path

          raw = r'[{"file":"data/nids/Detachment_Definitions.csv","id_column":"Detachment_ID","row_id":"tyranids_crusher_stampede","mode":"insert","sets":{"Army_Name":"Tyranids","Detachment_Name":"Crusher Stampede","Rule_ID":"tyranids_crusher_stampede_detachment_rule_enraged_behemoths","Rule_Name":"ENRAGED BEHEMOTHS","DP_Cost":"2","Detachment_Disposition":"Purge the Foe","Short_Description":"MONSTER: +1 To Hit below Starting Strength; also +1 To Wound below Half. At Starting Strength: +2 OC.","Long_Description":"Each time a TYRANIDS MONSTER model attacks, add 1 to the Hit roll if its unit is below Starting Strength and add 1 to the Wound roll as well if its unit is Below Half-strength. While a TYRANIDS MONSTER unit is at Starting Strength and is not Battle-shocked, add 2 to the Objective Control of models in that unit."}},{"file":"data/nids/Detachments.csv","id_column":"Item_ID","row_id":"tyranids_crusher_stampede_detachment_rule_enraged_behemoths","mode":"insert","sets":{"Detachment_ID":"tyranids_crusher_stampede","Army_Name":"Tyranids","Detachment_Name":"Crusher Stampede","Item_Type":"DETACHMENT_RULE","Item_Name":"ENRAGED BEHEMOTHS","DP_Cost":"2","Detachment_Disposition":"Purge the Foe","Short_Description":"MONSTER: +1 To Hit below Starting Strength; also +1 To Wound below Half. At Starting Strength: +2 OC.","Long_Description":"Each time a TYRANIDS MONSTER model attacks, add 1 to the Hit roll if its unit is below Starting Strength and add 1 to the Wound roll as well if its unit is Below Half-strength. While a TYRANIDS MONSTER unit is at Starting Strength and is not Battle-shocked, add 2 to the Objective Control of models in that unit."}},{"file":"data/nids/Detachment_Definitions.csv","id_column":"Detachment_ID","row_id":"tyranids_unending_swarm","mode":"insert","sets":{"Army_Name":"Tyranids","Detachment_Name":"Unending Swarm","Rule_ID":"tyranids_unending_swarm_detachment_rule_insurmountable_odds","Rule_Name":"INSURMOUNTABLE ODDS","DP_Cost":"2","Detachment_Disposition":"Take and Hold","Short_Description":"ENDLESS MULTITUDE: If enemy Shooting destroys a model, unit can Surge D6 inches.","Long_Description":"In your opponent’s Shooting phase, after an enemy unit has shot, if those attacks destroyed a model from a friendly ENDLESS MULTITUDE unit, that friendly unit can make a surge move of up to D6 inches."}},{"file":"data/nids/Detachments.csv","id_column":"Item_ID","row_id":"tyranids_unending_swarm_detachment_rule_insurmountable_odds","mode":"insert","sets":{"Detachment_ID":"tyranids_unending_swarm","Army_Name":"Tyranids","Detachment_Name":"Unending Swarm","Item_Type":"DETACHMENT_RULE","Item_Name":"INSURMOUNTABLE ODDS","DP_Cost":"2","Detachment_Disposition":"Take and Hold","Short_Description":"ENDLESS MULTITUDE: If enemy Shooting destroys a model, unit can Surge D6 inches.","Long_Description":"In your opponent’s Shooting phase, after an enemy unit has shot, if those attacks destroyed a model from a friendly ENDLESS MULTITUDE unit, that friendly unit can make a surge move of up to D6 inches."}},{"file":"data/nids/Detachment_Definitions.csv","id_column":"Detachment_ID","row_id":"tyranids_assimilation_swarm","mode":"insert","sets":{"Army_Name":"Tyranids","Detachment_Name":"Assimilation Swarm","Rule_ID":"tyranids_assimilation_swarm_detachment_rule_feed_the_swarm","Rule_Name":"FEED THE SWARM","DP_Cost":"2","Detachment_Disposition":"Priority Assets","Short_Description":"COMMAND: Each HARVESTER regenerates 1 nearby unit: heal D3+1 W, return 1 INFANTRY, or 3 ENDLESS MULTITUDE.","Long_Description":"In your Command phase, each HARVESTER unit can Regenerate one friendly TYRANIDS unit within 6 inches. A unit can only be regenerated once per phase. Regenerate by healing one model D3+1 wounds, returning one destroyed INFANTRY model excluding CHARACTERS, or returning up to 3 models instead if it is an ENDLESS MULTITUDE unit."}},{"file":"data/nids/Detachments.csv","id_column":"Item_ID","row_id":"tyranids_assimilation_swarm_detachment_rule_feed_the_swarm","mode":"insert","sets":{"Detachment_ID":"tyranids_assimilation_swarm","Army_Name":"Tyranids","Detachment_Name":"Assimilation Swarm","Item_Type":"DETACHMENT_RULE","Item_Name":"FEED THE SWARM","DP_Cost":"2","Detachment_Disposition":"Priority Assets","Short_Description":"COMMAND: Each HARVESTER regenerates 1 nearby unit: heal D3+1 W, return 1 INFANTRY, or 3 ENDLESS MULTITUDE.","Long_Description":"In your Command phase, each HARVESTER unit can Regenerate one friendly TYRANIDS unit within 6 inches. A unit can only be regenerated once per phase. Regenerate by healing one model D3+1 wounds, returning one destroyed INFANTRY model excluding CHARACTERS, or returning up to 3 models instead if it is an ENDLESS MULTITUDE unit."}},{"file":"data/nids/Detachment_Definitions.csv","id_column":"Detachment_ID","row_id":"tyranids_synaptic_nexus","mode":"insert","sets":{"Army_Name":"Tyranids","Detachment_Name":"Synaptic Nexus","Rule_ID":"tyranids_synaptic_nexus_detachment_rule_synaptic_imperatives","Rule_Name":"SYNAPTIC IMPERATIVES","DP_Cost":"2","Detachment_Disposition":"Disruption","Short_Description":"Start battle round, pick ONCE: Synapse units get 5++, +1 Advance and Charge, or MELEE +1 To Hit.","Long_Description":"At the start of each battle round, select one Synaptic Imperative not previously selected. Until end of the battle round, TYRANIDS units within Synapse Range benefit from it: Synaptic Augmentation gives 5+ invulnerable saves; Surging Vitality gives +1 to Advance and Charge rolls; Goaded to Slaughter gives +1 to melee Hit rolls."}},{"file":"data/nids/Detachments.csv","id_column":"Item_ID","row_id":"tyranids_synaptic_nexus_detachment_rule_synaptic_imperatives","mode":"insert","sets":{"Detachment_ID":"tyranids_synaptic_nexus","Army_Name":"Tyranids","Detachment_Name":"Synaptic Nexus","Item_Type":"DETACHMENT_RULE","Item_Name":"SYNAPTIC IMPERATIVES","DP_Cost":"2","Detachment_Disposition":"Disruption","Short_Description":"Start battle round, pick ONCE: Synapse units get 5++, +1 Advance and Charge, or MELEE +1 To Hit.","Long_Description":"At the start of each battle round, select one Synaptic Imperative not previously selected. Until end of the battle round, TYRANIDS units within Synapse Range benefit from it: Synaptic Augmentation gives 5+ invulnerable saves; Surging Vitality gives +1 to Advance and Charge rolls; Goaded to Slaughter gives +1 to melee Hit rolls."}}]'
          try:
              ops = json.loads(raw)
          except json.JSONDecodeError as e:
              sys.exit(f'patches is not JSON: {e}')
          if not isinstance(ops, list) or not ops:
              sys.exit('patches must be a non-empty JSON list')

          def decode(val):
              if val is None:
                  return ''
              s = str(val)
              return s.replace('\\n', '\n')

          def load_csv(path):
              if path.is_absolute() or '..' in path.parts:
                  sys.exit(f'bad path {path}')
              if not str(path).startswith('data/') or path.suffix.lower() != '.csv':
                  sys.exit(f'file must be a .csv under data/: {path}')
              if not path.is_file():
                  sys.exit(f'missing {path}')
              with path.open(encoding='utf-8', newline='') as f:
                  rows = list(csv.reader(f))
              if not rows:
                  sys.exit(f'empty csv {path}')
              return rows

          files = {}
          changed = set()

          for i, op in enumerate(ops):
              if not isinstance(op, dict):
                  sys.exit(f'op {i} is not an object')
              path = Path(str(op.get('file', '')).strip())
              if path not in files:
                  files[path] = load_csv(path)
              rows = files[path]
              header = rows[0]
              id_col = str(op.get('id_column') or '').strip() or header[0]
              if id_col not in header:
                  sys.exit(f'op {i}: id column not in header: {id_col}')
              i_id = header.index(id_col)
              row_id = str(op.get('row_id') or '').strip()
              if not row_id:
                  sys.exit(f'op {i}: row_id required')
              mode = str(op.get('mode') or 'update').strip()

              if mode == 'add_column':
                  col = str(op.get('column') or '').strip()
                  if not col:
                      sys.exit(f'op {i}: add_column needs column')
                  if col in header:
                      print(f'column already exists {path} {col}')
                      continue
                  after_col = str(op.get('after_column') or '').strip()
                  if after_col and after_col not in header:
                      sys.exit(f'op {i}: after column not in header: {after_col}')
                  insert_at = header.index(after_col) + 1 if after_col else len(header)
                  old_width = len(header)
                  header.insert(insert_at, col)
                  for row in rows[1:]:
                      while len(row) < old_width:
                          row.append('')
                      row.insert(insert_at, '')
                  changed.add(path)
                  print(f'added column {path} {col}')
                  continue

              if mode == 'dedupe_by_key':
                  key_col = str(op.get('key_column') or '').strip()
                  if key_col not in header:
                      sys.exit(f'op {i}: key column not in header: {key_col}')
                  i_key = header.index(key_col)
                  kept = [header]
                  seen = set()
                  matched = 0
                  removed = 0
                  for row in rows[1:]:
                      if not row:
                          continue
                      while len(row) < len(header):
                          row.append('')
                      if row[i_id] != row_id:
                          kept.append(row)
                          continue
                      matched += 1
                      key = row[i_key].strip()
                      if not key:
                          sys.exit(f'op {i}: blank {key_col} while deduping {row_id!r}')
                      if key in seen:
                          removed += 1
                          continue
                      seen.add(key)
                      kept.append(row)
                  if matched < 1:
                      sys.exit(f'op {i}: found no rows for {row_id!r}')
                  if removed < 1:
                      sys.exit(f'op {i}: found no duplicate rows for {row_id!r}')
                  files[path] = kept
                  changed.add(path)
                  print(f'deduped {path} {row_id}: kept {len(seen)} unique {key_col} values, removed {removed} duplicates')
                  continue

              if mode == 'fill_blank_where':
                  match_col = str(op.get('match_column') or '').strip()
                  col = str(op.get('column') or '').strip()
                  if match_col not in header:
                      sys.exit(f'op {i}: match column not in header: {match_col}')
                  if col not in header:
                      sys.exit(f'op {i}: column not in header: {col}')
                  match_value = decode(op.get('match_value')).strip()
                  new = decode(op.get('value'))
                  if not match_value:
                      sys.exit(f'op {i}: match_value required')
                  if new == '':
                      sys.exit(f'op {i}: value required')
                  i_match = header.index(match_col)
                  i_col = header.index(col)
                  hits = 0
                  for row in rows[1:]:
                      if not row:
                          continue
                      while len(row) < len(header):
                          row.append('')
                      if row[i_match].strip() == match_value and not row[i_col].strip():
                          row[i_col] = new
                          hits += 1
                  if hits < 1:
                      sys.exit(f'op {i}: found no blank {col} values where {match_col}={match_value!r}')
                  changed.add(path)
                  print(f'filled {hits} blank {col} values in {path} where {match_col}={match_value!r}')
                  continue

              if mode == 'replace_text':
                  col = str(op.get('column') or '').strip()
                  if col not in header:
                      sys.exit(f'op {i}: column not in header: {col}')
                  old = decode(op.get('from'))
                  new = decode(op.get('to'))
                  if not old:
                      sys.exit(f'op {i}: replace_text needs non-empty from')
                  i_col = header.index(col)
                  hits = 0
                  for row in rows[1:]:
                      if not row:
                          continue
                      while len(row) < len(header):
                          row.append('')
                      if old in row[i_col]:
                          row[i_col] = row[i_col].replace(old, new)
                          hits += 1
                  if hits < 1:
                      sys.exit(f'op {i}: replace_text found no matches for {old!r}')
                  changed.add(path)
                  print(f'replaced {old!r} in {hits} rows of {path} column {col}')
                  continue

              if mode == 'delete':
                  kept = [header]
                  hits = 0
                  for row in rows[1:]:
                      if not row:
                          continue
                      if len(row) > i_id and row[i_id] == row_id:
                          hits += 1
                          continue
                      kept.append(row)
                  if hits != 1:
                      sys.exit(f'op {i}: expected 1 row for {row_id!r}, found {hits}')
                  files[path] = kept
                  changed.add(path)
                  print(f'deleted {path} {row_id}')
                  continue

              if mode == 'insert':
                  existing = 0
                  for row in rows[1:]:
                      if row and len(row) > i_id and row[i_id] == row_id:
                          existing += 1
                  if existing:
                      sys.exit(f'op {i}: row already exists: {row_id}')
                  sets = op.get('sets')
                  if not isinstance(sets, dict) or not sets:
                      sys.exit(f'op {i}: insert needs sets')
                  new_row = [''] * len(header)
                  new_row[i_id] = row_id
                  for col, val in sets.items():
                      if col not in header:
                          sys.exit(f'op {i}: column not in header: {col}')
                      new_row[header.index(col)] = decode(val)
                  after = str(op.get('after_row_id') or '').strip()
                  if after:
                      placed = False
                      kept = [header]
                      for row in rows[1:]:
                          kept.append(row)
                          if row and len(row) > i_id and row[i_id] == after:
                              kept.append(new_row)
                              placed = True
                      if not placed:
                          sys.exit(f'op {i}: after_row_id not found: {after}')
                      files[path] = kept
                  else:
                      rows.append(new_row)
                      files[path] = rows
                  changed.add(path)
                  print(f'inserted {path} {row_id}')
                  continue

              if mode != 'update':
                  sys.exit(f'op {i}: unknown mode {mode}')

              sets = op.get('sets')
              if not isinstance(sets, dict) or not sets:
                  sets = {}
                  if op.get('column'):
                      sets[str(op['column'])] = op.get('value', '')
                  if op.get('column_2'):
                      sets[str(op['column_2'])] = op.get('value_2', '')
              if not sets:
                  sys.exit(f'op {i}: update needs sets or column/value')

              hits = 0
              for row in rows[1:]:
                  if not row:
                      continue
                  while len(row) < len(header):
                      row.append('')
                  if row[i_id] != row_id:
                      continue
                  for col, val in sets.items():
                      if col not in header:
                          sys.exit(f'op {i}: column not in header: {col}')
                      row[header.index(col)] = decode(val)
                  hits += 1
              if hits != 1:
                  sys.exit(f'op {i}: expected 1 row for {row_id!r}, found {hits}')
              changed.add(path)
              print(f'updated {path} {row_id} {list(sets)}')

          for path, rows in files.items():
              if path not in changed:
                  continue
              with path.open('w', newline='', encoding='utf-8') as f:
                  csv.writer(f, lineterminator='\n').writerows(rows)
          print('changed', ' '.join(str(p) for p in sorted(changed)))
          PY

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- data
          if git diff --cached --quiet; then
            echo "No change"
            exit 0
          fi
          git commit -m "Patch CSV line items"
          git push