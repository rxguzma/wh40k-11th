name: Patch CSV

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-csv.yml'
  workflow_dispatch:
    inputs:
      patches:
        description: JSON list of operations. One run, one commit.
        required: true
        type: string

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply patches
        env:
          PATCHES: ${{ inputs.patches || '[{"file":"data/marines/Unit_Profiles.csv","id_column":"Unit_ID","row_id":"INTERCESSORS","sets":{"Abilities":"BOLTER_DISCIPLINE_INTERCESSORS, TACTICAL_MAINSTAY_INTERCESSORS, INTERCESSOR_SQUAD_LOADOUT","Other_Abilities":""}},{"file":"data/marines/Unit_Profiles.csv","id_column":"Unit_ID","row_id":"INVADER_ATV","sets":{"Abilities":"OUTRIDER_ESCORT","Other_Abilities":""}},{"file":"data/marines/Unit_Profiles.csv","id_column":"Unit_ID","row_id":"INVICTOR_TACTICAL_WARSUIT","sets":{"Abilities":"FORWARD_ASSAULT_WARSUIT","Other_Abilities":"SCOUTS_8, DEADLY_DEMISE_D3, DAMAGED_1_4"}},{"file":"data/marines/Unit_Profiles.csv","id_column":"Unit_ID","row_id":"IRON_FATHER_FEIRROS","sets":{"Abilities":"RITES_OF_TEMPERING, MASTER_OF_THE_FORGE, IRON_FATHER_FEIRROS_UNIT_COMPOSITION","Other_Abilities":"LEADER, FNP_5, IRON_FATHER"}},{"file":"data/marines/Unit_Profiles.csv","id_column":"Unit_ID","row_id":"JUDICIAR","sets":{"Abilities":"TEMPORMORTIS, MELEE_INVULNERABLE_SAVE_4","Other_Abilities":"FIGHTS_FIRST, SUPPORT"}},{"file":"data/marines/Unit_Profiles.csv","id_column":"Unit_ID","row_id":"KAYVAAN_SHRIKE","sets":{"Abilities":"SHADOWMASTER, ECHO_OF_THE_RAVENSPIRE, KAYVAAN_SHRIKE_UNIT_COMPOSITION","Other_Abilities":"DEEP_STRIKE, LEADER, LONE_OPERATIVE"}},{"file":"data/marines/Unit_Profiles.csv","id_column":"Unit_ID","row_id":"LAND_RAIDER_REDEEMER","sets":{"Abilities":"LAND_RAIDER_REDEEMER_WRATH_MACHINE_SPIRIT, LAND_RAIDER_REDEEMER_FLAMESTORM_CANNONS_X2","Other_Abilities":"DEADLY_DEMISE_D6, DAMAGED_1_6, ASSAULT_RAMP, TRANSPORT_LAND_RAIDER_REDEEMER"}},{"file":"data/marines/Unit_Profiles.csv","id_column":"Unit_ID","row_id":"LAND_SPEEDER","sets":{"Abilities":"PURGATION_RUN","Other_Abilities":"DEEP_STRIKE"}},{"file":"data/marines/Unit_Profiles.csv","id_column":"Unit_ID","row_id":"LAND_SPEEDER_VENGEANCE","sets":{"Abilities":"STORM_OF_VENGEANCE","Other_Abilities":"DEADLY_DEMISE_D3"}},{"file":"data/marines/Unit_Profiles.csv","id_column":"Unit_ID","row_id":"L