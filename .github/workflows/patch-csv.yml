name: Patch CSV

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-csv.yml'
  workflow_dispatch:
    inputs:
      patches:
        description: JSON list of operations. One run, one commit.
        required: true
        type: string

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply patches
        env:
          PATCHES: ${{ inputs.patches || '[{"file":"data/marines/Detachment_Definitions.csv","id_column":"Detachment_ID","row_id":"space_marines_gladius_task_force","sets":{"Long_Description":"You can select one combat doctrine one additional time per battle."}},{"file":"data/marines/Enhancements.csv","id_column":"Enhancement_ID","row_id":"space_marines_gladius_task_force_enhancement_standard_of_the_emperor_ascendant","sets":{"Long_Description":"ANCIENT model only. This model has:\n• +1 OC and Ld.\n• Feel No Pain 5+.\n• The following ability:\nAncient Exhortation (Once per battle, per army)\u003a When this unit is selected to fight, you can use this ability. If you do, this unit’s melee attacks have +1 A until the end of the phase."}},{"file":"data/marines/Enhancements.csv","id_column":"Enhancement_ID","row_id":"space_marines_gladius_task_force_enhancement_laurels_of_triumph","sets":{"Long_Description":"ADEPTUS ASTARTES model only. This model’s melee attacks have:\n• +1 S and AP.\n• Or\u003a If the assault doctrine is active for this unit, +2 S and AP."}},{"file":"data/marines/Enhancements.csv","id_column":"Enhancement_ID","row_id":"space_marines_gladius_task_force_enhancement_adept_of_the_codex","sets":{"Long_Description":"CAPTAIN model only. The tactical doctrine is active for this unit in addition to any other combat doctrine."}},{"file":"data/marines/Enhancements.csv","id_column":"Enhancement_ID","row_id":"space_marines_gladius_task_force_enhancement_artificer_armour","sets":{"Long_Description":"ADEPTUS ASTARTES model only. This model has:\n• 2+ Sv.\n• Feel No Pain 5+."}},{"file":"data/marines/Detachment_Definitions.csv","id_column":"Detachment_ID","row_id":"space_marines_assault_brethren","sets":{"Long_Description":"You can select the assault doctrine one additional time per battle."}},{"file":"data/marines/Enhancements.csv","id_column":"Enhancement_ID","row_id":"space_marines_assault_brethren_enhancement_imperiums_sword","sets":{"Long_Description":"ADEPTUS ASTARTES model only. This model has the following weapon:\nImperium’s Sword — Melee | A 6 | WS 2+ | S 7 | AP -3 | D 3"}},{"file":"data/marines/Enhancements.csv","id_column":"Enhancement_ID","row_id":"space_marines_assault_brethren_enhancement_furious_assault_upgrade","sets":{"Long_Description":"ADEPTUS ASTARTES INFANTRY unit only. This unit’s melee attacks have [SUSTAINED HITS 1\u003a non-MONSTER/VEHICLE]."}},{"file":"data/marines/Stratagems.csv","id_column":"Stratagem_ID","row_id":"space_marines_assault_brethren_stratagem_armour_of_contempt_1cp","sets":{"Long_Description":"WHEN\u003a Your opponent’s Shooting phase or the Fight phase, when an enemy unit targets a friendly ADEPTUS ASTARTES unit.\nTARGET\u003a That ADEPTUS ASTARTES unit.\nEFFECT\u003a Attacks that target your unit have -1 AP until that enemy unit has attacked."}},{"file":"data/marines/Stratagems.csv","id_column":"Stratagem_ID","row_id":"space_marines_assault_brethren_stratagem_gene_wrought_might_1cp","sets":{"Long_Description":"WHEN\u003a Fight phase, when a friendly ADEPTUS ASTARTES unit is selected to fight.\nTARGET\u003a That ADEPTUS ASTARTES unit.\nEFFECT\u003a Your unit’s melee attacks have:\n• [LANCE].\n• Or\u003a If the assault doctrine is active for your unit, [LANCE] and +1 AP."}},{"file":"data/marines/Stratagems.csv","id_column":"Stratagem_ID","row_id":"space_marines_assault_brethren_stratagem_duty_in_death_1cp","sets":{"Long_Description":"WHEN\u003a Fight phase, when an enemy unit targets a friendly ADEPTUS ASTARTES unit.\nTARGET\u003a That ADEPTUS ASTARTES unit.\nEFFECT\u003a When a model in your unit is destroyed, if your unit has not been selected to fight this phase, roll one D6, with +1 to that roll if the assault doctrine is active for your unit:\n• On a 4+, do not remove that model from the battlefield. When your unit has fought, or at the end of the phase (whichever comes first), that model is removed from the battlefield."}},{"file":"data/marines/Detachment_Definitions.csv","id_column":"Detachment_ID","row_id":"space_marines_tactical_brethren","sets":{"Long_Description":"You can select the tactical doctrine one additional time per battle."}},{"file":"data/marines/Enhancements.csv","id_column":"Enhancement_ID","row_id":"space_marines_tactical_brethren_enhancement_laurels_of_vigilance","sets":{"Long_Description":"ADEPTUS ASTARTES model only.\n(Once per battle round, per army) When you use the Fire Overwatch/Heroic Intervention stratagem, if you target a friendly ADEPTUS ASTARTES BATTLELINE unit within 12\" of this model with that stratagem, that use is -1 CP."}},{"file":"data/marines/Enhancements.csv","id_column":"Enhancement_ID","row_id":"space_marines_tactical_brethren_enhancement_tactical_insight","sets":{"Long_Description":"CAPTAIN model only. The tactical doctrine is active for this unit in addition to any other combat doctrine."}},{"file":"data/marines/Stratagems.csv","id_column":"Stratagem_ID","row_id":"space_marines_tactical_brethren_stratagem_armour_of_contempt_1cp","sets":{"Long_Description":"WHEN\u003a Your opponent’s Shooting phase or the Fight phase, when an enemy unit targets a friendly ADEPTUS ASTARTES unit.\nTARGET\u003a That ADEPTUS ASTARTES unit.\nEFFECT\u003a Attacks that target your unit have -1 AP until that enemy unit has attacked."}},{"file":"data/marines/Stratagems.csv","id_column":"Stratagem_ID","row_id":"space_marines_tactical_brethren_stratagem_domination_fire_1cp","sets":{"Long_Description":"WHEN\u003a Your Shooting phase, when a friendly ADEPTUS ASTARTES unit has shot.\nTARGET\u003a That ADEPTUS ASTARTES unit.\nEFFECT\u003a Select one enemy unit hit by those attacks. That enemy unit is suppressed until the start of your next turn:\n• While a unit is suppressed, that unit’s attacks have -1 to hit rolls."}},{"file":"data/marines/Stratagems.csv","id_column":"Stratagem_ID","row_id":"space_marines_tactical_brethren_stratagem_masterful_tactics_1cp","sets":{"Long_Description":"WHEN\u003a Your opponent’s Movement phase, when an enemy unit ends a move within 8\" of a friendly unengaged ADEPTUS ASTARTES INFANTRY/MOUNTED unit.\nTARGET\u003a That ADEPTUS ASTARTES INFANTRY/MOUNTED unit.\nEFFECT\u003a Your unit can make a normal move of:\n• Up to D6\".\n• Or\u003a If the tactical doctrine is active for your unit, up to 6\"."}},{"file":"data/marines/Detachment_Definitions.csv","id_column":"Detachment_ID","row_id":"space_marines_devastator_brethren","sets":{"Long_Description":"You can select the devastator doctrine one additional time per battle."}},{"file":"data/marines/Enhancements.csv","id_column":"Enhancement_ID","row_id":"space_marines_devastator_brethren_enhancement_master_forged_firearms","sets":{"Long_Description":"ADEPTUS ASTARTES INFANTRY/MOUNTED model only. This model’s ranged attacks (excluding [PSYCHIC] attacks) have +1 A, S, AP and D."}},{"file":"data/marines/Enhancements.csv","id_column":"Enhancement_ID","row_id":"space_marines_devastator_brethren_enhancement_honour_of_vigilance","sets":{"Long_Description":"ADEPTUS ASTARTES model only.\n• This unit’s ranged attacks have [LETHAL HITS].\n• If the devastator doctrine is active for this unit, this unit can re-roll advance rolls."}},{"file":"data/marines/Stratagems.csv","id_column":"Stratagem_ID","row_id":"space_marines_devastator_brethren_stratagem_armour_of_contempt_1cp","sets":{"Long_Description":"WHEN\u003a Your opponent’s Shooting phase or the Fight phase, when an enemy unit targets a friendly ADEPTUS ASTARTES unit.\nTARGET\u003a That ADEPTUS ASTARTES unit.\nEFFECT\u003a Attacks that target your unit have -1 AP until that enemy unit has attacked."}},{"file":"data/marines/Stratagems.csv","id_column":"Stratagem_ID","row_id":"space_marines_devastator_brethren_stratagem_storm_of_fire_1cp","sets":{"Long_Description":"WHEN\u003a Your Shooting phase, when a friendly ADEPTUS ASTARTES unit is selected to shoot.\nTARGET\u003a That ADEPTUS ASTARTES unit.\nEFFECT\u003a Your unit’s ranged attacks have:\n• [IGNORES COVER].\n• Or\u003a If the devastator doctrine is active for your unit, [IGNORES COVER] and +1 AP."}},{"file":"data/marines/Stratagems.csv","id_column":"Stratagem_ID","row_id":"space_marines_devastator_brethren_stratagem_hail_of_vengeance_2cp","sets":{"Long_Description":"WHEN\u003a Your opponent’s Shooting phase, when an enemy unit has shot, if those attacks destroyed a model in a friendly ADEPTUS ASTARTES unit.\nTARGET\u003a That ADEPTUS ASTARTES unit.\nEFFECT\u003a Your unit shoots using normal shooting, but while doing so your unit can only target that enemy unit."}}]' }}
        run: |
          python3 <<'PY'
          import csv, json, os, sys
          from pathlib import Path

          raw = os.environ.get('PATCHES') or ''
          if not raw.strip():
              print('no PATCHES input; skip apply')
              raise SystemExit(0)
          try:
              ops = json.loads(raw)
          except json.JSONDecodeError as e:
              sys.exit(f'patches is not JSON: {e}')
          if not isinstance(ops, list) or not ops:
              sys.exit('patches must be a non-empty JSON list')

          def decode(val):
              if val is None:
                  return ''
              s = str(val)
              return s.replace('\\n', '\n')

          def load_csv(path):
              if path.is_absolute() or '..' in path.parts:
                  sys.exit(f'bad path {path}')
              if not str(path).startswith('data/') or path.suffix.lower() != '.csv':
                  sys.exit(f'file must be a .csv under data/: {path}')
              if not path.is_file():
                  sys.exit(f'missing {path}')
              with path.open(encoding='utf-8', newline='') as f:
                  rows = list(csv.reader(f))
              if not rows:
                  sys.exit(f'empty csv {path}')
              return rows

          files = {}
          changed = set()

          for i, op in enumerate(ops):
              if not isinstance(op, dict):
                  sys.exit(f'op {i} is not an object')
              path = Path(str(op.get('file', '')).strip())
              if path not in files:
                  files[path] = load_csv(path)
              rows = files[path]
              header = rows[0]
              id_col = str(op.get('id_column') or '').strip() or header[0]
              if id_col not in header:
                  sys.exit(f'op {i}: id column not in header: {id_col}')
              i_id = header.index(id_col)
              row_id = str(op.get('row_id') or '').strip()
              if not row_id:
                  sys.exit(f'op {i}: row_id required')
              mode = str(op.get('mode') or 'update').strip()

              if mode == 'add_column':
                  col = str(op.get('column') or '').strip()
                  if not col:
                      sys.exit(f'op {i}: add_column needs column')
                  if col in header:
                      print(f'column already exists {path} {col}')
                      continue
                  after_col = str(op.get('after_column') or '').strip()
                  if after_col and after_col not in header:
                      sys.exit(f'op {i}: after column not in header: {after_col}')
                  insert_at = header.index(after_col) + 1 if after_col else len(header)
                  old_width = len(header)
                  header.insert(insert_at, col)
                  for row in rows[1:]:
                      while len(row) < old_width:
                          row.append('')
                      row.insert(insert_at, '')
                  changed.add(path)
                  print(f'added column {path} {col}')
                  continue

              if mode == 'dedupe_by_key':
                  key_col = str(op.get('key_column') or '').strip()
                  if key_col not in header:
                      sys.exit(f'op {i}: key column not in header: {key_col}')
                  i_key = header.index(key_col)
                  kept = [header]
                  seen = set()
                  matched = 0
                  removed = 0
                  for row in rows[1:]:
                      if not row:
                          continue
                      while len(row) < len(header):
                          row.append('')
                      if row[i_id] != row_id:
                          kept.append(row)
                          continue
                      matched += 1
                      key = row[i_key].strip()
                      if not key:
                          sys.exit(f'op {i}: blank {key_col} while deduping {row_id!r}')
                      if key in seen:
                          removed += 1
                          continue
                      seen.add(key)
                      kept.append(row)
                  if matched < 1:
                      sys.exit(f'op {i}: found no rows for {row_id!r}')
                  if removed < 1:
                      sys.exit(f'op {i}: found no duplicate rows for {row_id!r}')
                  files[path] = kept
                  changed.add(path)
                  print(f'deduped {path} {row_id}: kept {len(seen)} unique {key_col} values, removed {removed} duplicates')
                  continue

              if mode == 'fill_blank_where':
                  match_col = str(op.get('match_column') or '').strip()
                  col = str(op.get('column') or '').strip()
                  if match_col not in header:
                      sys.exit(f'op {i}: match column not in header: {match_col}')
                  if col not in header:
                      sys.exit(f'op {i}: column not in header: {col}')
                  match_value = decode(op.get('match_value')).strip()
                  new = decode(op.get('value'))
                  if not match_value:
                      sys.exit(f'op {i}: match_value required')
                  if new == '':
                      sys.exit(f'op {i}: value required')
                  i_match = header.index(match_col)
                  i_col = header.index(col)
                  hits = 0
                  for row in rows[1:]:
                      if not row:
                          continue
                      while len(row) < len(header):
                          row.append('')
                      if row[i_match].strip() == match_value and not row[i_col].strip():
                          row[i_col] = new
                          hits += 1
                  if hits < 1:
                      sys.exit(f'op {i}: found no blank {col} values where {match_col}={match_value!r}')
                  changed.add(path)
                  print(f'filled {hits} blank {col} values in {path} where {match_col}={match_value!r}')
                  continue

              if mode == 'replace_text':
                  col = str(op.get('column') or '').strip()
                  if col not in header:
                      sys.exit(f'op {i}: column not in header: {col}')
                  old = decode(op.get('from'))
                  new = decode(op.get('to'))
                  if not old:
                      sys.exit(f'op {i}: replace_text needs non-empty from')
                  i_col = header.index(col)
                  hits = 0
                  for row in rows[1:]:
                      if not row:
                          continue
                      while len(row) < len(header):
                          row.append('')
                      if old in row[i_col]:
                          row[i_col] = row[i_col].replace(old, new)
                          hits += 1
                  if hits < 1:
                      sys.exit(f'op {i}: replace_text found no matches for {old!r}')
                  changed.add(path)
                  print(f'replaced {old!r} in {hits} rows of {path} column {col}')
                  continue

              if mode == 'delete':
                  kept = [header]
                  hits = 0
                  for row in rows[1:]:
                      if not row:
                          continue
                      if len(row) > i_id and row[i_id] == row_id:
                          hits += 1
                          continue
                      kept.append(row)
                  if hits != 1:
                      sys.exit(f'op {i}: expected 1 row for {row_id!r}, found {hits}')
                  files[path] = kept
                  changed.add(path)
                  print(f'deleted {path} {row_id}')
                  continue

              if mode == 'insert':
                  existing = 0
                  for row in rows[1:]:
                      if row and len(row) > i_id and row[i_id] == row_id:
                          existing += 1
                  if existing:
                      sys.exit(f'op {i}: row already exists: {row_id}')
                  sets = op.get('sets')
                  if not isinstance(sets, dict) or not sets:
                      sys.exit(f'op {i}: insert needs sets')
                  new_row = [''] * len(header)
                  new_row[i_id] = row_id
                  for col, val in sets.items():
                      if col not in header:
                          sys.exit(f'op {i}: column not in header: {col}')
                      new_row[header.index(col)] = decode(val)
                  after = str(op.get('after_row_id') or '').strip()
                  if after:
                      placed = False
                      kept = [header]
                      for row in rows[1:]:
                          kept.append(row)
                          if row and len(row) > i_id and row[i_id] == after:
                              kept.append(new_row)
                              placed = True
                      if not placed:
                          sys.exit(f'op {i}: after_row_id not found: {after}')
                      files[path] = kept
                  else:
                      rows.append(new_row)
                      files[path] = rows
                  changed.add(path)
                  print(f'inserted {path} {row_id}')
                  continue

              if mode != 'update':
                  sys.exit(f'op {i}: unknown mode {mode}')

              sets = op.get('sets')
              if not isinstance(sets, dict) or not sets:
                  sets = {}
                  if op.get('column'):
                      sets[str(op['column'])] = op.get('value', '')
                  if op.get('column_2'):
                      sets[str(op['column_2'])] = op.get('value_2', '')
              if not sets:
                  sys.exit(f'op {i}: update needs sets or column/value')

              hits = 0
              for row in rows[1:]:
                  if not row:
                      continue
                  while len(row) < len(header):
                      row.append('')
                  if row[i_id] != row_id:
                      continue
                  for col, val in sets.items():
                      if col not in header:
                          sys.exit(f'op {i}: column not in header: {col}')
                      row[header.index(col)] = decode(val)
                  hits += 1
              if hits != 1:
                  sys.exit(f'op {i}: expected 1 row for {row_id!r}, found {hits}')
              changed.add(path)
              print(f'updated {path} {row_id} {list(sets)}')

          for path, rows in files.items():
              if path not in changed:
                  continue
              with path.open('w', newline='', encoding='utf-8') as f:
                  csv.writer(f, lineterminator='\n').writerows(rows)
          print('changed', ' '.join(str(p) for p in sorted(changed)))
          PY

      - name: Refresh manifests
        run: python3 scripts/data_schema.py manifest

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- data
          if git diff --cached --quiet; then
            echo "No change"
            exit 0
          fi
          git commit -m "Patch CSV line items"
          git push