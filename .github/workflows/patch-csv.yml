RAVENWING_COMMAND_SQUAD","sets":{"Abilities":"ASTARTES_BANNER_ANCIENT, HONOUR_OR_DEATH_CHAMPION, NARTHECIUM_APOTHECARY, RAVENWING_COMMAND_SQUAD_WARGEAR","Other_Abilities":"LEADER_RAVENWING_COMMAND_SQUAD"}},{"file":"data/marines/Unit_Profiles.csv","id_column":"Unit_ID","row_id":"REDEMPTOR_PLASMA","sets":{"Abilities":"DUTY_ETERNAL","Other_Abilities":"DEADLY_DEMISE_D3, DAMAGED_1_4"}},{"file":"data/marines/Unit_Profiles.csv","id_column":"Unit_ID","row_id":"REIVERS","sets":{"Abilities":"TERROR_TROOPS_AURA, FEARSOME_ASSAULT","Other_Abilities":"SCOUTS_6"}},{"file":"data/marines/Unit_Profiles.csv","id_column":"Unit_ID","row_id":"REPULSOR","sets":{"Abilities":"COMBAT_EMBARKATION","Other_Abilities":"DEADLY_DEMISE_D6, DAMAGED_1_6, TRANSPORT_REPULSOR"}},{"file":"data/marines/Unit_Profiles.csv","id_column":"Unit_ID","row_id":"REPULSOR_EXECUTIONER","sets":{"Abilities":"EXECUTIONER","Other_Abilities":"DEADLY_DEMISE_D6, DAMAGED_1_6, TRANSPORT_REPULSOR_EXECUTIONER"}},{"file":"data/marines/Unit_Profiles.csv","id_column":"Unit_ID","row_id":"RHINO","sets":{"Abilities":"VEILING_SMOKE","Other_Abilities":"DEADLY_DEMISE_D3, FIRING_DECK_2, TRANSPORT_RHINO"}},{"file":"data/marines/Unit_Profiles.csv","id_column":"Unit_ID","row_id":"SCOUTS","sets":{"Abilities":"FLEXIBLE_ASSET","Other_Abilities":"INFILTRATORS, SCOUTS_6"}},{"file":"data/marines/Unit_Profiles.csv","id_column":"Unit_ID","row_id":"STERNGUARD_VETS","sets":{"Abilities":"VETERAN_MARKSMEN","Other_Abilities":""}},{"file":"data/marines/Unit_Profiles.csv","id_column":"Unit_ID","row_id":"STORM_SPEEDER_HAILSTRIKE","sets":{"Abilities":"HAILSTRIKE","Other_Abilities":"DEEP_STRIKE, DEADLY_DEMISE_D3"}},{"file":"data/marines/Unit_Profiles.csv","id_column":"Unit_ID","row_id":"STORM_SPEEDER_HAMMERSTRIKE","sets":{"Abilities":"HAMMERSTRIKE","Other_Abilities":"DEEP_STRIKE, DEADLY_DEMISE_D3"}},{"file":"data/marines/Unit_Profiles.csv","id_column":"Unit_ID","row_id":"STORM_SPEEDER_THUNDERSTRIKE","sets":{"Abilities":"THUNDERSTRIKE, SHATTERED_DEFENCES","Other_Abilities":"DEEP_STRIKE, DEADLY_DEMISE_D3"}},{"file":"data/marines/Unit_Profiles.csv","id_column":"Unit_ID","row_id":"SUBODEN_KHAN","sets":{"Abilities":"SPEAR_OF_CHOGORIS, SKILLED_RIDERS, SUBODEN_KHAN_UNIT_COMPOSITION","Other_Abilities":"LEADER"}},{"file":"data/marines/Unit_Profiles.csv","id_column":"Unit_ID","row_id":"SUPPRESSOR_SQUAD","sets":{"Abilities":"SUPPRESSION_FIRE","Other_Abilities":"DEEP_STRIKE"}},{"file":"data/marines/Unit_Profiles.csv","id_column":"Unit_ID","row_id":"TECHMARINE","sets":{"Abilities":"BLESSINGS_OF_THE_OMNISSIAH","Other_Abilities":"LEADER, TECHMARINE_AURA"}},{"file":"data/marines/Unit_Profiles.csv","id_column":"Unit_ID","row_id":"TERMINATOR_ASSAULT_SQUAD","sets":{"Abilities":"TERMINATUS_ASSAULT","Other_Abilities":"DEEP_STRIKE, Teleport_Homer"}},{"file":"data/marines/Unit_Profiles.csv","id_column":"Unit_ID","row_id":"TERMINATOR_SQUAD","sets":{"Abilities":"FURY_OF_THE_FIRST","Other_Abilities":"DEEP_STRIKE, Teleport_Homer"}},{"file":"data/marines/Unit_Profiles.csv","id_column":"Unit_ID","row_id":"URIEL_VENTRIS","sets":{"Abilities":"UNORTHODOX_STRATEGIST, MASTER_OF_THE_FLEET","Other_Abilities":""}},{"file":"data/marines/Unit_Profiles.csv","id_column":"Unit_ID","row_id":"VANGUARD_VETERAN_SQUAD_WITH_JUMP_PACKS","sets":{"Abilities":"VANGUARD_ASSAULT","Other_Abilities":"DEEP_STRIKE"}},{"file":"data/marines/Unit_Profiles.csv","id_column":"Unit_ID","row_id":"VICTRIX_HONOUR_GUARD","sets":{"Abilities":"VICTRIX_HONOUR_GUARD_GLORY_OF_ULTRAMAR, VICTRIX_HONOUR_GUARD_HONOUR_GUARD_OF_MACRAGGE, VICTRIX_HONOUR_GUARD_UNIT_COMPOSITION","Other_Abilities":""}},{"file":"data/marines/Unit_Profiles.csv","id_column":"Unit_ID","row_id":"VULKAN_HESTAN","sets":{"Abilities":"FORGEFATHER, SEEKER_OF_THE_UNFOUND, VULKAN_HESTAN_UNIT_COMPOSITION","Other_Abilities":"FNP_6, LEADER"}},{"file":"data/marines/Unit_Profiles.csv","id_column":"Unit_ID","row_id":"drop_pod","sets":{"Abilities":"DROP_POD_ASSAULT, DEPLOYMENT_COMPLETE","Other_Abilities":"DEADLY_DEMISE_1, DEEP_STRIKE, TRANSPORT_DROP_POD"}},{"file":"data/marines/Unit_Profiles.csv","id_column":"Unit_ID","row_id":"apothecary","sets":{"Abilities":"APOTHECARY_NARTHECIUM","Other_Abilities":"SUPPORT"}},{"file":"data/marines/Unit_Profiles.csv","id_column":"Unit_ID","row_id":"apothecary_biologis","sets":{"Abilities":"SURGICAL_PRECISION","Other_Abilities":"SUPPORT"}},{"file":"data/marines/Unit_Profiles.csv","id_column":"Unit_ID","row_id":"ROBOUTE_GUILLIMAN","sets":{"Abilities":"ROBOUTE_GUILLIMAN_SUPREME_COMMANDER, ROBOUTE_GUILLIMAN_PRIMARCH_OF_THE_XIII, ROBOUTE_GUILLIMAN_AUTHOR_OF_THE_CODEX, ROBOUTE_GUILLIMAN_LEADER_OF_ASTARTES, ROBOUTE_GUILLIMAN_UNIT_COMPOSITION","Other_Abilities":"ROBOUTE_GUILLIMAN_CODEX_ADEPT, FNP_5"}},{"file":"data/marines/Unit_Profiles.csv","id_column":"Unit_ID","row_id":"MARNEUS_CALGAR","sets":{"Abilities":"MARNEUS_CALGAR_MASTER_TACTICIAN, MARNEUS_CALGAR_THUNDERHAWK_INSERTION, MARNEUS_CALGAR_UNIT_COMPOSITION","Other_Abilities":"DEEP_STRIKE, LEADER, MARNEUS_CALGAR_CODEX_ADEPT"}},{"file":"data/marines/Unit_Profiles.csv","id_column":"Unit_ID","row_id":"CAPTAIN_TITUS","sets":{"Abilities":"CAPTAIN_TITUS_PRESS_THE_ATTACK, CAPTAIN_TITUS_RIGHTEOUS_FURY, CAPTAIN_TITUS_HONOUR_OF_ULTRAMAR, CAPTAIN_TITUS_UNIT_COMPOSITION","Other_Abilities":"FNP_5, LEADER"}},{"file":"data/marines/Unit_Profiles.csv","id_column":"Unit_ID","row_id":"WARDENS_OF_ULTRAMAR","sets":{"Abilities":"WARDENS_OF_ULTRAMAR_SUPPORT, WARDENS_OF_ULTRAMAR_STRATEGIUM_COMMAND, WARDENS_OF_ULTRAMAR_MODEL_PROFILES, WARDENS_OF_ULTRAMAR_UNIT_COMPOSITION","Other_Abilities":"WARDENS_OF_ULTRAMAR_RAISE_THE_BANNER"}},{"file":"data/marines/Unit_Profiles.csv","id_column":"Unit_ID","row_id":"CHIEF_LIBRARIAN_TIGURIUS","sets":{"Abilities":"CHIEF_LIBRARIAN_TIGURIUS_CHIEF_LIBRARIAN, CHIEF_LIBRARIAN_TIGURIUS_PRESCIENCE, CHIEF_LIBRARIAN_TIGURIUS_TELEPATHIC_ASSAULT, CHIEF_LIBRARIAN_TIGURIUS_HOOD_OF_HELLFIRE, CHIEF_LIBRARIAN_TIGURIUS_UNIT_COMPOSITION","Other_Abilities":"LEADER"}},{"file":"data/marines/Unit_Profiles.csv","id_column":"Unit_ID","row_id":"CATO_SICARIUS","sets":{"Abilities":"CATO_SICARIUS_KNIGHT_CHAMPION_OF_MACRAGGE, CATO_SICARIUS_HONOUR_OR_DEATH, CATO_SICARIUS_CAPTAIN_OF_THE_HONOUR_GUARD, CATO_SICARIUS_UNIT_COMPOSITION","Other_Abilities":"LEADER"}},{"file":"data/marines/Unit_Profiles.csv","id_column":"Unit_ID","row_id":"KAIUS_KONORIUS","sets":{"Abilities":"KAIUS_KONORIUS_SUPPORT, KAIUS_KONORIUS_VETERAN_BODYGUARD, KAIUS_KONORIUS_CALGARS_CHAMPION, KAIUS_KONORIUS_UNIT_COMPOSITION","Other_Abilities":""}},{"file":"data/marines/Unit_Profiles.csv","id_column":"Unit_ID","row_id":"DARNATH_LYSANDER","sets":{"Abilities":"RAMPART, ICON_OF_OBSTINACY, DARNATH_LYSANDER_UNIT_COMPOSITION","Other_Abilities":"DEEP_STRIKE, LEADER"}},{"file":"data/marines/Unit_Profiles.csv","id_column":"Unit_ID","row_id":"TOR_GARADON","sets":{"Abilities":"TOR_GARADON_SIEGE_CAPTAIN, TOR_GARADON_SIGNUM_ARRAY, TOR_GARADON_UNIT_COMPOSITION","Other_Abilities":"LEADER"}}]' }}
        run: |
          python3 <<'PY'
          import csv, json, os, sys
          from pathlib import Path

          raw = os.environ.get('PATCHES') or ''
          if not raw.strip():
              print('no PATCHES input; skip apply')
              raise SystemExit(0)
          try:
              ops = json.loads(raw)
          except json.JSONDecodeError as e:
              sys.exit(f'patches is not JSON: {e}')
          if not isinstance(ops, list) or not ops:
              sys.exit('patches must be a non-empty JSON list')

          def decode(val):
              if val is None:
                  return ''
              s = str(val)
              return s.replace('\\n', '\n')

          def load_csv(path):
              if path.is_absolute() or '..' in path.parts:
                  sys.exit(f'bad path {path}')
              if not str(path).startswith('data/') or path.suffix.lower() != '.csv':
                  sys.exit(f'file must be a .csv under data/: {path}')
              if not path.is_file():
                  sys.exit(f'missing {path}')
              with path.open(encoding='utf-8', newline='') as f:
                  rows = list(csv.reader(f))
              if not rows:
                  sys.exit(f'empty csv {path}')
              return rows

          files = {}
          changed = set()

          for i, op in enumerate(ops):
              if not isinstance(op, dict):
                  sys.exit(f'op {i} is not an object')
              path = Path(str(op.get('file', '')).strip())
              if path not in files:
                  files[path] = load_csv(path)
              rows = files[path]
              header = rows[0]
              id_col = str(op.get('id_column') or '').strip() or header[0]
              if id_col not in header:
                  sys.exit(f'op {i}: id column not in header: {id_col}')
              i_id = header.index(id_col)
              row_id = str(op.get('row_id') or '').strip()
              if not row_id:
                  sys.exit(f'op {i}: row_id required')
              mode = str(op.get('mode') or 'update').strip()

              if mode == 'add_column':
                  col = str(op.get('column') or '').strip()
                  if not col:
                      sys.exit(f'op {i}: add_column needs column')
                  if col in header:
                      print(f'column already exists {path} {col}')
                      continue
                  after_col = str(op.get('after_column') or '').strip()
                  if after_col and after_col not in header:
                      sys.exit(f'op {i}: after column not in header: {after_col}')
                  insert_at = header.index(after_col) + 1 if after_col else len(header)
                  old_width = len(header)
                  header.insert(insert_at, col)
                  for row in rows[1:]:
                      while len(row) < old_width:
                          row.append('')
                      row.insert(insert_at, '')
                  changed.add(path)
                  print(f'added column {path} {col}')
                  continue

              if mode == 'remove_column':
                  col = str(op.get('column') or '').strip()
                  if not col:
                      sys.exit(f'op {i}: remove_column needs column')
                  if col not in header:
                      sys.exit(f'op {i}: column not in header: {col}')
                  remove_at = header.index(col)
                  header.pop(remove_at)
                  for row in rows[1:]:
                      if len(row) > remove_at:
                          row.pop(remove_at)
                  changed.add(path)
                  print(f'removed column {path} {col}')
                  continue

              if mode == 'dedupe_by_key':
                  key_col = str(op.get('key_column') or '').strip()
                  if key_col not in header:
                      sys.exit(f'op {i}: key column not in header: {key_col}')
                  i_key = header.index(key_col)
                  kept = [header]
                  seen = set()
                  matched = 0
                  removed = 0
                  for row in rows[1:]:
                      if not row:
                          continue
                      while len(row) < len(header):
                          row.append('')
                      if row[i_id] != row_id:
                          kept.append(row)
                          continue
                      matched += 1
                      key = row[i_key].strip()
                      if not key:
                          sys.exit(f'op {i}: blank {key_col} while deduping {row_id!r}')
                      if key in seen:
                          removed += 1
                          continue
                      seen.add(key)
                      kept.append(row)
                  if matched < 1:
                      sys.exit(f'op {i}: found no rows for {row_id!r}')
                  if removed < 1:
                      sys.exit(f'op {i}: found no duplicate rows for {row_id!r}')
                  files[path] = kept
                  changed.add(path)
                  print(f'deduped {path} {row_id}: kept {len(seen)} unique {key_col} values, removed {removed} duplicates')
                  continue

              if mode == 'fill_blank_where':
                  match_col = str(op.get('match_column') or '').strip()
                  col = str(op.get('column') or '').strip()
                  if match_col not in header:
                      sys.exit(f'op {i}: match column not in header: {match_col}')
                  if col not in header:
                      sys.exit(f'op {i}: column not in header: {col}')
                  match_value = decode(op.get('match_value')).strip()
                  new = decode(op.get('value'))
                  if not match_value:
                      sys.exit(f'op {i}: match_value required')
                  if new == '':
                      sys.exit(f'op {i}: value required')
                  i_match = header.index(match_col)
                  i_col = header.index(col)
                  hits = 0
                  for row in rows[1:]:
                      if not row:
                          continue
                      while len(row) < len(header):
                          row.append('')
                      if row[i_match].strip() == match_value and not row[i_col].strip():
                          row[i_col] = new
                          hits += 1
                  if hits < 1:
                      sys.exit(f'op {i}: found no blank {col} values where {match_col}={match_value!r}')
                  changed.add(path)
                  print(f'filled {hits} blank {col} values in {path} where {match_col}={match_value!r}')
                  continue

              if mode == 'replace_text':
                  col = str(op.get('column') or '').strip()
                  if col not in header:
                      sys.exit(f'op {i}: column not in header: {col}')
                  old = decode(op.get('from'))
                  new = decode(op.get('to'))
                  if not old:
                      sys.exit(f'op {i}: replace_text needs non-empty from')
                  i_col = header.index(col)
                  hits = 0
                  for row in rows[1:]:
                      if not row:
                          continue
                      while len(row) < len(header):
                          row.append('')
                      if old in row[i_col]:
                          row[i_col] = row[i_col].replace(old, new)
                          hits += 1
                  if hits < 1:
                      sys.exit(f'op {i}: replace_text found no matches for {old!r}')
                  changed.add(path)
                  print(f'replaced {old!r} in {hits} rows of {path} column {col}')
                  continue

              if mode == 'delete_where':
                  where = op.get('where')
                  if not isinstance(where, dict) or not where:
                      sys.exit(f'op {i}: delete_where needs where')
                  for col in where:
                      if col not in header:
                          sys.exit(f'op {i}: column not in header: {col}')
                  kept = [header]
                  hits = 0
                  for row in rows[1:]:
                      if not row:
                          continue
                      while len(row) < len(header):
                          row.append('')
                      matched = True
                      for col, val in where.items():
                          if row[header.index(col)] != decode(val):
                              matched = False
                              break
                      if matched:
                          hits += 1
                          continue
                      kept.append(row)
                  if hits < 1:
                      sys.exit(f'op {i}: delete_where found no rows for {where!r}')
                  files[path] = kept
                  changed.add(path)
                  print(f'deleted {hits} rows from {path} where {where}')
                  continue

              if mode == 'delete':
                  kept = [header]
                  hits = 0
                  for row in rows[1:]:
                      if not row:
                          continue
                      if len(row) > i_id and row[i_id] == row_id:
                          hits += 1
                          continue
                      kept.append(row)
                  if hits != 1:
                      sys.exit(f'op {i}: expected 1 row for {row_id!r}, found {hits}')
                  files[path] = kept
                  changed.add(path)
                  print(f'deleted {path} {row_id}')
                  continue

              if mode == 'insert':
                  existing = 0
                  for row in rows[1:]:
                      if row and len(row) > i_id and row[i_id] == row_id:
                          existing += 1
                  allow_duplicate_id = bool(op.get('allow_duplicate_id'))
                  if existing and not allow_duplicate_id:
                      sys.exit(f'op {i}: row already exists: {row_id}')
                  sets = op.get('sets')
                  if not isinstance(sets, dict) or not sets:
                      sys.exit(f'op {i}: insert needs sets')
                  new_row = [''] * len(header)
                  new_row[i_id] = row_id
                  for col, val in sets.items():
                      if col not in header:
                          sys.exit(f'op {i}: column not in header: {col}')
                      new_row[header.index(col)] = decode(val)
                  after = str(op.get('after_row_id') or '').strip()
                  if after:
                      placed = False
                      kept = [header]
                      for row in rows[1:]:
                          kept.append(row)
                          if row and len(row) > i_id and row[i_id] == after:
                              kept.append(new_row)
                              placed = True
                      if not placed:
                          sys.exit(f'op {i}: after_row_id not found: {after}')
                      files[path] = kept
                  else:
                      rows.append(new_row)
                      files[path] = rows
                  changed.add(path)
                  print(f'inserted {path} {row_id}')
                  continue

              if mode != 'update':
                  sys.exit(f'op {i}: unknown mode {mode}')

              sets = op.get('sets')
              if not isinstance(sets, dict) or not sets:
                  sets = {}
                  if op.get('column'):
                      sets[str(op['column'])] = op.get('value', '')
                  if op.get('column_2'):
                      sets[str(op['column_2'])] = op.get('value_2', '')
              if not sets:
                  sys.exit(f'op {i}: update needs sets or column/value')

              hits = 0
              for row in rows[1:]:
                  if not row:
                      continue
                  while len(row) < len(header):
                      row.append('')
                  if row[i_id] != row_id:
                      continue
                  for col, val in sets.items():
                      if col not in header:
                          sys.exit(f'op {i}: column not in header: {col}')
                      row[header.index(col)] = decode(val)
                  hits += 1
              if hits != 1:
                  sys.exit(f'op {i}: expected 1 row for {row_id!r}, found {hits}')
              changed.add(path)
              print(f'updated {path} {row_id} {list(sets)}')

          for path, rows in files.items():
              if path not in changed:
                  continue
              with path.open('w', newline='', encoding='utf-8') as f:
                  csv.writer(f, lineterminator='\n').writerows(rows)
          print('changed', ' '.join(str(p) for p in sorted(changed)))
          PY

      - name: Refresh manifests
        run: python3 scripts/data_schema.py manifest

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- data
          if git diff --cached --quiet; then
            echo "No change"
            exit 0
          fi
          git commit -m "Patch CSV line items"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
