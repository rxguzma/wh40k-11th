name: Patch CSV

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-csv.yml'
  workflow_dispatch:
    inputs:
      patches:
        description: JSON list of operations. One run, one commit.
        required: true
        type: string

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply patches
        env:
          PATCHES: ${{ inputs.patches || '[{"file":"data/marines/Abilities.csv","id_column":"Ability_ID","row_id":"THUNDEROUS_IMPACT","column":"Short_Description","value":"Charge = +1 S and +1 Damage [+1 S] [+1 D]"},{"file":"data/marines/Abilities.csv","id_column":"Ability_ID","row_id":"THUNDERSTRIKE","column":"Short_Description","value":"Units get +1 TO WOUND vs MONSTERS and VEHICLES [+1 TO WOUND] [+1 TO WOUND]"},{"file":"data/marines/Abilities.csv","id_column":"Ability_ID","row_id":"TOTAL_OBLITERATION","column":"Short_Description","value":"Against MONSTERS or VEHICLES, RE-ROLL ALL HITS, RE-ROLL ALL WOUNDS and re-roll ALL To Damage rolls. [RE-ROLL ALL HITS] [RE-ROLL ALL WOUNDS] [RE-ROLL ALL HITS] [RE-ROLL ALL WOUNDS]"},{"file":"data/marines/Abilities.csv","id_column":"Ability_ID","row_id":"UNBREAKABLE_RESOLVE","column":"Short_Description","value":"FNP 4+ near an objective or battlefield centre [FNP 4+]"},{"file":"data/marines/Abilities.csv","id_column":"Ability_ID","row_id":"VANGUARD_ASSAULT","column":"Short_Description","value":"Charge\u003A melee weapons gain LETHAL HITS [LETHAL HITS]"},{"file":"data/marines/Abilities.csv","id_column":"Ability_ID","row_id":"VEIL_OF_TIME_PSYCHIC","column":"Short_Description","value":"Unit has SUSTAINED HITS 1. [SUSTAINED HITS 1] [SUSTAINED HITS 1]"},{"file":"data/marines/Abilities.csv","id_column":"Ability_ID","row_id":"WATCHER_IN_THE_DARK","column":"Short_Description","value":"Once\u003A 4+ FNP vs. Mortal Wounds [FNP 4+]"},{"file":"data/marines/Abilities.csv","id_column":"Ability_ID","row_id":"HAIL_OF_BOLTS","column":"Short_Description","value":"Add +2 Attacks to bolt rifles against one selected visible enemy unit [+2 A]"},{"file":"data/marines/Abilities.csv","id_column":"Ability_ID","row_id":"MELEE_INVULNERABLE_SAVE_4","column":"Short_Description","value":"MELEE\u003A 4++ [INVULNERABLE SAVE 4+]"},{"file":"data/marines/Abilities.csv","id_column":"Ability_ID","row_id":"MASTERFUL_TACTICIAN","column":"Short_Description","value":"If on the battlefield at the start of your Command phase, gain 1CP. [GAIN 1 CP]"},{"file":"data/marines/Abilities.csv","id_column":"Ability_ID","row_id":"ANGELS_WRATH","column":"Short_Description","value":"After a Charge while leading, +1 S to the unit’s melee weapons this turn. [+1 S]"},{"file":"data/marines/Abilities.csv","id_column":"Ability_ID","row_id":"SHROUDING","column":"Short_Description","value":"While leading\u003A unit has Stealth and cannot be targeted by ranged attacks outside 12\". [STEALTH] [LONE OPERATIVE]"},{"file":"data/marines/Abilities.csv","id_column":"Ability_ID","row_id":"MASTER_OF_DECEIT","column":"Short_Description","value":"After deployment\u003A redeploy up to 3 ADEPTUS ASTARTES INFANTRY units; may enter Strategic Reserves. [REDEPLOY 3]"},{"file":"data/marines/Abilities.csv","id_column":"Ability_ID","row_id":"APOTHECARY_GENE_SEED_RECOVERY","column":"Short_Description","value":"Bodyguard destroyed\u003A roll D6; on 2+, gain 1CP. [GAIN 1 CP]"},{"file":"data/marines/Abilities.csv","id_column":"Ability_ID","row_id":"SURGICAL_PRECISION","column":"Short_Description","value":"While leading\u003A Unit weapons gain LETHAL HITS [LETHAL HITS] [LETHAL HITS]"},{"file":"data/marines/Abilities.csv","id_column":"Ability_ID","row_id":"ASSAULT_TERMINATORS_THUNDER_HAMMER_POINTS","column":"Short_Description","value":"Storm Shield +1 W each [+1 W]"},{"file":"data/marines/Abilities.csv","id_column":"Ability_ID","row_id":"REDEMPTOR_MACRO_PLASMA_POINTS","column":"Short_Description","value":"Each Macro Plasma Incinerator +10 Pts per model [+10 Pts]"},{"file":"data/marines/Abilities.csv","id_column":"Ability_ID","row_id":"ANCIENT_TERMINATOR_STORM_SHIELD","column":"Short_Description","value":"Storm Shield +1 W [+1 W]"},{"file":"data/marines/Abilities.csv","id_column":"Ability_ID","row_id":"ROBOUTE_GUILLIMAN_PRIMARCH_OF_THE_XIII","column":"Short_Description","value":"6\" friendly ADEPTUS ASTARTES\\nAttacks\u003A RE-ROLL 1S TO HIT / WOUND [RE-ROLL 1S TO HIT] [RE-ROLL 1S TO WOUND] [RE-ROLL 1S TO HIT] [RE-ROLL 1S TO WOUND]"},{"file":"data/marines/Abilities.csv","id_column":"Ability_ID","row_id":"ROBOUTE_GUILLIMAN_LEADER_OF_ASTARTES","column":"Short_Description","value":"Within 3\" of INFANTRY = LONE OPERATIVE. [LONE OPERATIVE]"},{"file":"data/marines/Abilities.csv","id_column":"Ability_ID","row_id":"CHIEF_LIBRARIAN_TIGURIUS_HOOD_OF_HELLFIRE","column":"Short_Description","value":"FNP 4+ against psychic attacks and mortal wounds. [FNP 4+]"},{"file":"data/marines/Abilities.csv","id_column":"Ability_ID","row_id":"VICTRIX_HONOUR_GUARD_BANNER_OF_MACRAGGE","column":"Short_Description","value":"CONTROL objective → SECURED\\n1/BATTLE when selected to FIGHT\u003A melee +1 A / +1 S [+1 A] [+1 S]"},{"file":"data/marines/Abilities.csv","id_column":"Ability_ID","row_id":"KAIUS_KONORIUS_CALGARS_CHAMPION","column":"Short_Description","value":"Vs CHARACTER\u003A RE-ROLL HIT 1S / WOUND 1S [RE-ROLL 1S TO HIT] [RE-ROLL 1S TO WOUND] [RE-ROLL 1S TO HIT] [RE-ROLL 1S TO WOUND]"},{"file":"data/marines/Abilities.csv","id_column":"Ability_ID","row_id":"ICON_OF_OBSTINACY","column":"Short_Description","value":"Attacks that target this unit have -1 to Hit rolls. [ENEMY -1 TO HIT]"},{"file":"data/marines/Abilities.csv","id_column":"Ability_ID","row_id":"CAPTAIN_RELIC_SHIELD","column":"Short_Description","value":"+1 W [+1 W]"},{"file":"data/marines/Detachment_Definitions.csv","id_column":"Rule_ID","row_id":"space_marines_terminator_stormforce_detachment_rule_death_blow","column":"Short_Description","value":"TERMINATOR\u003A +1 CHARGE [+1 CHARGE]"},{"file":"data/marines/Enhancements.csv","id_column":"Enhancement_ID","row_id":"space_marines_assault_brethren_enhancement_furious_assault_upgrade","column":"Short_Description","value":"INFANTRY only\\nMELEE\u003A SUSTAINED HITS 1 vs non-MONSTER / VEHICLE [SUSTAINED HITS 1]"},{"file":"data/marines/Enhancements.csv","id_column":"Enhancement_ID","row_id":"space_marines_devastator_brethren_enhancement_master_forged_firearms","column":"Short_Description","value":"INFANTRY / MOUNTED only\\nNon-PSYCHIC RANGED\u003A +1 A, +1 S, +1 AP & +1 D [+1 A] [+1 S] [+1 AP] [+1 D]"},{"file":"data/marines/Enhancements.csv","id_column":"Enhancement_ID","row_id":"space_marines_devastator_brethren_enhancement_honour_of_vigilance","column":"Short_Description","value":"RANGED\u003A LETHAL HITS\\nIn DEVASTATOR\u003A Re-roll ADVANCE [LETHAL HITS]"},{"file":"data/marines/Enhancements.csv","id_column":"Enhancement_ID","row_id":"space_marines_terminator_stormforce_enhancement_champion_of_the_first_company","column":"Short_Description","value":"TERMINATOR only\\nMELEE\u003A LETHAL HITS [LETHAL HITS]"},{"file":"data/marines/Stratagems.csv","id_column":"Stratagem_ID","row_id":"space_marines_gladius_task_force_stratagem_storm_of_devastation_1cp","column":"Short_Description","value":"RANGED\u003A IGNORES COVER [IGNORES COVER]"},{"file":"data/marines/Stratagems.csv","id_column":"Stratagem_ID","row_id":"space_marines_gladius_task_force_stratagem_might_of_angels_1cp","column":"Short_Description","value":"MELEE\u003A LANCE [LANCE]"},{"file":"data/marines/Stratagems.csv","id_column":"Stratagem_ID","row_id":"space_marines_assault_brethren_stratagem_gene_wrought_might_1cp","column":"Short_Description","value":"FIGHT\u003A MELEE have LANCE\\nIn ASSAULT\u003A LANCE & +1 AP [LANCE]"},{"file":"data/marines/Stratagems.csv","id_column":"Stratagem_ID","row_id":"space_marines_devastator_brethren_stratagem_storm_of_fire_1cp","column":"Short_Description","value":"SHOOTING\u003A RANGED IGNORE COVER\\nIn DEVASTATOR\u003A IGNORE COVER & +1 AP [IGNORES COVER]"},{"file":"data/marines/Stratagems.csv","id_column":"Stratagem_ID","row_id":"space_marines_terminator_stormforce_stratagem_tactical_dreadnought_fortitude_2cp","column":"Short_Description","value":"Enemy SHOOTING / FIGHT\\nTERMINATOR\u003A Attacks -1 D [INCOMING -1 D]"},{"file":"data/marines/Stratagems.csv","id_column":"Stratagem_ID","row_id":"space_marines_terminator_stormforce_stratagem_merciless_veterans_1cp","column":"Short_Description","value":"TERMINATOR SHOOTING\\nRANGED\u003A LETHAL HITS & SUSTAINED HITS 1 [LETHAL HITS] [SUSTAINED HITS 1]"},{"file":"data/marines/Stratagems.csv","id_column":"Stratagem_ID","row_id":"space_marines_terminator_stormforce_stratagem_gunship_extraction_1cp","column":"Short_Description","value":"End of enemy FIGHT\\nUnengaged TERMINATOR\u003A STRATEGIC RESERVES [STRATEGIC RESERVES]"},{"file":"data/marines/Stratagems.csv","id_column":"Stratagem_ID","row_id":"space_marines_phobos_shadow_force_stratagem_strike_from_the_shadows_1cp","column":"Short_Description","value":"HIDDEN PHOBOS SHOOTING / FIGHT\\nAttacks\u003A +1 S & LETHAL HITS [LETHAL HITS]"},{"file":"data/marines/Stratagems.csv","id_column":"Stratagem_ID","row_id":"space_marines_phobos_shock_force_stratagem_strike_from_the_shadows_1cp","column":"Short_Description","value":"HIDDEN PHOBOS SHOOTING / FIGHT\\nAttacks\u003A +1 S & LETHAL HITS [LETHAL HITS]"},{"file":"data/marines/Stratagems.csv","id_column":"Stratagem_ID","row_id":"space_marines_gravis_linebreaker_force_stratagem_annihilating_force_1cp","column":"Short_Description","value":"GRAVIS SHOOTING / FIGHT\\nAttacks\u003A LETHAL HITS [LETHAL HITS]"}]' }}
        run: |
          python3 <<'PY'
          import csv, json, os, sys
          from pathlib import Path

          raw = os.environ.get('PATCHES') or ''
          if not raw.strip():
              print('no PATCHES input; skip apply')
              raise SystemExit(0)
          try:
              ops = json.loads(raw)
          except json.JSONDecodeError as e:
              sys.exit(f'patches is not JSON: {e}')
          if not isinstance(ops, list) or not ops:
              sys.exit('patches must be a non-empty JSON list')

          def decode(val):
              if val is None:
                  return ''
              s = str(val)
              return s.replace('\\n', '\n')

          def load_csv(path):
              if path.is_absolute() or '..' in path.parts:
                  sys.exit(f'bad path {path}')
              if not str(path).startswith('data/') or path.suffix.lower() != '.csv':
                  sys.exit(f'file must be a .csv under data/: {path}')
              if not path.is_file():
                  sys.exit(f'missing {path}')
              with path.open(encoding='utf-8', newline='') as f:
                  rows = list(csv.reader(f))
              if not rows:
                  sys.exit(f'empty csv {path}')
              return rows

          files = {}
          changed = set()

          for i, op in enumerate(ops):
              if not isinstance(op, dict):
                  sys.exit(f'op {i} is not an object')
              path = Path(str(op.get('file', '')).strip())
              if path not in files:
                  files[path] = load_csv(path)
              rows = files[path]
              header = rows[0]
              id_col = str(op.get('id_column') or '').strip() or header[0]
              if id_col not in header:
                  sys.exit(f'op {i}: id column not in header: {id_col}')
              i_id = header.index(id_col)
              row_id = str(op.get('row_id') or '').strip()
              if not row_id:
                  sys.exit(f'op {i}: row_id required')
              mode = str(op.get('mode') or 'update').strip()

              if mode == 'add_column':
                  col = str(op.get('column') or '').strip()
                  if not col:
                      sys.exit(f'op {i}: add_column needs column')
                  if col in header:
                      print(f'column already exists {path} {col}')
                      continue
                  after_col = str(op.get('after_column') or '').strip()
                  if after_col and after_col not in header:
                      sys.exit(f'op {i}: after column not in header: {after_col}')
                  insert_at = header.index(after_col) + 1 if after_col else len(header)
                  old_width = len(header)
                  header.insert(insert_at, col)
                  for row in rows[1:]:
                      while len(row) < old_width:
                          row.append('')
                      row.insert(insert_at, '')
                  changed.add(path)
                  print(f'added column {path} {col}')
                  continue

              if mode == 'remove_column':
                  col = str(op.get('column') or '').strip()
                  if not col:
                      sys.exit(f'op {i}: remove_column needs column')
                  if col not in header:
                      sys.exit(f'op {i}: column not in header: {col}')
                  remove_at = header.index(col)
                  header.pop(remove_at)
                  for row in rows[1:]:
                      if len(row) > remove_at:
                          row.pop(remove_at)
                  changed.add(path)
                  print(f'removed column {path} {col}')
                  continue

              if mode == 'dedupe_by_key':
                  key_col = str(op.get('key_column') or '').strip()
                  if key_col not in header:
                      sys.exit(f'op {i}: key column not in header: {key_col}')
                  i_key = header.index(key_col)
                  kept = [header]
                  seen = set()
                  matched = 0
                  removed = 0
                  for row in rows[1:]:
                      if not row:
                          continue
                      while len(row) < len(header):
                          row.append('')
                      if row[i_id] != row_id:
                          kept.append(row)
                          continue
                      matched += 1
                      key = row[i_key].strip()
                      if not key:
                          sys.exit(f'op {i}: blank {key_col} while deduping {row_id!r}')
                      if key in seen:
                          removed += 1
                          continue
                      seen.add(key)
                      kept.append(row)
                  if matched < 1:
                      sys.exit(f'op {i}: found no rows for {row_id!r}')
                  if removed < 1:
                      sys.exit(f'op {i}: found no duplicate rows for {row_id!r}')
                  files[path] = kept
                  changed.add(path)
                  print(f'deduped {path} {row_id}: kept {len(seen)} unique {key_col} values, removed {removed} duplicates')
                  continue

              if mode == 'fill_blank_where':
                  match_col = str(op.get('match_column') or '').strip()
                  col = str(op.get('column') or '').strip()
                  if match_col not in header:
                      sys.exit(f'op {i}: match column not in header: {match_col}')
                  if col not in header:
                      sys.exit(f'op {i}: column not in header: {col}')
                  match_value = decode(op.get('match_value')).strip()
                  new = decode(op.get('value'))
                  if not match_value:
                      sys.exit(f'op {i}: match_value required')
                  if new == '':
                      sys.exit(f'op {i}: value required')
                  i_match = header.index(match_col)
                  i_col = header.index(col)
                  hits = 0
                  for row in rows[1:]:
                      if not row:
                          continue
                      while len(row) < len(header):
                          row.append('')
                      if row[i_match].strip() == match_value and not row[i_col].strip():
                          row[i_col] = new
                          hits += 1
                  if hits < 1:
                      sys.exit(f'op {i}: found no blank {col} values where {match_col}={match_value!r}')
                  changed.add(path)
                  print(f'filled {hits} blank {col} values in {path} where {match_col}={match_value!r}')
                  continue

              if mode == 'replace_text':
                  col = str(op.get('column') or '').strip()
                  if col not in header:
                      sys.exit(f'op {i}: column not in header: {col}')
                  old = decode(op.get('from'))
                  new = decode(op.get('to'))
                  if not old:
                      sys.exit(f'op {i}: replace_text needs non-empty from')
                  i_col = header.index(col)
                  hits = 0
                  for row in rows[1:]:
                      if not row:
                          continue
                      while len(row) < len(header):
                          row.append('')
                      if old in row[i_col]:
                          row[i_col] = row[i_col].replace(old, new)
                          hits += 1
                  if hits < 1:
                      sys.exit(f'op {i}: replace_text found no matches for {old!r}')
                  changed.add(path)
                  print(f'replaced {old!r} in {hits} rows of {path} column {col}')
                  continue

              if mode == 'delete':
                  kept = [header]
                  hits = 0
                  for row in rows[1:]:
                      if not row:
                          continue
                      if len(row) > i_id and row[i_id] == row_id:
                          hits += 1
                          continue
                      kept.append(row)
                  if hits != 1:
                      sys.exit(f'op {i}: expected 1 row for {row_id!r}, found {hits}')
                  files[path] = kept
                  changed.add(path)
                  print(f'deleted {path} {row_id}')
                  continue

              if mode == 'insert':
                  existing = 0
                  for row in rows[1:]:
                      if row and len(row) > i_id and row[i_id] == row_id:
                          existing += 1
                  if existing:
                      sys.exit(f'op {i}: row already exists: {row_id}')
                  sets = op.get('sets')
                  if not isinstance(sets, dict) or not sets:
                      sys.exit(f'op {i}: insert needs sets')
                  new_row = [''] * len(header)
                  new_row[i_id] = row_id
                  for col, val in sets.items():
                      if col not in header:
                          sys.exit(f'op {i}: column not in header: {col}')
                      new_row[header.index(col)] = decode(val)
                  after = str(op.get('after_row_id') or '').strip()
                  if after:
                      placed = False
                      kept = [header]
                      for row in rows[1:]:
                          kept.append(row)
                          if row and len(row) > i_id and row[i_id] == after:
                              kept.append(new_row)
                              placed = True
                      if not placed:
                          sys.exit(f'op {i}: after_row_id not found: {after}')
                      files[path] = kept
                  else:
                      rows.append(new_row)
                      files[path] = rows
                  changed.add(path)
                  print(f'inserted {path} {row_id}')
                  continue

              if mode != 'update':
                  sys.exit(f'op {i}: unknown mode {mode}')

              sets = op.get('sets')
              if not isinstance(sets, dict) or not sets:
                  sets = {}
                  if op.get('column'):
                      sets[str(op['column'])] = op.get('value', '')
                  if op.get('column_2'):
                      sets[str(op['column_2'])] = op.get('value_2', '')
              if not sets:
                  sys.exit(f'op {i}: update needs sets or column/value')

              hits = 0
              for row in rows[1:]:
                  if not row:
                      continue
                  while len(row) < len(header):
                      row.append('')
                  if row[i_id] != row_id:
                      continue
                  for col, val in sets.items():
                      if col not in header:
                          sys.exit(f'op {i}: column not in header: {col}')
                      row[header.index(col)] = decode(val)
                  hits += 1
              if hits != 1:
                  sys.exit(f'op {i}: expected 1 row for {row_id!r}, found {hits}')
              changed.add(path)
              print(f'updated {path} {row_id} {list(sets)}')

          for path, rows in files.items():
              if path not in changed:
                  continue
              with path.open('w', newline='', encoding='utf-8') as f:
                  csv.writer(f, lineterminator='\n').writerows(rows)
          print('changed', ' '.join(str(p) for p in sorted(changed)))
          PY

      - name: Refresh manifests
        run: python3 scripts/data_schema.py manifest

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- data
          if git diff --cached --quiet; then
            echo "No change"
            exit 0
          fi
          git commit -m "Patch CSV line items"
          git push
