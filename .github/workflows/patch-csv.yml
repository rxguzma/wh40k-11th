name: Patch CSV

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-csv.yml'
  workflow_dispatch:
    inputs:
      patches:
        description: JSON list of operations. One run, one commit.
        required: true
        type: string

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply patches
        env:
          PATCHES: ${{ inputs.patches || '[{"file":"data/orks/Abilities.csv","id_column":"Ability_ID","row_id":"BEASTSCENT","column":"Short_Description","value":"Disembarking= +1 to wound vs MONSTER / VEHICLE\\nTest on D6, battle-shock on a 1 [+1 TO WOUND] [+1 TO WOUND]"},{"file":"data/orks/Abilities.csv","id_column":"Ability_ID","row_id":"BRUTAL_IMPACT","column":"Short_Description","value":"CHARGE this turn [+1 D] [+1 D]"},{"file":"data/orks/Abilities.csv","id_column":"Ability_ID","row_id":"BUST_EM","column":"Short_Description","value":"After shooting\u003A one hit enemy becomes busted. SPEED FREEKS get LETHAL HITS vs busted units [LETHAL HITS] [LETHAL HITS]"},{"file":"data/orks/Abilities.csv","id_column":"Ability_ID","row_id":"DAMAGED_1_6","column":"Short_Description","value":"While 1–6 wounds remaining [-1 TO HIT] [-1 TO HIT]"},{"file":"data/orks/Abilities.csv","id_column":"Ability_ID","row_id":"DA_GRAND_WARLORDS_LADZ","column":"Short_Description","value":"Lone Op while 3\" of Infantry [LONE OP 3\"]"},{"file":"data/orks/Abilities.csv","id_column":"Ability_ID","row_id":"DEEP_STRIKE","column":"Short_Description","value":"ANYTIME [DEEP STRIKE]"},{"file":"data/orks/Abilities.csv","id_column":"Ability_ID","row_id":"FINDER_KEEPERZ","column":"Short_Description","value":"RANGE\u003A unit or target on an Objective [+1 AP]"},{"file":"data/orks/Abilities.csv","id_column":"Ability_ID","row_id":"GET_OUT_DA_WAY","column":"Short_Description","value":"CHARGE\u003A excludes MONSTER / VEHICLE models [MOVE THROUGH MODELS]"},{"file":"data/orks/Abilities.csv","id_column":"Ability_ID","row_id":"HIGH_SPEED_CARNAGE","column":"Short_Description","value":"CHARGE this turn — MELEE [+1 S] [+1 D]"},{"file":"data/orks/Abilities.csv","id_column":"Ability_ID","row_id":"INFILTRATORS","column":"Short_Description","value":"ANYTIME [INFILTRATORS]"},{"file":"data/orks/Abilities.csv","id_column":"Ability_ID","row_id":"MOBBED","column":"Short_Description","value":"After charge\u003A engaged MONSTER / VEHICLE take Battle-shock (-1, or -2 if 13+ models) [ENEMY -1 BATTLE-SHOCK] [ENEMY -2 BATTLE-SHOCK]"},{"file":"data/orks/Abilities.csv","id_column":"Ability_ID","row_id":"MOBILE_FORTRESS","column":"Short_Description","value":"ANYTIME — incoming RANGE [INCOMING RANGE -1 D]"},{"file":"data/orks/Abilities.csv","id_column":"Ability_ID","row_id":"NOWHERE_TO_HIDE","column":"Short_Description","value":"vs HIDDEN units [+1 TO HIT] [+1 TO HIT]"},{"file":"data/orks/Abilities.csv","id_column":"Ability_ID","row_id":"ROKKIT_CHARGE","column":"Short_Description","value":"CHARGE this turn — MELEE [+1 A] [+1 S] [HAZARDOUS]"},{"file":"data/orks/Abilities.csv","id_column":"Ability_ID","row_id":"SPEEDNOB_SUPPORT","column":"Short_Description","value":"Within 3\" of friendly SPEED FREEKS (excluding WARTRAKK) [LONE OP 3\"]"},{"file":"data/orks/Abilities.csv","id_column":"Ability_ID","row_id":"STEALTH","column":"Short_Description","value":"ANYTIME [STEALTH]"},{"file":"data/orks/Abilities.csv","id_column":"Ability_ID","row_id":"WAAAGH_EFFIGY","column":"Short_Description","value":"ANYTIME [RILED UP] [5++ Invul]"},{"file":"data/orks/Abilities.csv","id_column":"Ability_ID","row_id":"WARPATH","column":"Short_Description","value":"Melee attacks gain LETHAL HITS and PSYCHIC\\nTest on D6, battle-shock on a 1 [LETHAL HITS]"},{"file":"data/orks/Abilities.csv","id_column":"Ability_ID","row_id":"TIDE_OF_MUSCLE","column":"Short_Description","value":"CHARGE this turn — MELEE [LETHAL HITS]"},{"file":"data/orks/Abilities.csv","id_column":"Ability_ID","row_id":"ARROGANT_INVULNERABILITY","column":"Short_Description","value":"Incoming attacks\u003A -1 AP [INCOMING -1 AP]"},{"file":"data/orks/Abilities.csv","id_column":"Ability_ID","row_id":"BIG_AN_SHOOTY","column":"Short_Description","value":"ANYTIME — RANGE [RE-ROLL 1S TO HIT]"},{"file":"data/orks/Abilities.csv","id_column":"Ability_ID","row_id":"BIG_AN_STOMPY","column":"Short_Description","value":"ANYTIME — MELEE [RE-ROLL 1S TO HIT]"},{"file":"data/orks/Abilities.csv","id_column":"Ability_ID","row_id":"DAMAGED_7","column":"Short_Description","value":"While 1–7 wounds remaining [-1 TO HIT] [-1 TO HIT]"},{"file":"data/orks/Abilities.csv","id_column":"Ability_ID","row_id":"DREAD_ARD","column":"Short_Description","value":"ANYTIME — incoming attacks [INCOMING -1 D]"},{"file":"data/orks/Abilities.csv","id_column":"Ability_ID","row_id":"INTIMIDATING_MOTIVATION","column":"Short_Description","value":"Once per Battle Round\\nStart or End of Movement\\nOrks 6\" un-shock and RILED UP. [INTIMIDATING MOTIVATION]"},{"file":"data/orks/Abilities.csv","id_column":"Ability_ID","row_id":"MOBILE_ARSENAL","column":"Short_Description","value":"SHOOTING\u003A Re-roll 1s To Hit [RE-ROLL 1S TO HIT]"},{"file":"data/orks/Abilities.csv","id_column":"Ability_ID","row_id":"NAZDREGS_KNOW_WOTZ","column":"Short_Description","value":"Ranged\u003A IGNORES COVER [DEEP STRIKE] [IGNORES COVER]"},{"file":"data/orks/Abilities.csv","id_column":"Ability_ID","row_id":"SPITEFUL_POWER_TRIP","column":"Short_Description","value":"vs units with no T7+ models [+1 TO HIT] [+1 TO HIT]"},{"file":"data/orks/Abilities.csv","id_column":"Ability_ID","row_id":"DA_JUMP","column":"Short_Description","value":"Psychic\u003A on 2+ place in Strategic Reserves and gain Deep Strike. [DEEP STRIKE]"},{"file":"data/orks/Abilities.csv","id_column":"Ability_ID","row_id":"DEFF_FROM_THE_SHADOWS","column":"Short_Description","value":"From battle round 1 onwards, Ingress from SR at end of opponent Movement. [INGRESS]"},{"file":"data/orks/Abilities.csv","id_column":"Ability_ID","row_id":"BOSS_AMMO_RUNT","column":"Short_Description","value":"Once per battle — RANGE [+1 TO HIT]"},{"file":"data/orks/Abilities.csv","id_column":"Ability_ID","row_id":"KEEP_HUNTIN","column":"Short_Description","value":"Once per Battle Round\u003A  BEAST SNAGGAS 6\" are un-shock and RILED UP. [KEEP HUNTIN\u0027]"},{"file":"data/orks/Abilities.csv","id_column":"Ability_ID","row_id":"DODGE_DIS","column":"Short_Description","value":"UNIT +1 To Hit MELEE and SHOOTING [+1 TO HIT] [+1 TO HIT]"},{"file":"data/orks/Abilities.csv","id_column":"Ability_ID","row_id":"BEAST_SNAGGA_FOLLOWING","column":"Short_Description","value":"Within 3\" of friendly BEAST SNAGGA (excluding MONSTER CHARACTER) [LONE OP 3\"]"},{"file":"data/orks/Abilities.csv","id_column":"Ability_ID","row_id":"BOSS_OF_DA_HUNT","column":"Short_Description","value":"Within 3\" of friendly BEAST SNAGGA (excluding MONSTER CHARACTER) [LONE OP 3\"]"},{"file":"data/orks/Abilities.csv","id_column":"Ability_ID","row_id":"LONE_OPERATIVE","column":"Short_Description","value":"CORE\u003A Lone Operative [LONE OPERATIVE]"},{"file":"data/orks/Abilities.csv","id_column":"Ability_ID","row_id":"SUPPORT_SHOKKA","column":"Short_Description","value":"Within 3\" of friendly ORKS INFANTRY (excluding other SAG) [LONE OP 3\"]"},{"file":"data/orks/Abilities.csv","id_column":"Ability_ID","row_id":"BLITZ_DEM_GITS","column":"Short_Description","value":"Blitzkannon vs non-MONSTER / VEHICLE [+6 A]"},{"file":"data/orks/Abilities.csv","id_column":"Ability_ID","row_id":"KUSTOM_DAKKA","column":"Short_Description","value":"ANYTIME — RANGE [IGNORES COVER]"},{"file":"data/orks/Abilities.csv","id_column":"Ability_ID","row_id":"CLEVER_KNOW_WOTZ","column":"Short_Description","value":"Buff a Vehicle within 3\"\u003A heal D3 and +1 to hit until next Movement. [+1 TO HIT] [+1 TO HIT]"}]' }}
        run: |
          python3 <<'PY'
          import csv, json, os, sys
          from pathlib import Path

          raw = os.environ.get('PATCHES') or ''
          if not raw.strip():
              print('no PATCHES input; skip apply')
              raise SystemExit(0)
          try:
              ops = json.loads(raw)
          except json.JSONDecodeError as e:
              sys.exit(f'patches is not JSON: {e}')
          if not isinstance(ops, list) or not ops:
              sys.exit('patches must be a non-empty JSON list')

          def decode(val):
              if val is None:
                  return ''
              s = str(val)
              return s.replace('\\n', '\n')

          def load_csv(path):
              if path.is_absolute() or '..' in path.parts:
                  sys.exit(f'bad path {path}')
              if not str(path).startswith('data/') or path.suffix.lower() != '.csv':
                  sys.exit(f'file must be a .csv under data/: {path}')
              if not path.is_file():
                  sys.exit(f'missing {path}')
              with path.open(encoding='utf-8', newline='') as f:
                  rows = list(csv.reader(f))
              if not rows:
                  sys.exit(f'empty csv {path}')
              return rows

          files = {}
          changed = set()

          for i, op in enumerate(ops):
              if not isinstance(op, dict):
                  sys.exit(f'op {i} is not an object')
              path = Path(str(op.get('file', '')).strip())
              if path not in files:
                  files[path] = load_csv(path)
              rows = files[path]
              header = rows[0]
              id_col = str(op.get('id_column') or '').strip() or header[0]
              if id_col not in header:
                  sys.exit(f'op {i}: id column not in header: {id_col}')
              i_id = header.index(id_col)
              row_id = str(op.get('row_id') or '').strip()
              if not row_id:
                  sys.exit(f'op {i}: row_id required')
              mode = str(op.get('mode') or 'update').strip()

              if mode == 'add_column':
                  col = str(op.get('column') or '').strip()
                  if not col:
                      sys.exit(f'op {i}: add_column needs column')
                  if col in header:
                      print(f'column already exists {path} {col}')
                      continue
                  after_col = str(op.get('after_column') or '').strip()
                  if after_col and after_col not in header:
                      sys.exit(f'op {i}: after column not in header: {after_col}')
                  insert_at = header.index(after_col) + 1 if after_col else len(header)
                  old_width = len(header)
                  header.insert(insert_at, col)
                  for row in rows[1:]:
                      while len(row) < old_width:
                          row.append('')
                      row.insert(insert_at, '')
                  changed.add(path)
                  print(f'added column {path} {col}')
                  continue

              if mode == 'remove_column':
                  col = str(op.get('column') or '').strip()
                  if not col:
                      sys.exit(f'op {i}: remove_column needs column')
                  if col not in header:
                      sys.exit(f'op {i}: column not in header: {col}')
                  remove_at = header.index(col)
                  header.pop(remove_at)
                  for row in rows[1:]:
                      if len(row) > remove_at:
                          row.pop(remove_at)
                  changed.add(path)
                  print(f'removed column {path} {col}')
                  continue

              if mode == 'dedupe_by_key':
                  key_col = str(op.get('key_column') or '').strip()
                  if key_col not in header:
                      sys.exit(f'op {i}: key column not in header: {key_col}')
                  i_key = header.index(key_col)
                  kept = [header]
                  seen = set()
                  matched = 0
                  removed = 0
                  for row in rows[1:]:
                      if not row:
                          continue
                      while len(row) < len(header):
                          row.append('')
                      if row[i_id] != row_id:
                          kept.append(row)
                          continue
                      matched += 1
                      key = row[i_key].strip()
                      if not key:
                          sys.exit(f'op {i}: blank {key_col} while deduping {row_id!r}')
                      if key in seen:
                          removed += 1
                          continue
                      seen.add(key)
                      kept.append(row)
                  if matched < 1:
                      sys.exit(f'op {i}: found no rows for {row_id!r}')
                  if removed < 1:
                      sys.exit(f'op {i}: found no duplicate rows for {row_id!r}')
                  files[path] = kept
                  changed.add(path)
                  print(f'deduped {path} {row_id}: kept {len(seen)} unique {key_col} values, removed {removed} duplicates')
                  continue

              if mode == 'fill_blank_where':
                  match_col = str(op.get('match_column') or '').strip()
                  col = str(op.get('column') or '').strip()
                  if match_col not in header:
                      sys.exit(f'op {i}: match column not in header: {match_col}')
                  if col not in header:
                      sys.exit(f'op {i}: column not in header: {col}')
                  match_value = decode(op.get('match_value')).strip()
                  new = decode(op.get('value'))
                  if not match_value:
                      sys.exit(f'op {i}: match_value required')
                  if new == '':
                      sys.exit(f'op {i}: value required')
                  i_match = header.index(match_col)
                  i_col = header.index(col)
                  hits = 0
                  for row in rows[1:]:
                      if not row:
                          continue
                      while len(row) < len(header):
                          row.append('')
                      if row[i_match].strip() == match_value and not row[i_col].strip():
                          row[i_col] = new
                          hits += 1
                  if hits < 1:
                      sys.exit(f'op {i}: found no blank {col} values where {match_col}={match_value!r}')
                  changed.add(path)
                  print(f'filled {hits} blank {col} values in {path} where {match_col}={match_value!r}')
                  continue

              if mode == 'replace_text':
                  col = str(op.get('column') or '').strip()
                  if col not in header:
                      sys.exit(f'op {i}: column not in header: {col}')
                  old = decode(op.get('from'))
                  new = decode(op.get('to'))
                  if not old:
                      sys.exit(f'op {i}: replace_text needs non-empty from')
                  i_col = header.index(col)
                  hits = 0
                  for row in rows[1:]:
                      if not row:
                          continue
                      while len(row) < len(header):
                          row.append('')
                      if old in row[i_col]:
                          row[i_col] = row[i_col].replace(old, new)
                          hits += 1
                  if hits < 1:
                      sys.exit(f'op {i}: replace_text found no matches for {old!r}')
                  changed.add(path)
                  print(f'replaced {old!r} in {hits} rows of {path} column {col}')
                  continue

              if mode == 'delete':
                  kept = [header]
                  hits = 0
                  for row in rows[1:]:
                      if not row:
                          continue
                      if len(row) > i_id and row[i_id] == row_id:
                          hits += 1
                          continue
                      kept.append(row)
                  if hits != 1:
                      sys.exit(f'op {i}: expected 1 row for {row_id!r}, found {hits}')
                  files[path] = kept
                  changed.add(path)
                  print(f'deleted {path} {row_id}')
                  continue

              if mode == 'insert':
                  existing = 0
                  for row in rows[1:]:
                      if row and len(row) > i_id and row[i_id] == row_id:
                          existing += 1
                  if existing:
                      sys.exit(f'op {i}: row already exists: {row_id}')
                  sets = op.get('sets')
                  if not isinstance(sets, dict) or not sets:
                      sys.exit(f'op {i}: insert needs sets')
                  new_row = [''] * len(header)
                  new_row[i_id] = row_id
                  for col, val in sets.items():
                      if col not in header:
                          sys.exit(f'op {i}: column not in header: {col}')
                      new_row[header.index(col)] = decode(val)
                  after = str(op.get('after_row_id') or '').strip()
                  if after:
                      placed = False
                      kept = [header]
                      for row in rows[1:]:
                          kept.append(row)
                          if row and len(row) > i_id and row[i_id] == after:
                              kept.append(new_row)
                              placed = True
                      if not placed:
                          sys.exit(f'op {i}: after_row_id not found: {after}')
                      files[path] = kept
                  else:
                      rows.append(new_row)
                      files[path] = rows
                  changed.add(path)
                  print(f'inserted {path} {row_id}')
                  continue

              if mode != 'update':
                  sys.exit(f'op {i}: unknown mode {mode}')

              sets = op.get('sets')
              if not isinstance(sets, dict) or not sets:
                  sets = {}
                  if op.get('column'):
                      sets[str(op['column'])] = op.get('value', '')
                  if op.get('column_2'):
                      sets[str(op['column_2'])] = op.get('value_2', '')
              if not sets:
                  sys.exit(f'op {i}: update needs sets or column/value')

              hits = 0
              for row in rows[1:]:
                  if not row:
                      continue
                  while len(row) < len(header):
                      row.append('')
                  if row[i_id] != row_id:
                      continue
                  for col, val in sets.items():
                      if col not in header:
                          sys.exit(f'op {i}: column not in header: {col}')
                      row[header.index(col)] = decode(val)
                  hits += 1
              if hits != 1:
                  sys.exit(f'op {i}: expected 1 row for {row_id!r}, found {hits}')
              changed.add(path)
              print(f'updated {path} {row_id} {list(sets)}')

          for path, rows in files.items():
              if path not in changed:
                  continue
              with path.open('w', newline='', encoding='utf-8') as f:
                  csv.writer(f, lineterminator='\n').writerows(rows)
          print('changed', ' '.join(str(p) for p in sorted(changed)))
          PY

      - name: Refresh manifests
        run: python3 scripts/data_schema.py manifest

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- data
          if git diff --cached --quiet; then
            echo "No change"
            exit 0
          fi
          git commit -m "Patch CSV line items"
          git push
