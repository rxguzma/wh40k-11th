name: Patch CSV

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-csv.yml'
  workflow_dispatch:
    inputs:
      patches:
        description: JSON list of operations. One run, one commit.
        required: true
        type: string

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply patches
        env:
          PATCHES: ${{ inputs.patches }}
        run: |
          python3 <<'PY'
          import csv, json, os, sys
          from pathlib import Path

          raw = os.environ.get('PATCHES', '').strip()
          if not raw:
              raw = r'[{"file":"data/orks/Units.csv","id_column":"Unit_ID","row_id":"BANNERNOB","sets":{"Ability_IDs":"WAAAGH_BANNER, SUPPORT_BANNERNOB","Core_Ability_IDs":""}},{"file":"data/orks/Units.csv","id_column":"Unit_ID","row_id":"BEASTBOSS","sets":{"Ability_IDs":"KEEP_HUNTIN, DODGE_DIS, LEADER_BEASTBOSS","Core_Ability_IDs":"FEEL_NO_PAIN_6"}},{"file":"data/orks/Units.csv","id_column":"Unit_ID","row_id":"BIG_MEK","sets":{"Ability_IDs":"MORE_DAKKA, SHOKK_BOOSTA, COMPOSITION_BIG_MEK, LEADER_BIG_MEK","Core_Ability_IDs":""}},{"file":"data/orks/Units.csv","id_column":"Unit_ID","row_id":"BIG_MEK_WITH_SHOKK_ATTACK_GUN","sets":{"Ability_IDs":"MORE_DAKKA, SUPPORT_SHOKKA, LEADER_BIG_MEK_WITH_SHOKK_ATTACK_GUN","Core_Ability_IDs":""}},{"file":"data/orks/Units.csv","id_column":"Unit_ID","row_id":"BIGBOSS","sets":{"Ability_IDs":"SOMETHIN_TO_PROVE, SUPPORT_BIGBOSS","Core_Ability_IDs":""}},{"file":"data/orks/Units.csv","id_column":"Unit_ID","row_id":"BOSS_SNIKROT","sets":{"Ability_IDs":"KUNNIN_INFILTRATOR, DEFF_FROM_THE_SHADOWS, LEADER_BOSS_SNIKROT","Core_Ability_IDs":"INFILTRATORS, LONE_OPERATIVE, STEALTH"}},{"file":"data/orks/Units.csv","id_column":"Unit_ID","row_id":"DEFFKILLA_WARTRIKE","sets":{"Ability_IDs":"GET_BACK_IN_DA_RACE, FUEL_MIXA_GROB, LEADER_DEFFKILLA_WARTRIKE","Core_Ability_IDs":"DEADLY_DEMISE_1"}},{"file":"data/orks/Units.csv","id_column":"Unit_ID","row_id":"MEK","sets":{"Ability_IDs":"KUSTOM_DAKKA, CLEVER_KNOW_WOTZ, SUPPORT_MEK","Core_Ability_IDs":""}},{"file":"data/orks/Units.csv","id_column":"Unit_ID","row_id":"PAINBOY","sets":{"Ability_IDs":"CRUDE_SURGERY, CANT_CUT_DAT_BIT, SUPPORT_PAINBOY","Core_Ability_IDs":""}},{"file":"data/orks/Units.csv","id_column":"Unit_ID","row_id":"WARBOSS","sets":{"Ability_IDs":"BOSS_AMMO_RUNT, MIGHT_IS_RIGHT, INTIMIDATING_MOTIVATION, COMPOSITION_WARBOSS, LEADER_WARBOSS","Core_Ability_IDs":""}},{"file":"data/orks/Units.csv","id_column":"Unit_ID","row_id":"WEIRDBOY","sets":{"Ability_IDs":"DA_JUMP, SUPPORT_WEIRDBOY","Core_Ability_IDs":"DEADLY_DEMISE_D3, UNSTABLE_ENERGIES"}},{"file":"data/orks/Units.csv","id_column":"Unit_ID","row_id":"ZODGROD_WORTSNAGGA","sets":{"Ability_IDs":"SUPER_RUNTS, LEADER_ZODGROD_WORTSNAGGA","Core_Ability_IDs":""}},{"file":"data/orks/Units.csv","id_column":"Unit_ID","row_id":"NAZDREG","sets":{"Ability_IDs":"INTIMIDATING_MOTIVATION, NAZDREGS_KNOW_WOTZ, SUPREME_KUNNIN, LEADER_NAZDREG","Core_Ability_IDs":"DEEP_STRIKE"}},{"file":"data/orks/Units.csv","id_column":"Unit_ID","row_id":"BIG_MEK_MEGA_ARMOUR","sets":{"Ability_IDs":"FIX_DAT_ARMOUR, MORE_DAKKA, KUSTOM_FORCE_FIELD, COMPOSITION_BIG_MEK_MA, LEADER_BIG_MEK_IN_MEGA_ARMOUR","Core_Ability_IDs":""}},{"file":"data/orks/Units.csv","id_column":"Unit_ID","row_id":"RUNTHERD","sets":{"Ability_IDs":"THEYLL_LEARN_YA, SUPPORT_RUNTHERD","Core_Ability_IDs":""}},{"file":"data/orks/Units.csv","id_column":"Unit_ID","row_id":"PAINBOSS","sets":{"Ability_IDs":"PUSH_DAT_BIT_BACK, HARDY_BILIOUS, RIDIN_WIV_DA_HERD, SUPPORT_PAINBOSS","Core_Ability_IDs":""}},{"file":"data/orks/Units.csv","id_column":"Unit_ID","row_id":"WARBOSS_MEGA_ARMOUR","sets":{"Ability_IDs":"KNUCKLE_IMPETUS, INTIMIDATING_MOTIVATION, LEADER_WARBOSS_IN_MEGA_ARMOUR","Core_Ability_IDs":""}}]'
          try:
              ops = json.loads(raw)
          except json.JSONDecodeError as e:
              sys.exit(f'patches is not JSON: {e}')
          if not isinstance(ops, list) or not ops:
              sys.exit('patches must be a non-empty JSON list')

          def decode(val):
              if val is None:
                  return ''
              s = str(val)
              return s.replace('\\n', '\n')

          def load_csv(path):
              if path.is_absolute() or '..' in path.parts:
                  sys.exit(f'bad path {path}')
              if not str(path).startswith('data/') or path.suffix.lower() != '.csv':
                  sys.exit(f'file must be a .csv under data/: {path}')
              if not path.is_file():
                  sys.exit(f'missing {path}')
              with path.open(encoding='utf-8', newline='') as f:
                  rows = list(csv.reader(f))
              if not rows:
                  sys.exit(f'empty csv {path}')
              return rows

          files = {}
          changed = set()

          for i, op in enumerate(ops):
              if not isinstance(op, dict):
                  sys.exit(f'op {i} is not an object')
              path = Path(str(op.get('file', '')).strip())
              if path not in files:
                  files[path] = load_csv(path)
              rows = files[path]
              header = rows[0]
              id_col = str(op.get('id_column') or '').strip() or header[0]
              if id_col not in header:
                  sys.exit(f'op {i}: id column not in header: {id_col}')
              i_id = header.index(id_col)
              row_id = str(op.get('row_id') or '').strip()
              if not row_id:
                  sys.exit(f'op {i}: row_id required')
              mode = str(op.get('mode') or 'update').strip()

              if mode == 'fill_blank_where':
                  match_col = str(op.get('match_column') or '').strip()
                  col = str(op.get('column') or '').strip()
                  if match_col not in header:
                      sys.exit(f'op {i}: match column not in header: {match_col}')
                  if col not in header:
                      sys.exit(f'op {i}: column not in header: {col}')
                  match_value = decode(op.get('match_value')).strip()
                  new = decode(op.get('value'))
                  if not match_value:
                      sys.exit(f'op {i}: match_value required')
                  if new == '':
                      sys.exit(f'op {i}: value required')
                  i_match = header.index(match_col)
                  i_col = header.index(col)
                  hits = 0
                  for row in rows[1:]:
                      if not row:
                          continue
                      while len(row) < len(header):
                          row.append('')
                      if row[i_match].strip() == match_value and not row[i_col].strip():
                          row[i_col] = new
                          hits += 1
                  if hits < 1:
                      sys.exit(f'op {i}: found no blank {col} values where {match_col}={match_value!r}')
                  changed.add(path)
                  print(f'filled {hits} blank {col} values in {path} where {match_col}={match_value!r}')
                  continue

              if mode == 'replace_text':
                  col = str(op.get('column') or '').strip()
                  if col not in header:
                      sys.exit(f'op {i}: column not in header: {col}')
                  old = decode(op.get('from'))
                  new = decode(op.get('to'))
                  if not old:
                      sys.exit(f'op {i}: replace_text needs non-empty from')
                  i_col = header.index(col)
                  hits = 0
                  for row in rows[1:]:
                      if not row:
                          continue
                      while len(row) < len(header):
                          row.append('')
                      if old in row[i_col]:
                          row[i_col] = row[i_col].replace(old, new)
                          hits += 1
                  if hits < 1:
                      sys.exit(f'op {i}: replace_text found no matches for {old!r}')
                  changed.add(path)
                  print(f'replaced {old!r} in {hits} rows of {path} column {col}')
                  continue

              if mode == 'delete':
                  kept = [header]
                  hits = 0
                  for row in rows[1:]:
                      if not row:
                          continue
                      if len(row) > i_id and row[i_id] == row_id:
                          hits += 1
                          continue
                      kept.append(row)
                  if hits != 1:
                      sys.exit(f'op {i}: expected 1 row for {row_id!r}, found {hits}')
                  files[path] = kept
                  changed.add(path)
                  print(f'deleted {path} {row_id}')
                  continue

              if mode == 'insert':
                  existing = 0
                  for row in rows[1:]:
                      if row and len(row) > i_id and row[i_id] == row_id:
                          existing += 1
                  if existing:
                      sys.exit(f'op {i}: row already exists: {row_id}')
                  sets = op.get('sets')
                  if not isinstance(sets, dict) or not sets:
                      sys.exit(f'op {i}: insert needs sets')
                  new_row = [''] * len(header)
                  new_row[i_id] = row_id
                  for col, val in sets.items():
                      if col not in header:
                          sys.exit(f'op {i}: column not in header: {col}')
                      new_row[header.index(col)] = decode(val)
                  after = str(op.get('after_row_id') or '').strip()
                  if after:
                      placed = False
                      kept = [header]
                      for row in rows[1:]:
                          kept.append(row)
                          if row and len(row) > i_id and row[i_id] == after:
                              kept.append(new_row)
                              placed = True
                      if not placed:
                          sys.exit(f'op {i}: after_row_id not found: {after}')
                      files[path] = kept
                  else:
                      rows.append(new_row)
                      files[path] = rows
                  changed.add(path)
                  print(f'inserted {path} {row_id}')
                  continue

              if mode != 'update':
                  sys.exit(f'op {i}: unknown mode {mode}')

              sets = op.get('sets')
              if not isinstance(sets, dict) or not sets:
                  sets = {}
                  if op.get('column'):
                      sets[str(op['column'])] = op.get('value', '')
                  if op.get('column_2'):
                      sets[str(op['column_2'])] = op.get('value_2', '')
              if not sets:
                  sys.exit(f'op {i}: update needs sets or column/value')

              hits = 0
              for row in rows[1:]:
                  if not row:
                      continue
                  while len(row) < len(header):
                      row.append('')
                  if row[i_id] != row_id:
                      continue
                  for col, val in sets.items():
                      if col not in header:
                          sys.exit(f'op {i}: column not in header: {col}')
                      row[header.index(col)] = decode(val)
                  hits += 1
              if hits != 1:
                  sys.exit(f'op {i}: expected 1 row for {row_id!r}, found {hits}')
              changed.add(path)
              print(f'updated {path} {row_id} {list(sets)}')

          for path, rows in files.items():
              if path not in changed:
                  continue
              with path.open('w', newline='', encoding='utf-8') as f:
                  csv.writer(f, lineterminator='\n').writerows(rows)
          print('changed', ' '.join(str(p) for p in sorted(changed)))
          PY

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- data
          if git diff --cached --quiet; then
            echo "No change"
            exit 0
          fi
          git commit -m "Patch CSV line items"
          git push
