name: Patch CSV

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-csv.yml'
  workflow_dispatch:
    inputs:
      patches:
        description: JSON list of operations. One run, one commit.
        required: true
        type: string

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply patches
        env:
          PATCHES: ${{ inputs.patches || '[{"file":"data/nids/Abilities.csv","id_column":"Ability_ID","row_id":"ADAPTABLE_PREDATORS","column":"Short_Description","value":"Fall back, Shoot and Charge [FALL BACK AND SHOOT] [FALL BACK AND CHARGE]"},{"file":"data/nids/Abilities.csv","id_column":"Ability_ID","row_id":"ADAPTIVE_INSTINCTS","column":"Short_Description","value":"MELEE. Once per turn. \\nWhen Targetted or selected to Fight (pick one)\u003A \\n- +1 S melee\\n- +1 T [+1 S] [+1 T]"},{"file":"data/nids/Abilities.csv","id_column":"Ability_ID","row_id":"ALPHA_INVADER","column":"Short_Description","value":"SUSTAIN HITS 1 [SUSTAINED HITS 1] [SUSTAINED HITS 1]"},{"file":"data/nids/Abilities.csv","id_column":"Ability_ID","row_id":"ALPHA_LEADER","column":"Short_Description","value":"Leading = Unit re-rolls the Hit roll. [RE-ROLL ALL HITS] [RE-ROLL ALL HITS]"},{"file":"data/nids/Abilities.csv","id_column":"Ability_ID","row_id":"ALPHA_WARRIOR","column":"Short_Description","value":"Unit gains SUSTAINED HITS 1 ability. [SUSTAINED HITS 1] [SUSTAINED HITS 1]"},{"file":"data/nids/Abilities.csv","id_column":"Ability_ID","row_id":"BIO_STIMULUS","column":"Short_Description","value":"Shoot an enemy, then, in MELEE, \\nALL Tyranids have extra -1 AP [+1 AP]"},{"file":"data/nids/Abilities.csv","id_column":"Ability_ID","row_id":"BOUNDING_LEAP","column":"Short_Description","value":"Advance and Charge. [ADVANCE AND CHARGE]"},{"file":"data/nids/Abilities.csv","id_column":"Ability_ID","row_id":"BROOD_PROGENITOR_AURA_AND_PSYCHIC","column":"Short_Description","value":"Termagant 6\" RANGED have LETHAL HITS [LETHAL HITS]"},{"file":"data/nids/Abilities.csv","id_column":"Ability_ID","row_id":"BURNING_SPRAY","column":"Short_Description","value":"Hit enemy loses Benefit of Cover this Shooting phase. [IGNORES COVER]"},{"file":"data/nids/Abilities.csv","id_column":"Ability_ID","row_id":"DEATH_FROM_BELOW","column":"Short_Description","value":"At the end of enemy turn, if not within Engagement, remove from battlefield and place into Strategic Reserves. [STRATEGIC RESERVES]"},{"file":"data/nids/Abilities.csv","id_column":"Ability_ID","row_id":"DEFENSIVE_STANCE","column":"Short_Description","value":"Overwatch on 5+ or 4+ if on objective. [OVERWATCH]"},{"file":"data/nids/Abilities.csv","id_column":"Ability_ID","row_id":"ENCEPHALIC_DIFFUSION_AURA_AND_PSYCHIC","column":"Short_Description","value":"Enemy 6\"\u003A -1 to Hit. If Below Half-strength, -1 to Wound. [ENEMY -1 TO HIT]"},{"file":"data/nids/Abilities.csv","id_column":"Ability_ID","row_id":"FEEDER_TENDRILS","column":"Short_Description","value":"When this model destroys a Character, you gain 1CP. [GAIN 1 CP]"},{"file":"data/nids/Abilities.csv","id_column":"Ability_ID","row_id":"FEEDING_FRENZY","column":"Short_Description","value":"Each Melee vs a unit below its Starting Strength, add +1 To Hit.\\n\\nIf target is also Below Half-strength, add +1 To Wound. [+1 TO HIT] [+1 TO WOUND]"},{"file":"data/nids/Abilities.csv","id_column":"Ability_ID","row_id":"GUARDIAN_ORGANISM","column":"Short_Description","value":"If led by CHARACTER, while alive, they grant 5+ FNP to character. [FNP 5+]"},{"file":"data/nids/Abilities.csv","id_column":"Ability_ID","row_id":"HIVE_COMMANDER","column":"Short_Description","value":"At start of Command Phase, \\ngain 1 CP. [GAIN 1 CP]"},{"file":"data/nids/Abilities.csv","id_column":"Ability_ID","row_id":"HYPERSENSORY_ARRAY","column":"Short_Description","value":"Free Rapid Ingress and Free Heroic Intervention even if already used the stratagem [INGRESS] [HEROIC INTERVENTION 0CP]"},{"file":"data/nids/Abilities.csv","id_column":"Ability_ID","row_id":"HYPNOTIC_GAZE_PSYCHIC","column":"Short_Description","value":"Fight phase, select enemy within Engagement Range\u003A -1 To Hit. [ENEMY -1 TO HIT]"},{"file":"data/nids/Abilities.csv","id_column":"Ability_ID","row_id":"NODE_LASH_PSYCHIC","column":"Short_Description","value":"Leading = +1 To Hit.\\nTarget Battle-shocked = +1 To Wound. [+1 TO HIT] [+1 TO HIT] [+1 TO WOUND] [+1 TO WOUND]"},{"file":"data/nids/Abilities.csv","id_column":"Ability_ID","row_id":"ONSLAUGHT_AURA_PSYCHIC","column":"Short_Description","value":"Friendly 6\"\u003A ranged weapons have ASSAULT and LETHAL HITS. [ASSAULT] [LETHAL HITS]"},{"file":"data/nids/Abilities.csv","id_column":"Ability_ID","row_id":"PHEROMONE_TRAIL","column":"Short_Description","value":"Once per battle round, Rapid Ingress Stratagem for 0CP. [INGRESS]"},{"file":"data/nids/Abilities.csv","id_column":"Ability_ID","row_id":"POUNCING_LEAP","column":"Short_Description","value":"Heroic Intervention any number of times this phase. That use is -1 CP. [HEROIC INTERVENTION 0CP]"},{"file":"data/nids/Abilities.csv","id_column":"Ability_ID","row_id":"PSYCHOLOGICAL_SABOTEUR_AURA","column":"Short_Description","value":"If Battleshock\u003A -1 from Hit rolls, +1 To Wound them [ENEMY -1 TO HIT] [+1 TO WOUND] [+1 TO WOUND]"},{"file":"data/nids/Abilities.csv","id_column":"Ability_ID","row_id":"SINGULAR_PURPOSE","column":"Short_Description","value":"Pick an objective; OC 15 & FNP 5+\\n\\nPick an enemy\u003A Re-roll Hit / Wound [FNP 5+]"},{"file":"data/nids/Abilities.csv","id_column":"Ability_ID","row_id":"SUBTERRANEAN_HUNTER","column":"Short_Description","value":"End of ANY Fight phase\\nIf not Engaged, go to Reserves [STRATEGIC RESERVES]"},{"file":"data/nids/Abilities.csv","id_column":"Ability_ID","row_id":"SUBTERRANEAN_TUNNELS","column":"Short_Description","value":"Deep Strike more than 6\". Cannot charge this turn. [DEEP STRIKE]"},{"file":"data/nids/Abilities.csv","id_column":"Ability_ID","row_id":"SYMBIOTIC_TARGETING","column":"Short_Description","value":"After this model shoots, friendly Tyranids re-roll Hit 1s vs that enemy. [RE-ROLL 1S TO HIT]"},{"file":"data/nids/Abilities.csv","id_column":"Ability_ID","row_id":"TERROR_FROM_THE_DEEP","column":"Short_Description","value":"Deep Strike\u003A each enemy 12\" takes D3 MW (2-4) or 3 MW + Battle-shock (5+). [DEEP STRIKE]"},{"file":"data/nids/Abilities.csv","id_column":"Ability_ID","row_id":"UNNATURAL_RESILIENCE","column":"Short_Description","value":"FNP 4+ vs mortal wounds. [FNP 4+]"},{"file":"data/nids/Abilities.csv","id_column":"Ability_ID","row_id":"VANGUARD_PREDATOR","column":"Short_Description","value":"Re-roll To Hit of 1.\\nTarget on obj, re-roll To Wound of 1 [RE-ROLL 1S TO HIT] [RE-ROLL 1S TO HIT] [RE-ROLL 1S TO WOUND] [RE-ROLL 1S TO WOUND]"},{"file":"data/nids/Abilities.csv","id_column":"Ability_ID","row_id":"VICIOUS_INSIGHT","column":"Short_Description","value":"Leading. Unit has DEVASTATING WOUNDS. [DEVASTATING WOUNDS] [DEVASTATING WOUNDS]"},{"file":"data/nids/Abilities.csv","id_column":"Ability_ID","row_id":"WARP_FIELD_AURA_AND_PSYCHIC","column":"Short_Description","value":"Friendly 6\" have 6++ [INVULNERABLE SAVE 6+]"},{"file":"data/nids/Abilities.csv","id_column":"Ability_ID","row_id":"FOUL_SPORES_AURA","column":"Short_Description","value":"Friendly TYRANIDS within 6\" have Stealth. [STEALTH]"},{"file":"data/nids/Abilities.csv","id_column":"Ability_ID","row_id":"TYRANNOFEX_ACID_SPRAY_POINTS","column":"Short_Description","value":"+10 Pts [+10 Pts]"},{"file":"data/nids/Abilities.csv","id_column":"Ability_ID","row_id":"TYRANNOFEX_RUPTURE_CANNON_POINTS","column":"Short_Description","value":"+20 Pts [+20 Pts]"},{"file":"data/nids/Abilities.csv","id_column":"Ability_ID","row_id":"ALPHA_WARRIOR_TYRANID_PRIME_WITH_LASH_WHIP","column":"Short_Description","value":"UNIT all weapons\u003A SUSTAIN 1 [SUSTAINED HITS 1] [SUSTAINED HITS 1]"},{"file":"data/nids/Army_Rules.csv","id_column":"Army_Rule_ID","row_id":"tyranids_army_rule","column":"Short_Description","value":"- 6\" of SYNAPSE.\\n- Battle-shock on 3D6.\\n- Melee +1 S [+1 S]"},{"file":"data/nids/Detachment_Definitions.csv","id_column":"Rule_ID","row_id":"tyranids_ambush_predators_detachment_rule_mindhunger","column":"Short_Description","value":"DEATHLEAPER / LICTOR / NEUROLICTOR have Deep Strike. \\n\\nLICTOR / NEUROLICTOR re-roll hit rolls of 1 vs CHARACTER units. [DEEP STRIKE] [RE-ROLL 1S TO HIT] [RE-ROLL 1S TO HIT]"},{"file":"data/nids/Detachment_Definitions.csv","id_column":"Rule_ID","row_id":"tyranids_subterranean_assault_detachment_rule_detachment_rule","column":"Short_Description","value":"SURPRISE ASSAULT\u003A\\n- Re-rolls 1 To Hit\\n- BURROWERS allow 6\" Charge [RE-ROLL 1S TO HIT] [RE-ROLL 1S TO HIT]"},{"file":"data/nids/Detachment_Definitions.csv","id_column":"Rule_ID","row_id":"tyranids_vanguard_onslaught_detachment_rule_detachment_rule","column":"Short_Description","value":"VANGUARD INVADERS\\n- Advance and Charge.\\nALL UNITS\u003A Fall back and Charge\\n\\nDeathleaper can be Warlord [ADVANCE AND CHARGE] [FALL BACK AND CHARGE]"}]' }}
        run: |
          python3 <<'PY'
          import csv, json, os, sys
          from pathlib import Path

          raw = os.environ.get('PATCHES') or ''
          if not raw.strip():
              print('no PATCHES input; skip apply')
              raise SystemExit(0)
          try:
              ops = json.loads(raw)
          except json.JSONDecodeError as e:
              sys.exit(f'patches is not JSON: {e}')
          if not isinstance(ops, list) or not ops:
              sys.exit('patches must be a non-empty JSON list')

          def decode(val):
              if val is None:
                  return ''
              s = str(val)
              return s.replace('\\n', '\n')

          def load_csv(path):
              if path.is_absolute() or '..' in path.parts:
                  sys.exit(f'bad path {path}')
              if not str(path).startswith('data/') or path.suffix.lower() != '.csv':
                  sys.exit(f'file must be a .csv under data/: {path}')
              if not path.is_file():
                  sys.exit(f'missing {path}')
              with path.open(encoding='utf-8', newline='') as f:
                  rows = list(csv.reader(f))
              if not rows:
                  sys.exit(f'empty csv {path}')
              return rows

          files = {}
          changed = set()

          for i, op in enumerate(ops):
              if not isinstance(op, dict):
                  sys.exit(f'op {i} is not an object')
              path = Path(str(op.get('file', '')).strip())
              if path not in files:
                  files[path] = load_csv(path)
              rows = files[path]
              header = rows[0]
              id_col = str(op.get('id_column') or '').strip() or header[0]
              if id_col not in header:
                  sys.exit(f'op {i}: id column not in header: {id_col}')
              i_id = header.index(id_col)
              row_id = str(op.get('row_id') or '').strip()
              if not row_id:
                  sys.exit(f'op {i}: row_id required')
              mode = str(op.get('mode') or 'update').strip()

              if mode == 'add_column':
                  col = str(op.get('column') or '').strip()
                  if not col:
                      sys.exit(f'op {i}: add_column needs column')
                  if col in header:
                      print(f'column already exists {path} {col}')
                      continue
                  after_col = str(op.get('after_column') or '').strip()
                  if after_col and after_col not in header:
                      sys.exit(f'op {i}: after column not in header: {after_col}')
                  insert_at = header.index(after_col) + 1 if after_col else len(header)
                  old_width = len(header)
                  header.insert(insert_at, col)
                  for row in rows[1:]:
                      while len(row) < old_width:
                          row.append('')
                      row.insert(insert_at, '')
                  changed.add(path)
                  print(f'added column {path} {col}')
                  continue

              if mode == 'remove_column':
                  col = str(op.get('column') or '').strip()
                  if not col:
                      sys.exit(f'op {i}: remove_column needs column')
                  if col not in header:
                      sys.exit(f'op {i}: column not in header: {col}')
                  remove_at = header.index(col)
                  header.pop(remove_at)
                  for row in rows[1:]:
                      if len(row) > remove_at:
                          row.pop(remove_at)
                  changed.add(path)
                  print(f'removed column {path} {col}')
                  continue

              if mode == 'dedupe_by_key':
                  key_col = str(op.get('key_column') or '').strip()
                  if key_col not in header:
                      sys.exit(f'op {i}: key column not in header: {key_col}')
                  i_key = header.index(key_col)
                  kept = [header]
                  seen = set()
                  matched = 0
                  removed = 0
                  for row in rows[1:]:
                      if not row:
                          continue
                      while len(row) < len(header):
                          row.append('')
                      if row[i_id] != row_id:
                          kept.append(row)
                          continue
                      matched += 1
                      key = row[i_key].strip()
                      if not key:
                          sys.exit(f'op {i}: blank {key_col} while deduping {row_id!r}')
                      if key in seen:
                          removed += 1
                          continue
                      seen.add(key)
                      kept.append(row)
                  if matched < 1:
                      sys.exit(f'op {i}: found no rows for {row_id!r}')
                  if removed < 1:
                      sys.exit(f'op {i}: found no duplicate rows for {row_id!r}')
                  files[path] = kept
                  changed.add(path)
                  print(f'deduped {path} {row_id}: kept {len(seen)} unique {key_col} values, removed {removed} duplicates')
                  continue

              if mode == 'fill_blank_where':
                  match_col = str(op.get('match_column') or '').strip()
                  col = str(op.get('column') or '').strip()
                  if match_col not in header:
                      sys.exit(f'op {i}: match column not in header: {match_col}')
                  if col not in header:
                      sys.exit(f'op {i}: column not in header: {col}')
                  match_value = decode(op.get('match_value')).strip()
                  new = decode(op.get('value'))
                  if not match_value:
                      sys.exit(f'op {i}: match_value required')
                  if new == '':
                      sys.exit(f'op {i}: value required')
                  i_match = header.index(match_col)
                  i_col = header.index(col)
                  hits = 0
                  for row in rows[1:]:
                      if not row:
                          continue
                      while len(row) < len(header):
                          row.append('')
                      if row[i_match].strip() == match_value and not row[i_col].strip():
                          row[i_col] = new
                          hits += 1
                  if hits < 1:
                      sys.exit(f'op {i}: found no blank {col} values where {match_col}={match_value!r}')
                  changed.add(path)
                  print(f'filled {hits} blank {col} values in {path} where {match_col}={match_value!r}')
                  continue

              if mode == 'replace_text':
                  col = str(op.get('column') or '').strip()
                  if col not in header:
                      sys.exit(f'op {i}: column not in header: {col}')
                  old = decode(op.get('from'))
                  new = decode(op.get('to'))
                  if not old:
                      sys.exit(f'op {i}: replace_text needs non-empty from')
                  i_col = header.index(col)
                  hits = 0
                  for row in rows[1:]:
                      if not row:
                          continue
                      while len(row) < len(header):
                          row.append('')
                      if old in row[i_col]:
                          row[i_col] = row[i_col].replace(old, new)
                          hits += 1
                  if hits < 1:
                      sys.exit(f'op {i}: replace_text found no matches for {old!r}')
                  changed.add(path)
                  print(f'replaced {old!r} in {hits} rows of {path} column {col}')
                  continue

              if mode == 'delete':
                  kept = [header]
                  hits = 0
                  for row in rows[1:]:
                      if not row:
                          continue
                      if len(row) > i_id and row[i_id] == row_id:
                          hits += 1
                          continue
                      kept.append(row)
                  if hits != 1:
                      sys.exit(f'op {i}: expected 1 row for {row_id!r}, found {hits}')
                  files[path] = kept
                  changed.add(path)
                  print(f'deleted {path} {row_id}')
                  continue

              if mode == 'insert':
                  existing = 0
                  for row in rows[1:]:
                      if row and len(row) > i_id and row[i_id] == row_id:
                          existing += 1
                  if existing:
                      sys.exit(f'op {i}: row already exists: {row_id}')
                  sets = op.get('sets')
                  if not isinstance(sets, dict) or not sets:
                      sys.exit(f'op {i}: insert needs sets')
                  new_row = [''] * len(header)
                  new_row[i_id] = row_id
                  for col, val in sets.items():
                      if col not in header:
                          sys.exit(f'op {i}: column not in header: {col}')
                      new_row[header.index(col)] = decode(val)
                  after = str(op.get('after_row_id') or '').strip()
                  if after:
                      placed = False
                      kept = [header]
                      for row in rows[1:]:
                          kept.append(row)
                          if row and len(row) > i_id and row[i_id] == after:
                              kept.append(new_row)
                              placed = True
                      if not placed:
                          sys.exit(f'op {i}: after_row_id not found: {after}')
                      files[path] = kept
                  else:
                      rows.append(new_row)
                      files[path] = rows
                  changed.add(path)
                  print(f'inserted {path} {row_id}')
                  continue

              if mode != 'update':
                  sys.exit(f'op {i}: unknown mode {mode}')

              sets = op.get('sets')
              if not isinstance(sets, dict) or not sets:
                  sets = {}
                  if op.get('column'):
                      sets[str(op['column'])] = op.get('value', '')
                  if op.get('column_2'):
                      sets[str(op['column_2'])] = op.get('value_2', '')
              if not sets:
                  sys.exit(f'op {i}: update needs sets or column/value')

              hits = 0
              for row in rows[1:]:
                  if not row:
                      continue
                  while len(row) < len(header):
                      row.append('')
                  if row[i_id] != row_id:
                      continue
                  for col, val in sets.items():
                      if col not in header:
                          sys.exit(f'op {i}: column not in header: {col}')
                      row[header.index(col)] = decode(val)
                  hits += 1
              if hits != 1:
                  sys.exit(f'op {i}: expected 1 row for {row_id!r}, found {hits}')
              changed.add(path)
              print(f'updated {path} {row_id} {list(sets)}')

          for path, rows in files.items():
              if path not in changed:
                  continue
              with path.open('w', newline='', encoding='utf-8') as f:
                  csv.writer(f, lineterminator='\n').writerows(rows)
          print('changed', ' '.join(str(p) for p in sorted(changed)))
          PY

      - name: Refresh manifests
        run: python3 scripts/data_schema.py manifest

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- data
          if git diff --cached --quiet; then
            echo "No change"
            exit 0
          fi
          git commit -m "Patch CSV line items"
          git push
