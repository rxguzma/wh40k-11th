name: Patch CSV

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-csv.yml'
  workflow_dispatch:
    inputs:
      patches:
        description: JSON list of operations. One run, one commit.
        required: true
        type: string

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply patches
        env:
          PATCHES: ${{ inputs.patches || '[{"file":"data/universal/Tag_Definitions.csv","id_column":"Tag_ID","row_id":"LANCE_GENERIC","mode":"insert","sets":{"Display_Tag":"LANCE","Title":"Lance","Category":"Melee - Weapon Rules","Affects":"Weapon","Description":"Applies the Lance weapon rule when routed by Ability control tags.","Editable":"TRUE","Effect_Type":"WEAPON_RULE","Target":"","Stat":"LANCE","Operation":"SET","Value":"1","Sort_Order":"955"}},{"file":"data/universal/Tag_Definitions.csv","id_column":"Tag_ID","row_id":"PLUS_6_R_GENERIC","mode":"insert","sets":{"Display_Tag":"+6 R”","Title":"+6 Range","Category":"Range - Weapon Stats","Affects":"Weapon","Description":"Adds 6 inches to weapon Range when routed by Ability control tags.","Editable":"TRUE","Effect_Type":"WEAPON_STAT","Target":"","Stat":"R","Operation":"ADD","Value":"6","Sort_Order":"956"}},{"file":"data/universal/Tag_Definitions.csv","id_column":"Tag_ID","row_id":"INFO_ENEMY_MINUS_1_BATTLESHOCK","mode":"insert","sets":{"Display_Tag":"ENEMY -1 BATTLE-SHOCK","Title":"Enemy -1 Battle-shock","Category":"Info Only","Affects":"Display only","Description":"An affected enemy suffers -1 to its Battle-shock roll as described by the source rule.","Editable":"TRUE","Effect_Type":"","Target":"","Stat":"","Operation":"","Value":"","Sort_Order":"957"}},{"file":"data/orks/Abilities.csv","id_column":"Ability_ID","row_id":"BRUTAL_IMPACT","mode":"update","sets":{"Tags":"[ACTIVE] [SHOOT] [MELEE] [WEAPONS] [+1 D]","Tag Categories":"[Melee - Weapon Stats]","Default_Active":"0"}},{"file":"data/orks/Abilities.csv","id_column":"Ability_ID","row_id":"NAZDREGS_KNOW_WOTZ","mode":"update","sets":{"Tags":"[SHOOT] [WEAPONS] [DEEP STRIKE] [IGNORES COVER]"}},{"file":"data/orks/Abilities.csv","id_column":"Ability_ID","row_id":"*","mode":"replace_text","column":"Tags","from":"[LONE OPERATIVE]","to":"[LONE OP]"},{"file":"data/nids/Abilities.csv","id_column":"Ability_ID","row_id":"ALPHA_INVADER","mode":"update","sets":{"Tags":"[SHOOT] [MELEE] [WEAPONS] [SUSTAINED HITS 1]","Tag Categories":"[Melee - Weapon Rules]"}},{"file":"data/nids/Abilities.csv","id_column":"Ability_ID","row_id":"ALPHA_LEADER","mode":"update","sets":{"Tags":"[UNIT] [SHOOT] [MELEE] [WEAPONS] [RE-ROLL ALL HITS]","Tag Categories":"[Melee - Combat Modifiers]"}},{"file":"data/nids/Abilities.csv","id_column":"Ability_ID","row_id":"ALPHA_WARRIOR","mode":"update","sets":{"Tags":"[UNIT] [SHOOT] [MELEE] [WEAPONS] [SUSTAINED HITS 1]","Tag Categories":"[Melee - Weapon Rules]"}},{"file":"data/nids/Abilities.csv","id_column":"Ability_ID","row_id":"DEFENSIVE_STANCE","mode":"update","sets":{"Tags":"[SHOOT] [WEAPONS] [OVERWATCH]","Tag Categories":"[Range - Weapon Rules]"}},{"file":"data/nids/Abilities.csv","id_column":"Ability_ID","row_id":"VICIOUS_INSIGHT","mode":"update","sets":{"Tags":"[UNIT] [SHOOT] [MELEE] [WEAPONS] [DEVASTATING WOUNDS]","Tag Categories":"[Melee - Weapon Rules]"}},{"file":"data/nids/Abilities.csv","id_column":"Ability_ID","row_id":"ALPHA_WARRIOR_TYRANID_PRIME_WITH_LASH_WHIP","mode":"update","sets":{"Tags":"[UNIT] [SHOOT] [MELEE] [WEAPONS] [SUSTAINED HITS 1]","Tag Categories":"[Melee - Weapon Rules]"}},{"file":"data/marines/Abilities.csv","id_column":"Ability_ID","row_id":"ASTARTES_BANNER","mode":"update","sets":{"Tags":"[STATS] [+1 OC]"}},{"file":"data/marines/Abilities.csv","id_column":"Ability_ID","row_id":"ASTARTES_BANNER_ANCIENT","mode":"update","sets":{"Tags":"[STATS] [+1 OC]"}},{"file":"data/marines/Abilities.csv","id_column":"Ability_ID","row_id":"ASTARTES_BANNER_CH","mode":"update","sets":{"Tags":"[STATS] [+1 OC]"}},{"file":"data/marines/Abilities.csv","id_column":"Ability_ID","row_id":"RELIC_BANNER","mode":"update","sets":{"Tags":"[STATS] [+1 OC]"}},{"file":"data/marines/Abilities.csv","id_column":"Ability_ID","row_id":"RELIC_SHIELD","mode":"update","sets":{"Tags":"[STATS] [+1 W]"}},{"file":"data/marines/Abilities.csv","id_column":"Ability_ID","row_id":"STORM_SHIELD_TERMINATORS","mode":"update","sets":{"Tags":"[STATS] [+1 W]"}},{"file":"data/marines/Abilities.csv","id_column":"Ability_ID","row_id":"ASSAULT_TERMINATORS_THUNDER_HAMMER_POINTS","mode":"update","sets":{"Tags":"[STATS] [+1 W]"}},{"file":"data/marines/Abilities.csv","id_column":"Ability_ID","row_id":"ANCIENT_TERMINATOR_STORM_SHIELD","mode":"update","sets":{"Tags":"[STATS] [+1 W]"}},{"file":"data/marines/Abilities.csv","id_column":"Ability_ID","row_id":"CAPTAIN_RELIC_SHIELD","mode":"update","sets":{"Tags":"[STATS] [+1 W]"}},{"file":"data/marines/Abilities.csv","id_column":"Ability_ID","row_id":"BALLISTUS_STRIKE","mode":"update","sets":{"Tags":"[ACTIVE] [SHOOT] [WEAPONS] [RE-ROLL ALL HITS]","Default_Active":"0"}},{"file":"data/marines/Abilities.csv","id_column":"Ability_ID","row_id":"DEATHWING","mode":"update","sets":{"Tags":"[ACTIVE] [SHOOT] [MELEE] [WEAPONS] [+1 TO HIT]","Tag Categories":"[Melee - Combat Modifiers]","Default_Active":"0"}},{"file":"data/marines/Abilities.csv","id_column":"Ability_ID","row_id":"DESTRUCTOR","mode":"update","sets":{"Tags":"[ACTIVE] [SHOOT] [WEAPONS] [+1 AP]","Default_Active":"0"}},{"file":"data/marines/Abilities.csv","id_column":"Ability_ID","row_id":"ENMITY_FOR_THE_UNWORTHY","mode":"update","sets":{"Tags":"[ACTIVE] [SHOOT] [MELEE] [WEAPONS] [+1 TO HIT]","Tag Categories":"[Melee - Combat Modifiers]","Default_Active":"0"}},{"file":"data/marines/Abilities.csv","id_column":"Ability_ID","row_id":"EXECUTIONER","mode":"update","sets":{"Tags":"[ACTIVE] [SHOOT] [MELEE] [WEAPONS] [+1 TO HIT]","Tag Categories":"[Melee - Combat Modifiers]","Default_Active":"0"}},{"file":"data/marines/Abilities.csv","id_column":"Ability_ID","row_id":"FINEST_HOUR","mode":"update","sets":{"Tags":"[ACTIVE] [MELEE] [WEAPONS] [+3 A] [DEVASTATING WOUNDS]","Default_Active":"0"}},{"file":"data/marines/Abilities.csv","id_column":"Ability_ID","row_id":"GRAND_MASTER_OF_THE_DEATHWING","mode":"update","sets":{"Tags":"[UNIT] [SHOOT] [MELEE] [WEAPONS] [PRECISION]","Tag Categories":"[Melee - Weapon Rules]"}},{"file":"data/marines/Abilities.csv","id_column":"Ability_ID","row_id":"HAILSTRIKE","mode":"update","sets":{"Tags":"[ACTIVE] [SHOOT] [WEAPONS] [+1 AP]","Default_Active":"0"}},{"file":"data/marines/Abilities.csv","id_column":"Ability_ID","row_id":"INDOMITOR_DOCTRINES","mode":"update","sets":{"Tags":"[ACTIVE] [MELEE] [WEAPONS] [+2 S]","Default_Active":"0"}},{"file":"data/marines/Abilities.csv","id_column":"Ability_ID","row_id":"MASTER_OF_THE_HUNT","mode":"update","sets":{"Tags":"[ACTIVE] [MELEE] [WEAPONS] [+1 AP]","Default_Active":"0"}},{"file":"data/marines/Abilities.csv","id_column":"Ability_ID","row_id":"SUPREME_GRAND_MASTER","mode":"update","sets":{"Tags":"[UNIT] [SHOOT] [MELEE] [WEAPONS] [SUSTAINED HITS 1]","Tag Categories":"[Melee - Weapon Rules]"}},{"file":"data/marines/Abilities.csv","id_column":"Ability_ID","row_id":"ANGELS_WRATH","mode":"update","sets":{"Tags":"[UNIT] [ACTIVE] [MELEE] [WEAPONS] [+1 S]","Default_Active":"0"}},{"file":"data/marines/Abilities.csv","id_column":"Ability_ID","row_id":"VICTRIX_HONOUR_GUARD_BANNER_OF_MACRAGGE","mode":"update","sets":{"Tags":"[ACTIVE] [MELEE] [WEAPONS] [+1 A] [+1 S]","Default_Active":"0"}},{"file":"data/marines/Abilities.csv","id_column":"Ability_ID","row_id":"KAIUS_KONORIUS_CALGARS_CHAMPION","mode":"update","sets":{"Tags":"[ACTIVE] [SHOOT] [MELEE] [WEAPONS] [RE-ROLL 1S TO HIT] [RE-ROLL 1S TO WOUND]","Tag Categories":"[Melee - Combat Modifiers] [Melee - Combat Modifiers]","Default_Active":"0"}},{"file":"data/marines/Abilities.csv","id_column":"Ability_ID","row_id":"THUNDEROUS_FORCE_PSYCHIC","mode":"update","sets":{"Short_Description":"SHOOTING psychic roll — on 1 battle-shocked; otherwise RANGE [+6 R”] this phase.","Tags":"[SHOOT] [WEAPONS] [ACTIVE] [+6 R”]","Tag Categories":"[Range - Weapon Stats]"}},{"file":"data/marines/Abilities.csv","id_column":"Ability_ID","row_id":"*","mode":"replace_text","column":"Tags","from":"[LONE OPERATIVE]","to":"[LONE OP]"},{"file":"data/marines/Abilities.csv","id_column":"Ability_ID","row_id":"*","mode":"replace_text","column":"Short_Description","from":"[LONE OPERATIVE]","to":"[LONE OP]"},{"file":"data/marines/Abilities.csv","id_column":"Ability_ID","row_id":"*","mode":"replace_text","column":"Tags","from":"[+1 CHARGE]","to":""}]' }}
        run: |
          python3 <<'PY'
          import csv, json, os, sys
          from pathlib import Path

          raw = os.environ.get('PATCHES') or ''
          if not raw.strip():
              print('no PATCHES input; skip apply')
              raise SystemExit(0)
          try:
              ops = json.loads(raw)
          except json.JSONDecodeError as e:
              sys.exit(f'patches is not JSON: {e}')
          if not isinstance(ops, list) or not ops:
              sys.exit('patches must be a non-empty JSON list')

          def decode(val):
              if val is None:
                  return ''
              s = str(val)
              return s.replace('\\n', '\n')

          def load_csv(path):
              if path.is_absolute() or '..' in path.parts:
                  sys.exit(f'bad path {path}')
              if not str(path).startswith('data/') or path.suffix.lower() != '.csv':
                  sys.exit(f'file must be a .csv under data/: {path}')
              if not path.is_file():
                  sys.exit(f'missing {path}')
              with path.open(encoding='utf-8', newline='') as f:
                  rows = list(csv.reader(f))
              if not rows:
                  sys.exit(f'empty csv {path}')
              return rows

          files = {}
          changed = set()

          for i, op in enumerate(ops):
              if not isinstance(op, dict):
                  sys.exit(f'op {i} is not an object')
              path = Path(str(op.get('file', '')).strip())
              if path not in files:
                  files[path] = load_csv(path)
              rows = files[path]
              header = rows[0]
              id_col = str(op.get('id_column') or '').strip() or header[0]
              if id_col not in header:
                  sys.exit(f'op {i}: id column not in header: {id_col}')
              i_id = header.index(id_col)
              row_id = str(op.get('row_id') or '').strip()
              if not row_id:
                  sys.exit(f'op {i}: row_id required')
              mode = str(op.get('mode') or 'update').strip()

              if mode == 'add_column':
                  col = str(op.get('column') or '').strip()
                  if not col:
                      sys.exit(f'op {i}: add_column needs column')
                  if col in header:
                      print(f'column already exists {path} {col}')
                      continue
                  after_col = str(op.get('after_column') or '').strip()
                  if after_col and after_col not in header:
                      sys.exit(f'op {i}: after column not in header: {after_col}')
                  insert_at = header.index(after_col) + 1 if after_col else len(header)
                  old_width = len(header)
                  header.insert(insert_at, col)
                  for row in rows[1:]:
                      while len(row) < old_width:
                          row.append('')
                      row.insert(insert_at, '')
                  changed.add(path)
                  print(f'added column {path} {col}')
                  continue

              if mode == 'remove_column':
                  col = str(op.get('column') or '').strip()
                  if not col:
                      sys.exit(f'op {i}: remove_column needs column')
                  if col not in header:
                      sys.exit(f'op {i}: column not in header: {col}')
                  remove_at = header.index(col)
                  header.pop(remove_at)
                  for row in rows[1:]:
                      if len(row) > remove_at:
                          row.pop(remove_at)
                  changed.add(path)
                  print(f'removed column {path} {col}')
                  continue

              if mode == 'dedupe_by_key':
                  key_col = str(op.get('key_column') or '').strip()
                  if key_col not in header:
                      sys.exit(f'op {i}: key column not in header: {key_col}')
                  i_key = header.index(key_col)
                  kept = [header]
                  seen = set()
                  matched = 0
                  removed = 0
                  for row in rows[1:]:
                      if not row:
                          continue
                      while len(row) < len(header):
                          row.append('')
                      if row[i_id] != row_id:
                          kept.append(row)
                          continue
                      matched += 1
                      key = row[i_key].strip()
                      if not key:
                          sys.exit(f'op {i}: blank {key_col} while deduping {row_id!r}')
                      if key in seen:
                          removed += 1
                          continue
                      seen.add(key)
                      kept.append(row)
                  if matched < 1:
                      sys.exit(f'op {i}: found no rows for {row_id!r}')
                  if removed < 1:
                      sys.exit(f'op {i}: found no duplicate rows for {row_id!r}')
                  files[path] = kept
                  changed.add(path)
                  print(f'deduped {path} {row_id}: kept {len(seen)} unique {key_col} values, removed {removed} duplicates')
                  continue

              if mode == 'fill_blank_where':
                  match_col = str(op.get('match_column') or '').strip()
                  col = str(op.get('column') or '').strip()
                  if match_col not in header:
                      sys.exit(f'op {i}: match column not in header: {match_col}')
                  if col not in header:
                      sys.exit(f'op {i}: column not in header: {col}')
                  match_value = decode(op.get('match_value')).strip()
                  new = decode(op.get('value'))
                  if not match_value:
                      sys.exit(f'op {i}: match_value required')
                  if new == '':
                      sys.exit(f'op {i}: value required')
                  i_match = header.index(match_col)
                  i_col = header.index(col)
                  hits = 0
                  for row in rows[1:]:
                      if not row:
                          continue
                      while len(row) < len(header):
                          row.append('')
                      if row[i_match].strip() == match_value and not row[i_col].strip():
                          row[i_col] = new
                          hits += 1
                  if hits < 1:
                      sys.exit(f'op {i}: found no blank {col} values where {match_col}={match_value!r}')
                  changed.add(path)
                  print(f'filled {hits} blank {col} values in {path} where {match_col}={match_value!r}')
                  continue

              if mode == 'replace_text':
                  col = str(op.get('column') or '').strip()
                  if col not in header:
                      sys.exit(f'op {i}: column not in header: {col}')
                  old = decode(op.get('from'))
                  new = decode(op.get('to'))
                  if not old:
                      sys.exit(f'op {i}: replace_text needs non-empty from')
                  i_col = header.index(col)
                  hits = 0
                  for row in rows[1:]:
                      if not row:
                          continue
                      while len(row) < len(header):
                          row.append('')
                      if old in row[i_col]:
                          row[i_col] = row[i_col].replace(old, new)
                          hits += 1
                  if hits < 1:
                      sys.exit(f'op {i}: replace_text found no matches for {old!r}')
                  changed.add(path)
                  print(f'replaced {old!r} in {hits} rows of {path} column {col}')
                  continue

              if mode == 'delete_where':
                  where = op.get('where')
                  if not isinstance(where, dict) or not where:
                      sys.exit(f'op {i}: delete_where needs where')
                  for col in where:
                      if col not in header:
                          sys.exit(f'op {i}: column not in header: {col}')
                  kept = [header]
                  hits = 0
                  for row in rows[1:]:
                      if not row:
                          continue
                      while len(row) < len(header):
                          row.append('')
                      matched = True
                      for col, val in where.items():
                          if row[header.index(col)] != decode(val):
                              matched = False
                              break
                      if matched:
                          hits += 1
                          continue
                      kept.append(row)
                  if hits < 1:
                      sys.exit(f'op {i}: delete_where found no rows for {where!r}')
                  files[path] = kept
                  changed.add(path)
                  print(f'deleted {hits} rows from {path} where {where}')
                  continue

              if mode == 'delete':
                  kept = [header]
                  hits = 0
                  for row in rows[1:]:
                      if not row:
                          continue
                      if len(row) > i_id and row[i_id] == row_id:
                          hits += 1
                          continue
                      kept.append(row)
                  if hits != 1:
                      sys.exit(f'op {i}: expected 1 row for {row_id!r}, found {hits}')
                  files[path] = kept
                  changed.add(path)
                  print(f'deleted {path} {row_id}')
                  continue

              if mode == 'insert':
                  existing = 0
                  for row in rows[1:]:
                      if row and len(row) > i_id and row[i_id] == row_id:
                          existing += 1
                  allow_duplicate_id = bool(op.get('allow_duplicate_id'))
                  if existing and not allow_duplicate_id:
                      sys.exit(f'op {i}: row already exists: {row_id}')
                  sets = op.get('sets')
                  if not isinstance(sets, dict) or not sets:
                      sys.exit(f'op {i}: insert needs sets')
                  new_row = [''] * len(header)
                  new_row[i_id] = row_id
                  for col, val in sets.items():
                      if col not in header:
                          sys.exit(f'op {i}: column not in header: {col}')
                      new_row[header.index(col)] = decode(val)
                  after = str(op.get('after_row_id') or '').strip()
                  if after:
                      placed = False
                      kept = [header]
                      for row in rows[1:]:
                          kept.append(row)
                          if row and len(row) > i_id and row[i_id] == after:
                              kept.append(new_row)
                              placed = True
                      if not placed:
                          sys.exit(f'op {i}: after_row_id not found: {after}')
                      files[path] = kept
                  else:
                      rows.append(new_row)
                      files[path] = rows
                  changed.add(path)
                  print(f'inserted {path} {row_id}')
                  continue

              if mode != 'update':
                  sys.exit(f'op {i}: unknown mode {mode}')

              sets = op.get('sets')
              if not isinstance(sets, dict) or not sets:
                  sets = {}
                  if op.get('column'):
                      sets[str(op['column'])] = op.get('value', '')
                  if op.get('column_2'):
                      sets[str(op['column_2'])] = op.get('value_2', '')
              if not sets:
                  sys.exit(f'op {i}: update needs sets or column/value')

              hits = 0
              for row in rows[1:]:
                  if not row:
                      continue
                  while len(row) < len(header):
                      row.append('')
                  if row[i_id] != row_id:
                      continue
                  for col, val in sets.items():
                      if col not in header:
                          sys.exit(f'op {i}: column not in header: {col}')
                      row[header.index(col)] = decode(val)
                  hits += 1
              if hits != 1:
                  sys.exit(f'op {i}: expected 1 row for {row_id!r}, found {hits}')
              changed.add(path)
              print(f'updated {path} {row_id} {list(sets)}')

          for path, rows in files.items():
              if path not in changed:
                  continue
              with path.open('w', newline='', encoding='utf-8') as f:
                  csv.writer(f, lineterminator='\n').writerows(rows)
          print('changed', ' '.join(str(p) for p in sorted(changed)))
          PY

      - name: Refresh manifests
        run: python3 scripts/data_schema.py manifest

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- data
          if git diff --cached --quiet; then
            echo "No change"
            exit 0
          fi
          git commit -m "Patch CSV line items"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
