name: Patch CSV

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-csv.yml'
  workflow_dispatch:
    inputs:
      patches:
        description: JSON list of operations. One run, one commit.
        required: true
        type: string

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply patches
        env:
          PATCHES: ${{ inputs.patches }}
        run: |
          python3 <<'PY'
          import csv, json, os, sys
          from pathlib import Path

          raw = os.environ.get('PATCHES', '').strip()
          if not raw:
              raw = r'[{"file":"data/marines/Detachments.csv","id_column":"Item_ID","row_id":"space_marines_orbital_assault_force_stratagem_suppression_strafing","mode":"insert","after_row_id":"space_marines_orbital_assault_force_enhancement_dedicated_gunship","sets":{"Detachment_ID":"space_marines_orbital_assault_force","Detachment_Name":"Orbital Assault Force","Item_Type":"STRATAGEM","Item_Name":"Suppression Strafing (1CP)","CP_Cost":"1","Short_Description":"Command: Enemy within 18\" takes Battle-shock at -1. Failed = -1 To Hit until next turn.","Long_Description":"WHEN: Command phase.\\n\\nTARGET: One ADEPTUS ASTARTES unit from your army.\\n\\nEFFECT: Select one enemy unit visible to and within 18\" of your unit. That enemy unit takes a Battle-shock test. When doing so, subtract 1 from that test and, if that test is failed, until the start of your next turn, that enemy unit is suppressed. While a unit is suppressed, each time a model in that unit makes an attack, subtract 1 from the Hit roll.\\n\\nRESTRICTIONS: You cannot use this Stratagem more than once per battle round."}},{"file":"data/marines/Detachments.csv","id_column":"Item_ID","row_id":"space_marines_orbital_assault_force_stratagem_auto_sense_coordination","mode":"insert","after_row_id":"space_marines_orbital_assault_force_stratagem_suppression_strafing","sets":{"Detachment_ID":"space_marines_orbital_assault_force","Detachment_Name":"Orbital Assault Force","Item_Type":"STRATAGEM","Item_Name":"Auto-Sense Coordination (1CP)","CP_Cost":"1","Short_Description":"Shoot/Fight: [LETHAL HITS] or [SUSTAINED HITS 1] after DROP POD disembark OR vs target within 12\".","Long_Description":"WHEN: Your Shooting phase or the Fight phase.\\n\\nTARGET: One ADEPTUS ASTARTES unit from your army that has not been selected to shoot or fight this phase.\\n\\nEFFECT: Select the [LETHAL HITS] or [SUSTAINED HITS 1] ability. Until the end of the phase, weapons equipped by models in your unit have this ability in a turn in which they disembarked from a DROP POD or while targeting an enemy unit within 12\"."}},{"file":"data/marines/Detachments.csv","id_column":"Item_ID","row_id":"space_marines_orbital_assault_force_stratagem_tactical_decapitation","mode":"insert","after_row_id":"space_marines_orbital_assault_force_stratagem_auto_sense_coordination","sets":{"Detachment_ID":"space_marines_orbital_assault_force","Detachment_Name":"Orbital Assault Force","Item_Type":"STRATAGEM","Item_Name":"Tactical Decapitation (1CP)","CP_Cost":"1","Short_Description":"Shoot/Fight: [PRECISION] and +1 To Hit vs CHARACTER.","Long_Description":"WHEN: Your Shooting phase or the Fight phase.\\n\\nTARGET: One ADEPTUS ASTARTES unit from your army that has not been selected to shoot or fight this phase.\\n\\nEFFECT: Until the end of the phase, weapons equipped by models in your unit have the [PRECISION] ability and each time a model in your unit makes an attack that targets a CHARACTER unit, add 1 to the Hit roll."}},{"file":"data/marines/Detachments.csv","id_column":"Item_ID","row_id":"space_marines_orbital_assault_force_stratagem_blind_screen","mode":"insert","after_row_id":"space_marines_orbital_assault_force_stratagem_tactical_decapitation","sets":{"Detachment_ID":"space_marines_orbital_assault_force","Detachment_Name":"Orbital Assault Force","Item_Type":"STRATAGEM","Item_Name":"Blind Screen (1CP)","CP_Cost":"1","Short_Description":"Enemy Shoot: Target + nearby SMOKE VEHICLE/DROP POD get Stealth and Cover.","Long_Description":"WHEN: Your opponent\u0027s Shooting phase, just after an enemy unit has selected its targets.\\n\\nTARGET: One ADEPTUS ASTARTES unit (excluding TITANIC units) from your army that was selected as the target of one or more of the attacking unit\u0027s attacks and one friendly ADEPTUS ASTARTES SMOKE VEHICLE or DROP POD unit within 9\" of it.\\n\\nEFFECT: Until the end of the phase, models in your units have the Stealth ability and each time a ranged attack targets one of your units, models in that unit have the Benefit of Cover against that attack."}},{"file":"data/marines/Detachments.csv","id_column":"Item_ID","row_id":"space_marines_orbital_assault_force_stratagem_shock_onslaught","mode":"insert","after_row_id":"space_marines_orbital_assault_force_stratagem_blind_screen","sets":{"Detachment_ID":"space_marines_orbital_assault_force","Detachment_Name":"Orbital Assault Force","Item_Type":"STRATAGEM","Item_Name":"Shock Onslaught (1CP)","CP_Cost":"1","Short_Description":"Fight: Pile-in and Consolidation moves up to 6\".","Long_Description":"WHEN: Fight phase.\\n\\nTARGET: One ADEPTUS ASTARTES unit from your army that has not been selected to fight this phase.\\n\\nEFFECT: Until the end of the phase, each time a model in your unit makes a Pile-in or Consolidation move, it can move up to 6\" instead of up to 3\"."}},{"file":"data/marines/Detachments.csv","id_column":"Item_ID","row_id":"space_marines_orbital_assault_force_stratagem_onward_for_the_emperor","mode":"insert","after_row_id":"space_marines_orbital_assault_force_stratagem_shock_onslaught","sets":{"Detachment_ID":"space_marines_orbital_assault_force","Detachment_Name":"Orbital Assault Force","Item_Type":"STRATAGEM","Item_Name":"Onward for the Emperor (1CP)","CP_Cost":"1","Short_Description":"End enemy Fight: INFANTRY wholly within 6\" of TRANSPORT can embark.","Long_Description":"WHEN: End of your opponent\u0027s Fight phase.\\n\\nTARGET: One ADEPTUS ASTARTES INFANTRY unit from your army that was not set up on the battlefield this turn and one friendly TRANSPORT it is able to embark within.\\n\\nEFFECT: If your ADEPTUS ASTARTES unit is wholly within 6\" of that TRANSPORT, it can embark within it."}}]'
          try:
              ops = json.loads(raw)
          except json.JSONDecodeError as e:
              sys.exit(f'patches is not JSON: {e}')
          if not isinstance(ops, list) or not ops:
              sys.exit('patches must be a non-empty JSON list')

          def decode(val):
              if val is None:
                  return ''
              s = str(val)
              return s.replace('\\n', '\n')

          def load_csv(path):
              if path.is_absolute() or '..' in path.parts:
                  sys.exit(f'bad path {path}')
              if not str(path).startswith('data/') or path.suffix.lower() != '.csv':
                  sys.exit(f'file must be a .csv under data/: {path}')
              if not path.is_file():
                  sys.exit(f'missing {path}')
              with path.open(encoding='utf-8', newline='') as f:
                  rows = list(csv.reader(f))
              if not rows:
                  sys.exit(f'empty csv {path}')
              return rows

          files = {}
          changed = set()

          for i, op in enumerate(ops):
              if not isinstance(op, dict):
                  sys.exit(f'op {i} is not an object')
              path = Path(str(op.get('file', '')).strip())
              if path not in files:
                  files[path] = load_csv(path)
              rows = files[path]
              header = rows[0]
              id_col = str(op.get('id_column') or '').strip() or header[0]
              if id_col not in header:
                  sys.exit(f'op {i}: id column not in header: {id_col}')
              i_id = header.index(id_col)
              row_id = str(op.get('row_id') or '').strip()
              if not row_id:
                  sys.exit(f'op {i}: row_id required')
              mode = str(op.get('mode') or 'update').strip()

              if mode == 'fill_blank_where':
                  match_col = str(op.get('match_column') or '').strip()
                  col = str(op.get('column') or '').strip()
                  if match_col not in header:
                      sys.exit(f'op {i}: match column not in header: {match_col}')
                  if col not in header:
                      sys.exit(f'op {i}: column not in header: {col}')
                  match_value = decode(op.get('match_value')).strip()
                  new = decode(op.get('value'))
                  if not match_value:
                      sys.exit(f'op {i}: match_value required')
                  if new == '':
                      sys.exit(f'op {i}: value required')
                  i_match = header.index(match_col)
                  i_col = header.index(col)
                  hits = 0
                  for row in rows[1:]:
                      if not row:
                          continue
                      while len(row) < len(header):
                          row.append('')
                      if row[i_match].strip() == match_value and not row[i_col].strip():
                          row[i_col] = new
                          hits += 1
                  if hits < 1:
                      sys.exit(f'op {i}: found no blank {col} values where {match_col}={match_value!r}')
                  changed.add(path)
                  print(f'filled {hits} blank {col} values in {path} where {match_col}={match_value!r}')
                  continue

              if mode == 'replace_text':
                  col = str(op.get('column') or '').strip()
                  if col not in header:
                      sys.exit(f'op {i}: column not in header: {col}')
                  old = decode(op.get('from'))
                  new = decode(op.get('to'))
                  if not old:
                      sys.exit(f'op {i}: replace_text needs non-empty from')
                  i_col = header.index(col)
                  hits = 0
                  for row in rows[1:]:
                      if not row:
                          continue
                      while len(row) < len(header):
                          row.append('')
                      if old in row[i_col]:
                          row[i_col] = row[i_col].replace(old, new)
                          hits += 1
                  if hits < 1:
                      sys.exit(f'op {i}: replace_text found no matches for {old!r}')
                  changed.add(path)
                  print(f'replaced {old!r} in {hits} rows of {path} column {col}')
                  continue

              if mode == 'delete':
                  kept = [header]
                  hits = 0
                  for row in rows[1:]:
                      if not row:
                          continue
                      if len(row) > i_id and row[i_id] == row_id:
                          hits += 1
                          continue
                      kept.append(row)
                  if hits != 1:
                      sys.exit(f'op {i}: expected 1 row for {row_id!r}, found {hits}')
                  files[path] = kept
                  changed.add(path)
                  print(f'deleted {path} {row_id}')
                  continue

              if mode == 'insert':
                  existing = 0
                  for row in rows[1:]:
                      if row and len(row) > i_id and row[i_id] == row_id:
                          existing += 1
                  if existing:
                      sys.exit(f'op {i}: row already exists: {row_id}')
                  sets = op.get('sets')
                  if not isinstance(sets, dict) or not sets:
                      sys.exit(f'op {i}: insert needs sets')
                  new_row = [''] * len(header)
                  new_row[i_id] = row_id
                  for col, val in sets.items():
                      if col not in header:
                          sys.exit(f'op {i}: column not in header: {col}')
                      new_row[header.index(col)] = decode(val)
                  after = str(op.get('after_row_id') or '').strip()
                  if after:
                      placed = False
                      kept = [header]
                      for row in rows[1:]:
                          kept.append(row)
                          if row and len(row) > i_id and row[i_id] == after:
                              kept.append(new_row)
                              placed = True
                      if not placed:
                          sys.exit(f'op {i}: after_row_id not found: {after}')
                      files[path] = kept
                  else:
                      rows.append(new_row)
                      files[path] = rows
                  changed.add(path)
                  print(f'inserted {path} {row_id}')
                  continue

              if mode != 'update':
                  sys.exit(f'op {i}: unknown mode {mode}')

              sets = op.get('sets')
              if not isinstance(sets, dict) or not sets:
                  sets = {}
                  if op.get('column'):
                      sets[str(op['column'])] = op.get('value', '')
                  if op.get('column_2'):
                      sets[str(op['column_2'])] = op.get('value_2', '')
              if not sets:
                  sys.exit(f'op {i}: update needs sets or column/value')

              hits = 0
              for row in rows[1:]:
                  if not row:
                      continue
                  while len(row) < len(header):
                      row.append('')
                  if row[i_id] != row_id:
                      continue
                  for col, val in sets.items():
                      if col not in header:
                          sys.exit(f'op {i}: column not in header: {col}')
                      row[header.index(col)] = decode(val)
                  hits += 1
              if hits != 1:
                  sys.exit(f'op {i}: expected 1 row for {row_id!r}, found {hits}')
              changed.add(path)
              print(f'updated {path} {row_id} {list(sets)}')

          for path, rows in files.items():
              if path not in changed:
                  continue
              with path.open('w', newline='', encoding='utf-8') as f:
                  csv.writer(f, lineterminator='\n').writerows(rows)
          print('changed', ' '.join(str(p) for p in sorted(changed)))
          PY

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- data
          if git diff --cached --quiet; then
            echo "No change"
            exit 0
          fi
          git commit -m "Patch CSV line items"
          git push
