name: Patch CSV

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-csv.yml'
  workflow_dispatch:
    inputs:
      patches:
        description: JSON list of operations. One run, one commit.
        required: true
        type: string

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply patches
        env:
          PATCHES: ${{ inputs.patches || '[{"file":"data/marines/Unit_Profiles.csv","id_column":"Unit_ID","row_id":"VANGUARD_VETERAN_SQUAD_WITH_JUMP_PACKS","mode":"update","sets":{"Unit Name":"Vanguard Veteran Squad with Jump Packs","M\"":"12\"","T":"5","SV":"3+","W":"2","LD":"6+","OC":"1","Keywords":"INFANTRY, EXPLOSIVES, FLY, IMPERIUM, JUMP PACK, TACTICUS"}},{"file":"data/marines/Unit_Profiles.csv","id_column":"Unit_ID","row_id":"INCURSORS","mode":"update","sets":{"Unit Name":"Incursor Squad","M\"":"8\"","T":"4","SV":"3+","W":"2","LD":"6+","OC":"1","Keywords":"INFANTRY, EXPLOSIVES, IMPERIUM, PHOBOS, SMOKE"}},{"file":"data/marines/Unit_Profiles.csv","id_column":"Unit_ID","row_id":"REIVERS","mode":"update","sets":{"Unit Name":"Reiver Squad","M\"":"8\"","T":"4","SV":"3+","W":"2","LD":"6+","OC":"1","Keywords":"INFANTRY, EXPLOSIVES, IMPERIUM, PHOBOS, SMOKE"}},{"file":"data/marines/Unit_Profiles.csv","id_column":"Unit_ID","row_id":"SCOUTS","mode":"update","sets":{"Unit Name":"Scout Squad","M\"":"6\"","T":"4","SV":"4+","W":"2","LD":"6+","OC":"1","Keywords":"INFANTRY, EXPLOSIVES, IMPERIUM, SMOKE"}},{"file":"data/marines/Unit_Profiles.csv","id_column":"Unit_ID","row_id":"ELIMINATOR_SQUAD","mode":"update","sets":{"Unit Name":"Eliminator Squad","M\"":"8\"","T":"4","SV":"3+","W":"2","LD":"6+","OC":"1","Keywords":"INFANTRY, EXPLOSIVES, IMPERIUM, PHOBOS, SMOKE"}},{"file":"data/marines/Unit_Profiles.csv","id_column":"Unit_ID","row_id":"OUTRIDER_SQUAD","mode":"update","sets":{"Unit Name":"Outrider Squad","M\"":"12\"","T":"6","SV":"3+","W":"4","LD":"6+","OC":"2","Keywords":"MOUNTED, EXPLOSIVES, IMPERIUM"}},{"file":"data/marines/Unit_Profiles.csv","id_column":"Unit_ID","row_id":"ERADICATOR_SQUAD_HEAVY_BOLTERS","mode":"update","sets":{"Unit Name":"Eradicator Squad with Heavy Bolters","M\"":"5\"","T":"6","SV":"3+","W":"3","LD":"6+","OC":"1","Keywords":"INFANTRY, EXPLOSIVES, GRAVIS, IMPERIUM"}},{"file":"data/marines/Unit_Profiles.csv","id_column":"Unit_ID","row_id":"ERADICATOR_SQUAD_MELTA","mode":"update","sets":{"Unit Name":"Eradicator Squad with Melta Rifles","M\"":"5\"","T":"6","SV":"3+","W":"3","LD":"6+","OC":"1","Keywords":"INFANTRY, EXPLOSIVES, GRAVIS, IMPERIUM"}},{"file":"data/marines/Unit_Points.csv","id_column":"Unit_ID","row_id":"*","mode":"delete_where","where":{"Unit_ID":"VANGUARD_VETERAN_SQUAD_WITH_JUMP_PACKS"}},{"file":"data/marines/Unit_Points.csv","id_column":"Unit_ID","row_id":"VANGUARD_VETERAN_SQUAD_WITH_JUMP_PACKS","mode":"insert","allow_duplicate_id":false,"sets":{"Point_Option_ID":"point_1","Label":"x5","Cost":"0","Sort_Order":"1"}},{"file":"data/marines/Unit_Points.csv","id_column":"Unit_ID","row_id":"VANGUARD_VETERAN_SQUAD_WITH_JUMP_PACKS","mode":"insert","allow_duplicate_id":true,"sets":{"Point_Option_ID":"point_2","Label":"x10","Cost":"0","Sort_Order":"2"}},{"file":"data/marines/Unit_Points.csv","id_column":"Unit_ID","row_id":"*","mode":"delete_where","where":{"Unit_ID":"INCURSORS"}},{"file":"data/marines/Unit_Points.csv","id_column":"Unit_ID","row_id":"INCURSORS","mode":"insert","allow_duplicate_id":false,"sets":{"Point_Option_ID":"point_1","Label":"x5","Cost":"0","Sort_Order":"1"}},{"file":"data/marines/Unit_Points.csv","id_column":"Unit_ID","row_id":"INCURSORS","mode":"insert","allow_duplicate_id":true,"sets":{"Point_Option_ID":"point_2","Label":"x10","Cost":"0","Sort_Order":"2"}},{"file":"data/marines/Unit_Points.csv","id_column":"Unit_ID","row_id":"*","mode":"delete_where","where":{"Unit_ID":"REIVERS"}},{"file":"data/marines/Unit_Points.csv","id_column":"Unit_ID","row_id":"REIVERS","mode":"insert","allow_duplicate_id":false,"sets":{"Point_Option_ID":"point_1","Label":"x5","Cost":"0","Sort_Order":"1"}},{"file":"data/marines/Unit_Points.csv","id_column":"Unit_ID","row_id":"REIVERS","mode":"insert","allow_duplicate_id":true,"sets":{"Point_Option_ID":"point_2","Label":"x10","Cost":"0","Sort_Order":"2"}},{"file":"data/marines/Unit_Points.csv","id_column":"Unit_ID","row_id":"*","mode":"delete_where","where":{"Unit_ID":"SCOUTS"}},{"file":"data/marines/Unit_Points.csv","id_column":"Unit_ID","row_id":"SCOUTS","mode":"insert","allow_duplicate_id":false,"sets":{"Point_Option_ID":"point_1","Label":"x5","Cost":"0","Sort_Order":"1"}},{"file":"data/marines/Unit_Points.csv","id_column":"Unit_ID","row_id":"SCOUTS","mode":"insert","allow_duplicate_id":true,"sets":{"Point_Option_ID":"point_2","Label":"x10","Cost":"0","Sort_Order":"2"}},{"file":"data/marines/Unit_Points.csv","id_column":"Unit_ID","row_id":"*","mode":"delete_where","where":{"Unit_ID":"ELIMINATOR_SQUAD"}},{"file":"data/marines/Unit_Points.csv","id_column":"Unit_ID","row_id":"ELIMINATOR_SQUAD","mode":"insert","allow_duplicate_id":false,"sets":{"Point_Option_ID":"point_1","Label":"x3","Cost":"0","Sort_Order":"1"}},{"file":"data/marines/Unit_Points.csv","id_column":"Unit_ID","row_id":"*","mode":"delete_where","where":{"Unit_ID":"OUTRIDER_SQUAD"}},{"file":"data/marines/Unit_Points.csv","id_column":"Unit_ID","row_id":"OUTRIDER_SQUAD","mode":"insert","allow_duplicate_id":false,"sets":{"Point_Option_ID":"point_1","Label":"x3","Cost":"0","Sort_Order":"1"}},{"file":"data/marines/Unit_Points.csv","id_column":"Unit_ID","row_id":"OUTRIDER_SQUAD","mode":"insert","allow_duplicate_id":true,"sets":{"Point_Option_ID":"point_2","Label":"x6","Cost":"0","Sort_Order":"2"}},{"file":"data/marines/Unit_Points.csv","id_column":"Unit_ID","row_id":"*","mode":"delete_where","where":{"Unit_ID":"ERADICATOR_SQUAD_HEAVY_BOLTERS"}},{"file":"data/marines/Unit_Points.csv","id_column":"Unit_ID","row_id":"ERADICATOR_SQUAD_HEAVY_BOLTERS","mode":"insert","allow_duplicate_id":false,"sets":{"Point_Option_ID":"point_1","Label":"x3","Cost":"0","Sort_Order":"1"}},{"file":"data/marines/Unit_Points.csv","id_column":"Unit_ID","row_id":"ERADICATOR_SQUAD_HEAVY_BOLTERS","mode":"insert","allow_duplicate_id":true,"sets":{"Point_Option_ID":"point_2","Label":"x6","Cost":"0","Sort_Order":"2"}},{"file":"data/marines/Unit_Points.csv","id_column":"Unit_ID","row_id":"*","mode":"delete_where","where":{"Unit_ID":"ERADICATOR_SQUAD_MELTA"}},{"file":"data/marines/Unit_Points.csv","id_column":"Unit_ID","row_id":"ERADICATOR_SQUAD_MELTA","mode":"insert","allow_duplicate_id":false,"sets":{"Point_Option_ID":"point_1","Label":"x3","Cost":"0","Sort_Order":"1"}},{"file":"data/marines/Unit_Points.csv","id_column":"Unit_ID","row_id":"ERADICATOR_SQUAD_MELTA","mode":"insert","allow_duplicate_id":true,"sets":{"Point_Option_ID":"point_2","Label":"x6","Cost":"0","Sort_Order":"2"}},{"file":"data/marines/Abilities.csv","id_column":"Ability_ID","row_id":"VANGUARD_ASSAULT","mode":"update","sets":{"Ability Name":"Vanguard Assault","Short_Description":"CHARGE this turn — MELEE [+1 A].","Long_Description":"If this unit made a charge move this turn, this unit’s melee attacks have +1 A.","Tags":"[MELEE] [WEAPONS] [ACTIVE] [+1 A]","Tag Categories":"","Visibility_ID":"2","Default_Active":""}},{"file":"data/marines/Abilities.csv","id_column":"Ability_ID","row_id":"COMBAT_SHIELD_VANGUARD","mode":"insert","sets":{"Ability Name":"Combat Shield","Short_Description":"Bearer has 5+ InvS. [INVULNERABLE SAVE 5+]","Long_Description":"This model has 5+ InvS.","Tags":"[STATS] [INVULNERABLE SAVE 5+]","Tag Categories":"","Visibility_ID":"2","Default_Active":""}},{"file":"data/marines/Unit_Abilities.csv","id_column":"Unit_ID","row_id":"*","mode":"delete_where","where":{"Unit_ID":"VANGUARD_VETERAN_SQUAD_WITH_JUMP_PACKS","Ability_ID":"STORM_SHIELD"}},{"file":"data/marines/Abilities.csv","id_column":"Ability_ID","row_id":"MULTI_SPECTRUM_ARRAY","mode":"update","sets":{"Ability_ID":"DIVINATOR_CLASS_AUSPEXES","Ability Name":"Divinator-class Auspexes","Short_Description":"Once per phase — SHOOTING — scan visible enemy within 18\"; friendly ADEPTUS ASTARTES RANGE attacks vs it re-roll Hit rolls of 1.","Long_Description":"Once per phase, per unit — In your Shooting phase, when a friendly ADEPTUS ASTARTES unit is selected to shoot, you can use this ability. If you do, select one visible enemy unit within 18\" of this unit. That unit is scanned. While a unit is scanned, ranged attacks that target that unit can re-roll hit rolls of 1.","Tags":"[SHOOT] [ACTIVE]","Tag Categories":"","Visibility_ID":"2","Default_Active":""}},{"file":"data/marines/Unit_Abilities.csv","id_column":"Unit_ID","row_id":"*","mode":"delete_where","where":{"Unit_ID":"INCURSORS","Ability_ID":"MULTI_SPECTRUM_ARRAY"}},{"file":"data/marines/Unit_Abilities.csv","id_column":"Unit_ID","row_id":"INCURSORS","mode":"insert","allow_duplicate_id":true,"sets":{"Ability_ID":"DIVINATOR_CLASS_AUSPEXES","Ability_Type":"ABILITY"}},{"file":"data/marines/Abilities.csv","id_column":"Ability_ID","row_id":"HAYWIRE_MINE","mode":"update","sets":{"Ability Name":"Haywire Mine","Short_Description":"Once per battle — SHOOTING — visible enemy within 6\"; 2+ = D3 mortal wounds, or 2D3 vs VEHICLE.","Long_Description":"Once per battle, per unit — In your Shooting phase, you can select one visible enemy unit within 6\" of this unit and roll one D6. On a 2+, that enemy unit suffers D3 mortal wounds, or 2D3 mortal wounds instead if it is a VEHICLE unit.","Tags":"[SHOOT]","Tag Categories":"","Visibility_ID":"2","Default_Active":""}},{"file":"data/marines/Abilities.csv","id_column":"Ability_ID","row_id":"TERROR_TROOPS_AURA","mode":"update","sets":{"Ability Name":"Terror Troops (Aura)","Short_Description":"Enemy model within 3\" of UNIT — -1 OC.","Long_Description":"While an enemy model is within 3\" of this unit, that enemy model has -1 OC.","Tags":"","Tag Categories":"","Visibility_ID":"2","Default_Active":""}},{"file":"data/marines/Abilities.csv","id_column":"Ability_ID","row_id":"FEARSOME_ASSAULT","mode":"update","sets":{"Ability Name":"Fearsome Assault","Short_Description":"FIGHT start — engaged enemy units take Battle-shock test at -1.","Long_Description":"At the start of the Fight phase, each enemy unit engaged with a unit with this ability makes a battle-shock roll, with -1 to that battle-shock roll.","Tags":"","Tag Categories":"","Visibility_ID":"2","Default_Active":""}},{"file":"data/marines/Abilities.csv","id_column":"Ability_ID","row_id":"GRAPNEL_LAUNCHER","mode":"update","sets":{"Ability Name":"Grapnel Launchers","Short_Description":"MOVEMENT — move through all model types; ignore vertical distance.","Long_Description":"When this unit makes a move, it can move through all types of model and ignore all vertical distance for the purposes of how far this unit has moved.","Tags":"","Tag Categories":"","Visibility_ID":"2","Default_Active":""}},{"file":"data/marines/Abilities.csv","id_column":"Ability_ID","row_id":"GRAV_CHUTES","mode":"insert","sets":{"Ability Name":"Grav-chutes","Short_Description":"UNIT has Deep Strike. [DEEP STRIKE]","Long_Description":"This unit has Deep Strike.","Tags":"[DEEP STRIKE]","Tag Categories":"","Visibility_ID":"2","Default_Active":""}},{"file":"data/marines/Abilities.csv","id_column":"Ability_ID","row_id":"GUERRILLA_TACTICS","mode":"update","sets":{"Ability_ID":"FLEXIBLE_ASSET","Ability Name":"Flexible Asset","Short_Description":"ADVANCE/FALL BACK does not prevent UNIT from starting an action.","Long_Description":"When this unit is selected to make an advance/fall-back move, that advance/fall-back move does not prevent this unit from being eligible to start an action.","Tags":"","Tag Categories":"","Visibility_ID":"2","Default_Active":""}},{"file":"data/marines/Unit_Abilities.csv","id_column":"Unit_ID","row_id":"*","mode":"delete_where","where":{"Unit_ID":"SCOUTS","Ability_ID":"GUERRILLA_TACTICS"}},{"file":"data/marines/Unit_Abilities.csv","id_column":"Unit_ID","row_id":"SCOUTS","mode":"insert","allow_duplicate_id":true,"sets":{"Ability_ID":"FLEXIBLE_ASSET","Ability_Type":"ABILITY"}},{"file":"data/marines/Unit_Abilities.csv","id_column":"Unit_ID","row_id":"*","mode":"delete_where","where":{"Unit_ID":"SCOUTS","Ability_ID":"SCOUT_WARGEAR"}},{"file":"data/marines/Abilities.csv","id_column":"Ability_ID","row_id":"MARK_THE_TARGET","mode":"update","sets":{"Ability_ID":"CHAMELEOLINE_CLOAKS","Ability Name":"Chameleoline Cloaks","Short_Description":"UNIT has -3\" detection range.","Long_Description":"This unit has -3\" detection range.","Tags":"","Tag Categories":"","Visibility_ID":"2","Default_Active":""}},{"file":"data/marines/Abilities.csv","id_column":"Ability_ID","row_id":"REPOSITION_UNDER_COVERING_FIRE","mode":"update","sets":{"Ability_ID":"SPECIAL_ISSUE_OPTICS_AND_AMMUNITION","Ability Name":"Special-issue Optics and Ammunition","Short_Description":"SHOOTING — select one — RANGE [IGNORES COVER] or enemy within 24\" gets +6\" detection range until UNIT has shot.","Long_Description":"In your Shooting phase, when this unit is selected to shoot, you can select one of the following — this unit’s ranged attacks have [IGNORES COVER]; or select one enemy unit within 24\" of this unit. That enemy unit has +6\" detection range until this unit has shot.","Tags":"[SHOOT] [WEAPONS] [ACTIVE] [IGNORES COVER]","Tag Categories":"","Visibility_ID":"2","Default_Active":""}},{"file":"data/marines/Unit_Abilities.csv","id_column":"Unit_ID","row_id":"*","mode":"delete_where","where":{"Unit_ID":"ELIMINATOR_SQUAD","Ability_ID":"MARK_THE_TARGET"}},{"file":"data/marines/Unit_Abilities.csv","id_column":"Unit_ID","row_id":"*","mode":"delete_where","where":{"Unit_ID":"ELIMINATOR_SQUAD","Ability_ID":"REPOSITION_UNDER_COVERING_FIRE"}},{"file":"data/marines/Unit_Abilities.csv","id_column":"Unit_ID","row_id":"ELIMINATOR_SQUAD","mode":"insert","allow_duplicate_id":true,"sets":{"Ability_ID":"CHAMELEOLINE_CLOAKS","Ability_Type":"ABILITY"}},{"file":"data/marines/Unit_Abilities.csv","id_column":"Unit_ID","row_id":"ELIMINATOR_SQUAD","mode":"insert","allow_duplicate_id":true,"sets":{"Ability_ID":"SPECIAL_ISSUE_OPTICS_AND_AMMUNITION","Ability_Type":"ABILITY"}},{"file":"data/marines/Abilities.csv","id_column":"Ability_ID","row_id":"THUNDEROUS_IMPACT","mode":"update","sets":{"Ability_ID":"FULL_THROTTLE_ASSAULT","Ability Name":"Full-throttle Assault","Short_Description":"CHARGE this turn — MELEE [SUSTAINED HITS 1]; Thunder Hammer +1 To Hit; other MELEE +1 D.","Long_Description":"If this unit made a charge move this turn, this unit’s Thunder Hammer weapons have +1 to hit rolls and [SUSTAINED HITS 1]. Other melee weapons have +1 D and [SUSTAINED HITS 1].","Tags":"[MELEE] [WEAPONS] [ACTIVE] [SUSTAINED HITS 1]","Tag Categories":"","Visibility_ID":"2","Default_Active":""}},{"file":"data/marines/Unit_Abilities.csv","id_column":"Unit_ID","row_id":"*","mode":"delete_where","where":{"Unit_ID":"OUTRIDER_SQUAD","Ability_ID":"THUNDEROUS_IMPACT"}},{"file":"data/marines/Unit_Abilities.csv","id_column":"Unit_ID","row_id":"OUTRIDER_SQUAD","mode":"insert","allow_duplicate_id":true,"sets":{"Ability_ID":"FULL_THROTTLE_ASSAULT","Ability_Type":"ABILITY"}},{"file":"data/marines/Abilities.csv","id_column":"Ability_ID","row_id":"OVERLAPPING_DETONATIONS","mode":"update","sets":{"Ability_ID":"OVERLAPPING_DESTRUCTION","Ability Name":"Overlapping Destruction","Short_Description":"SHOOTING — select enemy — Heavy Bolters vs it have [BLAST 1].","Long_Description":"In your Shooting phase, you can select one enemy unit. This unit’s Heavy Bolter weapons that target that enemy unit have [BLAST 1].","Tags":"[SHOOT] [WEAPONS] [ACTIVE]","Tag Categories":"","Visibility_ID":"2","Default_Active":""}},{"file":"data/marines/Unit_Abilities.csv","id_column":"Unit_ID","row_id":"*","mode":"delete_where","where":{"Unit_ID":"ERADICATOR_SQUAD_HEAVY_BOLTERS","Ability_ID":"OVERLAPPING_DETONATIONS"}},{"file":"data/marines/Unit_Abilities.csv","id_column":"Unit_ID","row_id":"ERADICATOR_SQUAD_HEAVY_BOLTERS","mode":"insert","allow_duplicate_id":true,"sets":{"Ability_ID":"OVERLAPPING_DESTRUCTION","Ability_Type":"ABILITY"}},{"file":"data/marines/Abilities.csv","id_column":"Ability_ID","row_id":"TOTAL_OBLITERATION","mode":"update","sets":{"Ability Name":"Total Obliteration","Short_Description":"RANGE attacks re-roll Damage rolls.","Long_Description":"This unit’s ranged attacks can re-roll damage rolls.","Tags":"[SHOOT] [WEAPONS]","Tag Categories":"","Visibility_ID":"2","Default_Active":""}}]' }}
        run: |
          python3 <<'PY'
          import csv, json, os, sys
          from pathlib import Path

          raw = os.environ.get('PATCHES') or ''
          if not raw.strip():
              print('no PATCHES input; skip apply')
              raise SystemExit(0)
          try:
              ops = json.loads(raw)
          except json.JSONDecodeError as e:
              sys.exit(f'patches is not JSON: {e}')
          if not isinstance(ops, list) or not ops:
              sys.exit('patches must be a non-empty JSON list')

          def decode(val):
              if val is None:
                  return ''
              s = str(val)
              return s.replace('\\n', '\n')

          def load_csv(path):
              if path.is_absolute() or '..' in path.parts:
                  sys.exit(f'bad path {path}')
              if not str(path).startswith('data/') or path.suffix.lower() != '.csv':
                  sys.exit(f'file must be a .csv under data/: {path}')
              if not path.is_file():
                  sys.exit(f'missing {path}')
              with path.open(encoding='utf-8', newline='') as f:
                  rows = list(csv.reader(f))
              if not rows:
                  sys.exit(f'empty csv {path}')
              return rows

          files = {}
          changed = set()

          for i, op in enumerate(ops):
              if not isinstance(op, dict):
                  sys.exit(f'op {i} is not an object')
              path = Path(str(op.get('file', '')).strip())
              if path not in files:
                  files[path] = load_csv(path)
              rows = files[path]
              header = rows[0]
              id_col = str(op.get('id_column') or '').strip() or header[0]
              if id_col not in header:
                  sys.exit(f'op {i}: id column not in header: {id_col}')
              i_id = header.index(id_col)
              row_id = str(op.get('row_id') or '').strip()
              if not row_id:
                  sys.exit(f'op {i}: row_id required')
              mode = str(op.get('mode') or 'update').strip()

              if mode == 'add_column':
                  col = str(op.get('column') or '').strip()
                  if not col:
                      sys.exit(f'op {i}: add_column needs column')
                  if col in header:
                      print(f'column already exists {path} {col}')
                      continue
                  after_col = str(op.get('after_column') or '').strip()
                  if after_col and after_col not in header:
                      sys.exit(f'op {i}: after column not in header: {after_col}')
                  insert_at = header.index(after_col) + 1 if after_col else len(header)
                  old_width = len(header)
                  header.insert(insert_at, col)
                  for row in rows[1:]:
                      while len(row) < old_width:
                          row.append('')
                      row.insert(insert_at, '')
                  changed.add(path)
                  print(f'added column {path} {col}')
                  continue

              if mode == 'remove_column':
                  col = str(op.get('column') or '').strip()
                  if not col:
                      sys.exit(f'op {i}: remove_column needs column')
                  if col not in header:
                      sys.exit(f'op {i}: column not in header: {col}')
                  remove_at = header.index(col)
                  header.pop(remove_at)
                  for row in rows[1:]:
                      if len(row) > remove_at:
                          row.pop(remove_at)
                  changed.add(path)
                  print(f'removed column {path} {col}')
                  continue

              if mode == 'dedupe_by_key':
                  key_col = str(op.get('key_column') or '').strip()
                  if key_col not in header:
                      sys.exit(f'op {i}: key column not in header: {key_col}')
                  i_key = header.index(key_col)
                  kept = [header]
                  seen = set()
                  matched = 0
                  removed = 0
                  for row in rows[1:]:
                      if not row:
                          continue
                      while len(row) < len(header):
                          row.append('')
                      if row[i_id] != row_id:
                          kept.append(row)
                          continue
                      matched += 1
                      key = row[i_key].strip()
                      if not key:
                          sys.exit(f'op {i}: blank {key_col} while deduping {row_id!r}')
                      if key in seen:
                          removed += 1
                          continue
                      seen.add(key)
                      kept.append(row)
                  if matched < 1:
                      sys.exit(f'op {i}: found no rows for {row_id!r}')
                  if removed < 1:
                      sys.exit(f'op {i}: found no duplicate rows for {row_id!r}')
                  files[path] = kept
                  changed.add(path)
                  print(f'deduped {path} {row_id}: kept {len(seen)} unique {key_col} values, removed {removed} duplicates')
                  continue

              if mode == 'fill_blank_where':
                  match_col = str(op.get('match_column') or '').strip()
                  col = str(op.get('column') or '').strip()
                  if match_col not in header:
                      sys.exit(f'op {i}: match column not in header: {match_col}')
                  if col not in header:
                      sys.exit(f'op {i}: column not in header: {col}')
                  match_value = decode(op.get('match_value')).strip()
                  new = decode(op.get('value'))
                  if not match_value:
                      sys.exit(f'op {i}: match_value required')
                  if new == '':
                      sys.exit(f'op {i}: value required')
                  i_match = header.index(match_col)
                  i_col = header.index(col)
                  hits = 0
                  for row in rows[1:]:
                      if not row:
                          continue
                      while len(row) < len(header):
                          row.append('')
                      if row[i_match].strip() == match_value and not row[i_col].strip():
                          row[i_col] = new
                          hits += 1
                  if hits < 1:
                      sys.exit(f'op {i}: found no blank {col} values where {match_col}={match_value!r}')
                  changed.add(path)
                  print(f'filled {hits} blank {col} values in {path} where {match_col}={match_value!r}')
                  continue

              if mode == 'replace_text':
                  col = str(op.get('column') or '').strip()
                  if col not in header:
                      sys.exit(f'op {i}: column not in header: {col}')
                  old = decode(op.get('from'))
                  new = decode(op.get('to'))
                  if not old:
                      sys.exit(f'op {i}: replace_text needs non-empty from')
                  i_col = header.index(col)
                  hits = 0
                  for row in rows[1:]:
                      if not row:
                          continue
                      while len(row) < len(header):
                          row.append('')
                      if old in row[i_col]:
                          row[i_col] = row[i_col].replace(old, new)
                          hits += 1
                  if hits < 1:
                      sys.exit(f'op {i}: replace_text found no matches for {old!r}')
                  changed.add(path)
                  print(f'replaced {old!r} in {hits} rows of {path} column {col}')
                  continue

              if mode == 'delete_where':
                  where = op.get('where')
                  if not isinstance(where, dict) or not where:
                      sys.exit(f'op {i}: delete_where needs where')
                  for col in where:
                      if col not in header:
                          sys.exit(f'op {i}: column not in header: {col}')
                  kept = [header]
                  hits = 0
                  for row in rows[1:]:
                      if not row:
                          continue
                      while len(row) < len(header):
                          row.append('')
                      matched = True
                      for col, val in where.items():
                          if row[header.index(col)] != decode(val):
                              matched = False
                              break
                      if matched:
                          hits += 1
                          continue
                      kept.append(row)
                  if hits < 1:
                      sys.exit(f'op {i}: delete_where found no rows for {where!r}')
                  files[path] = kept
                  changed.add(path)
                  print(f'deleted {hits} rows from {path} where {where}')
                  continue

              if mode == 'delete':
                  kept = [header]
                  hits = 0
                  for row in rows[1:]:
                      if not row:
                          continue
                      if len(row) > i_id and row[i_id] == row_id:
                          hits += 1
                          continue
                      kept.append(row)
                  if hits != 1:
                      sys.exit(f'op {i}: expected 1 row for {row_id!r}, found {hits}')
                  files[path] = kept
                  changed.add(path)
                  print(f'deleted {path} {row_id}')
                  continue

              if mode == 'insert':
                  existing = 0
                  for row in rows[1:]:
                      if row and len(row) > i_id and row[i_id] == row_id:
                          existing += 1
                  allow_duplicate_id = bool(op.get('allow_duplicate_id'))
                  if existing and not allow_duplicate_id:
                      sys.exit(f'op {i}: row already exists: {row_id}')
                  sets = op.get('sets')
                  if not isinstance(sets, dict) or not sets:
                      sys.exit(f'op {i}: insert needs sets')
                  new_row = [''] * len(header)
                  new_row[i_id] = row_id
                  for col, val in sets.items():
                      if col not in header:
                          sys.exit(f'op {i}: column not in header: {col}')
                      new_row[header.index(col)] = decode(val)
                  after = str(op.get('after_row_id') or '').strip()
                  if after:
                      placed = False
                      kept = [header]
                      for row in rows[1:]:
                          kept.append(row)
                          if row and len(row) > i_id and row[i_id] == after:
                              kept.append(new_row)
                              placed = True
                      if not placed:
                          sys.exit(f'op {i}: after_row_id not found: {after}')
                      files[path] = kept
                  else:
                      rows.append(new_row)
                      files[path] = rows
                  changed.add(path)
                  print(f'inserted {path} {row_id}')
                  continue

              if mode != 'update':
                  sys.exit(f'op {i}: unknown mode {mode}')

              sets = op.get('sets')
              if not isinstance(sets, dict) or not sets:
                  sets = {}
                  if op.get('column'):
                      sets[str(op['column'])] = op.get('value', '')
                  if op.get('column_2'):
                      sets[str(op['column_2'])] = op.get('value_2', '')
              if not sets:
                  sys.exit(f'op {i}: update needs sets or column/value')

              hits = 0
              for row in rows[1:]:
                  if not row:
                      continue
                  while len(row) < len(header):
                      row.append('')
                  if row[i_id] != row_id:
                      continue
                  for col, val in sets.items():
                      if col not in header:
                          sys.exit(f'op {i}: column not in header: {col}')
                      row[header.index(col)] = decode(val)
                  hits += 1
              if hits != 1:
                  sys.exit(f'op {i}: expected 1 row for {row_id!r}, found {hits}')
              changed.add(path)
              print(f'updated {path} {row_id} {list(sets)}')

          for path, rows in files.items():
              if path not in changed:
                  continue
              with path.open('w', newline='', encoding='utf-8') as f:
                  csv.writer(f, lineterminator='\n').writerows(rows)
          print('changed', ' '.join(str(p) for p in sorted(changed)))
          PY

      - name: Refresh manifests
        run: python3 scripts/data_schema.py manifest

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- data
          if git diff --cached --quiet; then
            echo "No change"
            exit 0
          fi
          git commit -m "Patch CSV line items"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
