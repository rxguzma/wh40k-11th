name: Patch CSV

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-csv.yml'
  workflow_dispatch:
    inputs:
      patches:
        description: JSON list of operations. One run, one commit.
        required: true
        type: string

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply patches
        env:
          PATCHES: ${{ inputs.patches || '[{"file":"data/nids/Detachment_Definitions.csv","id_column":"Rule_ID","row_id":"tyranids_invasion_fleet_detachment_rule_detachment_rule","column":"Short_Description","value":"Swarming Instincts\u003A Sustain 1\\nHyper-Aggression\u003A Lethal Hits\\nHive Predators\u003A Precision [SUSTAINED HITS 1] [SUSTAINED HITS 1] [LETHAL HITS] [LETHAL HITS] [PRECISION] [PRECISION]"},{"file":"data/nids/Detachment_Definitions.csv","id_column":"Rule_ID","row_id":"tyranids_warrior_bioform_onslaught_detachment_rule_leader_beasts","column":"Short_Description","value":"WARRIORS gain Battleline\\n\\nAlso, WARRIORS, TYRANID PRIME (both types) have a 5+ invulnerable save. [5++ Invul]"},{"file":"data/nids/Detachment_Definitions.csv","id_column":"Rule_ID","row_id":"tyranids_crusher_stampede_detachment_rule_enraged_behemoths","column":"Short_Description","value":"MONSTER\u003A +1 To Hit below Starting Strength; also +1 To Wound below Half. At Starting Strength\u003A +2 OC. [+1 TO HIT] [+1 TO HIT] [+1 TO WOUND] [+1 TO WOUND]"},{"file":"data/nids/Detachment_Definitions.csv","id_column":"Rule_ID","row_id":"tyranids_synaptic_nexus_detachment_rule_synaptic_imperatives","column":"Short_Description","value":"Start battle round, pick ONCE\u003A Synapse units get 5++, +1 Advance and Charge, or MELEE +1 To Hit. [5++ Invul] [+1 ADVANCE] [+1 CHARGE] [+1 TO HIT]"},{"file":"data/nids/Enhancements.csv","id_column":"Enhancement_ID","row_id":"tyranids_invasion_fleet_enhancement_adaptive_biology","column":"Short_Description","value":"FNP 5+. If it starts the turn with less than starting wounds, then FNP 4+. [FNP 5+] [FNP 4+]"},{"file":"data/nids/Enhancements.csv","id_column":"Enhancement_ID","row_id":"tyranids_invasion_fleet_enhancement_alien_cunning","column":"Short_Description","value":"After deployment, up to three units can redeploy. Can also put in Strategic Reserves, regardless of how many units are already in Strategic Reserves. [REDEPLOY 3]"},{"file":"data/nids/Enhancements.csv","id_column":"Enhancement_ID","row_id":"tyranids_subterranean_assault_enhancement_synaptic_strategy","column":"Short_Description","value":"Free Rapid Ingress [INGRESS]"},{"file":"data/nids/Enhancements.csv","id_column":"Enhancement_ID","row_id":"tyranids_subterranean_assault_enhancement_tremor_senses","column":"Short_Description","value":"3 units redeploy or go to reserves. [REDEPLOY 3]"},{"file":"data/nids/Enhancements.csv","id_column":"Enhancement_ID","row_id":"tyranids_subterranean_assault_enhancement_vanguard_intellect","column":"Short_Description","value":"Deepstrike Turn 1 [DEEP STRIKE]"},{"file":"data/nids/Enhancements.csv","id_column":"Enhancement_ID","row_id":"tyranids_talons_of_the_norn_queen_enhancement_synapto_prescience","column":"Short_Description","value":"NORN ASSIMILATOR unit only. This unit has a 4+ invulnerable save. [INVULNERABLE SAVE 4+]"},{"file":"data/nids/Enhancements.csv","id_column":"Enhancement_ID","row_id":"tyranids_vanguard_onslaught_enhancement_chameleonic","column":"Short_Description","value":"VANGUARD INVADER model gets Stealth [STEALTH]"},{"file":"data/nids/Enhancements.csv","id_column":"Enhancement_ID","row_id":"tyranids_vanguard_onslaught_enhancement_stalker","column":"Short_Description","value":"Select Enemy = +1 To Hit and +1 To Wound [+1 TO HIT] [+1 TO HIT] [+1 TO WOUND] [+1 TO WOUND]"},{"file":"data/nids/Enhancements.csv","id_column":"Enhancement_ID","row_id":"tyranids_vanguard_onslaught_enhancement_neuronode","column":"Short_Description","value":"Redeploy units [REDEPLOY 3]"},{"file":"data/nids/Enhancements.csv","id_column":"Enhancement_ID","row_id":"tyranids_warrior_bioform_onslaught_enhancement_elevated_might","column":"Short_Description","value":"TYRANID PRIME model (both types). Melee re‑roll wound rolls and have +1 AP. [RE-ROLL ALL WOUNDS] [+1 AP]"},{"file":"data/nids/Enhancements.csv","id_column":"Enhancement_ID","row_id":"tyranids_warrior_bioform_onslaught_enhancement_ocular_adaptation","column":"Short_Description","value":"TYRANID PRIME model (both types). Melee attacks have +1 to hit rolls. [+1 TO HIT]"},{"file":"data/nids/Stratagems.csv","id_column":"Stratagem_ID","row_id":"tyranids_ambush_predators_stratagem_counterpredation_1cp","column":"Short_Description","value":"FIGHT\u003A Attacks against a hidden unit have +1 Strength and AP. [+1 S] [+1 AP]"},{"file":"data/nids/Stratagems.csv","id_column":"Stratagem_ID","row_id":"tyranids_ambush_predators_stratagem_scanner_gheist_1cp","column":"Short_Description","value":"END OF ENEMY FIGHT\u003A Place one unengaged DEATHLEAPER/LICTOR/NEUROLICTOR unit into strategic reserves. [STRATEGIC RESERVES]"},{"file":"data/nids/Stratagems.csv","id_column":"Stratagem_ID","row_id":"tyranids_invasion_fleet_stratagem_adrenal_surge","column":"Short_Description","value":"2 Units in SYNAPSE\\nCritical Hits on 5+ [CRITS 5+]"},{"file":"data/nids/Stratagems.csv","id_column":"Stratagem_ID","row_id":"tyranids_invasion_fleet_stratagem_death_frenzy","column":"Short_Description","value":"Fight on Death on 4+ [FIGHT ON DEATH 4+]"},{"file":"data/nids/Stratagems.csv","id_column":"Stratagem_ID","row_id":"tyranids_invasion_fleet_stratagem_rapid_regeneration","column":"Short_Description","value":"SYNAPSE FNP 5+\\nOtherwise FNP 6+ [FNP 6+] [FNP 5+]"},{"file":"data/nids/Stratagems.csv","id_column":"Stratagem_ID","row_id":"tyranids_subterranean_assault_stratagem_enfilading_emergence","column":"Short_Description","value":"Reinforcements and get \\nSUSTAINED 1 and IGNORES COVER [SUSTAINED HITS 1] [IGNORES COVER]"},{"file":"data/nids/Stratagems.csv","id_column":"Stratagem_ID","row_id":"tyranids_subterranean_assault_stratagem_tunnel_network","column":"Short_Description","value":"Move from one Tunnel to another.\\nALWAYS AFTER RAPID INGRESS [INGRESS]"},{"file":"data/nids/Stratagems.csv","id_column":"Stratagem_ID","row_id":"tyranids_subterranean_assault_stratagem_swarming_assault","column":"Short_Description","value":"Reinforcements and MONSTERS \\nALL units within 6\" re-roll charges [RE-ROLL CHARGE]"},{"file":"data/nids/Stratagems.csv","id_column":"Stratagem_ID","row_id":"tyranids_subterranean_assault_stratagem_retreat_below","column":"Short_Description","value":"Two BURROWERS or one other unit\\nGo back to Reserves [STRATEGIC RESERVES]"},{"file":"data/nids/Stratagems.csv","id_column":"Stratagem_ID","row_id":"tyranids_talons_of_the_norn_queen_stratagem_catalytic_biofortification_1cp","column":"Short_Description","value":"ANY PHASE\u003A When a NORN ASSIMILATOR suffers a mortal wound, that unit has FNP 4+ against mortal wounds. [FNP 4+]"},{"file":"data/nids/Stratagems.csv","id_column":"Stratagem_ID","row_id":"tyranids_talons_of_the_norn_queen_stratagem_lesser_prey_1cp","column":"Short_Description","value":"FIGHT\u003A When a NORN ASSIMILATOR or NORN EMISSARY unit is selected to fight, its melee attacks have +2 Strength. [+2 S]"},{"file":"data/nids/Stratagems.csv","id_column":"Stratagem_ID","row_id":"tyranids_vanguard_onslaught_stratagem_surprise_assault","column":"Short_Description","value":"Shooting of Fight\\n+1 To Hit & Enemy Battle-shock\\nIf battle-shocked +1 To Wound [+1 TO HIT] [+1 TO HIT]"},{"file":"data/nids/Stratagems.csv","id_column":"Stratagem_ID","row_id":"tyranids_vanguard_onslaught_stratagem_assassin_beasts","column":"Short_Description","value":"Unit gets PRECISION [PRECISION] [PRECISION]"},{"file":"data/nids/Stratagems.csv","id_column":"Stratagem_ID","row_id":"tyranids_vanguard_onslaught_stratagem_unseen_lurkers","column":"Short_Description","value":"Lone Op 18\" or 6\" if already Lone Op [LONE OPERATIVE]"},{"file":"data/nids/Stratagems.csv","id_column":"Stratagem_ID","row_id":"tyranids_vanguard_onslaught_stratagem_invisible_hunter","column":"Short_Description","value":"Return to Reserves [STRATEGIC RESERVES]"},{"file":"data/nids/Stratagems.csv","id_column":"Stratagem_ID","row_id":"tyranids_warrior_bioform_onslaught_stratagem_alien_physiology_1cp","column":"Short_Description","value":"Shooting or Fight\u003A Warriors \\n-1 to wound if Strength is higher Toughness. [INCOMING -1 TO WOUND]"}]' }}
        run: |
          python3 <<'PY'
          import csv, json, os, sys
          from pathlib import Path

          raw = os.environ.get('PATCHES') or ''
          if not raw.strip():
              print('no PATCHES input; skip apply')
              raise SystemExit(0)
          try:
              ops = json.loads(raw)
          except json.JSONDecodeError as e:
              sys.exit(f'patches is not JSON: {e}')
          if not isinstance(ops, list) or not ops:
              sys.exit('patches must be a non-empty JSON list')

          def decode(val):
              if val is None:
                  return ''
              s = str(val)
              return s.replace('\\n', '\n')

          def load_csv(path):
              if path.is_absolute() or '..' in path.parts:
                  sys.exit(f'bad path {path}')
              if not str(path).startswith('data/') or path.suffix.lower() != '.csv':
                  sys.exit(f'file must be a .csv under data/: {path}')
              if not path.is_file():
                  sys.exit(f'missing {path}')
              with path.open(encoding='utf-8', newline='') as f:
                  rows = list(csv.reader(f))
              if not rows:
                  sys.exit(f'empty csv {path}')
              return rows

          files = {}
          changed = set()

          for i, op in enumerate(ops):
              if not isinstance(op, dict):
                  sys.exit(f'op {i} is not an object')
              path = Path(str(op.get('file', '')).strip())
              if path not in files:
                  files[path] = load_csv(path)
              rows = files[path]
              header = rows[0]
              id_col = str(op.get('id_column') or '').strip() or header[0]
              if id_col not in header:
                  sys.exit(f'op {i}: id column not in header: {id_col}')
              i_id = header.index(id_col)
              row_id = str(op.get('row_id') or '').strip()
              if not row_id:
                  sys.exit(f'op {i}: row_id required')
              mode = str(op.get('mode') or 'update').strip()

              if mode == 'add_column':
                  col = str(op.get('column') or '').strip()
                  if not col:
                      sys.exit(f'op {i}: add_column needs column')
                  if col in header:
                      print(f'column already exists {path} {col}')
                      continue
                  after_col = str(op.get('after_column') or '').strip()
                  if after_col and after_col not in header:
                      sys.exit(f'op {i}: after column not in header: {after_col}')
                  insert_at = header.index(after_col) + 1 if after_col else len(header)
                  old_width = len(header)
                  header.insert(insert_at, col)
                  for row in rows[1:]:
                      while len(row) < old_width:
                          row.append('')
                      row.insert(insert_at, '')
                  changed.add(path)
                  print(f'added column {path} {col}')
                  continue

              if mode == 'remove_column':
                  col = str(op.get('column') or '').strip()
                  if not col:
                      sys.exit(f'op {i}: remove_column needs column')
                  if col not in header:
                      sys.exit(f'op {i}: column not in header: {col}')
                  remove_at = header.index(col)
                  header.pop(remove_at)
                  for row in rows[1:]:
                      if len(row) > remove_at:
                          row.pop(remove_at)
                  changed.add(path)
                  print(f'removed column {path} {col}')
                  continue

              if mode == 'dedupe_by_key':
                  key_col = str(op.get('key_column') or '').strip()
                  if key_col not in header:
                      sys.exit(f'op {i}: key column not in header: {key_col}')
                  i_key = header.index(key_col)
                  kept = [header]
                  seen = set()
                  matched = 0
                  removed = 0
                  for row in rows[1:]:
                      if not row:
                          continue
                      while len(row) < len(header):
                          row.append('')
                      if row[i_id] != row_id:
                          kept.append(row)
                          continue
                      matched += 1
                      key = row[i_key].strip()
                      if not key:
                          sys.exit(f'op {i}: blank {key_col} while deduping {row_id!r}')
                      if key in seen:
                          removed += 1
                          continue
                      seen.add(key)
                      kept.append(row)
                  if matched < 1:
                      sys.exit(f'op {i}: found no rows for {row_id!r}')
                  if removed < 1:
                      sys.exit(f'op {i}: found no duplicate rows for {row_id!r}')
                  files[path] = kept
                  changed.add(path)
                  print(f'deduped {path} {row_id}: kept {len(seen)} unique {key_col} values, removed {removed} duplicates')
                  continue

              if mode == 'fill_blank_where':
                  match_col = str(op.get('match_column') or '').strip()
                  col = str(op.get('column') or '').strip()
                  if match_col not in header:
                      sys.exit(f'op {i}: match column not in header: {match_col}')
                  if col not in header:
                      sys.exit(f'op {i}: column not in header: {col}')
                  match_value = decode(op.get('match_value')).strip()
                  new = decode(op.get('value'))
                  if not match_value:
                      sys.exit(f'op {i}: match_value required')
                  if new == '':
                      sys.exit(f'op {i}: value required')
                  i_match = header.index(match_col)
                  i_col = header.index(col)
                  hits = 0
                  for row in rows[1:]:
                      if not row:
                          continue
                      while len(row) < len(header):
                          row.append('')
                      if row[i_match].strip() == match_value and not row[i_col].strip():
                          row[i_col] = new
                          hits += 1
                  if hits < 1:
                      sys.exit(f'op {i}: found no blank {col} values where {match_col}={match_value!r}')
                  changed.add(path)
                  print(f'filled {hits} blank {col} values in {path} where {match_col}={match_value!r}')
                  continue

              if mode == 'replace_text':
                  col = str(op.get('column') or '').strip()
                  if col not in header:
                      sys.exit(f'op {i}: column not in header: {col}')
                  old = decode(op.get('from'))
                  new = decode(op.get('to'))
                  if not old:
                      sys.exit(f'op {i}: replace_text needs non-empty from')
                  i_col = header.index(col)
                  hits = 0
                  for row in rows[1:]:
                      if not row:
                          continue
                      while len(row) < len(header):
                          row.append('')
                      if old in row[i_col]:
                          row[i_col] = row[i_col].replace(old, new)
                          hits += 1
                  if hits < 1:
                      sys.exit(f'op {i}: replace_text found no matches for {old!r}')
                  changed.add(path)
                  print(f'replaced {old!r} in {hits} rows of {path} column {col}')
                  continue

              if mode == 'delete':
                  kept = [header]
                  hits = 0
                  for row in rows[1:]:
                      if not row:
                          continue
                      if len(row) > i_id and row[i_id] == row_id:
                          hits += 1
                          continue
                      kept.append(row)
                  if hits != 1:
                      sys.exit(f'op {i}: expected 1 row for {row_id!r}, found {hits}')
                  files[path] = kept
                  changed.add(path)
                  print(f'deleted {path} {row_id}')
                  continue

              if mode == 'insert':
                  existing = 0
                  for row in rows[1:]:
                      if row and len(row) > i_id and row[i_id] == row_id:
                          existing += 1
                  if existing:
                      sys.exit(f'op {i}: row already exists: {row_id}')
                  sets = op.get('sets')
                  if not isinstance(sets, dict) or not sets:
                      sys.exit(f'op {i}: insert needs sets')
                  new_row = [''] * len(header)
                  new_row[i_id] = row_id
                  for col, val in sets.items():
                      if col not in header:
                          sys.exit(f'op {i}: column not in header: {col}')
                      new_row[header.index(col)] = decode(val)
                  after = str(op.get('after_row_id') or '').strip()
                  if after:
                      placed = False
                      kept = [header]
                      for row in rows[1:]:
                          kept.append(row)
                          if row and len(row) > i_id and row[i_id] == after:
                              kept.append(new_row)
                              placed = True
                      if not placed:
                          sys.exit(f'op {i}: after_row_id not found: {after}')
                      files[path] = kept
                  else:
                      rows.append(new_row)
                      files[path] = rows
                  changed.add(path)
                  print(f'inserted {path} {row_id}')
                  continue

              if mode != 'update':
                  sys.exit(f'op {i}: unknown mode {mode}')

              sets = op.get('sets')
              if not isinstance(sets, dict) or not sets:
                  sets = {}
                  if op.get('column'):
                      sets[str(op['column'])] = op.get('value', '')
                  if op.get('column_2'):
                      sets[str(op['column_2'])] = op.get('value_2', '')
              if not sets:
                  sys.exit(f'op {i}: update needs sets or column/value')

              hits = 0
              for row in rows[1:]:
                  if not row:
                      continue
                  while len(row) < len(header):
                      row.append('')
                  if row[i_id] != row_id:
                      continue
                  for col, val in sets.items():
                      if col not in header:
                          sys.exit(f'op {i}: column not in header: {col}')
                      row[header.index(col)] = decode(val)
                  hits += 1
              if hits != 1:
                  sys.exit(f'op {i}: expected 1 row for {row_id!r}, found {hits}')
              changed.add(path)
              print(f'updated {path} {row_id} {list(sets)}')

          for path, rows in files.items():
              if path not in changed:
                  continue
              with path.open('w', newline='', encoding='utf-8') as f:
                  csv.writer(f, lineterminator='\n').writerows(rows)
          print('changed', ' '.join(str(p) for p in sorted(changed)))
          PY

      - name: Refresh manifests
        run: python3 scripts/data_schema.py manifest

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- data
          if git diff --cached --quiet; then
            echo "No change"
            exit 0
          fi
          git commit -m "Patch CSV line items"
          git push
