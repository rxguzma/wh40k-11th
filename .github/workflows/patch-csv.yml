d_column":"Layout_Row_ID","row_id":"KORSARRO_KHAN_WEAPON_3","mode":"insert","sets":{"Unit_ID":"KORSARRO_KHAN","Weapon_ID":"KORSARRO_KHAN_MOONFANG","Row_Type":"WEAPON","Row_Label":"","Sort_Order":"3","Quantity":"1"}},{"file":"data/marines/Abilities.csv","id_column":"Ability_ID","row_id":"KORSARRO_KHAN_TROPHY_TAKER","mode":"insert","sets":{"Ability Name":"Trophy Taker","Short_Description":"vs CHARACTER\u003a RE-ROLL HIT 1S / WOUND 1S","Long_Description":"This unit\u2019s attacks that target a CHARACTER unit can\u003a\n\u2022 Re-roll hit rolls of 1.\n\u2022 Re-roll wound rolls of 1.","Tags":"","Tag Categories":"","Order":"0","Visibility_ID":"1","Default_Active":"1"}},{"file":"data/marines/Abilities.csv","id_column":"Ability_ID","row_id":"KORSARRO_KHAN_FOR_THE_KHAN","mode":"insert","sets":{"Ability Name":"For the Khan!","Short_Description":"RANGED\u003a ASSAULT\nMELEE\u003a LANCE","Long_Description":"\u2022 This unit\u2019s ranged attacks have [ASSAULT].\n\u2022 This unit\u2019s melee attacks have [LANCE].","Tags":"","Tag Categories":"","Order":"0","Visibility_ID":"1","Default_Active":"1"}},{"file":"data/marines/Abilities.csv","id_column":"Ability_ID","row_id":"KORSARRO_KHAN_UNIT_COMPOSITION","mode":"insert","sets":{"Ability Name":"Unit Composition","Short_Description":"1 Kor\u2019sarro Khan model\nEquipped\u003a 1 Anzuq; 1 Bolt Pistol; 1 Moonfang","Long_Description":"1 Kor\u2019sarro Khan model.\n\nThis model is equipped with\u003a 1 Anzuq; 1 Bolt Pistol; 1 Moonfang.","Tags":"","Tag Categories":"","Order":"9","Visibility_ID":"3","Default_Active":"0"}},{"file":"data/marines/Unit_Abilities.csv","id_column":"Ability_ID","row_id":"KORSARRO_KHAN_TROPHY_TAKER","mode":"insert","sets":{"Unit_ID":"KORSARRO_KHAN","Ability_Type":"ABILITY"}},{"file":"data/marines/Unit_Abilities.csv","id_column":"Ability_ID","row_id":"KORSARRO_KHAN_FOR_THE_KHAN","mode":"insert","sets":{"Unit_ID":"KORSARRO_KHAN","Ability_Type":"ABILITY"}},{"file":"data/marines/Unit_Abilities.csv","id_column":"Ability_ID","row_id":"KORSARRO_KHAN_UNIT_COMPOSITION","mode":"insert","sets":{"Unit_ID":"KORSARRO_KHAN","Ability_Type":"ABILITY"}},{"file":"data/marines/Unit_Abilities.csv","id_column":"Ability_ID","row_id":"KORSARRO_KHAN__CORE_LEADER_TMP","mode":"insert","sets":{"Unit_ID":"KORSARRO_KHAN","Ability_ID":"LEADER","Ability_Type":"CORE_ABILITY"}},{"file":"data/marines/Unit_Profiles.csv","id_column":"Unit_ID","row_id":"SUBODEN_KHAN","mode":"insert","sets":{"Unit Name":"Suboden Khan","M\"":"12\"","T":"6","SV":"3+/4++","W":"8","LD":"6+","OC":"2","Keywords":"MOUNTED, CAPTAIN, CHARACTER, EPIC HERO, EXPLOSIVES, IMPERIUM, ADEPTUS ASTARTES, WHITE SCARS","Hyperlink":""}},{"file":"data/marines/Weapon_Stats.csv","id_column":"Weapon_ID","row_id":"SUBODEN_KHAN_HEAVY_BOLT_PISTOL","mode":"insert","sets":{"Weapon Name":"Heavy Bolt Pistol","R\"":"18\"","A":"1","WS":"2+","St":"5","AP":"-1","D":"1"}},{"file":"data/marines/Weapon_Stats.csv","id_column":"Weapon_ID","row_id":"SUBODEN_KHAN_ONSLAUGHT_GATLING_CANNON","mode":"insert","sets":{"Weapon Name":"Onslaught Gatling Cannon","R\"":"24\"","A":"8","WS":"2+","St":"5","AP":"-1","D":"1"}},{"file":"data/marines/Weapon_Stats.csv","id_column":"Weapon_ID","row_id":"SUBODEN_KHAN_POWER_SWORD","mode":"insert","sets":{"Weapon Name":"Power Sword","R\"":"-","A":"3","WS":"2+","St":"5","AP":"-2","D":"1"}},{"file":"data/marines/Weapon_Stats.csv","id_column":"Weapon_ID","row_id":"SUBODEN_KHAN_STORMTOOTH","mode":"insert","sets":{"Weapon Name":"Stormtooth","R\"":"-","A":"6","WS":"2+","St":"7","AP":"-3","D":"2"}},{"file":"data/marines/Weapon_Abilities.csv","id_column":"Weapon_Ability_ID","row_id":"SUBODEN_KHAN_HEAVY_BOLT_PISTOL\u003aability_1","mode":"insert","sets":{"Weapon_ID":"SUBODEN_KHAN_HEAVY_BOLT_PISTOL","Ability_Type":"CLOSE-QUARTERS","Target":"","Value":"","Condition":"","Separator_Before":"","Sort_Order":"1"}},{"file":"data/marines/Weapon_Abilities.csv","id_column":"Weapon_Ability_ID","row_id":"SUBODEN_KHAN_ONSLAUGHT_GATLING_CANNON\u003aability_1","mode":"insert","sets":{"Weapon_ID":"SUBODEN_KHAN_ONSLAUGHT_GATLING_CANNON","Ability_Type":"DEVASTATING WOUNDS\u003a non-MONSTER/VEHICLE","Target":"","Value":"","Condition":"","Separator_Before":"","Sort_Order":"1"}},{"file":"data/marines/Weapon_Abilities.csv","id_column":"Weapon_Ability_ID","row_id":"SUBODEN_KHAN_POWER_SWORD\u003aability_1","mode":"insert","sets":{"Weapon_ID":"SUBODEN_KHAN_POWER_SWORD","Ability_Type":"EXTRA ATTACKS","Target":"","Value":"","Condition":"","Separator_Before":"","Sort_Order":"1"}},{"file":"data/marines/Weapon_Abilities.csv","id_column":"Weapon_Ability_ID","row_id":"SUBODEN_KHAN_POWER_SWORD\u003aability_2","mode":"insert","sets":{"Weapon_ID":"SUBODEN_KHAN_POWER_SWORD","Ability_Type":"SUSTAINED HITS 1\u003a non-MONSTER/VEHICLE","Target":"","Value":"","Condition":"","Separator_Before":", ","Sort_Order":"2"}},{"file":"data/marines/Weapon_Abilities.csv","id_column":"Weapon_Ability_ID","row_id":"SUBODEN_KHAN_STORMTOOTH\u003aability_1","mode":"insert","sets":{"Weapon_ID":"SUBODEN_KHAN_STORMTOOTH","Ability_Type":"ANTI-MONSTER/VEHICLE","Target":"","Value":"4+","Condition":"","Separator_Before":"","Sort_Order":"1"}},{"file":"data/marines/Weapon_Abilities.csv","id_column":"Weapon_Ability_ID","row_id":"SUBODEN_KHAN_STORMTOOTH\u003aability_2","mode":"insert","sets":{"Weapon_ID":"SUBODEN_KHAN_STORMTOOTH","Ability_Type":"LANCE","Target":"","Value":"","Condition":"","Separator_Before":", ","Sort_Order":"2"}},{"file":"data/marines/Unit_Weapons.csv","id_column":"Layout_Row_ID","row_id":"SUBODEN_KHAN_WEAPON_1","mode":"insert","sets":{"Unit_ID":"SUBODEN_KHAN","Weapon_ID":"SUBODEN_KHAN_HEAVY_BOLT_PISTOL","Row_Type":"WEAPON","Row_Label":"","Sort_Order":"1","Quantity":"1"}},{"file":"data/marines/Unit_Weapons.csv","id_column":"Layout_Row_ID","row_id":"SUBODEN_KHAN_WEAPON_2","mode":"insert","sets":{"Unit_ID":"SUBODEN_KHAN","Weapon_ID":"SUBODEN_KHAN_ONSLAUGHT_GATLING_CANNON","Row_Type":"WEAPON","Row_Label":"","Sort_Order":"2","Quantity":"1"}},{"file":"data/marines/Unit_Weapons.csv","id_column":"Layout_Row_ID","row_id":"SUBODEN_KHAN_WEAPON_3","mode":"insert","sets":{"Unit_ID":"SUBODEN_KHAN","Weapon_ID":"SUBODEN_KHAN_POWER_SWORD","Row_Type":"WEAPON","Row_Label":"","Sort_Order":"3","Quantity":"1"}},{"file":"data/marines/Unit_Weapons.csv","id_column":"Layout_Row_ID","row_id":"SUBODEN_KHAN_WEAPON_4","mode":"insert","sets":{"Unit_ID":"SUBODEN_KHAN","Weapon_ID":"SUBODEN_KHAN_STORMTOOTH","Row_Type":"WEAPON","Row_Label":"","Sort_Order":"4","Quantity":"1"}},{"file":"data/marines/Abilities.csv","id_column":"Ability_ID","row_id":"SUBODEN_KHAN_SPEAR_OF_CHOGORIS","mode":"insert","sets":{"Ability Name":"Spear of Chogoris","Short_Description":"RANGED\u003a ASSAULT\nADVANCE\u003a eligible to CHARGE\nASSAULT DOCTRINE\u003a +1 ADVANCE / CHARGE","Long_Description":"\u2022 This unit\u2019s ranged attacks have [ASSAULT].\n\u2022 When this unit is selected to make an advance move, that advance move does not prevent this unit from being eligible to declare a charge.\n\u2022 If the assault doctrine is active for this unit, this unit has +1 to advance and charge rolls.","Tags":"","Tag Categories":"","Order":"0","Visibility_ID":"1","Default_Active":"1"}},{"file":"data/marines/Abilities.csv","id_column":"Ability_ID","row_id":"SUBODEN_KHAN_SKILLED_RIDERS","mode":"insert","sets":{"Ability Name":"Skilled Riders","Short_Description":"MOBILE","Long_Description":"This unit has MOBILE.","Tags":"","Tag Categories":"","Order":"0","Visibility_ID":"1","Default_Active":"1"}},{"file":"data/marines/Abilities.csv","id_column":"Ability_ID","row_id":"SUBODEN_KHAN_UNIT_COMPOSITION","mode":"insert","sets":{"Ability Name":"Unit Composition","Short_Description":"1 Suboden Khan model\nEquipped\u003a 1 Heavy Bolt Pistol; 1 Onslaught Gatling Cannon; 1 Power Sword; 1 Stormtooth","Long_Description":"1 Suboden Khan model.\n\nThis model is equipped with\u003a 1 Heavy Bolt Pistol; 1 Onslaught Gatling Cannon; 1 Power Sword; 1 Stormtooth.","Tags":"","Tag Categories":"","Order":"9","Visibility_ID":"3","Default_Active":"0"}},{"file":"data/marines/Unit_Abilities.csv","id_column":"Ability_ID","row_id":"SUBODEN_KHAN_SPEAR_OF_CHOGORIS","mode":"insert","sets":{"Unit_ID":"SUBODEN_KHAN","Ability_Type":"ABILITY"}},{"file":"data/marines/Unit_Abilities.csv","id_column":"Ability_ID","row_id":"SUBODEN_KHAN_SKILLED_RIDERS","mode":"insert","sets":{"Unit_ID":"SUBODEN_KHAN","Ability_Type":"ABILITY"}},{"file":"data/marines/Unit_Abilities.csv","id_column":"Ability_ID","row_id":"SUBODEN_KHAN_UNIT_COMPOSITION","mode":"insert","sets":{"Unit_ID":"SUBODEN_KHAN","Ability_Type":"ABILITY"}},{"file":"data/marines/Unit_Abilities.csv","id_column":"Ability_ID","row_id":"SUBODEN_KHAN__CORE_LEADER_TMP","mode":"insert","sets":{"Unit_ID":"SUBODEN_KHAN","Ability_ID":"LEADER","Ability_Type":"CORE_ABILITY"}}]' }}
        run: |
          python3 <<'PY'
          import csv, json, os, sys
          from pathlib import Path

          raw = os.environ.get('PATCHES') or ''
          if not raw.strip():
              print('no PATCHES input; skip apply')
              raise SystemExit(0)
          try:
              ops = json.loads(raw)
          except json.JSONDecodeError as e:
              sys.exit(f'patches is not JSON: {e}')
          if not isinstance(ops, list) or not ops:
              sys.exit('patches must be a non-empty JSON list')

          def decode(val):
              if val is None:
                  return ''
              s = str(val)
              return s.replace('\\n', '\n')

          def load_csv(path):
              if path.is_absolute() or '..' in path.parts:
                  sys.exit(f'bad path {path}')
              if not str(path).startswith('data/') or path.suffix.lower() != '.csv':
                  sys.exit(f'file must be a .csv under data/: {path}')
              if not path.is_file():
                  sys.exit(f'missing {path}')
              with path.open(encoding='utf-8', newline='') as f:
                  rows = list(csv.reader(f))
              if not rows:
                  sys.exit(f'empty csv {path}')
              return rows

          files = {}
          changed = set()

          for i, op in enumerate(ops):
              if not isinstance(op, dict):
                  sys.exit(f'op {i} is not an object')
              path = Path(str(op.get('file', '')).strip())
              if path not in files:
                  files[path] = load_csv(path)
              rows = files[path]
              header = rows[0]
              id_col = str(op.get('id_column') or '').strip() or header[0]
              if id_col not in header:
                  sys.exit(f'op {i}: id column not in header: {id_col}')
              i_id = header.index(id_col)
              row_id = str(op.get('row_id') or '').strip()
              if not row_id:
                  sys.exit(f'op {i}: row_id required')
              mode = str(op.get('mode') or 'update').strip()

              if mode == 'add_column':
                  col = str(op.get('column') or '').strip()
                  if not col:
                      sys.exit(f'op {i}: add_column needs column')
                  if col in header:
                      print(f'column already exists {path} {col}')
                      continue
                  after_col = str(op.get('after_column') or '').strip()
                  if after_col and after_col not in header:
                      sys.exit(f'op {i}: after column not in header: {after_col}')
                  insert_at = header.index(after_col) + 1 if after_col else len(header)
                  old_width = len(header)
                  header.insert(insert_at, col)
                  for row in rows[1:]:
                      while len(row) < old_width:
                          row.append('')
                      row.insert(insert_at, '')
                  changed.add(path)
                  print(f'added column {path} {col}')
                  continue

              if mode == 'remove_column':
                  col = str(op.get('column') or '').strip()
                  if not col:
                      sys.exit(f'op {i}: remove_column needs column')
                  if col not in header:
                      sys.exit(f'op {i}: column not in header: {col}')
                  remove_at = header.index(col)
                  header.pop(remove_at)
                  for row in rows[1:]:
                      if len(row) > remove_at:
                          row.pop(remove_at)
                  changed.add(path)
                  print(f'removed column {path} {col}')
                  continue

              if mode == 'dedupe_by_key':
                  key_col = str(op.get('key_column') or '').strip()
                  if key_col not in header:
                      sys.exit(f'op {i}: key column not in header: {key_col}')
                  i_key = header.index(key_col)
                  kept = [header]
                  seen = set()
                  matched = 0
                  removed = 0
                  for row in rows[1:]:
                      if not row:
                          continue
                      while len(row) < len(header):
                          row.append('')
                      if row[i_id] != row_id:
                          kept.append(row)
                          continue
                      matched += 1
                      key = row[i_key].strip()
                      if not key:
                          sys.exit(f'op {i}: blank {key_col} while deduping {row_id!r}')
                      if key in seen:
                          removed += 1
                          continue
                      seen.add(key)
                      kept.append(row)
                  if matched < 1:
                      sys.exit(f'op {i}: found no rows for {row_id!r}')
                  if removed < 1:
                      sys.exit(f'op {i}: found no duplicate rows for {row_id!r}')
                  files[path] = kept
                  changed.add(path)
                  print(f'deduped {path} {row_id}: kept {len(seen)} unique {key_col} values, removed {removed} duplicates')
                  continue

              if mode == 'fill_blank_where':
                  match_col = str(op.get('match_column') or '').strip()
                  col = str(op.get('column') or '').strip()
                  if match_col not in header:
                      sys.exit(f'op {i}: match column not in header: {match_col}')
                  if col not in header:
                      sys.exit(f'op {i}: column not in header: {col}')
                  match_value = decode(op.get('match_value')).strip()
                  new = decode(op.get('value'))
                  if not match_value:
                      sys.exit(f'op {i}: match_value required')
                  if new == '':
                      sys.exit(f'op {i}: value required')
                  i_match = header.index(match_col)
                  i_col = header.index(col)
                  hits = 0
                  for row in rows[1:]:
                      if not row:
                          continue
                      while len(row) < len(header):
                          row.append('')
                      if row[i_match].strip() == match_value and not row[i_col].strip():
                          row[i_col] = new
                          hits += 1
                  if hits < 1:
                      sys.exit(f'op {i}: found no blank {col} values where {match_col}={match_value!r}')
                  changed.add(path)
                  print(f'filled {hits} blank {col} values in {path} where {match_col}={match_value!r}')
                  continue

              if mode == 'replace_text':
                  col = str(op.get('column') or '').strip()
                  if col not in header:
                      sys.exit(f'op {i}: column not in header: {col}')
                  old = decode(op.get('from'))
                  new = decode(op.get('to'))
                  if not old:
                      sys.exit(f'op {i}: replace_text needs non-empty from')
                  i_col = header.index(col)
                  hits = 0
                  for row in rows[1:]:
                      if not row:
                          continue
                      while len(row) < len(header):
                          row.append('')
                      if old in row[i_col]:
                          row[i_col] = row[i_col].replace(old, new)
                          hits += 1
                  if hits < 1:
                      sys.exit(f'op {i}: replace_text found no matches for {old!r}')
                  changed.add(path)
                  print(f'replaced {old!r} in {hits} rows of {path} column {col}')
                  continue

              if mode == 'delete':
                  kept = [header]
                  hits = 0
                  for row in rows[1:]:
                      if not row:
                          continue
                      if len(row) > i_id and row[i_id] == row_id:
                          hits += 1
                          continue
                      kept.append(row)
                  if hits != 1:
                      sys.exit(f'op {i}: expected 1 row for {row_id!r}, found {hits}')
                  files[path] = kept
                  changed.add(path)
                  print(f'deleted {path} {row_id}')
                  continue

              if mode == 'insert':
                  existing = 0
                  for row in rows[1:]:
                      if row and len(row) > i_id and row[i_id] == row_id:
                          existing += 1
                  if existing:
                      sys.exit(f'op {i}: row already exists: {row_id}')
                  sets = op.get('sets')
                  if not isinstance(sets, dict) or not sets:
                      sys.exit(f'op {i}: insert needs sets')
                  new_row = [''] * len(header)
                  new_row[i_id] = row_id
                  for col, val in sets.items():
                      if col not in header:
                          sys.exit(f'op {i}: column not in header: {col}')
                      new_row[header.index(col)] = decode(val)
                  after = str(op.get('after_row_id') or '').strip()
                  if after:
                      placed = False
                      kept = [header]
                      for row in rows[1:]:
                          kept.append(row)
                          if row and len(row) > i_id and row[i_id] == after:
                              kept.append(new_row)
                              placed = True
                      if not placed:
                          sys.exit(f'op {i}: after_row_id not found: {after}')
                      files[path] = kept
                  else:
                      rows.append(new_row)
                      files[path] = rows
                  changed.add(path)
                  print(f'inserted {path} {row_id}')
                  continue

              if mode != 'update':
                  sys.exit(f'op {i}: unknown mode {mode}')

              sets = op.get('sets')
              if not isinstance(sets, dict) or not sets:
                  sets = {}
                  if op.get('column'):
                      sets[str(op['column'])] = op.get('value', '')
                  if op.get('column_2'):
                      sets[str(op['column_2'])] = op.get('value_2', '')
              if not sets:
                  sys.exit(f'op {i}: update needs sets or column/value')

              hits = 0
              for row in rows[1:]:
                  if not row:
                      continue
                  while len(row) < len(header):
                      row.append('')
                  if row[i_id] != row_id:
                      continue
                  for col, val in sets.items():
                      if col not in header:
                          sys.exit(f'op {i}: column not in header: {col}')
                      row[header.index(col)] = decode(val)
                  hits += 1
              if hits != 1:
                  sys.exit(f'op {i}: expected 1 row for {row_id!r}, found {hits}')
              changed.add(path)
              print(f'updated {path} {row_id} {list(sets)}')

          for path, rows in files.items():
              if path not in changed:
                  continue
              with path.open('w', newline='', encoding='utf-8') as f:
                  csv.writer(f, lineterminator='\n').writerows(rows)
          print('changed', ' '.join(str(p) for p in sorted(changed)))
          PY

