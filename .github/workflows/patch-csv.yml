name: Patch CSV

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-csv.yml'
  workflow_dispatch:
    inputs:
      patches:
        description: JSON list of operations. One run, one commit.
        required: true
        type: string

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply patches
        env:
          PATCHES: ${{ inputs.patches || '[{"file":"data/marines/Unit_Weapons.csv","id_column":"Unit_ID","row_id":"*","mode":"delete_where","where":{"Unit_ID":"REDEMPTOR_PLASMA"}},{"file":"data/marines/Unit_Weapons.csv","id_column":"Layout_Row_ID","row_id":"REDEMPTOR__FRAGSTORM","mode":"insert","sets":{"Unit_ID":"REDEMPTOR_PLASMA","Weapon_ID":"FRAGSTORM_GRENADE_LAUNCHER","Row_Type":"WEAPON","Row_Label":"","Sort_Order":"10","Quantity":"1"}},{"file":"data/marines/Unit_Weapons.csv","id_column":"Layout_Row_ID","row_id":"REDEMPTOR__HEAVY_FLAMER","mode":"insert","sets":{"Unit_ID":"REDEMPTOR_PLASMA","Weapon_ID":"HEAVY_FLAMER_DEATHWING_TERMINATORS","Row_Type":"WEAPON","Row_Label":"","Sort_Order":"20","Quantity":"1"}},{"file":"data/marines/Unit_Weapons.csv","id_column":"Layout_Row_ID","row_id":"REDEMPTOR__HEAVY_ONSLAUGHT","mode":"insert","sets":{"Unit_ID":"REDEMPTOR_PLASMA","Weapon_ID":"HEAVY_ONSLAUGHT_GATLING_CANNON","Row_Type":"WEAPON","Row_Label":"","Sort_Order":"30","Quantity":"1"}},{"file":"data/marines/Unit_Weapons.csv","id_column":"Layout_Row_ID","row_id":"REDEMPTOR__FIST","mode":"insert","sets":{"Unit_ID":"REDEMPTOR_PLASMA","Weapon_ID":"REDEMPTOR_FIST","Row_Type":"WEAPON","Row_Label":"","Sort_Order":"40","Quantity":"1"}},{"file":"data/marines/Loadout_Options.csv","id_column":"Loadout_Option_ID","row_id":"REDEMPTOR_PLASMA__REDEMPTOR_MAIN_GUN__REDEMPTOR_MACRO_PLASMA","mode":"update","sets":{"Option_Name":"Macro Plasma Incinerator","Default":"FALSE","Sort_Order":"2","Allocation_Mode":"UNIT"}},{"file":"data/marines/Loadout_Options.csv","id_column":"Loadout_Option_ID","row_id":"REDEMPTOR_PLASMA__REDEMPTOR_MAIN_GUN__REDEMPTOR_HEAVY_ONSLAUGHT","mode":"update","sets":{"Option_Name":"Heavy Onslaught Gatling Cannon","Default":"TRUE","Sort_Order":"1","Allocation_Mode":"UNIT"}},{"file":"data/marines/Loadout_Weapons.csv","id_column":"Loadout_Option_ID","row_id":"*","mode":"delete_where","where":{"Loadout_Option_ID":"REDEMPTOR_PLASMA__REDEMPTOR_MAIN_GUN__REDEMPTOR_MACRO_PLASMA"}},{"file":"data/marines/Loadout_Weapons.csv","id_column":"Loadout_Option_ID","row_id":"*","mode":"delete_where","where":{"Loadout_Option_ID":"REDEMPTOR_PLASMA__REDEMPTOR_MAIN_GUN__REDEMPTOR_HEAVY_ONSLAUGHT"}},{"file":"data/marines/Loadout_Weapons.csv","id_column":"Mapping_ID","row_id":"REDEMPTOR_MAIN_HEAVY","mode":"insert","sets":{"Loadout_Option_ID":"REDEMPTOR_PLASMA__REDEMPTOR_MAIN_GUN__REDEMPTOR_HEAVY_ONSLAUGHT","Weapon_ID":"HEAVY_ONSLAUGHT_GATLING_CANNON","Weapon_Role":"SELECTED","Sort_Order":"1"}},{"file":"data/marines/Loadout_Weapons.csv","id_column":"Mapping_ID","row_id":"REDEMPTOR_MAIN_HEAVY_FIST","mode":"insert","sets":{"Loadout_Option_ID":"REDEMPTOR_PLASMA__REDEMPTOR_MAIN_GUN__REDEMPTOR_HEAVY_ONSLAUGHT","Weapon_ID":"REDEMPTOR_FIST","Weapon_Role":"PRESERVE","Sort_Order":"90"}},{"file":"data/marines/Loadout_Weapons.csv","id_column":"Mapping_ID","row_id":"REDEMPTOR_MAIN_PLASMA_STD","mode":"insert","sets":{"Loadout_Option_ID":"REDEMPTOR_PLASMA__REDEMPTOR_MAIN_GUN__REDEMPTOR_MACRO_PLASMA","Weapon_ID":"MACRO_PLASMA_INCINERATOR_STANDARD","Weapon_Role":"SELECTED","Sort_Order":"1"}},{"file":"data/marines/Loadout_Weapons.csv","id_column":"Mapping_ID","row_id":"REDEMPTOR_MAIN_PLASMA_SUPER","mode":"insert","sets":{"Loadout_Option_ID":"REDEMPTOR_PLASMA__REDEMPTOR_MAIN_GUN__REDEMPTOR_MACRO_PLASMA","Weapon_ID":"MACRO_PLASMA_INCINERATOR_SUPERCHARGE","Weapon_Role":"SELECTED","Sort_Order":"2"}},{"file":"data/marines/Loadout_Weapons.csv","id_column":"Mapping_ID","row_id":"REDEMPTOR_MAIN_PLASMA_FIST","mode":"insert","sets":{"Loadout_Option_ID":"REDEMPTOR_PLASMA__REDEMPTOR_MAIN_GUN__REDEMPTOR_MACRO_PLASMA","Weapon_ID":"REDEMPTOR_FIST","Weapon_Role":"PRESERVE","Sort_Order":"90"}},{"file":"data/marines/Loadout_Options.csv","id_column":"Loadout_Option_ID","row_id":"REDEMPTOR__AUX_GUN__FRAGSTORM","mode":"insert","sets":{"Unit_ID":"REDEMPTOR_PLASMA","Option_Group_ID":"AUX_GUN","Group_Label":"Auxiliary Gun","Option_ID":"FRAGSTORM","Option_Name":"Fragstorm Grenade Launchers","Default":"TRUE","Sort_Order":"1","Allocation_Mode":"UNIT","Allocation_Count":"","Max_Per_Unit":"1","Points_Per_Model":""}},{"file":"data/marines/Loadout_Options.csv","id_column":"Loadout_Option_ID","row_id":"REDEMPTOR__AUX_GUN__STORM_BOLTERS","mode":"insert","sets":{"Unit_ID":"REDEMPTOR_PLASMA","Option_Group_ID":"AUX_GUN","Group_Label":"Auxiliary Gun","Option_ID":"STORM_BOLTERS","Option_Name":"Storm Bolters","Default":"FALSE","Sort_Order":"2","Allocation_Mode":"UNIT","Allocation_Count":"","Max_Per_Unit":"1","Points_Per_Model":""}},{"file":"data/marines/Loadout_Weapons.csv","id_column":"Mapping_ID","row_id":"REDEMPTOR_AUX_FRAG","mode":"insert","sets":{"Loadout_Option_ID":"REDEMPTOR__AUX_GUN__FRAGSTORM","Weapon_ID":"FRAGSTORM_GRENADE_LAUNCHER","Weapon_Role":"SELECTED","Sort_Order":"1"}},{"file":"data/marines/Loadout_Weapons.csv","id_column":"Mapping_ID","row_id":"REDEMPTOR_AUX_STORM","mode":"insert","sets":{"Loadout_Option_ID":"REDEMPTOR__AUX_GUN__STORM_BOLTERS","Weapon_ID":"IMPULSOR_STORM_BOLTERS","Weapon_Role":"SELECTED","Sort_Order":"1"}},{"file":"data/marines/Loadout_Options.csv","id_column":"Loadout_Option_ID","row_id":"REDEMPTOR__SECONDARY__HEAVY_FLAMER","mode":"insert","sets":{"Unit_ID":"REDEMPTOR_PLASMA","Option_Group_ID":"SECONDARY","Group_Label":"Secondary Weapon","Option_ID":"HEAVY_FLAMER","Option_Name":"Heavy Flamer","Default":"TRUE","Sort_Order":"1","Allocation_Mode":"UNIT","Allocation_Count":"","Max_Per_Unit":"1","Points_Per_Model":""}},{"file":"data/marines/Loadout_Options.csv","id_column":"Loadout_Option_ID","row_id":"REDEMPTOR__SECONDARY__ONSLAUGHT","mode":"insert","sets":{"Unit_ID":"REDEMPTOR_PLASMA","Option_Group_ID":"SECONDARY","Group_Label":"Secondary Weapon","Option_ID":"ONSLAUGHT","Option_Name":"Onslaught Gatling Cannon","Default":"FALSE","Sort_Order":"2","Allocation_Mode":"UNIT","Allocation_Count":"","Max_Per_Unit":"1","Points_Per_Model":""}},{"file":"data/marines/Loadout_Weapons.csv","id_column":"Mapping_ID","row_id":"REDEMPTOR_SECONDARY_FLAMER","mode":"insert","sets":{"Loadout_Option_ID":"REDEMPTOR__SECONDARY__HEAVY_FLAMER","Weapon_ID":"HEAVY_FLAMER_DEATHWING_TERMINATORS","Weapon_Role":"SELECTED","Sort_Order":"1"}},{"file":"data/marines/Loadout_Weapons.csv","id_column":"Mapping_ID","row_id":"REDEMPTOR_SECONDARY_ONSLAUGHT","mode":"insert","sets":{"Loadout_Option_ID":"REDEMPTOR__SECONDARY__ONSLAUGHT","Weapon_ID":"ONSLAUGHT_GATLING_CANNON","Weapon_Role":"SELECTED","Sort_Order":"1"}},{"file":"data/marines/Loadout_Options.csv","id_column":"Loadout_Option_ID","row_id":"REDEMPTOR__ICARUS__NONE","mode":"insert","sets":{"Unit_ID":"REDEMPTOR_PLASMA","Option_Group_ID":"ICARUS","Group_Label":"Icarus Rocket Pod","Option_ID":"NONE","Option_Name":"No Icarus Rocket Pod","Default":"TRUE","Sort_Order":"1","Allocation_Mode":"UNIT","Allocation_Count":"","Max_Per_Unit":"1","Points_Per_Model":""}},{"file":"data/marines/Loadout_Options.csv","id_column":"Loadout_Option_ID","row_id":"REDEMPTOR__ICARUS__EQUIPPED","mode":"insert","sets":{"Unit_ID":"REDEMPTOR_PLASMA","Option_Group_ID":"ICARUS","Group_Label":"Icarus Rocket Pod","Option_ID":"EQUIPPED","Option_Name":"Icarus Rocket Pod","Default":"FALSE","Sort_Order":"2","Allocation_Mode":"UNIT","Allocation_Count":"","Max_Per_Unit":"1","Points_Per_Model":""}},{"file":"data/marines/Loadout_Weapons.csv","id_column":"Mapping_ID","row_id":"REDEMPTOR_ICARUS_SELECTED","mode":"insert","sets":{"Loadout_Option_ID":"REDEMPTOR__ICARUS__EQUIPPED","Weapon_ID":"ICARUS_ROCKET_POD","Weapon_Role":"SELECTED","Sort_Order":"1"}},{"file":"data/marines/Unit_Weapons.csv","id_column":"Unit_ID","row_id":"*","mode":"delete_where","where":{"Unit_ID":"BALLISTUS"}},{"file":"data/marines/Unit_Weapons.csv","id_column":"Layout_Row_ID","row_id":"BALLISTUS__LASCANNON","mode":"insert","sets":{"Unit_ID":"BALLISTUS","Weapon_ID":"BALLISTUS_LASCANNON","Row_Type":"WEAPON","Row_Label":"","Sort_Order":"10","Quantity":"1"}},{"file":"data/marines/Unit_Weapons.csv","id_column":"Layout_Row_ID","row_id":"BALLISTUS__MISSILE_FRAG","mode":"insert","sets":{"Unit_ID":"BALLISTUS","Weapon_ID":"BALLISTUS_MISSILE_LAUNCHER_FRAG","Row_Type":"WEAPON","Row_Label":"","Sort_Order":"20","Quantity":"1"}},{"file":"data/marines/Unit_Weapons.csv","id_column":"Layout_Row_ID","row_id":"BALLISTUS__MISSILE_KRAK","mode":"insert","sets":{"Unit_ID":"BALLISTUS","Weapon_ID":"BALLISTUS_MISSILE_LAUNCHER_KRAK","Row_Type":"WEAPON","Row_Label":"","Sort_Order":"30","Quantity":"1"}},{"file":"data/marines/Unit_Weapons.csv","id_column":"Layout_Row_ID","row_id":"BALLISTUS__STORM_BOLTERS","mode":"insert","sets":{"Unit_ID":"BALLISTUS","Weapon_ID":"IMPULSOR_STORM_BOLTERS","Row_Type":"WEAPON","Row_Label":"","Sort_Order":"40","Quantity":"1"}},{"file":"data/marines/Unit_Weapons.csv","id_column":"Layout_Row_ID","row_id":"BALLISTUS__FEET","mode":"insert","sets":{"Unit_ID":"BALLISTUS","Weapon_ID":"ARMOURED_FEET","Row_Type":"WEAPON","Row_Label":"","Sort_Order":"50","Quantity":"1"}},{"file":"data/marines/Unit_Weapons.csv","id_column":"Unit_ID","row_id":"*","mode":"delete_where","where":{"Unit_ID":"BRUTALIS"}},{"file":"data/marines/Unit_Weapons.csv","id_column":"Layout_Row_ID","row_id":"BRUTALIS__BOLT_RIFLES","mode":"insert","sets":{"Unit_ID":"BRUTALIS","Weapon_ID":"BRUTALIS_BOLT_RIFLES","Row_Type":"WEAPON","Row_Label":"","Sort_Order":"10","Quantity":"1"}},{"file":"data/marines/Unit_Weapons.csv","id_column":"Layout_Row_ID","row_id":"BRUTALIS__TWIN_HB","mode":"insert","sets":{"Unit_ID":"BRUTALIS","Weapon_ID":"TWIN_HEAVY_BOLTER","Row_Type":"WEAPON","Row_Label":"","Sort_Order":"20","Quantity":"1"}},{"file":"data/marines/Unit_Weapons.csv","id_column":"Layout_Row_ID","row_id":"BRUTALIS__ICARUS_STUBBER","mode":"insert","sets":{"Unit_ID":"BRUTALIS","Weapon_ID":"TWIN_IRONHAIL_HEAVY_STUBBER","Row_Type":"WEAPON","Row_Label":"","Sort_Order":"30","Quantity":"1"}},{"file":"data/marines/Unit_Weapons.csv","id_column":"Layout_Row_ID","row_id":"BRUTALIS__FISTS","mode":"insert","sets":{"Unit_ID":"BRUTALIS","Weapon_ID":"BRUTALIS_FISTS","Row_Type":"WEAPON","Row_Label":"","Sort_Order":"40","Quantity":"1"}},{"file":"data/marines/Loadout_Options.csv","id_column":"Loadout_Option_ID","row_id":"BRUTALIS__ARMS__FISTS","mode":"insert","sets":{"Unit_ID":"BRUTALIS","Option_Group_ID":"ARMS","Group_Label":"Arm Weapons","Option_ID":"FISTS","Option_Name":"Bolt Rifles + Brutalis Fists","Default":"TRUE","Sort_Order":"1","Allocation_Mode":"UNIT","Allocation_Count":"","Max_Per_Unit":"1","Points_Per_Model":""}},{"file":"data/marines/Loadout_Options.csv","id_column":"Loadout_Option_ID","row_id":"BRUTALIS__ARMS__TALONS","mode":"insert","sets":{"Unit_ID":"BRUTALIS","Option_Group_ID":"ARMS","Group_Label":"Arm Weapons","Option_ID":"TALONS","Option_Name":"Brutalis Talons","Default":"FALSE","Sort_Order":"2","Allocation_Mode":"UNIT","Allocation_Count":"","Max_Per_Unit":"1","Points_Per_Model":""}},{"file":"data/marines/Loadout_Weapons.csv","id_column":"Mapping_ID","row_id":"BRUTALIS_ARMS_BOLT","mode":"insert","sets":{"Loadout_Option_ID":"BRUTALIS__ARMS__FISTS","Weapon_ID":"BRUTALIS_BOLT_RIFLES","Weapon_Role":"SELECTED","Sort_Order":"1"}},{"file":"data/marines/Loadout_Weapons.csv","id_column":"Mapping_ID","row_id":"BRUTALIS_ARMS_FISTS","mode":"insert","sets":{"Loadout_Option_ID":"BRUTALIS__ARMS__FISTS","Weapon_ID":"BRUTALIS_FISTS","Weapon_Role":"SELECTED","Sort_Order":"2"}},{"file":"data/marines/Loadout_Weapons.csv","id_column":"Mapping_ID","row_id":"BRUTALIS_ARMS_TALONS","mode":"insert","sets":{"Loadout_Option_ID":"BRUTALIS__ARMS__TALONS","Weapon_ID":"BRUTALIS_TALONS","Weapon_Role":"SELECTED","Sort_Order":"1"}},{"file":"data/marines/Loadout_Options.csv","id_column":"Loadout_Option_ID","row_id":"BRUTALIS__GUN__HEAVY_BOLTER","mode":"insert","sets":{"Unit_ID":"BRUTALIS","Option_Group_ID":"GUN","Group_Label":"Ranged Weapon","Option_ID":"HEAVY_BOLTER","Option_Name":"Twin Heavy Bolter","Default":"TRUE","Sort_Order":"1","Allocation_Mode":"UNIT","Allocation_Count":"","Max_Per_Unit":"1","Points_Per_Model":""}},{"file":"data/marines/Loadout_Options.csv","id_column":"Loadout_Option_ID","row_id":"BRUTALIS__GUN__MULTI_MELTA","mode":"insert","sets":{"Unit_ID":"BRUTALIS","Option_Group_ID":"GUN","Group_Label":"Ranged Weapon","Option_ID":"MULTI_MELTA","Option_Name":"Twin Multi-melta","Default":"FALSE","Sort_Order":"2","Allocation_Mode":"UNIT","Allocation_Count":"","Max_Per_Unit":"1","Points_Per_Model":""}},{"file":"data/marines/Loadout_Weapons.csv","id_column":"Mapping_ID","row_id":"BRUTALIS_GUN_HB","mode":"insert","sets":{"Loadout_Option_ID":"BRUTALIS__GUN__HEAVY_BOLTER","Weapon_ID":"TWIN_HEAVY_BOLTER","Weapon_Role":"SELECTED","Sort_Order":"1"}},{"file":"data/marines/Loadout_Weapons.csv","id_column":"Mapping_ID","row_id":"BRUTALIS_GUN_MELTA","mode":"insert","sets":{"Loadout_Option_ID":"BRUTALIS__GUN__MULTI_MELTA","Weapon_ID":"TWIN_MULTI_MELTA","Weapon_Role":"SELECTED","Sort_Order":"1"}},{"file":"data/marines/Unit_Weapons.csv","id_column":"Unit_ID","row_id":"*","mode":"delete_where","where":{"Unit_ID":"INVICTOR_TACTICAL_WARSUIT"}},{"file":"data/marines/Unit_Weapons.csv","id_column":"Layout_Row_ID","row_id":"INVICTOR__FRAGSTORM","mode":"insert","sets":{"Unit_ID":"INVICTOR_TACTICAL_WARSUIT","Weapon_ID":"FRAGSTORM_GRENADE_LAUNCHER","Row_Type":"WEAPON","Row_Label":"","Sort_Order":"10","Quantity":"1"}},{"file":"data/marines/Unit_Weapons.csv","id_column":"Layout_Row_ID","row_id":"INVICTOR__HEAVY_BOLTER","mode":"insert","sets":{"Unit_ID":"INVICTOR_TACTICAL_WARSUIT","Weapon_ID":"HEAVY_BOLTER_INVICTOR","Row_Type":"WEAPON","Row_Label":"","Sort_Order":"20","Quantity":"1"}},{"file":"data/marines/Unit_Weapons.csv","id_column":"Layout_Row_ID","row_id":"INVICTOR__INCENDIUM","mode":"insert","sets":{"Unit_ID":"INVICTOR_TACTICAL_WARSUIT","Weapon_ID":"INCENDIUM_CANNON","Row_Type":"WEAPON","Row_Label":"","Sort_Order":"30","Quantity":"1"}},{"file":"data/marines/Unit_Weapons.csv","id_column":"Layout_Row_ID","row_id":"INVICTOR__STUBBERS","mode":"insert","sets":{"Unit_ID":"INVICTOR_TACTICAL_WARSUIT","Weapon_ID":"TWIN_IRONHAIL_HEAVY_STUBBER","Row_Type":"WEAPON","Row_Label":"","Sort_Order":"40","Quantity":"1"}},{"file":"data/marines/Unit_Weapons.csv","id_column":"Layout_Row_ID","row_id":"INVICTOR__FIST","mode":"insert","sets":{"Unit_ID":"INVICTOR_TACTICAL_WARSUIT","Weapon_ID":"INVICTOR_FIST","Row_Type":"WEAPON","Row_Label":"","Sort_Order":"50","Quantity":"1"}},{"file":"data/marines/Weapon_Abilities.csv","id_column":"Weapon_Ability_ID","row_id":"*","mode":"delete_where","where":{"Weapon_ID":"BRUTALIS_TALONS_STRIKE"}},{"file":"data/marines/Weapon_Stats.csv","id_column":"Weapon_ID","row_id":"BRUTALIS_TALONS_STRIKE","mode":"delete"},{"file":"data/marines/Weapon_Abilities.csv","id_column":"Weapon_Ability_ID","row_id":"*","mode":"delete_where","where":{"Weapon_ID":"BRUTALIS_TALONS_SWEEP"}},{"file":"data/marines/Weapon_Stats.csv","id_column":"Weapon_ID","row_id":"BRUTALIS_TALONS_SWEEP","mode":"delete"}]' }}
        run: |
          python3 <<'PY'
          import csv, json, os, sys
          from pathlib import Path

          raw = os.environ.get('PATCHES') or ''
          if not raw.strip():
              print('no PATCHES input; skip apply')
              raise SystemExit(0)
          try:
              ops = json.loads(raw)
          except json.JSONDecodeError as e:
              sys.exit(f'patches is not JSON: {e}')
          if not isinstance(ops, list) or not ops:
              sys.exit('patches must be a non-empty JSON list')

          def decode(val):
              if val is None:
                  return ''
              s = str(val)
              return s.replace('\\n', '\n')

          def load_csv(path):
              if path.is_absolute() or '..' in path.parts:
                  sys.exit(f'bad path {path}')
              if not str(path).startswith('data/') or path.suffix.lower() != '.csv':
                  sys.exit(f'file must be a .csv under data/: {path}')
              if not path.is_file():
                  sys.exit(f'missing {path}')
              with path.open(encoding='utf-8', newline='') as f:
                  rows = list(csv.reader(f))
              if not rows:
                  sys.exit(f'empty csv {path}')
              return rows

          files = {}
          changed = set()

          for i, op in enumerate(ops):
              if not isinstance(op, dict):
                  sys.exit(f'op {i} is not an object')
              path = Path(str(op.get('file', '')).strip())
              if path not in files:
                  files[path] = load_csv(path)
              rows = files[path]
              header = rows[0]
              id_col = str(op.get('id_column') or '').strip() or header[0]
              if id_col not in header:
                  sys.exit(f'op {i}: id column not in header: {id_col}')
              i_id = header.index(id_col)
              row_id = str(op.get('row_id') or '').strip()
              if not row_id:
                  sys.exit(f'op {i}: row_id required')
              mode = str(op.get('mode') or 'update').strip()

              if mode == 'add_column':
                  col = str(op.get('column') or '').strip()
                  if not col:
                      sys.exit(f'op {i}: add_column needs column')
                  if col in header:
                      print(f'column already exists {path} {col}')
                      continue
                  after_col = str(op.get('after_column') or '').strip()
                  if after_col and after_col not in header:
                      sys.exit(f'op {i}: after column not in header: {after_col}')
                  insert_at = header.index(after_col) + 1 if after_col else len(header)
                  old_width = len(header)
                  header.insert(insert_at, col)
                  for row in rows[1:]:
                      while len(row) < old_width:
                          row.append('')
                      row.insert(insert_at, '')
                  changed.add(path)
                  print(f'added column {path} {col}')
                  continue

              if mode == 'remove_column':
                  col = str(op.get('column') or '').strip()
                  if not col:
                      sys.exit(f'op {i}: remove_column needs column')
                  if col not in header:
                      sys.exit(f'op {i}: column not in header: {col}')
                  remove_at = header.index(col)
                  header.pop(remove_at)
                  for row in rows[1:]:
                      if len(row) > remove_at:
                          row.pop(remove_at)
                  changed.add(path)
                  print(f'removed column {path} {col}')
                  continue

              if mode == 'dedupe_by_key':
                  key_col = str(op.get('key_column') or '').strip()
                  if key_col not in header:
                      sys.exit(f'op {i}: key column not in header: {key_col}')
                  i_key = header.index(key_col)
                  kept = [header]
                  seen = set()
                  matched = 0
                  removed = 0
                  for row in rows[1:]:
                      if not row:
                          continue
                      while len(row) < len(header):
                          row.append('')
                      if row[i_id] != row_id:
                          kept.append(row)
                          continue
                      matched += 1
                      key = row[i_key].strip()
                      if not key:
                          sys.exit(f'op {i}: blank {key_col} while deduping {row_id!r}')
                      if key in seen:
                          removed += 1
                          continue
                      seen.add(key)
                      kept.append(row)
                  if matched < 1:
                      sys.exit(f'op {i}: found no rows for {row_id!r}')
                  if removed < 1:
                      sys.exit(f'op {i}: found no duplicate rows for {row_id!r}')
                  files[path] = kept
                  changed.add(path)
                  print(f'deduped {path} {row_id}: kept {len(seen)} unique {key_col} values, removed {removed} duplicates')
                  continue

              if mode == 'fill_blank_where':
                  match_col = str(op.get('match_column') or '').strip()
                  col = str(op.get('column') or '').strip()
                  if match_col not in header:
                      sys.exit(f'op {i}: match column not in header: {match_col}')
                  if col not in header:
                      sys.exit(f'op {i}: column not in header: {col}')
                  match_value = decode(op.get('match_value')).strip()
                  new = decode(op.get('value'))
                  if not match_value:
                      sys.exit(f'op {i}: match_value required')
                  if new == '':
                      sys.exit(f'op {i}: value required')
                  i_match = header.index(match_col)
                  i_col = header.index(col)
                  hits = 0
                  for row in rows[1:]:
                      if not row:
                          continue
                      while len(row) < len(header):
                          row.append('')
                      if row[i_match].strip() == match_value and not row[i_col].strip():
                          row[i_col] = new
                          hits += 1
                  if hits < 1:
                      sys.exit(f'op {i}: found no blank {col} values where {match_col}={match_value!r}')
                  changed.add(path)
                  print(f'filled {hits} blank {col} values in {path} where {match_col}={match_value!r}')
                  continue

              if mode == 'replace_text':
                  col = str(op.get('column') or '').strip()
                  if col not in header:
                      sys.exit(f'op {i}: column not in header: {col}')
                  old = decode(op.get('from'))
                  new = decode(op.get('to'))
                  if not old:
                      sys.exit(f'op {i}: replace_text needs non-empty from')
                  i_col = header.index(col)
                  hits = 0
                  for row in rows[1:]:
                      if not row:
                          continue
                      while len(row) < len(header):
                          row.append('')
                      if old in row[i_col]:
                          row[i_col] = row[i_col].replace(old, new)
                          hits += 1
                  if hits < 1:
                      sys.exit(f'op {i}: replace_text found no matches for {old!r}')
                  changed.add(path)
                  print(f'replaced {old!r} in {hits} rows of {path} column {col}')
                  continue

              if mode == 'delete_where':
                  where = op.get('where')
                  if not isinstance(where, dict) or not where:
                      sys.exit(f'op {i}: delete_where needs where')
                  for col in where:
                      if col not in header:
                          sys.exit(f'op {i}: column not in header: {col}')
                  kept = [header]
                  hits = 0
                  for row in rows[1:]:
                      if not row:
                          continue
                      while len(row) < len(header):
                          row.append('')
                      matched = True
                      for col, val in where.items():
                          if row[header.index(col)] != decode(val):
                              matched = False
                              break
                      if matched:
                          hits += 1
                          continue
                      kept.append(row)
                  if hits < 1:
                      sys.exit(f'op {i}: delete_where found no rows for {where!r}')
                  files[path] = kept
                  changed.add(path)
                  print(f'deleted {hits} rows from {path} where {where}')
                  continue

              if mode == 'delete':
                  kept = [header]
                  hits = 0
                  for row in rows[1:]:
                      if not row:
                          continue
                      if len(row) > i_id and row[i_id] == row_id:
                          hits += 1
                          continue
                      kept.append(row)
                  if hits != 1:
                      sys.exit(f'op {i}: expected 1 row for {row_id!r}, found {hits}')
                  files[path] = kept
                  changed.add(path)
                  print(f'deleted {path} {row_id}')
                  continue

              if mode == 'insert':
                  existing = 0
                  for row in rows[1:]:
                      if row and len(row) > i_id and row[i_id] == row_id:
                          existing += 1
                  allow_duplicate_id = bool(op.get('allow_duplicate_id'))
                  if existing and not allow_duplicate_id:
                      sys.exit(f'op {i}: row already exists: {row_id}')
                  sets = op.get('sets')
                  if not isinstance(sets, dict) or not sets:
                      sys.exit(f'op {i}: insert needs sets')
                  new_row = [''] * len(header)
                  new_row[i_id] = row_id
                  for col, val in sets.items():
                      if col not in header:
                          sys.exit(f'op {i}: column not in header: {col}')
                      new_row[header.index(col)] = decode(val)
                  after = str(op.get('after_row_id') or '').strip()
                  if after:
                      placed = False
                      kept = [header]
                      for row in rows[1:]:
                          kept.append(row)
                          if row and len(row) > i_id and row[i_id] == after:
                              kept.append(new_row)
                              placed = True
                      if not placed:
                          sys.exit(f'op {i}: after_row_id not found: {after}')
                      files[path] = kept
                  else:
                      rows.append(new_row)
                      files[path] = rows
                  changed.add(path)
                  print(f'inserted {path} {row_id}')
                  continue

              if mode != 'update':
                  sys.exit(f'op {i}: unknown mode {mode}')

              sets = op.get('sets')
              if not isinstance(sets, dict) or not sets:
                  sets = {}
                  if op.get('column'):
                      sets[str(op['column'])] = op.get('value', '')
                  if op.get('column_2'):
                      sets[str(op['column_2'])] = op.get('value_2', '')
              if not sets:
                  sys.exit(f'op {i}: update needs sets or column/value')

              hits = 0
              for row in rows[1:]:
                  if not row:
                      continue
                  while len(row) < len(header):
                      row.append('')
                  if row[i_id] != row_id:
                      continue
                  for col, val in sets.items():
                      if col not in header:
                          sys.exit(f'op {i}: column not in header: {col}')
                      row[header.index(col)] = decode(val)
                  hits += 1
              if hits != 1:
                  sys.exit(f'op {i}: expected 1 row for {row_id!r}, found {hits}')
              changed.add(path)
              print(f'updated {path} {row_id} {list(sets)}')

          for path, rows in files.items():
              if path not in changed:
                  continue
              with path.open('w', newline='', encoding='utf-8') as f:
                  csv.writer(f, lineterminator='\n').writerows(rows)
          print('changed', ' '.join(str(p) for p in sorted(changed)))
          PY

      - name: Refresh manifests
        run: python3 scripts/data_schema.py manifest

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- data
          if git diff --cached --quiet; then
            echo "No change"
            exit 0
          fi
          git commit -m "Patch CSV line items"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
