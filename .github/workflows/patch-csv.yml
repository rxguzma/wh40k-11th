name: Patch CSV

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-csv.yml'
  workflow_dispatch:
    inputs:
      patches:
        description: JSON list of operations. One run, one commit.
        required: true
        type: string

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply patches
        env:
          PATCHES: ${{ inputs.patches }}
        run: |
          python3 <<'PY'
          import csv, json, os, sys
          from pathlib import Path

          raw = r'[{"file":"data/orks/Army_Rules.csv","id_column":"","row_id":"__column__","mode":"add_column","column":"Tags"},{"file":"data/orks/Army_Rules.csv","id_column":"","row_id":"__column__","mode":"add_column","column":"Tag Categories","after_column":"Tags"},{"file":"data/orks/Army_Rules.csv","id_column":"","row_id":"__column__","mode":"add_column","column":"Default_Active","after_column":"Tag Categories"},{"file":"data/orks/Stratagems.csv","id_column":"Stratagem_ID","row_id":"__column__","mode":"add_column","column":"Default_Active","after_column":"Tag Categories"},{"file":"data/universal/Tag_Definitions.csv","id_column":"Tag_ID","row_id":"ASSAULT","mode":"insert","sets":{"Display_Tag":"ASSAULT","Title":"Assault","Category":"Range - Weapon Rules","Affects":"Ranged Weapon","Description":"The affected ranged weapon has the Assault ability while this rule is active.","Editable":"TRUE","Effect_Type":"","Target":"","Stat":"","Operation":"","Value":"","Sort_Order":"821"}},{"file":"data/universal/Tag_Definitions.csv","id_column":"Tag_ID","row_id":"ADVANCE_AND_CHARGE","mode":"insert","sets":{"Display_Tag":"ADVANCE AND CHARGE","Title":"Advance and Charge","Category":"Movement Rules","Affects":"Unit","Description":"The affected unit can declare a charge in a turn in which it Advanced while this rule is active.","Editable":"TRUE","Effect_Type":"","Target":"","Stat":"","Operation":"","Value":"","Sort_Order":"822"}},{"file":"data/universal/Tag_Definitions.csv","id_column":"Tag_ID","row_id":"RETURN_ON_2_PLUS","mode":"insert","sets":{"Display_Tag":"RETURN ON 2+","Title":"Return on 2+","Category":"Unit Rules","Affects":"Unit","Description":"The affected model or unit can return on a 2+ when the source rule is triggered.","Editable":"TRUE","Effect_Type":"","Target":"","Stat":"","Operation":"","Value":"","Sort_Order":"823"}},{"file":"data/universal/Tag_Definitions.csv","id_column":"Tag_ID","row_id":"COPY_WARBOSS_ABILITY","mode":"insert","sets":{"Display_Tag":"COPY WARBOSS ABILITY","Title":"Copy Warboss Ability","Category":"Unit Rules","Affects":"Unit","Description":"The affected unit gains the referenced Warboss ability while the source rule applies.","Editable":"TRUE","Effect_Type":"","Target":"","Stat":"","Operation":"","Value":"","Sort_Order":"824"}},{"file":"data/universal/Tag_Definitions.csv","id_column":"Tag_ID","row_id":"CHARACTER","mode":"insert","sets":{"Display_Tag":"CHARACTER","Title":"Character","Category":"Unit Rules","Affects":"Unit","Description":"The affected unit has the CHARACTER keyword while this rule is active.","Editable":"TRUE","Effect_Type":"","Target":"","Stat":"","Operation":"","Value":"","Sort_Order":"825"}},{"file":"data/universal/Tag_Definitions.csv","id_column":"Tag_ID","row_id":"RE_ROLL_BATTLE_SHOCK","mode":"insert","sets":{"Display_Tag":"RE-ROLL BATTLE-SHOCK","Title":"Re-roll Battle-shock","Category":"Unit Rules","Affects":"Unit","Description":"The affected unit can re-roll the Battle-shock test specified by the source rule.","Editable":"TRUE","Effect_Type":"","Target":"","Stat":"","Operation":"","Value":"","Sort_Order":"826"}},{"file":"data/universal/Tag_Definitions.csv","id_column":"Tag_ID","row_id":"RE_ROLL_ATTACK_DICE","mode":"insert","sets":{"Display_Tag":"RE-ROLL ATTACK DICE","Title":"Re-roll Attack Dice","Category":"Unit Rules","Affects":"Unit","Description":"The affected unit can re-roll the attack dice specified by the source rule.","Editable":"TRUE","Effect_Type":"","Target":"","Stat":"","Operation":"","Value":"","Sort_Order":"827"}},{"file":"data/orks/Detachment_Definitions.csv","id_column":"Detachment_ID","row_id":"orks_more_dakka","sets":{"Tags":"[ASSAULT] [SUSTAINED HITS 1]","Tag Categories":"[Range - Weapon Rules] [Range - Weapon Rules]","Default_Active":"0"}},{"file":"data/orks/Detachment_Definitions.csv","id_column":"Detachment_ID","row_id":"orks_kult_of_speed","sets":{"Tags":"[ASSAULT] [ADVANCE AND CHARGE] [FALL BACK AND CHARGE]","Tag Categories":"[Range - Weapon Rules] [Movement Rules] [Movement Rules]","Default_Active":"0"}},{"file":"data/orks/Detachment_Definitions.csv","id_column":"Detachment_ID","row_id":"orks_shoota_boyz","sets":{"Tags":"[ASSAULT] [+3 R”]","Tag Categories":"[Range - Weapon Rules] [Range - Weapon Stats]","Default_Active":"1"}},{"file":"data/orks/Enhancements.csv","id_column":"Enhancement_ID","row_id":"orks_kult_of_speed_enhancement_smoky_gubbinz","sets":{"Tags":"[TARGET GETS COVER]","Tag Categories":"[Informational - Enemy]","Default_Active":"0"}},{"file":"data/orks/Enhancements.csv","id_column":"Enhancement_ID","row_id":"orks_wreckas_enhancement_supa_snazz_dakka","sets":{"Default_Active":"1"}},{"file":"data/orks/Enhancements.csv","id_column":"Enhancement_ID","row_id":"orks_brute_bosses_enhancement_brutal_but_kunnin","sets":{"Default_Active":"1"}},{"file":"data/orks/Enhancements.csv","id_column":"Enhancement_ID","row_id":"orks_brute_bosses_enhancement_proper_killy","sets":{"Default_Active":"1"}},{"file":"data/orks/Enhancements.csv","id_column":"Enhancement_ID","row_id":"orks_blitz_brigade_enhancement_boss_boomer","sets":{"Tags":"[COPY WARBOSS ABILITY]","Tag Categories":"[Unit Rules]","Default_Active":"0"}}]'
          try:
              ops = json.loads(raw)
          except json.JSONDecodeError as e:
              sys.exit(f'patches is not JSON: {e}')
          if not isinstance(ops, list) or not ops:
              sys.exit('patches must be a non-empty JSON list')

          def decode(val):
              if val is None:
                  return ''
              s = str(val)
              return s.replace('\\n', '\n')

          def load_csv(path):
              if path.is_absolute() or '..' in path.parts:
                  sys.exit(f'bad path {path}')
              if not str(path).startswith('data/') or path.suffix.lower() != '.csv':
                  sys.exit(f'file must be a .csv under data/: {path}')
              if not path.is_file():
                  sys.exit(f'missing {path}')
              with path.open(encoding='utf-8', newline='') as f:
                  rows = list(csv.reader(f))
              if not rows:
                  sys.exit(f'empty csv {path}')
              return rows

          files = {}
          changed = set()

          for i, op in enumerate(ops):
              if not isinstance(op, dict):
                  sys.exit(f'op {i} is not an object')
              path = Path(str(op.get('file', '')).strip())
              if path not in files:
                  files[path] = load_csv(path)
              rows = files[path]
              header = rows[0]
              id_col = str(op.get('id_column') or '').strip() or header[0]
              if id_col not in header:
                  sys.exit(f'op {i}: id column not in header: {id_col}')
              i_id = header.index(id_col)
              row_id = str(op.get('row_id') or '').strip()
              if not row_id:
                  sys.exit(f'op {i}: row_id required')
              mode = str(op.get('mode') or 'update').strip()

              if mode == 'add_column':
                  col = str(op.get('column') or '').strip()
                  if not col:
                      sys.exit(f'op {i}: add_column needs column')
                  if col in header:
                      print(f'column already exists {path} {col}')
                      continue
                  after_col = str(op.get('after_column') or '').strip()
                  if after_col and after_col not in header:
                      sys.exit(f'op {i}: after column not in header: {after_col}')
                  insert_at = header.index(after_col) + 1 if after_col else len(header)
                  old_width = len(header)
                  header.insert(insert_at, col)
                  for row in rows[1:]:
                      while len(row) < old_width:
                          row.append('')
                      row.insert(insert_at, '')
                  changed.add(path)
                  print(f'added column {path} {col}')
                  continue

              if mode == 'dedupe_by_key':
                  key_col = str(op.get('key_column') or '').strip()
                  if key_col not in header:
                      sys.exit(f'op {i}: key column not in header: {key_col}')
                  i_key = header.index(key_col)
                  kept = [header]
                  seen = set()
                  matched = 0
                  removed = 0
                  for row in rows[1:]:
                      if not row:
                          continue
                      while len(row) < len(header):
                          row.append('')
                      if row[i_id] != row_id:
                          kept.append(row)
                          continue
                      matched += 1
                      key = row[i_key].strip()
                      if not key:
                          sys.exit(f'op {i}: blank {key_col} while deduping {row_id!r}')
                      if key in seen:
                          removed += 1
                          continue
                      seen.add(key)
                      kept.append(row)
                  if matched < 1:
                      sys.exit(f'op {i}: found no rows for {row_id!r}')
                  if removed < 1:
                      sys.exit(f'op {i}: found no duplicate rows for {row_id!r}')
                  files[path] = kept
                  changed.add(path)
                  print(f'deduped {path} {row_id}: kept {len(seen)} unique {key_col} values, removed {removed} duplicates')
                  continue

              if mode == 'fill_blank_where':
                  match_col = str(op.get('match_column') or '').strip()
                  col = str(op.get('column') or '').strip()
                  if match_col not in header:
                      sys.exit(f'op {i}: match column not in header: {match_col}')
                  if col not in header:
                      sys.exit(f'op {i}: column not in header: {col}')
                  match_value = decode(op.get('match_value')).strip()
                  new = decode(op.get('value'))
                  if not match_value:
                      sys.exit(f'op {i}: match_value required')
                  if new == '':
                      sys.exit(f'op {i}: value required')
                  i_match = header.index(match_col)
                  i_col = header.index(col)
                  hits = 0
                  for row in rows[1:]:
                      if not row:
                          continue
                      while len(row) < len(header):
                          row.append('')
                      if row[i_match].strip() == match_value and not row[i_col].strip():
                          row[i_col] = new
                          hits += 1
                  if hits < 1:
                      sys.exit(f'op {i}: found no blank {col} values where {match_col}={match_value!r}')
                  changed.add(path)
                  print(f'filled {hits} blank {col} values in {path} where {match_col}={match_value!r}')
                  continue

              if mode == 'replace_text':
                  col = str(op.get('column') or '').strip()
                  if col not in header:
                      sys.exit(f'op {i}: column not in header: {col}')
                  old = decode(op.get('from'))
                  new = decode(op.get('to'))
                  if not old:
                      sys.exit(f'op {i}: replace_text needs non-empty from')
                  i_col = header.index(col)
                  hits = 0
                  for row in rows[1:]:
                      if not row:
                          continue
                      while len(row) < len(header):
                          row.append('')
                      if old in row[i_col]:
                          row[i_col] = row[i_col].replace(old, new)
                          hits += 1
                  if hits < 1:
                      sys.exit(f'op {i}: replace_text found no matches for {old!r}')
                  changed.add(path)
                  print(f'replaced {old!r} in {hits} rows of {path} column {col}')
                  continue

              if mode == 'delete':
                  kept = [header]
                  hits = 0
                  for row in rows[1:]:
                      if not row:
                          continue
                      if len(row) > i_id and row[i_id] == row_id:
                          hits += 1
                          continue
                      kept.append(row)
                  if hits != 1:
                      sys.exit(f'op {i}: expected 1 row for {row_id!r}, found {hits}')
                  files[path] = kept
                  changed.add(path)
                  print(f'deleted {path} {row_id}')
                  continue

              if mode == 'insert':
                  existing = 0
                  for row in rows[1:]:
                      if row and len(row) > i_id and row[i_id] == row_id:
                          existing += 1
                  if existing:
                      sys.exit(f'op {i}: row already exists: {row_id}')
                  sets = op.get('sets')
                  if not isinstance(sets, dict) or not sets:
                      sys.exit(f'op {i}: insert needs sets')
                  new_row = [''] * len(header)
                  new_row[i_id] = row_id
                  for col, val in sets.items():
                      if col not in header:
                          sys.exit(f'op {i}: column not in header: {col}')
                      new_row[header.index(col)] = decode(val)
                  after = str(op.get('after_row_id') or '').strip()
                  if after:
                      placed = False
                      kept = [header]
                      for row in rows[1:]:
                          kept.append(row)
                          if row and len(row) > i_id and row[i_id] == after:
                              kept.append(new_row)
                              placed = True
                      if not placed:
                          sys.exit(f'op {i}: after_row_id not found: {after}')
                      files[path] = kept
                  else:
                      rows.append(new_row)
                      files[path] = rows
                  changed.add(path)
                  print(f'inserted {path} {row_id}')
                  continue

              if mode != 'update':
                  sys.exit(f'op {i}: unknown mode {mode}')

              sets = op.get('sets')
              if not isinstance(sets, dict) or not sets:
                  sets = {}
                  if op.get('column'):
                      sets[str(op['column'])] = op.get('value', '')
                  if op.get('column_2'):
                      sets[str(op['column_2'])] = op.get('value_2', '')
              if not sets:
                  sys.exit(f'op {i}: update needs sets or column/value')

              hits = 0
              for row in rows[1:]:
                  if not row:
                      continue
                  while len(row) < len(header):
                      row.append('')
                  if row[i_id] != row_id:
                      continue
                  for col, val in sets.items():
                      if col not in header:
                          sys.exit(f'op {i}: column not in header: {col}')
                      row[header.index(col)] = decode(val)
                  hits += 1
              if hits != 1:
                  sys.exit(f'op {i}: expected 1 row for {row_id!r}, found {hits}')
              changed.add(path)
              print(f'updated {path} {row_id} {list(sets)}')

          for path, rows in files.items():
              if path not in changed:
                  continue
              with path.open('w', newline='', encoding='utf-8') as f:
                  csv.writer(f, lineterminator='\n').writerows(rows)
          print('changed', ' '.join(str(p) for p in sorted(changed)))
          PY

      - name: Refresh manifests
        run: python3 scripts/data_schema.py manifest

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- data
          if git diff --cached --quiet; then
            echo "No change"
            exit 0
          fi
          git commit -m "Patch CSV line items"
          git push
