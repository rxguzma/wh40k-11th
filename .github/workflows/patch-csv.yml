name: Patch CSV

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-csv.yml'
  workflow_dispatch:
    inputs:
      patches:
        description: JSON list of operations. One run, one commit.
        required: true
        type: string

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply patches
        env:
          PATCHES: ${{ inputs.patches || '[{"file":"data/marines/Weapon_Stats.csv","id_column":"Weapon_ID","row_id":"space_marines_assault_brethren_imperiums_sword","column":"R\"","value":"-"},{"file":"data/marines/Weapon_Stats.csv","id_column":"Weapon_ID","row_id":"MARNEUS_CALGAR_GAUNTLETS_OF_ULTRAMAR_MELEE","column":"R\"","value":"-"},{"file":"data/marines/Weapon_Stats.csv","id_column":"Weapon_ID","row_id":"MARNEUS_CALGAR_GAUNTLETS_OF_ULTRAMAR_OVERHEAD_SMASH","column":"R\"","value":"-"},{"file":"data/marines/Weapon_Stats.csv","id_column":"Weapon_ID","row_id":"WARDENS_OF_ULTRAMAR_CERAMITE_FISTS","column":"R\"","value":"-"},{"file":"data/marines/Weapon_Stats.csv","id_column":"Weapon_ID","row_id":"WARDENS_OF_ULTRAMAR_FORCE_STAVE","column":"R\"","value":"-"},{"file":"data/marines/Weapon_Stats.csv","id_column":"Weapon_ID","row_id":"WARDENS_OF_ULTRAMAR_MASTER_CRAFTED_POWER_WEAPON","column":"R\"","value":"-"},{"file":"data/marines/Weapon_Stats.csv","id_column":"Weapon_ID","row_id":"WARDENS_OF_ULTRAMAR_POWER_WEAPON","column":"R\"","value":"-"},{"file":"data/marines/Weapon_Stats.csv","id_column":"Weapon_ID","row_id":"WARDENS_OF_ULTRAMAR_ULTRAMARIAN_COMBAT_WEAPONS","column":"R\"","value":"-"},{"file":"data/marines/Weapon_Stats.csv","id_column":"Weapon_ID","row_id":"CHIEF_LIBRARIAN_TIGURIUS_ROD_OF_TIGURIUS","column":"R\"","value":"-"},{"file":"data/marines/Weapon_Stats.csv","id_column":"Weapon_ID","row_id":"CATO_SICARIUS_TALASSARIAN_TEMPEST_BLADE_STRIKE","column":"R\"","value":"-"},{"file":"data/marines/Weapon_Stats.csv","id_column":"Weapon_ID","row_id":"CATO_SICARIUS_TALASSARIAN_TEMPEST_BLADE_COUP_DE_GRACE","column":"R\"","value":"-"},{"file":"data/marines/Weapon_Stats.csv","id_column":"Weapon_ID","row_id":"CATO_SICARIUS_TALASSARIAN_TEMPEST_BLADE_SWEEP","column":"R\"","value":"-"},{"file":"data/marines/Weapon_Stats.csv","id_column":"Weapon_ID","row_id":"VICTRIX_HONOUR_GUARD_BLADES_OF_HONOUR","column":"R\"","value":"-"},{"file":"data/marines/Weapon_Stats.csv","id_column":"Weapon_ID","row_id":"VICTRIX_HONOUR_GUARD_MASTER_CRAFTED_POWER_WEAPON","column":"R\"","value":"-"},{"file":"data/marines/Weapon_Stats.csv","id_column":"Weapon_ID","row_id":"KAIUS_KONORIUS_SEVERANCE_AND_REBUKE_STRIKE","column":"R\"","value":"-"},{"file":"data/marines/Weapon_Stats.csv","id_column":"Weapon_ID","row_id":"KAIUS_KONORIUS_SEVERANCE_AND_REBUKE_SWEEP","column":"R\"","value":"-"},{"file":"data/marines/Unit_Profiles.csv","id_column":"Unit_ID","row_id":"KORSARRO_KHAN","mode":"insert","sets":{"Unit Name":"Kor\u2019sarro Khan","M\"":"6\"","T":"5","SV":"3+/4++","W":"5","LD":"6+","OC":"1","Keywords":"INFANTRY, CAPTAIN, CHARACTER, EPIC HERO, EXPLOSIVES, IMPERIUM, TACTICUS, ADEPTUS ASTARTES, WHITE SCARS","Hyperlink":""}},{"file":"data/marines/Weapon_Stats.csv","id_column":"Weapon_ID","row_id":"KORSARRO_KHAN_ANZUQ","mode":"insert","sets":{"Weapon Name":"Anzuq","R\"":"18\"","A":"2","WS":"3+","St":"4","AP":"-1","D":"2"}},{"file":"data/marines/Weapon_Stats.csv","id_column":"Weapon_ID","row_id":"KORSARRO_KHAN_BOLT_PISTOL","mode":"insert","sets":{"Weapon Name":"Bolt Pistol","R\"":"12\"","A":"1","WS":"2+","St":"5","AP":"-1","D":"1"}},{"file":"data/marines/Weapon_Stats.csv","id_column":"Weapon_ID","row_id":"KORSARRO_KHAN_MOONFANG","mode":"insert","sets":{"Weapon Name":"Moonfang","R\"":"-","A":"6","WS":"2+","St":"6","AP":"-3","D":"2"}},{"file":"data/marines/Weapon_Abilities.csv","id_column":"Weapon_Ability_ID","row_id":"KORSARRO_KHAN_ANZUQ\u003aability_1","mode":"insert","sets":{"Weapon_ID":"KORSARRO_KHAN_ANZUQ","Ability_Type":"ANTI-INFANTRY","Target":"","Value":"4+","Condition":"","Separator_Before":"","Sort_Order":"1"}},{"file":"data/marines/Weapon_Abilities.csv","id_column":"Weapon_Ability_ID","row_id":"KORSARRO_KHAN_ANZUQ\u003aability_2","mode":"insert","sets":{"Weapon_ID":"KORSARRO_KHAN_ANZUQ","Ability_Type":"CLOSE-QUARTERS","Target":"","Value":"","Condition":"","Separator_Before":", ","Sort_Order":"2"}},{"file":"data/marines/Weapon_Abilities.csv","id_column":"Weapon_Abili