name: Patch CSV

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-csv.yml'
  workflow_dispatch:
    inputs:
      patches:
        description: JSON list of operations. One run, one commit.
        required: true
        type: string

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply patches
        env:
          PATCHES: ${{ inputs.patches || '[{"file":"data/orks/Unit_Profiles.csv","id_column":"Unit_ID","row_id":"BANNERNOB","sets":{"Abilities":"WAAAGH_BANNER","Other_Abilities":"SUPPORT_BANNERNOB"}},{"file":"data/orks/Unit_Profiles.csv","id_column":"Unit_ID","row_id":"BATTLEWAGON","sets":{"Abilities":"MOBILE_FORTRESS","Other_Abilities":"TRANSPORT_BATTLEWAGON, COMPOSITION_BATTLEWAGON, FIRING_DECK_11, DEADLY_DEMISE_D6, DAMAGED_1_6"}},{"file":"data/orks/Unit_Profiles.csv","id_column":"Unit_ID","row_id":"BEAST_SNAGGA_BOYZ","sets":{"Abilities":"MOBBED","Other_Abilities":"COMPOSITION_BEAST_SNAGGA_BOYZ, LED_BY_BEAST_SNAGGA_BOYZ, BEAST_SNAGGA_BOYZ_NOB_PROFILE"}},{"file":"data/orks/Unit_Profiles.csv","id_column":"Unit_ID","row_id":"BEASTBOSS","sets":{"Abilities":"DODGE_DIS","Other_Abilities":"FNP_6, KEEP_HUNTIN, LEADER_BEASTBOSS"}},{"file":"data/orks/Unit_Profiles.csv","id_column":"Unit_ID","row_id":"BEASTBOSS_ON_SQUIGOSAUR","sets":{"Abilities":"THUNDERING_STAMPEDE","Other_Abilities":"FNP_5, KEEP_HUNTIN, BOSS_OF_DA_HUNT, COMPOSITION_BEASTBOSS_SQUIGOSAUR"}},{"file":"data/orks/Unit_Profiles.csv","id_column":"Unit_ID","row_id":"BIG_MEK","sets":{"Abilities":"SHOKK_BOOSTA","Other_Abilities":"MORE_DAKKA, COMPOSITION_BIG_MEK, LEADER_BIG_MEK"}},{"file":"data/orks/Unit_Profiles.csv","id_column":"Unit_ID","row_id":"BIG_MEK_DAKKARIG","sets":{"Abilities":"EVEN_MORE_DAKKA, BLITZ_DEM_GITS","Other_Abilities":"DEADLY_DEMISE_1"}},{"file":"data/orks/Unit_Profiles.csv","id_column":"Unit_ID","row_id":"BIGBOSS","sets":{"Abilities":"SOMETHIN_TO_PROVE","Other_Abilities":"SUPPORT_BIGBOSS"}},{"file":"data/orks/Unit_Profiles.csv","id_column":"Unit_ID","row_id":"BOSS_SNIKROT","sets":{"Abilities":"KUNNIN_INFILTRATOR, DEFF_FROM_THE_SHADOWS","Other_Abilities":"INFILTRATORS, LONE_OPERATIVE, STEALTH, LEADER_BOSS_SNIKROT"}},{"file":"data/orks/Unit_Profiles.csv","id_column":"Unit_ID","row_id":"BOYZ","sets":{"Abilities":"TIDE_OF_MUSCLE, NEVER_TOO_BUSY_TO_FIGHT","Other_Abilities":"AMMO_RUNTS, COMPOSITION_BOYZ, LED_BY_BOYZ, BOYZ_NOB_WOUNDS"}},{"file":"data/orks/Unit_Profiles.csv","id_column":"Unit_ID","row_id":"BREAKA_BOYZ","sets":{"Abilities":"TROPHY_HUNTERS","Other_Abilities":"BOMB_SQUIGS_TANKBUSTAS, COMPOSITION_BREAKA_BOYZ, LED_BY_BREAKA_BOYZ"}},{"file":"data/orks/Unit_Profiles.csv","id_column":"Unit_ID","row_id":"BURNA_BOYZ","sets":{"Abilities":"PYROMANIAKS","Other_Abilities":"UNIT_COMPOSITION_BURNAS"}},{"file":"data/orks/Unit_Profiles.csv","id_column":"Unit_ID","row_id":"DEFFKILLA_WARTRIKE","sets":{"Abilities":"GET_BACK_IN_DA_RACE, FUEL_MIXA_GROB","Other_Abilities":"DEADLY_DEMISE_1, LEADER_DEFFKILLA_WARTRIKE"}},{"file":"data/orks/Unit_Profiles.csv","id_column":"Unit_ID","row_id":"DEFFKOPTAS","sets":{"Abilities":"DEFF_FROM_ABOVE, AERIAL_MANOEUVRE","Other_Abilities":"DEEP_STRIKE, COMPOSITION_DEFFKOPTAS"}},{"file":"data/orks/Unit_Profiles.csv","id_column":"Unit_ID","row_id":"FLASH_GITZ","sets":{"Abilities":"FINDER_KEEPERZ","Other_Abilities":"LED_BY_FLASH_GITZ"}},{"file":"data/orks/Unit_Profiles.csv","id_column":"Unit_ID","row_id":"GHAZGHKULL_THRAKA","sets":{"Abilities":"DA_GRAND_WARLORDS_LADZ, MAKARI_HOIST_DAT_BANNER, PROPHET_OF_DA_GREAT_WAAAGH","Other_Abilities":""}},{"file":"data/orks/Unit_Profiles.csv","id_column":"Unit_ID","row_id":"GRETCHIN","sets":{"Abilities":"THIEVIN_SCAVENGERS","Other_Abilities":"DOWNTRODDEN, LED_BY_GRETCHIN"}},{"file":"data/orks/Unit_Profiles.csv","id_column":"Unit_ID","row_id":"KILL_RIG","sets":{"Abilities":"BEASTSCENT, WARPATH","Other_Abilities":"DAMAGED_1_6, DEADLY_DEMISE_D6, FNP_5, UNSTABLE_ENERGIES, TRANSPORT_KILL_RIG"}},{"file":"data/orks/Unit_Profiles.csv","id_column":"Unit_ID","row_id":"KILLA_KANS","sets":{"Abilities":"SPITEFUL_POWER_TRIP","Other_Abilities":"DEADLY_DEMISE_1"}},{"file":"data/orks/Unit_Profiles.csv","id_column":"Unit_ID","row_id":"KOMMANDOS","sets":{"Abilities":"FOUND_EM, TACTICAL_KNOW_WOTZ, NOWHERE_TO_HIDE","Other_Abilities":"INFILTRATORS, STEALTH, BOMB_SQUIG, COMPOSITION_KOMMANDOS, LED_BY_KOMMANDOS"}},{"file":"data/orks/Unit_Profiles.csv","id_column":"Unit_ID","row_id":"LOOTAS","sets":{"Abilities":"DATS_OUR_LOOT","Other_Abilities":"COMPOSITION_LOOTAS"}},{"file":"data/orks/Unit_Profiles.csv","id_column":"Unit_ID","row_id":"GROTSNIK","sets":{"Abilities":"DOKS_TOOLZ","Other_Abilities":"FNP_5, SUPER_RUNTS"}},{"file":"data/orks/Unit_Profiles.csv","id_column":"Unit_ID","row_id":"MEK","sets":{"Abilities":"KUSTOM_DAKKA, CLEVER_KNOW_WOTZ","Other_Abilities":"SUPPORT_MEK"}},{"file":"data/orks/Unit_Profiles.csv","id_column":"Unit_ID","row_id":"MOZROG_SKRAGBAD","sets":{"Abilities":"ONE_LAST_KILL, DA_BIGGER_DEY_IZ","Other_Abilities":"FNP_5, BEAST_SNAGGA_FOLLOWING"}},{"file":"data/orks/Unit_Profiles.csv","id_column":"Unit_ID","row_id":"NOBZ","sets":{"Abilities":"GET_OUT_DA_WAY","Other_Abilities":"AMMO_RUNTS, COMPOSITION_NOBZ, LED_BY_NOBZ"}},{"file":"data/orks/Unit_Profiles.csv","id_column":"Unit_ID","row_id":"PAINBOY","sets":{"Abilities":"CRUDE_SURGERY, CANT_CUT_DAT_BIT","Other_Abilities":"SUPPORT_PAINBOY"}},{"file":"data/orks/Unit_Profiles.csv","id_column":"Unit_ID","row_id":"SQUIGHOG_BOYZ","sets":{"Abilities":"BRUTAL_IMPACT","Other_Abilities":"BOMB_SQUIG, COMPOSITION_SQUIGHOG_BOYZ, LED_BY_SQUIGHOG_BOYZ, SQUIGHOG_BOYZ_SMASHA_NOB_PROFILE"}},{"file":"data/orks/Unit_Profiles.csv","id_column":"Unit_ID","row_id":"STOMPA","sets":{"Abilities":"IDOL_OF_BELLIGERENCE, WAAAGH_EFFIGY","Other_Abilities":"DAMAGED_1_10, DEADLY_DEMISE_2D6, SUPER_HEAVY_WALKER, TRANSPORT_STOMPA"}},{"file":"data/orks/Unit_Profiles.csv","id_column":"Unit_ID","row_id":"STORMBOYZ","sets":{"Abilities":"ROKKIT_CHARGE","Other_Abilities":"DEEP_STRIKE, COMPOSITION_STORMBOYZ"}},{"file":"data/orks/Unit_Profiles.csv","id_column":"Unit_ID","row_id":"TANKBUSTAS","sets":{"Abilities":"ROKKIT_BARRAGE, PULSA_ROKKIT","Other_Abilities":"BOMB_SQUIGS_TANKBUSTAS, COMPOSITION_TANKBUSTAS, LED_BY_TANKBUSTAS"}},{"file":"data/orks/Unit_Profiles.csv","id_column":"Unit_ID","row_id":"TRUKK","sets":{"Abilities":"PILIN_OUT","Other_Abilities":"DEADLY_DEMISE_D3, TRANSPORT_TRUKK, FIRING_DECK_12"}},{"file":"data/orks/Unit_Profiles.csv","id_column":"Unit_ID","row_id":"WARBIKERS","sets":{"Abilities":"HIGH_SPEED_CARNAGE","Other_Abilities":"COMPOSITION_WARBIKERS, LED_BY_WARBIKERS"}},{"file":"data/orks/Unit_Profiles.csv","id_column":"Unit_ID","row_id":"WARBOSS","sets":{"Abilities":"MIGHT_IS_RIGHT","Other_Abilities":"BOSS_AMMO_RUNT, INTIMIDATING_MOTIVATION, COMPOSITION_WARBOSS, LEADER_WARBOSS"}},{"file":"data/orks/Unit_Profiles.csv","id_column":"Unit_ID","row_id":"WARTRAKK","sets":{"Abilities":"SPEEDNOB_SUPPORT, BUST_EM","Other_Abilities":""}},{"file":"data/orks/Unit_Profiles.csv","id_column":"Unit_ID","row_id":"WAZDAKKA_GUTSMEK","sets":{"Abilities":"FIXIT_DA_GROT, THROTTLEROCKKIT_SHOKKA_ENGINE, WAAAGH_WAZDAKKA","Other_Abilities":"DEADLY_DEMISE_D3, DEEP_STRIKE, LONE_OPERATIVE"}},{"file":"data/orks/Unit_Profiles.csv","id_column":"Unit_ID","row_id":"WEIRDBOY","sets":{"Abilities":"DA_JUMP","Other_Abilities":"DEADLY_DEMISE_D3, UNSTABLE_ENERGIES, SUPPORT_WEIRDBOY"}},{"file":"data/orks/Unit_Profiles.csv","id_column":"Unit_ID","row_id":"MEGANOBZ","sets":{"Abilities":"ARROGANT_INVULNERABILITY, KRUMPIN_TIME","Other_Abilities":"COMPOSITION_MEGANOBZ, LED_BY_MEGANOBZ"}},{"file":"data/orks/Unit_Profiles.csv","id_column":"Unit_ID","row_id":"NAZDREG","sets":{"Abilities":"NAZDREGS_KNOW_WOTZ, SUPREME_KUNNIN","Other_Abilities":"DEEP_STRIKE, INTIMIDATING_MOTIVATION, LEADER_NAZDREG"}},{"file":"data/orks/Unit_Profiles.csv","id_column":"Unit_ID","row_id":"DEFF_DREAD","sets":{"Abilities":"DREAD_ARD","Other_Abilities":"DEADLY_DEMISE_1, COMPOSITION_DEFF_DREAD"}},{"file":"data/orks/Unit_Profiles.csv","id_column":"Unit_ID","row_id":"GORKANAUT","sets":{"Abilities":"BIG_AN_STOMPY","Other_Abilities":"DAMAGED_7, DEADLY_DEMISE_D6, SUPER_HEAVY_WALKER, GUT_HATCH, TRANSPORT_GORK_MORK"}},{"file":"data/orks/Unit_Profiles.csv","id_column":"Unit_ID","row_id":"MORKANAUT","sets":{"Abilities":"BIG_AN_SHOOTY","Other_Abilities":"DAMAGED_7, DEADLY_DEMISE_D6, SUPER_HEAVY_WALKER, GUT_HATCH, TRANSPORT_GORK_MORK"}},{"file":"data/orks/Unit_Profiles.csv","id_column":"Unit_ID","row_id":"GUNWAGON","sets":{"Abilities":"MOBILE_ARSENAL","Other_Abilities":"DAMAGED_1_6, DEADLY_DEMISE_D6, TRANSPORT_GUNWAGON, COMPOSITION_GUNWAGON"}},{"file":"data/orks/Unit_Profiles.csv","id_column":"Unit_ID","row_id":"HUNTA_RIG","sets":{"Abilities":"FULLY_LOADED_BUTCHERY, TRAMPLASAQUIG_CHARGE","Other_Abilities":"DAMAGED_1_6, DEADLY_DEMISE_D6, FNP_5, TRANSPORT_HUNTA_RIG, FIRING_DECK_11"}},{"file":"data/orks/Unit_Profiles.csv","id_column":"Unit_ID","row_id":"WARBOSS_MEGA_ARMOUR","sets":{"Abilities":"KNUCKLE_IMPETUS","Other_Abilities":"INTIMIDATING_MOTIVATION, LEADER_WARBOSS_IN_MEGA_ARMOUR"}},{"file":"data/orks/Unit_Profiles.csv","id_column":"Unit_ID","row_id":"BIG_MEK_MEGA_ARMOUR","sets":{"Abilities":"FIX_DAT_ARMOUR, KUSTOM_FORCE_FIELD","Other_Abilities":"MORE_DAKKA, COMPOSITION_BIG_MEK_MA, LEADER_BIG_MEK_IN_MEGA_ARMOUR"}},{"file":"data/orks/Unit_Profiles.csv","id_column":"Unit_ID","row_id":"RUNTHERD","sets":{"Abilities":"THEYLL_LEARN_YA","Other_Abilities":"SUPPORT_RUNTHERD"}},{"file":"data/orks/Unit_Profiles.csv","id_column":"Unit_ID","row_id":"PAINBOSS","sets":{"Abilities":"PUSH_DAT_BIT_BACK, HARDY_BILIOUS, RIDIN_WIV_DA_HERD","Other_Abilities":"SUPPORT_PAINBOSS"}},{"file":"data/orks/Unit_Profiles.csv","id_column":"Unit_ID","row_id":"MEK_GUNZ","sets":{"Abilities":"MADCAP_ARTILLERY","Other_Abilities":"COMPOSITION_MEK_GUNZ, LED_BY_MEK_GUNZ"}},{"file":"data/orks/Unit_Profiles.csv","id_column":"Unit_ID","row_id":"RUKKATRUKK_SQUIGBUGGIE","sets":{"Abilities":"SQUIG_BARRAGE","Other_Abilities":"DEADLY_DEMISE_1"}},{"file":"data/orks/Unit_Profiles.csv","id_column":"Unit_ID","row_id":"WARBUGGIES","sets":{"Abilities":"DRIVE_BY_SKORCHIN","Other_Abilities":"DEADLY_DEMISE_1, COMPOSITION_WARBUGGIES"}}]' }}
        run: |
          python3 <<'PY'
          import csv, json, os, sys
          from pathlib import Path

          raw = os.environ.get('PATCHES') or ''
          if not raw.strip():
              print('no PATCHES input; skip apply')
              raise SystemExit(0)
          try:
              ops = json.loads(raw)
          except json.JSONDecodeError as e:
              sys.exit(f'patches is not JSON: {e}')
          if not isinstance(ops, list) or not ops:
              sys.exit('patches must be a non-empty JSON list')

          def decode(val):
              if val is None:
                  return ''
              s = str(val)
              return s.replace('\\n', '\n')

          def load_csv(path):
              if path.is_absolute() or '..' in path.parts:
                  sys.exit(f'bad path {path}')
              if not str(path).startswith('data/') or path.suffix.lower() != '.csv':
                  sys.exit(f'file must be a .csv under data/: {path}')
              if not path.is_file():
                  sys.exit(f'missing {path}')
              with path.open(encoding='utf-8', newline='') as f:
                  rows = list(csv.reader(f))
              if not rows:
                  sys.exit(f'empty csv {path}')
              return rows

          files = {}
          changed = set()

          for i, op in enumerate(ops):
              if not isinstance(op, dict):
                  sys.exit(f'op {i} is not an object')
              path = Path(str(op.get('file', '')).strip())
              if path not in files:
                  files[path] = load_csv(path)
              rows = files[path]
              header = rows[0]
              id_col = str(op.get('id_column') or '').strip() or header[0]
              if id_col not in header:
                  sys.exit(f'op {i}: id column not in header: {id_col}')
              i_id = header.index(id_col)
              row_id = str(op.get('row_id') or '').strip()
              if not row_id:
                  sys.exit(f'op {i}: row_id required')
              mode = str(op.get('mode') or 'update').strip()

              if mode == 'add_column':
                  col = str(op.get('column') or '').strip()
                  if not col:
                      sys.exit(f'op {i}: add_column needs column')
                  if col in header:
                      print(f'column already exists {path} {col}')
                      continue
                  after_col = str(op.get('after_column') or '').strip()
                  if after_col and after_col not in header:
                      sys.exit(f'op {i}: after column not in header: {after_col}')
                  insert_at = header.index(after_col) + 1 if after_col else len(header)
                  old_width = len(header)
                  header.insert(insert_at, col)
                  for row in rows[1:]:
                      while len(row) < old_width:
                          row.append('')
                      row.insert(insert_at, '')
                  changed.add(path)
                  print(f'added column {path} {col}')
                  continue

              if mode == 'remove_column':
                  col = str(op.get('column') or '').strip()
                  if not col:
                      sys.exit(f'op {i}: remove_column needs column')
                  if col not in header:
                      sys.exit(f'op {i}: column not in header: {col}')
                  remove_at = header.index(col)
                  header.pop(remove_at)
                  for row in rows[1:]:
                      if len(row) > remove_at:
                          row.pop(remove_at)
                  changed.add(path)
                  print(f'removed column {path} {col}')
                  continue

              if mode == 'dedupe_by_key':
                  key_col = str(op.get('key_column') or '').strip()
                  if key_col not in header:
                      sys.exit(f'op {i}: key column not in header: {key_col}')
                  i_key = header.index(key_col)
                  kept = [header]
                  seen = set()
                  matched = 0
                  removed = 0
                  for row in rows[1:]:
                      if not row:
                          continue
                      while len(row) < len(header):
                          row.append('')
                      if row[i_id] != row_id:
                          kept.append(row)
                          continue
                      matched += 1
                      key = row[i_key].strip()
                      if not key:
                          sys.exit(f'op {i}: blank {key_col} while deduping {row_id!r}')
                      if key in seen:
                          removed += 1
                          continue
                      seen.add(key)
                      kept.append(row)
                  if matched < 1:
                      sys.exit(f'op {i}: found no rows for {row_id!r}')
                  if removed < 1:
                      sys.exit(f'op {i}: found no duplicate rows for {row_id!r}')
                  files[path] = kept
                  changed.add(path)
                  print(f'deduped {path} {row_id}: kept {len(seen)} unique {key_col} values, removed {removed} duplicates')
                  continue

              if mode == 'fill_blank_where':
                  match_col = str(op.get('match_column') or '').strip()
                  col = str(op.get('column') or '').strip()
                  if match_col not in header:
                      sys.exit(f'op {i}: match column not in header: {match_col}')
                  if col not in header:
                      sys.exit(f'op {i}: column not in header: {col}')
                  match_value = decode(op.get('match_value')).strip()
                  new = decode(op.get('value'))
                  if not match_value:
                      sys.exit(f'op {i}: match_value required')
                  if new == '':
                      sys.exit(f'op {i}: value required')
                  i_match = header.index(match_col)
                  i_col = header.index(col)
                  hits = 0
                  for row in rows[1:]:
                      if not row:
                          continue
                      while len(row) < len(header):
                          row.append('')
                      if row[i_match].strip() == match_value and not row[i_col].strip():
                          row[i_col] = new
                          hits += 1
                  if hits < 1:
                      sys.exit(f'op {i}: found no blank {col} values where {match_col}={match_value!r}')
                  changed.add(path)
                  print(f'filled {hits} blank {col} values in {path} where {match_col}={match_value!r}')
                  continue

              if mode == 'replace_text':
                  col = str(op.get('column') or '').strip()
                  if col not in header:
                      sys.exit(f'op {i}: column not in header: {col}')
                  old = decode(op.get('from'))
                  new = decode(op.get('to'))
                  if not old:
                      sys.exit(f'op {i}: replace_text needs non-empty from')
                  i_col = header.index(col)
                  hits = 0
                  for row in rows[1:]:
                      if not row:
                          continue
                      while len(row) < len(header):
                          row.append('')
                      if old in row[i_col]:
                          row[i_col] = row[i_col].replace(old, new)
                          hits += 1
                  if hits < 1:
                      sys.exit(f'op {i}: replace_text found no matches for {old!r}')
                  changed.add(path)
                  print(f'replaced {old!r} in {hits} rows of {path} column {col}')
                  continue

              if mode == 'delete_where':
                  where = op.get('where')
                  if not isinstance(where, dict) or not where:
                      sys.exit(f'op {i}: delete_where needs where')
                  for col in where:
                      if col not in header:
                          sys.exit(f'op {i}: column not in header: {col}')
                  kept = [header]
                  hits = 0
                  for row in rows[1:]:
                      if not row:
                          continue
                      while len(row) < len(header):
                          row.append('')
                      matched = True
                      for col, val in where.items():
                          if row[header.index(col)] != decode(val):
                              matched = False
                              break
                      if matched:
                          hits += 1
                          continue
                      kept.append(row)
                  if hits < 1:
                      sys.exit(f'op {i}: delete_where found no rows for {where!r}')
                  files[path] = kept
                  changed.add(path)
                  print(f'deleted {hits} rows from {path} where {where}')
                  continue

              if mode == 'delete':
                  kept = [header]
                  hits = 0
                  for row in rows[1:]:
                      if not row:
                          continue
                      if len(row) > i_id and row[i_id] == row_id:
                          hits += 1
                          continue
                      kept.append(row)
                  if hits != 1:
                      sys.exit(f'op {i}: expected 1 row for {row_id!r}, found {hits}')
                  files[path] = kept
                  changed.add(path)
                  print(f'deleted {path} {row_id}')
                  continue

              if mode == 'insert':
                  existing = 0
                  for row in rows[1:]:
                      if row and len(row) > i_id and row[i_id] == row_id:
                          existing += 1
                  allow_duplicate_id = bool(op.get('allow_duplicate_id'))
                  if existing and not allow_duplicate_id:
                      sys.exit(f'op {i}: row already exists: {row_id}')
                  sets = op.get('sets')
                  if not isinstance(sets, dict) or not sets:
                      sys.exit(f'op {i}: insert needs sets')
                  new_row = [''] * len(header)
                  new_row[i_id] = row_id
                  for col, val in sets.items():
                      if col not in header:
                          sys.exit(f'op {i}: column not in header: {col}')
                      new_row[header.index(col)] = decode(val)
                  after = str(op.get('after_row_id') or '').strip()
                  if after:
                      placed = False
                      kept = [header]
                      for row in rows[1:]:
                          kept.append(row)
                          if row and len(row) > i_id and row[i_id] == after:
                              kept.append(new_row)
                              placed = True
                      if not placed:
                          sys.exit(f'op {i}: after_row_id not found: {after}')
                      files[path] = kept
                  else:
                      rows.append(new_row)
                      files[path] = rows
                  changed.add(path)
                  print(f'inserted {path} {row_id}')
                  continue

              if mode != 'update':
                  sys.exit(f'op {i}: unknown mode {mode}')

              sets = op.get('sets')
              if not isinstance(sets, dict) or not sets:
                  sets = {}
                  if op.get('column'):
                      sets[str(op['column'])] = op.get('value', '')
                  if op.get('column_2'):
                      sets[str(op['column_2'])] = op.get('value_2', '')
              if not sets:
                  sys.exit(f'op {i}: update needs sets or column/value')

              hits = 0
              for row in rows[1:]:
                  if not row:
                      continue
                  while len(row) < len(header):
                      row.append('')
                  if row[i_id] != row_id:
                      continue
                  for col, val in sets.items():
                      if col not in header:
                          sys.exit(f'op {i}: column not in header: {col}')
                      row[header.index(col)] = decode(val)
                  hits += 1
              if hits != 1:
                  sys.exit(f'op {i}: expected 1 row for {row_id!r}, found {hits}')
              changed.add(path)
              print(f'updated {path} {row_id} {list(sets)}')

          for path, rows in files.items():
              if path not in changed:
                  continue
              with path.open('w', newline='', encoding='utf-8') as f:
                  csv.writer(f, lineterminator='\n').writerows(rows)
          print('changed', ' '.join(str(p) for p in sorted(changed)))
          PY

      - name: Refresh manifests
        run: python3 scripts/data_schema.py manifest

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- data
          if git diff --cached --quiet; then
            echo "No change"
            exit 0
          fi
          git commit -m "Patch CSV line items"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
