name: Patch CSV

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-csv.yml'
  workflow_dispatch:
    inputs:
      patches:
        description: JSON list of operations. One run, one commit.
        required: true
        type: string

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply patches
        env:
          PATCHES: ${{ inputs.patches || '[{"file":"data/marines/Abilities.csv","id_column":"Ability_ID","row_id":"VICTRIX_HONOUR_GUARD_GLORY_OF_ULTRAMAR","mode":"update","sets":{"Ability Name":"Glory of Ultramar","Short_Description":"OPP SHOOTING\u003a Model destroyed \u2192 SURGE D6\"","Long_Description":"In your opponent\u2019s Shooting phase, when an enemy unit has shot, if a model in this unit was destroyed by those attacks, this unit can make a surge move of up to D6\".","Tags":"","Tag Categories":"","Order":"0","Visibility_ID":"1","Default_Active":"1"}},{"file":"data/marines/Abilities.csv","id_column":"Ability_ID","row_id":"VICTRIX_HONOUR_GUARD_HONOUR_GUARD_OF_MACRAGGE","mode":"update","sets":{"Ability Name":"Honour Guard of Macragge","Short_Description":"Enemy attacks\u003a -1 TO WOUND","Long_Description":"Attacks that target this unit have -1 to wound rolls.","Tags":"","Tag Categories":"","Order":"0","Visibility_ID":"1","Default_Active":"1"}},{"file":"data/marines/Abilities.csv","id_column":"Ability_ID","row_id":"VICTRIX_HONOUR_GUARD_BANNER_OF_MACRAGGE","mode":"update","sets":{"Ability Name":"Banner of Macragge","Short_Description":"CONTROL objective \u2192 SECURED\n1/BATTLE when selected to FIGHT\u003a melee +1 A / +1 S","Long_Description":"At the end of your Movement phase, if this unit is controlling an objective, that objective is secured.\n\n(Once per battle, per army) When this unit is selected to fight, you can use this ability. If you do, this unit\u2019s melee attacks have +1 A and S.","Tags":"[+1 A] [+1 S]","Tag Categories":"[Melee - Weapon Stats] [Melee - Weapon Stats]","Order":"0","Visibility_ID":"1","Default_Active":"0"}},{"file":"data/marines/Abilities.csv","id_column":"Ability_ID","row_id":"VICTRIX_HONOUR_GUARD_UNIT_COMPOSITION","mode":"update","sets":{"Ability Name":"Unit Composition","Short_Description":"0-1 Chapter Ancient\n0-1 Chapter Champion\n1-6 Victrix Honour Guard","Long_Description":"0-1 Chapter Ancient model\n0-1 Chapter Champion model\n1-6 Victrix Honour Guard models\n\nThe Chapter Ancient is equipped with\u003a Banner of Macragge; 1 Master-crafted Bolt Carbine; 1 Master-crafted Power Weapon.\n\nThe Chapter Champion is equipped with\u003a 1 Blades of Honour.\n\nEvery Victrix Honour Guard is equipped with\u003a 1 Master-crafted Bolt Carbine; 1 Master-crafted Power Weapon.\n\nKeywords \u2014 All Models\u003a INFANTRY; IMPERIUM; TACTICUS. Chapter Ancient\u003a ANCIENT; EPIC HERO. Chapter Champion\u003a CHAMPION; EPIC HERO. Faction Keywords\u003a ADEPTUS ASTARTES; ULTRAMARINES.","Tags":"","Tag Categories":"","Order":"9","Visibility_ID":"3","Default_Active":"0"}},{"file":"data/marines/Abilities.csv","id_column":"Ability_ID","row_id":"KAIUS_KONORIUS_SUPPORT","mode":"insert","sets":{"Ability Name":"Support","Short_Description":"Support","Long_Description":"Support.","Tags":"","Tag Categories":"","Order":"0","Visibility_ID":"2","Default_Active":"1"}},{"file":"data/marines/Abilities.csv","id_column":"Ability_ID","row_id":"KAIUS_KONORIUS_VETERAN_BODYGUARD","mode":"insert","sets":{"Ability Name":"Veteran Bodyguard","Short_Description":"ATTACHED\u003a Other CHARACTER models gain FNP 4+","Long_Description":"While this model is attached to a unit, other CHARACTER models in this unit have Feel No Pain 4+.","Tags":"","Tag Categories":"","Order":"0","Visibility_ID":"1","Default_Active":"1"}},{"file":"data/marines/Abilities.csv","id_column":"Ability_ID","row_id":"KAIUS_KONORIUS_CALGARS_CHAMPION","mode":"insert","sets":{"Ability Name":"Calgar\u2019s Champion","Short_Description":"Vs CHARACTER\u003a RE-ROLL HIT 1S / WOUND 1S","Long_Description":"This model\u2019s attacks that target a CHARACTER unit can\u003a\n\u2022 Re-roll hit rolls of 1.\n\u2022 Re-roll wound rolls of 1.","Tags":"[RE-ROLL 1S TO HIT] [RE-ROLL 1S TO WOUND] [RE-ROLL 1S TO HIT] [RE-ROLL 1S TO WOUND]","Tag Categories":"[Melee - Combat Modifiers] [Melee - Combat Modifiers] [Range - Combat Modifiers] [Range - Combat Modifiers]","Order":"0","Visibility_ID":"1","Default_Active":"0"}},{"file":"data/marines/Abilities.csv","id_column":"Ability_ID","row_id":"KAIUS_KONORIUS_UNIT_COMPOSITION","mode":"insert","sets":{"Ability Name":"Unit Composition","Short_Description":"1 Kaius Konorius model\nEquipped\u003a Heavy Bolt Pistol; Severance and Rebuke","Long_Description":"1 Kaius Konorius model.\n\nThis model is equipped with\u003a 1 Heavy Bolt Pistol; 1 Severance and Rebuke.","Tags":"","Tag Categories":"","Order":"9","Visibility_ID":"3","Default_Active":"0"}}]' }}
        run: |
          python3 <<'PY'
          import csv, json, os, sys
          from pathlib import Path

          raw = os.environ.get('PATCHES') or ''
          if not raw.strip():
              print('no PATCHES input; skip apply')
              raise SystemExit(0)
          try:
              ops = json.loads(raw)
          except json.JSONDecodeError as e:
              sys.exit(f'patches is not JSON: {e}')
          if not isinstance(ops, list) or not ops:
              sys.exit('patches must be a non-empty JSON list')

          def decode(val):
              if val is None:
                  return ''
              s = str(val)
              return s.replace('\\n', '\n')

          def load_csv(path):
              if path.is_absolute() or '..' in path.parts:
                  sys.exit(f'bad path {path}')
              if not str(path).startswith('data/') or path.suffix.lower() != '.csv':
                  sys.exit(f'file must be a .csv under data/: {path}')
              if not path.is_file():
                  sys.exit(f'missing {path}')
              with path.open(encoding='utf-8', newline='') as f:
                  rows = list(csv.reader(f))
              if not rows:
                  sys.exit(f'empty csv {path}')
              return rows

          files = {}
          changed = set()

          for i, op in enumerate(ops):
              if not isinstance(op, dict):
                  sys.exit(f'op {i} is not an object')
              path = Path(str(op.get('file', '')).strip())
              if path not in files:
                  files[path] = load_csv(path)
              rows = files[path]
              header = rows[0]
              id_col = str(op.get('id_column') or '').strip() or header[0]
              if id_col not in header:
                  sys.exit(f'op {i}: id column not in header: {id_col}')
              i_id = header.index(id_col)
              row_id = str(op.get('row_id') or '').strip()
              if not row_id:
                  sys.exit(f'op {i}: row_id required')
              mode = str(op.get('mode') or 'update').strip()

              if mode == 'add_column':
                  col = str(op.get('column') or '').strip()
                  if not col:
                      sys.exit(f'op {i}: add_column needs column')
                  if col in header:
                      print(f'column already exists {path} {col}')
                      continue
                  after_col = str(op.get('after_column') or '').strip()
                  if after_col and after_col not in header:
                      sys.exit(f'op {i}: after column not in header: {after_col}')
                  insert_at = header.index(after_col) + 1 if after_col else len(header)
                  old_width = len(header)
                  header.insert(insert_at, col)
                  for row in rows[1:]:
                      while len(row) < old_width:
                          row.append('')
                      row.insert(insert_at, '')
                  changed.add(path)
                  print(f'added column {path} {col}')
                  continue

              if mode == 'remove_column':
                  col = str(op.get('column') or '').strip()
                  if not col:
                      sys.exit(f'op {i}: remove_column needs column')
                  if col not in header:
                      sys.exit(f'op {i}: column not in header: {col}')
                  remove_at = header.index(col)
                  header.pop(remove_at)
                  for row in rows[1:]:
                      if len(row) > remove_at:
                          row.pop(remove_at)
                  changed.add(path)
                  print(f'removed column {path} {col}')
                  continue

              if mode == 'dedupe_by_key':
                  key_col = str(op.get('key_column') or '').strip()
                  if key_col not in header:
                      sys.exit(f'op {i}: key column not in header: {key_col}')
                  i_key = header.index(key_col)
                  kept = [header]
                  seen = set()
                  matched = 0
                  removed = 0
                  for row in rows[1:]:
                      if not row:
                          continue
                      while len(row) < len(header):
                          row.append('')
                      if row[i_id] != row_id:
                          kept.append(row)
                          continue
                      matched += 1
                      key = row[i_key].strip()
                      if not key:
                          sys.exit(f'op {i}: blank {key_col} while deduping {row_id!r}')
                      if key in seen:
                          removed += 1
                          continue
                      seen.add(key)
                      kept.append(row)
                  if matched < 1:
                      sys.exit(f'op {i}: found no rows for {row_id!r}')
                  if removed < 1:
                      sys.exit(f'op {i}: found no duplicate rows for {row_id!r}')
                  files[path] = kept
                  changed.add(path)
                  print(f'deduped {path} {row_id}: kept {len(seen)} unique {key_col} values, removed {removed} duplicates')
                  continue

              if mode == 'fill_blank_where':
                  match_col = str(op.get('match_column') or '').strip()
                  col = str(op.get('column') or '').strip()
                  if match_col not in header:
                      sys.exit(f'op {i}: match column not in header: {match_col}')
                  if col not in header:
                      sys.exit(f'op {i}: column not in header: {col}')
                  match_value = decode(op.get('match_value')).strip()
                  new = decode(op.get('value'))
                  if not match_value:
                      sys.exit(f'op {i}: match_value required')
                  if new == '':
                      sys.exit(f'op {i}: value required')
                  i_match = header.index(match_col)
                  i_col = header.index(col)
                  hits = 0
                  for row in rows[1:]:
                      if not row:
                          continue
                      while len(row) < len(header):
                          row.append('')
                      if row[i_match].strip() == match_value and not row[i_col].strip():
                          row[i_col] = new
                          hits += 1
                  if hits < 1:
                      sys.exit(f'op {i}: found no blank {col} values where {match_col}={match_value!r}')
                  changed.add(path)
                  print(f'filled {hits} blank {col} values in {path} where {match_col}={match_value!r}')
                  continue

              if mode == 'replace_text':
                  col = str(op.get('column') or '').strip()
                  if col not in header:
                      sys.exit(f'op {i}: column not in header: {col}')
                  old = decode(op.get('from'))
                  new = decode(op.get('to'))
                  if not old:
                      sys.exit(f'op {i}: replace_text needs non-empty from')
                  i_col = header.index(col)
                  hits = 0
                  for row in rows[1:]:
                      if not row:
                          continue
                      while len(row) < len(header):
                          row.append('')
                      if old in row[i_col]:
                          row[i_col] = row[i_col].replace(old, new)
                          hits += 1
                  if hits < 1:
                      sys.exit(f'op {i}: replace_text found no matches for {old!r}')
                  changed.add(path)
                  print(f'replaced {old!r} in {hits} rows of {path} column {col}')
                  continue

              if mode == 'delete':
                  kept = [header]
                  hits = 0
                  for row in rows[1:]:
                      if not row:
                          continue
                      if len(row) > i_id and row[i_id] == row_id:
                          hits += 1
                          continue
                      kept.append(row)
                  if hits != 1:
                      sys.exit(f'op {i}: expected 1 row for {row_id!r}, found {hits}')
                  files[path] = kept
                  changed.add(path)
                  print(f'deleted {path} {row_id}')
                  continue

              if mode == 'insert':
                  existing = 0
                  for row in rows[1:]:
                      if row and len(row) > i_id and row[i_id] == row_id:
                          existing += 1
                  if existing:
                      sys.exit(f'op {i}: row already exists: {row_id}')
                  sets = op.get('sets')
                  if not isinstance(sets, dict) or not sets:
                      sys.exit(f'op {i}: insert needs sets')
                  new_row = [''] * len(header)
                  new_row[i_id] = row_id
                  for col, val in sets.items():
                      if col not in header:
                          sys.exit(f'op {i}: column not in header: {col}')
                      new_row[header.index(col)] = decode(val)
                  after = str(op.get('after_row_id') or '').strip()
                  if after:
                      placed = False
                      kept = [header]
                      for row in rows[1:]:
                          kept.append(row)
                          if row and len(row) > i_id and row[i_id] == after:
                              kept.append(new_row)
                              placed = True
                      if not placed:
                          sys.exit(f'op {i}: after_row_id not found: {after}')
                      files[path] = kept
                  else:
                      rows.append(new_row)
                      files[path] = rows
                  changed.add(path)
                  print(f'inserted {path} {row_id}')
                  continue

              if mode != 'update':
                  sys.exit(f'op {i}: unknown mode {mode}')

              sets = op.get('sets')
              if not isinstance(sets, dict) or not sets:
                  sets = {}
                  if op.get('column'):
                      sets[str(op['column'])] = op.get('value', '')
                  if op.get('column_2'):
                      sets[str(op['column_2'])] = op.get('value_2', '')
              if not sets:
                  sys.exit(f'op {i}: update needs sets or column/value')

              hits = 0
              for row in rows[1:]:
                  if not row:
                      continue
                  while len(row) < len(header):
                      row.append('')
                  if row[i_id] != row_id:
                      continue
                  for col, val in sets.items():
                      if col not in header:
                          sys.exit(f'op {i}: column not in header: {col}')
                      row[header.index(col)] = decode(val)
                  hits += 1
              if hits != 1:
                  sys.exit(f'op {i}: expected 1 row for {row_id!r}, found {hits}')
              changed.add(path)
              print(f'updated {path} {row_id} {list(sets)}')

          for path, rows in files.items():
              if path not in changed:
                  continue
              with path.open('w', newline='', encoding='utf-8') as f:
                  csv.writer(f, lineterminator='\n').writerows(rows)
          print('changed', ' '.join(str(p) for p in sorted(changed)))
          PY

      - name: Refresh manifests
        run: python3 scripts/data_schema.py manifest

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- data
          if git diff --cached --quiet; then
            echo "No change"
            exit 0
          fi
          git commit -m "Patch CSV line items"
          git push