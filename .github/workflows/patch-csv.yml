name: Patch CSV

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-csv.yml'
  workflow_dispatch:
    inputs:
      patches:
        description: JSON list of operations. One run, one commit.
        required: true
        type: string

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply patches
        env:
          PATCHES: ${{ inputs.patches || '[{"file":"data/orks/Abilities.csv","id_column":"Ability_ID","row_id":"FUEL_MIXA_GROB","column":"Short_Description","value":"ADVANCE [+1 M”]"},{"file":"data/orks/Abilities.csv","id_column":"Ability_ID","row_id":"HARDY_BILIOUS","column":"Short_Description","value":"Attack Strength higher Toughness\u003A -1 to Wound. [INCOMING -1 TO WOUND]"},{"file":"data/orks/Abilities.csv","id_column":"Ability_ID","row_id":"RIDIN_WIV_DA_HERD","column":"Short_Description","value":"If attached to a Mounted unit, loses Infantry, gains Mounted and +4\" M. [+4 M”]"},{"file":"data/orks/Abilities.csv","id_column":"Ability_ID","row_id":"STRAFING_RUN","column":"Short_Description","value":"RANGE vs non-FLY [+1 TO HIT]"},{"file":"data/orks/Abilities.csv","id_column":"Ability_ID","row_id":"BURNA_BOMB","column":"Short_Description","value":"End of opponent Fight phase\u003A D3 MW on 2+ and IGNORES COVER until your next turn. [IGNORES COVER]"},{"file":"data/orks/Abilities.csv","id_column":"Ability_ID","row_id":"GO_FER_DA_WEAK_SPOT","column":"Short_Description","value":"RANGE vs MONSTER / VEHICLE [+1 TO WOUND]"},{"file":"data/orks/Abilities.csv","id_column":"Ability_ID","row_id":"WAZBOM_FORCE_FIELD","column":"Short_Description","value":"ANYTIME\u003A does not have SMOKE [INVULNERABLE SAVE 5+]"},{"file":"data/orks/Abilities.csv","id_column":"Ability_ID","row_id":"SQUIG_BARRAGE","column":"Short_Description","value":"After shooting, non-MONSTER / VEHICLE hit by Squig Launchas is covered in Squigs (-1 to hit). [ENEMY -1 TO HIT]"},{"file":"data/orks/Abilities.csv","id_column":"Ability_ID","row_id":"FORTIFICATION","column":"Short_Description","value":"Standard fortification targeting / fall-back / auto-pass hazard rules. [OUTGOING RANGE -1 TO HIT] [ENEMY AUTO-PASS HAZARD]"},{"file":"data/orks/Abilities.csv","id_column":"Ability_ID","row_id":"RAMSHACKLE_COVER","column":"Short_Description","value":"If target is not fully visible because of this unit [TARGET GETS COVER]"},{"file":"data/orks/Abilities.csv","id_column":"Ability_ID","row_id":"MADCAP_ARTILLERY","column":"Short_Description","value":"After shooting same-type Mek Gunz, apply wobbled / zapped / smashed / grounded. [TARGET GETS COVER] [ENEMY -1 LD] [ENEMY -2 M”] [ENEMY GROUNDED]"},{"file":"data/orks/Abilities.csv","id_column":"Ability_ID","row_id":"GUNWAGON_ZZAP_GUN_POINTS","column":"Short_Description","value":"Gunwagon Zzap Gun +10 Pts [+10 Pts]"},{"file":"data/orks/Army_Rules.csv","id_column":"Army_Rule_ID","row_id":"orks_army_rule_waaagh","column":"Short_Description","value":"Always\u003A Re-roll Advances\\n\\nRILED UP\u003A 5++, Assault Ranged, Advance & Charge. Lasts thru end of turn. [RE-ROLL ADVANCE] [5++ Invul] [ASSAULT] [ADVANCE AND CHARGE]"},{"file":"data/orks/Army_Rules.csv","id_column":"Army_Rule_ID","row_id":"orks_army_rule_da_boss","column":"Short_Description","value":"WARLORD gains +1 CP [GAIN 1 CP]"},{"file":"data/orks/Detachment_Definitions.csv","id_column":"Rule_ID","row_id":"orks_freebooter_krew_detachment_rule_here_be_loot","column":"Short_Description","value":"Start of Command\u003A Select Loot objective. ORKS INFANTRY, MOUNTED, WALKER attacks gain [SUSTAINED HITS 1] if they STAND in it or TARGET units within it. [SUSTAINED HITS 1] [SUSTAINED HITS 1]"},{"file":"data/orks/Detachment_Definitions.csv","id_column":"Rule_ID","row_id":"orks_rollin_deff_detachment_rule_thundering_wagons","column":"Short_Description","value":"WAGON re‑rolls Charge & Advance flat 6\". \\n\\nBATTLEWAGON, HUNTA & KILL RIG. [RE-ROLL CHARGE] [ADVANCE 6]"},{"file":"data/orks/Detachment_Definitions.csv","id_column":"Rule_ID","row_id":"orks_green_tide_detachment_rule_mob_handed_brutality","column":"Short_Description","value":"BOYZ MELEE\u003A SUSTAINED HITS 1.\\nCHARGE - INFANTRY gain \\nLETHAL HITS\u003A non-MONSTER / VEHICLE [SUSTAINED HITS 1] [LETHAL HITS]"},{"file":"data/orks/Detachment_Definitions.csv","id_column":"Rule_ID","row_id":"orks_bully_boyz_detachment_rule_displays_of_savagery","column":"Short_Description","value":"MEGANOBZ / NOBZ\\nMELEE\u003A SUSTAINED HITS 1 [SUSTAINED HITS 1]"},{"file":"data/orks/Detachment_Definitions.csv","id_column":"Rule_ID","row_id":"orks_taktikal_brigade_detachment_rule_suspiciously_well_organised","column":"Short_Description","value":"STORMBOYZ have BATTLELINE. BOYZ / KOMMANDOS / STORMBOYZ can Fall Back and still charge. [FALL BACK AND CHARGE]"},{"file":"data/orks/Detachment_Definitions.csv","id_column":"Rule_ID","row_id":"orks_wreckas_detachment_rule_wreckin_and_lootin","column":"Short_Description","value":"BREAKA BOYZ / FLASH GITZ / TANKBUSTAS [Re-roll 1s To Hit] if they or their target are in range of an objective. [RE-ROLL 1S TO HIT] [RE-ROLL 1S TO HIT]"},{"file":"data/orks/Detachment_Definitions.csv","id_column":"Rule_ID","row_id":"orks_da_big_hunt_detachment_rule_da_hunt_is_on","column":"Short_Description","value":"BEAST SNAGGAs attacks that target MONSTER / VEHICLE unit have +1 AP. [+1 AP] [+1 AP]"},{"file":"data/orks/Detachment_Definitions.csv","id_column":"Rule_ID","row_id":"orks_madcap_meks_detachment_rule_unpredictable_genius","column":"Short_Description","value":"When BIG MEK / MEK GUNZ / MORKANAUT / WAZBOM BLASTAJET puts all ranged attacks into one enemy, roll D6 table. [+1 TO HIT] [+1 TO HIT] [ENEMY -1 T]"},{"file":"data/orks/Detachment_Definitions.csv","id_column":"Rule_ID","row_id":"orks_blitz_brigade_detachment_rule_unstoppable_momentum","column":"Short_Description","value":"WAGON\\nRe-roll Charges & can Advance flat 6. [RE-ROLL CHARGE] [ADVANCE 6]"},{"file":"data/orks/Detachment_Definitions.csv","id_column":"Rule_ID","row_id":"orks_kult_of_speed_detachment_rule_adrenaline_junkies","column":"Short_Description","value":"WARBIKERS have BATTLELINE. SPEED FREEKS Advance/Fall Back\u003A ranged [ASSAULT] this turn and can still charge. [ADVANCE AND CHARGE] [FALL BACK AND CHARGE]"},{"file":"data/orks/Detachment_Definitions.csv","id_column":"Rule_ID","row_id":"orks_flyboyz_detachment_rule_skyborne_loons","column":"Short_Description","value":"ORKS AIRCRAFT ignore Strategic Reserves points cap. Riled up ORKS AIRCRAFT / DEFFKOPTAS ranged +1 to hit. [+1 TO HIT]"},{"file":"data/orks/Detachment_Definitions.csv","id_column":"Rule_ID","row_id":"orks_wurrband_detachment_rule_powers_of_da_waaagh","column":"Short_Description","value":"ORKS PSYKER [PSYCHIC] attacks gain +1 S, plus +1 S per 5 models in/embarked with the unit. ORKS PSYKERS gain Roar of Mork and Visions of Violence. [FIGHTS FIRST]"},{"file":"data/orks/Detachment_Definitions.csv","id_column":"Rule_ID","row_id":"orks_shoota_boyz_detachment_rule_dakka_dakka_dakka","column":"Short_Description","value":"INFANTRY ranged attacks have [ASSAULT]. If RILED UP, ranged attacks +3\" R. [+3 R”]"},{"file":"data/orks/Enhancements.csv","id_column":"Enhancement_ID","row_id":"orks_war_horde_enhancement_headwoppas_killchoppa","column":"Short_Description","value":"ORKS model only. If this unit charged this turn, this model’s melee attacks have +1 AP. [+1 AP]"},{"file":"data/orks/Enhancements.csv","id_column":"Enhancement_ID","row_id":"orks_war_horde_enhancement_da_boss_is_watchin","column":"Short_Description","value":"ORKS model only. Once per battle, per army\u003A in your Movement phase, this unit is RILED UP until the start of your next turn. [RILED UP] [5++ Invul]"},{"file":"data/orks/Enhancements.csv","id_column":"Enhancement_ID","row_id":"orks_war_horde_enhancement_kunnin_but_brutal","column":"Short_Description","value":"ORKS model only. Fall Back does not prevent this unit from shooting or charging. [FALL BACK AND SHOOT] [FALL BACK AND CHARGE]"},{"file":"data/orks/Enhancements.csv","id_column":"Enhancement_ID","row_id":"orks_war_horde_enhancement_follow_me_ladz","column":"Short_Description","value":"ORKS model only. This unit has +2\" M. [+2 M”]"},{"file":"data/orks/Enhancements.csv","id_column":"Enhancement_ID","row_id":"orks_freebooter_krew_enhancement_bionik_workshop","column":"Short_Description","value":"BIG MEK or PAINBOY. At Battle’s start, roll D3 to determine Bionik ability\u003A \\n1) Bionik Legs +2″ to Move \\n2) Bionik Arms +1 Strength in melee \\n3) Bionik Bonce WS +1 [+2 M”] [+1 S] [+1 WS]"},{"file":"data/orks/Enhancements.csv","id_column":"Enhancement_ID","row_id":"orks_rollin_deff_enhancement_boarding_ramps_1","column":"Short_Description","value":"WAGON. Units disembarking gain +1 to Charge until end of turn. [+1 CHARGE]"},{"file":"data/orks/Enhancements.csv","id_column":"Enhancement_ID","row_id":"orks_rollin_deff_enhancement_boarding_ramps_2","column":"Short_Description","value":"WAGON. Units disembarking gain +1 to Charge until end of turn. [+1 CHARGE]"},{"file":"data/orks/Enhancements.csv","id_column":"Enhancement_ID","row_id":"orks_freebooter_krew_enhancement_da_kaptin","column":"Short_Description","value":"ORKS. Once per battle round, friendly battle‑shocked ORKS within 12″; suffers D3 mortals and no longer battle‑shocked. [REMOVE BATTLE-SHOCK]"},{"file":"data/orks/Enhancements.csv","id_column":"Enhancement_ID","row_id":"orks_more_dakka_enhancement_dead_shiny_shootas","column":"Short_Description","value":"ORKS INFANTRY. Ranged have [RAPID FIRE 1]; if already [RAPID FIRE], then +1 Rapid Fire. [RAPID FIRE 1]"},{"file":"data/orks/Enhancements.csv","id_column":"Enhancement_ID","row_id":"orks_freebooter_krew_enhancement_razgits_magik_map","column":"Short_Description","value":"ORKS. After deployment, redeploy up to three ORKS INFANTRY; they may go to Reserves regardless of limits. [REDEPLOY 3]"},{"file":"data/orks/Enhancements.csv","id_column":"Enhancement_ID","row_id":"orks_rollin_deff_enhancement_targetin_gizmos","column":"Short_Description","value":"WAGON. With BIG MEK embarked, ranged attacks IGNORE COVER \\n\\nIf Waaagh! is active, they also gain SUSTAINED HITS 1 [IGNORES COVER] [SUSTAINED HITS 1]"},{"file":"data/orks/Enhancements.csv","id_column":"Enhancement_ID","row_id":"orks_green_tide_enhancement_ardboyz","column":"Short_Description","value":"BOYZ unit\\n4+ Save [SAVE 4+]"},{"file":"data/orks/Enhancements.csv","id_column":"Enhancement_ID","row_id":"orks_bully_boyz_enhancement_wimp_kickaz","column":"Short_Description","value":"NOBZ unit only. Engaged enemy that Falls Back must use desperate escape; -1 hazard rolls if this unit is RILED UP. [FORCE DESPERATE ESCAPE] [ENEMY -1 HAZARD]"}]' }}
        run: |
          python3 <<'PY'
          import csv, json, os, sys
          from pathlib import Path

          raw = os.environ.get('PATCHES') or ''
          if not raw.strip():
              print('no PATCHES input; skip apply')
              raise SystemExit(0)
          try:
              ops = json.loads(raw)
          except json.JSONDecodeError as e:
              sys.exit(f'patches is not JSON: {e}')
          if not isinstance(ops, list) or not ops:
              sys.exit('patches must be a non-empty JSON list')

          def decode(val):
              if val is None:
                  return ''
              s = str(val)
              return s.replace('\\n', '\n')

          def load_csv(path):
              if path.is_absolute() or '..' in path.parts:
                  sys.exit(f'bad path {path}')
              if not str(path).startswith('data/') or path.suffix.lower() != '.csv':
                  sys.exit(f'file must be a .csv under data/: {path}')
              if not path.is_file():
                  sys.exit(f'missing {path}')
              with path.open(encoding='utf-8', newline='') as f:
                  rows = list(csv.reader(f))
              if not rows:
                  sys.exit(f'empty csv {path}')
              return rows

          files = {}
          changed = set()

          for i, op in enumerate(ops):
              if not isinstance(op, dict):
                  sys.exit(f'op {i} is not an object')
              path = Path(str(op.get('file', '')).strip())
              if path not in files:
                  files[path] = load_csv(path)
              rows = files[path]
              header = rows[0]
              id_col = str(op.get('id_column') or '').strip() or header[0]
              if id_col not in header:
                  sys.exit(f'op {i}: id column not in header: {id_col}')
              i_id = header.index(id_col)
              row_id = str(op.get('row_id') or '').strip()
              if not row_id:
                  sys.exit(f'op {i}: row_id required')
              mode = str(op.get('mode') or 'update').strip()

              if mode == 'add_column':
                  col = str(op.get('column') or '').strip()
                  if not col:
                      sys.exit(f'op {i}: add_column needs column')
                  if col in header:
                      print(f'column already exists {path} {col}')
                      continue
                  after_col = str(op.get('after_column') or '').strip()
                  if after_col and after_col not in header:
                      sys.exit(f'op {i}: after column not in header: {after_col}')
                  insert_at = header.index(after_col) + 1 if after_col else len(header)
                  old_width = len(header)
                  header.insert(insert_at, col)
                  for row in rows[1:]:
                      while len(row) < old_width:
                          row.append('')
                      row.insert(insert_at, '')
                  changed.add(path)
                  print(f'added column {path} {col}')
                  continue

              if mode == 'remove_column':
                  col = str(op.get('column') or '').strip()
                  if not col:
                      sys.exit(f'op {i}: remove_column needs column')
                  if col not in header:
                      sys.exit(f'op {i}: column not in header: {col}')
                  remove_at = header.index(col)
                  header.pop(remove_at)
                  for row in rows[1:]:
                      if len(row) > remove_at:
                          row.pop(remove_at)
                  changed.add(path)
                  print(f'removed column {path} {col}')
                  continue

              if mode == 'dedupe_by_key':
                  key_col = str(op.get('key_column') or '').strip()
                  if key_col not in header:
                      sys.exit(f'op {i}: key column not in header: {key_col}')
                  i_key = header.index(key_col)
                  kept = [header]
                  seen = set()
                  matched = 0
                  removed = 0
                  for row in rows[1:]:
                      if not row:
                          continue
                      while len(row) < len(header):
                          row.append('')
                      if row[i_id] != row_id:
                          kept.append(row)
                          continue
                      matched += 1
                      key = row[i_key].strip()
                      if not key:
                          sys.exit(f'op {i}: blank {key_col} while deduping {row_id!r}')
                      if key in seen:
                          removed += 1
                          continue
                      seen.add(key)
                      kept.append(row)
                  if matched < 1:
                      sys.exit(f'op {i}: found no rows for {row_id!r}')
                  if removed < 1:
                      sys.exit(f'op {i}: found no duplicate rows for {row_id!r}')
                  files[path] = kept
                  changed.add(path)
                  print(f'deduped {path} {row_id}: kept {len(seen)} unique {key_col} values, removed {removed} duplicates')
                  continue

              if mode == 'fill_blank_where':
                  match_col = str(op.get('match_column') or '').strip()
                  col = str(op.get('column') or '').strip()
                  if match_col not in header:
                      sys.exit(f'op {i}: match column not in header: {match_col}')
                  if col not in header:
                      sys.exit(f'op {i}: column not in header: {col}')
                  match_value = decode(op.get('match_value')).strip()
                  new = decode(op.get('value'))
                  if not match_value:
                      sys.exit(f'op {i}: match_value required')
                  if new == '':
                      sys.exit(f'op {i}: value required')
                  i_match = header.index(match_col)
                  i_col = header.index(col)
                  hits = 0
                  for row in rows[1:]:
                      if not row:
                          continue
                      while len(row) < len(header):
                          row.append('')
                      if row[i_match].strip() == match_value and not row[i_col].strip():
                          row[i_col] = new
                          hits += 1
                  if hits < 1:
                      sys.exit(f'op {i}: found no blank {col} values where {match_col}={match_value!r}')
                  changed.add(path)
                  print(f'filled {hits} blank {col} values in {path} where {match_col}={match_value!r}')
                  continue

              if mode == 'replace_text':
                  col = str(op.get('column') or '').strip()
                  if col not in header:
                      sys.exit(f'op {i}: column not in header: {col}')
                  old = decode(op.get('from'))
                  new = decode(op.get('to'))
                  if not old:
                      sys.exit(f'op {i}: replace_text needs non-empty from')
                  i_col = header.index(col)
                  hits = 0
                  for row in rows[1:]:
                      if not row:
                          continue
                      while len(row) < len(header):
                          row.append('')
                      if old in row[i_col]:
                          row[i_col] = row[i_col].replace(old, new)
                          hits += 1
                  if hits < 1:
                      sys.exit(f'op {i}: replace_text found no matches for {old!r}')
                  changed.add(path)
                  print(f'replaced {old!r} in {hits} rows of {path} column {col}')
                  continue

              if mode == 'delete':
                  kept = [header]
                  hits = 0
                  for row in rows[1:]:
                      if not row:
                          continue
                      if len(row) > i_id and row[i_id] == row_id:
                          hits += 1
                          continue
                      kept.append(row)
                  if hits != 1:
                      sys.exit(f'op {i}: expected 1 row for {row_id!r}, found {hits}')
                  files[path] = kept
                  changed.add(path)
                  print(f'deleted {path} {row_id}')
                  continue

              if mode == 'insert':
                  existing = 0
                  for row in rows[1:]:
                      if row and len(row) > i_id and row[i_id] == row_id:
                          existing += 1
                  if existing:
                      sys.exit(f'op {i}: row already exists: {row_id}')
                  sets = op.get('sets')
                  if not isinstance(sets, dict) or not sets:
                      sys.exit(f'op {i}: insert needs sets')
                  new_row = [''] * len(header)
                  new_row[i_id] = row_id
                  for col, val in sets.items():
                      if col not in header:
                          sys.exit(f'op {i}: column not in header: {col}')
                      new_row[header.index(col)] = decode(val)
                  after = str(op.get('after_row_id') or '').strip()
                  if after:
                      placed = False
                      kept = [header]
                      for row in rows[1:]:
                          kept.append(row)
                          if row and len(row) > i_id and row[i_id] == after:
                              kept.append(new_row)
                              placed = True
                      if not placed:
                          sys.exit(f'op {i}: after_row_id not found: {after}')
                      files[path] = kept
                  else:
                      rows.append(new_row)
                      files[path] = rows
                  changed.add(path)
                  print(f'inserted {path} {row_id}')
                  continue

              if mode != 'update':
                  sys.exit(f'op {i}: unknown mode {mode}')

              sets = op.get('sets')
              if not isinstance(sets, dict) or not sets:
                  sets = {}
                  if op.get('column'):
                      sets[str(op['column'])] = op.get('value', '')
                  if op.get('column_2'):
                      sets[str(op['column_2'])] = op.get('value_2', '')
              if not sets:
                  sys.exit(f'op {i}: update needs sets or column/value')

              hits = 0
              for row in rows[1:]:
                  if not row:
                      continue
                  while len(row) < len(header):
                      row.append('')
                  if row[i_id] != row_id:
                      continue
                  for col, val in sets.items():
                      if col not in header:
                          sys.exit(f'op {i}: column not in header: {col}')
                      row[header.index(col)] = decode(val)
                  hits += 1
              if hits != 1:
                  sys.exit(f'op {i}: expected 1 row for {row_id!r}, found {hits}')
              changed.add(path)
              print(f'updated {path} {row_id} {list(sets)}')

          for path, rows in files.items():
              if path not in changed:
                  continue
              with path.open('w', newline='', encoding='utf-8') as f:
                  csv.writer(f, lineterminator='\n').writerows(rows)
          print('changed', ' '.join(str(p) for p in sorted(changed)))
          PY

      - name: Refresh manifests
        run: python3 scripts/data_schema.py manifest

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- data
          if git diff --cached --quiet; then
            echo "No change"
            exit 0
          fi
          git commit -m "Patch CSV line items"
          git push
