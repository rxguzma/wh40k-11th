name: Patch CSV

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-csv.yml'
  workflow_dispatch:
    inputs:
      patches:
        description: JSON list of operations. One run, one commit.
        required: true
        type: string

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply patches
        env:
          PATCHES: ${{ inputs.patches || '[{"file":"data/marines/Unit_Profiles.csv","id_column":"Unit_ID","row_id":"REDEMPTOR_DREADNOUGHT","mode":"update","sets":{"Unit Name":"Redemptor Dreadnought","M\"":"8\"","T":"10","SV":"2+","W":"12","LD":"6+","OC":"4","Keywords":"VEHICLE, DREADNOUGHT, IMPERIUM, WALKER"}},{"file":"data/marines/Unit_Profiles.csv","id_column":"Unit_ID","row_id":"BALLISTUS_DREADNOUGHT","mode":"update","sets":{"Unit Name":"Ballistus Dreadnought","M\"":"8\"","T":"10","SV":"2+","W":"12","LD":"6+","OC":"4","Keywords":"VEHICLE, DREADNOUGHT, IMPERIUM, WALKER"}},{"file":"data/marines/Unit_Profiles.csv","id_column":"Unit_ID","row_id":"BRUTALIS_DREADNOUGHT","mode":"update","sets":{"Unit Name":"Brutalis Dreadnought","M\"":"10\"","T":"10","SV":"2+","W":"12","LD":"6+","OC":"4","Keywords":"VEHICLE, DREADNOUGHT, IMPERIUM, WALKER"}},{"file":"data/marines/Unit_Profiles.csv","id_column":"Unit_ID","row_id":"INVICTOR_TACTICAL_WARSUIT","mode":"update","sets":{"Unit Name":"Invictor Tactical Warsuit","M\"":"10\"","T":"9","SV":"3+","W":"12","LD":"6+","OC":"4","Keywords":"VEHICLE, IMPERIUM, PHOBOS, WALKER"}},{"file":"data/marines/Unit_Points.csv","id_column":"Unit_ID","row_id":"*","mode":"delete_where","where":{"Unit_ID":"REDEMPTOR_DREADNOUGHT"}},{"file":"data/marines/Unit_Points.csv","id_column":"Unit_ID","row_id":"REDEMPTOR_DREADNOUGHT","mode":"insert","sets":{"Point_Option_ID":"point_1","Label":"","Cost":"0","Sort_Order":"1"}},{"file":"data/marines/Unit_Points.csv","id_column":"Unit_ID","row_id":"*","mode":"delete_where","where":{"Unit_ID":"BALLISTUS_DREADNOUGHT"}},{"file":"data/marines/Unit_Points.csv","id_column":"Unit_ID","row_id":"BALLISTUS_DREADNOUGHT","mode":"insert","sets":{"Point_Option_ID":"point_1","Label":"","Cost":"0","Sort_Order":"1"}},{"file":"data/marines/Unit_Points.csv","id_column":"Unit_ID","row_id":"*","mode":"delete_where","where":{"Unit_ID":"BRUTALIS_DREADNOUGHT"}},{"file":"data/marines/Unit_Points.csv","id_column":"Unit_ID","row_id":"BRUTALIS_DRE