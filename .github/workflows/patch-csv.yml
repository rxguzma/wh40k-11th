name: Patch CSV

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-csv.yml'
  workflow_dispatch:
    inputs:
      patches:
        description: JSON list of operations. One run, one commit.
        required: true
        type: string

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply patches
        env:
          PATCHES: ${{ inputs.patches }}
        run: |
          python3 <<'PY'
          import csv, json, os, sys
          from pathlib import Path

          raw = r'[{"file":"data/orks/Abilities.csv","id_column":"Ability_ID","row_id":"ERE_WE_GO_AURA","sets":{"Short Description":"AURA: Friendly BEAST SNAGGA within 6\""}},{"file":"data/orks/Abilities.csv","id_column":"Ability_ID","row_id":"AMMO_RUNT","sets":{"Short Description":"Once per battle — RANGE"}},{"file":"data/orks/Abilities.csv","id_column":"Ability_ID","row_id":"BEASTBOSS","sets":{"Short Description":"LEADING — MELEE"}},{"file":"data/orks/Abilities.csv","id_column":"Ability_ID","row_id":"BEASTLY_RAGE","sets":{"Short Description":"CHARGE — MELEE"}},{"file":"data/orks/Abilities.csv","id_column":"Ability_ID","row_id":"BREAKIN_HEADS_BIGBOSS","sets":{"Short Description":"ANYTIME — MELEE"}},{"file":"data/orks/Abilities.csv","id_column":"Ability_ID","row_id":"DA_BIGGER_DEY_IZ","sets":{"Short Description":"MELEE vs MONSTER / VEHICLE"}},{"file":"data/orks/Abilities.csv","id_column":"Ability_ID","row_id":"DA_BIGGEST_AND_DA_BEST","sets":{"Short Description":"WAAAGH! — MELEE"}},{"file":"data/orks/Abilities.csv","id_column":"Ability_ID","row_id":"DAKKABLITZ","sets":{"Short Description":"Blitzkannon vs non-MONSTER / VEHICLE"}},{"file":"data/orks/Abilities.csv","id_column":"Ability_ID","row_id":"DEFF_FROM_ABOVE","sets":{"Short Description":"After Ingress — RANGE"}},{"file":"data/orks/Abilities.csv","id_column":"Ability_ID","row_id":"DOKS_TOOLZ","sets":{"Short Description":"ANYTIME"}},{"file":"data/orks/Abilities.csv","id_column":"Ability_ID","row_id":"DOKS_TOOLZ_PAINBOY","sets":{"Short Description":"ANYTIME"}},{"file":"data/orks/Abilities.csv","id_column":"Ability_ID","row_id":"DRIVE_BY_DAKKA","sets":{"Short Description":"RANGE: Target within 9\""}},{"file":"data/orks/Abilities.csv","id_column":"Ability_ID","row_id":"DRIVE_BY_DAKKA_2","sets":{"Short Description":"RANGE: Target within 9\""}},{"file":"data/orks/Abilities.csv","id_column":"Ability_ID","row_id":"FLASHIEST_GITZ","sets":{"Short Description":"LEADING — RANGE"}},{"file":"data/orks/Abilities.csv","id_column":"Ability_ID","row_id":"FUEL_MIXA_GROT","sets":{"Short Description":"ADVANCE"}},{"file":"data/orks/Abilities.csv","id_column":"Ability_ID","row_id":"GET_DA_GOOD_BITZ","sets":{"Short Description":"ANYTIME"}},{"file":"data/orks/Abilities.csv","id_column":"Ability_ID","row_id":"GHAZGHKULLS_WAAAGH_BANNER_AURA","sets":{"Short Description":"WAAAGH! — Friendly ORKS within 12\" of Makari — MELEE"}},{"file":"data/orks/Abilities.csv","id_column":"Ability_ID","row_id":"HOGBOSS","sets":{"Short Description":"LEADING — MELEE"}},{"file":"data/orks/Abilities.csv","id_column":"Ability_ID","row_id":"HUNT_THEM_DOWN","sets":{"Short Description":"WAAAGH! — Big Choppa"}},{"file":"data/orks/Abilities.csv","id_column":"Ability_ID","row_id":"KRUMPIN_TIME","sets":{"Short Description":"RILED UP — FIGHT"}},{"file":"data/orks/Abilities.csv","id_column":"Ability_ID","row_id":"KUSTOM_FORCE_FIELD","sets":{"Short Description":"RANGE attacks only"}},{"file":"data/orks/Abilities.csv","id_column":"Ability_ID","row_id":"MEKBOY","sets":{"Short Description":"Within 3\" of friendly ORKS VEHICLE"}},{"file":"data/orks/Abilities.csv","id_column":"Ability_ID","row_id":"MIGHT_IS_RIGHT","sets":{"Short Description":"CHARGE this turn — MELEE"}},{"file":"data/orks/Abilities.csv","id_column":"Ability_ID","row_id":"MONSTER_HUNTERS","sets":{"Short Description":"vs MONSTER / VEHICLE"}},{"file":"data/orks/Abilities.csv","id_column":"Ability_ID","row_id":"MONSTER_HUNTERS_BEASTBOSS","sets":{"Short Description":"LEADING BEAST SNAGGA — vs MONSTER / VEHICLE"}},{"file":"data/orks/Abilities.csv","id_column":"Ability_ID","row_id":"MORE_DAKKA_BIG_MEK_WITH_SHOKK_ATTACK_GUN","sets":{"Short Description":"LEADING — RANGE"}},{"file":"data/orks/Abilities.csv","id_column":"Ability_ID","row_id":"PROPHET_OF_DA_GREAT_WAAAGH","sets":{"Short Description":"AURA: Friendly ORKS within 6\" — MELEE"}},{"file":"data/orks/Abilities.csv","id_column":"Ability_ID","row_id":"PULSA_ROKKIT","sets":{"Short Description":"Once per battle: MONSTER / VEHICLE within 24\" — RANGE"}},{"file":"data/orks/Abilities.csv","id_column":"Ability_ID","row_id":"RED_SKULL_KOMMANDOS","sets":{"Short Description":"LEADING"}},{"file":"data/orks/Abilities.csv","id_column":"Ability_ID","row_id":"SOMETHIN_TO_PROVE","sets":{"Short Description":"ANYTIME — MELEE"}},{"file":"data/orks/Abilities.csv","id_column":"Ability_ID","row_id":"SPECIAL_DOSE","sets":{"Short Description":"WAAAGH!"}},{"file":"data/orks/Abilities.csv","id_column":"Ability_ID","row_id":"SPEEDBOSS","sets":{"Short Description":"LEADING — MELEE"}},{"file":"data/orks/Abilities.csv","id_column":"Ability_ID","row_id":"TANK_HUNTERS","sets":{"Short Description":"RANGE vs MONSTER / VEHICLE"}},{"file":"data/orks/Abilities.csv","id_column":"Ability_ID","row_id":"THUNDERING_STAMPEDE","sets":{"Short Description":"AURA: Friendly BEAST SNAGGA within 6\""}},{"file":"data/orks/Abilities.csv","id_column":"Ability_ID","row_id":"TROPHY_HUNTERS","sets":{"Short Description":"ANYTIME"}},{"file":"data/orks/Abilities.csv","id_column":"Ability_ID","row_id":"WAAAGH_BANNER","sets":{"Short Description":"ANYTIME"}},{"file":"data/orks/Abilities.csv","id_column":"Ability_ID","row_id":"WAAAGH_WAZDAKKA","sets":{"Short Description":"IF WARLORD: WARBIKERS"}},{"file":"data/orks/Abilities.csv","id_column":"Ability_ID","row_id":"AERIAL_MANOEUVRE","sets":{"Short Description":"End opponent turn: if unengaged"}},{"file":"data/orks/Abilities.csv","id_column":"Ability_ID","row_id":"AMMO_RUNTS","sets":{"Short Description":"Once per battle — RANGE"}},{"file":"data/orks/Abilities.csv","id_column":"Ability_ID","row_id":"BRUTAL_IMPACT","sets":{"Short Description":"CHARGE this turn"}},{"file":"data/orks/Abilities.csv","id_column":"Ability_ID","row_id":"DAMAGED_1_6","sets":{"Short Description":"While 1–6 wounds remaining"}},{"file":"data/orks/Abilities.csv","id_column":"Ability_ID","row_id":"DEEP_STRIKE","sets":{"Short Description":"ANYTIME"}},{"file":"data/orks/Abilities.csv","id_column":"Ability_ID","row_id":"FEEL_NO_PAIN_5","sets":{"Short Description":"ANYTIME"}},{"file":"data/orks/Abilities.csv","id_column":"Ability_ID","row_id":"FINDER_KEEPERZ","sets":{"Short Description":"RANGE: unit or target on an Objective"}},{"file":"data/orks/Abilities.csv","id_column":"Ability_ID","row_id":"GET_OUT_DA_WAY","sets":{"Short Description":"CHARGE: excludes MONSTER / VEHICLE models"}},{"file":"data/orks/Abilities.csv","id_column":"Ability_ID","row_id":"HIGH_SPEED_CARNAGE","sets":{"Short Description":"CHARGE this turn — MELEE"}},{"file":"data/orks/Abilities.csv","id_column":"Ability_ID","row_id":"INFILTRATORS","sets":{"Short Description":"ANYTIME"}},{"file":"data/orks/Abilities.csv","id_column":"Ability_ID","row_id":"INVULNERABLE_SAVE_4","sets":{"Short Description":"ANYTIME"}},{"file":"data/orks/Abilities.csv","id_column":"Ability_ID","row_id":"INVULNERABLE_SAVE_5","sets":{"Short Description":"ANYTIME"}},{"file":"data/orks/Abilities.csv","id_column":"Ability_ID","row_id":"INVULNERABLE_SAVE_6","sets":{"Short Description":"ANYTIME"}},{"file":"data/orks/Abilities.csv","id_column":"Ability_ID","row_id":"MOBILE_FORTRESS","sets":{"Short Description":"ANYTIME — incoming RANGE"}},{"file":"data/orks/Abilities.csv","id_column":"Ability_ID","row_id":"NOWHERE_TO_HIDE","sets":{"Short Description":"vs HIDDEN units"}},{"file":"data/orks/Abilities.csv","id_column":"Ability_ID","row_id":"PAIRED_KRUMPAS","sets":{"Short Description":"Kustom Krumpa — MELEE"}},{"file":"data/orks/Abilities.csv","id_column":"Ability_ID","row_id":"ROKKIT_CHARGE","sets":{"Short Description":"CHARGE this turn — MELEE"}},{"file":"data/orks/Abilities.csv","id_column":"Ability_ID","row_id":"SPEEDNOB_SUPPORT","sets":{"Short Description":"Within 3\" of friendly SPEED FREEKS (excluding WARTRAKK)"}},{"file":"data/orks/Abilities.csv","id_column":"Ability_ID","row_id":"STEALTH","sets":{"Short Description":"ANYTIME"}},{"file":"data/orks/Abilities.csv","id_column":"Ability_ID","row_id":"WAAAGH_EFFIGY","sets":{"Short Description":"ANYTIME"}},{"file":"data/orks/Abilities.csv","id_column":"Ability_ID","row_id":"TIDE_OF_MUSCLE","sets":{"Short Description":"CHARGE this turn — MELEE"}},{"file":"data/orks/Abilities.csv","id_column":"Ability_ID","row_id":"ARROGANT_INVULNERABILITY","sets":{"Short Description":"ANYTIME — incoming attacks"}},{"file":"data/orks/Abilities.csv","id_column":"Ability_ID","row_id":"BIG_AN_SHOOTY","sets":{"Short Description":"ANYTIME — RANGE"}},{"file":"data/orks/Abilities.csv","id_column":"Ability_ID","row_id":"BIG_AN_STOMPY","sets":{"Short Description":"ANYTIME — MELEE"}},{"file":"data/orks/Abilities.csv","id_column":"Ability_ID","row_id":"DAMAGED_7","sets":{"Short Description":"While 1–7 wounds remaining"}},{"file":"data/orks/Abilities.csv","id_column":"Ability_ID","row_id":"DREAD_ARD","sets":{"Short Description":"ANYTIME — incoming attacks"}},{"file":"data/orks/Abilities.csv","id_column":"Ability_ID","row_id":"MOBILE_ARSENAL","sets":{"Short Description":"ANYTIME — RANGE"}},{"file":"data/orks/Abilities.csv","id_column":"Ability_ID","row_id":"SPITEFUL_POWER_TRIP","sets":{"Short Description":"vs units with no T7+ models"}},{"file":"data/orks/Abilities.csv","id_column":"Ability_ID","row_id":"BOSS_AMMO_RUNT","sets":{"Short Description":"Once per battle — RANGE"}},{"file":"data/orks/Abilities.csv","id_column":"Ability_ID","row_id":"DODGE_DIS","sets":{"Short Description":"ANYTIME"}},{"file":"data/orks/Abilities.csv","id_column":"Ability_ID","row_id":"BEAST_SNAGGA_FOLLOWING","sets":{"Short Description":"Within 3\" of friendly BEAST SNAGGA (excluding MONSTER CHARACTER)"}},{"file":"data/orks/Abilities.csv","id_column":"Ability_ID","row_id":"BOSS_OF_DA_HUNT","sets":{"Short Description":"Within 3\" of friendly BEAST SNAGGA (excluding MONSTER CHARACTER)"}},{"file":"data/orks/Abilities.csv","id_column":"Ability_ID","row_id":"SUPPORT_SHOKKA","sets":{"Short Description":"Within 3\" of friendly ORKS INFANTRY (excluding other SAG)"}},{"file":"data/orks/Abilities.csv","id_column":"Ability_ID","row_id":"EVEN_MORE_DAKKA","sets":{"Short Description":"RILED UP — RANGE"}},{"file":"data/orks/Abilities.csv","id_column":"Ability_ID","row_id":"BLITZ_DEM_GITS","sets":{"Short Description":"Blitzkannon vs non-MONSTER / VEHICLE"}},{"file":"data/orks/Abilities.csv","id_column":"Ability_ID","row_id":"KUSTOM_DAKKA","sets":{"Short Description":"ANYTIME — RANGE"}},{"file":"data/orks/Abilities.csv","id_column":"Ability_ID","row_id":"FUEL_MIXA_GROB","sets":{"Short Description":"ADVANCE"}},{"file":"data/orks/Abilities.csv","id_column":"Ability_ID","row_id":"STRAFING_RUN","sets":{"Short Description":"RANGE vs non-FLY"}},{"file":"data/orks/Abilities.csv","id_column":"Ability_ID","row_id":"GO_FER_DA_WEAK_SPOT","sets":{"Short Description":"RANGE vs MONSTER / VEHICLE"}},{"file":"data/orks/Abilities.csv","id_column":"Ability_ID","row_id":"WAZBOM_FORCE_FIELD","sets":{"Short Description":"ANYTIME: does not have SMOKE"}},{"file":"data/orks/Abilities.csv","id_column":"Ability_ID","row_id":"RAMSHACKLE_COVER","sets":{"Short Description":"If target is not fully visible because of this unit"}}]'
          try:
              ops = json.loads(raw)
          except json.JSONDecodeError as e:
              sys.exit(f'patches is not JSON: {e}')
          if not isinstance(ops, list) or not ops:
              sys.exit('patches must be a non-empty JSON list')

          def decode(val):
              if val is None:
                  return ''
              s = str(val)
              return s.replace('\\n', '\n')

          def load_csv(path):
              if path.is_absolute() or '..' in path.parts:
                  sys.exit(f'bad path {path}')
              if not str(path).startswith('data/') or path.suffix.lower() != '.csv':
                  sys.exit(f'file must be a .csv under data/: {path}')
              if not path.is_file():
                  sys.exit(f'missing {path}')
              with path.open(encoding='utf-8', newline='') as f:
                  rows = list(csv.reader(f))
              if not rows:
                  sys.exit(f'empty csv {path}')
              return rows

          files = {}
          changed = set()

          for i, op in enumerate(ops):
              if not isinstance(op, dict):
                  sys.exit(f'op {i} is not an object')
              path = Path(str(op.get('file', '')).strip())
              if path not in files:
                  files[path] = load_csv(path)
              rows = files[path]
              header = rows[0]
              id_col = str(op.get('id_column') or '').strip() or header[0]
              if id_col not in header:
                  sys.exit(f'op {i}: id column not in header: {id_col}')
              i_id = header.index(id_col)
              row_id = str(op.get('row_id') or '').strip()
              if not row_id:
                  sys.exit(f'op {i}: row_id required')
              mode = str(op.get('mode') or 'update').strip()

              if mode == 'add_column':
                  col = str(op.get('column') or '').strip()
                  if not col:
                      sys.exit(f'op {i}: add_column needs column')
                  if col in header:
                      print(f'column already exists {path} {col}')
                      continue
                  after_col = str(op.get('after_column') or '').strip()
                  if after_col and after_col not in header:
                      sys.exit(f'op {i}: after column not in header: {after_col}')
                  insert_at = header.index(after_col) + 1 if after_col else len(header)
                  old_width = len(header)
                  header.insert(insert_at, col)
                  for row in rows[1:]:
                      while len(row) < old_width:
                          row.append('')
                      row.insert(insert_at, '')
                  changed.add(path)
                  print(f'added column {path} {col}')
                  continue

              if mode == 'dedupe_by_key':
                  key_col = str(op.get('key_column') or '').strip()
                  if key_col not in header:
                      sys.exit(f'op {i}: key column not in header: {key_col}')
                  i_key = header.index(key_col)
                  kept = [header]
                  seen = set()
                  matched = 0
                  removed = 0
                  for row in rows[1:]:
                      if not row:
                          continue
                      while len(row) < len(header):
                          row.append('')
                      if row[i_id] != row_id:
                          kept.append(row)
                          continue
                      matched += 1
                      key = row[i_key].strip()
                      if not key:
                          sys.exit(f'op {i}: blank {key_col} while deduping {row_id!r}')
                      if key in seen:
                          removed += 1
                          continue
                      seen.add(key)
                      kept.append(row)
                  if matched < 1:
                      sys.exit(f'op {i}: found no rows for {row_id!r}')
                  if removed < 1:
                      sys.exit(f'op {i}: found no duplicate rows for {row_id!r}')
                  files[path] = kept
                  changed.add(path)
                  print(f'deduped {path} {row_id}: kept {len(seen)} unique {key_col} values, removed {removed} duplicates')
                  continue

              if mode == 'fill_blank_where':
                  match_col = str(op.get('match_column') or '').strip()
                  col = str(op.get('column') or '').strip()
                  if match_col not in header:
                      sys.exit(f'op {i}: match column not in header: {match_col}')
                  if col not in header:
                      sys.exit(f'op {i}: column not in header: {col}')
                  match_value = decode(op.get('match_value')).strip()
                  new = decode(op.get('value'))
                  if not match_value:
                      sys.exit(f'op {i}: match_value required')
                  if new == '':
                      sys.exit(f'op {i}: value required')
                  i_match = header.index(match_col)
                  i_col = header.index(col)
                  hits = 0
                  for row in rows[1:]:
                      if not row:
                          continue
                      while len(row) < len(header):
                          row.append('')
                      if row[i_match].strip() == match_value and not row[i_col].strip():
                          row[i_col] = new
                          hits += 1
                  if hits < 1:
                      sys.exit(f'op {i}: found no blank {col} values where {match_col}={match_value!r}')
                  changed.add(path)
                  print(f'filled {hits} blank {col} values in {path} where {match_col}={match_value!r}')
                  continue

              if mode == 'replace_text':
                  col = str(op.get('column') or '').strip()
                  if col not in header:
                      sys.exit(f'op {i}: column not in header: {col}')
                  old = decode(op.get('from'))
                  new = decode(op.get('to'))
                  if not old:
                      sys.exit(f'op {i}: replace_text needs non-empty from')
                  i_col = header.index(col)
                  hits = 0
                  for row in rows[1:]:
                      if not row:
                          continue
                      while len(row) < len(header):
                          row.append('')
                      if old in row[i_col]:
                          row[i_col] = row[i_col].replace(old, new)
                          hits += 1
                  if hits < 1:
                      sys.exit(f'op {i}: replace_text found no matches for {old!r}')
                  changed.add(path)
                  print(f'replaced {old!r} in {hits} rows of {path} column {col}')
                  continue

              if mode == 'delete':
                  kept = [header]
                  hits = 0
                  for row in rows[1:]:
                      if not row:
                          continue
                      if len(row) > i_id and row[i_id] == row_id:
                          hits += 1
                          continue
                      kept.append(row)
                  if hits != 1:
                      sys.exit(f'op {i}: expected 1 row for {row_id!r}, found {hits}')
                  files[path] = kept
                  changed.add(path)
                  print(f'deleted {path} {row_id}')
                  continue

              if mode == 'insert':
                  existing = 0
                  for row in rows[1:]:
                      if row and len(row) > i_id and row[i_id] == row_id:
                          existing += 1
                  if existing:
                      sys.exit(f'op {i}: row already exists: {row_id}')
                  sets = op.get('sets')
                  if not isinstance(sets, dict) or not sets:
                      sys.exit(f'op {i}: insert needs sets')
                  new_row = [''] * len(header)
                  new_row[i_id] = row_id
                  for col, val in sets.items():
                      if col not in header:
                          sys.exit(f'op {i}: column not in header: {col}')
                      new_row[header.index(col)] = decode(val)
                  after = str(op.get('after_row_id') or '').strip()
                  if after:
                      placed = False
                      kept = [header]
                      for row in rows[1:]:
                          kept.append(row)
                          if row and len(row) > i_id and row[i_id] == after:
                              kept.append(new_row)
                              placed = True
                      if not placed:
                          sys.exit(f'op {i}: after_row_id not found: {after}')
                      files[path] = kept
                  else:
                      rows.append(new_row)
                      files[path] = rows
                  changed.add(path)
                  print(f'inserted {path} {row_id}')
                  continue

              if mode != 'update':
                  sys.exit(f'op {i}: unknown mode {mode}')

              sets = op.get('sets')
              if not isinstance(sets, dict) or not sets:
                  sets = {}
                  if op.get('column'):
                      sets[str(op['column'])] = op.get('value', '')
                  if op.get('column_2'):
                      sets[str(op['column_2'])] = op.get('value_2', '')
              if not sets:
                  sys.exit(f'op {i}: update needs sets or column/value')

              hits = 0
              for row in rows[1:]:
                  if not row:
                      continue
                  while len(row) < len(header):
                      row.append('')
                  if row[i_id] != row_id:
                      continue
                  for col, val in sets.items():
                      if col not in header:
                          sys.exit(f'op {i}: column not in header: {col}')
                      row[header.index(col)] = decode(val)
                  hits += 1
              if hits != 1:
                  sys.exit(f'op {i}: expected 1 row for {row_id!r}, found {hits}')
              changed.add(path)
              print(f'updated {path} {row_id} {list(sets)}')

          for path, rows in files.items():
              if path not in changed:
                  continue
              with path.open('w', newline='', encoding='utf-8') as f:
                  csv.writer(f, lineterminator='\n').writerows(rows)
          print('changed', ' '.join(str(p) for p in sorted(changed)))
          PY

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- data
          if git diff --cached --quiet; then
            echo "No change"
            exit 0
          fi
          git commit -m "Patch CSV line items"
          git push
