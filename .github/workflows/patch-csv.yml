name: Patch CSV

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-csv.yml'
  workflow_dispatch:
    inputs:
      patches:
        description: JSON list of operations. One run, one commit.
        required: true
        type: string

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply patches
        env:
          PATCHES: ${{ inputs.patches || '[{"file":"data/marines/Unit_Profiles.csv","id_column":"Unit_ID","row_id":"CAPTAIN_TITUS","mode":"insert","sets":{"Unit Name":"Captain Titus","M\"":"6\"","T":"5","SV":"3+/4++","W":"6","LD":"6+","OC":"1","Keywords":"INFANTRY, CAPTAIN, CHARACTER, EPIC HERO, EXPLOSIVES, IMPERIUM, TACTICUS, ADEPTUS ASTARTES, ULTRAMARINES","Hyperlink":""}},{"file":"data/marines/Weapon_Stats.csv","id_column":"Weapon_ID","row_id":"CAPTAIN_TITUS_BOLT_PISTOL","mode":"insert","sets":{"Weapon Name":"Bolt Pistol","R\"":"12\"","A":"1","WS":"2+","St":"5","AP":"-1","D":"1"}},{"file":"data/marines/Weapon_Stats.csv","id_column":"Weapon_ID","row_id":"CAPTAIN_TITUS_MASTER_CRAFTED_BOLTER","mode":"insert","sets":{"Weapon Name":"Master-crafted Bolter","R\"":"24\"","A":"2","WS":"2+","St":"5","AP":"-1","D":"2"}},{"file":"data/marines/Weapon_Stats.csv","id_column":"Weapon_ID","row_id":"CAPTAIN_TITUS_MASTER_CRAFTED_CHAINSWORD","mode":"insert","sets":{"Weapon Name":"Master-crafted Chainsword","R\"":"Melee","A":"8","WS":"2+","St":"5","AP":"-1","D":"2"}},{"file":"data/marines/Weapon_Abilities.csv","id_column":"Weapon_Ability_ID","row_id":"CAPTAIN_TITUS_BOLT_PISTOL\u003aability_1","mode":"insert","sets":{"Weapon_ID":"CAPTAIN_TITUS_BOLT_PISTOL","Ability_Type":"CLOSE-QUARTERS","Target":"","Value":"","Condition":"","Separator_Before":"","Sort_Order":"1"}},{"file":"data/marines/Weapon_Abilities.csv","id_column":"Weapon_Ability_ID","row_id":"CAPTAIN_TITUS_MASTER_CRAFTED_BOLTER\u003aability_1","mode":"insert","sets":{"Weapon_ID":"CAPTAIN_TITUS_MASTER_CRAFTED_BOLTER","Ability_Type":"ASSAULT","Target":"","Value":"","Condition":"","Separator_Before":"","Sort_Order":"1"}},{"file":"data/marines/Weapon_Abilities.csv","id_column":"Weapon_Ability_ID","row_id":"CAPTAIN_TITUS_MASTER_CRAFTED_BOLTER\u003aability_2","mode":"insert","sets":{"Weapon_ID":"CAPTAIN_TITUS_MASTER_CRAFTED_BOLTER","Ability_Type":"HEAVY","Target":"","Value":"","Condition":"","Separator_Before":", ","Sort_Order":"2"}},{"file":"data/marines/Weapon_Abilities.csv","id_column":"Weapon_Ability_ID","row_id":"CAPTAIN_TITUS_MASTER_CRAFTED_BOLTER\u003aability_3","mode":"insert","sets":{"Weapon_ID":"CAPTAIN_TITUS_MASTER_CRAFTED_BOLTER","Ability_Type":"RAPID FIRE","Target":"","Value":"1","Condition":"","Separator_Before":", ","Sort_Order":"3"}},{"file":"data/marines/Weapon_Abilities.csv","id_column":"Weapon_Ability_ID","row_id":"CAPTAIN_TITUS_MASTER_CRAFTED_CHAINSWORD\u003aability_1","mode":"insert","sets":{"Weapon_ID":"CAPTAIN_TITUS_MASTER_CRAFTED_CHAINSWORD","Ability_Type":"ANTI-non-MONSTER/VEHICLE","Target":"","Value":"2+","Condition":"","Separator_Before":"","Sort_Order":"1"}},{"file":"data/marines/Unit_Weapons.csv","id_column":"Layout_Row_ID","row_id":"CAPTAIN_TITUS_WEAPON_1","mode":"insert","sets":{"Unit_ID":"CAPTAIN_TITUS","Weapon_ID":"CAPTAIN_TITUS_BOLT_PISTOL","Row_Type":"WEAPON","Row_Label":"","Sort_Order":"1","Quantity":"1"}},{"file":"data/marines/Unit_Weapons.csv","id_column":"Layout_Row_ID","row_id":"CAPTAIN_TITUS_WEAPON_2","mode":"insert","sets":{"Unit_ID":"CAPTAIN_TITUS","Weapon_ID":"CAPTAIN_TITUS_MASTER_CRAFTED_BOLTER","Row_Type":"WEAPON","Row_Label":"","Sort_Order":"2","Quantity":"1"}},{"file":"data/marines/Unit_Weapons.csv","id_column":"Layout_Row_ID","row_id":"CAPTAIN_TITUS_WEAPON_3","mode":"insert","sets":{"Unit_ID":"CAPTAIN_TITUS","Weapon_ID":"CAPTAIN_TITUS_MASTER_CRAFTED_CHAINSWORD","Row_Type":"WEAPON","Row_Label":"","Sort_Order":"3","Quantity":"1"}},{"file":"data/marines/Abilities.csv","id_column":"Ability_ID","row_id":"CAPTAIN_TITUS_PRESS_THE_ATTACK","mode":"insert","sets":{"Ability Name":"Press the Attack","Short_Description":"MELEE\u003a SUSTAINED HITS 1\u003a non-MONSTER/VEHICLE\nASSAULT DOCTRINE\u003a SUSTAINED HITS 1","Long_Description":"This unit\u2019s melee attacks have\u003a\n\u2022 [SUSTAINED HITS 1\u003a non-MONSTER/VEHICLE].\n\u2022 Or\u003a If the assault doctrine is active for this unit, [SUSTAINED HITS 1].","Tags":"","Tag Categories":"","Order":"0","Visibility_ID":"1","Default_Active":"1"}},{"file":"data/marines/Abilities.csv","id_column":"Ability_ID","row_id":"CAPTAIN_TITUS_RIGHTEOUS_FURY","mode":"insert","sets":{"Ability Name":"Righteous Fury (Once per battle, per army)","Short_Description":"FIGHT\u003a melee +1 S\nAfter fighting\u003a heal D3 / 2D3 if enemy model destroyed this phase","Long_Description":"In the Fight phase, you can use this ability. If you do, this unit\u2019s melee attacks have +1 S, and when this unit has fought\u003a\n\u2022 This unit heals D3 wounds.\n\u2022 Or\u003a If this unit destroyed an enemy model this phase, this unit heals 2D3 wounds.","Tags":"","Tag Categories":"","Order":"0","Visibility_ID":"1","Default_Active":"1"}},{"file":"data/marines/Abilities.csv","id_column":"Ability_ID","row_id":"CAPTAIN_TITUS_HONOUR_OF_ULTRAMAR","mode":"insert","sets":{"Ability Name":"Honour of Ultramar","Short_Description":"FIGHT\u003a destroyed before selected to fight \u2192 2+ fight before removal","Long_Description":"In the Fight phase, when this model is destroyed, if this unit has not been selected to fight this phase, roll one D6\u003a\n\u2022 On a 2+, do not remove this model from the battlefield. When your unit has fought, or at the end of the phase (whichever comes first), this model is removed from the battlefield.","Tags":"","Tag Categories":"","Order":"0","Visibility_ID":"1","Default_Active":"1"}},{"file":"data/marines/Abilities.csv","id_column":"Ability_ID","row_id":"CAPTAIN_TITUS_UNIT_COMPOSITION","mode":"insert","sets":{"Ability Name":"Unit Composition","Short_Description":"1 Captain Titus model\nEquipped\u003a 1 Bolt Pistol; 1 Master-crafted Bolter; 1 Master-crafted Chainsword","Long_Description":"1 Captain Titus model.\n\nThis model is equipped with\u003a 1 Bolt Pistol; 1 Master-crafted Bolter; 1 Master-crafted Chainsword.","Tags":"","Tag Categories":"","Order":"9","Visibility_ID":"3","Default_Active":"0"}},{"file":"data/marines/Unit_Abilities.csv","id_column":"Ability_ID","row_id":"CAPTAIN_TITUS_PRESS_THE_ATTACK","mode":"insert","sets":{"Unit_ID":"CAPTAIN_TITUS","Ability_Type":"ABILITY"}},{"file":"data/marines/Unit_Abilities.csv","id_column":"Ability_ID","row_id":"CAPTAIN_TITUS_RIGHTEOUS_FURY","mode":"insert","sets":{"Unit_ID":"CAPTAIN_TITUS","Ability_Type":"ABILITY"}},{"file":"data/marines/Unit_Abilities.csv","id_column":"Ability_ID","row_id":"CAPTAIN_TITUS_HONOUR_OF_ULTRAMAR","mode":"insert","sets":{"Unit_ID":"CAPTAIN_TITUS","Ability_Type":"ABILITY"}},{"file":"data/marines/Unit_Abilities.csv","id_column":"Ability_ID","row_id":"CAPTAIN_TITUS_UNIT_COMPOSITION","mode":"insert","sets":{"Unit_ID":"CAPTAIN_TITUS","Ability_Type":"ABILITY"}},{"file":"data/marines/Unit_Abilities.csv","id_column":"Ability_ID","row_id":"__CAPTAIN_TITUS_CORE_FNP5_REL","mode":"insert","sets":{"Unit_ID":"CAPTAIN_TITUS","Ability_ID":"Feel No Pain 5+","Ability_Type":"CORE_ABILITY"}},{"file":"data/marines/Unit_Abilities.csv","id_column":"Ability_ID","row_id":"__CAPTAIN_TITUS_CORE_LEADER_REL","mode":"insert","sets":{"Unit_ID":"CAPTAIN_TITUS","Ability_ID":"Leader","Ability_Type":"CORE_ABILITY"}}]' }}
        run: |
          python3 <<'PY'
          import csv, json, os, sys
          from pathlib import Path

          raw = os.environ.get('PATCHES') or ''
          if not raw.strip():
              print('no PATCHES input; skip apply')
              raise SystemExit(0)
          try:
              ops = json.loads(raw)
          except json.JSONDecodeError as e:
              sys.exit(f'patches is not JSON: {e}')
          if not isinstance(ops, list) or not ops:
              sys.exit('patches must be a non-empty JSON list')

          def decode(val):
              if val is None:
                  return ''
              s = str(val)
              return s.replace('\\n', '\n')

          def load_csv(path):
              if path.is_absolute() or '..' in path.parts:
                  sys.exit(f'bad path {path}')
              if not str(path).startswith('data/') or path.suffix.lower() != '.csv':
                  sys.exit(f'file must be a .csv under data/: {path}')
              if not path.is_file():
                  sys.exit(f'missing {path}')
              with path.open(encoding='utf-8', newline='') as f:
                  rows = list(csv.reader(f))
              if not rows:
                  sys.exit(f'empty csv {path}')
              return rows

          files = {}
          changed = set()

          for i, op in enumerate(ops):
              if not isinstance(op, dict):
                  sys.exit(f'op {i} is not an object')
              path = Path(str(op.get('file', '')).strip())
              if path not in files:
                  files[path] = load_csv(path)
              rows = files[path]
              header = rows[0]
              id_col = str(op.get('id_column') or '').strip() or header[0]
              if id_col not in header:
                  sys.exit(f'op {i}: id column not in header: {id_col}')
              i_id = header.index(id_col)
              row_id = str(op.get('row_id') or '').strip()
              if not row_id:
                  sys.exit(f'op {i}: row_id required')
              mode = str(op.get('mode') or 'update').strip()

              if mode == 'add_column':
                  col = str(op.get('column') or '').strip()
                  if not col:
                      sys.exit(f'op {i}: add_column needs column')
                  if col in header:
                      print(f'column already exists {path} {col}')
                      continue
                  after_col = str(op.get('after_column') or '').strip()
                  if after_col and after_col not in header:
                      sys.exit(f'op {i}: after column not in header: {after_col}')
                  insert_at = header.index(after_col) + 1 if after_col else len(header)
                  old_width = len(header)
                  header.insert(insert_at, col)
                  for row in rows[1:]:
                      while len(row) < old_width:
                          row.append('')
                      row.insert(insert_at, '')
                  changed.add(path)
                  print(f'added column {path} {col}')
                  continue

              if mode == 'remove_column':
                  col = str(op.get('column') or '').strip()
                  if not col:
                      sys.exit(f'op {i}: remove_column needs column')
                  if col not in header:
                      sys.exit(f'op {i}: column not in header: {col}')
                  remove_at = header.index(col)
                  header.pop(remove_at)
                  for row in rows[1:]:
                      if len(row) > remove_at:
                          row.pop(remove_at)
                  changed.add(path)
                  print(f'removed column {path} {col}')
                  continue

              if mode == 'dedupe_by_key':
                  key_col = str(op.get('key_column') or '').strip()
                  if key_col not in header:
                      sys.exit(f'op {i}: key column not in header: {key_col}')
                  i_key = header.index(key_col)
                  kept = [header]
                  seen = set()
                  matched = 0
                  removed = 0
                  for row in rows[1:]:
                      if not row:
                          continue
                      while len(row) < len(header):
                          row.append('')
                      if row[i_id] != row_id:
                          kept.append(row)
                          continue
                      matched += 1
                      key = row[i_key].strip()
                      if not key:
                          sys.exit(f'op {i}: blank {key_col} while deduping {row_id!r}')
                      if key in seen:
                          removed += 1
                          continue
                      seen.add(key)
                      kept.append(row)
                  if matched < 1:
                      sys.exit(f'op {i}: found no rows for {row_id!r}')
                  if removed < 1:
                      sys.exit(f'op {i}: found no duplicate rows for {row_id!r}')
                  files[path] = kept
                  changed.add(path)
                  print(f'deduped {path} {row_id}: kept {len(seen)} unique {key_col} values, removed {removed} duplicates')
                  continue

              if mode == 'fill_blank_where':
                  match_col = str(op.get('match_column') or '').strip()
                  col = str(op.get('column') or '').strip()
                  if match_col not in header:
                      sys.exit(f'op {i}: match column not in header: {match_col}')
                  if col not in header:
                      sys.exit(f'op {i}: column not in header: {col}')
                  match_value = decode(op.get('match_value')).strip()
                  new = decode(op.get('value'))
                  if not match_value:
                      sys.exit(f'op {i}: match_value required')
                  if new == '':
                      sys.exit(f'op {i}: value required')
                  i_match = header.index(match_col)
                  i_col = header.index(col)
                  hits = 0
                  for row in rows[1:]:
                      if not row:
                          continue
                      while len(row) < len(header):
                          row.append('')
                      if row[i_match].strip() == match_value and not row[i_col].strip():
                          row[i_col] = new
                          hits += 1
                  if hits < 1:
                      sys.exit(f'op {i}: found no blank {col} values where {match_col}={match_value!r}')
                  changed.add(path)
                  print(f'filled {hits} blank {col} values in {path} where {match_col}={match_value!r}')
                  continue

              if mode == 'replace_text':
                  col = str(op.get('column') or '').strip()
                  if col not in header:
                      sys.exit(f'op {i}: column not in header: {col}')
                  old = decode(op.get('from'))
                  new = decode(op.get('to'))
                  if not old:
                      sys.exit(f'op {i}: replace_text needs non-empty from')
                  i_col = header.index(col)
                  hits = 0
                  for row in rows[1:]:
                      if not row:
                          continue
                      while len(row) < len(header):
                          row.append('')
                      if old in row[i_col]:
                          row[i_col] = row[i_col].replace(old, new)
                          hits += 1
                  if hits < 1:
                      sys.exit(f'op {i}: replace_text found no matches for {old!r}')
                  changed.add(path)
                  print(f'replaced {old!r} in {hits} rows of {path} column {col}')
                  continue

              if mode == 'delete':
                  kept = [header]
                  hits = 0
                  for row in rows[1:]:
                      if not row:
                          continue
                      if len(row) > i_id and row[i_id] == row_id:
                          hits += 1
                          continue
                      kept.append(row)
                  if hits != 1:
                      sys.exit(f'op {i}: expected 1 row for {row_id!r}, found {hits}')
                  files[path] = kept
                  changed.add(path)
                  print(f'deleted {path} {row_id}')
                  continue

              if mode == 'insert':
                  existing = 0
                  for row in rows[1:]:
                      if row and len(row) > i_id and row[i_id] == row_id:
                          existing += 1
                  if existing:
                      sys.exit(f'op {i}: row already exists: {row_id}')
                  sets = op.get('sets')
                  if not isinstance(sets, dict) or not sets:
                      sys.exit(f'op {i}: insert needs sets')
                  new_row = [''] * len(header)
                  new_row[i_id] = row_id
                  for col, val in sets.items():
                      if col not in header:
                          sys.exit(f'op {i}: column not in header: {col}')
                      new_row[header.index(col)] = decode(val)
                  after = str(op.get('after_row_id') or '').strip()
                  if after:
                      placed = False
                      kept = [header]
                      for row in rows[1:]:
                          kept.append(row)
                          if row and len(row) > i_id and row[i_id] == after:
                              kept.append(new_row)
                              placed = True
                      if not placed:
                          sys.exit(f'op {i}: after_row_id not found: {after}')
                      files[path] = kept
                  else:
                      rows.append(new_row)
                      files[path] = rows
                  changed.add(path)
                  print(f'inserted {path} {row_id}')
                  continue

              if mode != 'update':
                  sys.exit(f'op {i}: unknown mode {mode}')

              sets = op.get('sets')
              if not isinstance(sets, dict) or not sets:
                  sets = {}
                  if op.get('column'):
                      sets[str(op['column'])] = op.get('value', '')
                  if op.get('column_2'):
                      sets[str(op['column_2'])] = op.get('value_2', '')
              if not sets:
                  sys.exit(f'op {i}: update needs sets or column/value')

              hits = 0
              for row in rows[1:]:
                  if not row:
                      continue
                  while len(row) < len(header):
                      row.append('')
                  if row[i_id] != row_id:
                      continue
                  for col, val in sets.items():
                      if col not in header:
                          sys.exit(f'op {i}: column not in header: {col}')
                      row[header.index(col)] = decode(val)
                  hits += 1
              if hits != 1:
                  sys.exit(f'op {i}: expected 1 row for {row_id!r}, found {hits}')
              changed.add(path)
              print(f'updated {path} {row_id} {list(sets)}')

          for path, rows in files.items():
              if path not in changed:
                  continue
              with path.open('w', newline='', encoding='utf-8') as f:
                  csv.writer(f, lineterminator='\n').writerows(rows)
          print('changed', ' '.join(str(p) for p in sorted(changed)))
          PY

      - name: Refresh manifests
        run: python3 scripts/data_schema.py manifest

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- data
          if git diff --cached --quiet; then
            echo "No change"
            exit 0
          fi
          git commit -m "Patch CSV line items"
          git push