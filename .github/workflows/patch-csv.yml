name: Patch CSV

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-csv.yml'
  workflow_dispatch:
    inputs:
      patches:
        description: JSON list of operations. One run, one commit.
        required: true
        type: string

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply patches
        env:
          PATCHES: ${{ inputs.patches || '[{"file":"data/orks/Abilities.csv","id_column":"Ability_ID","row_id":"CLEAVE 1","column":"Short_Description","value":"Add +1 melee attack per 5 target models [CLEAVE 1]"},{"file":"data/orks/Abilities.csv","id_column":"Ability_ID","row_id":"CLEAVE 2","column":"Short_Description","value":"Add +2 attack dice per 5 target models if targeting one unit [CLEAVE 2]"},{"file":"data/orks/Abilities.csv","id_column":"Ability_ID","row_id":"KOMBI","column":"Short_Description","value":"Choose one profile [KOMBI]"},{"file":"data/orks/Abilities.csv","id_column":"Ability_ID","row_id":"CLOSE-QUARTERS","column":"Short_Description","value":"Can shoot while engaged; must target engaged enemy [CLOSE-QUARTERS]"},{"file":"data/orks/Abilities.csv","id_column":"Ability_ID","row_id":"DA_BIGGER_DEY_IZ","column":"Short_Description","value":"MELEE vs MONSTER / VEHICLE [RE-ROLL ALL WOUNDS]"},{"file":"data/orks/Abilities.csv","id_column":"Ability_ID","row_id":"DATS_OUR_LOOT","column":"Short_Description","value":"Re-roll 1s Re-roll ALL if on Objective [RE-ROLL 1S TO HIT] [RE-ROLL ALL HITS]"},{"file":"data/orks/Abilities.csv","id_column":"Ability_ID","row_id":"DEFF_FROM_ABOVE","column":"Short_Description","value":"After Ingress — RANGE [+1 TO HIT]"},{"file":"data/orks/Abilities.csv","id_column":"Ability_ID","row_id":"DEVASTATING WOUNDS","column":"Short_Description","value":"Critical Wounds inflict mortal wounds; no saves [DEVASTATING WOUNDS] [DEVASTATING WOUNDS]"},{"file":"data/orks/Abilities.csv","id_column":"Ability_ID","row_id":"DOKS_TOOLZ","column":"Short_Description","value":"ANYTIME [FNP 5+]"},{"file":"data/orks/Abilities.csv","id_column":"Ability_ID","row_id":"KRUMPIN_TIME","column":"Short_Description","value":"MELEE RILED UP\u003A +1 To Hit [+1 TO HIT]"},{"file":"data/orks/Abilities.csv","id_column":"Ability_ID","row_id":"KUNNIN_INFILTRATOR","column":"Short_Description","value":"Hidden and unengaged at end of opponent Fight phase = go reserves [STRATEGIC RESERVES]"},{"file":"data/orks/Abilities.csv","id_column":"Ability_ID","row_id":"KUSTOM_FORCE_FIELD","column":"Short_Description","value":"RANGE attacks only [INVULNERABLE SAVE 4+]"},{"file":"data/orks/Abilities.csv","id_column":"Ability_ID","row_id":"MIGHT_IS_RIGHT","column":"Short_Description","value":"CHARGE this turn.\\nMELEE\u003A +3 A and +2 S [+3 A] [+2 S]"},{"file":"data/orks/Abilities.csv","id_column":"Ability_ID","row_id":"MORE_DAKKA","column":"Short_Description","value":"Ranged attacks IGNORES COVER\\nIf RILED UP\u003A SUSTAINED HITS 1. [IGNORES COVER] [SUSTAINED HITS 1]"},{"file":"data/orks/Abilities.csv","id_column":"Ability_ID","row_id":"ONE_LAST_KILL","column":"Short_Description","value":"Fight on death on 2+. [FIGHT ON DEATH 2+]"},{"file":"data/orks/Abilities.csv","id_column":"Ability_ID","row_id":"PROPHET_OF_DA_GREAT_WAAAGH","column":"Short_Description","value":"AURA\u003A Friendly ORKS within 6\" — MELEE [+1 TO HIT] [+1 TO WOUND]"},{"file":"data/orks/Abilities.csv","id_column":"Ability_ID","row_id":"PULSA_ROKKIT","column":"Short_Description","value":"Once per battle\u003A MONSTER / VEHICLE within 24\" — RANGE [+1 AP] [LETHAL HITS]"},{"file":"data/orks/Abilities.csv","id_column":"Ability_ID","row_id":"PYROMANIAKS","column":"Short_Description","value":"Re-roll To Wound of 1 if within 6\" Re-roll ALL To Wound if on Objective. [RE-ROLL 1S TO WOUND] [RE-ROLL ALL WOUNDS]"},{"file":"data/orks/Abilities.csv","id_column":"Ability_ID","row_id":"SHOKK_BOOSTA","column":"Short_Description","value":"Advance can be 6\", move through models, then hazard per model. [ADVANCE 6]"},{"file":"data/orks/Abilities.csv","id_column":"Ability_ID","row_id":"SOMETHIN_TO_PROVE","column":"Short_Description","value":"ANYTIME — MELEE [+1 TO HIT]"},{"file":"data/orks/Abilities.csv","id_column":"Ability_ID","row_id":"SUPER_RUNTS","column":"Short_Description","value":"This unit is RILED UP. Scavenged Shivs +1 A, WS and S. [RILED UP] [5++ Invul] [+1 A] [+1 WS] [+1 S]"},{"file":"da