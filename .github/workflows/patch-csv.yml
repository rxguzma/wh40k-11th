name: Patch CSV

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-csv.yml'
  workflow_dispatch:
    inputs:
      patches:
        description: JSON list of operations. One run, one commit.
        required: true
        type: string

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply patches
        env:
          PATCHES: ${{ inputs.patches }}
        run: |
          python3 <<'PY'
          import csv, json, os, sys
          from pathlib import Path

          raw = r'[{"file":"data/universal/Tag_Definitions.csv","id_column":"Tag_ID","row_id":"PLUS_1_TO_HIT_MELEE","mode":"insert","sets":{"Display_Tag":"+1 TO HIT","Title":"+1 To Hit","Category":"Melee - Combat Modifiers","Affects":"Melee Attacks","Description":"Improves Hit rolls by 1 for Melee attacks.","Editable":"TRUE","Effect_Type":"ROLL_MODIFIER","Target":"MELEE","Stat":"HIT","Operation":"IMPROVE","Value":"1","Sort_Order":"201"}},{"file":"data/universal/Tag_Definitions.csv","id_column":"Tag_ID","row_id":"PLUS_1_TO_WOUND_MELEE","mode":"insert","sets":{"Display_Tag":"+1 TO WOUND","Title":"+1 To Wound","Category":"Melee - Combat Modifiers","Affects":"Melee Attacks","Description":"Improves Wound rolls by 1 for Melee attacks.","Editable":"TRUE","Effect_Type":"ROLL_MODIFIER","Target":"MELEE","Stat":"WOUND","Operation":"IMPROVE","Value":"1","Sort_Order":"202"}},{"file":"data/universal/Tag_Definitions.csv","id_column":"Tag_ID","row_id":"REROLL_1S_TO_HIT_MELEE","mode":"insert","sets":{"Display_Tag":"RE-ROLL 1S TO HIT","Title":"Re-roll 1s To Hit","Category":"Melee - Combat Modifiers","Affects":"Melee Attacks","Description":"Re-roll Hit rolls of 1 for Melee attacks.","Editable":"TRUE","Effect_Type":"REROLL","Target":"MELEE","Stat":"HIT","Operation":"ONES","Value":"1","Sort_Order":"203"}},{"file":"data/universal/Tag_Definitions.csv","id_column":"Tag_ID","row_id":"REROLL_ALL_HITS_MELEE","mode":"insert","sets":{"Display_Tag":"RE-ROLL ALL HITS","Title":"Re-roll All Hits","Category":"Melee - Combat Modifiers","Affects":"Melee Attacks","Description":"Re-roll all Hit rolls for Melee attacks.","Editable":"TRUE","Effect_Type":"REROLL","Target":"MELEE","Stat":"HIT","Operation":"ALL","Value":"1","Sort_Order":"204"}},{"file":"data/universal/Tag_Definitions.csv","id_column":"Tag_ID","row_id":"REROLL_1S_TO_WOUND_MELEE","mode":"insert","sets":{"Display_Tag":"RE-ROLL 1S TO WOUND","Title":"Re-roll 1s To Wound","Category":"Melee - Combat Modifiers","Affects":"Melee Attacks","Description":"Re-roll Wound rolls of 1 for Melee attacks.","Editable":"TRUE","Effect_Type":"REROLL","Target":"MELEE","Stat":"WOUND","Operation":"ONES","Value":"1","Sort_Order":"205"}},{"file":"data/universal/Tag_Definitions.csv","id_column":"Tag_ID","row_id":"REROLL_ALL_WOUNDS_MELEE","mode":"insert","sets":{"Display_Tag":"RE-ROLL ALL WOUNDS","Title":"Re-roll All Wounds","Category":"Melee - Combat Modifiers","Affects":"Melee Attacks","Description":"Re-roll all Wound rolls for Melee attacks.","Editable":"TRUE","Effect_Type":"REROLL","Target":"MELEE","Stat":"WOUND","Operation":"ALL","Value":"1","Sort_Order":"206"}},{"file":"data/universal/Tag_Definitions.csv","id_column":"Tag_ID","row_id":"LETHAL_HITS_MELEE","mode":"insert","sets":{"Display_Tag":"LETHAL HITS","Title":"Lethal Hits","Category":"Melee - Weapon Rules","Affects":"Melee Weapons","Description":"Applies Lethal Hits to Melee weapons.","Editable":"TRUE","Effect_Type":"WEAPON_RULE","Target":"MELEE","Stat":"LETHAL_HITS","Operation":"SET","Value":"1","Sort_Order":"301"}},{"file":"data/universal/Tag_Definitions.csv","id_column":"Tag_ID","row_id":"DEVASTATING_WOUNDS_MELEE","mode":"insert","sets":{"Display_Tag":"DEVASTATING WOUNDS","Title":"Devastating Wounds","Category":"Melee - Weapon Rules","Affects":"Melee Weapons","Description":"Applies Devastating Wounds to Melee weapons.","Editable":"TRUE","Effect_Type":"WEAPON_RULE","Target":"MELEE","Stat":"DEVASTATING_WOUNDS","Operation":"SET","Value":"1","Sort_Order":"302"}},{"file":"data/universal/Tag_Definitions.csv","id_column":"Tag_ID","row_id":"TWIN_LINKED_MELEE","mode":"insert","sets":{"Display_Tag":"TWIN-LINKED","Title":"Twin-linked","Category":"Melee - Weapon Rules","Affects":"Melee Weapons","Description":"Applies Twin-linked to Melee weapons.","Editable":"TRUE","Effect_Type":"WEAPON_RULE","Target":"MELEE","Stat":"TWIN_LINKED","Operation":"SET","Value":"1","Sort_Order":"303"}},{"file":"data/universal/Tag_Definitions.csv","id_column":"Tag_ID","row_id":"SUSTAINED_HITS_1_MELEE","mode":"insert","sets":{"Display_Tag":"SUSTAINED HITS 1","Title":"Sustained Hits 1","Category":"Melee - Weapon Rules","Affects":"Melee Weapons","Description":"Applies Sustained Hits 1 to Melee weapons.","Editable":"TRUE","Effect_Type":"WEAPON_RULE","Target":"MELEE","Stat":"SUSTAINED_HITS","Operation":"SET","Value":"1","Sort_Order":"304"}},{"file":"data/universal/Tag_Definitions.csv","id_column":"Tag_ID","row_id":"SUSTAINED_HITS_2_MELEE","mode":"insert","sets":{"Display_Tag":"SUSTAINED HITS 2","Title":"Sustained Hits 2","Category":"Melee - Weapon Rules","Affects":"Melee Weapons","Description":"Applies Sustained Hits 2 to Melee weapons.","Editable":"TRUE","Effect_Type":"WEAPON_RULE","Target":"MELEE","Stat":"SUSTAINED_HITS","Operation":"SET","Value":"2","Sort_Order":"305"}},{"file":"data/universal/Tag_Definitions.csv","id_column":"Tag_ID","row_id":"CLEAVE_1_MELEE","mode":"insert","sets":{"Display_Tag":"CLEAVE 1","Title":"Cleave 1","Category":"Melee - Weapon Rules","Affects":"Melee Weapons","Description":"Adds 1 Melee attack per 5 target models.","Editable":"TRUE","Effect_Type":"WEAPON_RULE","Target":"MELEE","Stat":"CLEAVE","Operation":"SET","Value":"1","Sort_Order":"306"}},{"file":"data/universal/Tag_Definitions.csv","id_column":"Tag_ID","row_id":"CLEAVE_2_MELEE","mode":"insert","sets":{"Display_Tag":"CLEAVE 2","Title":"Cleave 2","Category":"Melee - Weapon Rules","Affects":"Melee Weapons","Description":"Adds 2 Melee attacks per 5 target models.","Editable":"TRUE","Effect_Type":"WEAPON_RULE","Target":"MELEE","Stat":"CLEAVE","Operation":"SET","Value":"2","Sort_Order":"307"}},{"file":"data/universal/Tag_Definitions.csv","id_column":"Tag_ID","row_id":"ANTI_VEHICLE_3_MELEE","mode":"insert","sets":{"Display_Tag":"ANTI-VEHICLE 3+","Title":"Anti-Vehicle 3+","Category":"Melee - Weapon Rules","Affects":"Melee Weapons","Description":"Applies Anti-Vehicle 3+ to Melee weapons.","Editable":"TRUE","Effect_Type":"WEAPON_RULE","Target":"MELEE","Stat":"ANTI_VEHICLE","Operation":"SET","Value":"3","Sort_Order":"308"}},{"file":"data/universal/Tag_Definitions.csv","id_column":"Tag_ID","row_id":"ANTI_INFANTRY_4_MELEE","mode":"insert","sets":{"Display_Tag":"ANTI-INFANTRY 4+","Title":"Anti-Infantry 4+","Category":"Melee - Weapon Rules","Affects":"Melee Weapons","Description":"Applies Anti-Infantry 4+ to Melee weapons.","Editable":"TRUE","Effect_Type":"WEAPON_RULE","Target":"MELEE","Stat":"ANTI_INFANTRY","Operation":"SET","Value":"4","Sort_Order":"309"}},{"file":"data/universal/Tag_Definitions.csv","id_column":"Tag_ID","row_id":"PLUS_1_TO_HIT_RANGE","mode":"insert","sets":{"Display_Tag":"+1 TO HIT","Title":"+1 To Hit","Category":"Range - Combat Modifiers","Affects":"Ranged Attacks","Description":"Improves Hit rolls by 1 for Ranged attacks.","Editable":"TRUE","Effect_Type":"ROLL_MODIFIER","Target":"RANGE","Stat":"HIT","Operation":"IMPROVE","Value":"1","Sort_Order":"501"}},{"file":"data/universal/Tag_Definitions.csv","id_column":"Tag_ID","row_id":"PLUS_1_TO_WOUND_RANGE","mode":"insert","sets":{"Display_Tag":"+1 TO WOUND","Title":"+1 To Wound","Category":"Range - Combat Modifiers","Affects":"Ranged Attacks","Description":"Improves Wound rolls by 1 for Ranged attacks.","Editable":"TRUE","Effect_Type":"ROLL_MODIFIER","Target":"RANGE","Stat":"WOUND","Operation":"IMPROVE","Value":"1","Sort_Order":"502"}},{"file":"data/universal/Tag_Definitions.csv","id_column":"Tag_ID","row_id":"REROLL_1S_TO_HIT_RANGE","mode":"insert","sets":{"Display_Tag":"RE-ROLL 1S TO HIT","Title":"Re-roll 1s To Hit","Category":"Range - Combat Modifiers","Affects":"Ranged Attacks","Description":"Re-roll Hit rolls of 1 for Ranged attacks.","Editable":"TRUE","Effect_Type":"REROLL","Target":"RANGE","Stat":"HIT","Operation":"ONES","Value":"1","Sort_Order":"503"}},{"file":"data/universal/Tag_Definitions.csv","id_column":"Tag_ID","row_id":"REROLL_ALL_HITS_RANGE","mode":"insert","sets":{"Display_Tag":"RE-ROLL ALL HITS","Title":"Re-roll All Hits","Category":"Range - Combat Modifiers","Affects":"Ranged Attacks","Description":"Re-roll all Hit rolls for Ranged attacks.","Editable":"TRUE","Effect_Type":"REROLL","Target":"RANGE","Stat":"HIT","Operation":"ALL","Value":"1","Sort_Order":"504"}},{"file":"data/universal/Tag_Definitions.csv","id_column":"Tag_ID","row_id":"REROLL_1S_TO_WOUND_RANGE","mode":"insert","sets":{"Display_Tag":"RE-ROLL 1S TO WOUND","Title":"Re-roll 1s To Wound","Category":"Range - Combat Modifiers","Affects":"Ranged Attacks","Description":"Re-roll Wound rolls of 1 for Ranged attacks.","Editable":"TRUE","Effect_Type":"REROLL","Target":"RANGE","Stat":"WOUND","Operation":"ONES","Value":"1","Sort_Order":"505"}},{"file":"data/universal/Tag_Definitions.csv","id_column":"Tag_ID","row_id":"REROLL_ALL_WOUNDS_RANGE","mode":"insert","sets":{"Display_Tag":"RE-ROLL ALL WOUNDS","Title":"Re-roll All Wounds","Category":"Range - Combat Modifiers","Affects":"Ranged Attacks","Description":"Re-roll all Wound rolls for Ranged attacks.","Editable":"TRUE","Effect_Type":"REROLL","Target":"RANGE","Stat":"WOUND","Operation":"ALL","Value":"1","Sort_Order":"506"}},{"file":"data/universal/Tag_Definitions.csv","id_column":"Tag_ID","row_id":"LETHAL_HITS_RANGE","mode":"insert","sets":{"Display_Tag":"LETHAL HITS","Title":"Lethal Hits","Category":"Range - Weapon Rules","Affects":"Ranged Weapons","Description":"Applies Lethal Hits to Ranged weapons.","Editable":"TRUE","Effect_Type":"WEAPON_RULE","Target":"RANGE","Stat":"LETHAL_HITS","Operation":"SET","Value":"1","Sort_Order":"601"}},{"file":"data/universal/Tag_Definitions.csv","id_column":"Tag_ID","row_id":"DEVASTATING_WOUNDS_RANGE","mode":"insert","sets":{"Display_Tag":"DEVASTATING WOUNDS","Title":"Devastating Wounds","Category":"Range - Weapon Rules","Affects":"Ranged Weapons","Description":"Applies Devastating Wounds to Ranged weapons.","Editable":"TRUE","Effect_Type":"WEAPON_RULE","Target":"RANGE","Stat":"DEVASTATING_WOUNDS","Operation":"SET","Value":"1","Sort_Order":"602"}},{"file":"data/universal/Tag_Definitions.csv","id_column":"Tag_ID","row_id":"TWIN_LINKED_RANGE","mode":"insert","sets":{"Display_Tag":"TWIN-LINKED","Title":"Twin-linked","Category":"Range - Weapon Rules","Affects":"Ranged Weapons","Description":"Applies Twin-linked to Ranged weapons.","Editable":"TRUE","Effect_Type":"WEAPON_RULE","Target":"RANGE","Stat":"TWIN_LINKED","Operation":"SET","Value":"1","Sort_Order":"603"}},{"file":"data/universal/Tag_Definitions.csv","id_column":"Tag_ID","row_id":"SUSTAINED_HITS_1_RANGE","mode":"insert","sets":{"Display_Tag":"SUSTAINED HITS 1","Title":"Sustained Hits 1","Category":"Range - Weapon Rules","Affects":"Ranged Weapons","Description":"Applies Sustained Hits 1 to Ranged weapons.","Editable":"TRUE","Effect_Type":"WEAPON_RULE","Target":"RANGE","Stat":"SUSTAINED_HITS","Operation":"SET","Value":"1","Sort_Order":"604"}},{"file":"data/universal/Tag_Definitions.csv","id_column":"Tag_ID","row_id":"SUSTAINED_HITS_2_RANGE","mode":"insert","sets":{"Display_Tag":"SUSTAINED HITS 2","Title":"Sustained Hits 2","Category":"Range - Weapon Rules","Affects":"Ranged Weapons","Description":"Applies Sustained Hits 2 to Ranged weapons.","Editable":"TRUE","Effect_Type":"WEAPON_RULE","Target":"RANGE","Stat":"SUSTAINED_HITS","Operation":"SET","Value":"2","Sort_Order":"605"}},{"file":"data/universal/Tag_Definitions.csv","id_column":"Tag_ID","row_id":"TORRENT_RANGE","mode":"insert","sets":{"Display_Tag":"TORRENT","Title":"Torrent","Category":"Range - Weapon Rules","Affects":"Ranged Weapons","Description":"Applies Torrent to Ranged weapons.","Editable":"TRUE","Effect_Type":"WEAPON_RULE","Target":"RANGE","Stat":"TORRENT","Operation":"SET","Value":"1","Sort_Order":"606"}},{"file":"data/universal/Tag_Definitions.csv","id_column":"Tag_ID","row_id":"HEAVY_RANGE","mode":"insert","sets":{"Display_Tag":"HEAVY","Title":"Heavy","Category":"Range - Weapon Rules","Affects":"Ranged Weapons","Description":"Applies Heavy to Ranged weapons.","Editable":"TRUE","Effect_Type":"WEAPON_RULE","Target":"RANGE","Stat":"HEAVY","Operation":"SET","Value":"1","Sort_Order":"607"}},{"file":"data/universal/Tag_Definitions.csv","id_column":"Tag_ID","row_id":"IGNORES_COVER_RANGE","mode":"insert","sets":{"Display_Tag":"IGNORES COVER","Title":"Ignores Cover","Category":"Range - Weapon Rules","Affects":"Ranged Weapons","Description":"Applies Ignores Cover to Ranged weapons.","Editable":"TRUE","Effect_Type":"WEAPON_RULE","Target":"RANGE","Stat":"IGNORES_COVER","Operation":"SET","Value":"1","Sort_Order":"608"}},{"file":"data/universal/Tag_Definitions.csv","id_column":"Tag_ID","row_id":"BLAST_RANGE","mode":"insert","sets":{"Display_Tag":"BLAST","Title":"Blast","Category":"Range - Weapon Rules","Affects":"Ranged Weapons","Description":"Applies Blast to Ranged weapons.","Editable":"TRUE","Effect_Type":"WEAPON_RULE","Target":"RANGE","Stat":"BLAST","Operation":"SET","Value":"1","Sort_Order":"609"}},{"file":"data/universal/Tag_Definitions.csv","id_column":"Tag_ID","row_id":"RAPID_FIRE_1_RANGE","mode":"insert","sets":{"Display_Tag":"RAPID FIRE 1","Title":"Rapid Fire 1","Category":"Range - Weapon Rules","Affects":"Ranged Weapons","Description":"Applies Rapid Fire 1 to Ranged weapons.","Editable":"TRUE","Effect_Type":"WEAPON_RULE","Target":"RANGE","Stat":"RAPID_FIRE","Operation":"SET","Value":"1","Sort_Order":"610"}},{"file":"data/universal/Tag_Definitions.csv","id_column":"Tag_ID","row_id":"MELTA_1_RANGE","mode":"insert","sets":{"Display_Tag":"MELTA 1","Title":"Melta 1","Category":"Range - Weapon Rules","Affects":"Ranged Weapons","Description":"Applies Melta 1 to Ranged weapons.","Editable":"TRUE","Effect_Type":"WEAPON_RULE","Target":"RANGE","Stat":"MELTA","Operation":"SET","Value":"1","Sort_Order":"611"}},{"file":"data/universal/Tag_Definitions.csv","id_column":"Tag_ID","row_id":"ANTI_VEHICLE_3_RANGE","mode":"insert","sets":{"Display_Tag":"ANTI-VEHICLE 3+","Title":"Anti-Vehicle 3+","Category":"Range - Weapon Rules","Affects":"Ranged Weapons","Description":"Applies Anti-Vehicle 3+ to Ranged weapons.","Editable":"TRUE","Effect_Type":"WEAPON_RULE","Target":"RANGE","Stat":"ANTI_VEHICLE","Operation":"SET","Value":"3","Sort_Order":"612"}},{"file":"data/universal/Tag_Definitions.csv","id_column":"Tag_ID","row_id":"ANTI_INFANTRY_4_RANGE","mode":"insert","sets":{"Display_Tag":"ANTI-INFANTRY 4+","Title":"Anti-Infantry 4+","Category":"Range - Weapon Rules","Affects":"Ranged Weapons","Description":"Applies Anti-Infantry 4+ to Ranged weapons.","Editable":"TRUE","Effect_Type":"WEAPON_RULE","Target":"RANGE","Stat":"ANTI_INFANTRY","Operation":"SET","Value":"4","Sort_Order":"613"}},{"file":"data/universal/Tag_Definitions.csv","id_column":"Tag_ID","row_id":"MINUS_1_SV","mode":"insert","sets":{"Display_Tag":"-1 SV","Title":"-1 Save","Category":"Unit Stats","Affects":"Unit","Description":"Improves the Unit Save characteristic by 1.","Editable":"TRUE","Effect_Type":"STAT","Target":"UNIT","Stat":"SV","Operation":"IMPROVE","Value":"1","Sort_Order":"705"}},{"file":"data/universal/Tag_Definitions.csv","id_column":"Tag_ID","row_id":"MINUS_1_LD","mode":"insert","sets":{"Display_Tag":"-1 LD","Title":"-1 Leadership","Category":"Unit Stats","Affects":"Unit","Description":"Improves the Unit Leadership characteristic by 1.","Editable":"TRUE","Effect_Type":"STAT","Target":"UNIT","Stat":"LD","Operation":"IMPROVE","Value":"1","Sort_Order":"706"}},{"file":"data/universal/Tag_Definitions.csv","id_column":"Tag_ID","row_id":"PLUS_5_PTS","mode":"update","sets":{"Editable":"TRUE"}},{"file":"data/universal/Tag_Definitions.csv","id_column":"Tag_ID","row_id":"PLUS_10_PTS","mode":"update","sets":{"Editable":"TRUE"}},{"file":"data/universal/Tag_Definitions.csv","id_column":"Tag_ID","row_id":"PLUS_20_PTS","mode":"update","sets":{"Editable":"TRUE"}},{"file":"data/universal/Tag_Definitions.csv","id_column":"Tag_ID","row_id":"PLUS_15_PTS","mode":"insert","sets":{"Display_Tag":"+15 Pts","Title":"+15 Pts","Category":"Points","Affects":"Unit","Description":"Adds 15 points for each model in the Unit.","Editable":"TRUE","Effect_Type":"POINTS_PER_MODEL","Target":"UNIT","Stat":"PTS","Operation":"ADD","Value":"15","Sort_Order":"723"}},{"file":"data/universal/Tag_Definitions.csv","id_column":"Tag_ID","row_id":"PLUS_25_PTS","mode":"insert","sets":{"Display_Tag":"+25 Pts","Title":"+25 Pts","Category":"Points","Affects":"Unit","Description":"Adds 25 points for each model in the Unit.","Editable":"TRUE","Effect_Type":"POINTS_PER_MODEL","Target":"UNIT","Stat":"PTS","Operation":"ADD","Value":"25","Sort_Order":"725"}},{"file":"data/universal/Tag_Definitions.csv","id_column":"Tag_ID","row_id":"PLUS_30_PTS","mode":"insert","sets":{"Display_Tag":"+30 Pts","Title":"+30 Pts","Category":"Points","Affects":"Unit","Description":"Adds 30 points for each model in the Unit.","Editable":"TRUE","Effect_Type":"POINTS_PER_MODEL","Target":"UNIT","Stat":"PTS","Operation":"ADD","Value":"30","Sort_Order":"726"}}]'
          try:
              ops = json.loads(raw)
          except json.JSONDecodeError as e:
              sys.exit(f'patches is not JSON: {e}')
          if not isinstance(ops, list) or not ops:
              sys.exit('patches must be a non-empty JSON list')

          def decode(val):
              if val is None:
                  return ''
              s = str(val)
              return s.replace('\\n', '\n')

          def load_csv(path):
              if path.is_absolute() or '..' in path.parts:
                  sys.exit(f'bad path {path}')
              if not str(path).startswith('data/') or path.suffix.lower() != '.csv':
                  sys.exit(f'file must be a .csv under data/: {path}')
              if not path.is_file():
                  sys.exit(f'missing {path}')
              with path.open(encoding='utf-8', newline='') as f:
                  rows = list(csv.reader(f))
              if not rows:
                  sys.exit(f'empty csv {path}')
              return rows

          files = {}
          changed = set()

          for i, op in enumerate(ops):
              if not isinstance(op, dict):
                  sys.exit(f'op {i} is not an object')
              path = Path(str(op.get('file', '')).strip())
              if path not in files:
                  files[path] = load_csv(path)
              rows = files[path]
              header = rows[0]
              id_col = str(op.get('id_column') or '').strip() or header[0]
              if id_col not in header:
                  sys.exit(f'op {i}: id column not in header: {id_col}')
              i_id = header.index(id_col)
              row_id = str(op.get('row_id') or '').strip()
              if not row_id:
                  sys.exit(f'op {i}: row_id required')
              mode = str(op.get('mode') or 'update').strip()

              if mode == 'add_column':
                  col = str(op.get('column') or '').strip()
                  if not col:
                      sys.exit(f'op {i}: add_column needs column')
                  if col in header:
                      print(f'column already exists {path} {col}')
                      continue
                  after_col = str(op.get('after_column') or '').strip()
                  if after_col and after_col not in header:
                      sys.exit(f'op {i}: after column not in header: {after_col}')
                  insert_at = header.index(after_col) + 1 if after_col else len(header)
                  old_width = len(header)
                  header.insert(insert_at, col)
                  for row in rows[1:]:
                      while len(row) < old_width:
                          row.append('')
                      row.insert(insert_at, '')
                  changed.add(path)
                  print(f'added column {path} {col}')
                  continue

              if mode == 'dedupe_by_key':
                  key_col = str(op.get('key_column') or '').strip()
                  if key_col not in header:
                      sys.exit(f'op {i}: key column not in header: {key_col}')
                  i_key = header.index(key_col)
                  kept = [header]
                  seen = set()
                  matched = 0
                  removed = 0
                  for row in rows[1:]:
                      if not row:
                          continue
                      while len(row) < len(header):
                          row.append('')
                      if row[i_id] != row_id:
                          kept.append(row)
                          continue
                      matched += 1
                      key = row[i_key].strip()
                      if not key:
                          sys.exit(f'op {i}: blank {key_col} while deduping {row_id!r}')
                      if key in seen:
                          removed += 1
                          continue
                      seen.add(key)
                      kept.append(row)
                  if matched < 1:
                      sys.exit(f'op {i}: found no rows for {row_id!r}')
                  if removed < 1:
                      sys.exit(f'op {i}: found no duplicate rows for {row_id!r}')
                  files[path] = kept
                  changed.add(path)
                  print(f'deduped {path} {row_id}: kept {len(seen)} unique {key_col} values, removed {removed} duplicates')
                  continue

              if mode == 'fill_blank_where':
                  match_col = str(op.get('match_column') or '').strip()
                  col = str(op.get('column') or '').strip()
                  if match_col not in header:
                      sys.exit(f'op {i}: match column not in header: {match_col}')
                  if col not in header:
                      sys.exit(f'op {i}: column not in header: {col}')
                  match_value = decode(op.get('match_value')).strip()
                  new = decode(op.get('value'))
                  if not match_value:
                      sys.exit(f'op {i}: match_value required')
                  if new == '':
                      sys.exit(f'op {i}: value required')
                  i_match = header.index(match_col)
                  i_col = header.index(col)
                  hits = 0
                  for row in rows[1:]:
                      if not row:
                          continue
                      while len(row) < len(header):
                          row.append('')
                      if row[i_match].strip() == match_value and not row[i_col].strip():
                          row[i_col] = new
                          hits += 1
                  if hits < 1:
                      sys.exit(f'op {i}: found no blank {col} values where {match_col}={match_value!r}')
                  changed.add(path)
                  print(f'filled {hits} blank {col} values in {path} where {match_col}={match_value!r}')
                  continue

              if mode == 'replace_text':
                  col = str(op.get('column') or '').strip()
                  if col not in header:
                      sys.exit(f'op {i}: column not in header: {col}')
                  old = decode(op.get('from'))
                  new = decode(op.get('to'))
                  if not old:
                      sys.exit(f'op {i}: replace_text needs non-empty from')
                  i_col = header.index(col)
                  hits = 0
                  for row in rows[1:]:
                      if not row:
                          continue
                      while len(row) < len(header):
                          row.append('')
                      if old in row[i_col]:
                          row[i_col] = row[i_col].replace(old, new)
                          hits += 1
                  if hits < 1:
                      sys.exit(f'op {i}: replace_text found no matches for {old!r}')
                  changed.add(path)
                  print(f'replaced {old!r} in {hits} rows of {path} column {col}')
                  continue

              if mode == 'delete':
                  kept = [header]
                  hits = 0
                  for row in rows[1:]:
                      if not row:
                          continue
                      if len(row) > i_id and row[i_id] == row_id:
                          hits += 1
                          continue
                      kept.append(row)
                  if hits != 1:
                      sys.exit(f'op {i}: expected 1 row for {row_id!r}, found {hits}')
                  files[path] = kept
                  changed.add(path)
                  print(f'deleted {path} {row_id}')
                  continue

              if mode == 'insert':
                  existing = 0
                  for row in rows[1:]:
                      if row and len(row) > i_id and row[i_id] == row_id:
                          existing += 1
                  if existing:
                      sys.exit(f'op {i}: row already exists: {row_id}')
                  sets = op.get('sets')
                  if not isinstance(sets, dict) or not sets:
                      sys.exit(f'op {i}: insert needs sets')
                  new_row = [''] * len(header)
                  new_row[i_id] = row_id
                  for col, val in sets.items():
                      if col not in header:
                          sys.exit(f'op {i}: column not in header: {col}')
                      new_row[header.index(col)] = decode(val)
                  after = str(op.get('after_row_id') or '').strip()
                  if after:
                      placed = False
                      kept = [header]
                      for row in rows[1:]:
                          kept.append(row)
                          if row and len(row) > i_id and row[i_id] == after:
                              kept.append(new_row)
                              placed = True
                      if not placed:
                          sys.exit(f'op {i}: after_row_id not found: {after}')
                      files[path] = kept
                  else:
                      rows.append(new_row)
                      files[path] = rows
                  changed.add(path)
                  print(f'inserted {path} {row_id}')
                  continue

              if mode != 'update':
                  sys.exit(f'op {i}: unknown mode {mode}')

              sets = op.get('sets')
              if not isinstance(sets, dict) or not sets:
                  sets = {}
                  if op.get('column'):
                      sets[str(op['column'])] = op.get('value', '')
                  if op.get('column_2'):
                      sets[str(op['column_2'])] = op.get('value_2', '')
              if not sets:
                  sys.exit(f'op {i}: update needs sets or column/value')

              hits = 0
              for row in rows[1:]:
                  if not row:
                      continue
                  while len(row) < len(header):
                      row.append('')
                  if row[i_id] != row_id:
                      continue
                  for col, val in sets.items():
                      if col not in header:
                          sys.exit(f'op {i}: column not in header: {col}')
                      row[header.index(col)] = decode(val)
                  hits += 1
              if hits != 1:
                  sys.exit(f'op {i}: expected 1 row for {row_id!r}, found {hits}')
              changed.add(path)
              print(f'updated {path} {row_id} {list(sets)}')

          for path, rows in files.items():
              if path not in changed:
                  continue
              with path.open('w', newline='', encoding='utf-8') as f:
                  csv.writer(f, lineterminator='\n').writerows(rows)
          print('changed', ' '.join(str(p) for p in sorted(changed)))
          PY

