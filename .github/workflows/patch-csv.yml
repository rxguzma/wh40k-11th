name: Patch CSV

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-csv.yml'
  workflow_dispatch:
    inputs:
      patches:
        description: JSON list of operations. One run, one commit.
        required: true
        type: string

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply patches
        env:
          PATCHES: ${{ inputs.patches || '[{"file":"data/marines/Weapon_Stats.csv","id_column":"Weapon_ID","row_id":"MASTER_CRAFTED_POWER_WEAPON_VANGUARD_VETERANS","mode":"update","sets":{"Weapon Name":"Master-crafted Power Weapon","R\"":"-","A":"3","WS":"3+","St":"5","AP":"-2","D":"2"}},{"file":"data/marines/Weapon_Stats.csv","id_column":"Weapon_ID","row_id":"VANGUARD_RELIC_BLADE","mode":"insert","sets":{"Weapon Name":"Relic Blade","R\"":"-","A":"3","WS":"3+","St":"6","AP":"-2","D":"2"}},{"file":"data/marines/Weapon_Abilities.csv","id_column":"Weapon_Ability_ID","row_id":"VANGUARD_RELIC_BLADE:ability_1","mode":"insert","sets":{"Weapon_ID":"VANGUARD_RELIC_BLADE","Ability_Type":"CLEAVE","Target":"","Value":"1","Condition":"","Separator_Before":"","Sort_Order":"1"}},{"file":"data/marines/Weapon_Abilities.csv","id_column":"Weapon_Ability_ID","row_id":"VANGUARD_RELIC_BLADE:ability_2","mode":"insert","sets":{"Weapon_ID":"VANGUARD_RELIC_BLADE","Ability_Type":"LETHAL HITS","Target":"non-MONSTER/VEHICLE","Value":"","Condition":"","Separator_Before":", ","Sort_Order":"2"}},{"file":"data/marines/Weapon_Stats.csv","id_column":"Weapon_ID","row_id":"OCCULUS_BOLT_CARBINE","mode":"update","sets":{"Weapon Name":"Occulus Bolt Carbine","R\"":"24\"","A":"2","WS":"3+","St":"5","AP":"-1","D":"1"}},{"file":"data/marines/Weapon_Stats.csv","id_column":"Weapon_ID","row_id":"PAIRED_COMBAT_BLADES","mode":"update","sets":{"Weapon Name":"Paired Combat Blades","R\"":"-","A":"3","WS":"3+","St":"5","AP":"-1","D":"1"}},{"file":"data/marines/Weapon_Stats.csv","id_column":"Weapon_ID","row_id":"REIVER_BOLT_CARBINE","mode":"insert","sets":{"Weapon Name":"Bolt Carbine","R\"":"18\"","A":"3","WS":"3+","St":"5","AP":"-1","D":"1"}},{"file":"data/marines/Weapon_Abilities.csv","id_column":"Weapon_Ability_ID","row_id":"REIVER_BOLT_CARBINE:ability_1","mode":"insert","sets":{"Weapon_ID":"REIVER_BOLT_CARBINE","Ability_Type":"ASSAULT","Target":"","Value":"","Condition":"","Separator_Before":"","Sort_Order":"1"}},{"file":"data/marines/Weapon_Abilities.csv","id_column":"Weapon_Ability_ID","row_id":"REIVER_BOLT_CARBINE:ability_2","mode":"insert","sets":{"Weapon_ID":"REIVER_BOLT_CARBINE","Ability_Type":"PRECISION","Target":"","Value":"","Condition":"","Separator_Before":", ","Sort_Order":"2"}},{"file":"data/marines/Weapon_Stats.csv","id_column":"Weapon_ID","row_id":"SPECIAL_ISSUE_BOLT_PISTOL_REIVERS","mode":"update","sets":{"Weapon Name":"Special-issue Bolt Pistol","R\"":"12\"","A":"1","WS":"3+","St":"5","AP":"-2","D":"1"}},{"file":"data/marines/Weapon_Abilities.csv","id_column":"Weapon_Ability_ID","row_id":"*","mode":"delete_where","where":{"Weapon_ID":"SPECIAL_ISSUE_BOLT_PISTOL_REIVERS"}},{"file":"data/marines/Weapon_Abilities.csv","id_column":"Weapon_Ability_ID","row_id":"SPECIAL_ISSUE_BOLT_PISTOL_REIVERS:ability_1","mode":"insert","sets":{"Weapon_ID":"SPECIAL_ISSUE_BOLT_PISTOL_REIVERS","Ability_Type":"CLOSE-QUARTERS","Target":"","Value":"","Condition":"","Separator_Before":"","Sort_Order":"1"}},{"file":"data/marines/Weapon_Abilities.csv","id_column":"Weapon_Ability_ID","row_id":"SPECIAL_ISSUE_BOLT_PISTOL_REIVERS:ability_2","mode":"insert","sets":{"Weapon_ID":"SPECIAL_ISSUE_BOLT_PISTOL_REIVERS","Ability_Type":"PRECISION","Target":"","Value":"","Condition":"","Separator_Before":", ","Sort_Order":"2"}},{"file":"data/marines/Weapon_Stats.csv","id_column":"Weapon_ID","row_id":"COMBAT_KNIFE_REIVERS","mode":"update","sets":{"Weapon Name":"Monomolecular Combat Knife","R\"":"-","A":"4","WS":"3+","St":"5","AP":"-1","D":"1"}},{"file":"data/marines/Weapon_Stats.csv","id_column":"Weapon_ID","row_id":"SCOUT_BOLTGUN","mode":"insert","sets":{"Weapon Name":"Boltgun","R\"":"24\"","A":"1","WS":"3+","St":"5","AP":"-1","D":"1"}},{"file":"data/marines/Weapon_Abilities.csv","id_column":"Weapon_Ability_ID","row_id":"SCOUT_BOLTGUN:ability_1","mode":"insert","sets":{"Weapon_ID":"SCOUT_BOLTGUN","Ability_Type":"RAPID FIRE","Target":"","Value":"1","Condition":"","Separator_Before":"","Sort_Order":"1"}},{"file":"data/marines/Weapon_Stats.csv","id_column":"Weapon_ID","row_id":"ASTARTES_SHOTGUN_SCOUTS","mode":"update","sets":{"Weapon Name":"Shotgun","R\"":"18\"","A":"2","WS":"3+","St":"4","AP":"-1","D":"1"}},{"file":"data/marines/Weapon_Abilities.csv","id_column":"Weapon_Ability_ID","row_id":"*","mode":"delete_where","where":{"Weapon_ID":"ASTARTES_SHOTGUN_SCOUTS"}},{"file":"data/marines/Weapon_Abilities.csv","id_column":"Weapon_Ability_ID","row_id":"ASTARTES_SHOTGUN_SCOUTS:ability_1","mode":"insert","sets":{"Weapon_ID":"ASTARTES_SHOTGUN_SCOUTS","Ability_Type":"ASSAULT","Target":"","Value":"","Condition":"","Separator_Before":"","Sort_Order":"1"}},{"file":"data/marines/Weapon_Abilities.csv","id_column":"Weapon_Ability_ID","row_id":"ASTARTES_SHOTGUN_SCOUTS:ability_2","mode":"insert","sets":{"Weapon_ID":"ASTARTES_SHOTGUN_SCOUTS","Ability_Type":"BLAST","Target":"","Value":"1","Condition":"","Separator_Before":", ","Sort_Order":"2"}},{"file":"data/marines/Weapon_Stats.csv","id_column":"Weapon_ID","row_id":"HEAVY_BOLTER_SCOUTS","mode":"update","sets":{"Weapon Name":"Heavy Bolter","R\"":"36\"","A":"3","WS":"4+","St":"5","AP":"-1","D":"2"}},{"file":"data/marines/Weapon_Abilities.csv","id_column":"Weapon_Ability_ID","row_id":"*","mode":"delete_where","where":{"Weapon_ID":"HEAVY_BOLTER_SCOUTS"}},{"file":"data/marines/Weapon_Abilities.csv","id_column":"Weapon_Ability_ID","row_id":"HEAVY_BOLTER_SCOUTS:ability_1","mode":"insert","sets":{"Weapon_ID":"HEAVY_BOLTER_SCOUTS","Ability_Type":"HEAVY","Target":"","Value":"","Condition":"","Separator_Before":"","Sort_Order":"1"}},{"file":"data/marines/Weapon_Abilities.csv","id_column":"Weapon_Ability_ID","row_id":"HEAVY_BOLTER_SCOUTS:ability_2","mode":"insert","sets":{"Weapon_ID":"HEAVY_BOLTER_SCOUTS","Ability_Type":"RAPID FIRE","Target":"","Value":"2","Condition":"","Separator_Before":", ","Sort_Order":"2"}},{"file":"data/marines/Weapon_Abilities.csv","id_column":"Weapon_Ability_ID","row_id":"HEAVY_BOLTER_SCOUTS:ability_3","mode":"insert","sets":{"Weapon_ID":"HEAVY_BOLTER_SCOUTS","Ability_Type":"SUSTAINED HITS","Target":"","Value":"1","Condition":"","Separator_Before":", ","Sort_Order":"3"}},{"file":"data/marines/Weapon_Stats.csv","id_column":"Weapon_ID","row_id":"SCOUT_SNIPER_RIFLE","mode":"update","sets":{"Weapon Name":"Sniper Rifle","R\"":"36\"","A":"1","WS":"3+","St":"5","AP":"-2","D":"2"}},{"file":"data/marines/Weapon_Stats.csv","id_column":"Weapon_ID","row_id":"ASTARTES_CHAINSWORD_SCOUTS_SGT","mode":"update","sets":{"Weapon Name":"Chainsword","R\"":"-","A":"4","WS":"3+","St":"4","AP":"-1","D":"1"}},{"file":"data/marines/Weapon_Stats.csv","id_column":"Weapon_ID","row_id":"COMBAT_KNIFE_SCOUTS","mode":"update","sets":{"Weapon Name":"Combat Knife","R\"":"-","A":"3","WS":"3+","St":"4","AP":"-1","D":"1"}},{"file":"data/marines/Weapon_Stats.csv","id_column":"Weapon_ID","row_id":"SCOUT_MISSILE_LAUNCHER_FRAG","mode":"insert","sets":{"Weapon Name":"Missile Launcher - Frag","R\"":"48\"","A":"4","WS":"4+","St":"4","AP":"-1","D":"1"}},{"file":"data/marines/Weapon_Stats.csv","id_column":"Weapon_ID","row_id":"SCOUT_MISSILE_LAUNCHER_KRAK","mode":"insert","sets":{"Weapon Name":"Missile Launcher - Krak","R\"":"48\"","A":"1","WS":"4+","St":"10","AP":"-2","D":"D3+3"}},{"file":"data/marines/Weapon_Abilities.csv","id_column":"Weapon_Ability_ID","row_id":"SCOUT_MISSILE_LAUNCHER_FRAG:ability_1","mode":"insert","sets":{"Weapon_ID":"SCOUT_MISSILE_LAUNCHER_FRAG","Ability_Type":"BLAST","Target":"","Value":"1","Condition":"","Separator_Before":"","Sort_Order":"1"}},{"file":"data/marines/Weapon_Abilities.csv","id_column":"Weapon_Ability_ID","row_id":"SCOUT_MISSILE_LAUNCHER_FRAG:ability_2","mode":"insert","sets":{"Weapon_ID":"SCOUT_MISSILE_LAUNCHER_FRAG","Ability_Type":"HEAVY","Target":"","Value":"","Condition":"","Separator_Before":", ","Sort_Order":"2"}},{"file":"data/marines/Weapon_Stats.csv","id_column":"Weapon_ID","row_id":"BOLT_SNIPER_RIFLE","mode":"update","sets":{"Weapon Name":"Bolt Sniper Rifle","R\"":"36\"","A":"1","WS":"3+","St":"6","AP":"-2","D":"3"}},{"file":"data/marines/Weapon_Stats.csv","id_column":"Weapon_ID","row_id":"ELIMINATOR_INSTIGATOR_BOLT_CARBINE","mode":"insert","sets":{"Weapon Name":"Instigator Bolt Carbine","R\"":"24\"","A":"2","WS":"2+","St":"5","AP":"-2","D":"2"}},{"file":"data/marines/Weapon_Abilities.csv","id_column":"Weapon_Ability_ID","row_id":"ELIMINATOR_INSTIGATOR_BOLT_CARBINE:ability_1","mode":"insert","sets":{"Weapon_ID":"ELIMINATOR_INSTIGATOR_BOLT_CARBINE","Ability_Type":"LETHAL HITS","Target":"non-MONSTER/VEHICLE","Value":"","Condition":"","Separator_Before":"","Sort_Order":"1"}},{"file":"data/marines/Weapon_Abilities.csv","id_column":"Weapon_Ability_ID","row_id":"ELIMINATOR_INSTIGATOR_BOLT_CARBINE:ability_2","mode":"insert","sets":{"Weapon_ID":"ELIMINATOR_INSTIGATOR_BOLT_CARBINE","Ability_Type":"PRECISION","Target":"","Value":"","Condition":"","Separator_Before":", ","Sort_Order":"2"}},{"file":"data/marines/Weapon_Abilities.csv","id_column":"Weapon_Ability_ID","row_id":"ELIMINATOR_INSTIGATOR_BOLT_CARBINE:ability_3","mode":"insert","sets":{"Weapon_ID":"ELIMINATOR_INSTIGATOR_BOLT_CARBINE","Ability_Type":"RAPID FIRE","Target":"","Value":"2","Condition":"","Separator_Before":", ","Sort_Order":"3"}},{"file":"data/marines/Weapon_Stats.csv","id_column":"Weapon_ID","row_id":"LAS_FUSIL","mode":"update","sets":{"Weapon Name":"Las Fusil","R\"":"36\"","A":"1","WS":"3+","St":"10","AP":"-3","D":"D3+3"}},{"file":"data/marines/Weapon_Stats.csv","id_column":"Weapon_ID","row_id":"OUTRIDER_POWER_WEAPON","mode":"insert","sets":{"Weapon Name":"Power Weapon","R\"":"-","A":"3","WS":"3+","St":"5","AP":"-2","D":"1"}},{"file":"data/marines/Weapon_Stats.csv","id_column":"Weapon_ID","row_id":"HEAVY_BOLTER_ERADICATORS","mode":"update","sets":{"Weapon Name":"Heavy Bolter","R\"":"36\"","A":"3","WS":"3+","St":"6","AP":"-1","D":"2"}},{"file":"data/marines/Weapon_Abilities.csv","id_column":"Weapon_Ability_ID","row_id":"*","mode":"delete_where","where":{"Weapon_ID":"HEAVY_BOLTER_ERADICATORS"}},{"file":"data/marines/Weapon_Abilities.csv","id_column":"Weapon_Ability_ID","row_id":"HEAVY_BOLTER_ERADICATORS:ability_1","mode":"insert","sets":{"Weapon_ID":"HEAVY_BOLTER_ERADICATORS","Ability_Type":"HEAVY","Target":"","Value":"","Condition":"","Separator_Before":"","Sort_Order":"1"}},{"file":"data/marines/Weapon_Abilities.csv","id_column":"Weapon_Ability_ID","row_id":"HEAVY_BOLTER_ERADICATORS:ability_2","mode":"insert","sets":{"Weapon_ID":"HEAVY_BOLTER_ERADICATORS","Ability_Type":"RAPID FIRE","Target":"","Value":"2","Condition":"","Separator_Before":", ","Sort_Order":"2"}},{"file":"data/marines/Weapon_Abilities.csv","id_column":"Weapon_Ability_ID","row_id":"HEAVY_BOLTER_ERADICATORS:ability_3","mode":"insert","sets":{"Weapon_ID":"HEAVY_BOLTER_ERADICATORS","Ability_Type":"SUSTAINED HITS","Target":"","Value":"1","Condition":"","Separator_Before":", ","Sort_Order":"3"}},{"file":"data/marines/Weapon_Stats.csv","id_column":"Weapon_ID","row_id":"MELTA_RIFLE","mode":"update","sets":{"Weapon Name":"Melta Rifle","R\"":"18\"","A":"1","WS":"3+","St":"10","AP":"-3","D":"D3+2"}},{"file":"data/marines/Weapon_Abilities.csv","id_column":"Weapon_Ability_ID","row_id":"*","mode":"delete_where","where":{"Weapon_ID":"MELTA_RIFLE"}},{"file":"data/marines/Weapon_Abilities.csv","id_column":"Weapon_Ability_ID","row_id":"MELTA_RIFLE:ability_1","mode":"insert","sets":{"Weapon_ID":"MELTA_RIFLE","Ability_Type":"MELTA","Target":"","Value":"2","Condition":"","Separator_Before":"","Sort_Order":"1"}},{"file":"data/marines/Weapon_Stats.csv","id_column":"Weapon_ID","row_id":"ERADICATOR_MELTA_RIFLE_HUNTER","mode":"insert","sets":{"Weapon Name":"Melta Rifle - Hunter","R\"":"18\"","A":"1","WS":"2+","St":"12","AP":"-3","D":"D3+2"}},{"file":"data/marines/Weapon_Abilities.csv","id_column":"Weapon_Ability_ID","row_id":"ERADICATOR_MELTA_RIFLE_HUNTER:ability_1","mode":"insert","sets":{"Weapon_ID":"ERADICATOR_MELTA_RIFLE_HUNTER","Ability_Type":"HUNTER","Target":"MONSTER/VEHICLE","Value":"","Condition":"","Separator_Before":"","Sort_Order":"1"}},{"file":"data/marines/Weapon_Abilities.csv","id_column":"Weapon_Ability_ID","row_id":"ERADICATOR_MELTA_RIFLE_HUNTER:ability_2","mode":"insert","sets":{"Weapon_ID":"ERADICATOR_MELTA_RIFLE_HUNTER","Ability_Type":"MELTA","Target":"","Value":"2","Condition":"","Separator_Before":", ","Sort_Order":"2"}},{"file":"data/marines/Weapon_Stats.csv","id_column":"Weapon_ID","row_id":"MULTI_MELTA_ERADICATORS","mode":"update","sets":{"Weapon Name":"Multi-melta","R\"":"18\"","A":"2","WS":"3+","St":"10","AP":"-3","D":"D3+2"}},{"file":"data/marines/Weapon_Abilities.csv","id_column":"Weapon_Ability_ID","row_id":"*","mode":"delete_where","where":{"Weapon_ID":"MULTI_MELTA_ERADICATORS"}},{"file":"data/marines/Weapon_Abilities.csv","id_column":"Weapon_Ability_ID","row_id":"MULTI_MELTA_ERADICATORS:ability_1","mode":"insert","sets":{"Weapon_ID":"MULTI_MELTA_ERADICATORS","Ability_Type":"MELTA","Target":"","Value":"3","Condition":"","Separator_Before":"","Sort_Order":"1"}},{"file":"data/marines/Weapon_Stats.csv","id_column":"Weapon_ID","row_id":"ERADICATOR_MULTI_MELTA_HUNTER","mode":"insert","sets":{"Weapon Name":"Multi-melta - Hunter","R\"":"18\"","A":"2","WS":"2+","St":"12","AP":"-3","D":"D3+2"}},{"file":"data/marines/Weapon_Abilities.csv","id_column":"Weapon_Ability_ID","row_id":"ERADICATOR_MULTI_MELTA_HUNTER:ability_1","mode":"insert","sets":{"Weapon_ID":"ERADICATOR_MULTI_MELTA_HUNTER","Ability_Type":"HUNTER","Target":"MONSTER/VEHICLE","Value":"","Condition":"","Separator_Before":"","Sort_Order":"1"}},{"file":"data/marines/Weapon_Abilities.csv","id_column":"Weapon_Ability_ID","row_id":"ERADICATOR_MULTI_MELTA_HUNTER:ability_2","mode":"insert","sets":{"Weapon_ID":"ERADICATOR_MULTI_MELTA_HUNTER","Ability_Type":"MELTA","Target":"","Value":"3","Condition":"","Separator_Before":", ","Sort_Order":"2"}}]' }}
        run: |
          python3 <<'PY'
          import csv, json, os, sys
          from pathlib import Path

          raw = os.environ.get('PATCHES') or ''
          if not raw.strip():
              print('no PATCHES input; skip apply')
              raise SystemExit(0)
          try:
              ops = json.loads(raw)
          except json.JSONDecodeError as e:
              sys.exit(f'patches is not JSON: {e}')
          if not isinstance(ops, list) or not ops:
              sys.exit('patches must be a non-empty JSON list')

          def decode(val):
              if val is None:
                  return ''
              s = str(val)
              return s.replace('\\n', '\n')

          def load_csv(path):
              if path.is_absolute() or '..' in path.parts:
                  sys.exit(f'bad path {path}')
              if not str(path).startswith('data/') or path.suffix.lower() != '.csv':
                  sys.exit(f'file must be a .csv under data/: {path}')
              if not path.is_file():
                  sys.exit(f'missing {path}')
              with path.open(encoding='utf-8', newline='') as f:
                  rows = list(csv.reader(f))
              if not rows:
                  sys.exit(f'empty csv {path}')
              return rows

          files = {}
          changed = set()

          for i, op in enumerate(ops):
              if not isinstance(op, dict):
                  sys.exit(f'op {i} is not an object')
              path = Path(str(op.get('file', '')).strip())
              if path not in files:
                  files[path] = load_csv(path)
              rows = files[path]
              header = rows[0]
              id_col = str(op.get('id_column') or '').strip() or header[0]
              if id_col not in header:
                  sys.exit(f'op {i}: id column not in header: {id_col}')
              i_id = header.index(id_col)
              row_id = str(op.get('row_id') or '').strip()
              if not row_id:
                  sys.exit(f'op {i}: row_id required')
              mode = str(op.get('mode') or 'update').strip()

              if mode == 'add_column':
                  col = str(op.get('column') or '').strip()
                  if not col:
                      sys.exit(f'op {i}: add_column needs column')
                  if col in header:
                      print(f'column already exists {path} {col}')
                      continue
                  after_col = str(op.get('after_column') or '').strip()
                  if after_col and after_col not in header:
                      sys.exit(f'op {i}: after column not in header: {after_col}')
                  insert_at = header.index(after_col) + 1 if after_col else len(header)
                  old_width = len(header)
                  header.insert(insert_at, col)
                  for row in rows[1:]:
                      while len(row) < old_width:
                          row.append('')
                      row.insert(insert_at, '')
                  changed.add(path)
                  print(f'added column {path} {col}')
                  continue

              if mode == 'remove_column':
                  col = str(op.get('column') or '').strip()
                  if not col:
                      sys.exit(f'op {i}: remove_column needs column')
                  if col not in header:
                      sys.exit(f'op {i}: column not in header: {col}')
                  remove_at = header.index(col)
                  header.pop(remove_at)
                  for row in rows[1:]:
                      if len(row) > remove_at:
                          row.pop(remove_at)
                  changed.add(path)
                  print(f'removed column {path} {col}')
                  continue

              if mode == 'dedupe_by_key':
                  key_col = str(op.get('key_column') or '').strip()
                  if key_col not in header:
                      sys.exit(f'op {i}: key column not in header: {key_col}')
                  i_key = header.index(key_col)
                  kept = [header]
                  seen = set()
                  matched = 0
                  removed = 0
                  for row in rows[1:]:
                      if not row:
                          continue
                      while len(row) < len(header):
                          row.append('')
                      if row[i_id] != row_id:
                          kept.append(row)
                          continue
                      matched += 1
                      key = row[i_key].strip()
                      if not key:
                          sys.exit(f'op {i}: blank {key_col} while deduping {row_id!r}')
                      if key in seen:
                          removed += 1
                          continue
                      seen.add(key)
                      kept.append(row)
                  if matched < 1:
                      sys.exit(f'op {i}: found no rows for {row_id!r}')
                  if removed < 1:
                      sys.exit(f'op {i}: found no duplicate rows for {row_id!r}')
                  files[path] = kept
                  changed.add(path)
                  print(f'deduped {path} {row_id}: kept {len(seen)} unique {key_col} values, removed {removed} duplicates')
                  continue

              if mode == 'fill_blank_where':
                  match_col = str(op.get('match_column') or '').strip()
                  col = str(op.get('column') or '').strip()
                  if match_col not in header:
                      sys.exit(f'op {i}: match column not in header: {match_col}')
                  if col not in header:
                      sys.exit(f'op {i}: column not in header: {col}')
                  match_value = decode(op.get('match_value')).strip()
                  new = decode(op.get('value'))
                  if not match_value:
                      sys.exit(f'op {i}: match_value required')
                  if new == '':
                      sys.exit(f'op {i}: value required')
                  i_match = header.index(match_col)
                  i_col = header.index(col)
                  hits = 0
                  for row in rows[1:]:
                      if not row:
                          continue
                      while len(row) < len(header):
                          row.append('')
                      if row[i_match].strip() == match_value and not row[i_col].strip():
                          row[i_col] = new
                          hits += 1
                  if hits < 1:
                      sys.exit(f'op {i}: found no blank {col} values where {match_col}={match_value!r}')
                  changed.add(path)
                  print(f'filled {hits} blank {col} values in {path} where {match_col}={match_value!r}')
                  continue

              if mode == 'replace_text':
                  col = str(op.get('column') or '').strip()
                  if col not in header:
                      sys.exit(f'op {i}: column not in header: {col}')
                  old = decode(op.get('from'))
                  new = decode(op.get('to'))
                  if not old:
                      sys.exit(f'op {i}: replace_text needs non-empty from')
                  i_col = header.index(col)
                  hits = 0
                  for row in rows[1:]:
                      if not row:
                          continue
                      while len(row) < len(header):
                          row.append('')
                      if old in row[i_col]:
                          row[i_col] = row[i_col].replace(old, new)
                          hits += 1
                  if hits < 1:
                      sys.exit(f'op {i}: replace_text found no matches for {old!r}')
                  changed.add(path)
                  print(f'replaced {old!r} in {hits} rows of {path} column {col}')
                  continue

              if mode == 'delete_where':
                  where = op.get('where')
                  if not isinstance(where, dict) or not where:
                      sys.exit(f'op {i}: delete_where needs where')
                  for col in where:
                      if col not in header:
                          sys.exit(f'op {i}: column not in header: {col}')
                  kept = [header]
                  hits = 0
                  for row in rows[1:]:
                      if not row:
                          continue
                      while len(row) < len(header):
                          row.append('')
                      matched = True
                      for col, val in where.items():
                          if row[header.index(col)] != decode(val):
                              matched = False
                              break
                      if matched:
                          hits += 1
                          continue
                      kept.append(row)
                  if hits < 1:
                      sys.exit(f'op {i}: delete_where found no rows for {where!r}')
                  files[path] = kept
                  changed.add(path)
                  print(f'deleted {hits} rows from {path} where {where}')
                  continue

              if mode == 'delete':
                  kept = [header]
                  hits = 0
                  for row in rows[1:]:
                      if not row:
                          continue
                      if len(row) > i_id and row[i_id] == row_id:
                          hits += 1
                          continue
                      kept.append(row)
                  if hits != 1:
                      sys.exit(f'op {i}: expected 1 row for {row_id!r}, found {hits}')
                  files[path] = kept
                  changed.add(path)
                  print(f'deleted {path} {row_id}')
                  continue

              if mode == 'insert':
                  existing = 0
                  for row in rows[1:]:
                      if row and len(row) > i_id and row[i_id] == row_id:
                          existing += 1
                  allow_duplicate_id = bool(op.get('allow_duplicate_id'))
                  if existing and not allow_duplicate_id:
                      sys.exit(f'op {i}: row already exists: {row_id}')
                  sets = op.get('sets')
                  if not isinstance(sets, dict) or not sets:
                      sys.exit(f'op {i}: insert needs sets')
                  new_row = [''] * len(header)
                  new_row[i_id] = row_id
                  for col, val in sets.items():
                      if col not in header:
                          sys.exit(f'op {i}: column not in header: {col}')
                      new_row[header.index(col)] = decode(val)
                  after = str(op.get('after_row_id') or '').strip()
                  if after:
                      placed = False
                      kept = [header]
                      for row in rows[1:]:
                          kept.append(row)
                          if row and len(row) > i_id and row[i_id] == after:
                              kept.append(new_row)
                              placed = True
                      if not placed:
                          sys.exit(f'op {i}: after_row_id not found: {after}')
                      files[path] = kept
                  else:
                      rows.append(new_row)
                      files[path] = rows
                  changed.add(path)
                  print(f'inserted {path} {row_id}')
                  continue

              if mode != 'update':
                  sys.exit(f'op {i}: unknown mode {mode}')

              sets = op.get('sets')
              if not isinstance(sets, dict) or not sets:
                  sets = {}
                  if op.get('column'):
                      sets[str(op['column'])] = op.get('value', '')
                  if op.get('column_2'):
                      sets[str(op['column_2'])] = op.get('value_2', '')
              if not sets:
                  sys.exit(f'op {i}: update needs sets or column/value')

              hits = 0
              for row in rows[1:]:
                  if not row:
                      continue
                  while len(row) < len(header):
                      row.append('')
                  if row[i_id] != row_id:
                      continue
                  for col, val in sets.items():
                      if col not in header:
                          sys.exit(f'op {i}: column not in header: {col}')
                      row[header.index(col)] = decode(val)
                  hits += 1
              if hits != 1:
                  sys.exit(f'op {i}: expected 1 row for {row_id!r}, found {hits}')
              changed.add(path)
              print(f'updated {path} {row_id} {list(sets)}')

          for path, rows in files.items():
              if path not in changed:
                  continue
              with path.open('w', newline='', encoding='utf-8') as f:
                  csv.writer(f, lineterminator='\n').writerows(rows)
          print('changed', ' '.join(str(p) for p in sorted(changed)))
          PY

      - name: Refresh manifests
        run: python3 scripts/data_schema.py manifest

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- data
          if git diff --cached --quiet; then
            echo "No change"
            exit 0
          fi
          git commit -m "Patch CSV line items"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
