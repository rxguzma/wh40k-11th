name: Patch CSV

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-csv.yml'
  workflow_dispatch:
    inputs:
      patches:
        description: JSON list of operations. One run, one commit.
        required: true
        type: string

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply patches
        env:
          PATCHES: ${{ inputs.patches }}
        run: |
          python3 <<'PY'
          import csv, json, os, sys
          from pathlib import Path

          raw = os.environ.get('PATCHES', '').strip()
          if not raw:
              raw = r'[{"file":"data/marines/Units.csv","id_column":"Unit_ID","row_id":"LIEUTENANT_FIST_PLASMA","mode":"update","sets":{"Unit Name":"Lieutenant","Ability_IDs":"TACTICAL_PRECISION, TARGET_PRIORITY, SUPPORT_LIEUTENANT","Core_Ability_IDs":"","Weapon_IDs":"LIEUTENANT_BOLT_PISTOL, LIEUTENANT_MASTER_CRAFTED_BOLTER, LIEUTENANT_CLOSE_COMBAT_WEAPON","M\"":"6\"","T":"4","SV":"3+","W":"4","LD":"6+","OC":"1","Keywords":"INFANTRY, CHARACTER, GRENADES, IMPERIUM, TACTICUS, LIEUTENANT","Hyperlink":"https://wahapedia.ru/wh40k11ed/factions/space-marines/Lieutenant","Points_Label_1":"","Points_Cost_1":"45"}},{"file":"data/marines/Units.csv","id_column":"Unit_ID","row_id":"LIEUTENANT_SWORD_AND_SHIELD","mode":"update","sets":{"Unit Name":"Lieutenant (Shield)","Ability_IDs":"TACTICAL_PRECISION, TARGET_PRIORITY, STORM_SHIELD, SUPPORT_LIEUTENANT","Core_Ability_IDs":"","Weapon_IDs":"LIEUTENANT_NEO_VOLKITE_PISTOL, LIEUTENANT_MASTER_CRAFTED_POWER_WEAPON","M\"":"6\"","T":"4","SV":"3+ / 4++","W":"4","LD":"6+","OC":"1","Keywords":"INFANTRY, CHARACTER, GRENADES, IMPERIUM, TACTICUS, LIEUTENANT","Hyperlink":"https://wahapedia.ru/wh40k11ed/factions/space-marines/Lieutenant","Points_Label_1":"","Points_Cost_1":"45"}},{"file":"data/marines/Units.csv","id_column":"Unit_ID","row_id":"LIEUTENANT_IN_PHOBOS_ARMOUR","mode":"update","sets":{"Unit Name":"Lieutenant in Phobos Armour","Ability_IDs":"TACTICAL_PRECISION, STRATEGIC_DISPERSAL, SUPPORT_LIEUTENANT_IN_PHOBOS_ARMOUR","Core_Ability_IDs":"DEEP_STRIKE, INFILTRATORS, SCOUTS_6","Weapon_IDs":"LIEUTENANT_PHOBOS_BOLT_PISTOL, LIEUTENANT_PHOBOS_SCOPED_BOLT_CARBINE, LIEUTENANT_PHOBOS_PAIRED_COMBAT_BLADES","M\"":"6\"","T":"4","SV":"3+","W":"4","LD":"6+","OC":"1","Keywords":"INFANTRY, CHARACTER, GRENADES, IMPERIUM, PHOBOS, LIEUTENANT","Hyperlink":"https://wahapedia.ru/wh40k11ed/factions/space-marines/Lieutenant-In-Phobos-Armour","Points_Label_1":"","Points_Cost_1":"45"}},{"file":"data/marines/Units.csv","id_column":"Unit_ID","row_id":"LIEUTENANT_IN_REIVER_ARMOUR","mode":"update","sets":{"Unit Name":"Lieutenant in Reiver Armour","Ability_IDs":"TACTICAL_PRECISION, DEADLY_TERROR, SUPPORT_LIEUTENANT_IN_REIVER_ARMOUR","Core_Ability_IDs":"SCOUTS_6","Weapon_IDs":"MASTER_CRAFTED_SPECIAL_ISSUE_BOLT_PISTOL_REIVER_LT, COMBAT_KNIFE_LIEUTENANT_REIVERS","M\"":"6\"","T":"4","SV":"3+","W":"4","LD":"6+","OC":"1","Keywords":"INFANTRY, CHARACTER, SMOKE, GRENADES, IMPERIUM, PHOBOS, LIEUTENANT, LIEUTENANT IN REIVER ARMOUR","Hyperlink":"https://wahapedia.ru/wh40k11ed/factions/space-marines/Lieutenant-In-Reiver-Armour","Points_Label_1":"","Points_Cost_1":"45"}},{"file":"data/marines/Units.csv","id_column":"Unit_ID","row_id":"LIEUTENANT_WITH_COMBI_WEAPON","mode":"update","sets":{"Unit Name":"Lieutenant with Combi-weapon","Ability_IDs":"PRIORITY_OBJECTIVE_IDENTIFIED, EVADE_AND_SURVIVE","Core_Ability_IDs":"FEEL_NO_PAIN_5, INFILTRATORS, LONE_OPERATIVE, STEALTH","Weapon_IDs":"COMBI_WEAPON_LEADERS, PAIRED_COMBAT_BLADES_LIEUTENANT","M\"":"6\"","T":"4","SV":"3+","W":"4","LD":"6+","OC":"1","Keywords":"INFANTRY, CHARACTER, GRENADES, IMPERIUM, PHOBOS, LIEUTENANT, LIEUTENANT WITH COMBI-WEAPON","Hyperlink":"https://wahapedia.ru/wh40k11ed/factions/space-marines/Lieutenant-with-Combi-weapon","Points_Label_1":"","Points_Cost_1":"95"}},{"file":"data/marines/Abilities.csv","id_column":"Ability_ID","row_id":"SUPPORT_LIEUTENANT","mode":"update","sets":{"Short Description":"SUPPORT: ASSAULT INTERCESSOR SQUAD, BLADEGUARD VETERAN SQUAD, COMPANY HEROES, HELLBLASTER SQUAD, INFERNUS SQUAD, INTERCESSOR SQUAD, STERNGUARD VETERAN SQUAD, TACTICAL SQUAD, VANGUARD VETERAN SQUAD, ASSAULT SQUAD, CRUSADER SQUAD, SWORD BRETHREN SQUAD, INNER CIRCLE COMPANIONS, DEATHWATCH VETERANS, DECIMUS KILL TEAM, FORTIS KILL TEAM, COMMAND SQUAD, SKYCLAWS, WOLF GUARD","Long Description":"SUPPORT: ASSAULT INTERCESSOR SQUAD, BLADEGUARD VETERAN SQUAD, COMPANY HEROES, HELLBLASTER SQUAD, INFERNUS SQUAD, INTERCESSOR SQUAD, STERNGUARD VETERAN SQUAD, TACTICAL SQUAD, VANGUARD VETERAN SQUAD, ASSAULT SQUAD, CRUSADER SQUAD, SWORD BRETHREN SQUAD, INNER CIRCLE COMPANIONS, DEATHWATCH VETERANS, DECIMUS KILL TEAM, FORTIS KILL TEAM, COMMAND SQUAD, SKYCLAWS, WOLF GUARD"}},{"file":"data/marines/Abilities.csv","id_column":"Ability_ID","row_id":"SUPPORT_LIEUTENANT_IN_PHOBOS_ARMOUR","mode":"update","sets":{"Short Description":"SUPPORT: INCURSOR SQUAD, INFILTRATOR SQUAD, REIVER SQUAD, SPECTRUS KILL TEAM, HOUNDS OF MORKAI","Long Description":"SUPPORT: INCURSOR SQUAD, INFILTRATOR SQUAD, REIVER SQUAD, SPECTRUS KILL TEAM, HOUNDS OF MORKAI"}},{"file":"data/marines/Abilities.csv","id_column":"Ability_ID","row_id":"SUPPORT_LIEUTENANT_IN_REIVER_ARMOUR","mode":"update","sets":{"Short Description":"SUPPORT: REIVER SQUAD, HOUNDS OF MORKAI","Long Description":"SUPPORT: REIVER SQUAD, HOUNDS OF MORKAI"}},{"file":"data/marines/Abilities.csv","id_column":"Ability_ID","row_id":"DEADLY_TERROR","mode":"update","sets":{"Short Description":"While Leading: Terror Troops range +3\"","Long Description":"While this model is leading a unit, increase the range of that unit\u2019s Terror Troops ability by 3\"."}},{"file":"data/marines/Abilities.csv","id_column":"Ability_ID","row_id":"EVADE_AND_SURVIVE","mode":"update","sets":{"Short Description":"Enemy ends a move within 8\": Normal move up to 6\".","Long Description":"In your opponent\u2019s Movement phase, if an enemy unit ends a move within 8\" of this unit, if this unit is not within Engagement Range of one or more enemy units, this unit can make a Normal move of up to 6\"."}},{"file":"data/marines/Weapon_Stats.csv","id_column":"Weapon_ID","row_id":"LIEUTENANT_BOLT_PISTOL","mode":"insert","sets":{"Weapon Name":"Bolt pistol","R\"":"12\"","A":"1","WS":"2","St":"4","AP":"0","D":"1","Weapon Abilities":"PISTOL"}},{"file":"data/marines/Weapon_Stats.csv","id_column":"Weapon_ID","row_id":"LIEUTENANT_HEAVY_BOLT_PISTOL","mode":"insert","sets":{"Weapon Name":"Heavy bolt pistol","R\"":"18\"","A":"1","WS":"2","St":"4","AP":"-1","D":"1","Weapon Abilities":"PISTOL"}},{"file":"data/marines/Weapon_Stats.csv","id_column":"Weapon_ID","row_id":"LIEUTENANT_MASTER_CRAFTED_BOLTER","mode":"insert","sets":{"Weapon Name":"Master-crafted bolter","R\"":"24\"","A":"2","WS":"2","St":"4","AP":"-1","D":"2","Weapon Abilities":""}},{"file":"data/marines/Weapon_Stats.csv","id_column":"Weapon_ID","row_id":"LIEUTENANT_PLASMA_PISTOL_STANDARD","mode":"insert","sets":{"Weapon Name":"Plasma pistol \u2013 standard","R\"":"12\"","A":"1","WS":"2","St":"7","AP":"-2","D":"1","Weapon Abilities":"PISTOL"}},{"file":"data/marines/Weapon_Stats.csv","id_column":"Weapon_ID","row_id":"LIEUTENANT_PLASMA_PISTOL_SUPERCHARGE","mode":"insert","sets":{"Weapon Name":"Plasma pistol \u2013 supercharge","R\"":"12\"","A":"1","WS":"2","St":"8","AP":"-3","D":"2","Weapon Abilities":"HAZARDOUS, PISTOL"}},{"file":"data/marines/Weapon_Stats.csv","id_column":"Weapon_ID","row_id":"LIEUTENANT_NEO_VOLKITE_PISTOL","mode":"insert","sets":{"Weapon Name":"Neo-volkite pistol","R\"":"12\"","A":"1","WS":"2","St":"5","AP":"0","D":"2","Weapon Abilities":"DEVASTATING WOUNDS, PISTOL"}},{"file":"data/marines/Weapon_Stats.csv","id_column":"Weapon_ID","row_id":"LIEUTENANT_CLOSE_COMBAT_WEAPON","mode":"insert","sets":{"Weapon Name":"Close combat weapon","R\"":"-","A":"5","WS":"2","St":"4","AP":"0","D":"1","Weapon Abilities":""}},{"file":"data/marines/Weapon_Stats.csv","id_column":"Weapon_ID","row_id":"LIEUTENANT_MASTER_CRAFTED_POWER_WEAPON","mode":"insert","sets":{"Weapon Name":"Master-crafted power weapon","R\"":"-","A":"5","WS":"2","St":"5","AP":"-2","D":"2","Weapon Abilities":""}},{"file":"data/marines/Weapon_Stats.csv","id_column":"Weapon_ID","row_id":"LIEUTENANT_POWER_FIST","mode":"insert","sets":{"Weapon Name":"Power fist","R\"":"-","A":"4","WS":"2","St":"8","AP":"-2","D":"2","Weapon Abilities":""}},{"file":"data/marines/Weapon_Stats.csv","id_column":"Weapon_ID","row_id":"LIEUTENANT_PHOBOS_BOLT_PISTOL","mode":"insert","sets":{"Weapon Name":"Bolt pistol","R\"":"12\"","A":"1","WS":"2","St":"4","AP":"0","D":"1","Weapon Abilities":"PISTOL"}},{"file":"data/marines/Weapon_Stats.csv","id_column":"Weapon_ID","row_id":"LIEUTENANT_PHOBOS_SCOPED_BOLT_CARBINE","mode":"insert","sets":{"Weapon Name":"Master-crafted scoped bolt carbine","R\"":"24\"","A":"2","WS":"2","St":"4","AP":"0","D":"2","Weapon Abilities":""}},{"file":"data/marines/Weapon_Stats.csv","id_column":"Weapon_ID","row_id":"LIEUTENANT_PHOBOS_PAIRED_COMBAT_BLADES","mode":"insert","sets":{"Weapon Name":"Paired combat blades","R\"":"-","A":"5","WS":"2","St":"4","AP":"-1","D":"1","Weapon Abilities":"SUSTAINED HITS 1"}},{"file":"data/marines/Unit_Weapon_Options.csv","id_column":"Option_ID","row_id":"LT_PISTOL_BOLT","mode":"insert","sets":{"Unit_ID":"LIEUTENANT_FIST_PLASMA","Option_Group_ID":"LT_PISTOL","Group_Label":"Pistol","Option_Name":"Bolt Pistol","Weapon_IDs":"LIEUTENANT_BOLT_PISTOL","Default":"TRUE","Sort_Order":"1"}},{"file":"data/marines/Unit_Weapon_Options.csv","id_column":"Option_ID","row_id":"LT_PISTOL_HEAVY","mode":"insert","sets":{"Unit_ID":"LIEUTENANT_FIST_PLASMA","Option_Group_ID":"LT_PISTOL","Group_Label":"Pistol","Option_Name":"Heavy Bolt Pistol","Weapon_IDs":"LIEUTENANT_HEAVY_BOLT_PISTOL","Default":"FALSE","Sort_Order":"2"}},{"file":"data/marines/Unit_Weapon_Options.csv","id_column":"Option_ID","row_id":"LT_SLOT2_BOLTER","mode":"insert","sets":{"Unit_ID":"LIEUTENANT_FIST_PLASMA","Option_Group_ID":"LT_BOLTER_SLOT","Group_Label":"Master-crafted Bolter Slot","Option_Name":"Master-crafted Bolter","Weapon_IDs":"LIEUTENANT_MASTER_CRAFTED_BOLTER","Default":"TRUE","Sort_Order":"1"}},{"file":"data/marines/Unit_Weapon_Options.csv","id_column":"Option_ID","row_id":"LT_SLOT2_PLASMA","mode":"insert","sets":{"Unit_ID":"LIEUTENANT_FIST_PLASMA","Option_Group_ID":"LT_BOLTER_SLOT","Group_Label":"Master-crafted Bolter Slot","Option_Name":"Plasma Pistol","Weapon_IDs":"LIEUTENANT_PLASMA_PISTOL_STANDARD, LIEUTENANT_PLASMA_PISTOL_SUPERCHARGE","Default":"FALSE","Sort_Order":"2"}},{"file":"data/marines/Unit_Weapon_Options.csv","id_column":"Option_ID","row_id":"LT_SLOT2_POWER","mode":"insert","sets":{"Unit_ID":"LIEUTENANT_FIST_PLASMA","Option_Group_ID":"LT_BOLTER_SLOT","Group_Label":"Master-crafted Bolter Slot","Option_Name":"Master-crafted Power Weapon","Weapon_IDs":"LIEUTENANT_MASTER_CRAFTED_POWER_WEAPON","Default":"FALSE","Sort_Order":"3"}},{"file":"data/marines/Unit_Weapon_Options.csv","id_column":"Option_ID","row_id":"LT_SLOT2_FIST","mode":"insert","sets":{"Unit_ID":"LIEUTENANT_FIST_PLASMA","Option_Group_ID":"LT_BOLTER_SLOT","Group_Label":"Master-crafted Bolter Slot","Option_Name":"Power Fist","Weapon_IDs":"LIEUTENANT_POWER_FIST","Default":"FALSE","Sort_Order":"4"}},{"file":"data/marines/Unit_Weapon_Options.csv","id_column":"Option_ID","row_id":"LT_MELEE_CCW","mode":"insert","sets":{"Unit_ID":"LIEUTENANT_FIST_PLASMA","Option_Group_ID":"LT_MELEE_SLOT","Group_Label":"Close Combat Weapon Slot","Option_Name":"Close Combat Weapon","Weapon_IDs":"LIEUTENANT_CLOSE_COMBAT_WEAPON","Default":"TRUE","Sort_Order":"1"}},{"file":"data/marines/Unit_Weapon_Options.csv","id_column":"Option_ID","row_id":"LT_MELEE_POWER","mode":"insert","sets":{"Unit_ID":"LIEUTENANT_FIST_PLASMA","Option_Group_ID":"LT_MELEE_SLOT","Group_Label":"Close Combat Weapon Slot","Option_Name":"Master-crafted Power Weapon","Weapon_IDs":"LIEUTENANT_MASTER_CRAFTED_POWER_WEAPON","Default":"FALSE","Sort_Order":"2"}},{"file":"data/marines/Unit_Weapon_Options.csv","id_column":"Option_ID","row_id":"LT_MELEE_FIST","mode":"insert","sets":{"Unit_ID":"LIEUTENANT_FIST_PLASMA","Option_Group_ID":"LT_MELEE_SLOT","Group_Label":"Close Combat Weapon Slot","Option_Name":"Power Fist","Weapon_IDs":"LIEUTENANT_POWER_FIST","Default":"FALSE","Sort_Order":"3"}},{"file":"data/marines/Unit_Weapon_Options.csv","id_column":"Option_ID","row_id":"LT_SHIELD_LOADOUT","mode":"insert","sets":{"Unit_ID":"LIEUTENANT_SWORD_AND_SHIELD","Option_Group_ID":"LT_SHIELD_LOADOUT","Group_Label":"Shield Loadout","Option_Name":"Neo-volkite Pistol + Master-crafted Power Weapon","Weapon_IDs":"LIEUTENANT_NEO_VOLKITE_PISTOL, LIEUTENANT_MASTER_CRAFTED_POWER_WEAPON","Default":"TRUE","Sort_Order":"1"}}]'
          try:
              ops = json.loads(raw)
          except json.JSONDecodeError as e:
              sys.exit(f'patches is not JSON: {e}')
          if not isinstance(ops, list) or not ops:
              sys.exit('patches must be a non-empty JSON list')

          def decode(val):
              if val is None:
                  return ''
              s = str(val)
              return s.replace('\\n', '\n')

          def load_csv(path):
              if path.is_absolute() or '..' in path.parts:
                  sys.exit(f'bad path {path}')
              if not str(path).startswith('data/') or path.suffix.lower() != '.csv':
                  sys.exit(f'file must be a .csv under data/: {path}')
              if not path.is_file():
                  sys.exit(f'missing {path}')
              with path.open(encoding='utf-8', newline='') as f:
                  rows = list(csv.reader(f))
              if not rows:
                  sys.exit(f'empty csv {path}')
              return rows

          files = {}
          changed = set()

          for i, op in enumerate(ops):
              if not isinstance(op, dict):
                  sys.exit(f'op {i} is not an object')
              path = Path(str(op.get('file', '')).strip())
              if path not in files:
                  files[path] = load_csv(path)
              rows = files[path]
              header = rows[0]
              id_col = str(op.get('id_column') or '').strip() or header[0]
              if id_col not in header:
                  sys.exit(f'op {i}: id column not in header: {id_col}')
              i_id = header.index(id_col)
              row_id = str(op.get('row_id') or '').strip()
              if not row_id:
                  sys.exit(f'op {i}: row_id required')
              mode = str(op.get('mode') or 'update').strip()

              if mode == 'fill_blank_where':
                  match_col = str(op.get('match_column') or '').strip()
                  col = str(op.get('column') or '').strip()
                  if match_col not in header:
                      sys.exit(f'op {i}: match column not in header: {match_col}')
                  if col not in header:
                      sys.exit(f'op {i}: column not in header: {col}')
                  match_value = decode(op.get('match_value')).strip()
                  new = decode(op.get('value'))
                  if not match_value:
                      sys.exit(f'op {i}: match_value required')
                  if new == '':
                      sys.exit(f'op {i}: value required')
                  i_match = header.index(match_col)
                  i_col = header.index(col)
                  hits = 0
                  for row in rows[1:]:
                      if not row:
                          continue
                      while len(row) < len(header):
                          row.append('')
                      if row[i_match].strip() == match_value and not row[i_col].strip():
                          row[i_col] = new
                          hits += 1
                  if hits < 1:
                      sys.exit(f'op {i}: found no blank {col} values where {match_col}={match_value!r}')
                  changed.add(path)
                  print(f'filled {hits} blank {col} values in {path} where {match_col}={match_value!r}')
                  continue

              if mode == 'replace_text':
                  col = str(op.get('column') or '').strip()
                  if col not in header:
                      sys.exit(f'op {i}: column not in header: {col}')
                  old = decode(op.get('from'))
                  new = decode(op.get('to'))
                  if not old:
                      sys.exit(f'op {i}: replace_text needs non-empty from')
                  i_col = header.index(col)
                  hits = 0
                  for row in rows[1:]:
                      if not row:
                          continue
                      while len(row) < len(header):
                          row.append('')
                      if old in row[i_col]:
                          row[i_col] = row[i_col].replace(old, new)
                          hits += 1
                  if hits < 1:
                      sys.exit(f'op {i}: replace_text found no matches for {old!r}')
                  changed.add(path)
                  print(f'replaced {old!r} in {hits} rows of {path} column {col}')
                  continue

              if mode == 'delete':
                  kept = [header]
                  hits = 0
                  for row in rows[1:]:
                      if not row:
                          continue
                      if len(row) > i_id and row[i_id] == row_id:
                          hits += 1
                          continue
                      kept.append(row)
                  if hits != 1:
                      sys.exit(f'op {i}: expected 1 row for {row_id!r}, found {hits}')
                  files[path] = kept
                  changed.add(path)
                  print(f'deleted {path} {row_id}')
                  continue

              if mode == 'insert':
                  existing = 0
                  for row in rows[1:]:
                      if row and len(row) > i_id and row[i_id] == row_id:
                          existing += 1
                  if existing:
                      sys.exit(f'op {i}: row already exists: {row_id}')
                  sets = op.get('sets')
                  if not isinstance(sets, dict) or not sets:
                      sys.exit(f'op {i}: insert needs sets')
                  new_row = [''] * len(header)
                  new_row[i_id] = row_id
                  for col, val in sets.items():
                      if col not in header:
                          sys.exit(f'op {i}: column not in header: {col}')
                      new_row[header.index(col)] = decode(val)
                  after = str(op.get('after_row_id') or '').strip()
                  if after:
                      placed = False
                      kept = [header]
                      for row in rows[1:]:
                          kept.append(row)
                          if row and len(row) > i_id and row[i_id] == after:
                              kept.append(new_row)
                              placed = True
                      if not placed:
                          sys.exit(f'op {i}: after_row_id not found: {after}')
                      files[path] = kept
                  else:
                      rows.append(new_row)
                      files[path] = rows
                  changed.add(path)
                  print(f'inserted {path} {row_id}')
                  continue

              if mode != 'update':
                  sys.exit(f'op {i}: unknown mode {mode}')

              sets = op.get('sets')
              if not isinstance(sets, dict) or not sets:
                  sets = {}
                  if op.get('column'):
                      sets[str(op['column'])] = op.get('value', '')
                  if op.get('column_2'):
                      sets[str(op['column_2'])] = op.get('value_2', '')
              if not sets:
                  sys.exit(f'op {i}: update needs sets or column/value')

              hits = 0
              for row in rows[1:]:
                  if not row:
                      continue
                  while len(row) < len(header):
                      row.append('')
                  if row[i_id] != row_id:
                      continue
                  for col, val in sets.items():
                      if col not in header:
                          sys.exit(f'op {i}: column not in header: {col}')
                      row[header.index(col)] = decode(val)
                  hits += 1
              if hits != 1:
                  sys.exit(f'op {i}: expected 1 row for {row_id!r}, found {hits}')
              changed.add(path)
              print(f'updated {path} {row_id} {list(sets)}')

          for path, rows in files.items():
              if path not in changed:
                  continue
              with path.open('w', newline='', encoding='utf-8') as f:
                  csv.writer(f, lineterminator='\n').writerows(rows)
          print('changed', ' '.join(str(p) for p in sorted(changed)))
          PY

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- data
          if git diff --cached --quiet; then
            echo "No change"
            exit 0
          fi
          git commit -m "Patch CSV line items"
          git push
