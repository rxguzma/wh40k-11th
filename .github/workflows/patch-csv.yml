name: Patch CSV

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-csv.yml'
  workflow_dispatch:
    inputs:
      patches:
        description: JSON list of operations. One run, one commit.
        required: true
        type: string

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply patches
        env:
          PATCHES: ${{ inputs.patches }}
        run: |
          python3 <<'PY'
          import csv, json, os, sys
          from pathlib import Path

          raw = os.environ.get('PATCHES', '').strip()
          if not raw:
              raw = '[{"file":"data/marines/Detachments.csv","id_column":"Item_ID","row_id":"space_marines_ironstorm_spearhead_stratagem_unbowed_conviction_1cp","mode":"insert","sets":{"Detachment_ID":"space_marines_ironstorm_spearhead","Army_Name":"","Detachment_Name":"Ironstorm Spearhead","Item_Type":"STRATAGEM","Item_Name":"Unbowed Conviction","CP_Cost":"1","Short_Description":"Command: below Starting Strength; ignore characteristic, roll, and test modifiers except saving throws until end of turn.","Long_Description":"WHEN: Command phase. TARGET: One ADEPTUS ASTARTES unit below Starting Strength. EFFECT: Until end of turn, that unit can ignore modifiers to its characteristics and to rolls or tests made for it, except modifiers to saving throws."},"after_row_id":"space_marines_ironstorm_spearhead_enhancement_master_of_machine_war"},{"file":"data/marines/Detachments.csv","id_column":"Item_ID","row_id":"space_marines_ironstorm_spearhead_stratagem_armour_of_contempt_1cp","mode":"insert","sets":{"Detachment_ID":"space_marines_ironstorm_spearhead","Army_Name":"","Detachment_Name":"Ironstorm Spearhead","Item_Type":"STRATAGEM","Item_Name":"Armour of Contempt","CP_Cost":"1","Short_Description":"Opponent Shooting/Fight: targeted ADEPTUS ASTARTES unit worsens incoming AP by 1.","Long_Description":"WHEN: Opponent Shooting phase or Fight phase, after an enemy unit selects targets. TARGET: One ADEPTUS ASTARTES unit selected as a target. EFFECT: Until that attacking unit finishes its attacks, worsen the AP of attacks targeting your unit by 1."},"after_row_id":"space_marines_ironstorm_spearhead_stratagem_unbowed_conviction_1cp"},{"file":"data/marines/Detachments.csv","id_column":"Item_ID","row_id":"space_marines_ironstorm_spearhead_stratagem_mercy_is_weakness_2cp","mode":"insert","sets":{"Detachment_ID":"space_marines_ironstorm_spearhead","Army_Name":"","Detachment_Name":"Ironstorm Spearhead","Item_Type":"STRATAGEM","Item_Name":"Mercy is Weakness","CP_Cost":"2","Short_Description":"Shooting/Fight: vs below Starting Strength gain [SUSTAINED HITS 1]; VEHICLE Critical Hits on unmodified 5+.","Long_Description":"WHEN: Your Shooting phase or Fight phase. TARGET: One ADEPTUS ASTARTES unit that has not shot or fought this phase. EFFECT: Against targets below Starting Strength, attacks gain [SUSTAINED HITS 1]; VEHICLE attacks also score Critical Hits on successful unmodified Hit rolls of 5+."},"after_row_id":"space_marines_ironstorm_spearhead_stratagem_armour_of_contempt_1cp"},{"file":"data/marines/Detachments.csv","id_column":"Item_ID","row_id":"space_marines_ironstorm_spearhead_stratagem_vengeful_animus_1cp","mode":"insert","sets":{"Detachment_ID":"space_marines_ironstorm_spearhead","Army_Name":"","Detachment_Name":"Ironstorm Spearhead","Item_Type":"STRATAGEM","Item_Name":"Vengeful Animus","CP_Cost":"1","Short_Description":"Destroyed VEHICLE with Deadly Demise: automatically inflict its Deadly Demise mortal wounds.","Long_Description":"WHEN: Any phase, just after an ADEPTUS ASTARTES VEHICLE with Deadly Demise is destroyed. TARGET: That destroyed model. EFFECT: Do not roll to see whether Deadly Demise triggers; its mortal wounds are inflicted automatically."},"after_row_id":"space_marines_ironstorm_spearhead_stratagem_mercy_is_weakness_2cp"},{"file":"data/marines/Detachments.csv","id_column":"Item_ID","row_id":"space_marines_ironstorm_spearhead_stratagem_ancient_fury_1cp","mode":"insert","sets":{"Detachment_ID":"space_marines_ironstorm_spearhead","Army_Name":"","Detachment_Name":"Ironstorm Spearhead","Item_Type":"STRATAGEM","Item_Name":"Ancient Fury","CP_Cost":"1","Short_Description":"Command: WALKER gets +1 Move, Toughness, Leadership, OC and +1 to Hit until next Command.","Long_Description":"WHEN: Your Command phase. TARGET: One ADEPTUS ASTARTES WALKER model. EFFECT: Until your next Command phase, improve Move, Toughness, Leadership and Objective Control by 1, and add 1 to Hit rolls for its attacks."},"after_row_id":"space_marines_ironstorm_spearhead_stratagem_vengeful_animus_1cp"},{"file":"data/marines/Detachments.csv","id_column":"Item_ID","row_id":"space_marines_ironstorm_spearhead_stratagem_power_of_the_machine_spirit_1cp","mode":"insert","sets":{"Detachment_ID":"space_marines_ironstorm_spearhead","Army_Name":"","Detachment_Name":"Ironstorm Spearhead","Item_Type":"STRATAGEM","Item_Name":"Power of the Machine Spirit","CP_Cost":"1","Short_Description":"Opponent Shooting: VEHICLE reduced below Half-strength can shoot back only at the attacker.","Long_Description":"WHEN: Opponent Shooting phase, after an enemy unit resolves its attacks. TARGET: One ADEPTUS ASTARTES VEHICLE unit reduced to Below Half-strength by those attacks. EFFECT: That unit can shoot as if it were your Shooting phase, but only at that enemy unit and only if it is an eligible target."},"after_row_id":"space_marines_ironstorm_spearhead_stratagem_ancient_fury_1cp"}]'
          try:
              ops = json.loads(raw)
          except json.JSONDecodeError as e:
              sys.exit(f'patches is not JSON: {e}')
          if not isinstance(ops, list) or not ops:
              sys.exit('patches must be a non-empty JSON list')

          def decode(val):
              if val is None:
                  return ''
              s = str(val)
              return s.replace('\\n', '\n')

          def load_csv(path):
              if path.is_absolute() or '..' in path.parts:
                  sys.exit(f'bad path {path}')
              if not str(path).startswith('data/') or path.suffix.lower() != '.csv':
                  sys.exit(f'file must be a .csv under data/: {path}')
              if not path.is_file():
                  sys.exit(f'missing {path}')
              with path.open(encoding='utf-8', newline='') as f:
                  rows = list(csv.reader(f))
              if not rows:
                  sys.exit(f'empty csv {path}')
              return rows

          files = {}
          changed = set()

          for i, op in enumerate(ops):
              if not isinstance(op, dict):
                  sys.exit(f'op {i} is not an object')
              path = Path(str(op.get('file', '')).strip())
              if path not in files:
                  files[path] = load_csv(path)
              rows = files[path]
              header = rows[0]
              id_col = str(op.get('id_column') or '').strip() or header[0]
              if id_col not in header:
                  sys.exit(f'op {i}: id column not in header: {id_col}')
              i_id = header.index(id_col)
              row_id = str(op.get('row_id') or '').strip()
              if not row_id:
                  sys.exit(f'op {i}: row_id required')
              mode = str(op.get('mode') or 'update').strip()

              if mode == 'replace_text':
                  col = str(op.get('column') or '').strip()
                  if col not in header:
                      sys.exit(f'op {i}: column not in header: {col}')
                  old = decode(op.get('from'))
                  new = decode(op.get('to'))
                  if not old:
                      sys.exit(f'op {i}: replace_text needs non-empty from')
                  i_col = header.index(col)
                  hits = 0
                  for row in rows[1:]:
                      if not row:
                          continue
                      while len(row) < len(header):
                          row.append('')
                      if old in row[i_col]:
                          row[i_col] = row[i_col].replace(old, new)
                          hits += 1
                  if hits < 1:
                      sys.exit(f'op {i}: replace_text found no matches for {old!r}')
                  changed.add(path)
                  print(f'replaced {old!r} in {hits} rows of {path} column {col}')
                  continue

              if mode == 'delete':
                  kept = [header]
                  hits = 0
                  for row in rows[1:]:
                      if not row:
                          continue
                      if len(row) > i_id and row[i_id] == row_id:
                          hits += 1
                          continue
                      kept.append(row)
                  if hits != 1:
                      sys.exit(f'op {i}: expected 1 row for {row_id!r}, found {hits}')
                  files[path] = kept
                  changed.add(path)
                  print(f'deleted {path} {row_id}')
                  continue

              if mode == 'insert':
                  existing = 0
                  for row in rows[1:]:
                      if row and len(row) > i_id and row[i_id] == row_id:
                          existing += 1
                  if existing:
                      sys.exit(f'op {i}: row already exists: {row_id}')
                  sets = op.get('sets')
                  if not isinstance(sets, dict) or not sets:
                      sys.exit(f'op {i}: insert needs sets')
                  new_row = [''] * len(header)
                  new_row[i_id] = row_id
                  for col, val in sets.items():
                      if col not in header:
                          sys.exit(f'op {i}: column not in header: {col}')
                      new_row[header.index(col)] = decode(val)
                  after = str(op.get('after_row_id') or '').strip()
                  if after:
                      placed = False
                      kept = [header]
                      for row in rows[1:]:
                          kept.append(row)
                          if row and len(row) > i_id and row[i_id] == after:
                              kept.append(new_row)
                              placed = True
                      if not placed:
                          sys.exit(f'op {i}: after_row_id not found: {after}')
                      files[path] = kept
                  else:
                      rows.append(new_row)
                      files[path] = rows
                  changed.add(path)
                  print(f'inserted {path} {row_id}')
                  continue

              if mode != 'update':
                  sys.exit(f'op {i}: unknown mode {mode}')

              sets = op.get('sets')
              if not isinstance(sets, dict) or not sets:
                  sets = {}
                  if op.get('column'):
                      sets[str(op['column'])] = op.get('value', '')
                  if op.get('column_2'):
                      sets[str(op['column_2'])] = op.get('value_2', '')
              if not sets:
                  sys.exit(f'op {i}: update needs sets or column/value')

              hits = 0
              for row in rows[1:]:
                  if not row:
                      continue
                  while len(row) < len(header):
                      row.append('')
                  if row[i_id] != row_id:
                      continue
                  for col, val in sets.items():
                      if col not in header:
                          sys.exit(f'op {i}: column not in header: {col}')
                      row[header.index(col)] = decode(val)
                  hits += 1
              if hits != 1:
                  sys.exit(f'op {i}: expected 1 row for {row_id!r}, found {hits}')
              changed.add(path)
              print(f'updated {path} {row_id} {list(sets)}')

          for path, rows in files.items():
              if path not in changed:
                  continue
              with path.open('w', newline='', encoding='utf-8') as f:
                  csv.writer(f, lineterminator='\n').writerows(rows)
          print('changed', ' '.join(str(p) for p in sorted(changed)))
          PY

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- data
          if git diff --cached --quiet; then
            echo "No change"
            exit 0
          fi
          git commit -m "Patch CSV line items"
          git push
