name: Patch CSV

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-csv.yml'
  workflow_dispatch:
    inputs:
      patches:
        description: JSON list of operations. One run, one commit.
        required: true
        type: string

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply patches
        env:
          PATCHES: ${{ inputs.patches || '[{"file":"data/marines/Unit_Profiles.csv","id_column":"Unit_ID","row_id":"REDEMPTOR_PLASMA","mode":"update","sets":{"Unit Name":"Redemptor Dreadnought","M\"":"8\"","T":"10","SV":"2+","W":"12","LD":"6+","OC":"4","Keywords":"VEHICLE, DREADNOUGHT, IMPERIUM, WALKER"}},{"file":"data/marines/Unit_Profiles.csv","id_column":"Unit_ID","row_id":"BALLISTUS","mode":"update","sets":{"Unit Name":"Ballistus Dreadnought","M\"":"8\"","T":"10","SV":"2+","W":"12","LD":"6+","OC":"4","Keywords":"VEHICLE, DREADNOUGHT, IMPERIUM, WALKER"}},{"file":"data/marines/Unit_Profiles.csv","id_column":"Unit_ID","row_id":"BRUTALIS","mode":"update","sets":{"Unit Name":"Brutalis Dreadnought","M\"":"10\"","T":"10","SV":"2+","W":"12","LD":"6+","OC":"4","Keywords":"VEHICLE, DREADNOUGHT, IMPERIUM, WALKER"}},{"file":"data/marines/Unit_Profiles.csv","id_column":"Unit_ID","row_id":"INVICTOR_TACTICAL_WARSUIT","mode":"update","sets":{"Unit Name":"Invictor Tactical Warsuit","M\"":"10\"","T":"9","SV":"3+","W":"12","LD":"6+","OC":"4","Keywords":"VEHICLE, IMPERIUM, PHOBOS, WALKER"}},{"file":"data/marines/Unit_Profiles.csv","id_column":"Unit_ID","row_id":"STORM_SPEEDER_HAILSTRIKE","mode":"update","sets":{"Unit Name":"Storm Speeder Hailstrike","M\"":"14\"","T":"9","SV":"3+","W":"11","LD":"6+","OC":"3","Keywords":"VEHICLE, FLY, FRAME, IMPERIUM, SPEEDER"}},{"file":"data/marines/Unit_Profiles.csv","id_column":"Unit_ID","row_id":"STORM_SPEEDER_HAMMERSTRIKE","mode":"update","sets":{"Unit Name":"Storm Speeder Hammerstrike","M\"":"14\"","T":"9","SV":"3+","W":"11","LD":"6+","OC":"3","Keywords":"VEHICLE, FLY, FRAME, IMPERIUM, SPEEDER"}},{"file":"data/marines/Unit_Profiles.csv","id_column":"Unit_ID","row_id":"STORM_SPEEDER_THUNDERSTRIKE","mode":"update","sets":{"Unit Name":"Storm Speeder Thunderstrike","M\"":"14\"","T":"9","SV":"3+","W":"11","LD":"6+","OC":"3","Keywords":"VEHICLE, FLY, FRAME, IMPERIUM, SPEEDER"}},{"file":"data/marines/Unit_Points.csv","id_column":"Unit_ID","row_id":"REDEMPTOR_PLASMA","mode":"update","sets":{"Cost":"0"}},{"file":"data/marines/Unit_Points.csv","id_column":"Unit_ID","row_id":"BALLISTUS","mode":"update","sets":{"Cost":"0"}},{"file":"data/marines/Unit_Points.csv","id_column":"Unit_ID","row_id":"BRUTALIS","mode":"update","sets":{"Cost":"0"}},{"file":"data/marines/Unit_Points.csv","id_column":"Unit_ID","row_id":"INVICTOR_TACTICAL_WARSUIT","mode":"update","sets":{"Cost":"0"}},{"file":"data/marines/Unit_Points.csv","id_column":"Unit_ID","row_id":"STORM_SPEEDER_HAILSTRIKE","mode":"update","sets":{"Cost":"0"}},{"file":"data/marines/Unit_Points.csv","id_column":"Unit_ID","row_id":"STORM_SPEEDER_HAMMERSTRIKE","mode":"update","sets":{"Cost":"0"}},{"file":"data/marines/Unit_Points.csv","id_column":"Unit_ID","row_id":"STORM_SPEEDER_THUNDERSTRIKE","mode":"update","sets":{"Cost":"0"}},{"file":"data/marines/Abilities.csv","id_column":"Ability_ID","row_id":"DUTY_ETERNAL","mode":"update","sets":{"Ability Name":"Duty Eternal","Short_Description":"Attacks vs UNIT with S greater than T — -1 to Wound rolls.","Long_Description":"Attacks that target this unit with a Strength greater than this unit’s Toughness have -1 to wound rolls.","Tags":"","Tag Categories":"","Visibility_ID":"2","Default_Active":""}},{"file":"data/marines/Abilities.csv","id_column":"Ability_ID","row_id":"BALLISTUS_STRIKE","mode":"update","sets":{"Ability Name":"Ballistus Strike","Short_Description":"RANGE vs enemy within 24\" — [SUSTAINED HITS 1].","Long_Description":"This unit’s ranged attacks that target an enemy unit within 24\" of this unit have [SUSTAINED HITS 1].","Tags":"[SHOOT] [WEAPONS] [ACTIVE] [SUSTAINED HITS 1]","Tag Categories":"","Visibility_ID":"2","Default_Active":""}},{"file":"data/marines/Abilities.csv","id_column":"Ability_ID","row_id":"BRUTALIS_CHARGE","mode":"update","sets":{"Ability Name":"Brutalis Charge","Short_Description":"Once per phase — Crushing Impact can target UNIT regardless of other uses; that use costs -1 CP and does not block other uses.","Long_Description":"Once per phase, per unit — You can target this unit with the Crushing Impact stratagem, regardless of any other uses of that stratagem this phase. If you do, that use is -1 CP. That use does not prevent any uses of that stratagem on other units this phase.","Tags":"","Tag Categories":"","Visibility_ID":"2","Default_Active":""}},{"file":"data/marines/Abilities.csv","id_column":"Ability_ID","row_id":"FORWARD_ASSAULT_WARSUIT","mode":"insert","sets":{"Ability Name":"Forward Assault Warsuit","Short_Description":"BATTLE start — mark enemy; attacks vs mark [RE-ROLL 1S TO WOUND]; when mark destroyed, select new enemy.","Long_Description":"At the start of the first battle round, you can select one enemy unit to be this unit’s mark. This unit’s attacks that target this unit’s mark can re-roll wound rolls of 1. Each time this unit’s mark is destroyed, select one enemy unit to be this unit’s mark.","Tags":"[SHOOT] [MELEE] [WEAPONS] [ACTIVE] [RE-ROLL 1S TO WOUND]","Tag Categories":"","Visibility_ID":"2","Default_Active":""}},{"file":"data/marines/Unit_Abilities.csv","id_column":"Unit_ID","row_id":"*","mode":"delete_where","where":{"Unit_ID":"INVICTOR_TACTICAL_WARSUIT","Ability_ID":"COMBAT_SUPPORT"}},{"file":"data/marines/Unit_Abilities.csv","id_column":"Unit_ID","row_id":"INVICTOR_TACTICAL_WARSUIT","mode":"insert","allow_duplicate_id":true,"sets":{"Ability_ID":"FORWARD_ASSAULT_WARSUIT","Ability_Type":"ABILITY"}},{"file":"data/marines/Abilities.csv","id_column":"Ability_ID","row_id":"HAILSTRIKE","mode":"update","sets":{"Ability Name":"Hailstrike","Short_Description":"SHOOTING — after UNIT shoots, select enemy hit; friendly ADEPTUS ASTARTES RANGE attacks vs it have [IGNORES COVER].","Long_Description":"In your Shooting phase, when this unit has shot, select one enemy unit hit by those attacks. Friendly ADEPTUS ASTARTES units’ ranged attacks that target that enemy unit have [IGNORES COVER].","Tags":"[SHOOT] [ACTIVE]","Tag Categories":"","Visibility_ID":"2","Default_Active":""}},{"file":"data/marines/Abilities.csv","id_column":"Ability_ID","row_id":"HAMMERSTRIKE","mode":"update","sets":{"Ability Name":"Hammerstrike","Short_Description":"RANGE vs enemy within terrain area — [SUSTAINED HITS 1].","Long_Description":"This unit’s ranged attacks that target an enemy unit within a terrain area have [SUSTAINED HITS 1].","Tags":"[SHOOT] [WEAPONS] [ACTIVE] [SUSTAINED HITS 1]","Tag Categories":"","Visibility_ID":"2","Default_Active":""}},{"file":"data/marines/Abilities.csv","id_column":"Ability_ID","row_id":"THUNDERSTRIKE","mode":"update","sets":{"Ability Name":"Thunderstrike","Short_Description":"RANGE vs MONSTER/VEHICLE — [+1 TO WOUND].","Long_Description":"This unit’s ranged attacks that target a MONSTER or VEHICLE unit have +1 to wound rolls.","Tags":"[SHOOT] [WEAPONS] [ACTIVE] [+1 TO WOUND]","Tag Categories":"","Visibility_ID":"2","Default_Active":""}},{"file":"data/marines/Abilities.csv","id_column":"Ability_ID","row_id":"SHATTERED_DEFENCES","mode":"insert","sets":{"Ability Name":"Shattered Defences","Short_Description":"SHOOTING — after UNIT shoots, select MONSTER/VEHICLE hit; friendly ADEPTUS ASTARTES RANGE attacks vs it have +1 AP.","Long_Description":"In your Shooting phase, when this unit has shot, select one enemy MONSTER or VEHICLE unit hit by those attacks. Friendly ADEPTUS ASTARTES units’ ranged attacks that target that enemy unit have +1 AP.","Tags":"[SHOOT] [ACTIVE]","Tag Categories":"","Visibility_ID":"2","Default_Active":""}},{"file":"data/marines/Unit_Abilities.csv","id_column":"Unit_ID","row_id":"STORM_SPEEDER_THUNDERSTRIKE","mode":"insert","allow_duplicate_id":true,"sets":{"Ability_ID":"SHATTERED_DEFENCES","Ability_Type":"ABILITY"}},{"file":"data/marines/Loadout_Abilities.csv","id_column":"Loadout_Option_ID","row_id":"*","mode":"delete_where","where":{"Loadout_Option_ID":"REDEMPTOR_PLASMA__REDEMPTOR_MAIN_GUN__REDEMPTOR_MACRO_PLASMA","Ability_ID":"REDEMPTOR_MACRO_PLASMA_POINTS"}}]' }}
        run: |
          python3 <<'PY'
          import csv, json, os, sys
          from pathlib import Path

          raw = os.environ.get('PATCHES') or ''
          if not raw.strip():
              print('no PATCHES input; skip apply')
              raise SystemExit(0)
          try:
              ops = json.loads(raw)
          except json.JSONDecodeError as e:
              sys.exit(f'patches is not JSON: {e}')
          if not isinstance(ops, list) or not ops:
              sys.exit('patches must be a non-empty JSON list')

          def decode(val):
              if val is None:
                  return ''
              s = str(val)
              return s.replace('\\n', '\n')

          def load_csv(path):
              if path.is_absolute() or '..' in path.parts:
                  sys.exit(f'bad path {path}')
              if not str(path).startswith('data/') or path.suffix.lower() != '.csv':
                  sys.exit(f'file must be a .csv under data/: {path}')
              if not path.is_file():
                  sys.exit(f'missing {path}')
              with path.open(encoding='utf-8', newline='') as f:
                  rows = list(csv.reader(f))
              if not rows:
                  sys.exit(f'empty csv {path}')
              return rows

          files = {}
          changed = set()

          for i, op in enumerate(ops):
              if not isinstance(op, dict):
                  sys.exit(f'op {i} is not an object')
              path = Path(str(op.get('file', '')).strip())
              if path not in files:
                  files[path] = load_csv(path)
              rows = files[path]
              header = rows[0]
              id_col = str(op.get('id_column') or '').strip() or header[0]
              if id_col not in header:
                  sys.exit(f'op {i}: id column not in header: {id_col}')
              i_id = header.index(id_col)
              row_id = str(op.get('row_id') or '').strip()
              if not row_id:
                  sys.exit(f'op {i}: row_id required')
              mode = str(op.get('mode') or 'update').strip()

              if mode == 'add_column':
                  col = str(op.get('column') or '').strip()
                  if not col:
                      sys.exit(f'op {i}: add_column needs column')
                  if col in header:
                      print(f'column already exists {path} {col}')
                      continue
                  after_col = str(op.get('after_column') or '').strip()
                  if after_col and after_col not in header:
                      sys.exit(f'op {i}: after column not in header: {after_col}')
                  insert_at = header.index(after_col) + 1 if after_col else len(header)
                  old_width = len(header)
                  header.insert(insert_at, col)
                  for row in rows[1:]:
                      while len(row) < old_width:
                          row.append('')
                      row.insert(insert_at, '')
                  changed.add(path)
                  print(f'added column {path} {col}')
                  continue

              if mode == 'remove_column':
                  col = str(op.get('column') or '').strip()
                  if not col:
                      sys.exit(f'op {i}: remove_column needs column')
                  if col not in header:
                      sys.exit(f'op {i}: column not in header: {col}')
                  remove_at = header.index(col)
                  header.pop(remove_at)
                  for row in rows[1:]:
                      if len(row) > remove_at:
                          row.pop(remove_at)
                  changed.add(path)
                  print(f'removed column {path} {col}')
                  continue

              if mode == 'dedupe_by_key':
                  key_col = str(op.get('key_column') or '').strip()
                  if key_col not in header:
                      sys.exit(f'op {i}: key column not in header: {key_col}')
                  i_key = header.index(key_col)
                  kept = [header]
                  seen = set()
                  matched = 0
                  removed = 0
                  for row in rows[1:]:
                      if not row:
                          continue
                      while len(row) < len(header):
                          row.append('')
                      if row[i_id] != row_id:
                          kept.append(row)
                          continue
                      matched += 1
                      key = row[i_key].strip()
                      if not key:
                          sys.exit(f'op {i}: blank {key_col} while deduping {row_id!r}')
                      if key in seen:
                          removed += 1
                          continue
                      seen.add(key)
                      kept.append(row)
                  if matched < 1:
                      sys.exit(f'op {i}: found no rows for {row_id!r}')
                  if removed < 1:
                      sys.exit(f'op {i}: found no duplicate rows for {row_id!r}')
                  files[path] = kept
                  changed.add(path)
                  print(f'deduped {path} {row_id}: kept {len(seen)} unique {key_col} values, removed {removed} duplicates')
                  continue

              if mode == 'fill_blank_where':
                  match_col = str(op.get('match_column') or '').strip()
                  col = str(op.get('column') or '').strip()
                  if match_col not in header:
                      sys.exit(f'op {i}: match column not in header: {match_col}')
                  if col not in header:
                      sys.exit(f'op {i}: column not in header: {col}')
                  match_value = decode(op.get('match_value')).strip()
                  new = decode(op.get('value'))
                  if not match_value:
                      sys.exit(f'op {i}: match_value required')
                  if new == '':
                      sys.exit(f'op {i}: value required')
                  i_match = header.index(match_col)
                  i_col = header.index(col)
                  hits = 0
                  for row in rows[1:]:
                      if not row:
                          continue
                      while len(row) < len(header):
                          row.append('')
                      if row[i_match].strip() == match_value and not row[i_col].strip():
                          row[i_col] = new
                          hits += 1
                  if hits < 1:
                      sys.exit(f'op {i}: found no blank {col} values where {match_col}={match_value!r}')
                  changed.add(path)
                  print(f'filled {hits} blank {col} values in {path} where {match_col}={match_value!r}')
                  continue

              if mode == 'replace_text':
                  col = str(op.get('column') or '').strip()
                  if col not in header:
                      sys.exit(f'op {i}: column not in header: {col}')
                  old = decode(op.get('from'))
                  new = decode(op.get('to'))
                  if not old:
                      sys.exit(f'op {i}: replace_text needs non-empty from')
                  i_col = header.index(col)
                  hits = 0
                  for row in rows[1:]:
                      if not row:
                          continue
                      while len(row) < len(header):
                          row.append('')
                      if old in row[i_col]:
                          row[i_col] = row[i_col].replace(old, new)
                          hits += 1
                  if hits < 1:
                      sys.exit(f'op {i}: replace_text found no matches for {old!r}')
                  changed.add(path)
                  print(f'replaced {old!r} in {hits} rows of {path} column {col}')
                  continue

              if mode == 'delete_where':
                  where = op.get('where')
                  if not isinstance(where, dict) or not where:
                      sys.exit(f'op {i}: delete_where needs where')
                  for col in where:
                      if col not in header:
                          sys.exit(f'op {i}: column not in header: {col}')
                  kept = [header]
                  hits = 0
                  for row in rows[1:]:
                      if not row:
                          continue
                      while len(row) < len(header):
                          row.append('')
                      matched = True
                      for col, val in where.items():
                          if row[header.index(col)] != decode(val):
                              matched = False
                              break
                      if matched:
                          hits += 1
                          continue
                      kept.append(row)
                  if hits < 1:
                      sys.exit(f'op {i}: delete_where found no rows for {where!r}')
                  files[path] = kept
                  changed.add(path)
                  print(f'deleted {hits} rows from {path} where {where}')
                  continue

              if mode == 'delete':
                  kept = [header]
                  hits = 0
                  for row in rows[1:]:
                      if not row:
                          continue
                      if len(row) > i_id and row[i_id] == row_id:
                          hits += 1
                          continue
                      kept.append(row)
                  if hits != 1:
                      sys.exit(f'op {i}: expected 1 row for {row_id!r}, found {hits}')
                  files[path] = kept
                  changed.add(path)
                  print(f'deleted {path} {row_id}')
                  continue

              if mode == 'insert':
                  existing = 0
                  for row in rows[1:]:
                      if row and len(row) > i_id and row[i_id] == row_id:
                          existing += 1
                  allow_duplicate_id = bool(op.get('allow_duplicate_id'))
                  if existing and not allow_duplicate_id:
                      sys.exit(f'op {i}: row already exists: {row_id}')
                  sets = op.get('sets')
                  if not isinstance(sets, dict) or not sets:
                      sys.exit(f'op {i}: insert needs sets')
                  new_row = [''] * len(header)
                  new_row[i_id] = row_id
                  for col, val in sets.items():
                      if col not in header:
                          sys.exit(f'op {i}: column not in header: {col}')
                      new_row[header.index(col)] = decode(val)
                  after = str(op.get('after_row_id') or '').strip()
                  if after:
                      placed = False
                      kept = [header]
                      for row in rows[1:]:
                          kept.append(row)
                          if row and len(row) > i_id and row[i_id] == after:
                              kept.append(new_row)
                              placed = True
                      if not placed:
                          sys.exit(f'op {i}: after_row_id not found: {after}')
                      files[path] = kept
                  else:
                      rows.append(new_row)
                      files[path] = rows
                  changed.add(path)
                  print(f'inserted {path} {row_id}')
                  continue

              if mode != 'update':
                  sys.exit(f'op {i}: unknown mode {mode}')

              sets = op.get('sets')
              if not isinstance(sets, dict) or not sets:
                  sets = {}
                  if op.get('column'):
                      sets[str(op['column'])] = op.get('value', '')
                  if op.get('column_2'):
                      sets[str(op['column_2'])] = op.get('value_2', '')
              if not sets:
                  sys.exit(f'op {i}: update needs sets or column/value')

              hits = 0
              for row in rows[1:]:
                  if not row:
                      continue
                  while len(row) < len(header):
                      row.append('')
                  if row[i_id] != row_id:
                      continue
                  for col, val in sets.items():
                      if col not in header:
                          sys.exit(f'op {i}: column not in header: {col}')
                      row[header.index(col)] = decode(val)
                  hits += 1
              if hits != 1:
                  sys.exit(f'op {i}: expected 1 row for {row_id!r}, found {hits}')
              changed.add(path)
              print(f'updated {path} {row_id} {list(sets)}')

          for path, rows in files.items():
              if path not in changed:
                  continue
              with path.open('w', newline='', encoding='utf-8') as f:
                  csv.writer(f, lineterminator='\n').writerows(rows)
          print('changed', ' '.join(str(p) for p in sorted(changed)))
          PY

      - name: Refresh manifests
        run: python3 scripts/data_schema.py manifest

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- data
          if git diff --cached --quiet; then
            echo "No change"
            exit 0
          fi
          git commit -m "Patch CSV line items"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
