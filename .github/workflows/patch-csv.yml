name: Patch CSV

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-csv.yml'
  workflow_dispatch:
    inputs:
      patches:
        description: JSON list of operations. One run, one commit.
        required: true
        type: string

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply patches
        env:
          PATCHES: ${{ inputs.patches || '[{"file":"data/marines/Detachment_Definitions.csv","id_column":"Detachment_ID","row_id":"space_marines_tacticus_firestorm_force","mode":"insert","sets":{"Army_Name":"Space Marines","Detachment_Name":"TACTICUS FIRESTORM FORCE","Rule_ID":"space_marines_tacticus_firestorm_force_detachment_rule_codex_fire_patterns","Rule_Name":"CODEX FIRE-PATTERNS","DP_Cost":"","Detachment_Disposition":"","Detachment_Disposition_2":"","Short_Description":"TACTICUS\u003a RAPID FIRE active at max range","Long_Description":"Friendly TACTICUS units’ [RAPID FIRE] attacks benefit from [RAPID FIRE] when targeting units up to that attack’s maximum range.","Tags":"","Tag Categories":"","Default_Active":"0"}},{"file":"data/marines/Enhancements.csv","id_column":"Enhancement_ID","row_id":"space_marines_tacticus_firestorm_force_enhancement_cyber_familiar","mode":"insert","sets":{"Detachment_ID":"space_marines_tacticus_firestorm_force","Enhancement_Name":"CYBER-FAMILIAR","Points":"","Repeatable":"FALSE","Short_Description":"TACTICUS only\nAfter deployment\u003a Redeploy up to 3 ASTARTES INFANTRY\nCan place in STRATEGIC RESERVES","Long_Description":"TACTICUS model only. When both players have deployed their armies, you can redeploy up to three friendly ADEPTUS ASTARTES INFANTRY units. When doing so, you can set those units up in strategic reserves, regardless of how many units are already in strategic reserves.","Tags":"","Tag Categories":"","Default_Active":"0"}},{"file":"data/marines/Enhancements.csv","id_column":"Enhancement_ID","row_id":"space_marines_tacticus_firestorm_force_enhancement_tempered_in_battle_aura","mode":"insert","sets":{"Detachment_ID":"space_marines_tacticus_firestorm_force","Enhancement_Name":"TEMPERED IN BATTLE (AURA)","Points":"","Repeatable":"FALSE","Short_Description":"TACTICUS only\nASTARTES within 6\"\u003a Re-roll LEADERSHIP","Long_Description":"TACTICUS model only. Friendly ADEPTUS ASTARTES units within 6\" of this model can re-roll leadership rolls.","Tags":"","Tag Categories":"","Default_Active":"0"}},{"file":"data/marines/Stratagems.csv","id_column":"Stratagem_ID","row_id":"space_marines_tacticus_firestorm_force_stratagem_for_the_emperor_1cp","mode":"insert","sets":{"Detachment_ID":"space_marines_tacticus_firestorm_force","Stratagem_Name":"FOR THE EMPEROR!","CP_Cost":"1","Short_Description":"COMMAND\u003a TACTICUS on OBJECTIVE\n+1 OC until end of turn","Long_Description":"WHEN\u003a Command phase.\n\nTARGET\u003a One friendly TACTICUS unit that is within range of an objective.\n\nEFFECT\u003a Your unit has +1 OC until the end of the turn.","Tags":"","Tag Categories":"","Default_Active":"0"}},{"file":"data/marines/Stratagems.csv","id_column":"Stratagem_ID","row_id":"space_marines_tacticus_firestorm_force_stratagem_relentless_assault_1cp","mode":"insert","sets":{"Detachment_ID":"space_marines_tacticus_firestorm_force","Stratagem_Name":"RELENTLESS ASSAULT","CP_Cost":"1","Short_Description":"TACTICUS SHOOTING / FIGHT\nvs non-MONSTER / VEHICLE\u003a SUSTAINED HITS 1\nvs MONSTER / VEHICLE\u003a LETHAL HITS","Long_Description":"WHEN\u003a Your Shooting phase or the Fight phase, when a friendly TACTICUS unit is selected to attack.\n\nTARGET\u003a That TACTICUS unit.\n\nEFFECT\u003a Your unit’s attacks have:\n• [SUSTAINED HITS 1\u003a non-MONSTER/VEHICLE].\n• Or\u003a [LETHAL HITS\u003a MONSTER/VEHICLE].","Tags":"","Tag Categories":"","Default_Active":"0"}},{"file":"data/marines/Stratagems.csv","id_column":"Stratagem_ID","row_id":"space_marines_tacticus_firestorm_force_stratagem_point_blank_brutality_1cp","mode":"insert","sets":{"Detachment_ID":"space_marines_tacticus_firestorm_force","Stratagem_Name":"POINT-BLANK BRUTALITY","CP_Cost":"1","Short_Description":"Engaged TACTICUS SHOOTING\nNon-BLAST RANGED\u003a CLOSE-QUARTERS \u0026 IGNORE COVER","Long_Description":"WHEN\u003a Your Shooting phase, when a friendly engaged TACTICUS unit is selected to shoot.\n\nTARGET\u003a That TACTICUS unit.\n\nEFFECT\u003a Your unit’s ranged attacks (excluding [BLAST] attacks) have:\n• [CLOSE-QUARTERS].\n• [IGNORES COVER].","Tags":"","Tag Categories":"","Default_Active":"0"}},{"file":"data/marines/Detachment_Definitions.csv","id_column":"Detachment_ID","row_id":"space_marines_phobos_shadow_force","mode":"insert","sets":{"Army_Name":"Space Marines","Detachment_Name":"PHOBOS SHADOW FORCE","Rule_ID":"space_marines_phobos_shadow_force_detachment_rule_shadow_masters","Rule_Name":"SHADOW MASTERS","DP_Cost":"","Detachment_Disposition":"","Detachment_Disposition_2":"","Short_Description":"PHOBOS / SCOUT after SHOOTING:\nStay HIDDEN or Move D6\"\nIf Move\u003a Cannot CHARGE","Long_Description":"When a friendly PHOBOS or SCOUT SQUAD unit has shot:\n• Those attacks do not prevent that unit from being hidden.\n• Or\u003a That unit can make a normal move up to D6\". That unit is not eligible to declare a charge until the end of the turn.","Tags":"","Tag Categories":"","Default_Active":"0"}},{"file":"data/marines/Enhancements.csv","id_column":"Enhancement_ID","row_id":"space_marines_phobos_shadow_force_enhancement_venator_omni_auspex","mode":"insert","sets":{"Detachment_ID":"space_marines_phobos_shadow_force","Enhancement_Name":"VENATOR OMNI-AUSPEX","Points":"","Repeatable":"FALSE","Short_Description":"PHOBOS only\nvs HIDDEN\u003a Re-roll WOUND 1s\nIn ASSAULT\u003a Re-roll WOUND 1-2","Long_Description":"PHOBOS model only. This unit’s attacks that target a hidden unit can:\n• Re-roll wound rolls of 1.\n• Or\u003a If the assault doctrine is active for this unit, re-roll wound rolls of 1 and 2.","Tags":"","Tag Categories":"","Default_Active":"0"}},{"file":"data/marines/Enhancements.csv","id_column":"Enhancement_ID","row_id":"space_marines_phobos_shadow_force_enhancement_execute_and_redeploy","mode":"insert","sets":{"Detachment_ID":"space_marines_phobos_shadow_force","Enhancement_Name":"EXECUTE AND REDEPLOY","Points":"","Repeatable":"FALSE","Short_Description":"PHOBOS only\nAfter SHOOTING \u0026 unengaged\u003a Move 6\"\nCannot CHARGE","Long_Description":"PHOBOS model only. In your Shooting phase, after this unit has shot, if this unit is unengaged, this unit can make a normal move up to 6\". If it does, this unit is not eligible to declare a charge until the end of the turn.","Tags":"","Tag Categories":"","Default_Active":"0"}},{"file":"data/marines/Stratagems.csv","id_column":"Stratagem_ID","row_id":"space_marines_phobos_shadow_force_stratagem_strike_from_the_shadows_1cp","mode":"insert","sets":{"Detachment_ID":"space_marines_phobos_shadow_force","Stratagem_Name":"STRIKE FROM THE SHADOWS","CP_Cost":"1","Short_Description":"HIDDEN PHOBOS SHOOTING / FIGHT\nAttacks\u003a +1 S \u0026 LETHAL HITS","Long_Description":"WHEN\u003a Your Shooting phase or the Fight phase, when a friendly hidden PHOBOS unit is selected to attack.\n\nTARGET\u003a That PHOBOS unit.\n\nEFFECT\u003a Your unit’s attacks have:\n• +1 S.\n• [LETHAL HITS].","Tags":"[LETHAL HITS]","Tag Categories":"","Default_Active":"0"}},{"file":"data/marines/Stratagems.csv","id_column":"Stratagem_ID","row_id":"space_marines_phobos_shadow_force_stratagem_mortis_snares_1cp","mode":"insert","sets":{"Detachment_ID":"space_marines_phobos_shadow_force","Stratagem_Name":"MORTIS SNARES","CP_Cost":"1","Short_Description":"End MOVEMENT\u003a PHOBOS / SCOUT on OBJECTIVE\nSnare objective\nEnemy ends move in range\u003a 2+ = D6 MW","Long_Description":"WHEN\u003a End of your Movement phase.\n\nTARGET\u003a One friendly unengaged PHOBOS/SCOUT SQUAD unit.\n\nEFFECT\u003a If your unit is controlling an objective, that objective is snared. While an objective is snared, when an enemy unit ends a move within range of that objective, roll one D6:\n• On a 2+, that enemy unit suffers D6 mortal wounds.\n• That objective is no longer snared.","Tags":"","Tag Categories":"","Default_Active":"0"}},{"file":"data/marines/Stratagems.csv","id_column":"Stratagem_ID","row_id":"space_marines_phobos_shadow_force_stratagem_tactical_withdrawal_1cp","mode":"insert","sets":{"Detachment_ID":"space_marines_phobos_shadow_force","Stratagem_Name":"TACTICAL WITHDRAWAL","CP_Cost":"1","Short_Description":"End enemy FIGHT\nUnengaged PHOBOS / SCOUT\u003a STRATEGIC RESERVES","Long_Description":"WHEN\u003a End of your opponent’s Fight phase.\n\nTARGET\u003a One friendly unengaged PHOBOS/SCOUT SQUAD unit.\n\nEFFECT\u003a Place your unit in strategic reserves.","Tags":"","Tag Categories":"","Default_Active":"0"}},{"file":"data/marines/Detachment_Definitions.csv","id_column":"Detachment_ID","row_id":"space_marines_phobos_shock_force","mode":"insert","sets":{"Army_Name":"Space Marines","Detachment_Name":"PHOBOS SHOCK FORCE","Rule_ID":"space_marines_phobos_shock_force_detachment_rule_vanguard_ambushers","Rule_Name":"VANGUARD AMBUSHERS","DP_Cost":"","Detachment_Disposition":"","Detachment_Disposition_2":"","Short_Description":"End MOVEMENT\u003a HIDDEN PHOBOS\nAttacks\u003a Re-roll WOUND 1s","Long_Description":"At the end of your Movement phase, if a friendly PHOBOS unit is hidden, that unit’s attacks can re-roll wound rolls of 1 until the end of the turn.","Tags":"","Tag Categories":"","Default_Active":"0"}},{"file":"data/marines/Enhancements.csv","id_column":"Enhancement_ID","row_id":"space_marines_phobos_shock_force_enhancement_seal_of_shrouding","mode":"insert","sets":{"Detachment_ID":"space_marines_phobos_shock_force","Enhancement_Name":"SEAL OF SHROUDING","Points":"","Repeatable":"FALSE","Short_Description":"PHOBOS only\nCannot be targeted by SNAP SHOOTING","Long_Description":"PHOBOS model only. Enemy units cannot target this unit with snap shooting attacks.","Tags":"","Tag Categories":"","Default_Active":"0"}},{"file":"data/marines/Enhancements.csv","id_column":"Enhancement_ID","row_id":"space_marines_phobos_shock_force_enhancement_venator_omni_auspex","mode":"insert","sets":{"Detachment_ID":"space_marines_phobos_shock_force","Enhancement_Name":"VENATOR OMNI-AUSPEX","Points":"","Repeatable":"FALSE","Short_Description":"PHOBOS only\nvs HIDDEN\u003a Re-roll WOUND 1s\nIn ASSAULT\u003a Re-roll WOUND 1-2","Long_Description":"PHOBOS model only. This unit’s attacks that target a hidden unit can:\n• Re-roll wound rolls of 1.\n• Or\u003a If the assault doctrine is active for this unit, re-roll wound rolls of 1 and 2.","Tags":"","Tag Categories":"","Default_Active":"0"}},{"file":"data/marines/Stratagems.csv","id_column":"Stratagem_ID","row_id":"space_marines_phobos_shock_force_stratagem_strike_from_the_shadows_1cp","mode":"insert","sets":{"Detachment_ID":"space_marines_phobos_shock_force","Stratagem_Name":"STRIKE FROM THE SHADOWS","CP_Cost":"1","Short_Description":"HIDDEN PHOBOS SHOOTING / FIGHT\nAttacks\u003a +1 S \u0026 LETHAL HITS","Long_Description":"WHEN\u003a Your Shooting phase or the Fight phase, when a friendly hidden PHOBOS unit is selected to attack.\n\nTARGET\u003a That PHOBOS unit.\n\nEFFECT\u003a Your unit’s attacks have:\n• +1 S.\n• [LETHAL HITS].","Tags":"[LETHAL HITS]","Tag Categories":"","Default_Active":"0"}},{"file":"data/marines/Stratagems.csv","id_column":"Stratagem_ID","row_id":"space_marines_phobos_shock_force_stratagem_transhuman_reactions_1cp","mode":"insert","sets":{"Detachment_ID":"space_marines_phobos_shock_force","Stratagem_Name":"TRANSHUMAN REACTIONS","CP_Cost":"1","Short_Description":"Enemy ends move within 8\"\nUnengaged PHOBOS\u003a Move D6\"\nIn TACTICAL\u003a Move 6\"","Long_Description":"WHEN\u003a Your opponent’s Movement phase, when an enemy unit ends a move within 8\" of a friendly unengaged PHOBOS unit.\n\nTARGET\u003a That PHOBOS unit.\n\nEFFECT\u003a Your unit can make a normal move of:\n• Up to D6\".\n• Or\u003a If the tactical doctrine is active for your unit, up to 6\".","Tags":"","Tag Categories":"","Default_Active":"0"}},{"file":"data/marines/Stratagems.csv","id_column":"Stratagem_ID","row_id":"space_marines_phobos_shock_force_stratagem_umbral_evasion_1cp","mode":"insert","sets":{"Detachment_ID":"space_marines_phobos_shock_force","Stratagem_Name":"UMBRAL EVASION","CP_Cost":"1","Short_Description":"Enemy SHOOTING\nPHOBOS\u003a -1 to Hit","Long_Description":"WHEN\u003a Your opponent’s Shooting phase, when an enemy unit targets a friendly PHOBOS unit.\n\nTARGET\u003a That PHOBOS unit.\n\nEFFECT\u003a Ranged attacks that target your unit have -1 to hit rolls.","Tags":"","Tag Categories":"","Default_Active":"0"}}]' }}
        run: |
          python3 <<'PY'
          import csv, json, os, sys
          from pathlib import Path

          raw = os.environ.get('PATCHES') or ''
          if not raw.strip():
              print('no PATCHES input; skip apply')
              raise SystemExit(0)
          try:
              ops = json.loads(raw)
          except json.JSONDecodeError as e:
              sys.exit(f'patches is not JSON: {e}')
          if not isinstance(ops, list) or not ops:
              sys.exit('patches must be a non-empty JSON list')

          def decode(val):
              if val is None:
                  return ''
              s = str(val)
              return s.replace('\\n', '\n')

          def load_csv(path):
              if path.is_absolute() or '..' in path.parts:
                  sys.exit(f'bad path {path}')
              if not str(path).startswith('data/') or path.suffix.lower() != '.csv':
                  sys.exit(f'file must be a .csv under data/: {path}')
              if not path.is_file():
                  sys.exit(f'missing {path}')
              with path.open(encoding='utf-8', newline='') as f:
                  rows = list(csv.reader(f))
              if not rows:
                  sys.exit(f'empty csv {path}')
              return rows

          files = {}
          changed = set()

          for i, op in enumerate(ops):
              if not isinstance(op, dict):
                  sys.exit(f'op {i} is not an object')
              path = Path(str(op.get('file', '')).strip())
              if path not in files:
                  files[path] = load_csv(path)
              rows = files[path]
              header = rows[0]
              id_col = str(op.get('id_column') or '').strip() or header[0]
              if id_col not in header:
                  sys.exit(f'op {i}: id column not in header: {id_col}')
              i_id = header.index(id_col)
              row_id = str(op.get('row_id') or '').strip()
              if not row_id:
                  sys.exit(f'op {i}: row_id required')
              mode = str(op.get('mode') or 'update').strip()

              if mode == 'add_column':
                  col = str(op.get('column') or '').strip()
                  if not col:
                      sys.exit(f'op {i}: add_column needs column')
                  if col in header:
                      print(f'column already exists {path} {col}')
                      continue
                  after_col = str(op.get('after_column') or '').strip()
                  if after_col and after_col not in header:
                      sys.exit(f'op {i}: after column not in header: {after_col}')
                  insert_at = header.index(after_col) + 1 if after_col else len(header)
                  old_width = len(header)
                  header.insert(insert_at, col)
                  for row in rows[1:]:
                      while len(row) < old_width:
                          row.append('')
                      row.insert(insert_at, '')
                  changed.add(path)
                  print(f'added column {path} {col}')
                  continue

              if mode == 'remove_column':
                  col = str(op.get('column') or '').strip()
                  if not col:
                      sys.exit(f'op {i}: remove_column needs column')
                  if col not in header:
                      sys.exit(f'op {i}: column not in header: {col}')
                  remove_at = header.index(col)
                  header.pop(remove_at)
                  for row in rows[1:]:
                      if len(row) > remove_at:
                          row.pop(remove_at)
                  changed.add(path)
                  print(f'removed column {path} {col}')
                  continue

              if mode == 'dedupe_by_key':
                  key_col = str(op.get('key_column') or '').strip()
                  if key_col not in header:
                      sys.exit(f'op {i}: key column not in header: {key_col}')
                  i_key = header.index(key_col)
                  kept = [header]
                  seen = set()
                  matched = 0
                  removed = 0
                  for row in rows[1:]:
                      if not row:
                          continue
                      while len(row) < len(header):
                          row.append('')
                      if row[i_id] != row_id:
                          kept.append(row)
                          continue
                      matched += 1
                      key = row[i_key].strip()
                      if not key:
                          sys.exit(f'op {i}: blank {key_col} while deduping {row_id!r}')
                      if key in seen:
                          removed += 1
                          continue
                      seen.add(key)
                      kept.append(row)
                  if matched < 1:
                      sys.exit(f'op {i}: found no rows for {row_id!r}')
                  if removed < 1:
                      sys.exit(f'op {i}: found no duplicate rows for {row_id!r}')
                  files[path] = kept
                  changed.add(path)
                  print(f'deduped {path} {row_id}: kept {len(seen)} unique {key_col} values, removed {removed} duplicates')
                  continue

              if mode == 'fill_blank_where':
                  match_col = str(op.get('match_column') or '').strip()
                  col = str(op.get('column') or '').strip()
                  if match_col not in header:
                      sys.exit(f'op {i}: match column not in header: {match_col}')
                  if col not in header:
                      sys.exit(f'op {i}: column not in header: {col}')
                  match_value = decode(op.get('match_value')).strip()
                  new = decode(op.get('value'))
                  if not match_value:
                      sys.exit(f'op {i}: match_value required')
                  if new == '':
                      sys.exit(f'op {i}: value required')
                  i_match = header.index(match_col)
                  i_col = header.index(col)
                  hits = 0
                  for row in rows[1:]:
                      if not row:
                          continue
                      while len(row) < len(header):
                          row.append('')
                      if row[i_match].strip() == match_value and not row[i_col].strip():
                          row[i_col] = new
                          hits += 1
                  if hits < 1:
                      sys.exit(f'op {i}: found no blank {col} values where {match_col}={match_value!r}')
                  changed.add(path)
                  print(f'filled {hits} blank {col} values in {path} where {match_col}={match_value!r}')
                  continue

              if mode == 'replace_text':
                  col = str(op.get('column') or '').strip()
                  if col not in header:
                      sys.exit(f'op {i}: column not in header: {col}')
                  old = decode(op.get('from'))
                  new = decode(op.get('to'))
                  if not old:
                      sys.exit(f'op {i}: replace_text needs non-empty from')
                  i_col = header.index(col)
                  hits = 0
                  for row in rows[1:]:
                      if not row:
                          continue
                      while len(row) < len(header):
                          row.append('')
                      if old in row[i_col]:
                          row[i_col] = row[i_col].replace(old, new)
                          hits += 1
                  if hits < 1:
                      sys.exit(f'op {i}: replace_text found no matches for {old!r}')
                  changed.add(path)
                  print(f'replaced {old!r} in {hits} rows of {path} column {col}')
                  continue

              if mode == 'delete':
                  kept = [header]
                  hits = 0
                  for row in rows[1:]:
                      if not row:
                          continue
                      if len(row) > i_id and row[i_id] == row_id:
                          hits += 1
                          continue
                      kept.append(row)
                  if hits != 1:
                      sys.exit(f'op {i}: expected 1 row for {row_id!r}, found {hits}')
                  files[path] = kept
                  changed.add(path)
                  print(f'deleted {path} {row_id}')
                  continue

              if mode == 'insert':
                  existing = 0
                  for row in rows[1:]:
                      if row and len(row) > i_id and row[i_id] == row_id:
                          existing += 1
                  if existing:
                      sys.exit(f'op {i}: row already exists: {row_id}')
                  sets = op.get('sets')
                  if not isinstance(sets, dict) or not sets:
                      sys.exit(f'op {i}: insert needs sets')
                  new_row = [''] * len(header)
                  new_row[i_id] = row_id
                  for col, val in sets.items():
                      if col not in header:
                          sys.exit(f'op {i}: column not in header: {col}')
                      new_row[header.index(col)] = decode(val)
                  after = str(op.get('after_row_id') or '').strip()
                  if after:
                      placed = False
                      kept = [header]
                      for row in rows[1:]:
                          kept.append(row)
                          if row and len(row) > i_id and row[i_id] == after:
                              kept.append(new_row)
                              placed = True
                      if not placed:
                          sys.exit(f'op {i}: after_row_id not found: {after}')
                      files[path] = kept
                  else:
                      rows.append(new_row)
                      files[path] = rows
                  changed.add(path)
                  print(f'inserted {path} {row_id}')
                  continue

              if mode != 'update':
                  sys.exit(f'op {i}: unknown mode {mode}')

              sets = op.get('sets')
              if not isinstance(sets, dict) or not sets:
                  sets = {}
                  if op.get('column'):
                      sets[str(op['column'])] = op.get('value', '')
                  if op.get('column_2'):
                      sets[str(op['column_2'])] = op.get('value_2', '')
              if not sets:
                  sys.exit(f'op {i}: update needs sets or column/value')

              hits = 0
              for row in rows[1:]:
                  if not row:
                      continue
                  while len(row) < len(header):
                      row.append('')
                  if row[i_id] != row_id:
                      continue
                  for col, val in sets.items():
                      if col not in header:
                          sys.exit(f'op {i}: column not in header: {col}')
                      row[header.index(col)] = decode(val)
                  hits += 1
              if hits != 1:
                  sys.exit(f'op {i}: expected 1 row for {row_id!r}, found {hits}')
              changed.add(path)
              print(f'updated {path} {row_id} {list(sets)}')

          for path, rows in files.items():
              if path not in changed:
                  continue
              with path.open('w', newline='', encoding='utf-8') as f:
                  csv.writer(f, lineterminator='\n').writerows(rows)
          print('changed', ' '.join(str(p) for p in sorted(changed)))
          PY

      - name: Refresh manifests
        run: python3 scripts/data_schema.py manifest

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- data
          if git diff --cached --quiet; then
            echo "No change"
            exit 0
          fi
          git commit -m "Patch CSV line items"
          git push