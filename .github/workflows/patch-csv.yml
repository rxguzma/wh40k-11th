name: Patch CSV

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-csv.yml'
  workflow_dispatch:
    inputs:
      patches:
        description: JSON list of operations. One run, one commit.
        required: true
        type: string

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply patches
        env:
          PATCHES: ${{ inputs.patches || '[{"file":"data/marines/Weapon_Abilities.csv","id_column":"Weapon_Ability_ID","row_id":"_BULK_MELTA_","mode":"replace_text","column":"Ability_Type","from":"CLEAVE","to":"__PRESERVE_ORIGINAL_GROUP_82B1__"},{"file":"data/marines/Weapon_Abilities.csv","id_column":"Weapon_Ability_ID","row_id":"_BULK_MELTA_","mode":"replace_text","column":"Ability_Type","from":"MELTA","to":"CLEAVE"},{"file":"data/marines/Weapon_Abilities.csv","id_column":"Weapon_Ability_ID","row_id":"_BULK_MELTA_","mode":"merge_value_into_type","ability_type":"CLEAVE","expected_rows":11},{"file":"data/marines/Weapon_Abilities.csv","id_column":"Weapon_Ability_ID","row_id":"_BULK_MELTA_","mode":"replace_text","column":"Ability_Type","from":"CLEAVE","to":"MELTA"},{"file":"data/marines/Weapon_Abilities.csv","id_column":"Weapon_Ability_ID","row_id":"_BULK_MELTA_","mode":"replace_text","column":"Ability_Type","from":"__PRESERVE_ORIGINAL_GROUP_82B1__","to":"CLEAVE"}]' }}
        run: |
          python3 <<'PY'
          import csv, json, os, sys
          from pathlib import Path

          raw = os.environ.get('PATCHES') or ''
          if not raw.strip():
              print('no PATCHES input; skip apply')
              raise SystemExit(0)
          try:
              ops = json.loads(raw)
          except json.JSONDecodeError as e:
              sys.exit(f'patches is not JSON: {e}')
          if not isinstance(ops, list) or not ops:
              sys.exit('patches must be a non-empty JSON list')

          def decode(val):
              if val is None:
                  return ''
              s = str(val)
              return s.replace('\\n', '\n')

          def load_csv(path):
              if path.is_absolute() or '..' in path.parts:
                  sys.exit(f'bad path {path}')
              if not str(path).startswith('data/') or path.suffix.lower() != '.csv':
                  sys.exit(f'file must be a .csv under data/: {path}')
              if not path.is_file():
                  sys.exit(f'missing {path}')
              with path.open(encoding='utf-8', newline='') as f:
                  rows = list(csv.reader(f))
              if not rows:
                  sys.exit(f'empty csv {path}')
              return rows

          files = {}
          changed = set()

          for i, op in enumerate(ops):
              if not isinstance(op, dict):
                  sys.exit(f'op {i} is not an object')
              path = Path(str(op.get('file', '')).strip())
              if path not in files:
                  files[path] = load_csv(path)
              rows = files[path]
              header = rows[0]
              id_col = str(op.get('id_column') or '').strip() or header[0]
              if id_col not in header:
                  sys.exit(f'op {i}: id column not in header: {id_col}')
              i_id = header.index(id_col)
              row_id = str(op.get('row_id') or '').strip()
              if not row_id:
                  sys.exit(f'op {i}: row_id required')
              mode = str(op.get('mode') or 'update').strip()

              # Fold an ability's numeric Value into its displayed Ability_Type.
              # Rows without a Value already display correctly and stay unchanged.
              if mode == 'merge_value_into_type':
                  if path.name != 'Weapon_Abilities.csv':
                      sys.exit(f'op {i}: only Weapon_Abilities.csv supports merge_value_into_type')
                  if 'Ability_Type' not in header or 'Value' not in header:
                      sys.exit(f'op {i}: expected Ability_Type and Value columns')
                  ability_type = str(op.get('ability_type') or '').strip()
                  if ability_type not in ('BLAST', 'CLEAVE'):
                      sys.exit(f'op {i}: unexpected ability type {ability_type!r}')
                  expected = op.get('expected_rows')
                  if type(expected) is not int or expected < 1:
                      sys.exit(f'op {i}: expected_rows must be a positive integer')
                  type_col = header.index('Ability_Type')
                  value_col = header.index('Value')
                  matched = 0
                  migrated = 0
                  no_value = 0
                  for row in rows[1:]:
                      if not row:
                          continue
                      if len(row) != len(header):
                          sys.exit(f'op {i}: inconsistent row width in {path}')
                      if row[type_col].strip() != ability_type:
                          continue
                      matched += 1
                      value = row[value_col].strip()
                      if not value:
                          no_value += 1
                          continue
                      if not value.isascii() or not value.isdigit() or int(value) < 1:
                          sys.exit(f'op {i}: invalid {ability_type} Value {value!r}')
                      row[type_col] = f'{ability_type} {value}'
                      row[value_col] = ''
                      migrated += 1
                  if matched != expected:
                      sys.exit(f'op {i}: expected {expected} {ability_type} rows, found {matched}')
                  if migrated:
                      changed.add(path)
                  print(f'{path}: {ability_type}: {matched} rows; {migrated} values moved, {no_value} already blank')
                  continue

              if mode == 'consolidate_abilities':
                  if str(path) != 'data/orks/Weapon_Abilities.csv':
                      sys.exit('consolidate_abilities restricted to Orks')
                  cols = ('Ability_Type', 'Target', 'Value', 'Condition')
                  if any(c not in header for c in cols):
                      sys.exit('missing required ability columns')
                  idx = {c: header.index(c) for c in cols}
                  expected = op.get('expected')
                  allowed = {'LETHAL HITS': 32, 'SUSTAINED HITS': 9, 'HUNTER': 5, 'DEVASTATING WOUNDS': 4}
                  if expected != allowed:
                      sys.exit('unexpected batch scope')
                  counts = {k: 0 for k in allowed}
                  for row in rows[1:]:
                      if len(row) != len(header):
                          sys.exit('invalid weapon ability row width')
                      kind = row[idx['Ability_Type']].strip()
                      if kind not in allowed:
                          continue
                      target = row[idx['Target']].strip()
                      value = row[idx['Value']].strip()
                      condition = row[idx['Condition']].strip()
                      if not (target or value or condition):
                          continue
                      if target:
                          sys.exit(f'unexpected Target for {kind}')
                      row[idx['Ability_Type']] = kind + (' ' + value if value else '') + (': ' + condition if condition else '')
                      row[idx['Value']] = ''
                      row[idx['Condition']] = ''
                      counts[kind] += 1
                  if counts != allowed:
                      sys.exit(f'unexpected migration counts {counts}')
                  if any(row[idx['Target']].strip() or row[idx['Value']].strip() or row[idx['Condition']].strip() for row in rows[1:]):
                      sys.exit('redundant ability fields remain')
                  changed.add(path)
                  print(f'consolidated {sum(counts.values())} Orks abilities: {counts}')
                  continue

              # Migrate Nids weapon ability text without changing its rendering.
              if mode == 'consolidate_nids_weapon_abilities':
                  if str(path) != 'data/nids/Weapon_Abilities.csv':
                      sys.exit(f'op {i}: only Nids Weapon_Abilities.csv is permitted')
                  columns = ('Weapon_ID', 'Weapon_Ability_ID', 'Ability_Type', 'Target', 'Value', 'Condition')
                  if tuple(header) != columns:
                      sys.exit(f'op {i}: unexpected Nids Weapon_Abilities header')
                  data_rows = [row for row in rows[1:] if row]
                  if len(data_rows) != op.get('expected_rows') or op.get('expected_rows') != 81:
                      sys.exit(f'op {i}: unexpected Nids weapon ability row count: {len(data_rows)}')
                  seen = set()
                  anti_count = 0
                  moved = 0
                  value_count = 0
                  target_count = 0
                  condition_count = 0
                  for row in data_rows:
                      if len(row) != len(columns):
                          sys.exit(f'op {i}: unexpected row width')
                      weapon_id, ability_id, kind, target, value, condition = row
                      if not weapon_id.strip() or not ability_id.strip() or not kind.strip():
                          sys.exit(f'op {i}: blank weapon id, ability id or ability type')
                      if ability_id in seen:
                          sys.exit(f'op {i}: duplicate ability ID {ability_id}')
                      seen.add(ability_id)
                      kind = kind.strip()
                      target = target.strip()
                      value = value.strip()
                      condition = condition.strip()
                      if kind == 'ANTI':
                          anti_count += 1
                          if not target or not value:
                              sys.exit(f'op {i}: ANTI missing Target or Value for {ability_id}')
                          display = 'ANTI-' + target + ' ' + value
                      else:
                          if target:
                              sys.exit(f'op {i}: non-ANTI ability has Target for {ability_id}')
                          display = kind + (' ' + value if value else '')
                      if condition:
                          display += ': ' + condition
                      if target or value or condition:
                          row[2] = display
                          row[3] = ''
                          row[4] = ''
                          row[5] = ''
                          moved += 1
                          target_count += bool(target)
                          value_count += bool(value)
                          condition_count += bool(condition)
                  if anti_count != op.get('expected_anti') or anti_count != 10:
                      sys.exit(f'op {i}: unexpected ANTI count {anti_count}')
                  if moved < 1:
                      sys.exit(f'op {i}: no ability fields to consolidate')
                  if any(any(row[j].strip() for j in (3, 4, 5)) for row in data_rows):
                      sys.exit(f'op {i}: redundant fields remain')
                  changed.add(path)
                  print(f'nids consolidated {moved} of {len(data_rows)} weapon abilities')
                  print(f'fields cleared: Target {target_count}, Value {value_count}, Condition {condition_count}')
                  continue

              if mode == 'add_column':
                  col = str(op.get('column') or '').strip()
                  if not col:
                      sys.exit(f'op {i}: add_column needs column')
                  if col in header:
                      print(f'column already exists {path} {col}')
                      continue
                  after_col = str(op.get('after_column') or '').strip()
                  if after_col and after_col not in header:
                      sys.exit(f'op {i}: after column not in header: {after_col}')
                  insert_at = header.index(after_col) + 1 if after_col else len(header)
                  old_width = len(header)
                  header.insert(insert_at, col)
                  for row in rows[1:]:
                      while len(row) < old_width:
                          row.append('')
                      row.insert(insert_at, '')
                  changed.add(path)
                  print(f'added column {path} {col}')
                  continue

              if mode == 'remove_column':
                  col = str(op.get('column') or '').strip()
                  if not col:
                      sys.exit(f'op {i}: remove_column needs column')
                  if col not in header:
                      sys.exit(f'op {i}: column not in header: {col}')
                  remove_at = header.index(col)
                  header.pop(remove_at)
                  for row in rows[1:]:
                      if len(row) > remove_at:
                          row.pop(remove_at)
                  changed.add(path)
                  print(f'removed column {path} {col}')
                  continue

              if mode == 'dedupe_by_key':
                  key_col = str(op.get('key_column') or '').strip()
                  if key_col not in header:
                      sys.exit(f'op {i}: key column not in header: {key_col}')
                  i_key = header.index(key_col)
                  kept = [header]
                  seen = set()
                  matched = 0
                  removed = 0
                  for row in rows[1:]:
                      if not row:
                          continue
                      while len(row) < len(header):
                          row.append('')
                      if row[i_id] != row_id:
                          kept.append(row)
                          continue
                      matched += 1
                      key = row[i_key].strip()
                      if not key:
                          sys.exit(f'op {i}: blank {key_col} while deduping {row_id!r}')
                      if key in seen:
                          removed += 1
                          continue
                      seen.add(key)
                      kept.append(row)
                  if matched < 1:
                      sys.exit(f'op {i}: found no rows for {row_id!r}')
                  if removed < 1:
                      sys.exit(f'op {i}: found no duplicate rows for {row_id!r}')
                  files[path] = kept
                  changed.add(path)
                  print(f'deduped {path} {row_id}: kept {len(seen)} unique {key_col} values, removed {removed} duplicates')
                  continue

              if mode == 'fill_blank_where':
                  match_col = str(op.get('match_column') or '').strip()
                  col = str(op.get('column') or '').strip()
                  if match_col not in header:
                      sys.exit(f'op {i}: match column not in header: {match_col}')
                  if col not in header:
                      sys.exit(f'op {i}: column not in header: {col}')
                  match_value = decode(op.get('match_value')).strip()
                  new = decode(op.get('value'))
                  if not match_value:
                      sys.exit(f'op {i}: match_value required')
                  if new == '':
                      sys.exit(f'op {i}: value required')
                  i_match = header.index(match_col)
                  i_col = header.index(col)
                  hits = 0
                  for row in rows[1:]:
                      if not row:
                          continue
                      while len(row) < len(header):
                          row.append('')
                      if row[i_match].strip() == match_value and not row[i_col].strip():
                          row[i_col] = new
                          hits += 1
                  if hits < 1:
                      sys.exit(f'op {i}: found no blank {col} values where {match_col}={match_value!r}')
                  changed.add(path)
                  print(f'filled {hits} blank {col} values in {path} where {match_col}={match_value!r}')
                  continue

              # Surgical replacement inside exactly one identified CSV row.
              # Only the named column in the named row is ever modified.
              if mode == 'replace_regex_in_row':
                  import re
                  col = str(op.get('column') or '').strip()
                  if col not in header:
                      sys.exit(f'op {i}: column not in header: {col}')
                  pattern = str(op.get('pattern') or '')
                  replacement = decode(op.get('to'))
                  if not pattern:
                      sys.exit(f'op {i}: replace_regex_in_row needs pattern')
                  try:
                      regex = re.compile(pattern)
                  except re.error as error:
                      sys.exit(f'op {i}: invalid regex: {error}')
                  i_col = header.index(col)
                  row_hits = 0
                  for row in rows[1:]:
                      if not row or len(row) <= i_id or row[i_id] != row_id:
                          continue
                      row_hits += 1
                      while len(row) < len(header):
                          row.append('')
                      updated, replacement_hits = regex.subn(lambda match: match.expand(replacement), row[i_col])
                      if replacement_hits != 1:
                          sys.exit(f'op {i}: expected one match in {path} {row_id} {col}, got {replacement_hits}')
                      row[i_col] = updated
                  if row_hits != 1:
                      sys.exit(f'op {i}: expected one row {row_id!r} in {path}, found {row_hits}')
                  changed.add(path)
                  print(f'replaced one match in {path} {row_id} {col}')
                  continue

              if mode == 'replace_text':
                  col = str(op.get('column') or '').strip()
                  if col not in header:
                      sys.exit(f'op {i}: column not in header: {col}')
                  old = decode(op.get('from'))
                  new = decode(op.get('to'))
                  if not old:
                      sys.exit(f'op {i}: replace_text needs non-empty from')
                  i_col = header.index(col)
                  hits = 0
                  for row in rows[1:]:
                      if not row:
                          continue
                      while len(row) < len(header):
                          row.append('')
                      if old in row[i_col]:
                          row[i_col] = row[i_col].replace(old, new)
                          hits += 1
                  if hits < 1:
                      sys.exit(f'op {i}: replace_text found no matches for {old!r}')
                  changed.add(path)
                  print(f'replaced {old!r} in {hits} rows of {path} column {col}')
                  continue

              if mode == 'delete_where':
                  where = op.get('where')
                  if not isinstance(where, dict) or not where:
                      sys.exit(f'op {i}: delete_where needs where')
                  for col in where:
                      if col not in header:
                          sys.exit(f'op {i}: column not in header: {col}')
                  kept = [header]
                  hits = 0
                  for row in rows[1:]:
                      if not row:
                          continue
                      while len(row) < len(header):
                          row.append('')
                      matched = True
                      for col, val in where.items():
                          if row[header.index(col)] != decode(val):
                              matched = False
                              break
                      if matched:
                          hits += 1
                          continue
                      kept.append(row)
                  if hits < 1:
                      sys.exit(f'op {i}: delete_where found no rows for {where!r}')
                  files[path] = kept
                  changed.add(path)
                  print(f'deleted {hits} rows from {path} where {where}')
                  continue

              if mode == 'delete':
                  kept = [header]
                  hits = 0
                  for row in rows[1:]:
                      if not row:
                          continue
                      if len(row) > i_id and row[i_id] == row_id:
                          hits += 1
                          continue
                      kept.append(row)
                  if hits != 1:
                      sys.exit(f'op {i}: expected 1 row for {row_id!r}, found {hits}')
                  files[path] = kept
                  changed.add(path)
                  print(f'deleted {path} {row_id}')
                  continue

              if mode == 'insert':
                  existing = 0
                  for row in rows[1:]:
                      if row and len(row) > i_id and row[i_id] == row_id:
                          existing += 1
                  allow_duplicate_id = bool(op.get('allow_duplicate_id'))
                  if existing and not allow_duplicate_id:
                      sys.exit(f'op {i}: row already exists: {row_id}')
                  sets = op.get('sets')
                  if not isinstance(sets, dict) or not sets:
                      sys.exit(f'op {i}: insert needs sets')
                  new_row = [''] * len(header)
                  new_row[i_id] = row_id
                  for col, val in sets.items():
                      if col not in header:
                          sys.exit(f'op {i}: column not in header: {col}')
                      new_row[header.index(col)] = decode(val)
                  after = str(op.get('after_row_id') or '').strip()
                  if after:
                      placed = False
                      kept = [header]
                      for row in rows[1:]:
                          kept.append(row)
                          if row and len(row) > i_id and row[i_id] == after:
                              kept.append(new_row)
                              placed = True
                      if not placed:
                          sys.exit(f'op {i}: after_row_id not found: {after}')
                      files[path] = kept
                  else:
                      rows.append(new_row)
                      files[path] = rows
                  changed.add(path)
                  print(f'inserted {path} {row_id}')
                  continue

              if mode != 'update':
                  sys.exit(f'op {i}: unknown mode {mode}')

              sets = op.get('sets')
              if not isinstance(sets, dict) or not sets:
                  sets = {}
                  if op.get('column'):
                      sets[str(op['column'])] = op.get('value', '')
                  if op.get('column_2'):
                      sets[str(op['column_2'])] = op.get('value_2', '')
              if not sets:
                  sys.exit(f'op {i}: update needs sets or column/value')

              hits = 0
              for row in rows[1:]:
                  if not row:
                      continue
                  while len(row) < len(header):
                      row.append('')
                  if row[i_id] != row_id:
                      continue
                  for col, val in sets.items():
                      if col not in header:
                          sys.exit(f'op {i}: column not in header: {col}')
                      row[header.index(col)] = decode(val)
                  hits += 1
              if hits != 1:
                  sys.exit(f'op {i}: expected 1 row for {row_id!r}, found {hits}')
              changed.add(path)
              print(f'updated {path} {row_id} {list(sets)}')

          for path, rows in files.items():
              if path not in changed:
                  continue
              with path.open('w', newline='', encoding='utf-8') as f:
                  csv.writer(f, lineterminator='\n').writerows(rows)
          print('changed', ' '.join(str(p) for p in sorted(changed)))
          PY

      - name: Refresh manifests
        run: python3 scripts/data_schema.py manifest

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- data
          if git diff --cached --quiet; then
            echo "No change"
            exit 0
          fi
          git commit -m "Patch CSV line items"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
