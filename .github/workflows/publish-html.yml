name: Publish HTML App

on:
  push:
    paths:
      - 'app_upload/READY'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Assemble HTML
        shell: bash
        run: |
          if [ ! -f app_upload/READY ]; then
            echo "No READY marker; nothing to publish."
            exit 0
          fi
          cat app_upload/part-* | base64 --decode > app_upload/app.html.gz
          gzip -dc app_upload/app.html.gz > WH40k_11th.html
          VERSION=$(grep -oE 'const APP_VERSION = "[0-9]+(\.[0-9]+)*"' WH40k_11th.html | head -1 | sed -E 's/.*"([0-9.]+)"/\1/')
          test -n "$VERSION"
          grep -q "<title>WH40k 11th V${VERSION}</title>" WH40k_11th.html
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Commit published app
        if: hashFiles('app_upload/READY') != ''
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add WH40k_11th.html
          git rm -r app_upload
          git commit -m "App v${VERSION}"
          git push
