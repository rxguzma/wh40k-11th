name: Publish HTML App

on:
  push:
    branches: [main]
    paths:
      - 'WH40k_11th.html'
      - 'scripts/publish_html.py'
      - '.github/workflows/publish-html.yml'

permissions:
  contents: write

concurrency:
  group: publish-html-main
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Validate and retain the latest ten HTML versions
        run: python3 scripts/publish_html.py

      - name: Commit the release index and snapshots
        shell: bash
        run: |
          set -euo pipefail
          git add versions
          if git diff --cached --quiet; then
            echo "Release files already match the canonical HTML."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Publish HTML version history"
          git push origin HEAD:main
