name: Migrate Weapon Abilities

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/migrate-weapon-abilities.yml'

permissions:
  contents: write

concurrency:
  group: wh40k-weapon-ability-migration
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Install schema validator
        run: python3 -m pip install --disable-pip-version-check --quiet 'jsonschema==4.25.1'

      - name: Migrate weapon abilities
        run: python3 scripts/migrate_weapon_abilities_v1.py

      - name: Compile permanent tooling
        run: |
          python3 -m py_compile scripts/entity_ops.py
          python3 -m py_compile scripts/split_weapon_abilities_v1.py
          python3 -m py_compile scripts/validate_weapon_abilities.py
          python3 - <<'PY'
          import json
          schema = json.load(open('schemas/entity-ops.schema.json', encoding='utf-8'))
          assert 'weaponAbility' in schema['$defs']
          assert 'weapon_abilities' in schema['$defs']['weaponAdd']['properties']
          assert 'Weapon_Abilities' not in schema['$defs']['weaponAdd']['properties']
          print('Entity Ops weapon schema: OK')
          PY

      - name: Generate compatibility outputs
        run: |
          python3 scripts/split_detachments_v2.py
          python3 scripts/split_units_v1.py
          python3 scripts/split_weapon_abilities_v1.py
          python3 scripts/split_loadouts_v1.py
          python3 scripts/split_effects_v1.py

      - name: Require unchanged weapon compatibility output
        run: git diff --exit-code -- data/marines/Weapon_Stats.csv data/orks/Weapon_Stats.csv data/nids/Weapon_Stats.csv

      - name: Validate repository data
        run: |
          python3 scripts/data_schema.py normalize
          python3 scripts/audit_references.py
          python3 scripts/data_schema.py validate
          python3 scripts/validate_unit_relations.py
          python3 scripts/validate_weapon_abilities.py
          python3 scripts/validate_loadouts.py
          python3 scripts/validate_effects.py
          python3 scripts/data_schema.py manifest

      - name: Validate Entity Ops against migrated data
        env:
          ENTITY_OPS_JSON: '{"version":1,"operations":[]}'
        run: python3 scripts/entity_ops.py

      - name: Commit migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- data scripts/entity_ops.py schemas/entity-ops.schema.json .github/workflows/data-schema.yml .github/workflows/entity-ops.yml
          if git diff --cached --quiet; then
            echo "Weapon ability migration already current"
            exit 0
          fi
          git commit -m "Normalize weapon abilities"
          git pull --rebase origin main
          git push
