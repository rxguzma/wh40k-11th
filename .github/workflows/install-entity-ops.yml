name: Install Entity Ops

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/install-entity-ops.yml'

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install assets
        run: |
          python3 scripts/install_entity_ops_assets.py
          python3 -m py_compile scripts/entity_ops.py
          python3 - <<'PY'
          import json
          schema=json.load(open('schemas/entity-ops.schema.json', encoding='utf-8'))
          assert schema.get('$schema') == 'https://json-schema.org/draft/2020-12/schema'
          assert len(schema['$defs']['operation']['oneOf']) == 33
          print('schema structure: OK')
          PY
      - name: Commit assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- scripts/entity_ops.py schemas/entity-ops.schema.json
          git commit -m "Add schema-first entity operations engine"
          git pull --rebase origin main
          git push
