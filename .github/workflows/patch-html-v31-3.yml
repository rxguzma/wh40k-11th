name: Patch HTML V31.3

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-html-v31-3.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Patch and validate V31.3
        run: python3 scripts/patch_html_v31_3.py

      - name: Commit V31.3 canonical HTML
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add WH40k_11th.html
          git commit -m "Fix unit plus panel in V31.3"
          git push origin HEAD:main
