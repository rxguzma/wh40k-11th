name: Remove Legacy Alias Compatibility
# Final cleanup run after removing stale Entity Ops child spec.

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/remove-legacy-alias-compat.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Install schema validator
        run: python3 -m pip install --disable-pip-version-check --quiet 'jsonschema==4.25.1'

      - name: Remove legacy compatibility
        run: |
          python3 scripts/remove_legacy_alias_compat.py
          python3 scripts/fix_legacy_cleanup_transforms.py

      - name: Compile permanent tooling
        run: |
          python3 -m py_compile scripts/entity_ops.py
          python3 -m py_compile scripts/split_loadouts_v1.py
          python3 -m py_compile scripts/validate_loadouts.py
          python3 -m py_compile scripts/validate_no_new_names.py
          python3 - <<'PY'
          import json
          schema = json.load(open('schemas/entity-ops.schema.json', encoding='utf-8'))
          assert 'legacyUnit' not in schema['$defs']
          for name in ('loadoutAdd', 'nestedLoadoutAdd', 'loadoutChange'):
              assert 'legacy_units' not in schema['$defs'][name]['properties']
          print('Entity Ops legacy loadout contract removed')
          PY

      - name: Generate compatibility outputs
        run: |
          python3 scripts/split_detachments_v2.py
          python3 scripts/split_units_v1.py
          python3 scripts/split_weapon_abilities_v1.py
          python3 scripts/split_loadouts_v1.py
          python3 scripts/split_effects_v1.py

      - name: Validate repository data
        run: |
          python3 scripts/data_schema.py normalize
          python3 scripts/audit_references.py
          python3 scripts/data_schema.py validate
          python3 scripts/validate_unit_relations.py
          python3 scripts/validate_weapon_abilities.py
          python3 scripts/validate_loadouts.py
          python3 scripts/validate_effects.py
          python3 scripts/validate_no_new_names.py
          python3 scripts/data_schema.py manifest

      - name: Validate Entity Ops
        env:
          ENTITY_OPS_JSON: '{"version":1,"operations":[]}'
        run: python3 scripts/entity_ops.py

      - name: Require no legacy compatibility remains
        run: |
          test ! -e data/universal/Entity_Aliases.csv
          test ! -e scripts/validate_aliases.py
          for army in marines orks nids; do
            test ! -e "data/$army/Loadout_Legacy_Units.csv"
            test "$(wc -l < "data/$army/Unit_Loadout_Legacy_Units.csv")" -eq 1
          done
          ! grep -R "Entity_Aliases\|resolve_entity_alias\|Loadout_Legacy_Units\|legacy_units" scripts/entity_ops.py schemas/entity-ops.schema.json data/CSV_SCHEMA.csv

      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- data scripts/entity_ops.py scripts/split_loadouts_v1.py scripts/validate_loadouts.py scripts/validate_aliases.py scripts/validate_no_new_names.py schemas/entity-ops.schema.json
          if git diff --cached --quiet; then
            echo "Legacy compatibility already removed"
            exit 0
          fi
          git commit -m "Remove legacy unit compatibility"
          git pull --rebase origin main
          git push
