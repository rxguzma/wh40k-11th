name: Entity Ops

# LLM CONTRACT
# Entity CRUD only: edit the fallback JSON between the markers below.
# Contract: schemas/entity-ops.schema.json (version 1)
# Operations: add | change | delete
# Generated compatibility files/columns are never direct targets.
# Loadout CHANGE/DELETE uses one Loadout_Option_ID.
# ADD IDs use UPPER_SNAKE_CASE and cannot contain NEW.
# Historical IDs are not resolved; operations target canonical IDs only.

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/entity-ops.yml'
  workflow_dispatch:
    inputs:
      operations:
        description: Entity Ops JSON payload
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: wh40k-entity-ops
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install schema validator
        run: python3 -m pip install --disable-pip-version-check --quiet 'jsonschema==4.25.1'

      - name: Apply entity operations
        env:
          INPUT_ENTITY_OPS: ${{ inputs.operations }}
          # BEGIN FALLBACK_ENTITY_OPS
          FALLBACK_ENTITY_OPS: >-
            {"version":1,"operations":[{"operation":"add","entity_type":"weapon","army":"nids","data":{"Weapon_ID":"TYRANID_PRIME_WITH_LASH_WHIP_RENDING_CLAW","Weapon_Name":"Rending claw","R":"-","A":4,"WS":"2+","St":8,"AP":-2,"D":3}},{"operation":"add","entity_type":"weapon","army":"nids","data":{"Weapon_ID":"TYRANID_PRIME_WITH_LASH_WHIP_LASH_WHIP","Weapon_Name":"Lash whip","R":"-","A":8,"WS":"2+","St":4,"AP":-2,"D":1,"weapon_abilities":[{"Ability_Type":"EXTRA ATTACKS","Sort_Order":1}]}},{"operation":"add","entity_type":"weapon","army":"nids","data":{"Weapon_ID":"TYRANID_PRIME_WITH_LASH_WHIP_SCYTHING_TALONS","Weapon_Name":"Scything talons","R":"-","A":6,"WS":"2+","St":6,"AP":-2,"D":2}},{"operation":"add","entity_type":"ability","army":"nids","data":{"Ability_ID":"ALPHA_WARRIOR_TYRANID_PRIME_WITH_LASH_WHIP","Ability_Name":"Alpha Warrior","Short_Description":"Unit weapons gain [SUSTAINED HITS 1].","Long_Description":"Weapons equipped by models in this model's unit have the [SUSTAINED HITS 1] ability.","Order":0}},{"operation":"add","entity_type":"ability","army":"nids","data":{"Ability_ID":"AGGRESSIVE_LEADER_BEAST","Ability_Name":"Aggressive Leader-beast","Short_Description":"Enemy shoots and destroys a model: surge move up to D6\".","Long_Description":"In your opponent's Shooting phase, when an enemy unit has shot, if a model in this unit was destroyed by those attacks, this unit can make a surge move of up to D6\".","Order":0}},{"operation":"add","entity_type":"ability","army":"nids","data":{"Ability_ID":"LEADER_TYRANID_PRIME_WITH_LASH_WHIP","Ability_Name":"Leader: Tyranid Prime with Lash Whip","Short_Description":"LEADER: HORMAGAUNTS, TERMAGANTS, TYRANID WARRIORS WITH MELEE BIO-WEAPONS, TYRANID WARRIORS WITH RANGED BIO-WEAPONS","Long_Description":"LEADER: HORMAGAUNTS, TERMAGANTS, TYRANID WARRIORS WITH MELEE BIO-WEAPONS, TYRANID WARRIORS WITH RANGED BIO-WEAPONS","Order":9}},{"operation":"add","entity_type":"unit","army":"nids","data":{"Unit_ID":"TYRANID_PRIME_WITH_LASH_WHIP","Unit_Name":"Tyranid Prime with Lash Whip","M":10,"T":5,"SV":"3+","W":6,"LD":"7+","OC":1,"Keywords":"INFANTRY, CHARACTER, GREAT DEVOURER, SYNAPSE, TYRANID PRIME WITH LASH WHIP","Hyperlink":"https://wahapedia.ru/wh40k11ed/factions/tyranids/Tyranid-Prime-with-Lash-Whip","abilities":["ALPHA_WARRIOR_TYRANID_PRIME_WITH_LASH_WHIP","AGGRESSIVE_LEADER_BEAST","LEADER_TYRANID_PRIME_WITH_LASH_WHIP"],"weapons":["TYRANID_PRIME_WITH_LASH_WHIP_RENDING_CLAW","TYRANID_PRIME_WITH_LASH_WHIP_LASH_WHIP","TYRANID_PRIME_WITH_LASH_WHIP_SCYTHING_TALONS"],"points":[{"Cost":75,"Sort_Order":1}]}}]}
          # END FALLBACK_ENTITY_OPS
        run: |
          if [ -n "$INPUT_ENTITY_OPS" ]; then
            export ENTITY_OPS_JSON="$INPUT_ENTITY_OPS"
          else
            export ENTITY_OPS_JSON="$FALLBACK_ENTITY_OPS"
          fi
          python3 scripts/entity_ops.py

      - name: Generate compatibility outputs
        run: |
          python3 scripts/split_detachments_v2.py
          python3 scripts/split_units_v1.py
          python3 scripts/split_weapon_abilities_v1.py
          python3 scripts/split_loadouts_v1.py

      - name: Validate repository data
        run: |
          python3 scripts/data_schema.py normalize
          python3 scripts/audit_references.py
          python3 scripts/data_schema.py validate
          python3 scripts/validate_unit_relations.py
          python3 scripts/validate_weapon_abilities.py
          python3 scripts/validate_loadouts.py
          python3 scripts/validate_no_new_names.py
          python3 scripts/data_schema.py manifest

      - name: Commit transaction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- data
          if git diff --cached --quiet; then
            echo "Entity Ops validation-only run: no data changes"
            exit 0
          fi
          git commit -m "Apply entity operations"
          git pull --rebase origin main
          git push
