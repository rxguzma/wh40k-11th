name: Upload HTML

on:
  push:
    branches: [main]
    paths:
      - '.upload/v26_4/complete'

permissions:
  contents: write

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rebuild HTML
        shell: bash
        run: |
          set -euo pipefail
          cat .upload/v26_4/part-* > /tmp/v26_4.html.gz.b64
          base64 --decode /tmp/v26_4.html.gz.b64 | gzip --decompress > WH40k_11th_V26.4.html
          echo '7e4b78f9c1f19b96172486e58ec2394c824e01b13d7af596c6fc058de1791fa6  WH40k_11th_V26.4.html' | sha256sum --check --strict

      - name: Commit HTML and remove staging files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -r .upload/v26_4
          git rm .github/workflows/upload-html.yml
          git add WH40k_11th_V26.4.html
          git commit -m 'Add WH40k_11th_V26.4.html'
          git push
