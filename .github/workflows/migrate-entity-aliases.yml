name: Migrate Entity Aliases

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/migrate-entity-aliases.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Install schema validator
        run: python3 -m pip install --disable-pip-version-check --quiet 'jsonschema==4.25.1'

      - name: Migrate entity IDs and aliases
        run: python3 scripts/migrate_entity_aliases_v3.py

      - name: Compile permanent tooling
        run: |
          python3 -m py_compile scripts/entity_ops.py
          python3 -m py_compile scripts/validate_aliases.py
          python3 -m py_compile scripts/validate_no_new_names.py
          python3 - <<'PY'
          import json
          schema = json.load(open('schemas/entity-ops.schema.json', encoding='utf-8'))
          assert 'canonicalId' in schema['$defs']
          print('Entity Ops canonical ID schema: OK')
          PY

      - name: Generate compatibility outputs
        run: |
          python3 scripts/split_detachments_v2.py
          python3 scripts/split_units_v1.py
          python3 scripts/split_weapon_abilities_v1.py
          python3 scripts/split_loadouts_v1.py
          python3 scripts/split_effects_v1.py

      - name: Validate repository data
        run: |
          python3 scripts/data_schema.py normalize
          python3 scripts/audit_references.py
          python3 scripts/data_schema.py validate
          python3 scripts/validate_unit_relations.py
          python3 scripts/validate_weapon_abilities.py
          python3 scripts/validate_loadouts.py
          python3 scripts/validate_effects.py
          python3 scripts/validate_aliases.py
          python3 scripts/validate_no_new_names.py
          python3 scripts/data_schema.py manifest

      - name: Validate Entity Ops against migrated data
        env:
          ENTITY_OPS_JSON: '{"version":1,"operations":[]}'
        run: python3 scripts/entity_ops.py

      - name: Commit migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- data scripts/entity_ops.py scripts/validate_aliases.py scripts/validate_no_new_names.py schemas/entity-ops.schema.json
          if git diff --cached --quiet; then
            echo "Entity alias migration already current"
            exit 0
          fi
          git commit -m "Normalize entity IDs and add aliases"
          git pull --rebase origin main
          git push
