name: Apply Orks Easy Tag Batch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-orks-easy-tags-batch.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply easy Orks tags
        run: |
          python3 <<'PY'
          import csv, re
          from pathlib import Path

          root = Path('.')

          def load(path):
              with path.open(encoding='utf-8-sig', newline='') as f:
                  reader = csv.DictReader(f)
                  return list(reader.fieldnames or []), list(reader)

          def save(path, fields, rows):
              with path.open('w', encoding='utf-8', newline='') as f:
                  writer = csv.DictWriter(f, fieldnames=fields, lineterminator='\n')
                  writer.writeheader()
                  writer.writerows(rows)

          def parse_brackets(value):
              return re.findall(r'\[([^\]]+)\]', value or '')

          def add_pairs(row, pairs):
              tags = parse_brackets(row.get('Tags', ''))
              cats = parse_brackets(row.get('Tag Categories', ''))
              if len(tags) != len(cats):
                  raise SystemExit(f"Mismatched existing Tags/Tag Categories on {row}")
              existing = list(zip(tags, cats))
              added = 0
              for pair in pairs:
                  if pair not in existing:
                      existing.append(pair)
                      added += 1
              row['Tags'] = ' '.join(f'[{t}]' for t, _ in existing)
              row['Tag Categories'] = ' '.join(f'[{c}]' for _, c in existing)
              return added

          ability_updates = {
              'DA_BIGGEST_AND_DA_BEST': [('+4 A','Melee - Weapon Stats')],
              'PULSA_ROKKIT': [('+1 AP','Range - Weapon Stats'),('LETHAL HITS','Range - Weapon Rules')],
              'SPIRIT_OF_GORK': [('+1 S','Melee - Weapon Stats'),('LETHAL HITS','Melee - Weapon Rules')],
              'SPIRIT_OF_GORK_PSYCHIC': [('+1 S','Melee - Weapon Stats'),('LETHAL HITS','Melee - Weapon Rules')],
              'SUPER_RUNTS': [('+1 A','Melee - Weapon Stats'),('+1 S','Melee - Weapon Stats')],
              'BRUTAL_IMPACT': [('+1 D','Melee - Weapon Stats'),('+1 D','Range - Weapon Stats')],
              'BUST_EM': [('LETHAL HITS','Melee - Weapon Rules'),('LETHAL HITS','Range - Weapon Rules')],
              'FINDER_KEEPERZ': [('+1 AP','Range - Weapon Stats')],
              'HIGH_SPEED_CARNAGE': [('+1 S','Melee - Weapon Stats'),('+1 D','Melee - Weapon Stats')],
              'WARPATH': [('LETHAL HITS','Melee - Weapon Rules')],
              'TIDE_OF_MUSCLE': [('LETHAL HITS','Melee - Weapon Rules')],
              'NAZDREGS_KNOW_WOTZ': [('IGNORES COVER','Range - Weapon Rules')],
              'EVEN_MORE_DAKKA': [('SUSTAINED HITS 1','Range - Weapon Rules')],
              'KUSTOM_DAKKA': [('IGNORES COVER','Range - Weapon Rules')],
              'SHOOTY_POWER_TRIP': [('+1 S','Range - Weapon Stats'),('+1 A','Range - Weapon Stats')],
              'MIGHT_IS_RIGHT': [('+3 A','Melee - Weapon Stats'),('+2 S','Melee - Weapon Stats')],
              'DAKKABLITZ': [('+6 A','Range - Weapon Stats')],
              'BLITZ_DEM_GITS': [('+6 A','Range - Weapon Stats')],
              'SPECIAL_DOSE': [('+6 M”','Unit Stats')],
              'DRIVE_BY_DAKKA_2': [('+1 AP','Range - Weapon Stats')],
              'HUNT_THEM_DOWN': [('ANTI-VEHICLE 3+','Melee - Weapon Rules')],
              'ROKKIT_CHARGE': [('+1 A','Melee - Weapon Stats'),('+1 S','Melee - Weapon Stats')],
              'PAIRED_KRUMPAS': [('RE-ROLL ALL HITS','Melee - Combat Modifiers'),('RE-ROLL ALL WOUNDS','Melee - Combat Modifiers')],
          }

          strat_updates = {
              'orks_war_horde_stratagem_hit_em_harder_1cp': [('LETHAL HITS','Melee - Weapon Rules')],
              'orks_war_horde_stratagem_mow_em_down_1cp': [('CLEAVE 1','Melee - Weapon Rules')],
              'orks_war_horde_stratagem_fungus_fuel_injection_1cp': [('+2 M”','Unit Stats')],
              'orks_war_horde_stratagem_close_range_dakka_1cp': [('RAPID FIRE 1','Range - Weapon Rules')],
              'orks_freebooter_krew_stratagem_deck_fraggers_1cp': [('BLAST','Range - Weapon Rules')],
              'orks_rollin_deff_stratagem_devastating_drift_1cp': [('CLEAVE 1','Melee - Weapon Rules')],
              'orks_more_dakka_stratagem_long_uncontrolled_bursts_1cp': [('IGNORES COVER','Range - Weapon Rules')],
              'orks_freebooter_krew_stratagem_rolling_loot_heap_1cp': [('ANTI-VEHICLE 4+','Range - Weapon Rules')],
              'orks_more_dakka_stratagem_speshul_shells_1cp': [('+1 AP','Range - Weapon Stats')],
              'orks_green_tide_stratagem_unbridled_carnage_1cp': [('+1 A','Melee - Weapon Stats')],
              'orks_madcap_meks_stratagem_vindictive_artillerists_1cp': [('LETHAL HITS','Range - Weapon Rules'),('SUSTAINED HITS 1','Range - Weapon Rules')],
              'orks_kult_of_speed_stratagem_dakkastorm_1cp': [('SUSTAINED HITS 1','Range - Weapon Rules')],
              'orks_shoota_boyz_stratagem_clovin_dakka_1cp': [('+1 AP','Range - Weapon Stats')],
              'orks_shoota_boyz_stratagem_never_enough_dakka_1cp': [('SUSTAINED HITS 1','Range - Weapon Rules')],
              'orks_freebooter_krew_stratagem_boardin_rush_1cp': [('+6 M”','Unit Stats')],
          }

          total_added = 0

          abilities_path = root / 'data' / 'orks' / 'Abilities.csv'
          fields, rows = load(abilities_path)
          found = set()
          for row in rows:
              key = (row.get('Ability_ID') or '').strip()
              if key in ability_updates:
                  total_added += add_pairs(row, ability_updates[key])
                  found.add(key)
          missing = sorted(set(ability_updates) - found)
          if missing:
              raise SystemExit(f'Missing Ability_IDs: {missing}')
          save(abilities_path, fields, rows)

          strat_path = root / 'data' / 'orks' / 'Stratagems.csv'
          sfields, srows = load(strat_path)
          found = set()
          for row in srows:
              key = (row.get('Stratagem_ID') or '').strip()
              if key in strat_updates:
                  total_added += add_pairs(row, strat_updates[key])
                  found.add(key)
          missing = sorted(set(strat_updates) - found)
          if missing:
              raise SystemExit(f'Missing Stratagem_IDs: {missing}')
          save(strat_path, sfields, srows)

          # Extend Universal stat-tag definitions needed by this batch.
          tag_path = root / 'data' / 'universal' / 'Tag_Definitions.csv'
          tfields, trows = load(tag_path)
          existing_ids = {(r.get('Tag_ID') or '').strip() for r in trows}
          max_sort = max([int(r.get('Sort_Order') or 0) for r in trows] or [0])
          defs = [
              ('PLUS_4_A_MELEE','+4 A','+4 Attacks','Melee - Weapon Stats','Melee Weapons','Adds 4 Attacks to each Melee Weapon on the Unit.','TRUE','WEAPON_STAT','MELEE','A','ADD','4'),
              ('PLUS_2_S_MELEE','+2 S','+2 Strength','Melee - Weapon Stats','Melee Weapons','Adds 2 Strength to each Melee Weapon on the Unit.','TRUE','WEAPON_STAT','MELEE','S','ADD','2'),
              ('PLUS_1_A_RANGE','+1 A','+1 Attack','Range - Weapon Stats','Ranged Weapons','Adds 1 Attack to each Ranged Weapon on the Unit.','TRUE','WEAPON_STAT','RANGE','A','ADD','1'),
              ('PLUS_6_A_RANGE','+6 A','+6 Attacks','Range - Weapon Stats','Ranged Weapons','Adds 6 Attacks to each Ranged Weapon on the Unit.','TRUE','WEAPON_STAT','RANGE','A','ADD','6'),
              ('PLUS_1_S_RANGE','+1 S','+1 Strength','Range - Weapon Stats','Ranged Weapons','Adds 1 Strength to each Ranged Weapon on the Unit.','TRUE','WEAPON_STAT','RANGE','S','ADD','1'),
              ('PLUS_1_AP_RANGE','+1 AP','+1 AP','Range - Weapon Stats','Ranged Weapons','Improves the AP of each Ranged Weapon on the Unit by 1. Example: AP -1 becomes AP -2.','TRUE','WEAPON_STAT','RANGE','AP','IMPROVE','1'),
              ('PLUS_1_D_RANGE','+1 D','+1 Damage','Range - Weapon Stats','Ranged Weapons','Adds 1 Damage to each Ranged Weapon on the Unit.','TRUE','WEAPON_STAT','RANGE','D','ADD','1'),
              ('PLUS_6_M','+6 M”','+6 Movement','Unit Stats','Unit','Adds 6” Movement to the Unit.','TRUE','STAT','UNIT','M','ADD','6'),
          ]
          for d in defs:
              if d[0] in existing_ids:
                  continue
              max_sort += 1
              row = dict.fromkeys(tfields, '')
              vals = list(d) + [str(max_sort)]
              for field, value in zip(tfields, vals):
                  row[field] = value
              trows.append(row)
          save(tag_path, tfields, trows)

          if total_added != 50:
              raise SystemExit(f'Expected 50 new tag assignments, added {total_added}')
          print(f'Added {total_added} tag assignments')
          PY

      - name: Normalize CSV headers
        run: python3 scripts/data_schema.py normalize

      - name: Validate data
        run: python3 scripts/data_schema.py validate

      - name: Regenerate manifests
        run: python3 scripts/data_schema.py manifest

      - name: Commit data changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- data
          if git diff --cached --quiet; then
            echo "No change"
            exit 0
          fi
          git commit -m "Tag more easy Orks rules"
          git push
