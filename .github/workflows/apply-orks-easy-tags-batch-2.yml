name: Apply Next Orks Easy Tag Batch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-orks-easy-tags-batch-2.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply easy Orks tags
        run: |
          python3 <<'PY'
          import csv, re
          from pathlib import Path

          root = Path('.')

          def load(path):
              with path.open(encoding='utf-8-sig', newline='') as f:
                  reader = csv.DictReader(f)
                  return list(reader.fieldnames or []), list(reader)

          def save(path, fields, rows):
              with path.open('w', encoding='utf-8', newline='') as f:
                  writer = csv.DictWriter(f, fieldnames=fields, lineterminator='\n')
                  writer.writeheader()
                  writer.writerows(rows)

          def parse_brackets(value):
              return re.findall(r'\[([^\]]+)\]', value or '')

          def add_pairs(row, pairs):
              tags = parse_brackets(row.get('Tags', ''))
              cats = parse_brackets(row.get('Tag Categories', ''))
              if len(tags) != len(cats):
                  raise SystemExit(f"Mismatched Tags/Tag Categories on {row}")
              existing = list(zip(tags, cats))
              added = 0
              for pair in pairs:
                  if pair not in existing:
                      existing.append(pair)
                      added += 1
              row['Tags'] = ' '.join(f'[{t}]' for t, _ in existing)
              row['Tag Categories'] = ' '.join(f'[{c}]' for _, c in existing)
              return added

          ability_updates = {
              'FUEL_MIXA_GROT': [('+6 M”', 'Unit Stats')],
              'RIDIN_WIV_DA_HERD': [('+4 M”', 'Unit Stats')],
              'THROTTLEROCKKIT_SHOKKA_ENGINE': [('+6 M”', 'Unit Stats')],
              'BURNA_BOMB': [('IGNORES COVER', 'Range - Weapon Rules')],
              'HUNT_THEM_DOWN': [('ANTI-MONSTER 3+', 'Melee - Weapon Rules')],
              'ROKKIT_CHARGE': [('HAZARDOUS', 'Melee - Weapon Rules')],
              'DAMAGED_1_6': [('-1 TO HIT', 'Melee - Combat Modifiers'), ('-1 TO HIT', 'Range - Combat Modifiers')],
              'DAMAGED_7': [('-1 TO HIT', 'Melee - Combat Modifiers'), ('-1 TO HIT', 'Range - Combat Modifiers')],
              'FUEL_MIXA_GROB': [('+1 M”', 'Unit Stats')],
              'SHOKK_BOOSTA': [('+6 M”', 'Unit Stats')],
          }

          strat_updates = {
              'orks_madcap_meks_stratagem_vindictive_artillerists_1cp': [('HAZARDOUS', 'Range - Weapon Rules')],
              'orks_green_tide_stratagem_ere_we_go_1cp': [('+2 M”', 'Unit Stats')],
          }

          total_added = 0

          abilities_path = root / 'data' / 'orks' / 'Abilities.csv'
          fields, rows = load(abilities_path)
          found = set()
          for row in rows:
              key = (row.get('Ability_ID') or '').strip()
              if key in ability_updates:
                  total_added += add_pairs(row, ability_updates[key])
                  found.add(key)
          missing = sorted(set(ability_updates) - found)
          if missing:
              raise SystemExit(f'Missing Ability_IDs: {missing}')
          save(abilities_path, fields, rows)

          strat_path = root / 'data' / 'orks' / 'Stratagems.csv'
          sfields, srows = load(strat_path)
          found = set()
          for row in srows:
              key = (row.get('Stratagem_ID') or '').strip()
              if key in strat_updates:
                  total_added += add_pairs(row, strat_updates[key])
                  found.add(key)
          missing = sorted(set(strat_updates) - found)
          if missing:
              raise SystemExit(f'Missing Stratagem_IDs: {missing}')
          save(strat_path, sfields, srows)

          tag_path = root / 'data' / 'universal' / 'Tag_Definitions.csv'
          tfields, trows = load(tag_path)
          if not any((r.get('Tag_ID') or '').strip() == 'PLUS_4_M' for r in trows):
              max_sort = max([int(r.get('Sort_Order') or 0) for r in trows] or [0]) + 1
              row = dict.fromkeys(tfields, '')
              values = {
                  'Tag_ID': 'PLUS_4_M',
                  'Display_Tag': '+4 M”',
                  'Title': '+4 Movement',
                  'Category': 'Unit Stats',
                  'Affects': 'Unit',
                  'Description': 'Adds 4” Movement to the Unit.',
                  'Editable': 'TRUE',
                  'Effect_Type': 'STAT',
                  'Target': 'UNIT',
                  'Stat': 'M',
                  'Operation': 'ADD',
                  'Value': '4',
                  'Sort_Order': str(max_sort),
              }
              row.update(values)
              trows.append(row)
              save(tag_path, tfields, trows)

          if total_added != 14:
              raise SystemExit(f'Expected 14 new tag assignments, added {total_added}')
          print(f'Added {total_added} tag assignments')
          PY

      - name: Normalize CSV headers
        run: python3 scripts/data_schema.py normalize

      - name: Validate data
        run: python3 scripts/data_schema.py validate

      - name: Regenerate manifests
        run: python3 scripts/data_schema.py manifest

      - name: Commit data changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- data
          if git diff --cached --quiet; then
            echo "No change"
            exit 0
          fi
          git commit -m "Tag next easy Orks rules"
          git push
