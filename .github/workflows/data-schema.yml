name: Data Schema
# CSV ownership metadata is enforced by scripts/data_schema.py.
# Canonical loadouts use Loadout_Option_ID; Unit_Loadout_* remains generated compatibility.
# Canonical/display names cannot use New markers.
# Fresh-state model: no historical entity or loadout aliases are retained.

on:
  push:
    branches: [main]
    paths:
      - 'data/**/*.csv'
      - 'scripts/data_schema.py'
      - 'scripts/audit_references.py'
      - 'scripts/split_detachments_v2.py'
      - 'scripts/split_units_v1.py'
      - 'scripts/split_weapon_abilities_v1.py'
      - 'scripts/split_loadouts_v1.py'
      - 'scripts/validate_unit_relations.py'
      - 'scripts/validate_weapon_abilities.py'
      - 'scripts/validate_loadouts.py'
      - 'scripts/validate_ability_orders.py'
      - 'scripts/validate_cards_data.py'
      - 'scripts/validate_no_new_names.py'
      - '.github/workflows/data-schema.yml'
  pull_request:
    paths:
      - 'data/**/*.csv'
      - 'scripts/data_schema.py'
      - 'scripts/audit_references.py'
      - 'scripts/split_detachments_v2.py'
      - 'scripts/split_units_v1.py'
      - 'scripts/split_weapon_abilities_v1.py'
      - 'scripts/split_loadouts_v1.py'
      - 'scripts/validate_unit_relations.py'
      - 'scripts/validate_weapon_abilities.py'
      - 'scripts/validate_loadouts.py'
      - 'scripts/validate_ability_orders.py'
      - 'scripts/validate_cards_data.py'
      - 'scripts/validate_no_new_names.py'
      - '.github/workflows/data-schema.yml'
  workflow_run:
    workflows: ['Patch CSV']
    types: [completed]

permissions:
  contents: write

jobs:
  schema:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || 'main' }}

      - name: Sync legacy detachment compatibility table
        run: python3 scripts/split_detachments_v2.py

      - name: Sync legacy unit compatibility table
        run: python3 scripts/split_units_v1.py

      - name: Sync weapon ability compatibility column
        run: python3 scripts/split_weapon_abilities_v1.py

      - name: Sync legacy loadout compatibility table
        run: python3 scripts/split_loadouts_v1.py


      - name: Normalize schema
        run: python3 scripts/data_schema.py normalize

      - name: Audit references
        run: python3 scripts/audit_references.py

      - name: Validate data
        run: python3 scripts/data_schema.py validate

      - name: Validate normalized unit relationships
        run: python3 scripts/validate_unit_relations.py

      - name: Validate normalized weapon abilities
        run: python3 scripts/validate_weapon_abilities.py

      - name: Validate normalized loadouts
        run: python3 scripts/validate_loadouts.py


      - name: Validate canonical Ability orders
        run: python3 scripts/validate_ability_orders.py

      - name: Validate Cards data
        run: python3 scripts/validate_cards_data.py

      - name: Reject New naming in canonical data
        run: python3 scripts/validate_no_new_names.py

      - name: Build manifests
        run: python3 scripts/data_schema.py manifest

      - name: Require normalized data in pull requests
        if: github.event_name == 'pull_request'
        run: git diff --exit-code -- data

      - name: Commit normalized data and manifests
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- data
          if git diff --cached --quiet; then
            echo "Schema and manifests already current"
            exit 0
          fi
          git commit -m "Normalize CSV schema and refresh manifests"
          git push
