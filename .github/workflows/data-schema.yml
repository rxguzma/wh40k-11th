name: Data Schema

on:
  push:
    branches: [main]
    paths:
      - 'data/**/*.csv'
      - 'scripts/data_schema.py'
      - '.github/workflows/data-schema.yml'
  pull_request:
    paths:
      - 'data/**/*.csv'
      - 'scripts/data_schema.py'
      - '.github/workflows/data-schema.yml'

permissions:
  contents: write

jobs:
  schema:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && github.ref_name || github.event.pull_request.head.sha }}

      - name: Normalize validate and build manifests
        run: python3 scripts/data_schema.py all

      - name: Require normalized data in pull requests
        if: github.event_name == 'pull_request'
        run: git diff --exit-code -- data

      - name: Commit normalized data and manifests
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- data
          if git diff --cached --quiet; then
            echo "Schema and manifests already current"
            exit 0
          fi
          git commit -m "Normalize CSV schema and refresh manifests"
          git push
