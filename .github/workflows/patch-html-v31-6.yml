name: Patch HTML V31.6

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-html-v31-6.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Patch V31.6
        run: python3 scripts/patch_html_v31_6.py

      - name: Align eligibility schema
        run: python3 scripts/patch_schema_eligibility_v31_6.py

      - name: Normalize schema-backed CSVs
        run: python3 scripts/data_schema.py normalize

      - name: Regenerate manifests
        run: python3 scripts/data_schema.py manifests

      - name: Validate category eligibility data
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import csv
          from pathlib import Path
          path = Path('data/universal/Eligibility_Rules.csv')
          with path.open(encoding='utf-8', newline='') as handle:
              rows = list(csv.DictReader(handle))
          expected_header = ['Rule_ID', 'Item_Type', 'Required_Keywords', 'Any_Keywords', 'Excluded_Keywords']
          with path.open(encoding='utf-8', newline='') as handle:
              header = next(csv.reader(handle))
          assert header == expected_header, header
          by_type = {row['Item_Type'].strip().upper(): row for row in rows}
          assert by_type['ENHANCEMENT']['Excluded_Keywords'].strip().upper() == 'EPIC HERO'
          assert by_type['UPGRADE']['Excluded_Keywords'].strip().upper() == 'EPIC HERO'
          schema = Path('data/CSV_SCHEMA.csv').read_text(encoding='utf-8')
          for name in ('Eligibility_Rules.csv', 'Required_Keywords', 'Any_Keywords', 'Excluded_Keywords'):
              assert name in schema
          print('category eligibility data checks passed')
          PY

      - name: Publish version snapshot
        run: python3 scripts/publish_html.py

      - name: Verify expected data changes only
        shell: bash
        run: |
          set -euo pipefail
          unexpected=$(git status --porcelain | awk '{print $2}' | grep '^data/' | grep -v '^data/CSV_SCHEMA.csv$' | grep -v '^data/universal/Eligibility_Rules.csv$' | grep -v '/manifest.json$' || true)
          if [ -n "$unexpected" ]; then
            echo "Unexpected normalized data changes:"
            echo "$unexpected"
            exit 1
          fi

      - name: Commit V31.6 HTML and eligibility data
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add WH40k_11th.html versions data/CSV_SCHEMA.csv data/universal/Eligibility_Rules.csv data/*/manifest.json
          git commit -m "Add data-driven category eligibility in V31.6"
          git push origin HEAD:main
