name: Debug View Plus
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/debug-view-plus.yml'
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect plus code
        shell: bash
        run: |
          set -euo pipefail
          echo '=== toggle section ==='
          grep -n -C 25 'toggleSection(index' WH40k_11th.html || true
          echo '=== stratagem selection ==='
          grep -n -C 35 'toggleViewEditRosterEntryStratagemSelection' WH40k_11th.html || true
          echo '=== active roster lookup ==='
          grep -n -C 10 'function getActiveRoster' WH40k_11th.html || true
