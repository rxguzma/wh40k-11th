name: Debug View Plus
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/debug-view-plus.yml'
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect plus code
        shell: bash
        run: |
          set -euo pipefail
          echo '=== category add buttons ==='
          grep -n -C 10 'category-add-button' WH40k_11th.html || true
          echo '=== view detail panel ==='
          grep -n -C 25 'function renderRosterUnitDetailPanel' WH40k_11th.html || true
          echo '=== render roster unit panel calls ==='
          grep -n -C 12 'renderRosterUnitDetailPanel' WH40k_11th.html || true
          echo '=== getViewEditRoster ==='
          grep -n -C 15 'function getViewEditRoster' WH40k_11th.html || true
