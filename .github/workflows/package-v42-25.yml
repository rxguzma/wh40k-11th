name: Package V42.25

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/package-v42-25.yml'

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        with:
          name: WH40k_11th_V42.25
          path: tmp/generated/WH40k_11th_V42.25.html
          if-no-files-found: error
          retention-days: 1
