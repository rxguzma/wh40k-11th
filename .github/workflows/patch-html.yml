name: Patch HTML App

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-html.yml'

permissions:
  contents: read

concurrency:
  group: patch-html-main
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Inspect Old Edit point calculation
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          text=Path('WH40k_11th.html').read_text(encoding='utf-8')
          needles=['edit-unit-points','getRosterPoints','PointOptions','pointOptions','Points','points']
          for needle in needles:
              print('\n###',needle)
              starts=[m.start() for m in re.finditer(re.escape(needle), text)]
              for pos in starts[:30]:
                  a=max(0,pos-700); b=min(len(text),pos+1200)
                  print(text[a:b].replace('\n',' ')[:1900])
                  print('\n---')
          print('\n### point-related function declarations')
          for m in re.finditer(r'function\s+([A-Za-z0-9_$]*[Pp]oint[A-Za-z0-9_$]*)\s*\([^)]*\)', text):
              pos=m.start(); print(text[max(0,pos-300):min(len(text),pos+1400)].replace('\n',' ')); print('\n---')
          PY
