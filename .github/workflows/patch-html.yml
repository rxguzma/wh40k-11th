name: Patch HTML App

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-html.yml'

permissions:
  contents: read

concurrency:
  group: patch-html-main
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Validate existing V31.107
        run: |
          python3 scripts/publish_html.py --root .
          git diff --exit-code -- WH40k_11th.html versions
