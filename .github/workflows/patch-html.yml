name: Patch HTML App

on:
  push:
    branches: [main]
    paths:
      - 'scripts/patch_html_v31_148_new_view_ability_unit_gate.py'
      - '.github/workflows/patch-html.yml'

permissions:
  contents: write

concurrency:
  group: patch-html-main
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Build V31.148 Ability-owned Unit stat gate
        run: python3 scripts/patch_html_v31_148_new_view_ability_unit_gate.py

      - name: Validate and generate release history
        run: python3 scripts/publish_html.py --root .

      - name: Commit HTML and release history
        shell: bash
        run: |
          set -euo pipefail
          git add WH40k_11th.html versions
          if git diff --cached --quiet; then
            echo "No HTML changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+rxguzma@users.noreply.github.com"
          git commit -m "Build V31.148 Ability-owned Unit stat gate"
          git push origin HEAD:main
