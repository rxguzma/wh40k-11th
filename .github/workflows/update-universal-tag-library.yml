name: Update Universal Tag Library

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-universal-tag-library.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update Tag Definitions and schema
        run: |
          python3 <<'PY'
          import csv
          from pathlib import Path

          root = Path('.')
          tag_path = root / 'data' / 'universal' / 'Tag_Definitions.csv'
          tag_header = [
              'Tag_ID','Display_Tag','Title','Category','Affects','Description','Editable',
              'Effect_Type','Target','Stat','Operation','Value','Sort_Order'
          ]
          tag_rows = [
              ['PLUS_1_W','+1 W','+1 Wound','Unit Stats','Unit','Adds 1 Wound to the Unit.','TRUE','STAT','UNIT','W','ADD','1','1'],
              ['PLUS_1_T','+1 T','+1 Toughness','Unit Stats','Unit','Adds 1 Toughness to the Unit.','TRUE','STAT','UNIT','T','ADD','1','2'],
              ['PLUS_1_OC','+1 OC','+1 Objective Control','Unit Stats','Unit','Adds 1 Objective Control to the Unit.','TRUE','STAT','UNIT','OC','ADD','1','3'],
              ['PLUS_1_M','+1 M”','+1 Movement','Unit Stats','Unit','Adds 1” Movement to the Unit.','TRUE','STAT','UNIT','M','ADD','1','4'],
              ['PLUS_2_M','+2 M”','+2 Movement','Unit Stats','Unit','Adds 2” Movement to the Unit.','TRUE','STAT','UNIT','M','ADD','2','5'],
              ['PLUS_1_A_MELEE','+1 A','+1 Attack','Melee - Weapon Stats','Melee Weapons','Adds 1 Attack to each Melee Weapon on the Unit.','TRUE','WEAPON_STAT','MELEE','A','ADD','1','6'],
              ['PLUS_1_S_MELEE','+1 S','+1 Strength','Melee - Weapon Stats','Melee Weapons','Adds 1 Strength to each Melee Weapon on the Unit.','TRUE','WEAPON_STAT','MELEE','S','ADD','1','7'],
              ['PLUS_1_AP_MELEE','+1 AP','+1 AP','Melee - Weapon Stats','Melee Weapons','Improves the AP of each Melee Weapon on the Unit by 1. Example: AP -1 becomes AP -2.','TRUE','WEAPON_STAT','MELEE','AP','IMPROVE','1','8'],
              ['PLUS_1_D_MELEE','+1 D','+1 Damage','Melee - Weapon Stats','Melee Weapons','Adds 1 Damage to each Melee Weapon on the Unit.','TRUE','WEAPON_STAT','MELEE','D','ADD','1','9'],
              ['PLUS_5_PTS','+5 Pts','+5 Pts','Points','Unit','Changes the cost for each model in the unit.','FALSE','POINTS_PER_MODEL','UNIT','PTS','ADD','5','10'],
              ['PLUS_10_PTS','+10 Pts','+10 Pts','Points','Unit','Changes the cost for each model in the unit.','FALSE','POINTS_PER_MODEL','UNIT','PTS','ADD','10','11'],
              ['PLUS_20_PTS','+20 Pts','+20 Pts','Points','Unit','Changes the cost for each model in the unit.','FALSE','POINTS_PER_MODEL','UNIT','PTS','ADD','20','12'],
          ]
          with tag_path.open('w', encoding='utf-8', newline='') as f:
              csv.writer(f, lineterminator='\n').writerows([tag_header, *tag_rows])

          schema_path = root / 'data' / 'CSV_SCHEMA.csv'
          with schema_path.open(encoding='utf-8-sig', newline='') as f:
              reader = csv.DictReader(f)
              fieldnames = reader.fieldnames
              rows = list(reader)
          rows = [r for r in rows if not (r['Scope'] == 'universal' and r['File'] == 'Tag_Definitions.csv')]
          columns = [
              ('Tag_ID','YES','Stable unique Tag definition key.'),
              ('Display_Tag','YES','Exact visible Tag text shown in the application; weapon scope is carried by Category/Target, not an (M)/(R) suffix.'),
              ('Title','NO','Human-readable Tag title.'),
              ('Category','YES','Picker/runtime category such as Unit Stats, Melee - Weapon Stats, Range - Weapon Rules, or Points.'),
              ('Affects','NO','Human-readable scope summary.'),
              ('Description','NO','User-facing explanation of the Tag effect.'),
              ('Editable','YES','TRUE when the Tag can be selected/edited in roster UI.'),
              ('Effect_Type','YES','Structured effect family such as STAT, WEAPON_STAT, or POINTS_PER_MODEL.'),
              ('Target','YES','Structured scope such as UNIT, MELEE, or RANGE.'),
              ('Stat','NO','Structured characteristic such as M, W, A, S, AP, D, or PTS.'),
              ('Operation','YES','Structured operation such as ADD, IMPROVE, SET, or REMOVE.'),
              ('Value','NO','Machine-readable effect value.'),
              ('Sort_Order','YES','Canonical display order within the universal Tag library.'),
          ]
          for order, (column, required, notes) in enumerate(columns, start=1):
              rows.append({
                  'Scope':'universal',
                  'File':'Tag_Definitions.csv',
                  'Column_Order':str(order),
                  'Column_Name':column,
                  'Required':required,
                  'Ownership':'AUTHORITATIVE',
                  'Notes':notes,
              })
          with schema_path.open('w', encoding='utf-8', newline='') as f:
              writer = csv.DictWriter(f, fieldnames=fieldnames, lineterminator='\n')
              writer.writeheader()
              writer.writerows(rows)
          PY

      - name: Regenerate manifests
        run: python3 scripts/data_schema.py manifest

      - name: Commit data changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- data
          if git diff --cached --quiet; then
            echo "No change"
            exit 0
          fi
          git commit -m "Update universal tag library"
          git push
