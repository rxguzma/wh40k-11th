name: Schema V1 Migration

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/schema-v1-migration.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply migration
        run: python3 scripts/migrate_schema_v1.py

      - name: Normalize schema
        run: python3 scripts/data_schema.py normalize

      - name: Audit references
        run: python3 scripts/audit_references.py

      - name: Validate data
        run: python3 scripts/data_schema.py validate

      - name: Build manifests
        run: python3 scripts/data_schema.py manifest

      - name: Commit migrated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- data
          if git diff --cached --quiet; then
            echo "No migration changes"
            exit 0
          fi
          git commit -m "Normalize CSV schema and reference data"
          git push
