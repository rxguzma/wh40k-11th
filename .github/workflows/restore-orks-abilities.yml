name: Restore Orks Abilities

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/restore-orks-abilities.yml'

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore Abilities.csv and refresh manifest
        run: |
          python3 <<'PY'
          import csv
          from pathlib import Path
          import subprocess

          good = '2e8a4e8cd608838729f66d3271e25dd550ac35a0'
          raw = subprocess.check_output(['git', 'show', f'{good}:data/orks/Abilities.csv'])
          path = Path('data/orks/Abilities.csv')
          path.write_bytes(raw)

          with path.open(encoding='utf-8', newline='') as f:
              rows = list(csv.reader(f))
          header = rows[0]
          idx = {name: i for i, name in enumerate(header)}

          def cell(row, name):
              return row[idx[name]] if len(row) > idx[name] else ''

          def set_cell(row, name, value):
              while len(row) <= idx[name]:
                  row.append('')
              row[idx[name]] = value

          ids = [cell(row, 'Ability_ID') for row in rows[1:]]
          for row in rows[1:]:
              if cell(row, 'Ability_ID') != 'COMPOSITION_BEAST_SNAGGA_BOYZ':
                  continue
              set_cell(row, 'Short_Description', '1-2 Nobs (W 3, 6++) + 9-18 Boys (W 1). Optional Thump Gun per 10.')
              set_cell(row, 'Long_Description', 'UNIT COMPOSITION: 1-2 Nob models, 9-18 Beast Snagga Boy models.\n\nBeast Snagga Boy: W 1. Nob: W 3, invulnerable save 6+.\n\nEvery Nob is equipped with: 1 Power Snappa; 1 Slugga. Every Beast Snagga Boy is equipped with: 1 Choppa; 1 Slugga.\n\nWARGEAR OPTIONS: For every 10 models in this unit, 1 Beast Snagga Boy model can be equipped with 1 Thump Gun.')
              set_cell(row, 'Order', '9')

          if 'COMPOSITION_BOYZ' not in ids:
              new = [''] * len(header)
              set_cell(new, 'Ability_ID', 'COMPOSITION_BOYZ')
              set_cell(new, 'Ability Name', 'Unit Composition (Boyz)')
              set_cell(new, 'Short_Description', '1-2 Nobs (W 3) + 9-18 Boys (W 1).')
              set_cell(new, 'Long_Description', 'UNIT COMPOSITION: 1-2 Nob models, 9-18 Boy models.\n\nBoy: W 1. Nob: W 3.\n\nEvery Nob is equipped with: 1 Kustom Choppa; 1 Kombi-skorcha.\n\nEvery Boy is equipped with: 1 Choppa; 1 Shoota; 1 Slugga.')
              set_cell(new, 'Order', '9')
              placed = False
              kept = [header]
              for row in rows[1:]:
                  kept.append(row)
                  if cell(row, 'Ability_ID') == 'COMPOSITION_BEAST_SNAGGA_BOYZ':
                      kept.append(new)
                      placed = True
              if not placed:
                  kept.append(new)
              rows = kept

          with path.open('w', encoding='utf-8', newline='') as f:
              csv.writer(f, lineterminator='\n').writerows(rows)
          print('restored', path, 'rows', len(rows) - 1)
          PY
          python3 scripts/data_schema.py manifest
          rm -f .github/workflows/restore-orks-abilities.yml

      - name: Commit restored abilities
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- data/orks/Abilities.csv data/orks/manifest.json .github/workflows/restore-orks-abilities.yml
          if git diff --cached --quiet; then
            echo "No change"
            exit 0
          fi
          git commit -m "Restore Orks Abilities.csv from last good revision and record Nob W3"
          git push
