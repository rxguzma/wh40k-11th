<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>Np1.32</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Roboto:wght@700&display=swap');
:root{--bg:#0f1115;--card:#171a21;--border:#2c313a;--btn:#2b313b;--btnborder:#48515f;--green:#1f5b35;--greenborder:#2e7d49;--grid:#9ecbff;--text:#f1f3f4;--secondary:#c4c7c5;--muted:#9aa0a6;--cell:26px;--std:24px;--gap:2px;--radius:6px;--title:20px;--body:14px;--meta:12px}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:Arial,sans-serif;-webkit-tap-highlight-color:transparent}body{padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom);overflow-x:hidden}
.draft-grid{display:grid;grid-template-columns:repeat(16,var(--cell));grid-auto-rows:var(--cell);width:max-content;margin:0 auto;border-top:1px solid rgba(158,203,255,.25);border-left:1px solid rgba(158,203,255,.25);background:var(--bg);isolation:isolate}
.grid-cell{position:relative;z-index:100;width:var(--cell);height:var(--cell);border-right:1px solid rgba(158,203,255,.25);border-bottom:1px solid rgba(158,203,255,.25);pointer-events:none}.col-coordinate,.row-coordinate{position:absolute;z-index:101;color:var(--grid);opacity:.5;font-size:var(--meta);font-weight:700;line-height:1;user-select:none;pointer-events:none}.col-coordinate{top:4px;left:50%;transform:translateX(-50%)}.row-coordinate{left:4px;bottom:4px}
.button-standard{width:calc(100% - var(--gap));height:var(--std);padding:0 10px;border:1px solid var(--btnborder);border-radius:var(--radius);background:var(--btn);color:var(--text);font-family:Roboto,Arial,sans-serif;font-size:12px;font-weight:700;line-height:1;display:inline-flex;align-items:center;justify-content:center;white-space:nowrap}.button-standard.active-green{background:var(--green);border-color:var(--greenborder)}
.top-header-shell{grid-column:1/span 16;grid-row:1/span 5;z-index:2;border:1px solid var(--border);border-radius:12px;background:var(--card)}.top-roster-name{grid-column:2/span 7;grid-row:2;z-index:3;display:flex;align-items:center;min-width:0;color:var(--text);font:900 var(--title)/1 Roboto,Arial,sans-serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.top-detachments{grid-column:2/span 9;grid-row:3;z-index:3;display:flex;align-items:center;min-width:0;color:var(--muted);font:700 var(--body)/1 Roboto,Arial,sans-serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.top-summary{grid-column:2/span 9;grid-row:4;z-index:3;display:flex;align-items:center;gap:6px;min-width:0;font:700 var(--meta)/1 Roboto,Arial,sans-serif;white-space:nowrap;overflow:hidden}.top-summary-disposition{color:#80d6a3}.top-summary-rest{color:var(--muted)}
.top-mode-buttons{grid-column:11/span 6;grid-row:2/span 2;z-index:4;display:grid;grid-template-columns:repeat(3,calc(var(--cell)*2));align-items:center;justify-items:center}.top-mode-buttons .button-standard,.top-main-button{height:calc((var(--cell)*2) - var(--gap))}.top-main-button{grid-column:11/span 2;grid-row:4/span 2;z-index:4;align-self:center;justify-self:center}.phase-buttons{grid-column:2/span 15;grid-row:6;z-index:3;display:grid;grid-template-columns:repeat(5,calc(var(--cell)*3));align-items:center;justify-items:center}
.view-stat-header{grid-column:10/span 6;grid-row:8;z-index:3;display:grid;grid-template-columns:repeat(6,var(--cell));background:var(--card);border-top:1px solid var(--border);border-bottom:1px solid var(--border)}.view-stat-label{height:var(--cell);display:flex;align-items:center;justify-content:center;border-left:1px solid var(--border);color:var(--text);font:900 var(--body)/1 Roboto,Arial,sans-serif}.view-stat-label:first-child{border-left:0}
.view-unit-row,.edit-unit-row{grid-column:1/span 16;z-index:3;display:grid;grid-template-columns:repeat(16,var(--cell));height:var(--cell);align-items:center;background:var(--card);border-bottom:1px solid var(--border)}.view-unit-row-first{grid-row:9}.view-unit-row-second{grid-row:10}.edit-unit-row-first{grid-row:9}.edit-unit-row-second{grid-row:10}.view-unit-name,.edit-unit-name{grid-column:1/span 5;height:var(--cell);min-width:0;padding-left:8px;display:flex;align-items:center;overflow:hidden;white-space:nowrap;color:var(--text);font:900 var(--body)/1 Roboto,Arial,sans-serif}.unit-count-grid{grid-column:6/span 2;width:calc(100% - var(--gap));height:var(--std);justify-self:center;border:1px solid var(--btnborder);border-radius:var(--radius);background:var(--btn);color:#80d6a3;font:900 var(--body)/1 Roboto,Arial,sans-serif;display:flex;align-items:center;justify-content:center;white-space:nowrap}
.view-unit-stat{height:var(--cell);display:flex;align-items:center;justify-content:center;border-left:1px solid var(--border);color:var(--text);font:700 var(--body)/1 Roboto,Arial,sans-serif;text-align:center;white-space:nowrap}.view-unit-stat.sv-value{font-size:var(--meta)}.s1{grid-column:10}.s2{grid-column:11}.s3{grid-column:12}.s4{grid-column:13}.s5{grid-column:14}.s6{grid-column:15}
.edit-action{width:var(--std);height:var(--std);padding:0;justify-self:center;border:1px solid var(--muted);border-radius:50%;background:transparent;color:var(--secondary);font:900 var(--body)/1 Roboto,Arial,sans-serif;display:inline-flex;align-items:center;justify-content:center}.a1{grid-column:10}.a2{grid-column:11}.a3{grid-column:12}.a4{grid-column:13}.a5{grid-column:14}.a6{grid-column:15}.edit-action-copy svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2}.edit-unit-points{grid-column:16;justify-self:center;color:var(--text);font:700 var(--body)/1 Roboto,Arial,sans-serif}
.sample-button-standard{grid-column:2/span 3;grid-row:24;z-index:3;align-self:center;justify-self:center}.sample-button-green{grid-column:2/span 2;grid-row:25;z-index:3;align-self:center;justify-self:center;background:var(--green);border-color:var(--greenborder)}.font-sample{grid-column:2/span 8;z-index:3;display:flex;align-items:center;color:var(--text);font-family:Roboto,Arial,sans-serif;font-weight:700;white-space:nowrap}.font-sample-title{grid-row:26;font-size:var(--title)}.font-sample-body{grid-row:27;font-size:var(--body)}.font-sample-meta{grid-row:28;font-size:var(--meta)}
.version-bar{width:min(416px,100%);margin:8px auto 0;padding:8px;display:grid;grid-template-columns:1fr auto auto;gap:6px;align-items:center;border:1px solid var(--border);background:var(--card)}.version-label{min-width:0;font-size:var(--body);font-weight:900}.version-button{min-width:72px;height:40px;padding:0 10px;border:1px solid var(--btnborder);border-radius:8px;background:var(--btn);color:var(--text);font:900 13px Arial,sans-serif;display:inline-flex;align-items:center;justify-content:center}.version-button:disabled{opacity:.5}
</style>
</head>
<body>
<main id="grid" class="draft-grid" aria-label="View page layout grid"></main>
<div class="version-bar"><div class="version-label">Np1.32</div><button id="updateButton" class="version-button" type="button">Update</button><button id="downloadButton" class="version-button" type="button">Download</button></div>
<script>
const NP_VERSION='1.32',RAW_ROOT='https://raw.githubusercontent.com/rxguzma/wh40k-11th/main/',INDEX_PATH='np/index.json',grid=document.getElementById('grid'),letters='ABCDEFGHIJKLMNOP';
function addGridCells(f){for(let r=1;r<=30;r++)for(let c=1;c<=16;c++){const x=document.createElement('div');x.className='grid-cell';x.style.gridColumn=c;x.style.gridRow=r;if(r===1){const s=document.createElement('span');s.className='col-coordinate';s.textContent=letters[c-1];x.appendChild(s)}if(c===1){const s=document.createElement('span');s.className='row-coordinate';s.textContent=r;x.appendChild(s)}f.appendChild(x)}}
function addPageNavigation(f,p){const m=document.createElement('div');m.className='top-mode-buttons';[['view','VIEW'],['edit','EDIT'],['cards','CARDS']].forEach(([t,l])=>{const b=document.createElement('button');b.type='button';b.className='button-standard'+(p===t?' active-green':'');b.textContent=l;b.onclick=()=>renderPage(t);m.appendChild(b)});f.appendChild(m);const b=document.createElement('button');b.type='button';b.className='button-standard top-main-button'+(p==='main'?' active-green':'');b.textContent='MAIN';b.onclick=()=>renderPage('main');f.appendChild(b)}
function addViewHeader(f){const sh=document.createElement('div');sh.className='top-header-shell';f.appendChild(sh);const n=document.createElement('div');n.className='top-roster-name';n.textContent='Winning ORKS';f.appendChild(n);const d=document.createElement('div');d.className='top-detachments';d.textContent='Bully Boyz - Da Big Hunt - Wreckas';f.appendChild(d);const s=document.createElement('div');s.className='top-summary';const a=document.createElement('span');a.className='top-summary-disposition';a.textContent='Priority Assets';const z=document.createElement('span');z.className='top-summary-rest';z.textContent='- 1995 pts - 10 VPs';s.append(a,z);f.appendChild(s);const ph=document.createElement('div');ph.className='phase-buttons';['COMMAND','MOVE','SHOOT','CHARGE','FIGHT'].forEach(l=>{const b=document.createElement('button');b.type='button';b.className='button-standard';b.textContent=l;ph.appendChild(b)});f.appendChild(ph)}
function addViewStatHeader(f){const h=document.createElement('div');h.className='view-stat-header';['M"','T','SV','W','LD','OC'].forEach(l=>{const x=document.createElement('div');x.className='view-stat-label';x.textContent=l;h.appendChild(x)});f.appendChild(h)}
function addNameAndCount(r,name,count,nameClass){const n=document.createElement('div');n.className=nameClass;n.textContent=name;r.appendChild(n);if(count){const c=document.createElement('div');c.className='unit-count-grid';c.textContent=count;r.appendChild(c)}}
function addViewUnit(f,rowClass,name,count,stats){const r=document.createElement('div');r.className='view-unit-row '+rowClass;addNameAndCount(r,name,count,'view-unit-name');stats.forEach((v,i)=>{const x=document.createElement('div');x.className='view-unit-stat s'+(i+1)+(i===2?' sv-value':'');x.textContent=v;r.appendChild(x)});f.appendChild(r)}
function addEditUnit(f,rowClass,name,count,pts){const r=document.createElement('div');r.className='edit-unit-row '+rowClass;addNameAndCount(r,name,count,'edit-unit-name');const menu=document.createElement('button');menu.type='button';menu.className='edit-action a1';menu.textContent='≡';r.appendChild(menu);const cp=document.createElement('button');cp.type='button';cp.className='edit-action edit-action-copy a2';cp.setAttribute('aria-label','Copy');cp.innerHTML='<svg viewBox="0 0 16 16" aria-hidden="true"><rect x="5" y="5" width="9" height="9" rx="1"></rect><rect x="2" y="2" width="9" height="9" rx="1"></rect></svg>';r.appendChild(cp);[['0','a3'],['E','a4'],['R','a5'],['D','a6']].forEach(([l,c])=>{const b=document.createElement('button');b.type='button';b.className='edit-action '+c;b.textContent=l;r.appendChild(b)});const p=document.createElement('div');p.className='edit-unit-points';p.textContent=pts;r.appendChild(p);f.appendChild(r)}
function renderPage(p){grid.replaceChildren();grid.setAttribute('aria-label',p[0].toUpperCase()+p.slice(1)+' page layout grid');const f=document.createDocumentFragment();addGridCells(f);addPageNavigation(f,p);if(p==='view'){addViewHeader(f);addViewStatHeader(f);addViewUnit(f,'view-unit-row-first','Nazdreg','',['5"','7','2+/5++','8','6+','1']);addViewUnit(f,'view-unit-row-second','Meganobz','x5',['5"','6','2+/5++','3','7+','1'])}if(p==='edit'){addViewHeader(f);addEditUnit(f,'edit-unit-row-first','Nazdreg','','175');addEditUnit(f,'edit-unit-row-second','Meganobz','x5','185')}if(p==='main'){const b=document.createElement('button');b.type='button';b.className='button-standard sample-button-standard';b.textContent='BUTTON';f.appendChild(b);const g=document.createElement('button');g.type='button';g.className='button-standard sample-button-green';g.textContent='GREEN';f.appendChild(g);[['font-sample font-sample-title','20PX ROBOTO'],['font-sample font-sample-body','14PX ROBOTO'],['font-sample font-sample-meta','12PX ROBOTO']].forEach(([c,t])=>{const x=document.createElement('div');x.className=c;x.textContent=t;f.appendChild(x)})}grid.appendChild(f)}
renderPage('view');
function versionFile(v){return `Np${v}.html`}async function fetchText(path){const c=new AbortController(),t=setTimeout(()=>c.abort(),15000);try{const r=await fetch(`${RAW_ROOT}${path}?t=${Date.now()}`,{cache:'no-store',credentials:'omit',signal:c.signal});if(!r.ok)throw new Error(`HTTP ${r.status}`);return await r.text()}finally{clearTimeout(t)}}
async function updateToLatest(){const b=document.getElementById('updateButton'),o=b.textContent;b.disabled=true;b.textContent='Checking';try{const i=JSON.parse(await fetchText(INDEX_PATH)),l=String(i.latest||'').trim();if(!l)throw new Error('Missing latest version');if(l===NP_VERSION){b.textContent='Current';setTimeout(()=>{b.textContent=o;b.disabled=false},900);return}const h=await fetchText(versionFile(l));if(!h.includes(`const NP_VERSION='${l}'`)&&!h.includes(`const NP_VERSION = '${l}'`))throw new Error('Version mismatch');window.location.href=URL.createObjectURL(new Blob([h],{type:'text/html'}))}catch(_){b.textContent='Retry';b.disabled=false}}
async function downloadRunningVersion(){const b=document.getElementById('downloadButton'),o=b.textContent;b.disabled=true;b.textContent='Preparing';try{const n=versionFile(NP_VERSION),h=await fetchText(n),f=new File([h],n,{type:'text/html'});if(navigator.share&&navigator.canShare&&navigator.canShare({files:[f]})){b.textContent='Save';try{await navigator.share({files:[f],title:n})}catch(e){if(e&&e.name==='AbortError'){b.textContent=o;b.disabled=false;return}throw e}}else{const u=URL.createObjectURL(f),a=document.createElement('a');a.href=u;a.download=n;a.rel='noopener';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),30000)}b.textContent='Done';setTimeout(()=>{b.textContent=o;b.disabled=false},900)}catch(_){b.textContent='Retry';b.disabled=false}}
document.getElementById('updateButton').onclick=updateToLatest;document.getElementById('downloadButton').onclick=downloadRunningVersion;
</script>
</body>
</html>
